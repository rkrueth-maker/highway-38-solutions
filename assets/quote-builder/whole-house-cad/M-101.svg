uivalent design required.</text><text x="1130" y="530" class="tiny" text-anchor="start">2. Verify equipment capacity, static pressure, and controls.</text><text x="1130" y="580" class="tiny" text-anchor="start">3. Coordinate ducts with framing, lights, plumbing, and access.</text><text x="1130" y="630" class="tiny" text-anchor="start">4. Maintain manufacturer service clearances and condensate protection.</text><text x="1130" y="680" class="tiny" text-anchor="start">5. Final penetrations, combustion, ventilation, and permits by licensed designer.</text><text x="70" y="875" class="tiny" text-anchor="start">1. Supply/return routes, thermostat, AHU-1, ERV-1, and CU-1 are anchored to the coordinated architectural-underlay.</text><text x="70" y="896" class="tiny" text-anchor="start">2. MECHANICAL EQUIPMENT PAD / SERVICE CLEARANCE and final Manual J/S/D selections require licensed mechanical design.</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><rect x="1160" y="845" width="495" height="210" rx="0" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Ground-Up New-House Construction</text><text x="1445" y="870" class="tb" text-anchor="start">SHEET</text><text x="1540" y="895" class="sheetno" text-anchor="middle">M-101</text><text x="1175" y="940" class="tbhead" text-anchor="start">HVAC Distribution &amp; Equipment Plan</text><text x="1175" y="958" class="tb" text-anchor="start">Scale: 1/4″ = 1′-0″</text><text x="1175" y="976" class="tb" text-anchor="start">Licensed Mechanical Design Required</text><text x="1445" y="940" class="tb" text-anchor="start">REVISION</text><text x="1540" y="9