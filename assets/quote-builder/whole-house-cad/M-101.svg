"tiny" text-anchor="middle">S8</text><path d="M735.0 706.0 H1045" class="duct"/><rect x="522.0" y="398.0" width="56" height="24" rx="0" class="filllight"/><text x="550.0" y="414.0" class="tiny" text-anchor="middle">R1</text><path d="M1000.0 632.0 H550.0 V410.0" class="return"/><rect x="802.0" y="548.0" width="56" height="24" rx="0" class="filllight"/><text x="830.0" y="564.0" class="tiny" text-anchor="middle">R2</text><path d="M1000.0 632.0 H830.0 V560.0" class="return"/><rect x="1075" y="671.0" width="30" height="60" rx="0" class="filllight"/><text x="1090" y="705.0" class="tiny" text-anchor="middle">CU-1</text><path d="M1000.0 600.0 H1075 V701.0" class="hidden"/><circle cx="800.0" cy="435.0" r="13" class="bubble"/><text x="800.0" y="439.0" class="tbhead" text-anchor="middle">T</text><rect x="1110" y="135" width="470" height="350" rx="0" class="inner"/><text x="1130" y="165" class="tbhead" text-anchor="start">EQUIPMENT / AIR DEVICE SCHEDULE</text><line x1="1110" y1="187" x2="1580" y2="187" class="thin"/><text x="1130" y="205" class="tbhead" text-anchor="start">AHU-1</text><text x="1200" y="205" class="tiny" text-anchor="start">FURNACE / COIL</text><text x="1450" y="205" class="tiny" text-anchor="start">FINAL MANUAL J/S</text><line x1="1110" y1="239" x2="1580" y2="239" class="thin"/><text x="1130" y="257" class="tbhead" text-anchor="start">CU-1</text><text x="1200" y="257" class="tiny" text-anchor="start">CONDENSER</text><text x="1450" y="257" class="tiny" text-anchor="start">MATCHED SYSTEM</text><line x1="1110" y1="291" x2="1580" y2="291" class="thin"/><text x="1130" y="309" class="tbhead" text-anchor="start">ERV-1</text><text x="1200" y="309" class="tiny" text-anchor="start">ENERGY RECOVERY VENT.</text><text x="1450" y="309" class="tiny" text-anchor="start">FINAL VENTILATION DESIGN</text><line x1="1110" y1="343" x2="1580" y2="343" class="thin"/><text x="1130" y="361" class="tbhead" text-anchor="start">S1–S8</text><text x="1200" y="361" class="tiny" text-anchor="start">SUPPLY REGISTERS</text><text x="1450" y="361" class="tiny" text-anchor="start">SIZE BY MANUAL D</text><line x1="1110" y1="395" x2="1580" y2="395" class="thin"/><text x="1130" y="413" class="tbhead" text-anchor="start">R1–R2</text><text x="1200" y="413" class="tiny" text-anchor="start">RETURN GRILLES</text><text x="1450" y="413" class="tiny" text-anchor="start">SIZE BY MANUAL D</text><rect x="1110" y="520" width="470" height="265" rx="0" class="inner"/><text x="1130" y="550" class="tbhead" text-anchor="start">HVAC COORDINATION NOTES</text><text x="1130" y="585" class="tiny" text-anchor="start">1. Complete Manual J, S, and D before equipment and duct release.</text><text x="1130" y="627" class="tiny" text-anchor="start">2. Keep trunks and branches within approved framing and soffit zones.</text><text x="1130" y="669" class="tiny" text-anchor="start">3. Coordinate bath exhaust, range hood, dryer exhaust, ERV, combustion air, condensate, and roof/wall penetrations.</text><text x="1130" y="711" class="tiny" text-anchor="start">4. Provide balancing dampers, access, firestopping, insulation, startup, and test records.</text><text x="70" y="875" class="tiny" text-anchor="start">1. Every register, return, equipment item, thermostat, condenser, and duct route is tied to the coordinated room/wall plan.</text><text x="70" y="896" class="tiny" text-anchor="start">2. Final capacities, duct sizes, routes, clearances, ventilation, exhaust, controls, and combustion requirements require licensed design.</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><rect x="1160" y="845" width="495" height="210" rx="0" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Ground-Up New-Home Construction</text><text x="1445" y="870" class="tb" text-anchor="start">SHEET</text><text x="1540" y="895" class="sheetno" text-anchor="middle">M-101</text><text x="1175" y="940" class="tbhead" text-anchor="start">HVAC Plan</text><text x="1175" y="958" class="tb" text-anchor="start">Scale: 1/4″ = 1′-0″</text><text x="1175" y="976" class="tb" text-anchor="start">Licensed HVAC Design Required</text><text x="1445" y="940" class="tb" text-anchor="start">REVISION</text><text x="1540" y="965" class="sheetno" text-anchor="middle">F</text><text x="1175" y="1010" class="tb" text-anchor="start">Prepared by H38 Quote Builder</text><text x="1175" y="1028" class="tb" text-anchor="start">Issue: 2026-07-25</text><text x="1445" y="1010" class="warn" text-anchor="start">NOT FOR CONSTRUCTION</text><text x="1445" y="1028" class="tb" text-anchor="start">Final design / permits required</text></svg>