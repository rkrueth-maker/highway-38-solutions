<text x="1130" y="550" class="tbhead" text-anchor="start">HVAC NOTES</text>
<text x="1130" y="585" class="tiny" text-anchor="start">1. Complete Manual J/S/D before equipment and duct release.</text>
<text x="1130" y="627" class="tiny" text-anchor="start">2. Keep trunks and branches within approved framing and soffit zones.</text>
<text x="1130" y="669" class="tiny" text-anchor="start">3. Coordinate exhaust, ERV, condensate, combustion air, and penetrations.</text>
<text x="1130" y="711" class="tiny" text-anchor="start">4. Provide dampers, access, insulation, firestopping, startup, and test records.</text><text x="1130" y="755" class="tiny" text-anchor="start">MECHANICAL EQUIPMENT PAD / SERVICE CLEARANCE</text>
<text x="70" y="875" class="tiny" text-anchor="start">1. All equipment, registers, returns, thermostat, and routes are tied to the architectural underlay.</text>
<text x="70" y="896" class="tiny" text-anchor="start">2. Final capacities, duct sizes, clearances, ventilation, controls, and permits require licensed design.</text>
