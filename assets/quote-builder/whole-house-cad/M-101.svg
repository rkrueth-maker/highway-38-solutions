etno{font:700 34px Arial}.warn{font:700 10px Arial;fill:#8c1d1d}.grid{fill:#fff;stroke:#111;stroke-width:1.4}.gridtxt{font:700 13px Arial}.window{stroke:#111;stroke-width:1.4}.hot{fill:none;stroke:#ba2b2b;stroke-width:2}.cold{fill:none;stroke:#16729e;stroke-width:2}.waste{fill:none;stroke:#444;stroke-width:3}.vent{fill:none;stroke:#444;stroke-width:1.2;stroke-dasharray:5 4}.duct{fill:none;stroke:#69468a;stroke-width:3}.return{fill:none;stroke:#69468a;stroke-width:2.5;stroke-dasharray:7 4}.power{fill:#fff;stroke:#111;stroke-width:1.2}.light{fill:#fff;stroke:#111;stroke-width:1.2}.grade{fill:none;stroke:#286a3e;stroke-width:2}.contour{fill:none;stroke:#777;stroke-width:1}.property{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:14 5}.setback{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:6 4}.concrete{fill:url(#concrete);stroke:#111}.wood{fill:url(#wood);stroke:#111}.earth{fill:url(#earth);stroke:#111}</style><rect x="25" y="25" width="1650" height="1050" class="border"/><rect x="45" y="45" width="1610" height="1010" class="inner"/><text x="70" y="75" class="title" text-anchor="start">M-101 — HVAC Distribution &amp; Equipment Plan</text><text x="70" y="97" class="sub" text-anchor="start">1/4″ = 1′-0″ · Licensed HVAC Review Required · REV D · REPRESENTATIVE / FIELD VERIFY</text><rect x="110" y="145" width="1120" height="620" class="outline"/><line x1="510" y1="145" x2="510" y2="765" class="outline"/><line x1="810" y1="145" x2="810" y2="765" class="outline"/><line x1="110" y1="445" x2="1230" y2="445" class="outline"/><rect x="595" y="600" width="120" height="95" class="outline"/><text x="655" y="640" class="tbhead" text-anchor="middle">AHU-1</text><text x="655" y="660" class="tiny" text-anchor="middle">96 MBH / 3 TON</text><path d="M655 600V230H1160" class="duct"/><path d="M655 265H340" class="duct"/><rect x="316" y="257" width="48" height="16" class="outline"/><path d="M655 505H340" class="duct"/><rect x="316" y="497" width="48" height="16" class="outline"/><path d="M655 265H630" class="duct"/><rect x="606" y="257" width="48" height="16" class="outline"/><path d="M655 505H630" class="duct"/><rect x="606" y="497" width="48" height="16" class="outline"/><path d="M655 265H930" class="duct"/><rect x="906" y="257" width="48" height="16" class="outline"/><path d="M655 505H930" class="duct"/><rect x="906" y="497" width="48" height="16" class="outline"/><path d="M655 305H1160" class="duct"/><rect x="1136" y="297" width="48" height="16" class="outline"/><path d="M655 565H1160" class="duct"/><rect x="1136" y="557" width="48" height="16" class="outline"/><path d="M655 695H930V645" class="return"/><rect x="905" y="630" width="50" height="30" class="outline"/><circle cx="780" cy="430" r="13" class="thin"/><text x="780" y="435" class="tbhead" text-anchor="middle">T</text><rect x="1280" y="145" width="300" height="350" class="inner"/><text x="1300" y="172" class="tbhead" text-anchor="start">EQUIPMENT SCHEDULE</text><line x1="1280" y1="189" x2="1580" y2="189" class="thin"/><text x="1295" y="205" class="tbhead" text-anchor="start">AHU-1</text><text x="1350" y="205" class="tiny" text-anchor="start">FURNACE / COIL</text><text x="1350" y="220" class="tiny" text-anchor="start">96 MBH / 3 TON</text><line x1="1280" y1="241" x2="1580" y2="241" class="thin"/><text x="1295" y="257" class="tbhead" text-anchor="start">CU-1</text><text x="1350" y="257" class="tiny" text-anchor="start">CONDENSER</text><text x="1350" y="272" class="tiny" text-anchor="start">3 TON</text><line x1="1280" y1="293" x2="1580" y2="293" class="thin"/><text x="1295" y="309" class="tbhead" text-anchor="start">ERV-1</text><text x="1350" y="309" class="tiny" text-anchor="start">ENERGY RECOVERY VENT.</text><text x="1350" y="324" class="tiny" text-anchor="start">150 CFM</text><line x1="1280" y1="345" x2="1580" y2="345" class="thin"/><text x="1295" y="361" class="tbhead" text-anchor="start">EF-1</text><text x="1350" y="361" class="tiny" text-anchor="start">BATH EXHAUST</text><text x="1350" y="376" class="tiny" text-anchor="start">110 CFM</text><line x1="1280" y1="397" x2="1580" y2="397" class="thin"/><text x="1295" y="413" class="tbhead" text-anchor="start">EF-2</text><text x="1350" y="413" class="tiny" text-anchor="start">RANGE HOOD</text><text x="1350" y="428" class="tiny" text-anchor="start">600 CFM MAX</text><rect x="1280" y="525" width="300" height="240" class="inner"/><text x="1300" y="552" class="tbhead" text-anchor="start">HVAC NOTES</text><text x="1300" y="580" class="tiny" text-anchor="start">1. Complete Manual J/S/D or equivalent.</text><text x="1300" y="608" class="tiny" text-anchor="start">2. Verify combustion air and venting.</text><text x="1300" y="636" class="tiny" text-anchor="start">3. Seal and insulate ducts per code.</text><text x="1300" y="664" class="tiny" text-anchor="start">4. Provide balancing dampers and access.</text><text x="1300" y="692" class="tiny" text-anchor="start">5. Record startup and balancing readings.</text><text x="1300" y="720" class="tiny" text-anchor="start">6. Coordinate exhaust makeup air.</text><text x="70" y="875" class="tiny" text-anchor="start">1. Final equipment, duct/register sizes, ventilation, exhaust, combustion air, controls, and clearances require licensed design.</text><text x="70" y="896" class="tiny" text-anchor="start">2. Coordinate framing, plumbing, electrical, cabinetry, ceiling conditions, access panels, and firestopping before rough-in.</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><rect x="1160" y="845" width="495" height="210" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Whole-House Renovation &amp; Property Improvement</text><text x="1445" y="870" class="tb" text-anchor="start">SHEET</text><text x="1540" y="895" class="sheetno" text-anchor="middle">M-101</text><text x="1175" y="940" class="tbhead" text-anchor="start">HVAC Distribution &amp; Equipment Plan</text><text x="1175" y="958" class="tb" text-anchor="start">Scale: 1/4″ = 1′-0″</text><text x="1175" y="976" class="tb" text-anchor="start">Licensed HVAC Review Required</text><text x="1445" y="940" class="tb" text-anchor="start">REVISION</text><text x="1540" y="965" class="sheetno" text-anchor="middle">D</text><text x="1175" y="1010" class="tb" text-anchor="start">Prepared by H38 Quote Builder</text><text x="1175" y="1028" class="tb" text-anchor="start">Issue: 2026-07-25</text><text x="1445" y="1010" class="warn" text-anchor="start">NOT FOR CONSTRUCTION</text><text x="1445" y="1028" class="tb" text-anchor="start">Field verification required</text></svg>