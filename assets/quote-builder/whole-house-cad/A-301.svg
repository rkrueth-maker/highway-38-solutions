"70" y="896" class="tiny" text-anchor="start">2. Structural modifications, deck ledger, headers, footings, guards, and openings require final engineering/code review.</text><text x="70" y="917" class="tiny" text-anchor="start">3. Maintain continuous air, water, vapor, thermal, and flashing control layers at all transitions.</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><rect x="1160" y="845" width="495" height="210" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Whole-House Renovation &amp; Property Improvement</text><text x="1445" y="870" class="tb" text-anchor="start">SHEET</text><text x="1540" y="895" class="sheetno" text-anchor="middle">A-301</text><text x="1175" y="940" class="tbhead" text-anchor="start">Building Sections &amp; Envelope Details</text><text x="1175" y="958" class="tb" text-anchor="start">Scale: 1/4″ = 1′-0″ / 1 1/2″ = 1′-0″</text><text x="1175" y="976" class="tb" text-anchor="start">Professional Review Required</text><text x="1445" y="940" class="tb" text-anchor="start">REVISION</text><text x="1540" y="965" class="sheetno" text-anchor="middle">D</text><text x="1175" y="1010" class="tb" text-anchor="start">Prepared by H38 Quote Builder</text><text x="1175" y="1028" class="tb" text-anchor="start">Issue: 2026-07-25</text><text x="1445" y="1010" class="warn" text-anchor="start">NOT FOR CONSTRUCTION</text><text x="1445" y="1028" class="tb" text-anchor="start">Field verification required</text></svg>