"/><polyline points="1080,535 1160,515 1240,535" class="outline"/><polyline points="1090,710 1160,735 1230,710" class="outline"/><line x1="1215" y1="540" x2="1285" y2="520" class="leader"/><text x="1295" y="524" class="tiny" text-anchor="start">HEAD FLASHING BEHIND WRB</text><line x1="1220" y1="705" x2="1285" y2="735" class="leader"/><text x="1245" y="755" class="tiny" text-anchor="end">SILL PAN + END DAMS</text><line x1="1100" y1="620" x2="1055" y2="620" class="leader"/><text x="1045" y="624" class="tiny" text-anchor="end">BACKER ROD + SEALANT</text><text x="1350" y="475" class="tbhead" text-anchor="start">DETAIL 3 — DECK LEDGER / FLASHING</text><rect x="1350" y="490" width="280" height="310" rx="0" class="inner"/><rect x="1385" y="545" width="38" height="175" rx="0" class="wood"/><rect x="1423" y="570" width="135" height="32" rx="0" class="wood"/><rect x="1423" y="642" width="175" height="28" rx="0" class="wood"/><polyline points="1415,555 1550,520" class="outline"/><rect x="1460" y="602" width="24" height="68" rx="0" class="outline"/><circle cx="1470" cy="585" r="6" class="thin"/><circle cx="1518" cy="585" r="6" class="thin"/><path d="M1423 560L1555 525L1565 540L1430 578Z" class="fillgray"/><line x1="1550" y1="525" x2="1605" y2="515" class="leader"/><text x="1615" y="519" class="tiny" text-anchor="end">CONTINUOUS METAL FLASHING</text><line x1="1518" y1="585" x2="1605" y2="575" class="leader"/><text x="1615" y="579" class="tiny" text-anchor="end">STRUCTURAL FASTENERS</text><line x1="1480" y1="655" x2="1605" y2="660" class="leader"/><text x="1615" y="664" class="tiny" text-anchor="end">JOIST HANGER / LEDGER</text><line x1="1420" y1="690" x2="1365" y2="735" class="leader"/><text x="1365" y="762" class="tiny" text-anchor="start">AIR / WATER SEAL</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><text x="70" y="875" class="tiny" text-anchor="start">1. Section assemblies are representative and must be reconciled with verified existing construction.</text><text x="70" y="895" class="tiny" text-anchor="start">2. Roof framing, headers, beams, foundations, deck ledger/footings, guards, stairs, and structural modifications require final engineering/code review.</text><text x="70" y="915" class="tiny" text-anchor="start">3. Maintain continuous drainage, air, vapor, thermal, flashing, and firestopping layers at all transitions.</text><rect x="1160" y="845" width="495" height="210" rx="0" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Ground-Up New-House Construction</text><text x="1445" y="870" class="tb" text-anchor="start">SHEET</text><text x="1540" y="895" class="sheetno" text-anchor="middle">A-301</text><text x="1175" y="940" class="tbhead" text-anchor="start">Building Sections &amp; Details</text><text x="1175" y="958" class="tb" text-anchor="start">Scale: 1/4″ = 1′-0″ / 1 1/2″ = 1′-0″</text><text x="1175" y="976" class="tb" text-anchor="start">Professional Review Required</text><text x="1445" y="940" class="tb" text-anchor="start">REVISION</text><text x="1540" y="965" class="sheetno" text-anchor="middle">E</text><text x="1175" y="1010" class="tb" text-anchor="start">Prepared by H38 Quote Builder</text><text x="1175" y="1028" class="tb" text-anchor="start">Issue: 2026-07-25</text><text x="1445" y="1010" class="warn" text-anchor="start">NOT FOR CONSTRUCTION</text><text x="1445" y="1028" class="tb" text-anchor="start">Field verification required</text></svg>