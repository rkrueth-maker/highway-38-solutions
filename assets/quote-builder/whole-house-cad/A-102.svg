1="580" x2="925" y2="652" class="ext"/><line x1="1535" y1="580" x2="1535" y2="652" class="ext"/><line x1="925" y1="652" x2="1535" y2="652" class="dimline"/><text x="1230" y="645" class="dim" text-anchor="middle">52′-0″ INCLUDING EAVES</text><line x1="925" y1="170" x2="870" y2="170" class="ext"/><line x1="925" y1="580" x2="870" y2="580" class="ext"/><line x1="870" y1="170" x2="870" y2="580" class="dimline"/><text x="863" y="375" class="dim" text-anchor="middle" transform="rotate(-90 863 375)">36′-0″ INCLUDING EAVES</text><rect x="925" y="650" width="610" height="135" class="inner"/><text x="945" y="675" class="tbhead" text-anchor="start">ROOF / UPPER-FLOOR NOTES</text><text x="945" y="700" class="tiny" text-anchor="start">• Verify truss/rafter framing, ventilation, insulation depth, and all penetrations.</text><text x="945" y="722" class="tiny" text-anchor="start">• Maintain code-required bedroom egress openings and guard/handrail clearances.</text><text x="945" y="744" class="tiny" text-anchor="start">• Coordinate plumbing vents, exhausts, flue, flashing, and roof drainage.</text><text x="70" y="875" class="tiny" text-anchor="start">1. Verify upper-floor layout, roof framing, attic access, and egress before final scope.</text><text x="70" y="896" class="tiny" text-anchor="start">2. Roof framing and assembly require manufacturer and code review.</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><rect x="1160" y="845" width="495" height="210" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Ground-Up New-House Construction</text><text x="1445" y="870" class="tb" text-anchor="star