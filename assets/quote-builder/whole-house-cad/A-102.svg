/text><text x="1150" y="645" class="tiny" text-anchor="start">3. Provide continuous load path and approved uplift connections.</text><text x="1150" y="675" class="tiny" text-anchor="start">4. Final roof drainage, flashing, snow/ice protection, and penetrations by approved details.</text><text x="70" y="875" class="tiny" text-anchor="start">1. Coordinate upper-floor bearing, stair opening, plumbing stacks, ducts, trusses, and roof penetrations.</text><text x="70" y="896" class="tiny" text-anchor="start">2. Final structural and energy design governs member sizes and assemblies.</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><rect x="1160" y="845" width="495" height="210" rx="0" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Ground-Up New-Home Construction</text><text x="1445" y="870" class="tb" text-anchor="start">SHEET</text><text x="1540" y="895" class="sheetno" text-anchor="middle">A-102</text><text x="1175" y="940" class="tbhead" text-anchor="start">Second Floor / Roof</text><text x="1175" y="958" class="tb" text-anchor="start">Scale: 1/4″ = 1′-0″ / 1/8″ = 1′-0″</text><text x="1175" y="976" class="tb" text-anchor="start">New Construction / Permit Coordination</text><text x="1445" y="940" class="tb" text-anchor="start">REVISION</text><text x="1540" y="965" class="sheetno" text-anchor="middle">F</text><text x="1175" y="1010" class="tb" text-anchor="start">Prepared by H38 Quote Builder</text><text x="1175" y="1028" class="tb" text-anchor="start">Issue: 2026-07-25</text><text x="1445" y="1010" class="warn" text-anchor="start">NOT FOR CONSTRUCTION</text><text x="1445" y="1028" class="tb" text-anchor="start">Final design / permits required</text></svg>