<text x="1130" y="620" class="tiny" text-anchor="start">1. Complete service/load calculation and utility coordination.</text>
<text x="1130" y="665" class="tiny" text-anchor="start">2. Coordinate AFCI/GFCI, grounding, bonding, smoke/CO, lighting controls, exterior loads, HVAC, appliances, and low voltage.</text>
<text x="1130" y="710" class="tiny" text-anchor="start">3. Final circuiting, conductor sizes, panel, devices, clearances, permits, and inspections by licensed electrician.</text>
<text x="70" y="875" class="tiny" text-anchor="start">1. Every light, switch, receptacle, panel, and circuit path is placed on or within the coordinated room and wall plan.</text>
<text x="70" y="896" class="tiny" text-anchor="start">2. Final service, load, circuit, conductor, grounding, device, lighting-control, and inspection requirements require licensed design.</text>
