lass="tiny" text-anchor="middle">S</text><circle cx="950" cy="550" r="8" class="power"/><text x="950" y="553" class="tiny" text-anchor="middle">S</text><path d="M995 650 H310 V300" class="circuit"/><path d="M995 650 H620 V300" class="circuit"/><path d="M995 650 H930 V300" class="circuit"/><path d="M995 650 H310 V680" class="circuit"/><path d="M995 650 H620 V600" class="circuit"/><path d="M995 650 H850 V680" class="circuit"/><path d="M995 650 H1020 V680" class="circuit"/><path d="M995 650 H210 V180" class="circuit"/><path d="M995 650 H850 V180" class="circuit"/><path d="M995 650 H1050 V740" class="circuit"/><text x="1120" y="135" class="tbhead" text-anchor="start">PANEL A — REPRESENTATIVE SCHEDULE</text><rect x="1110" y="150" width="490" height="330" rx="0" class="inner"/><text x="1130" y="180" class="tiny" text-anchor="start">1 — LIGHTING — MAIN</text><text x="1130" y="214" class="tiny" text-anchor="start">2 — LIGHTING — UPPER / EXTERIOR</text><text x="1130" y="248" class="tiny" text-anchor="start">3 — KITCHEN SMALL APPLIANCE A</text><text x="1130" y="282" class="tiny" text-anchor="start">4 — KITCHEN SMALL APPLIANCE B</text><text x="1130" y="316" class="tiny" text-anchor="start">5 — RANGE</text><text x="1130" y="350" class="tiny" text-anchor="start">6 — DISHWASHER / DISPOSAL</text><text x="1130" y="384" class="tiny" text-anchor="start">7 — LAUNDRY</text><text x="1130" y="418" class="tiny" text-anchor="start">8 — HVAC / WATER HEATER</text><text x="1120" y="515" class="tbhead" text-anchor="start">ELECTRICAL NOTES</text><rect x="1110" y="530" width="490" height="240" rx="0" class="inner"/><text x="1130" y="560" class="tiny" text-anchor="start">1. Verify service, load calculation, grounding, AFCI/GFCI, and code.</text><text x="1130" y="608" class="tiny" text-anchor="start">2. Coordinate lighting with cabinetry, framing, HVAC, and ceiling features.</text><text x="1130" y="656" class="tiny" text-anchor="start">3. Final device locations, conductor sizes, circuits, and permits by licensed electrician.</text><text x="1130" y="704" class="tiny" text-anchor="start">4. PANEL A and DEVICE WALL locations require field verification.</text><text x="70" y="875" class="tiny" text-anchor="start">1. Lights, switches, receptacles, PANEL A, service feed, and circuit paths are anchored to the coordinated architectural-underlay.</text><text x="70" y="896" class="tiny" text-anchor="start">2. KITCHEN SMALL APPLIANCE, RANGE, LIGHTING — MAIN, and all final circuit requirements require licensed electrical design.</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><rect x="1160" y="845" width="495" height="210" rx="0" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Ground-Up New-House Construction</text><text x="1445" y="870" class="tb" text-anchor="start">SHEET</text><text x="1540" y="895" class="sheetno" text-anchor="middle">E-101</text><text x="1175" y="940" class="tbhead" text-anchor="start">Lighting, Power &amp; Panel Schedule</text><text x="1175" y="958" class="tb" text-anchor="start">Scale: 1/4″ = 1′-0″</text><text x="1175" y="976" class="tb" text-anchor="start">Licensed Electrical Design Required</text><text x="1445" y="940" class="tb" text-anchor="start">REVISION</text><text x="1540" y="965" class="sheetno" text-anchor="middle">E</text><text x="1175" y="1010" class="tb" text-anchor="start">Prepared by H38 Quote Builder</text><text x="1175" y="1028" class="tb" text-anchor="start">Issue: 2026-07-28</text><text x="1445" y="1010" class="warn" text-anchor="start">NOT FOR CONSTRUCTION</text><text x="1445" y="1028" class="tb" text-anchor="start">Field verification r