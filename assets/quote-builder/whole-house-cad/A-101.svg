TES</text><circle cx="1230" cy="195" r="15" class="bubble"/><text x="1230" y="199" class="bubbletxt" text-anchor="middle">1</text><text x="1255" y="199" class="tiny" text-anchor="start">Exterior walls: 2×6 wood framing; final assembly by energy/structural design.</text><circle cx="1230" cy="243" r="15" class="bubble"/><text x="1230" y="247" class="bubbletxt" text-anchor="middle">2</text><text x="1255" y="247" class="tiny" text-anchor="start">Coordinate foundation, beams, bearing walls, stairs, and openings before framing release.</text><circle cx="1230" cy="291" r="15" class="bubble"/><text x="1230" y="295" class="bubbletxt" text-anchor="middle">3</text><text x="1255" y="295" class="tiny" text-anchor="start">Provide blocking for cabinets, rails, fixtures, equipment, exterior decks, and porch roof.</text><circle cx="1230" cy="339" r="15" class="bubble"/><text x="1230" y="343" class="bubbletxt" text-anchor="middle">4</text><text x="1255" y="343" class="tiny" text-anchor="start">Maintain code-required egress, stair width, landings, guards, and smoke/CO coverage.</text><circle cx="1230" cy="387" r="15" class="bubble"/><text x="1230" y="391" class="bubbletxt" text-anchor="middle">5</text><text x="1255" y="391" class="tiny" text-anchor="start">All room dimensions are representative; final dimensioned permit set governs.</text><rect x="1200" y="460" width="380" height="240" rx="0" class="inner"/><text x="1220" y="490" class="tbhead" text-anchor="start">DOOR / WINDOW SCHEDULE</text><line x1="1200" y1="507" x2="1580" y2="507" class="thin"/><text x="1220" y="525" class="tbhead" text-anchor="start">D1</text><text x="1200" y="525" class="tiny" text-anchor="start">3′-0″ × 6′-8″</text><text x="1405" y="525" class="tiny" text-anchor="start">INSULATED ENTRY</text><line x1="1200" y1="545" x2="1580" y2="545" class="thin"/><text x="1220" y="563" class="tbhead" text-anchor="start">D2</text><text x="1200" y="563" class="tiny" text-anchor="start">6′-0″ × 6′-8″</text><text x="1405" y="563" class="tiny" text-anchor="start">GLAZED PATIO</text><line x1="1200" y1="583" x2="1580" y2="583" class="thin"/><text x="1220" y="601" class="tbhead" text-anchor="start">W1</text><text x="1200" y="601" class="tiny" text-anchor="start">3′-0″ × 5′-0″</text><text x="1405" y="601" class="tiny" text-anchor="start">DOUBLE-HUNG</text><line x1="1200" y1="621" x2="1580" y2="621" class="thin"/><text x="1220" y="639" class="tbhead" text-anchor="start">W2</text><text x="1200" y="639" class="tiny" text-anchor="start">2′-6″ × 4′-0″</text><text x="1405" y="639" class="tiny" text-anchor="start">CASEMENT</text><text x="70" y="875" class="tiny" text-anchor="start">1. All dimensions are representative and require a final dimensioned permit set.</text><text x="70" y="896" class="tiny" text-anchor="start">2. The porch, rear deck, doors, windows, stairs, cabinets, fixtures, and room equipment are anchored to the coordinated building geometry.</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><rect x="1160" y="845" width="495" height="210" rx="0" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Ground-Up New-Home Construction</text><text x="1445" y="870" class="tb" text-anchor="start">SHEET</text><text x="1540" y="895" class="sheetno" text-anchor="middle">A-101</text><text x="1175" y="940" class="tbhead" text-anchor="start">Main-Floor Plan</text><text x="1175" y="958" class="tb" text-anchor="start">Scale: 1/4″ = 1′-0″</text><text x="1175" y="976" class="tb" text-anchor="start">New Construction / Permit Coordination</text><text x="1445" y="940" class="tb" text-anchor="start">REVISION</text><text x="1540" y="965" class="sheetno" text-anchor="middle">F</text><text x="1175" y="1010" class="tb" text-anchor="start">Prepared by H38 Quote Builder</text><text x="1175" y="1028" class="tb" text-anchor="start">Issue: 2026-07-25</text><text x="1445" y="1010" class="warn" text-anchor="start">NOT FOR CONSTRUCTION</text><text x="1445" y="1028" class="tb" text-anchor="start">Final design / permits required</text></svg>