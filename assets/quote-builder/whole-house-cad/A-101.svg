><text x="70" y="875" class="tiny" text-anchor="start">1. EXTERIOR WALL TYPE W1: 2×6 framing, sheathing, WRB, insulation, and siding — final assembly by approved design.</text><text x="70" y="896" class="tiny" text-anchor="start">2. Maintain 42″ minimum clear aisles and verify accessible clearances where required.</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><rect x="1160" y="845" width="495" height="210" rx="0" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Ground-Up New-House Construction</text><text x="1445" y="870" class="tb" text-anchor="start">SHEET</text><text x="1540" y="895" class="sheetno" text-anchor="middle">A-101</text><text x="1175" y="940" class="tbhead" text-anchor="start">Detailed Main-Floor Plan</text><text x="1175" y="958" class="tb" text-anchor="start">Scale: 1/4″ = 1′-0″</text><text x="1175" y="976" class="tb" text-anchor="start">Estimating / Field Layout</text><text x="1445" y="940" class="tb" text-anchor="start">REVISION</text><text x="1540" y="965" class="sheetno" text-anchor="middle">E</text><text x="1175" y="1010" class="tb" text-anchor="start">Prepared by H38 Quote Builder</text><text x="1175" y="1028" class="tb" text-anchor="start">Issue: 2026-07-28</text><text x="1445" y="1010" class="warn" text-anchor="start">NOT FOR CONSTRUCTION</text><text x="1445" y="1028" class="tb" text-anchor="start">Field verification required</text></svg>