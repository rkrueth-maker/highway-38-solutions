<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="17in" height="11in" viewBox="0 0 1700 1100" role="img"><title>G-001 General Notes, Drawing Index &amp; Symbols</title><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="5" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#111"/></marker><marker id="oa" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M8 1L1 4.5L8 8" fill="none" stroke="#111"/></marker><pattern id="concrete" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r="1"/><circle cx="13" cy="12" r="1"/><path d="M2 15l4-2M11 3l4-2" stroke="#666" stroke-width=".8"/></pattern><pattern id="wood" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 12L12 0M-3 3L3-3M9 15L15 9" stroke="#777" stroke-width=".7"/></pattern><pattern id="earth" width="18" height="12" patternUnits="userSpaceOnUse"><path d="M0 10Q5 2 10 10T20 10" fill="none" stroke="#777" stroke-width=".8"/></pattern></defs><style>.border{fill:#fff;stroke:#111;stroke-width:3}.inner{fill:none;stroke:#111;stroke-width:1}.cut{fill:#fff;stroke:#050505;stroke-width:5}.outline{fill:none;stroke:#111;stroke-width:2.2}.object{fill:none;stroke:#111;stroke-width:1.5}.thin{fill:none;stroke:#333;stroke-width:1}.ext{fill:none;stroke:#666;stroke-width:.75}.hidden{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:7 5}.center{fill:none;stroke:#777;stroke-width:.8;stroke-dasharray:13 4 2 4}.erase{stroke:#fff;stroke-width:11}.doorarc{fill:none;stroke:#555;stroke-width:1}.dimline{fill:none;stroke:#111;stroke-width:.8;marker-start:url(#oa);marker-end:url(#oa)}.leader{stroke:#111;stroke-width:1;marker-end:url(#arr)}.bubble{fill:#fff;stroke:#111;stroke-width:1.4}.bubbletxt{font:700 12px Arial}.txt{font:11px Arial}.tiny{font:8.5px Arial}.small{font:10px Arial}.dim{font:9px Arial}.room{font:700 13px Arial;letter-spacing:.04em}.title{font:700 20px Arial}.sub{font:11px Arial;fill:#333}.tb{font:9px Arial}.tbhead{font:700 12px Arial}.sheetno{font:700 34px Arial}.warn{font:700 10px Arial;fill:#8c1d1d}.grid{fill:#fff;stroke:#111;stroke-width:1.4}.gridtxt{font:700 13px Arial}.window{stroke:#111;stroke-width:1.4}.hot{fill:none;stroke:#ba2b2b;stroke-width:2}.cold{fill:none;stroke:#16729e;stroke-width:2}.waste{fill:none;stroke:#444;stroke-width:3}.vent{fill:none;stroke:#444;stroke-width:1.2;stroke-dasharray:5 4}.duct{fill:none;stroke:#69468a;stroke-width:3}.return{fill:none;stroke:#69468a;stroke-width:2.5;stroke-dasharray:7 4}.power{fill:#fff;stroke:#111;stroke-width:1.2}.light{fill:#fff;stroke:#111;stroke-width:1.2}.grade{fill:none;stroke:#286a3e;stroke-width:2}.contour{fill:none;stroke:#777;stroke-width:1}.property{fill:none;stroke:#111;stroke-width:2;stroke-dasharray:14 5}.setback{fill:none;stroke:#555;stroke-width:1;stroke-dasharray:6 4}.concrete{fill:url(#concrete);stroke:#111}.wood{fill:url(#wood);stroke:#111}.earth{fill:url(#earth);stroke:#111}</style><rect x="25" y="25" width="1650" height="1050" class="border"/><rect x="45" y="45" width="1610" height="1010" class="inner"/><text x="70" y="75" class="title" text-anchor="start">G-001 — General Notes, Drawing Index &amp; Symbols</text><text x="70" y="97" class="sub" text-anchor="start">N.T.S. · Estimating / Coordination · REV D · REPRESENTATIVE / FIELD VERIFY</text><text x="70" y="130" class="tbhead" text-anchor="start">DRAWING INDEX</text><rect x="70" y="145" width="720" height="405" class="inner"/><line x1="70" y1="145" x2="790" y2="145" class="thin"/><text x="88" y="171" class="tbhead" text-anchor="start">G-001</text><text x="180" y="171" class="txt" text-anchor="start">GENERAL NOTES, INDEX &amp; SYMBOLS</text><line x1="70" y1="185" x2="790" y2="185" class="thin"/><text x="88" y="211" class="tbhead" text-anchor="start">A-101</text><text x="180" y="211" class="txt" text-anchor="start">PROPOSED MAIN-FLOOR PLAN</text><line x1="70" y1="225" x2="790" y2="225" class="thin"/><text x="88" y="251" class="tbhead" text-anchor="start">A-102</text><text x="180" y="251" class="txt" text-anchor="start">SECOND-FLOOR &amp; ROOF PLAN</text><line x1="70" y1="265" x2="790" y2="265" class="thin"/><text x="88" y="291" class="tbhead" text-anchor="start">A-201</text><text x="180" y="291" class="txt" text-anchor="start">EXTERIOR ELEVATIONS — FOUR VIEWS</text><line x1="70" y1="305" x2="790" y2="305" class="thin"/><text x="88" y="331" class="tbhead" text-anchor="start">A-301</text><text x="180" y="331" class="txt" text-anchor="start">BUILDING SECTIONS &amp; ENVELOPE DETAILS</text><line x1="70" y1="345" x2="790" y2="345" class="thin"/><text x="88" y="371" class="tbhead" text-anchor="start">A-401</text><text x="180" y="371" class="txt" text-anchor="start">KITCHEN PLAN &amp; INTERIOR ELEVATIONS</text><line x1="70" y1="385" x2="790" y2="385" class="thin"/><text x="88" y="411" class="tbhead" text-anchor="start">M-101</text><text x="180" y="411" class="txt" text-anchor="start">HVAC DISTRIBUTION &amp; EQUIPMENT PLAN</text><line x1="70" y1="425" x2="790" y2="425" class="thin"/><text x="88" y="451" class="tbhead" text-anchor="start">P-101</text><text x="180" y="451" class="txt" text-anchor="start">PLUMBING PLAN, RISER &amp; FIXTURE SCHEDULE</text><line x1="70" y1="465" x2="790" y2="465" class="thin"/><text x="88" y="491" class="tbhead" text-anchor="start">E-101</text><text x="180" y="491" class="txt" text-anchor="start">LIGHTING, POWER &amp; PANEL SCHEDULE</text><line x1="70" y1="505" x2="790" y2="505" class="thin"/><text x="88" y="531" class="tbhead" text-anchor="start">C-S-L-101</text><text x="180" y="531" class="txt" text-anchor="start">SITE, DECK, CONCRETE, DRAINAGE &amp; LANDSCAPE</text><text x="850" y="130" class="tbhead" text-anchor="start">GENERAL NOTES</text><rect x="850" y="145" width="755" height="405" class="inner"/><circle cx="873" cy="169" r="15" class="bubble"/><text x="873" y="173" class="bubbletxt" text-anchor="middle">1</text><text x="895" y="173" class="tiny" text-anchor="start">Verify all dimensions, elevations, utilities, bearing conditions, and concealed conditions before fabrication or construction.</text><circle cx="873" cy="214" r="15" class="bubble"/><text x="873" y="218" class="bubbletxt" text-anchor="middle">2</text><text x="895" y="218" class="tiny" text-anchor="start">Do not scale drawings. Written dimensions govern. Resolve conflicts before proceeding.</text><circle cx="873" cy="259" r="15" class="bubble"/><text x="873" y="263" class="bubbletxt" text-anchor="middle">3</text><text x="895" y="263" class="tiny" text-anchor="start">Dimensions are to face of framing unless noted. Openings are rough openings unless labeled otherwise.</text><circle cx="873" cy="304" r="15" class="bubble"/><text x="873" y="308" class="bubbletxt" text-anchor="middle">4</text><text x="895" y="308" class="tiny" text-anchor="start">Provide permits, inspections, licensed trade design, engineering, and authority review where required.</text><circle cx="873" cy="349" r="15" class="bubble"/><text x="873" y="353" class="bubbletxt" text-anchor="middle">5</text><text x="895" y="353" class="tiny" text-anchor="start">Protect occupied areas, maintain egress, control dust, and photograph concealed work before covering.</text><circle cx="873" cy="394" r="15" class="bubble"/><text x="873" y="398" class="bubbletxt" text-anchor="middle">6</text><text x="895" y="398" class="tiny" text-anchor="start">Coordinate architecture, structure, HVAC, plumbing, electrical, cabinetry, finishes, and site work before release.</text><circle cx="873" cy="439" r="15" class="bubble"/><text x="873" y="443" class="bubbletxt" text-anchor="middle">7</text><text x="895" y="443" class="tiny" text-anchor="start">Approve product data, appliance cut sheets, shop drawings, equipment selections, and finish schedules before ordering.</text><circle cx="873" cy="484" r="15" class="bubble"/><text x="873" y="488" class="bubbletxt" text-anchor="middle">8</text><text x="895" y="488" class="tiny" text-anchor="start">These sheets demonstrate professional Quote Builder output and are not field-verified construction documents.</text><text x="70" y="595" class="tbhead" text-anchor="start">GRAPHIC LEGEND</text><rect x="70" y="610" width="720" height="190" class="inner"/><line x1="95" y1="645" x2="210" y2="645" class="cut"/><text x="230" y="649" class="txt" text-anchor="start">CUT / SECTIONED ELEMENT</text><line x1="95" y1="685" x2="210" y2="685" class="outline"/><text x="230" y="689" class="txt" text-anchor="start">VISIBLE EDGE / OBJECT</text><line x1="95" y1="725" x2="210" y2="725" class="hidden"/><text x="230" y="729" class="txt" text-anchor="start">HIDDEN / ABOVE / BELOW</text><line x1="95" y1="765" x2="210" y2="765" class="center"/><text x="230" y="769" class="txt" text-anchor="start">CENTERLINE / GRID</text><circle cx="500" cy="645" r="15" class="bubble"/><text x="500" y="649" class="bubbletxt" text-anchor="middle">A</text><text x="535" y="649" class="txt" text-anchor="start">GRID / KEYED NOTE</text><text x="850" y="595" class="tbhead" text-anchor="start">ABBREVIATIONS</text><rect x="850" y="610" width="755" height="190" class="inner"/><text x="875" y="642" class="txt" text-anchor="start">AFF — ABOVE FINISHED FLOOR</text><text x="875" y="673" class="txt" text-anchor="start">CL — CENTERLINE</text><text x="875" y="704" class="txt" text-anchor="start">EQ — EQUAL</text><text x="875" y="735" class="txt" text-anchor="start">F.V. — FIELD VERIFY</text><text x="875" y="766" class="txt" text-anchor="start">N.I.C. — NOT IN CONTRACT</text><text x="1235" y="642" class="txt" text-anchor="start">O.C. — ON CENTER</text><text x="1235" y="673" class="txt" text-anchor="start">R.O. — ROUGH OPENING</text><text x="1235" y="704" class="txt" text-anchor="start">TYP. — TYPICAL</text><text x="1235" y="735" class="txt" text-anchor="start">V.I.F. — VERIFY IN FIELD</text><text x="1235" y="766" class="txt" text-anchor="start">W/ — WITH</text><text x="70" y="875" class="tiny" text-anchor="start">1. Use this sheet with all architectural, trade, and site sheets.</text><text x="70" y="896" class="tiny" text-anchor="start">2. Final permit and construction documents require verified conditions and applicable licensed-professional review.</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><rect x="1160" y="845" width="495" height="210" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Whole-House Renovation &amp; Property Improvement</text><text x="1445" y="870" class="tb" text-anchor="start">SHEET</text><text x="1540" y="895" class="sheetno" text-anchor="middle">G-001</text><text x="1175" y="940" class="tbhead" text-anchor="start">General Notes, Drawing Index &amp; Symbols</text><text x="1175" y="958" class="tb" text-anchor="start">Scale: N.T.S.</text><text x="1175" y="976" class="tb" text-anchor="start">Estimating / Coordination</text><text x="1445" y="940" class="tb" text-anchor="start">REVISION</text><text x="1540" y="965" class="sheetno" text-anchor="middle">D</text><text x="1175" y="1010" class="tb" text-anchor="start">Prepared by H38 Quote Builder</text><text x="1175" y="1028" class="tb" text-anchor="start">Issue: 2026-07-25</text><text x="1445" y="1010" class="warn" text-anchor="start">NOT FOR CONSTRUCTION</text><text x="1445" y="1028" class="tb" text-anchor="start">Field verification required</text></svg>