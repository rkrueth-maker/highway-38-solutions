<rect x="25" y="25" width="1650" height="1050" rx="0" class="border"/><rect x="45" y="45" width="1610" height="1010" rx="0" class="inner"/><text x="70" y="75" class="title" text-anchor="start">G-001 — Project Definition, Drawing Index &amp; General Notes</text><text x="70" y="97" class="sub" text-anchor="start">N.T.S. · Ground-Up Construction Scope Control · REV F · REPRESENTATIVE / VERIFY BEFORE CONSTRUCTION</text><text x="70" y="130" class="tbhead" text-anchor="start">PROJECT DEFINITION — FIXED SCOPE</text><rect x="70" y="145" width="1530" height="155" rx="0" class="inner"/><circle cx="95" cy="178" r="15" class="bubble"/><text x="95" y="182" class="bubbletxt" text-anchor="middle">1</text><text x="122" y="182" class="small" text-anchor="start">GROUND-UP NEW-HOME CONSTRUCTION ON A VACANT / UNDEVELOPED LOT.</text><circle cx="95" cy="208" r="15" class="bubble"/><text x="95" y="212" class="bubbletxt" text-anchor="middle">2</text><text x="122" y="212" class="small" text-anchor="start">PROJECT BEGINS WITH SURVEY, EROSION CONTROL, LOT CLEARING, GRUBBING, TOPSOIL STRIPPING, AND ROUGH GRADING.</text><circle cx="95" cy="238" r="15" class="bubble"/><text x="95" y="242" class="bubbletxt" text-anchor="middle">3</text><text x="122" y="242" class="small" text-anchor="start">PROJECT CONTINUES THROUGH EXCAVATION, FOUNDATION, FRAMING, DRY-IN, ROUGH-INS, INSULATION, INTERIORS, SITE UTILITIES, FINAL GRADING, AND CLOSEOUT.</text><circle cx="95" cy="268" r="15" class="bubble"/><text x="95" y="272" class="bubbletxt" text-anchor="middle">4</text><text x="122" y="272" class="small" text-anchor="start">THIS IS NOT A RENOVATION, REMODEL, DEMOLITION-OF-EXISTING-HOUSE, OR PROPERTY-IMPROVEMENT PACKAGE.</text><text x="70" y="340" class="tbhead" text-anchor="start">DRAWING INDEX</text><rect x="70" y="355" width="760" height="420" rx="0" class="inner"/><line x1="70" y1="364" x2="830" y2="364" class="thin"/><text x="90" y="382" class="tbhead" text-anchor="start">G-001</text><text x="185" y="382" class="small" text-anchor="start">PROJECT DEFINITION, INDEX &amp; GENERAL NOTES</text><line x1="70" y1="402" x2="830" y2="402" class="thin"/><text x="90" y="420" class="tbhead" text-anchor="start">A-101</text><text x="185" y="420" class="small" text-anchor="start">PROPOSED MAIN-FLOOR PLAN</text><line x1="70" y1="440" x2="830" y2="440" class="thin"/><text x="90" y="458" class="tbhead" text-anchor="start">A-102</text><text x="185" y="458" class="small" text-anchor="start">SECOND-FLOOR &amp; ROOF PLAN</text><line x1="70" y1="478" x2="830" y2="478" class="thin"/><text x="90" y="496" class="tbhead" text-anchor="start">A-201</text><text x="185" y="496" class="small" text-anchor="start">EXTERIOR ELEVATIONS — FOUR VIEWS</text><line x1="70" y1="516" x2="830" y2="516" class="thin"/><text x="90" y="534" class="tbhead" text-anchor="start">A-301</text><text x="185" y="534" class="small" text-anchor="start">BUILDING SECTION &amp; CONSTRUCTION DETAILS</text><line x1="70" y1="554" x2="830" y2="554" class="thin"/><text x="90" y="572" class="tbhead" text-anchor="start">A-401</text><text x="185" y="572" class="small" text-anchor="start">KITCHEN PLAN &amp; CABINET ELEVATIONS</text><line x1="70" y1="592" x2="830" y2="592" class="thin"/><text x="90" y="610" class="tbhead" text-anchor="start">M-101</text><text x="185" y="610" class="small" text-anchor="start">HVAC PLAN ON ARCHITECTURAL UNDERLAY</text><line x1="70" y1="630" x2="830" y2="630" class="thin"/><text x="90" y="648" class="tbhead" text-anchor="start">P-101</text><text x="185" y="648" class="small" text-anchor="start">PLUMBING PLAN ON ARCHITECTURAL UNDERLAY</text><line x1="70" y1="668" x2="830" y2="668" class="thin"/><text x="90" y="686" class="tbhead" text-anchor="start">E-101</text><text x="185" y="686" class="small" text-anchor="start">ELECTRICAL PLAN ON ARCHITECTURAL UNDERLAY</text><line x1="70" y1="706" x2="830" y2="706" class="thin"/><text x="90" y="724" class="tbhead" text-anchor="start">C-S-L-101</text><text x="185" y="724" class="small" text-anchor="start">CLEARING, SITE, UTILITIES, GRADING &amp; LANDSCAPE</text><text x="880" y="340" class="tbhead" text-anchor="start">GENERAL COORDINATION NOTES</text><rect x="880" y="355" width="720" height="420" rx="0" class="inner"/><circle cx="905" cy="390" r="15" class="bubble"/><text x="905" y="394" class="bubbletxt" text-anchor="middle">1</text><text x="930" y="394" class="tiny" text-anchor="start">Use one coordinated building footprint and partition layout across architectural, HVAC, plumbing, and electrical sheets.</text><circle cx="905" cy="448" r="15" class="bubble"/><text x="905" y="452" class="bubbletxt" text-anchor="middle">2</text><text x="930" y="452" class="tiny" text-anchor="start">No symbol, fixture, register, device, cabinet, deck, roof, or utility may float without a wall, floor, grade, equipment, or route connection.</text><circle cx="905" cy="506" r="15" class="bubble"/><text x="905" y="510" class="bubbletxt" text-anchor="middle">3</text><text x="930" y="510" class="tiny" text-anchor="start">Verify survey, setbacks, soil, groundwater, frost depth, utility availability, septic/well requirements, and permit requirements before construction.</text><circle cx="905" cy="564" r="15" class="bubble"/><text x="905" y="568" class="bubbletxt" text-anchor="middle">4</text><text x="930" y="568" class="tiny" text-anchor="start">Final structural, energy, HVAC, plumbing, electrical, septic, well, and civil design requires applicable licensed-professional and authority review.</text><circle cx="905" cy="622" r="15" class="bubble"/><text x="905" y="626" class="bubbletxt" text-anchor="middle">5</text><text x="930" y="626" class="tiny" text-anchor="start">Do not scale drawings. Written dimensions and approved schedules govern.</text><circle cx="905" cy="680" r="15" class="bubble"/><text x="905" y="684" class="bubbletxt" text-anchor="middle">6</text><text x="930" y="684" class="tiny" text-anchor="start">Field verify and coordinate before ordering, excavation, rough-in, concealment, or inspection.</text><text x="70" y="875" class="tiny" text-anchor="start">1. This sheet is the controlling project-scope note for the demonstration.</text><text x="70" y="896" class="tiny" text-anchor="start">2. Any future drawing or quote that describes this project as renovation or remodeling is a release-blocking defect.</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><rect x="1160" y="845" width="495" height="210" rx="0" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Ground-Up New-Home Construction</text><text x="1445" y="870" class="tb" text-anchor="start">SHEET</text><text x="1540" y="895" class="sheetno" text-anchor="middle">G-001</text><text x="1175" y="940" class="tbhead" text-anchor="start">Project Definition / Index</text><text x="1175" y="958" class="tb" text-anchor="start">Scale: N.T.S.</text><text x="1175" y="976" class="tb" text-anchor="start">Ground-Up Construction Scope Control</text><text x="1445" y="940" class="tb" text-anchor="start">REVISION</text><text x="1540" y="965" class="sheetno" text-anchor="middle">F</text><text x="1175" y="1010" class="tb" text-anchor="start">Prepared by H38 Quote Builder</text><text x="1175" y="1028" class="tb" text-anchor="start">Issue: 2026-07-25</text><text x="1445" y="1010" class="warn" text-anchor="start">NOT FOR CONSTRUCTION</text><text x="1445" y="1028" class="tb" text-anchor="start">Final design / permits required</text></svg>