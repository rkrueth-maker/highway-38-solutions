<rect x="25" y="25" width="1650" height="1050" rx="0" class="border"/><rect x="45" y="45" width="1610" height="1010" rx="0" class="inner"/><text x="70" y="75" class="title" text-anchor="start">C-S-L-101 — Lot Clearing, Site Utilities, Grading &amp; Landscape Plan</text><text x="70" y="97" class="sub" text-anchor="start">1″ = 20′-0″ · Ground-Up Site Construction / Professional Review · REV F · REPRESENTATIVE / VERIFY BEFORE CONSTRUCTION</text><rect x="80" y="125" width="1050" height="650" rx="0" class="property"/><text x="605.0" y="810" class="dim" text-anchor="middle">120′-0″ REPRESENTATIVE LOT WIDTH</text><text x="45" y="450.0" class="dim" text-anchor="middle" transform="rotate(-90 45 450.0)">180′-0″ REPRESENTATIVE LOT DEPTH</text><rect x="160" y="190" width="890" height="525" rx="0" class="setback"/><rect x="190" y="215" width="830" height="475" rx="0" class="clearing"/><text x="205" y="237" class="small" text-anchor="start">LIMITS OF CLEARING / GRUBBING</text><line x1="190" y1="680" x2="1020" y2="680" class="silt"/><line x1="1020" y1="335" x2="1020" y2="680" class="silt"/><text x="870" y="670" class="tiny" text-anchor="start">SILT FENCE / SEDIMENT CONTROL</text><rect x="125" y="740" width="160" height="35" rx="0" class="fillgray"/><text x="205" y="763" class="tiny" text-anchor="middle">STABILIZED CONSTRUCTION ENTRANCE</text><rect x="445" y="345" width="420" height="280" rx="0" class="cut"/><text x="655.0" y="485.0" class="room" text-anchor="middle">48′ × 32′ HOUSE PAD / FOUNDATION</text><polyline points="205,740 205,700 390,700 390,485.0" class="outline"/><text x="305" y="690" class="tiny" text-anchor="start">TEMPORARY / FINAL DRIVEWAY</text><circle cx="280" cy="335" r="55" class="earth"/><text x="280" y="340" class="small" text-anchor="middle">TOPSOIL</text><text x="280" y="357" class="tiny" text-anchor="middle">STOCKPILE</text><rect x="250" y="485" width="150" height="90" rx="0" class="hidden"/><text x="325" y="530" class="tiny" text-anchor="middle">MATERIAL / EQUIPMENT STAGING</text><circle cx="960" cy="265" r="28" class="fixture"/><text x="960" y="269" class="tiny" text-anchor="middle">WELL</text><path d="M960 265 H865 V435" class="cold"/><rect x="830" y="580" width="180" height="90" rx="0" class="hidden"/><text x="920" y="625" class="small" text-anchor="middle">SEPTIC / DRAINFIELD</text><path d="M865 535 H830 V625" class="waste"/><circle cx="1010" cy="425" r="12" class="fixture"/><text x="1010" y="405" class="tiny" text-anchor="middle">ELECTRIC / COMM.</text><path d="M1010 425 H865 V485" class="hidden"/><line x1="445" y1="375" x2="350" y2="305" class="leader"/><line x1="865" y1="375" x2="960" y2="305" class="leader"/><line x1="445" y1="595" x2="350" y2="670" class="leader"/><line x1="865" y1="595" x2="960" y2="670" class="leader"/><text x="655.0" y="327" class="tiny" text-anchor="middle">ROUGH GRADE HIGH POINT / DRAIN AWAY FROM FOUNDATION</text><circle cx="210" cy="250" r="26" class="fixture"/><circle cx="210" cy="250" r="38" class="clearing"/><text x="210" y="254" class="tiny" text-anchor="middle">TREE</text><circle cx="180" cy="655" r="26" class="fixture"/><circle cx="180" cy="655" r="38" class="clearing"/><text x="180" y="659" class="tiny" text-anchor="middle">TREE</text><circle cx="1050" cy="225" r="26" class="fixture"/><circle cx="1050" cy="225" r="38" class="clearing"/><text x="1050" y="229" class="tiny" text-anchor="middle">TREE</text><circle cx="1065" cy="695" r="26" class="fixture"/><circle cx="1065" cy="695" r="38" class="clearing"/><text x="1065" y="699" class="tiny" text-anchor="middle">TREE</text><rect x="579.4" y="625" width="151.2" height="55" rx="0" class="wood"/><text x="655.0" y="657" class="tiny" text-anchor="middle">FRONT PORCH</text><rect x="865" y="420" width="75" height="130" rx="0" class="wood"/><text x="903" y="485" class="tiny" text-anchor="middle" transform="rotate(-90 903 485)">REAR DECK</text><rect x="1180" y="125" width="400" height="330" rx="0" class="inner"/><text x="1200" y="155" class="tbhead" text-anchor="start">GROUND-UP SITE CONSTRUCTION SEQUENCE</text><circle cx="1205" cy="185" r="15" class="bubble"/><text x="1205" y="189" class="bubbletxt" text-anchor="middle">1</text><text x="1230" y="189" class="tiny" text-anchor="start">Survey, stake property, setbacks, house, driveway, utilities, and clearing limits.</text><circle cx="1205" cy="217" r="15" class="bubble"/><text x="1205" y="221" class="bubbletxt" text-anchor="middle">2</text><text x="1230" y="221" class="tiny" text-anchor="start">Install construction entrance, erosion controls, tree protection, and sediment controls.</text><circle cx="1205" cy="249" r="15" class="bubble"/><text x="1205" y="253" class="bubbletxt" text-anchor="middle">3</text><text x="1230" y="253" class="tiny" text-anchor="start">Clear and grub only approved limits; remove stumps and unsuitable material.</text><circle cx="1205" cy="281" r="15" class="bubble"/><text x="1205" y="285" class="bubbletxt" text-anchor="middle">4</text><text x="1230" y="285" class="tiny" text-anchor="start">Strip and stockpile topsoil; rough grade access and house pad.</text><circle cx="1205" cy="313" r="15" class="bubble"/><text x="1205" y="317" class="bubbletxt" text-anchor="middle">5</text><text x="1230" y="317" class="tiny" text-anchor="start">Excavate foundation; manage groundwater; place footing/foundation/slab systems.</text><circle cx="1205" cy="345" r="15" class="bubble"/><text x="1205" y="349" class="bubbletxt" text-anchor="middle">6</text><text x="1230" y="349" class="tiny" text-anchor="start">Install well/septic or municipal services, electric/communications, and utility trenches.</text><circle cx="1205" cy="377" r="15" class="bubble"/><text x="1205" y="381" class="bubbletxt" text-anchor="middle">7</text><text x="1230" y="381" class="tiny" text-anchor="start">Backfill, compact, rough grade, build driveway/decks/flatwork, and route drainage.</text><circle cx="1205" cy="409" r="15" class="bubble"/><text x="1205" y="413" class="bubbletxt" text-anchor="middle">8</text><text x="1230" y="413" class="tiny" text-anchor="start">Replace topsoil, final grade, seed/landscape, remove temporary controls after stabilization, and close out.</text><rect x="1180" y="485" width="400" height="290" rx="0" class="inner"/><text x="1200" y="515" class="tbhead" text-anchor="start">SITE RELEASE HOLD POINTS</text><text x="1200" y="550" class="tiny" text-anchor="start">□ Verified survey / easements / setbacks</text><text x="1200" y="578" class="tiny" text-anchor="start">□ Approved erosion-control plan</text><text x="1200" y="606" class="tiny" text-anchor="start">□ Utility locates and service approvals</text><text x="1200" y="634" class="tiny" text-anchor="start">□ Soil, groundwater, frost, and bearing confirmation</text><text x="1200" y="662" class="tiny" text-anchor="start">□ Foundation inspection before backfill</text><text x="1200" y="690" class="tiny" text-anchor="start">□ Septic/well or municipal inspection</text><text x="1200" y="718" class="tiny" text-anchor="start">□ Compaction and drainage verification</text><text x="1200" y="746" class="tiny" text-anchor="start">□ Final stabilization and as-built closeout</text><text x="70" y="875" class="tiny" text-anchor="start">1. The project starts with survey, erosion control, stabilized access, lot clearing, grubbing, topsoil stripping, and rough grading before foundation work.</text><text x="70" y="896" class="tiny" text-anchor="start">2. Final civil, septic/well, utility, drainage, grading, driveway, deck, landscape, and erosion-control requirements require verified site data and applicable approvals.</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><rect x="1160" y="845" width="495" height="210" rx="0" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Ground-Up New-Home Construction</text><text x="1445" y="870" class="tb" text-anchor="start">SHEET</text><text x="1540" y="895" class="sheetno" text-anchor="middle">C-S-L-101</text><text x="1175" y="940" class="tbhead" text-anchor="start">Clearing / Site / Grading</text><text x="1175" y="958" class="tb" text-anchor="start">Scale: 1″ = 20′-0″</text><text x="1175" y="976" class="tb" text-anchor="start">Ground-Up Site Construction / Professional Review</text><text x="1445" y="940" class="tb" text-anchor="start">REVISION</text><text x="1540" y="965" class="sheetno" text-anchor="middle">F</text><text x="1175" y="1010" class="tb" text-anchor="start">Prepared by H38 Quote Builder</text><text x="1175" y="1028" class="tb" text-anchor="start">Issue: 2026-07-25</text><text x="1445" y="1010" class="warn" text-anchor="start">NOT FOR CONSTRUCTION</text><text x="1445" y="1028" class="tb" text-anchor="start">Final design / permits required</text></svg>