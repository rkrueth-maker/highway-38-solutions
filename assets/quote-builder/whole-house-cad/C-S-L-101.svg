"/><text x="70" y="75" class="title">C-S-L-101 — Site, Deck, Concrete, Drainage &amp; Landscape</text><text x="70" y="97" class="sub">1″ = 20′-0″ / 1/4″ = 1′-0″ · Field Layout / Professional Review Required · REV E · REPRESENTATIVE / FIELD VERIFY</text><rect x="80" y="140" width="900" height="600" rx="0" class="property"/><rect x="160" y="210" width="740" height="460" rx="0" class="setback"/><rect x="390" y="340" width="360" height="240" rx="0" class="cut"/><rect x="396" y="346" width="348" height="228" rx="0" class="outline"/><text x="570" y="455" class="tbhead" text-anchor="middle">48′ × 32′ HOUSE</text><rect x="510" y="280" width="240" height="60" rx="0" class="wood"/><text x="630" y="315" class="tiny" text-anchor="middle">16′ × 12′ REAR DECK</text><rect x="750" y="280" width="135" height="180" rx="0" class="concrete"/><text x="817" y="375" class="tiny" text-anchor="middle" transform="rotate(-90 817 375)">18′ × 24′ PATIO</text><rect x="500" y="580" width="240" height="55" rx="0" class="wood"/><text x="620" y="615" class="tiny" text-anchor="middle">COVERED FRONT PORCH</text><path d="M80 700 H300 V580 H500" class="outline"/><text x="120" y="690" class="tiny" text-anchor="start">STABILIZED CONSTRUCTION ENTRANCE / DRIVE</text><path d="M90 180 C280 145 450 215 620 180 S850 155 970 180" class="contour"/><text x="940" y="170" class="tiny" text-anchor="start">103</text><path d="M90 245 C280 210 450 280 620 245 S850 220 970 245" class="contour"/><text x="940" y="235" class="tiny" text-anchor="start">102</text><path d="M90 660 C280 625 450 695 620 660 S850 635 970 660" class="contour"/><text x="940" y="650" class="tiny" text-anchor="start">101</text><path d="M95 620 H390 V540" class="cold"/><text x="100" y="610" class="tiny" text-anchor="start">WATER</text><path d="M95 650 H390 V560" class="waste"/><text x="100" y="640" class="tiny" text-anchor="start">SANITARY</text><path d="M960 190 H750 V340" class="hidden"/><text x="820" y="180" class="tiny" text-anchor="start">ELECTRIC / COMM</text><g id="new-house-site-controls"><rect x="300" y="250" width="560" height="420" rx="0" class="hidden"/><text x="580" y="240" class="tbhead" text-anchor="middle">APPROVED CLEARING / DISTURBANCE LIMIT — STAKE BEFORE WORK</text><rect x="110" y="420" width="170" height="90" rx="0" class="hidden"/><text x="195" y="455" class="tiny" text-anchor="middle">TOPSOIL / MATERIAL</text><text x="195" y="478" class="tiny" text-anchor="middle">STOCKPILE — OUTSIDE</text><text x="195" y="500" class="tiny" text-anchor="middle">DRAINAGE PATH</text></g><line x1="1020" y1="200" x2="1020" y2="125" class="outline"/><polyline points="1020,125 1000,160 1040,160" class="outline"/><text x="1020" y="115" class="tbhead" text-anchor="middle">N</text><line x1="80" y1="740" x2="80" y2="780" class="ext"/><line x1="980" y1="740" x2="980" y2="780" class="ext"/><line x1="80" y1="780" x2="980" y2="780" class="dimline"/><text x="530.0" y="773" class="dim" text-anchor="middle">120′-0″ REPRESENTATIVE LOT WIDTH</text><line x1="80" y1="140" x2="45" y2="140" class="ext"/><line x1="80" y1="740" x2="45" y2="740" class="ext"/><line x1="45" y1="140" x2="45" y2="740" class="dimline"/><text x="38" y="440.0" class="dim" text-anchor="middle" transform="rotate(-90 38 440.0)">180′-0″ REPRESENTATIVE LOT DEPTH</text><rect x="1080" y="140" width="510" height="300" rx="0" class="inner"/><text x="1100" y="170" class="tbhead" text-anchor="start">DECK FRAMING PLAN — INSET</text><rect x="1130" y="205" width="360" height="175" rx="0" class="outline"/><line x1="1145" y1="205" x2="1145" y2="380" class="thin"/><line x1="1173" y1="205" x2="1173" y2="380" class="thin"/><line x1="1201" y1="205" x2="1201" y2="380" class="thin"/><line x1="1229" y1="205" x2="1229" y2="380" class="thin"/><line x1="1257" y1="205" x2="1257" y2="380" class="thin"/><line x1="1285" y1="205" x2="1285" y2="380" class="thin"/><line x1="1313" y1="205" x2="1313" y2="380" class="thin"/><line x1="1341" y1="205" x2="1341" y2="380" class="thin"/><line x1="1369" y1="205" x2="1369" y2="380" class="thin"/><line x1="1397" y1="205" x2="1397" y2="380" class="thin"/><line x1="1425" y1="205" x2="1425" y2="380" class="thin"/><line x1="1453" y1="205" x2="1453" y2="380" class="thin"/><line x1="1481" y1="205" x2="1481" y2="380" class="thin"/><line x1="1130" y1="205" x2="1490" y2="205" class="cut"/><line x1="1130" y1="375" x2="1490" y2="375" class="cut"/><circle cx="1180" cy="410" r="18" class="thin"/><circle cx="1310" cy="410" r="18" class="thin"/><circle cx="1440" cy="410" r="18" class="thin"/><text x="1310" y="400" class="tiny" text-anchor="middle">(3) 12″ DIA. MIN. FOOTINGS — FINAL BY DESIGN</text><rect x="1080" y="470" width="510" height="305" rx="0" class="inner"/><text x="1100" y="500" class="tbhead" text-anchor="start">SITE CLEARING / EARTHWORK NOTES</text><text x="1100" y="530" class="tiny" text-anchor="start">1. Verify property lines, easements, setbacks, grades, and utilities.</text><text x="1100" y="568" class="tiny" text-anchor="start">2. Call utility locating service before excavation.</text><text x="1100" y="606" class="tiny" text-anchor="start">3. Install erosion controls before clearing and maintain through stabilization.</text><text x="1100" y="644" class="tiny" text-anchor="start">4. Provide positive drainage away from foundation and deck/patio.</text><text x="1100" y="682" class="tiny" text-anchor="start">5. Final deck framing, footing, stair, guard, and lateral design required.</text><text x="1100" y="720" class="tiny" text-anchor="start">6. Restore disturbed lawn and protect retained trees.</text><text x="70" y="820" class="tiny" text-anchor="start">PHASE 1: erosion control → clearing/grubbing → rough grading → utilities → foundation access → final grading/landscape.</text><text x="70" y="875" class="tiny" text-anchor="start">1. Deck and patio are north/rear of the house, matching A-101 and A-201; stockpile and note areas do not overlap.</text><text x="70" y="896" class="tiny" text-anchor="start">2. Final survey, grading, drainage, concrete, deck, utility, and permit requirements require applicable professional review.</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><rect x="1160" y="845" width="495" height="210" rx="0" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Ground-Up New-House Construction</text><text x="1445" y="870" class="tb" text-anchor="start">SHEET</text><text x="1540" y="895" class="sheetno" text-anchor="middle">C-S-L-101</text><text x="1175" y="940" class="tbhead" text-anchor="start">Site, Deck, Concrete, Drainage &amp; Landscape</text><text x="1175" y="958" class="tb" text-anchor="start">Scale: 1″ = 20′-0″ / 1/4″ = 1′-0″</text><text x="1175" y="976" class="tb" text-anchor="start">Field Layout / Professional Review Required</text><text x="1445" y="940" class="tb" text-anchor="start">REVISION</text><text x="1540" y="965" class="sheetno" text-anchor="middle">E</text><text x="1175" y="1010" class="tb" text-anchor="start">Prepared by H38 Quote Builder</text><text x="1175" y="1028" class="tb" text-anchor="start">Issue: 2026-07-28</text><text x="1445" y="1010" class="warn" text-anchor="start">NOT FOR CONSTRUCTION</text><text x="1445" y="1028" class="tb" text-anchor="start">Field verification required</text></svg>