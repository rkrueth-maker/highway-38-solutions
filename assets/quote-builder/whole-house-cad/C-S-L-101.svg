xt x="38" y="450" class="dim" text-anchor="middle" transform="rotate(-90 38 450)">180′-0″ REPRESENTATIVE LOT DEPTH</text><rect x="1230" y="125" width="360" height="335" class="inner"/><text x="1250" y="152" class="tbhead" text-anchor="start">DECK FRAMING PLAN — INSET</text><rect x="1270" y="190" width="260" height="180" class="outline"/><line x1="1285" y1="190" x2="1285" y2="370" class="thin"/><line x1="1307" y1="190" x2="1307" y2="370" class="thin"/><line x1="1329" y1="190" x2="1329" y2="370" class="thin"/><line x1="1351" y1="190" x2="1351" y2="370" class="thin"/><line x1="1373" y1="190" x2="1373" y2="370" class="thin"/><line x1="1395" y1="190" x2="1395" y2="370" class="thin"/><line x1="1417" y1="190" x2="1417" y2="370" class="thin"/><line x1="1439" y1="190" x2="1439" y2="370" class="thin"/><line x1="1461" y1="190" x2="1461" y2="370" class="thin"/><line x1="1483" y1="190" x2="1483" y2="370" class="thin"/><line x1="1505" y1="190" x2="1505" y2="370" class="thin"/><line x1="1527" y1="190" x2="1527" y2="370" class="thin"/><line x1="1270" y1="190" x2="1530" y2="190" class="cut"/><line x1="1270" y1="365" x2="1530" y2="365" class="cut"/><circle cx="1300" cy="405" r="18" class="thin"/><circle cx="1400" cy="405" r="18" class="thin"/><circle cx="1500" cy="405" r="18" class="thin"/><text x="1400" y="390" class="tiny" text-anchor="middle">(3) 12″ DIA. MIN. FOOTINGS — FINAL BY DESIGN</text><rect x="1230" y="490" width="360" height="285" class="inner"/><text x="1250" y="517" class="tbhead" text-anchor="start">SITE CLEARING / EARTHWORK NOTES</text><text x="1250" y="548" class="tiny" text-anchor="start">1. Verify property lines, easements, setbacks, and utilities.</text><text x="1250" y="582" class="tiny" text-anchor="start">2. Call utility locating service before excavation.</text><text x="1250" y="616" class="tiny" text-anchor="start">3. Provide positive drainage away from foundation.</text><text x="1250" y="650" class="tiny" text-anchor="start">4. Final deck framing, footing, stair, guard, and lateral-load design required.</text><text x="1250" y="684" class="tiny" text-anchor="start">5. Coordinate downspouts, swales, patio slopes, and planting zones.</text><text x="1250" y="718" class="tiny" text-anchor="start">6. Restore disturbed lawn and protect existing trees.</text><text x="70" y="875" class="tiny" text-anchor="start">1. Replace representative lot, property, setback, grade, contour, and utility information with verified survey and utility data.</text><text x="70" y="896" class="tiny" text-anchor="start">2. Final deck, concrete reinforcement, drainage, and permit requirements require applicable professional/authority review.</text><line x1="45" y1="845" x2="1655" y2="845" class="outline"/><rect x="1160" y="845" width="495" height="210" class="inner"/><line x1="1160" y1="915" x2="1655" y2="915" class="inner"/><line x1="1430" y1="845" x2="1430" y2="1055" class="inner"/><line x1="1160" y1="985" x2="1655" y2="985" class="inner"/><text x="1175" y="870" class="tbhead" text-anchor="start">HIGHWAY 38 SOLUTIONS</text><text x="1175" y="889" class="tb" text-anchor="start">Universal Quote Builder Demonstration</text><text x="1175" y="906" class="tb" text-anchor="start">Ground-Up New-House Construction</text><text x="1445" y="870" class="tb" text-anchor="start">SHEET</text><text x="1540" y="895" class="sheetno" text-anchor="middle">C-S-L-101</text><text x="1175" y="940" class="tbhead" text-anchor="start">SITE CLEARING, EARTHWORK, UTILITIES, DRAINAGE & FINAL SITE</text><text x="1175" y="958" class="tb" text-anchor="start">Scale: 1″ = 20′-0″ / 1/4″ = 1′-0″</text><text x="1175" y="976" class="tb" text-anchor="start">Field Layout / Professional Review Required</text><text x="1445" y="940" class="tb" text-anchor="start">REVISION</text><text x="1540" y="965" class="sheetno" text-anchor="middle">E</text><text x="1175" y="1010" class="tb" text-anchor="start">Prepared by H38 Quote Builder</text><text x="1175" y="1028" class="tb" text-anchor="start">Issue: 