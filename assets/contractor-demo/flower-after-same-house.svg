      <ellipse cx="402" cy="509" rx="32" ry="52" fill="#2f6638" transform="rotate(-26 402 509)"/>
      <ellipse cx="468" cy="504" rx="30" ry="48" fill="#397940" transform="rotate(24 468 504)"/>
      <ellipse cx="580" cy="487" rx="70" ry="46" fill="url(#leaf)"/>
      <ellipse cx="552" cy="458" rx="34" ry="58" fill="#2e6a38" transform="rotate(-20 552 458)"/>
      <ellipse cx="615" cy="459" rx="34" ry="58" fill="#397c42" transform="rotate(20 615 459)"/>
      <ellipse cx="760" cy="482" rx="78" ry="48" fill="url(#leaf)"/>
      <ellipse cx="727" cy="449" rx="38" ry="62" fill="#2b6335" transform="rotate(-18 727 449)"/>
      <ellipse cx="798" cy="452" rx="38" ry="60" fill="#3b7d44" transform="rotate(20 798 452)"/>
      <ellipse cx="954" cy="490" rx="72" ry="45" fill="url(#leaf)"/>
      <ellipse cx="928" cy="458" rx="35" ry="58" fill="#2e6938" transform="rotate(-18 928 458)"/>
      <ellipse cx="986" cy="462" rx="34" ry="56" fill="#3a7b42" transform="rotate(17 986 462)"/>
    </g>

    <g filter="url(#plantShadow)">
