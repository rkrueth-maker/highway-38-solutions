<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Finished flower garden at the same house</title>
  <desc id="desc">The original gray-sided house and camera angle with a completed curved flower bed added along the foundation.</desc>
  <defs>
    <linearGradient id="mulch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d3824"/>
      <stop offset="0.55" stop-color="#3f2518"/>
      <stop offset="1" stop-color="#28160f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eee7db"/>
      <stop offset="0.55" stop-color="#c6b9a6"/>
      <stop offset="1" stop-color="#938571"/>
    </linearGradient>
    <radialGradient id="leaf" cx="40%" cy="30%" r="70%">
      <stop offset="0" stop-color="#5e9a42"/>
      <stop offset="1" stop-color="#204d2a"/>
    </radialGradient>
    <filter id="bedShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#10200f" flood-opacity="0.32"/>
    </filter>
    <filter id="plantShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#0f240f" flood-opacity="0.35"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="675" rx="0"/></clipPath>
    <g id="pinkFlower">
      <circle cy="-10" r="10" fill="#d94f76"/><circle cx="10" r="10" fill="#ec6f91"/><circle cy="10" r="10" fill="#d94f76"/><circle cx="-10" r="10" fill="#ec6f91"/><circle r="6" fill="#ffd85b"/>
    </g>
    <g id="yellowFlower">
      <circle cy="-9" r="9" fill="#ffd34a"/><circle cx="9" r="9" fill="#f3b91e"/><circle cy="9" r="9" fill="#ffd34a"/><circle cx="-9" r="9" fill="#f3b91e"/><circle r="5" fill="#6a4a16"/>
    </g>
    <g id="purpleFlower">
      <circle cy="-9" r="9" fill="#9258c8"/><circle cx="9" r="9" fill="#b17be0"/><circle cy="9" r="9" fill="#9258c8"/><circle cx="-9" r="9" fill="#b17be0"/><circle r="5" fill="#ffd86b"/>
    </g>
  </defs>
  <g clip-path="url(#frame)">
    <image x="0" y="0" width="1200" height="675" preserveAspectRatio="xMidYMid slice" href="flower-before.png?v=20260722-exact" xlink:href="flower-before.png?v=20260722-exact"/>
    <g filter="url(#bedShadow)">
      <path d="M300 545 C455 501 590 462 760 452 C940 441 1085 454 1200 425 L1200 675 L235 675 C238 615 255 573 300 545Z" fill="url(#mulch)"/>
      <path d="M289 546 C455 495 594 455 762 445 C938 434 1082 448 1205 418" fill="none" stroke="#6f6658" stroke-width="40" stroke-linecap="round"/>
      <path d="M289 542 C455 491 594 451 762 441 C938 430 1082 444 1205 414" fill="none" stroke="url(#edge)" stroke-width="27" stroke-linecap="round"/>
      <path d="M291 536 C458 486 597 446 766 436 C941 425 1080 439 1202 409" fill="none" stroke="#f5efe5" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
    </g>

    <g filter="url(#plantShadow)">
