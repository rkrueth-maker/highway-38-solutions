      <g transform="translate(525 500)"><use href="#yellowFlower"/><use href="#pinkFlower" transform="translate(42 -28) scale(.9)"/><use href="#purpleFlower" transform="translate(84 -5) scale(.85)"/><use href="#yellowFlower" transform="translate(55 35) scale(.78)"/></g>
      <g transform="translate(698 492)"><use href="#purpleFlower"/><use href="#pinkFlower" transform="translate(46 -32) scale(.92)"/><use href="#yellowFlower" transform="translate(95 -4) scale(.88)"/><use href="#pinkFlower" transform="translate(66 38) scale(.75)"/></g>
      <g transform="translate(895 503)"><use href="#yellowFlower"/><use href="#purpleFlower" transform="translate(44 -34) scale(.9)"/><use href="#pinkFlower" transform="translate(88 -5) scale(.86)"/><use href="#yellowFlower" transform="translate(58 35) scale(.75)"/></g>
      <g transform="translate(1045 486)"><use href="#pinkFlower"/><use href="#yellowFlower" transform="translate(43 -25) scale(.9)"/><use href="#purpleFlower" transform="translate(82 10) scale(.82)"/></g>
    </g>

    <g opacity="0.98" filter="url(#plantShadow)">
      <ellipse cx="342" cy="612" rx="42" ry="24" fill="#9c9487" transform="rotate(-8 342 612)"/><ellipse cx="342" cy="605" rx="31" ry="14" fill="#c4beb4" transform="rotate(-8 342 605)"/>
      <ellipse cx="660" cy="604" rx="35" ry="22" fill="#827c71" transform="rotate(12 660 604)"/><ellipse cx="660" cy="598" rx="25" ry="12" fill="#b7b0a5" transform="rotate(12 660 598)"/>
      <ellipse cx="1018" cy="596" rx="40" ry="23" fill="#918a7d" transform="rotate(-12 1018 596)"/><ellipse cx="1018" cy="590" rx="29" ry="13" fill="#c1baae" transform="rotate(-12 1018 590)"/>
    </g>
