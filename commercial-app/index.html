  <script>
  /* H38 Auto-Update: checks version.json on every load AND whenever the app
     returns to the foreground (pageshow / visibilitychange). If the server
     has a newer version than what this device last ran, force ONE
     cache-busting reload so updates reach customers without manual cache
     clears. The foreground re-check exists because a long-lived app instance
     (an installed PWA resumed from the background, a restored tab) may never
     perform a fresh navigation — without it such a client can sit on an old
     shell indefinitely (2026-10-11 Field Sync card; recurred 2026-10-13 with
     the card-top bands). Loop safety: the seen version is stored BEFORE the
     reload, and a per-session heal marker caps the reload at one per target
     version, so a client that still reads a stale version.json after the
     reload waits for the next session instead of looping. */
  (function(){
    var KEY='h38-app-version';
    var HEAL_KEY='h38-app-version-heal';
    var RESET_KEY='h38-app-version-reset';
    var lastRun=0;
    /* Stuck-client reset (2026-10-25): a client whose service worker wedged
       mid-install keeps serving the old build forever — update checks
       succeed, the new worker never activates, and competing registrations
       (register() was called with several different ?build= script URLs)
       keep the old worker in charge. Bookkeeping alone cannot cure that:
       this version check already recorded the new version while the old
       files kept serving. The cure that does not depend on the wedged
       worker is to unregister every registration and delete the app caches
       once per version, then reload — the next load fetches everything
       fresh and a single clean service worker installs in the background.
       Guarded by a per-version localStorage marker so it can never loop. */
    function resetStuckServiceWorker(done){
      /* Session preservation (2026-10-27, build 20261027-session-keep-1):
         an app update must NEVER sign the owner out. The reset below is
         specified to clear service workers and app caches only — the
         Supabase session lives in localStorage ('sb-*-auth-token'), which
         no step here deletes. To make that guarantee structural rather
         than incidental, snapshot the auth-token entries before the reset
         and restore any that are missing or changed before the reload, so
         even a future reset step that touches storage cannot strand the
         user on the sign-in page. */
      var savedAuth=[];
      try{
        for(var ai=0;ai<localStorage.length;ai++){
          var ak=localStorage.key(ai);
          if(ak&&/^sb-.*-auth-token(\.\d+)?$/.test(ak))savedAuth.push([ak,localStorage.getItem(ak)]);
        }
      }catch(e){}
      function restoreAuth(){
        try{
          for(var ri=0;ri<savedAuth.length;ri++){
            if(localStorage.getItem(savedAuth[ri][0])!==savedAuth[ri][1])localStorage.setItem(savedAuth[ri][0],savedAuth[ri][1]);
          }
        }catch(e){}
      }
      var finished=false;
      function finish(){ if(finished)return; finished=true; restoreAuth(); done(); }
      try{ setTimeout(finish,1500); }catch(e){ finish(); return; }
      try{
        var jobs=[];
        if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
          jobs.push(navigator.serviceWorker.getRegistrations().then(function(regs){
            var unregs=[];
            for(var i=0;i<regs.length;i++)unregs.push(regs[i].unregister());
            return Promise.all(unregs);
          }).catch(function(){}));
        }
        if(window.caches&&caches.keys){
          jobs.push(caches.keys().then(function(keys){
            var dels=[];
            for(var i=0;i<keys.length;i++){
              if(keys[i].indexOf('h38-business-office-')===0)dels.push(caches.delete(keys[i]));
            }
            return Promise.all(dels);
          }).catch(function(){}));
        }
        if(!jobs.length){ finish(); return; }
        Promise.all(jobs).then(finish).catch(finish);
      }catch(e){ finish(); }
    }
    function check(){
      var now=Date.now();
      if(now-lastRun<60000)return; /* throttle foreground re-checks */
      lastRun=now;
      try{
        var last=localStorage.getItem(KEY);
        var xhr=new XMLHttpRequest();
        xhr.open('GET','./version.json?_='+now,true);
        xhr.timeout=8000;
        xhr.onreadystatechange=function(){
          if(xhr.readyState!==4)return;
          try{
            if(xhr.status!==200)return;
            var v=JSON.parse(xhr.responseText).version;
            if(!v)return;
            if(last&&last!==v){
              localStorage.setItem(KEY,v);
              var healed=null;
              try{healed=sessionStorage.getItem(HEAL_KEY);}catch(e){}
              if(healed===v)return; /* already healed once this session */
              try{sessionStorage.setItem(HEAL_KEY,v);}catch(e){}
              var reloadFresh=function(){
                var u=window.location.href.split('#')[0];
                u+=(u.indexOf('?')>=0?'&':'?')+'_refresh='+Date.now();
                window.location.replace(u);
              };
              var resetFor=null;
              try{resetFor=localStorage.getItem(RESET_KEY);}catch(e){}
              if(resetFor!==v){
                try{localStorage.setItem(RESET_KEY,v);}catch(e){}
                resetStuckServiceWorker(reloadFresh);
              }else{
                reloadFresh();
              }
            }else if(!last){
              localStorage.setItem(KEY,v);
            }
          }catch(e){}
        };
        xhr.send();
      }catch(e){}
    }
    check();
    window.addEventListener('pageshow',check);
    document.addEventListener('visibilitychange',function(){if(!document.hidden)check();});
  })();
  </script>
  <script>
  /* H38 BusinessKey Authority (2026-10-11): the ?businessKey= URL parameter is
     the single source of truth for which business opens. When it is present,
     any stale h38-selected-business entries in localStorage are removed BEFORE
     any app script reads them. A cached selection from a previous business must
     never override the URL — this prevents cross-tenant data leaks. The auth
     bridge resolves the businessKey fresh and re-stores the correct selection. */
  (function(){
    try{
      var key='';
      try{key=String(new URLSearchParams(location.search).get('businessKey')||'').trim().toLowerCase();}catch(e){}
      if(!key)return;
      window.__H38_URL_BUSINESS_KEY=key;
      try{localStorage.removeItem('h38-selected-business');}catch(e){}
      try{
        var doomed=[];
        for(var i=0;i<localStorage.length;i++){
          var k=localStorage.key(i);
          if(k&&k.indexOf('h38-selected-business:')===0)doomed.push(k);
        }
        for(var j=0;j<doomed.length;j++){try{localStorage.removeItem(doomed[j]);}catch(e){}}
      }catch(e){}
    }catch(e){}
  })();
  </script>
