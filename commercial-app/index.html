  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2438">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Installable online and offline Highway 38 Business Office">
  <link rel="manifest" href="./manifest.webmanifest?build=20260803-1250">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?build=20260803-1250">
  <title>Highway 38 Business Office</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">H38</div><div><strong>Business Office</strong><small id="shellLabel">Full Business Office</small></div></div>
    <div class="top-actions">
      <span id="networkBadge" class="badge offline">Checking</span>
      <span id="syncBadge" class="badge neutral">0 pending</span>
      <button id="voiceButton" class="icon-button" type="button" aria-label="Talk to H38">🎙️</button>
      <button id="syncButton" class="icon-button" type="button" aria-label="Synchronize">↻</button>
    </div>
  </header>
  <section class="business-bar">
    <select id="businessSelect" aria-label="Business" hidden disabled><option value="">Select business</option></select>
    <button id="loadBusinessButton" type="button" hidden disabled>Open</button>
    <span id="businessStatus">Connecting securely…</span>
  </section>
  <div class="app-shell">
    <nav id="mainNav" class="main-nav" aria-label="Business Office navigation"></nav>
    <main id="mainContent" tabindex="-1"><section class="welcome"><h1>Opening Highway 38 Business Office…</h1><p>Checking your authorized business.</p><div class="welcome-actions"><a id="earlySecureSignInButton" class="primary" href="https://script.google.com/macros/s/AKfycbyY8cbfvGLzllw7rMhRY46wx_eIKhsK5oLlV6vIcDxDIKuCzX0_oTi4EyVufSxonLdxow/exec?bridge=1&amp;authorize=1" target="h38-secure-signin" rel="opener">Sign in securely</a><button id="earlyRetryButton" class="secondary" type="button">Retry connection</button></div></section></main>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <dialog id="reviewDialog"><form method="dialog"><h2>Review required</h2><div id="reviewBody"></div><div class="actions"><button value="cancel" class="secondary">Close</button></div></form></dialog>
  <iframe id="bridgeFrame" class="bridge-frame" title="Secure Google connection"></iframe>
  <script>
    window.H38_BUILD='20260803-1250';
    window.H38_SECURE_AUTH_BASE='https://script.google.com/macros/s/AKfycbyY8cbfvGLzllw7rMhRY46wx_eIKhsK5oLlV6vIcDxDIKuCzX0_oTi4EyVufSxonLdxow/exec?bridge=1&authorize=1';
    window.H38_BRIDGE_CHANNEL=(function(){
      var channel='';try{channel=sessionStorage.getItem('h38-secure-channel')||'';}catch(error){}
      if(!channel){try{channel=crypto.randomUUID();}catch(error){channel=Date.now()+'-'+Math.random().toString(36).slice(2);}try{sessionStorage.setItem('h38-secure-channel',channel);}catch(error){}}
      return channel;
    })();
    window.h38WithBridgeChannel=function(url){
      try{var target=new URL(url||window.H38_SECURE_AUTH_BASE,location.href);target.searchParams.set('bridge','1');target.searchParams.set('authorize','1');target.searchParams.set('channel',window.H38_BRIDGE_CHANNEL);return target.toString();}catch(error){return url||window.H38_SECURE_AUTH_BASE;}
    };
    window.H38_SECURE_AUTH_URL=window.h38WithBridgeChannel(window.H38_SECURE_AUTH_BASE);
    window.h38SecurePopup=null;
    window.h38OpenSecureWindow=function(url){
      if(window.h38SecurePopup&&!window.h38SecurePopup.closed){try{window.h38SecurePopup.focus();}catch(error){}return window.h38SecurePopup;}
      var target=window.h38WithBridgeChannel(url||window.H38_SECURE_AUTH_BASE),popup=null;target+=(target.indexOf('?')>=0?'&':'?')+'v='+Date.now();
      try{popup=window.open(target,'h38-secure-signin','popup=yes,width=520,height=720,resizable=yes,scrollbars=yes');}catch(error){}
      if(!popup)return null;
      window.h38SecurePopup=popup;try{popup.focus();}catch(error){}
      var status=document.getElementById('businessStatus');if(status)status.textContent='Secure sign-in window opened · waiting for authorized business.';
      return popup;
    };
    window.h38RunSecureSignIn=function(event){
      if(window.h38Authorize&&window.h38Authorize()){if(event)event.preventDefault();return false;}
      if(window.h38OpenSecureWindow()){if(event)event.preventDefault();return false;}
      return true;
    };
    var earlySecure=document.getElementById('earlySecureSignInButton');
    if(earlySecure){earlySecure.href=window.H38_SECURE_AUTH_URL;earlySecure.onclick=function(event){window.h38RunSecureSignIn(event);};}
    window.setTimeout(function(){
      var main=document.getElementById('mainContent');
      if(!main||!/Opening|Connecting|Checking/.test(main.textContent))return;
      main.innerHTML='<section class="welcome"><h1>Sign in to open Business Office</h1><p>The secure connection did not finish. Open secure sign-in. The Office will open as soon as your authorized business is returned to this tab.</p><div class="welcome-actions"><a id="watchdogSecureSignInButton" class="primary" href="'+window.H38_SECURE_AUTH_URL+'" target="h38-secure-signin" rel="opener">Sign in securely</a><button id="watchdogRetryButton" class="secondary" type="button">Retry connection</button></div></section>';
      document.getElementById('watchdogSecureSignInButton').onclick=function(event){window.h38RunSecureSignIn(event);};
      document.getElementById('watchdogRetryButton').onclick=function(){location.reload();};
    },12000);
  </script>
