  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2438">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Highway 38 Business Office">
  <link rel="manifest" href="./manifest.webmanifest?build=20260803-1405">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?build=20260803-1405">
  <title>Highway 38 Business Office</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">H38</div><div><strong>Business Office</strong><small id="shellLabel">Full Business Office</small></div></div>
    <div class="top-actions">
      <span id="networkBadge" class="badge offline">Checking</span>
      <span id="syncBadge" class="badge neutral">0 pending</span>
      <button id="voiceButton" class="icon-button" type="button" aria-label="Talk to H38">🎙️</button>
      <button id="syncButton" class="icon-button" type="button" aria-label="Synchronize">↻</button>
    </div>
  </header>
  <section class="business-bar">
    <select id="businessSelect" aria-label="Business" hidden disabled><option value="">Select business</option></select>
    <button id="loadBusinessButton" type="button" hidden disabled>Open</button>
    <span id="businessStatus">Connecting securely…</span>
  </section>
  <div class="app-shell">
    <nav id="mainNav" class="main-nav" aria-label="Business Office navigation"></nav>
    <main id="mainContent" tabindex="-1"><section class="welcome"><h1>Opening Highway 38 Business Office…</h1><p>Checking your authorized business in this tab.</p><div class="welcome-actions"><a id="earlySecureSignInButton" class="primary" href="/open-business-office.html" target="_top">Open secure Office</a><button id="earlyRetryButton" class="secondary" type="button">Retry connection</button></div></section></main>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <dialog id="reviewDialog"><form method="dialog"><h2>Review required</h2><div id="reviewBody"></div><div class="actions"><button value="cancel" class="secondary">Close</button></div></form></dialog>
  <iframe id="bridgeFrame" class="bridge-frame" title="Secure Google connection"></iframe>
  <script>
    window.H38_BUILD='20260803-1405';
    window.H38_EMBEDDED=new URLSearchParams(location.search).get('embedded')==='1';
    window.H38_BRIDGE_CHANNEL=(function(){
      var channel='';try{channel=sessionStorage.getItem('h38-secure-channel')||'';}catch(error){}
      if(!channel){try{channel=crypto.randomUUID();}catch(error){channel=Date.now()+'-'+Math.random().toString(36).slice(2);}try{sessionStorage.setItem('h38-secure-channel',channel);}catch(error){}}
      return channel;
    })();
    if(!window.H38_EMBEDDED){
      var status=document.getElementById('businessStatus');if(status)status.textContent='Opening secure Office in this tab…';
      Promise.resolve().then(async function(){
        try{
          if('serviceWorker' in navigator){var registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.filter(function(registration){return registration.scope.indexOf('/commercial-app/')>=0;}).map(function(registration){return registration.unregister();}));}
          if('caches' in window){var keys=await caches.keys();await Promise.all(keys.filter(function(key){return key.indexOf('h38-business-office-')===0;}).map(function(key){return caches.delete(key);}));}
        }catch(error){}
        window.location.replace('/open-business-office.html?from=commercial-app&build=20260803-1405');
      });
    }
  </script>
