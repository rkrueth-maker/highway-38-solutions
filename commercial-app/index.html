  <script>
  /* H38 Auto-Update: checks version.json on every load. If the server has a
     newer version than what this device last ran, force a cache-busting reload
     so updates reach customers without manual cache clears. */
  (function(){
    try{
      var KEY='h38-app-version';
      var last=localStorage.getItem(KEY);
      var xhr=new XMLHttpRequest();
      xhr.open('GET','./version.json?_='+Date.now(),true);
      xhr.timeout=8000;
      xhr.onreadystatechange=function(){
        if(xhr.readyState!==4)return;
        try{
          if(xhr.status!==200)return;
          var v=JSON.parse(xhr.responseText).version;
          if(!v)return;
          if(last&&last!==v){
            localStorage.setItem(KEY,v);
            var u=window.location.href.split('#')[0];
            u+=(u.indexOf('?')>=0?'&':'?')+'_refresh='+Date.now();
            window.location.replace(u);
          }else if(!last){
            localStorage.setItem(KEY,v);
          }
        }catch(e){}
      };
      xhr.send();
    }catch(e){}
  })();
  </script>

  <script>
  /* pdf-lib lazy-load: only needed for PDF generation (quotes, CPA package).
     Load on demand to avoid blocking initial page render. */
  window.H38PdfLibReady = new Promise(function(resolve){
    if(window.PDFLib){resolve(window.PDFLib);return;}
    var s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js';
    s.onload=function(){resolve(window.PDFLib);};
    s.onerror=function(){resolve(null);};
    // Load after initial render, not blocking
    if(document.readyState==='complete'){document.head.appendChild(s);}
    else{window.addEventListener('load',function(){document.head.appendChild(s);},{once:true});}
  });
  </script>
