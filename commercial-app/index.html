  <script>
  /* H38 Auto-Update: checks version.json on every load. If the server has a
     newer version than what this device last ran, force a cache-busting reload
     so updates reach customers without manual cache clears. */
  (function(){
    try{
      var KEY='h38-app-version';
      var last=localStorage.getItem(KEY);
      var xhr=new XMLHttpRequest();
      xhr.open('GET','./version.json?_='+Date.now(),true);
      xhr.timeout=8000;
      xhr.onreadystatechange=function(){
        if(xhr.readyState!==4)return;
        try{
          if(xhr.status!==200)return;
          var v=JSON.parse(xhr.responseText).version;
          if(!v)return;
          if(last&&last!==v){
            localStorage.setItem(KEY,v);
            var u=window.location.href.split('#')[0];
            u+=(u.indexOf('?')>=0?'&':'?')+'_refresh='+Date.now();
            window.location.replace(u);
          }else if(!last){
            localStorage.setItem(KEY,v);
          }
        }catch(e){}
      };
      xhr.send();
    }catch(e){}
  })();
  </script>
  <script>
  /* H38 BusinessKey Authority (2026-10-11): the ?businessKey= URL parameter is
     the single source of truth for which business opens. When it is present,
     any stale h38-selected-business entries in localStorage are removed BEFORE
     any app script reads them. A cached selection from a previous business must
     never override the URL — this prevents cross-tenant data leaks. The auth
     bridge resolves the businessKey fresh and re-stores the correct selection. */
  (function(){
    try{
      var key='';
      try{key=String(new URLSearchParams(location.search).get('businessKey')||'').trim().toLowerCase();}catch(e){}
      if(!key)return;
      window.__H38_URL_BUSINESS_KEY=key;
      try{localStorage.removeItem('h38-selected-business');}catch(e){}
      try{
        var doomed=[];
        for(var i=0;i<localStorage.length;i++){
          var k=localStorage.key(i);
          if(k&&k.indexOf('h38-selected-business:')===0)doomed.push(k);
        }
        for(var j=0;j<doomed.length;j++){try{localStorage.removeItem(doomed[j]);}catch(e){}}
      }catch(e){}
    }catch(e){}
  })();
  </script>
