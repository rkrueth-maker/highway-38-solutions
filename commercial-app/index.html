<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">H38</div><div><strong>Business Office</strong><small id="shellLabel">Full Business Office</small></div></div>
    <div class="top-actions">
      <span id="networkBadge" class="badge offline">Internet</span>
      <span id="gatewayBadge" class="badge offline">Sync offline</span>
      <span id="syncBadge" class="badge neutral">All saved</span>
      <button id="globalAiButton" class="ai-launcher" type="button" aria-label="Open H38 AI"><span aria-hidden="true">✨</span><span class="ai-launcher-label">H38 AI</span></button>
      <button id="voiceButton" class="icon-button" type="button" aria-label="Talk to H38">🎙️</button>
      <button id="syncButton" class="icon-button" type="button" aria-label="Synchronize">↻</button>
    </div>
  </header>
  <section class="business-bar">
    <select id="businessSelect" aria-label="Business" hidden disabled><option value="">Select business</option></select>
    <button id="loadBusinessButton" type="button" hidden disabled>Open</button>
    <span id="businessStatus">Opening securely…</span>
  </section>
  <div class="app-shell">
    <nav id="mainNav" class="main-nav" aria-label="Business Office navigation"></nav>
    <main id="mainContent" tabindex="-1"><section class="welcome"><h1>Opening Highway 38 Business Office…</h1><p>Reading the secure gateway handoff in this tab.</p><div class="welcome-actions"><a id="earlySecureSignInButton" class="primary" href="/open-business-office.html" target="_self">Open secure Office</a><button id="earlyRetryButton" class="secondary" type="button">Retry connection</button></div></section></main>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <dialog id="reviewDialog"><form method="dialog"><h2>Review required</h2><div id="reviewBody"></div><div class="actions"><button value="cancel" class="secondary">Close</button></div></form></dialog>
  <dialog id="globalAiDialog" class="ai-drawer" aria-label="H38 AI assistant"><div id="globalAiBody"></div></dialog>
  <iframe id="bridgeFrame" class="bridge-frame" title="Retired secure connection" hidden></iframe>
  <script>
