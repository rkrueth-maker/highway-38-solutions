# Intuit redirects into this function without a Supabase JWT. POST actions perform
# explicit Supabase session validation and the OAuth callback validates encrypted,
# short-lived tenant/user state before touching connection records.
[functions.h38-quickbooks-bridge]
verify_jwt = false

# Public booking intake. Anonymous access is intentional: customers have no
# H38 login. Tenant isolation and the owner-controlled on/off gate are enforced
# inside the function via business_module_settings (module_key online_booking).
[functions.h38-public-booking]
verify_jwt = false

# Public website helper. Anonymous access is intentional: website visitors
# have no H38 login. Answers are grounded in published site facts only, and
# per-session / per-IP / daily caps are enforced inside the function.
[functions.h38-site-helper]
verify_jwt = false

# First-party website traffic counts. Anonymous access is intentional: the
# public shell beacon posts one pageview per page load. The function sets
# no cookies, stores no raw IP addresses (daily-rotating salted hash only),
# records page path / referrer host / device class, rate-limits per
# visitor, and writes with the service role.
[functions.h38-site-analytics]
verify_jwt = false

# Recommended Vendors directory + partner application intake. Anonymous
# access is intentional for the public list and the application form; the
# member directory, the per-business on/off gate, and Ricky's application
# review are enforced inside the function (JWT + membership checks).
[functions.h38-vendor-directory]
verify_jwt = false
