[functions.h38-office-gateway]
verify_jwt = false

[functions.nlpm-office-gateway]
verify_jwt = false

[functions.h38-assistant-ai]
verify_jwt = true

# Quote AI validates the caller's Supabase session itself via the Auth REST
# API (direct-supabase-auth-rest) and must answer unauthenticated health and
# preflight checks with its own PASS/FAIL contract. The gateway must not
# reject requests before the function runs; every POST action still fails
# closed with the function's own 401 when the session is missing or invalid.
[functions.h38-quote-ai]
verify_jwt = false

[functions.h38-document-factory]
verify_jwt = true

[functions.nl-bouncie-fleet]
verify_jwt = false

# Intuit redirects into this function without a Supabase JWT. POST actions perform
# explicit Supabase session validation and the OAuth callback validates encrypted,
# short-lived tenant/user state before touching connection records.
[functions.h38-quickbooks-bridge]
verify_jwt = false

# Public booking intake. Anonymous access is intentional: customers have no
# H38 login. Tenant isolation and the owner-controlled on/off gate are enforced
# inside the function via business_module_settings (module_key online_booking).
[functions.h38-public-booking]
verify_jwt = false

# Public website helper. Anonymous access is intentional: website visitors
# have no H38 login. Answers are grounded in published site facts only, and
# per-session / per-IP / daily caps are enforced inside the function.
[functions.h38-site-helper]
verify_jwt = false

# First-party website traffic counts. Anonymous access is intentional: the
# public shell beacon posts one pageview per page load. The function sets
# no cookies, stores no raw IP addresses (daily-rotating salted hash only),
# records page path / referrer host / device class, rate-limits per
# visitor, and writes with the service role.
[functions.h38-site-analytics]
verify_jwt = false

# Recommended Vendors directory + partner application intake. Anonymous
# access is intentional for the public list and the application form; the
# member directory, the per-business on/off gate, and Ricky's application
# review are enforced inside the function (JWT + membership checks).
[functions.h38-vendor-directory]
verify_jwt = false

# Task completion for external recipients. Anonymous access is intentional:
# recipients have no H38 login. The per-task Completion Token (a high-entropy
# secret sent only to the recipient) grants exactly one capability: viewing
# and completing that one task. Rate-limited per IP inside the function.
[functions.h38-task-complete]
verify_jwt = false

# Public proof-of-service link. Anonymous access is intentional: customers
# have no H38 login. The per-route Proof Token grants exactly one capability:
# viewing a SANITIZED proof page for that one route (city only, never street
# addresses; photos only when already public/signed URLs). Expired/revoked
# tokens refuse. Rate-limited per IP inside the function.
[functions.h38-proof-link]
verify_jwt = false

# Review-request scheduler. Drains owner-approved, queued review-request SMS
# threads whose Deliver After time has passed. Self-authenticating: callers
# must present the x-h38-nightly-key header matching the 'h38-review-scheduler'
# row in h38_internal_job_secrets (401 without it), so verify_jwt stays false
# for its pg_cron caller (job 'h38-review-scheduler-10m', pg_net http_post,
# every 10 minutes) — same pattern as kit-proactive-engine.
[functions.h38-review-scheduler]
verify_jwt = false

# Owner notifications producer. Scans customer-activity + needs-review
# sources per business and writes owner/admin notification rows into
# business_records 'notifications'. Self-authenticating: the pg_cron
# caller (job 'h38-owner-notify-5m', pg_net http_post, every 5 minutes)
# must present the x-h38-nightly-key header matching the 'h38-owner-notify'
# row in h38_internal_job_secrets (401 without it); a signed-in
# owner/administrator JWT may also request a scan of their own business
# (panel "Check now"). verify_jwt stays false for the key-gated cron
# caller — same pattern as h38-review-scheduler / kit-proactive-engine.
[functions.h38-owner-notify]
verify_jwt = false

# Proactive Kit engine. Runs on schedule (cron), monitors each business for
# overdue quotes, late invoices, schedule gaps. Creates DRAFT follow-ups and
# approval tasks — never sends customer messages, never moves money.
# Self-authenticating: callers must present the x-h38-nightly-key header
# matching the 'kit-proactive-engine' row in h38_internal_job_secrets
# (401 without it), so verify_jwt stays false for the cron runner.
[functions.kit-proactive-engine]
verify_jwt = false

# Scout deal-alert push API. Self-authenticating per action: user actions
# validate the caller's Supabase session in code and scope to their
# coupon_household_members households; the pg_cron "check" action requires
# the x-h38-nightly-key header matching the 'scout-push' row in
# h38_internal_job_secrets. verify_jwt stays false so the cron caller and
# the service worker's unauthenticated delivery-receipt action can reach it.
[functions.h38-scout-push]
verify_jwt = false

# Scout push service worker script (GET only, serves the /functions/v1/
# scoped SW that displays deal-alert pushes). Public by design — a service
# worker script must be fetchable without credentials.
[functions.h38-scout-sw]
verify_jwt = false

[functions.business-drive-upload]
verify_jwt = false

[functions.business-drive-connect]
verify_jwt = false
