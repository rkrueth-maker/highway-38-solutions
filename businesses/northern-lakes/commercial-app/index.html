<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#113b2e">
  <meta http-equiv="refresh" content="0;url=https://rkrueth-maker.github.io/highway-38-solutions/commercial-app/?businessKey=northern-lakes">
  <title>Northern Lakes Business Office</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4efe5;color:#20221f;font:16px system-ui,sans-serif;text-align:center}.card{max-width:620px;padding:30px;background:#fff;border-radius:18px;border:1px solid #d8d0c4}.btn{display:inline-block;margin-top:16px;padding:12px 18px;border-radius:10px;background:#113b2e;color:#fff;text-decoration:none;font-weight:800}</style>
</head>
<body>
  <main class="card">
    <h1>Opening Northern Lakes Business Office</h1>
    <p>The old Office build is retired. Supabase is the only supported Business Office.</p>
    <a id="openOffice" class="btn" href="https://rkrueth-maker.github.io/highway-38-solutions/commercial-app/?businessKey=northern-lakes">Open current Office</a>
  </main>
  <script>
    (function(){
      var destination=new URL('https://rkrueth-maker.github.io/highway-38-solutions/commercial-app/');
      destination.searchParams.set('businessKey','northern-lakes');
      var incoming=new URLSearchParams(location.search);
      ['page','shell','businessId'].forEach(function(key){var value=(incoming.get(key)||'').trim();if(value)destination.searchParams.set(key,value);});
      document.getElementById('openOffice').href=destination.toString();
      location.replace(destination.toString());
    })();
  </script>
</body>
</html>
