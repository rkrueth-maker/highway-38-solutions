name: Verify Office control integrity

on:
  pull_request:
    paths:
      - 'commercial-app/**'
      - 'scripts/verify-office-control-integrity-browser.js'
      - '.github/workflows/verify-office-control-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'commercial-app/**'
      - 'scripts/verify-office-control-integrity-browser.js'
      - '.github/workflows/verify-office-control-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  office-control-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify desktop sidebar and visible controls
        run: node scripts/verify-office-control-integrity-browser.js
