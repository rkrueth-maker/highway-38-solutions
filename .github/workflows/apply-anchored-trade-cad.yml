name: Apply Anchored Trade CAD
on:
  pull_request:
    paths:
      - 'scripts/normalize-new-house-cad-groups.js'
      - '.github/workflows/apply-anchored-trade-cad.yml'
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-new-house-scope-cad
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/normalize-new-house-cad-groups.js
      - name: Validate and render
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils librsvg2-bin
          mkdir -p /tmp/anchored-cad
          for sheet in M-101 P-101 E-101 C-S-L-101; do
            xmllint --noout "assets/quote-builder/whole-house-cad/${sheet}.svg"
            rsvg-convert --width 1700 --height 1100 "assets/quote-builder/whole-house-cad/${sheet}.svg" -o "/tmp/anchored-cad/${sheet}.png"
          done
          node scripts/verify-professional-house-cad.js
      - name: Commit anchored sheets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/quote-builder/whole-house-cad/M-101.svg assets/quote-builder/whole-house-cad/P-101.svg assets/quote-builder/whole-house-cad/E-101.svg assets/quote-builder/whole-house-cad/C-S-L-101.svg
          git commit -m 'Anchor trade CAD objects to architectural geometry'
          git pull --rebase origin agent/fix-new-house-scope-cad
          git push origin HEAD:agent/fix-new-house-scope-cad