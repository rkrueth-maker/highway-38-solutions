name: H38 Scout Browser Acceptance

on:
  push:
    branches: ['agent/private-reseller-scout']
    paths:
      - '.github/workflows/scout-web-button-acceptance.yml'
      - 'supabase/functions/h38-deals-maintenance-web/**'
      - 'supabase/functions/h38-deals-maintenance/**'
      - 'scripts/build-scout-static-web.cjs'
      - 'scripts/scout-mobile-ux-acceptance.cjs'
      - 'scripts/scout-web-button-acceptance.cjs'
      - 'deals-app/**'
      - 'supabase/functions/h38-penny-web/**'
      - 'supabase/functions/h38-resale-web/**'
      - 'supabase/functions/h38-coupon-web/**'
      - 'supabase/functions/h38-deal-engine-web/**'
      - 'supabase/functions/h38-deal-engine-api/**'
      - 'supabase/migrations/20260921073000_h38_deal_engine.sql'
      - 'scripts/scout-deal-engine-acceptance.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h38-scout-maintenance-diagnostic-v2
  cancel-in-progress: true

jobs:
  maintenance-browser:
    if: github.ref == 'refs/heads/agent/private-reseller-scout'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://jqukmwtsgcsaruucnqja.supabase.co
      SUPABASE_KEY: sb_publishable_XrF41kGmTC2SmSTgPvo5OQ_vqcBd0N1
      SCOUT_EMAIL: ${{ secrets.H38_SCOUT_TEST_EMAIL }}
      SCOUT_PASSWORD: ${{ secrets.H38_SCOUT_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose Maintenance startup and request
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-scout-static-web.cjs artifacts/scout-web-static
          python3 -m http.server 4173 --bind 127.0.0.1 --directory artifacts/scout-web-static >/tmp/h38-maint-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/maintenance.html >/dev/null && break
            sleep 1
          done
          cat > "$RUNNER_TEMP/h38-maintenance-diagnostic.cjs" <<'NODE'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          const BASE=process.env.SUPABASE_URL;
          const KEY=process.env.SUPABASE_KEY;
          const EMAIL=process.env.SCOUT_EMAIL;
          const PASSWORD=process.env.SCOUT_PASSWORD;
          let browser;
          (async()=>{
            const auth=await fetch(BASE+'/auth/v1/token?grant_type=password',{
              method:'POST',
              headers:{'content-type':'application/json','apikey':KEY},
              body:JSON.stringify({email:EMAIL,password:PASSWORD})
            });
            const body=await auth.text();
            if(!auth.ok) throw new Error('auth '+auth.status+' '+body.slice(0,300));
            const session=JSON.parse(body);
            session.expires_at=Math.floor(Date.now()/1000)+Number(session.expires_in||3600);
            browser=await chromium.launch({headless:true});
            const context=await browser.newContext();
            await context.addInitScript(({k,v})=>localStorage.setItem(k,JSON.stringify(v)),{
              k:'sb-jqukmwtsgcsaruucnqja-auth-token',v:session
            });
            const page=await context.newPage();
            const errors=[];
            const failed=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('requestfailed',r=>failed.push(r.url()+' :: '+(r.failure()?.errorText||'')));
            page.on('console',m=>console.log('BROWSER',m.type(),m.text()));
            await page.goto('http://127.0.0.1:4173/maintenance.html',{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(5000);
            const state=await page.locator('#state').innerText().catch(()=>'<missing>');
            const msg=await page.locator('#msg').innerText().catch(()=>'<missing>');
            console.log('MAINT_STATE',JSON.stringify(state));
            console.log('MAINT_MSG_5S',JSON.stringify(msg));
            console.log('MAINT_PAGE_ERRORS',JSON.stringify(errors));
            console.log('MAINT_REQUEST_FAILURES',JSON.stringify(failed));
            if(state==='Checking session…') throw new Error('Maintenance startup never left session check');
            if(/Sign in required/i.test(state+' '+msg)) throw new Error('Maintenance static page did not restore signed-in session');
            await page.waitForFunction(()=>/^(Finished\.|Maintenance failed:)/.test(document.querySelector('#msg')?.textContent||''),null,{timeout:45000});
            const finalMsg=await page.locator('#msg').innerText();
            console.log('MAINT_FINAL',JSON.stringify(finalMsg));
            console.log('MAINT_REPORT_CARDS',await page.locator('#report .card').count());
            console.log('MAINT_FINAL_PAGE_ERRORS',JSON.stringify(errors));
            console.log('MAINT_FINAL_REQUEST_FAILURES',JSON.stringify(failed));
            if(!/^Finished\./.test(finalMsg)) throw new Error(finalMsg);
            if(await page.locator('#report .card').count()===0) throw new Error('Maintenance finished without report cards');
            page.once('dialog',d=>d.accept());
            await page.locator('#maintain').click();
            await page.waitForFunction(()=>/^(Finished\.|Maintenance failed:)/.test(document.querySelector('#msg')?.textContent||'') && !/Checking|Refreshing/.test(document.querySelector('#msg')?.textContent||''),null,{timeout:95000});
            const deepMsg=await page.locator('#msg').innerText();
            const deepRaw=await page.locator('#raw').textContent().catch(()=>'<missing>');
            console.log('MAINT_DEEP_FINAL',JSON.stringify(deepMsg));
            console.log('MAINT_DEEP_REPORT',deepRaw);
            if(!/^Finished\./.test(deepMsg)) throw new Error(deepMsg);
            if(/Finished\. FAIL/i.test(deepMsg)) throw new Error('Deep maintenance returned FAIL: '+deepMsg);
            console.log('H38_MAINTENANCE_DIAGNOSTIC_PASS');
          })().catch(e=>{console.error(e);process.exitCode=1}).finally(async()=>{if(browser)await browser.close().catch(()=>{});});
          NODE
          node "$RUNNER_TEMP/h38-maintenance-diagnostic.cjs"

      - name: Verify mobile-width UX and capture screenshots
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-scout-static-web.cjs artifacts/scout-web-static
          python3 -m http.server 4173 --bind 127.0.0.1 --directory artifacts/scout-web-static >/tmp/h38-mobile-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          export H38_WEB_BASE=http://127.0.0.1:4173
          export H38_MOBILE_OUT=artifacts/scout-mobile-ux
          node scripts/scout-mobile-ux-acceptance.cjs

      - name: Upload browser UX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h38-scout-browser-ux
          path: |
            artifacts/scout-mobile-ux/**
          if-no-files-found: warn
          retention-days: 30
