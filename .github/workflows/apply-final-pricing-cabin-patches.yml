name: Apply final pricing and cabin patches

on:
  push:
    branches: [pricing/final-offers-and-print-fixes]
    paths: ['.github/workflows/apply-final-pricing-cabin-patches.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pricing/final-offers-and-print-fixes
          fetch-depth: 0
      - name: Patch linked public copy and verification contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, required=True):
              p=Path(path); text=p.read_text()
              if old not in text:
                  if required: raise SystemExit(f'Missing expected text in {path}: {old[:100]}')
                  return
              p.write_text(text.replace(old,new))

          replace('sample-library-now.html','Open Plans &amp; All Quotes','Open Plans &amp; 21 Quotes')

          replace('scripts/verify-public-expansion.js',
            "check('pricing is scope-driven instead of catalog-driven',pricing.includes('Project-first pricing')&&pricing.includes('Not a confusing catalog.')&&pricing.includes('The project scope drives the package.'));\ncheck('pricing requires approval before implementation',pricing.includes('Scope and price are approved before implementation.')&&pricing.includes('Request Project Pricing'));",
            "check('pricing displays exactly three software products',(pricing.match(/class=\\\"price-card/g)||[]).length===3&&pricing.includes('$59')&&pricing.includes('$249')&&pricing.includes('Starting at $499'));\ncheck('pricing keeps Business Snapshot separate',pricing.includes('id=\\\"snapshot\\\"')&&pricing.includes('$299 one-time')&&pricing.includes('Most Popular'));"
          )

          replace('scripts/verify-commercial-system.js',
            "check('pricing page is project first',pricing.includes('Project-first pricing')&&pricing.includes('Not a confusing catalog.')&&pricing.includes('The project scope drives the package.'));\ncheck('pricing requires scope and price approval before implementation',pricing.includes('Scope and price are approved before implementation.')&&pricing.includes('Request Project Pricing'));",
            "check('pricing page has final three-product structure',(pricing.match(/class=\\\"price-card/g)||[]).length===3&&pricing.includes('$59')&&pricing.includes('$249')&&pricing.includes('Starting at $499'));\ncheck('pricing preserves Snapshot and approval boundaries',pricing.includes('$299 one-time')&&pricing.includes('Nothing is activated or charged from the request form.'));"
          )

          replace('scripts/verify-highway38-final-polish.js',
            "check('pricing is project first and approval based',pricing.includes('Project-first pricing')&&pricing.includes('Not a confusing catalog.')&&pricing.includes('Scope and price are approved before implementation.'));",
            "check('pricing uses final approved product structure',(pricing.match(/class=\\\"price-card/g)||[]).length===3&&pricing.includes('$59')&&pricing.includes('$249')&&pricing.includes('Starting at $499')&&pricing.includes('$299 one-time'));"
          )

          replace('scripts/browser-commercial-smoke.sh',
            "grep -q 'Project-first pricing' \"$OUT/rendered-pricing.html\" || fail \"rendered pricing page is missing project-first pricing\"",
            "grep -q 'Three software products' \"$OUT/rendered-pricing.html\" || fail \"rendered pricing page is missing the three-product structure\"\n[[ \"$(count_class price-card \"$OUT/rendered-pricing.html\")\" == \"3\" ]] || fail \"rendered pricing page must contain exactly three software cards\"\ngrep -q '\\$299 one-time' \"$OUT/rendered-pricing.html\" || fail \"rendered pricing page is missing the separate Business Snapshot\""
          )

          replace('scripts/verify-one-shot-ux.js',
            "const required=['assets/css/project-intelligence.css','assets/js/h38-site-v2.js','platform-unified.css','platform-states.js','request-flow.js'",
            "const required=['assets/css/project-intelligence.css','assets/js/h38-site-v2.js','platform-unified.css','platform-states.js','pricing-data.js','assets/js/h38-request-options.js','request-flow.js'"
          )
          replace('scripts/verify-one-shot-ux.js',
            "['What result do you need?','Tell us about the problem.','Contact and review.'].forEach(text=>check(`request copy ${text}`,request.includes(text)));",
            "['What result do you need?','Tell us about the problem and select the closest offer.','Contact and review.'].forEach(text=>check(`request copy ${text}`,request.includes(text)));"
          )
          replace('scripts/verify-one-shot-ux.js',
            "check('request has two secondary choices',(request.match(/class=\"h38-choice-link\"/g)||[]).length===2);",
            "check('request has three secondary choices',(request.match(/class=\"h38-choice-link\"/g)||[]).length===3);"
          )
          replace('scripts/verify-one-shot-ux.js',
            "check('request preserves approved selectors',request.includes('id=\"product\"')&&request.includes('id=\"bundle\"')&&request.includes('id=\"business-system-interest\"'));",
            "check('request uses the approved offer selector',request.includes('id=\"offer\"')&&request.includes('pricing-data.js')&&!request.includes('id=\"bundle\"'));"
          )

          business=Path('.github/workflows/business-office.yml')
          text=business.read_text()
          if "scripts/verify-final-pricing-and-cabin.js" not in text:
              text=text.replace("      - 'scripts/verify-business-office.js'\n", "      - 'scripts/verify-business-office.js'\n      - 'scripts/verify-final-pricing-and-cabin.js'\n")
              text=text.replace("      - name: Verify Business Office source\n        run: node scripts/verify-business-office.js\n", "      - name: Verify Business Office source\n        run: node scripts/verify-business-office.js\n\n      - name: Verify final pricing and complete cabin system\n        run: node scripts/verify-final-pricing-and-cabin.js\n")
              text=text.replace("            artifacts/business-office/verification.json\n", "            artifacts/business-office/verification.json\n            artifacts/final-pricing-cabin/verification.json\n")
          business.write_text(text)

          public=Path('.github/workflows/integrated-public-expansion.yml')
          text=public.read_text()
          if "pricing-data.js" not in text:
              text=text.replace("      - 'pricing.html'\n", "      - 'pricing.html'\n      - 'pricing-data.js'\n      - 'quote-builder.html'\n      - 'business-systems.html'\n      - 'cabin-project-complete.html'\n")
              text=text.replace("      - 'scripts/verify-commercial-system.js'\n", "      - 'scripts/verify-commercial-system.js'\n      - 'scripts/verify-final-pricing-and-cabin.js'\n")
              text=text.replace("          node scripts/verify-commercial-system.js\n", "          node scripts/verify-commercial-system.js\n          node scripts/verify-final-pricing-and-cabin.js\n")
              text=text.replace("            artifacts/commercial-system/verification.json\n", "            artifacts/commercial-system/verification.json\n            artifacts/final-pricing-cabin/verification.json\n")
          public.write_text(text)

          Path('.github/workflows/apply-final-pricing-cabin-patches.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Align public copy and verification with final pricing and cabin system'
          git push origin HEAD:pricing/final-offers-and-print-fixes
