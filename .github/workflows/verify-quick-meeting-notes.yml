name: Verify Quick Meeting Notes
on:
  push:
    branches: [main]
    paths:
      - 'commercial-app/quick-meeting-notes.js'
      - 'commercial-app/runtime-rowid-fix.js'
      - 'supabase/functions/h38-quick-meeting-notes/index.ts'
      - 'scripts/verify-quick-meeting-notes.js'
      - 'tests/test_quick_meeting_notes_20260915.py'
      - '.github/workflows/verify-quick-meeting-notes.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: node --check commercial-app/quick-meeting-notes.js
      - run: node scripts/verify-quick-meeting-notes.js
      - run: python -m pytest -q tests/test_quick_meeting_notes_20260915.py
