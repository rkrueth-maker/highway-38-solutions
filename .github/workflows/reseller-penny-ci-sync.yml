name: Sync Reseller Scout PennyCentral v2 CI guard

on:
  push:
    branches:
      - agent/private-reseller-scout
    paths:
      - '.github/workflows/reseller-penny-ci-sync.yml'

permissions:
  contents: write

jobs:
  sync-private-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/private-reseller-scout
          fetch-depth: 0
      - name: Update permanent verifier and remove one-time repair workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/private-reseller-scout-apk.yml')
          s=p.read_text()
          s=s.replace("'reported_penny_price: 0.01','buy_price: 0','community_penny: true'", "'reported_penny_price:0.01','buy_price:0','community_penny:true','pennycentral-parser-v2'")
          s=s.replace("assert 'multi-retailer-plus-home-depot-penny-v1' in backend", "assert 'multi-retailer-plus-home-depot-penny-v2' in backend")
          if 'pennycentral-parser-v2' not in s or 'multi-retailer-plus-home-depot-penny-v2' not in s:
              raise SystemExit('Failed to update permanent PennyCentral v2 CI guard')
          p.write_text(s)
          PY
          rm -f .github/workflows/reseller-penny-parser-hotfix.yml
          rm -f .github/workflows/reseller-penny-ci-sync.yml
          git diff --check
          git config user.name 'H38 Recovery Bot'
          git config user.email 'highway38solutions@gmail.com'
          git add -A .github/workflows
          git commit -m 'Sync PennyCentral v2 CI guard and remove repair workflows'
          git push origin HEAD:agent/private-reseller-scout
