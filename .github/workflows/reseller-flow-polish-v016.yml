name: Apply Reseller Scout Flow Polish v0.1.16

on:
  push:
    branches:
      - agent/private-reseller-scout
    paths:
      - '.github/workflows/reseller-flow-polish-v016.yml'

permissions:
  contents: write

jobs:
  polish-private-reseller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/private-reseller-scout
          fetch-depth: 0

      - name: Apply narrow flow and truth polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('native/h38-site-scanner/android-app/reseller/src/main/java/com/highway38/resellerscout/MainActivity.java')
          build_path = Path('native/h38-site-scanner/android-app/reseller/build.gradle')
          stock_path = Path('supabase/functions/reseller-stock-check/index.ts')
          ci_path = Path('.github/workflows/private-reseller-scout-apk.yml')

          main = main_path.read_text()
          stock = stock_path.read_text()
          build = build_path.read_text()
          ci = ci_path.read_text()

          def one(src, old, new, label):
              if old not in src:
                  raise SystemExit(f'missing expected text for {label}')
              return src.replace(old, new, 1)

          # MainActivity markers + cache scope correctness.
          main = one(main,
              '    private static final String HAMMER_LOOP_FIX_MARKER = "HAMMER_MUTATION_LOOP_FIXED_V1";\n',
              '    private static final String HAMMER_LOOP_FIX_MARKER = "HAMMER_MUTATION_LOOP_FIXED_V1";\n'
              '    private static final String FLOW_POLISH_MARKER = "BROWSE_NONBLOCKING_SEARCH_V1";\n'
              '    private static final String AUTO_CHECK_LIMIT_MARKER = "AUTO_CHECK_HOME_DEPOT_TOP5_V1";\n',
              'flow markers')
          main = one(main,
              '            "function loadPersistent(kind){try{var raw=localStorage.getItem(cacheKey(kind));if(!raw)return null;var s=JSON.parse(raw);if(!s||!s.body)return null;return markPersisted(kind,s);}catch(e){return null;}}" +\n',
              '            "function loadPersistent(kind,init){try{var raw=localStorage.getItem(cacheKey(kind));if(!raw)return null;var s=JSON.parse(raw);if(!s||!s.body)return null;if(kind===\'store\'&&String(s.requestBody||\'\')!==String((init&&init.body)||\'\'))return null;return markPersisted(kind,s);}catch(e){return null;}}" +\n',
              'scoped persisted store cache')
          main = one(main,
              '            "var persisted=loadPersistent(kind);" +\n',
              '            "var persisted=loadPersistent(kind,init);" +\n',
              'persistent caller')
          main = one(main,
              '            "if(!servedPersisted.has(kind)&&persisted){servedPersisted.add(kind);rawFetch(input,init).then(async function(r){var s=await snap(r);if(r.ok&&count(kind,s)>0)savePersistent(kind,s,init);}).catch(function(){});return responseOf(persisted);}" +\n',
              '            "if(kind===\'leads\'&&!servedPersisted.has(kind)&&persisted){servedPersisted.add(kind);rawFetch(input,init).then(async function(r){var s=await snap(r);if(r.ok&&count(kind,s)>0)savePersistent(kind,s,init);}).catch(function(){});return responseOf(persisted);}" +\n',
              'do not flash stale store list')
          main = main.replace('lastGood.get(key)||loadPersistent(kind)', 'lastGood.get(key)||loadPersistent(kind,init)')

          # Truthful per-card states and calmer auto-check policy.
          main = one(main,
              '            "function qty(p){if(!p)return\'Not checked\';var raw=p.stock_count;if(raw!==null&&raw!==undefined&&raw!==\'\'&&Number.isFinite(Number(raw)))return String(Number(raw));var st=String(p.stock_status||\'\').toLowerCase();if(st===\'out_of_stock\')return\'OUT\';if(st===\'in_stock\')return\'IN\';if(p.status===\'check_failed\')return\'Error\';if(p.status===\'store_not_resolved\')return\'Store not resolved\';return\'Qty not exposed\';}" +\n',
              '            "function qty(p){if(!p)return\'Not checked\';var raw=p.stock_count;if(raw!==null&&raw!==undefined&&raw!==\'\'&&Number.isFinite(Number(raw)))return String(Number(raw));var st=String(p.stock_status||\'\').toLowerCase();if(st===\'out_of_stock\')return\'OUT\';if(st===\'in_stock\')return\'IN\';if(p.status===\'retailer_blocked\')return\'Blocked\';if(p.status===\'check_failed\')return\'Unavailable\';if(p.status===\'store_not_resolved\')return\'No store match\';if(p.stock_checked&&p.store_bound)return\'Qty not exposed\';if(p.stock_checked)return\'Unavailable\';return\'Not checked\';}" +\n',
              'quantity state labels')
          main = one(main,
              '            "function price(p){if(!p)return\'Not checked\';var raw=p.current_price,n=Number(raw);if(raw!==null&&raw!==undefined&&raw!==\'\'&&Number.isFinite(n)&&n>0)return\'$\'+n.toFixed(2);if(p.status===\'check_failed\')return\'Error\';if(p.store_bound)return\'Not exposed\';return\'Not checked\';}" +\n',
              '            "function price(p){if(!p)return\'Not checked\';var raw=p.current_price,n=Number(raw);if(raw!==null&&raw!==undefined&&raw!==\'\'&&Number.isFinite(n)&&n>0)return\'$\'+n.toFixed(2);if(p.status===\'retailer_blocked\')return\'Blocked\';if(p.status===\'check_failed\')return\'Unavailable\';if(p.status===\'store_not_resolved\')return\'No store match\';if(p.store_bound)return\'Not exposed\';if(p.stock_checked)return\'Unavailable\';return\'Not checked\';}" +\n',
              'price state labels')
          main = one(main,
              '            "function queuePenny(d){if(!d||!d.open)return;var sk=d.dataset.storeKey||\'\',todo=[];Array.from(d.querySelectorAll(\'.lead\')).forEach(function(lead){if(!lead.querySelector(\'.pill.penny\'))return;var b=lead.querySelector(\'[data-stock]\');if(!b)return;var id=remember(b);if(!id||results.has(id)||pending.has(id)||queued.has(id))return;queued.add(id);todo.push(id);});decorate(d);todo.forEach(function(id,i){setTimeout(function(){var live=detailsFor(sk);if(!live||!live.open){queued.delete(id);return;}var b=findButton(id);if(!b){queued.delete(id);return;}if(results.has(id)||pending.has(id)){queued.delete(id);return;}remember(b);b.click();},i*2200);});}" +\n',
              '            "function queuePenny(d){if(!d||!d.open)return;var title=d.querySelector(\'.store-title\'),retailer=norm(title&&title.textContent);if(retailer!==\'home depot\')return;var sk=d.dataset.storeKey||\'\',todo=[];Array.from(d.querySelectorAll(\'.lead\')).forEach(function(lead){if(todo.length>=5)return;if(!lead.querySelector(\'.pill.penny\'))return;var b=lead.querySelector(\'[data-stock]\');if(!b)return;var id=remember(b);if(!id||results.has(id)||pending.has(id)||queued.has(id))return;queued.add(id);todo.push(id);});decorate(d);todo.forEach(function(id,i){setTimeout(function(){var live=detailsFor(sk);if(!live||!live.open){queued.delete(id);return;}var b=findButton(id);if(!b){queued.delete(id);return;}if(results.has(id)||pending.has(id)){queued.delete(id);return;}remember(b);b.click();},i*2200);});}" +\n',
              'Home Depot top five auto-check')

          # Search-first, non-blocking browsing and stable store refresh are runtime HTML patches.
          anchor = '''            html = html.replace(
                    "function renderLead(s,l){const existing=savedMatch(s,l),potential=n(l.resale_potential),rank=potential>=90?'STRONG':potential>=78?'GOOD':'CHECK',sourceOnly=!!l.source_only;",
                    "function renderLead(s,l){const existing=savedMatch(s,l),potential=n(l.resale_potential),rank=potential>=90?'STRONG':potential>=78?'GOOD':'CHECK',sourceOnly=!!l.source_only;if(sourceOnly)return`<div class=\\\"lead\\\"><div class=\\\"lead-head\\\"><div><div class=\\\"lead-title\\\">${esc(l.title)}</div><div class=\\\"muted small\\\">${esc(l.availability_label||'Open the retailer sale list to browse all items.')}</div></div><div><span class=\\\"pill local\\\">SALE LIST</span></div></div><div class=\\\"actions\\\"><button data-source=\\\"${esc(l.id)}\\\">View full sale list</button></div></div>`;"
            );
'''
          if anchor not in main:
              raise SystemExit('renderLead patch anchor missing')
          additions = anchor + '''            html = html.replace(
                    ".toolbar{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}",
                    ".toolbar{display:grid;grid-template-columns:minmax(180px,1.4fr) minmax(130px,1fr) minmax(130px,1fr) auto;gap:8px;align-items:end}"
            );
            html = html.replace(
                    ".toolbar label{font-size:12px;font-weight:700}",
                    ".toolbar label{font-size:12px;font-weight:700}.toolbar input,.toolbar select{width:100%;padding:10px;border:1px solid #cbd7df;border-radius:9px;background:#fff}"
            );
            html = html.replace(
                    "<section class=\\\"card\\\"><div class=\\\"toolbar\\\"><label>Retailer",
                    "<section class=\\\"card\\\"><div class=\\\"toolbar\\\"><label>Find item<input id=\\\"itemSearch\\\" type=\\\"search\\\" inputmode=\\\"search\\\" placeholder=\\\"Item, SKU or UPC\\\"></label><label>Retailer"
            );
            html = html.replace(">Use phone location</button>", ">Update location & stores</button>");
            html = html.replace(">Refresh hunt</button>", ">Refresh deals</button>");
            html = html.replace("Check store qty", "Check price & stock");
            html = html.replace(
                    "function startWork(text){workDepth++;$('workingText').textContent=text||'H38 is working…';$('working').classList.remove('hidden')}",
                    "function startWork(text){workDepth++;if(!$('app').classList.contains('hidden'))return;$('workingText').textContent=text||'H38 is working…';$('working').classList.remove('hidden')}"
            );
            html = html.replace(
                    "function leadForStore(s){return leads.filter(x=>norm(x.retailer)===norm(s.retailer)).sort((a,b)=>Number(!!b.deep_discount)-Number(!!a.deep_discount)||n(b.discount_pct)-n(a.discount_pct)||n(b.resale_potential)-n(a.resale_potential))}",
                    "function leadForStore(s){const q=norm(($('itemSearch')&&$('itemSearch').value)||'');return leads.filter(x=>norm(x.retailer)===norm(s.retailer)&&(!q||norm([x.title,x.sku,x.upc,x.source_name].join(' ')).includes(q))).sort((a,b)=>Number(!!b.deep_discount)-Number(!!a.deep_discount)||n(b.discount_pct)-n(a.discount_pct)||n(b.resale_potential)-n(a.resale_potential))}"
            );
            html = html.replace(
                    "const next=Array.isArray(p.stores)?p.stores:[];stores=next;renderAll();",
                    "const next=Array.isArray(p.stores)?p.stores:[];if(p.partial&&stores.length>next.length){msg(`Store search was partial · keeping ${stores.length} known stores instead of dropping to ${next.length}.`,'warn');return stores}stores=next;renderAll();"
            );
            html = html.replace(
                    "await Promise.all([loadLeads(false),loadStores(true),loadSaved()]);renderAll();msg(`Hunt refreshed · ${stores.length} stores · ${leads.length} automatic deal leads · ${saved.length} saved finds.`,'good')",
                    "await Promise.all([loadLeads(true),loadSaved()]);renderAll();msg(`Deals refreshed · ${stores.length} stores kept · ${leads.length} automatic deal leads · ${saved.length} saved finds.`,'good')"
            );
            html = html.replace(
                    "$('retailerFilter').onchange=renderStores;$('storeFilter').onchange=renderStores;",
                    "$('itemSearch').oninput=renderStores;$('retailerFilter').onchange=renderStores;$('storeFilter').onchange=renderStores;"
            );
            html = html.replace(
                    "<div class=\\\"stat\\\"><strong>${money(l.buy_price)}</strong><span>Current/hunt price</span></div>",
                    "<div class=\\\"stat\\\"><strong>${l.deal_type==='penny'&&n(l.reported_penny_price)>0?money(l.reported_penny_price):money(l.buy_price)}</strong><span>${l.deal_type==='penny'?'Reported penny':'Current/hunt price'}</span></div>"
            );
'''
          main = main.replace(anchor, additions, 1)

          main = main.replace('H38ResellerScoutAndroid/0.1.15-hammer-fix', 'H38ResellerScoutAndroid/0.1.16-flow-polish')
          main = main.replace('20260819-multi-retailer-hd-penny-hammer-v015', '20260819-multi-retailer-flow-polish-v016')

          # Build bump.
          build = one(build, 'versionCode 16', 'versionCode 17', 'version code')
          build = one(build, "versionName '0.1.15'", "versionName '0.1.16'", 'version name')

          # Stock checker: keep truth rules, but classify retailer blocks honestly.
          stock = stock.replace('H38ResellerScoutStock/0.1.14', 'H38ResellerScoutStock/0.1.16')
          stock = stock.replace('h38_stock_v: 4', 'h38_stock_v: 5')
          stock = one(stock,
              'Deno.serve(async (req: Request) => {\n  if (req.method === "OPTIONS")',
              'Deno.serve(async (req: Request) => {\n  let attemptedRetailer = "";\n  if (req.method === "OPTIONS")',
              'attempted retailer scope')
          stock = one(stock,
              '    const retailer = clean(body.retailer);\n',
              '    const retailer = clean(body.retailer);\n    attemptedRetailer = retailer;\n',
              'capture attempted retailer')
          old_catch = '''  } catch (error) {
    const payload = {
      status: "check_failed",
      retailer: "",
      stock_checked: true,
      stock_status: "unknown",
      stock_count: null,
      current_price: null,
      store_bound: false,
      availability_label: `Store check unavailable: ${error instanceof Error ? error.message : String(error)}`,
    };
    logResult(payload);
    return json(req, 200, payload);
  }
});'''
          new_catch = '''  } catch (error) {
    const detail = error instanceof Error ? error.message : String(error);
    const blocked = /returned\\s+(?:401|403|429)\\b|forbidden|access denied|too many requests/i.test(detail);
    const payload = {
      status: blocked ? "retailer_blocked" : "check_failed",
      retailer: attemptedRetailer,
      stock_checked: true,
      stock_status: "unknown",
      stock_count: null,
      current_price: null,
      store_bound: false,
      retailer_blocked: blocked,
      availability_label: blocked
        ? `${attemptedRetailer || "Retailer"} blocked the automated store lookup. Price and quantity are not verified; open the retailer to confirm.`
        : `Store check unavailable: ${detail}`,
    };
    logResult(payload);
    return json(req, 200, payload);
  }
});'''
          stock = one(stock, old_catch, new_catch, 'blocked retailer classification')

          # Permanent CI follows v0.1.16 and the already-live PennyCentral v2 parser.
          ci = ci.replace("versionName '0.1.15'", "versionName '0.1.16'")
          ci = ci.replace('versionCode 16', 'versionCode 17')
          ci = ci.replace("'reported_penny_price: 0.01','buy_price: 0','community_penny: true'", "'reported_penny_price:0.01','buy_price:0','community_penny:true'")
          ci = ci.replace("assert 'multi-retailer-plus-home-depot-penny-v1' in backend", "assert 'multi-retailer-plus-home-depot-penny-v2' in backend")
          ci = ci.replace("'h38_stock_v: 4'", "'h38_stock_v: 5'")
          ci = ci.replace("H38-Reseller-Scout-Owner-Test-v0.1.15.apk", "H38-Reseller-Scout-Owner-Test-v0.1.16.apk")
          ci = ci.replace("H38-Reseller-Scout-Owner-Test-v0.1.15.sha256", "H38-Reseller-Scout-Owner-Test-v0.1.16.sha256")
          ci = ci.replace("h38-reseller-scout-owner-test-v0.1.15", "h38-reseller-scout-owner-test-v0.1.16")
          ci = ci.replace("grep -Fq 'HAMMER_MUTATION_LOOP_FIXED_V1'", "grep -Fq 'HAMMER_MUTATION_LOOP_FIXED_V1'\n          grep -Fq 'BROWSE_NONBLOCKING_SEARCH_V1'\n          grep -Fq 'AUTO_CHECK_HOME_DEPOT_TOP5_V1'")
          ci = ci.replace("for token in ['STORE PRICE','STORE QTY','LOCAL $0.01'", "for token in ['STORE PRICE','STORE QTY','LOCAL $0.01','BROWSE_NONBLOCKING_SEARCH_V1','AUTO_CHECK_HOME_DEPOT_TOP5_V1'")
          ci = ci.replace("assert 'retailer !== \"Home Depot\"' not in stock", "assert 'retailer_blocked' in stock\n          assert 'retailer !== \"Home Depot\"' not in stock")

          # Assertions prevent broad accidental rewrites.
          for token in [
              'BROWSE_NONBLOCKING_SEARCH_V1','AUTO_CHECK_HOME_DEPOT_TOP5_V1',
              'Find item<input id=\\\"itemSearch\\\"','Refresh deals','Update location & stores',
              'Check price & stock','Reported penny','retailer!==\\\'home depot\\\'',
              'todo.length>=5','H38ResellerScoutAndroid/0.1.16-flow-polish'
          ]:
              assert token in main, token
          for token in ['retailer_blocked','h38_stock_v: 5','H38ResellerScoutStock/0.1.16']:
              assert token in stock, token
          assert "versionCode 17" in build and "versionName '0.1.16'" in build
          assert "multi-retailer-plus-home-depot-penny-v2" in ci
          assert "h38-reseller-scout-owner-test-v0.1.16" in ci

          main_path.write_text(main)
          stock_path.write_text(stock)
          build_path.write_text(build)
          ci_path.write_text(ci)
          PY

          git diff --check
          grep -Fq 'BROWSE_NONBLOCKING_SEARCH_V1' native/h38-site-scanner/android-app/reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          grep -Fq 'retailer_blocked' supabase/functions/reseller-stock-check/index.ts
          grep -Fq "versionName '0.1.16'" native/h38-site-scanner/android-app/reseller/build.gradle

      - name: Commit polish and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'H38 Recovery Bot'
          git config user.email 'highway38solutions@gmail.com'
          git rm .github/workflows/reseller-flow-polish-v016.yml
          git add native/h38-site-scanner/android-app/reseller/src/main/java/com/highway38/resellerscout/MainActivity.java \
                  native/h38-site-scanner/android-app/reseller/build.gradle \
                  supabase/functions/reseller-stock-check/index.ts \
                  .github/workflows/private-reseller-scout-apk.yml
          git commit -m 'Polish Reseller Scout browsing and store-check truth'
          git push origin HEAD:agent/private-reseller-scout
