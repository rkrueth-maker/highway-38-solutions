name: Build H38 Private Reseller Scout APK

on:
  push:
    branches:
      - 'agent/private-reseller-scout-ci-*'
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'supabase/functions/reseller-*/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
      - '.scout-ci-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reseller-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Verify v2.2.1 phone acceptance repair contract
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"; mkdir -p "$report"
          check(){ grep -Fq "$1" "$2" || { echo "::error::Missing [$1] in $2"; exit 1; }; }
          reject(){ if grep -Fq "$1" "$2"; then echo "::error::Forbidden [$1] in $2"; exit 1; fi; }
          assets='reseller/src/main/assets/reseller'; core="$assets/v200-core.js"; hunt="$assets/v200-hunt.js"; wide="$assets/v211-wide.js"; physical="$assets/v212-physical.js"; profit="$assets/v220-profit.js"; track="$assets/v220-track.js"; product="$assets/v220-product.js"; index="$assets/index.html"
          main='reseller/src/main/java/com/highway38/resellerscout/MainActivity.java'; fb='reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java'; acceptance='reseller/SCOUT_BUILD_ACCEPTANCE.md'
          imageFn="$GITHUB_WORKSPACE/supabase/functions/reseller-image-delivery-v201/index.ts"; dealsFn="$GITHUB_WORKSPACE/supabase/functions/reseller-opportunity-scan-v060/index.ts"; sourceDir="$GITHUB_WORKSPACE/supabase/functions/reseller-auto-leads-v063"; sourceIndex="$sourceDir/index.ts"; sourceCore="$sourceDir/core.mjs"; sourceTest="$sourceDir/core.test.mjs"

          check "versionName '2.2.1'" reseller/build.gradle
          check 'versionCode 75' reseller/build.gradle
          for f in "$assets"/v200-*.js "$assets"/v210-polish.js "$wide" "$physical" "$profit" "$track" "$product"; do node --check "$f"; done
          node reseller/hunt-native.test.mjs | tee "$report/hunt-native-fixture.txt"
          node reseller/profit-engine.test.mjs | tee "$report/profit-track-fixtures.txt"
          node "$sourceTest" | tee "$report/canonical-source-fixtures.txt"

          # v2.1.6 Hunt/runtime repairs stay protected.
          check 'H38_SCOUT_V215_NATIVE_HUNT=true' "$physical"
          check 'H38_SCOUT_V216_HUNT_RUNTIME=true' "$physical"
          check 'function strictImageRetailer(v)' "$physical"
          check 'strictImageRetailer(r.retailer)' "$wide"
          check '<details class="retailer-group" data-hunt-details=' "$physical"
          check '<summary class="retailer-group-head">' "$physical"
          check 'Native Penny Hunt expansion' "$physical"
          reject 'h38BindStableHuntTouch' "$physical"
          check 'TAP EACH visible retailer header' "$acceptance"
          check 'cross-layer runtime dependency gate' "$acceptance"

          # Shared v2.2 engine / Scan / Track / truth boundaries.
          check 'H38_SCOUT_V220_PROFIT_ENGINE=true' "$profit"
          check 'evaluateOpportunity' "$profit"
          check 'ASKING MARKET ONLY' "$profit"
          check "'SOURCE UNAVAILABLE'" "$profit"
          check "reason:'Buyer premium unknown'" "$profit"
          check "label:'GLITCH CANDIDATE'" "$profit"
          check 'H38_SCOUT_V220_TRACK=true' "$track"
          check "const TRACK_KEY='h38.scout.v220.tracks'" "$track"
          check "eventClass:'Tracked Item Match'" "$track"
          check 'prior.some(x=>x.signature===sig)' "$track"
          check 'H38Profit.evaluateOpportunity' "$product"
          check 'dealScore' "$product"
          check 'PENNY CANDIDATE' "$product"
          check 'Retail web:' "$product"
          check 'Physical scan/register required.' "$product"
          check 'Store location unknown' "$product"
          check 'AUCTION MAX BID' "$product"
          check 'Buyer premium %' "$product"
          check 'Profitability Settings' "$product"
          check 'data-page="track"' "$index"
          check 'id="trackPage"' "$index"
          check 'More / Settings' "$index"
          check 'Maintenance / Self-Test' "$index"
          check 'v220-profit.js' "$main"
          check 'v220-track.js' "$main"
          check 'v220-product.js' "$main"
          check 'data-h38-bundled-module' "$main"
          check 'BuildConfig.H38_BUILD_SHA' "$main"

          # v2.2.1 physical recording repairs: auth resumes same Facebook term, wrong-area rows are withheld,
          # and an unproven resale estimate cannot advertise HIGH confidence on the Scan decision card.
          check 'H38ResellerScoutMarketplace/2.2.1' "$fb"
          check 'resumeCurrentTermAfterAuth' "$fb"
          check 'Scout will resume this same search automatically afterward.' "$fb"
          check 'strictLocationRequired' "$fb"
          check 'isGrandRapidsMn' "$fb"
          check 'Wrong-area cards are withheld.' "$fb"
          check 'location_verified' "$fb"
          check 'facebook_marketplace_location' "$fb"
          check 'H38_SCOUT_V221_PHONE_ACCEPTANCE=true' "$index"
          check 'VALUE NOT PROVEN' "$index"
          reject 'H38ResellerScoutMarketplace/2.1.2' "$fb"

          # Existing source/radius/Facebook/image truth regressions stay protected.
          check "const H38_DEFAULT_ZIP='55744'" "$core"
          check 'Penny date unknown' "$hunt"
          check 'physical register scan remains final penny truth' "$hunt"
          check 'retailer-upc-sku-bridge-v063' "$sourceCore"
          check 'pennygeneral.net' "$sourceIndex"
          check 'pennypinchinmom.com' "$sourceIndex"
          check 'H38_SCOUT_V213_MULTI_SOURCE' "$index"
          check 'reseller-auto-leads-v063' "$index"
          check 'Grand Rapids, MN' "$fb"
          check 'Capture now' "$fb"
          reject 'Next search' "$fb"
          reject 'Capture visible' "$fb"
          check 'if(d>ctx.radiusMiles)return null' "$dealsFn"
          check 'exactPennyTree' "$imageFn"
          check 'Image failure never changes penny/store/resale truth' "$imageFn"
          check 'h38SyncLocalInventoryFallbacks' "$wide"
          check 'reseller_watch_rules' "$wide"
          check 'actual_profit' "$wide"
          check 'Scan to Inventory' "$wide"

          # Clean v2 architecture: no old runtime resurrection.
          reject 'v018-' "$index"
          reject 'v046-' "$index"
          reject 'h38Inject' "$main"
          echo PASS > "$report/contract.txt"

      - name: Compile Owner Scout v2.2.1 APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"; mkdir -p "$report"
          echo debug-fallback-owner-test > "$report/signing-continuity.txt"
          gradle --no-daemon :reseller:assembleOwner | tee "$report/compile.log"
          apk='reseller/build/outputs/apk/owner/reseller-owner.apk'; test -f "$apk"
          out="$report/H38-Reseller-Scout-Owner-v2.2.1.apk"; cp "$apk" "$out"
          sha256sum "$out" > "$report/H38-Reseller-Scout-Owner-v2.2.1.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$out" > "$report/zipalign.txt"

      - name: Smoke inspect exact APK bytes
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"; out="$report/H38-Reseller-Scout-Owner-v2.2.1.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='75' versionName='2.2.1'" "$report/badging.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          grep -Fq 'Verification succesful' "$report/zipalign.txt"
          unzip -t "$out" > "$report/zip-test.txt"; grep -Fq 'No errors detected in compressed data' "$report/zip-test.txt"

          for name in v211-wide v212-physical v220-profit v220-track v220-product; do
            unzip -p "$out" "assets/reseller/${name}.js" > "$report/packaged-${name}.js"
            node --check "$report/packaged-${name}.js"
          done
          grep -Fq 'H38_SCOUT_V215_NATIVE_HUNT=true' "$report/packaged-v212-physical.js"
          grep -Fq 'H38_SCOUT_V216_HUNT_RUNTIME=true' "$report/packaged-v212-physical.js"
          grep -Fq 'function strictImageRetailer(v)' "$report/packaged-v212-physical.js"
          grep -Fq 'strictImageRetailer(r.retailer)' "$report/packaged-v211-wide.js"
          grep -Fq '<details class="retailer-group" data-hunt-details=' "$report/packaged-v212-physical.js"
          grep -Fq 'summary.click()' "$report/packaged-v212-physical.js"
          if grep -Fq 'h38BindStableHuntTouch' "$report/packaged-v212-physical.js"; then echo '::error::old Hunt touch override packaged'; exit 1; fi
          grep -Fq 'H38_SCOUT_V220_PROFIT_ENGINE=true' "$report/packaged-v220-profit.js"
          grep -Fq 'ASKING MARKET ONLY' "$report/packaged-v220-profit.js"
          grep -Fq 'SOURCE UNAVAILABLE' "$report/packaged-v220-profit.js"
          grep -Fq 'Buyer premium unknown' "$report/packaged-v220-profit.js"
          grep -Fq 'H38_SCOUT_V220_TRACK=true' "$report/packaged-v220-track.js"
          grep -Fq 'Tracked Item Match' "$report/packaged-v220-track.js"
          grep -Fq 'H38Profit.evaluateOpportunity' "$report/packaged-v220-product.js"
          grep -Fq 'PENNY CANDIDATE' "$report/packaged-v220-product.js"
          grep -Fq 'AUCTION MAX BID' "$report/packaged-v220-product.js"
          grep -Fq 'Profitability Settings' "$report/packaged-v220-product.js"
          unzip -p "$out" assets/reseller/v200-core.js > "$report/packaged-core.js"; grep -Fq "H38_DEFAULT_ZIP='55744'" "$report/packaged-core.js"
          unzip -p "$out" assets/reseller/index.html > "$report/packaged-index.html"
          grep -Fq 'H38_SCOUT_V213_MULTI_SOURCE' "$report/packaged-index.html"
          grep -Fq 'H38_SCOUT_V221_PHONE_ACCEPTANCE=true' "$report/packaged-index.html"
          grep -Fq 'VALUE NOT PROVEN' "$report/packaged-index.html"
          grep -Fq 'data-page="track"' "$report/packaged-index.html"
          grep -Fq 'More / Settings' "$report/packaged-index.html"
          for dex in $(zipinfo -1 "$out" 'classes*.dex'); do unzip -p "$out" "$dex"; done | strings > "$report/dex-strings.txt"
          grep -Fq 'Capture now' "$report/dex-strings.txt"
          grep -Fq 'Grand Rapids, MN' "$report/dex-strings.txt"
          grep -Fq 'resume this same search automatically' "$report/dex-strings.txt"
          grep -Fq 'Wrong-area cards are withheld' "$report/dex-strings.txt"
          grep -Fq 'location_verified' "$report/dex-strings.txt"
          if grep -Fq 'Next search' "$report/dex-strings.txt"; then echo '::error::stale Next search UI packaged'; exit 1; fi
          if grep -Fq 'Capture visible' "$report/dex-strings.txt"; then echo '::error::stale Capture visible UI packaged'; exit 1; fi
          echo PASS > "$report/smoke.txt"

      - name: Upload owner-test APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v2.2.1
          path: artifacts/private-reseller-scout-apk/*
          if-no-files-found: warn
          retention-days: 30
