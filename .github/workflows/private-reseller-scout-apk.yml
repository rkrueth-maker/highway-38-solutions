name: Build H38 Private Reseller Scout APK

on:
  pull_request:
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'supabase/functions/reseller-auto-leads-v049/**'
      - 'supabase/functions/reseller-auto-leads-v051/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-reseller-scout-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-reseller-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Verify v0.1.52 install-recovery contract
        shell: bash
        run: |
          set -euo pipefail
          check() { grep -Fq "$1" "$2" || { echo "::error::Missing contract token [$1] in $2"; exit 1; }; }
          assets='reseller/src/main/assets/reseller'
          main='reseller/src/main/java/com/highway38/resellerscout/MainActivity.java'
          v049="$assets/v049-runtime.js"
          v051="$assets/v051-runtime.js"
          check "versionName '0.1.52'" reseller/build.gradle
          check 'versionCode 53' reseller/build.gradle
          check "applicationIdSuffix '.owner52fix'" reseller/build.gradle
          check 'enableV1Signing true' reseller/build.gradle
          check 'enableV2Signing true' reseller/build.gradle
          check 'bundled-v049-plus-v051-installfix' reseller/build.gradle
          check 'H38_V049_RUNTIME_ACTIVE' "$v049"
          check 'Near Penny' "$v049"
          check 'All ranked leads' "$v049"
          check 'H38_V051_RUNTIME_ACTIVE' "$v051"
          check 'artifact-filter-progressive-dg-photo-cache-v051' "$v051"
          check 'reseller-auto-leads-v051' "$v051"
          check 'H38_SCOUT_CAMERAX_PHOTO_V039' "$main"
          if grep -Fq 'All crawler' "$v049"; then echo '::error::Raw crawler dump must not return to the hunt UI'; exit 1; fi
          node --check "$v049"
          node --check "$v051"

      - name: Configure H38 signing key when available
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.H38_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/h38-owner-keystore.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'variant=release' >> "$GITHUB_OUTPUT"
          else
            echo 'variant=debug' >> "$GITHUB_OUTPUT"
          fi

      - name: Compile, align, and explicitly sign private Reseller Scout APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"
          mkdir -p "$report"
          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then
            gradle --no-daemon :reseller:assembleRelease | tee "$report/compile.log"
            apk='reseller/build/outputs/apk/release/reseller-release.apk'
          else
            gradle --no-daemon :reseller:assembleDebug | tee "$report/compile.log"
            apk='reseller/build/outputs/apk/debug/reseller-debug.apk'
          fi

          aligned="$RUNNER_TEMP/h38-reseller-v052-aligned.apk"
          out="$report/H38-Reseller-Scout-Owner-Test-v0.1.52.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$apk" "$aligned"

          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$H38_ANDROID_UPLOAD_KEYSTORE_PATH" \
              --ks-pass "pass:$H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD" \
              --key-pass "pass:$H38_ANDROID_UPLOAD_KEY_PASSWORD" \
              --ks-key-alias "$H38_ANDROID_UPLOAD_KEY_ALIAS" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled false \
              --v4-signing-enabled false \
              --out "$out" "$aligned"
          else
            DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
            test -s "$DEBUG_KEYSTORE" || { echo '::error::Gradle debug keystore not found'; exit 1; }
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$DEBUG_KEYSTORE" \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias androiddebugkey \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled false \
              --v4-signing-enabled false \
              --out "$out" "$aligned"
          fi

          sha256sum "$out" > "$report/H38-Reseller-Scout-Owner-Test-v0.1.52.sha256"
          printf '%s\n' "${{ steps.signing.outputs.variant }}" > "$report/build-variant.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$out" > "$report/zipalign.txt"

      - name: Smoke inspect installable v0.1.52 APK
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.52.apk"
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then
            grep -Fq "package: name='com.highway38.resellerscout' versionCode='53' versionName='0.1.52'" "$report/badging.txt"
          else
            grep -Fq "package: name='com.highway38.resellerscout.owner52fix' versionCode='53' versionName='0.1.52-debug'" "$report/badging.txt"
          fi
          grep -Fq 'Verified using v1 scheme (JAR signing): true' "$report/signing.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          grep -Fq 'Verification succesful' "$report/zipalign.txt"
          unzip -t "$out" > "$report/zip-test.txt"
          grep -Fq 'No errors detected in compressed data' "$report/zip-test.txt"
          unzip -p "$out" 'assets/reseller/index.html' > "$report/packaged-index.html"
          grep -Fq 'data-h38-v052-runtime="bundled-v049-plus-v051-installfix"' "$report/packaged-index.html"
          grep -Fq 'H38_V049_RUNTIME_ACTIVE' "$report/packaged-index.html"
          grep -Fq 'H38_V051_RUNTIME_ACTIVE' "$report/packaged-index.html"
          grep -Fq 'Near Penny' "$report/packaged-index.html"
          grep -Fq 'All ranked leads' "$report/packaged-index.html"
          grep -Fq 'artifact-filter-progressive-dg-photo-cache-v051' "$report/packaged-index.html"
          if grep -Fq '<script src="v049-runtime.js"></script>' "$report/packaged-index.html"; then echo '::error::v049 must be bundled inline'; exit 1; fi
          if grep -Fq '<script src="v051-runtime.js"></script>' "$report/packaged-index.html"; then echo '::error::v051 must be bundled inline'; exit 1; fi

      - name: Upload private owner-test APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-test-v0.1.52
          path: artifacts/private-reseller-scout-apk/*
          if-no-files-found: error
          retention-days: 30
