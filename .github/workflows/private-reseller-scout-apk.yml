name: Build H38 Private Reseller Scout APK

on:
  push:
    branches: [agent/private-reseller-scout]
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'native/h38-site-scanner/android-app/settings.gradle'
      - 'supabase/functions/reseller-auto-leads/**'
      - 'supabase/functions/reseller-stock-check/**'
      - 'supabase/functions/reseller-nearby-stores/**'
      - 'supabase/functions/reseller-opportunity-scan/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
  pull_request:
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'native/h38-site-scanner/android-app/settings.gradle'
      - 'supabase/functions/reseller-auto-leads/**'
      - 'supabase/functions/reseller-stock-check/**'
      - 'supabase/functions/reseller-nearby-stores/**'
      - 'supabase/functions/reseller-opportunity-scan/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-reseller-scout-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-reseller-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Verify v0.1.19 private Scout contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then test "$GITHUB_REF_NAME" = 'agent/private-reseller-scout'; fi
          test -f reseller/src/main/assets/reseller/index.html
          test -f reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          test -f reseller/src/main/java/com/highway38/resellerscout/ResellerScoutApplication.java
          test -f ../../../supabase/functions/reseller-auto-leads/index.ts
          test -f ../../../supabase/functions/reseller-stock-check/index.ts
          test -f ../../../supabase/functions/reseller-nearby-stores/index.ts
          test -f ../../../supabase/functions/reseller-opportunity-scan/index.ts
          grep -Fq "versionName '0.1.19'" reseller/build.gradle
          grep -Fq 'versionCode 20' reseller/build.gradle
          grep -Fq "applicationId 'com.highway38.resellerscout'" reseller/build.gradle
          grep -Fq 'android.intent.action.SEND' reseller/src/main/AndroidManifest.xml
          main='reseller/src/main/java/com/highway38/resellerscout/MainActivity.java'
          for token in REOPEN_RETENTION_STORE_MERGE_V1 ALL_STORES_PARTS_LM_V1 STOCK_RESULT_RETENTION_V1 BROWSE_NONBLOCKING_SEARCH_V1 HAMMER_MUTATION_LOOP_FIXED_V1 'Find item' 'All stores' 'Refresh deals' 'Update location & stores' 'Check price & stock' h38_reseller_item_search_v1 h38_reseller_open_stores_v1 h38_reseller_stock_results_v1 sameArea mergeStoreSnap; do grep -Fq "$token" "$main"; done
          overlay='reseller/src/main/java/com/highway38/resellerscout/ResellerScoutApplication.java'
          for token in AUTOMATIC_OPPORTUNITY_MONITOR_V2 AUTOMATIC_STOCK_QUANTITY_CHECK_V2 h38_reseller_watch_terms_v2 reseller-opportunity-scan 'Automatic opportunity monitor' 'queueStockChecks' 'rememberCurrentQuery'; do grep -Fq "$token" "$overlay"; done
          if grep -Fq 'Search Marketplace' "$overlay" || grep -Fq 'Search Craigslist' "$overlay" || grep -Fq 'Search auctions' "$overlay"; then echo 'Rejected manual external-search buttons' >&2; exit 1; fi
          grep -Fq '<title>H38 Reseller Scout</title>' reseller/src/main/assets/reseller/index.html
          grep -Fq 'All retailers' reseller/src/main/assets/reseller/index.html
          grep -Fq 'Add my find' reseller/src/main/assets/reseller/index.html
          python3 - <<'PY'
          from pathlib import Path
          auto=Path('../../../supabase/functions/reseller-auto-leads/index.ts').read_text()
          stock=Path('../../../supabase/functions/reseller-stock-check/index.ts').read_text()
          nearby=Path('../../../supabase/functions/reseller-nearby-stores/index.ts').read_text()
          opp=Path('../../../supabase/functions/reseller-opportunity-scan/index.ts').read_text()
          for token in ['homeDepotAdapter','walmartAdapter','lowesAdapter','aceAdapter','menardsAdapter','PennyCentral community penny board']:
              assert token in auto, token
          for token in ['Home Depot',"Lowe's",'Walmart','Target','Menards','Fleet Farm','Harbor Freight','Tractor Supply','Dollar General','Dollar Tree','Family Dollar','Northern Tool','Ace Hardware','retailer_blocked','h38_stock_v: 5']:
              assert token in stock, token
          for token in ['incremental-durable-store-scan-v1','reseller_store_discovery_tiles','TILE_BATCH','coverage_tiles_done','coverage_tiles_total','scan_complete','saveTile','loadTiles','areaKey','splitGrid','validPayload','hardware','department_store','electronics','Best Buy','Walgreens','Runnings','L&M Fleet Supply','AutoZone','NAPA Auto Parts',"O'Reilly Auto Parts",'mergeStores']:
              assert token in nearby, token
          for token in ['Craigslist','HiBid','Facebook Marketplace','automatic:true','duluth.craigslist.org','minneapolis.craigslist.org']:
              assert token in opp, token
          PY

      - name: Configure H38 signing key when available
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.H38_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/h38-owner-keystore.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'variant=release' >> "$GITHUB_OUTPUT"
          else
            echo 'variant=debug' >> "$GITHUB_OUTPUT"
          fi

      - name: Compile private Reseller Scout APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then
            gradle --no-daemon --stacktrace :reseller:assembleRelease
            apk='reseller/build/outputs/apk/release/reseller-release.apk'
          else
            gradle --no-daemon --stacktrace :reseller:assembleDebug
            apk='reseller/build/outputs/apk/debug/reseller-debug.apk'
          fi
          test -s "$apk"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"
          out="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.19.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.19.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/signing.txt"

      - name: Smoke inspect built APK
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.19.apk"
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$out" AndroidManifest.xml > "$report/manifest.txt"
          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then
            grep -Fq "package: name='com.highway38.resellerscout' versionCode='20' versionName='0.1.19'" "$report/badging.txt" || { echo 'Release package/version mismatch'; cat "$report/badging.txt"; exit 1; }
          else
            grep -Fq "package: name='com.highway38.resellerscout.debug' versionCode='20' versionName='0.1.19-debug'" "$report/badging.txt" || { echo 'Debug package/version mismatch'; cat "$report/badging.txt"; exit 1; }
          fi
          grep -Fq "application-label:'H38 Reseller Scout'" "$report/badging.txt" || { echo 'Application label mismatch'; cat "$report/badging.txt"; exit 1; }
          : > "$report/classes-strings.txt"
          while IFS= read -r dex; do unzip -p "$out" "$dex" | strings >> "$report/classes-strings.txt"; done < <(zipinfo -1 "$out" | grep -E '^classes[0-9]*\.dex$')
          for token in AUTOMATIC_OPPORTUNITY_MONITOR_V2 AUTOMATIC_STOCK_QUANTITY_CHECK_V2 reseller-opportunity-scan; do
            grep -Fq "$token" "$report/classes-strings.txt" || { echo "Missing APK marker: $token"; exit 1; }
          done
          if [[ "${{ steps.signing.outputs.variant }}" == release ]] && grep -Fq 'CN=Android Debug' "$report/signing.txt"; then echo 'Release artifact unexpectedly uses Android debug signer.' >&2; exit 1; fi

      - name: Upload private owner-test APK
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-test-v0.1.19
          path: artifacts/private-reseller-scout-apk/*
          if-no-files-found: error
          retention-days: 30
