name: Build H38 Private Reseller Scout APK

on:
  push:
    branches:
      - 'agent/private-reseller-scout-ci-*'
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
      - '.scout-ci-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reseller-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Verify v2.5 repair source
        shell: bash
        run: |
          set -euo pipefail
          fb='reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java'
          data='reseller/src/main/assets/reseller/v240-data.js'
          device='reseller/src/main/java/com/highway38/resellerscout/RetailerDeviceCheckManager.java'
          grep -Fq "versionName '2.5.0'" reseller/build.gradle
          grep -Fq 'versionCode 80' reseller/build.gradle
          grep -Fq 'LOCATION_PROOF_TTL_MS' "$fb"
          grep -Fq 'location_verified' "$fb"
          grep -Fq 'selected Scout area' "$fb"
          grep -Fq 'H38_SCOUT_V250_PROVIDER_HARDENING=true' "$data"
          grep -Fq 'DEVICE_STORE_BOUND_CHECK_V250' "$device"
          if grep -Fq 'Exact Grand Rapids, Minnesota location selected' "$fb"; then
            echo '::error::Hardcoded Grand Rapids location authority remains'
            exit 1
          fi

      - name: Compile Owner Scout v2.5.0 APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"
          mkdir -p "$report"
          gradle --no-daemon :reseller:assembleOwner | tee "$report/compile.log"
          apk='reseller/build/outputs/apk/owner/reseller-owner.apk'
          test -f "$apk"
          out="$report/H38-Reseller-Scout-Owner-v2.5.0-location-repair.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$report/H38-Reseller-Scout-Owner-v2.5.0-location-repair.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$out" > "$report/zipalign.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          unzip -t "$out" > "$report/zip-test.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='80' versionName='2.5.0'" "$report/badging.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          grep -Fq 'Verification succesful' "$report/zipalign.txt"
          grep -Fq 'No errors detected in compressed data' "$report/zip-test.txt"
          echo PASS > "$report/build-smoke.txt"

      - name: Upload owner APK
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v2.5.0-location-repair
          path: artifacts/private-reseller-scout-apk/*
          if-no-files-found: warn
          retention-days: 30
