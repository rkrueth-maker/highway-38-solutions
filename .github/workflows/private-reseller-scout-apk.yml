name: Build H38 Private Reseller Scout APK

on:
  pull_request:
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'supabase/functions/reseller-opportunity-scan/**'
      - 'supabase/functions/reseller-opportunity-scan-v4/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-reseller-scout-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-reseller-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Verify v0.1.33 private Scout contract
        shell: bash
        run: |
          set -euo pipefail
          check() { local pattern="$1" file="$2"; grep -Fq "$pattern" "$file" || { echo "::error::Missing contract token [$pattern] in $file"; exit 1; }; }
          test -f reseller/src/main/assets/reseller/index.html
          test -f reseller/src/main/assets/reseller/v027-patch.js
          test -f reseller/src/main/assets/reseller/v027-retailer-extract.js
          test -f reseller/src/main/assets/reseller/v029-saas.js
          test -f reseller/src/main/assets/reseller/v032-cleanup.js
          test -f reseller/src/main/assets/reseller/v033-flow.js
          test -s reseller/src/main/res/drawable/reseller_scout_icon.webp
          echo 'b6a949f4925296fec3ac5b11ce7592a4e47e610bc9f4ac8dcfa4b03821b17792  reseller/src/main/res/drawable/reseller_scout_icon.webp' | sha256sum -c -
          check "versionName '0.1.33'" reseller/build.gradle
          check 'versionCode 34' reseller/build.gradle
          check 'LEGACY_OPPORTUNITY_SCANNER_REMOVED_V1' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutApplication.java
          if grep -Fq 'SOURCE_SCAN_FALLBACK_LIST_V1' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutApplication.java; then exit 1; fi
          for t in H38_RESALE_OPPORTUNITY_ENGINE_V2 H38_FACEBOOK_AUTHENTICATED_BROWSER_V1 H38_DEVICE_RETAILER_STOCK_V1 H38_PHONE_OR_ZIP_LOCATION_V3 H38_RESELLER_SAAS_WORKSPACE_V2 H38_NATIVE_CONTENT_INSETS_V1 H38_SCOUT_DEEP_CLEANUP_V032 H38_SCOUT_DEALS_FLOW_V033; do check "$t" reseller/src/main/java/com/highway38/resellerscout/ResellerScoutPatchProvider.java; done
          check 'v033-flow.js' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutPatchProvider.java
          for t in 'Deals' 'Clearance & penny deals' 'Local auctions' 'Scan an item' 'Watch items' 'reseller-opportunity-scan-v4'; do check "$t" reseller/src/main/assets/reseller/v033-flow.js; done
          check 'Only verified, profit-supported resale opportunities' reseller/src/main/assets/reseller/v027-patch.js
          root="$GITHUB_WORKSPACE/supabase/functions/reseller-opportunity-scan-v4/index.ts"
          check 'verified_profit_v4' "$root"
          check 'ebay_result_cards_v2' "$root"
          check 'fallbackQuery' "$root"
          check 'auction_premium_policy' "$root"
          check 'actual_only' "$root"
          check 'comp_only' "$root"
          if grep -Fq 'DEFAULT_AUCTION_PREMIUM' "$root"; then echo '::error::Auction premium default must not exist'; exit 1; fi
      - name: Configure H38 signing key when available
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.H38_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/h38-owner-keystore.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'variant=release' >> "$GITHUB_OUTPUT"
          else
            echo 'variant=debug' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile private Reseller Scout APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"; mkdir -p "$report"
          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then gradle --no-daemon :reseller:assembleRelease | tee "$report/compile.log"; apk='reseller/build/outputs/apk/release/reseller-release.apk'; else gradle --no-daemon :reseller:assembleDebug | tee "$report/compile.log"; apk='reseller/build/outputs/apk/debug/reseller-debug.apk'; fi
          out="$report/H38-Reseller-Scout-Owner-Test-v0.1.33.apk"; cp "$apk" "$out"; sha256sum "$out" > "$report/H38-Reseller-Scout-Owner-Test-v0.1.33.sha256"; "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"
      - name: Smoke inspect built APK
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.33.apk"; report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then grep -Fq "package: name='com.highway38.resellerscout' versionCode='34' versionName='0.1.33'" "$report/badging.txt"; else grep -Fq "package: name='com.highway38.resellerscout.debug' versionCode='34' versionName='0.1.33-debug'" "$report/badging.txt"; fi
          grep -Fq "application-icon-160:'res/drawable/reseller_scout_icon.webp'" "$report/badging.txt"
          zipinfo -1 "$out" | grep -Fq 'assets/reseller/v033-flow.js'
          unzip -p "$out" 'assets/reseller/v033-flow.js' | grep -Fq 'Clearance & penny deals'
          unzip -p "$out" 'assets/reseller/v033-flow.js' | grep -Fq 'reseller-opportunity-scan-v4'
      - name: Upload private owner-test APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-test-v0.1.33
          path: artifacts/private-reseller-scout-apk/*
          if-no-files-found: error
          retention-days: 30
