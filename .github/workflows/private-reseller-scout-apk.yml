name: Build H38 Private Reseller Scout APK

on:
  push:
    branches: [agent/private-reseller-scout-v028-ci]
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
  pull_request:
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-reseller-scout-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-reseller-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Verify v0.1.28 private Scout contract
        shell: bash
        run: |
          set -euo pipefail
          check() { local pattern="$1" file="$2"; grep -Fq "$pattern" "$file" || { echo "::error::Missing contract token [$pattern] in $file"; exit 1; }; }
          test -f reseller/src/main/assets/reseller/index.html
          test -f reseller/src/main/assets/reseller/v027-patch.js
          test -f reseller/src/main/assets/reseller/v027-retailer-extract.js
          test -f reseller/src/main/assets/reseller/v028-saas.js
          test -f reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          test -f reseller/src/main/java/com/highway38/resellerscout/ResellerScoutApplication.java
          test -f reseller/src/main/java/com/highway38/resellerscout/ResellerScoutPatchProvider.java
          test -f reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java
          test -f reseller/src/main/java/com/highway38/resellerscout/RetailerDeviceCheckManager.java
          test -s reseller/src/main/res/drawable/reseller_scout_icon.webp
          echo 'b6a949f4925296fec3ac5b11ce7592a4e47e610bc9f4ac8dcfa4b03821b17792  reseller/src/main/res/drawable/reseller_scout_icon.webp' | sha256sum -c -
          check "versionName '0.1.28'" reseller/build.gradle
          check 'versionCode 29' reseller/build.gradle
          check "applicationId 'com.highway38.resellerscout'" reseller/build.gradle
          check 'LEGACY_OPPORTUNITY_SCANNER_REMOVED_V1' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutApplication.java
          if grep -Fq 'SOURCE_SCAN_FALLBACK_LIST_V1' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutApplication.java; then echo '::error::legacy source fallback scanner still present'; exit 1; fi
          check 'H38_RESALE_OPPORTUNITY_ENGINE_V2' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutPatchProvider.java
          check 'H38_FACEBOOK_AUTHENTICATED_BROWSER_V1' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutPatchProvider.java
          check 'H38_DEVICE_RETAILER_STOCK_V1' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutPatchProvider.java
          check 'H38_PHONE_OR_ZIP_LOCATION_V3' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutPatchProvider.java
          check 'v028-saas.js' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutPatchProvider.java
          check 'Dashboard' reseller/src/main/assets/reseller/v028-saas.js
          check 'Store Scan' reseller/src/main/assets/reseller/v028-saas.js
          check 'Auctions' reseller/src/main/assets/reseller/v028-saas.js
          check 'Item Tracker' reseller/src/main/assets/reseller/v028-saas.js
          check 'Diagnostics' reseller/src/main/assets/reseller/v028-saas.js
          check 'Only verified, profit-supported resale opportunities' reseller/src/main/assets/reseller/v027-patch.js
          check 'Search Facebook in Scout' reseller/src/main/assets/reseller/v027-patch.js
          check 'Search ZIP' reseller/src/main/assets/reseller/v027-patch.js
          check 'Use phone location' reseller/src/main/assets/reseller/v027-patch.js
          check 'Ad / flyer source' reseller/src/main/assets/reseller/v027-patch.js

      - name: Configure H38 signing key when available
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.H38_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/h38-owner-keystore.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'variant=release' >> "$GITHUB_OUTPUT"
          else
            echo 'variant=debug' >> "$GITHUB_OUTPUT"
          fi

      - name: Compile private Reseller Scout APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"
          mkdir -p "$report"
          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then
            gradle --no-daemon --stacktrace :reseller:assembleRelease 2>&1 | tee "$report/compile.log"
            apk='reseller/build/outputs/apk/release/reseller-release.apk'
          else
            gradle --no-daemon --stacktrace :reseller:assembleDebug 2>&1 | tee "$report/compile.log"
            apk='reseller/build/outputs/apk/debug/reseller-debug.apk'
          fi
          test -s "$apk"
          out="$report/H38-Reseller-Scout-Owner-Test-v0.1.28.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$report/H38-Reseller-Scout-Owner-Test-v0.1.28.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"

      - name: Smoke inspect built APK
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.28.apk"
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$out" AndroidManifest.xml > "$report/manifest.txt"
          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then
            grep -Fq "package: name='com.highway38.resellerscout' versionCode='29' versionName='0.1.28'" "$report/badging.txt"
          else
            grep -Fq "package: name='com.highway38.resellerscout.debug' versionCode='29' versionName='0.1.28-debug'" "$report/badging.txt"
          fi
          grep -Fq "application-label:'H38 Reseller Scout'" "$report/badging.txt"
          grep -Fq "application-icon-160:'res/drawable/reseller_scout_icon.webp'" "$report/badging.txt"
          zipinfo -1 "$out" | grep -Fq 'res/drawable/reseller_scout_icon.webp'
          zipinfo -1 "$out" | grep -Fq 'assets/reseller/v027-patch.js'
          zipinfo -1 "$out" | grep -Fq 'assets/reseller/v027-retailer-extract.js'
          zipinfo -1 "$out" | grep -Fq 'assets/reseller/v028-saas.js'
          unzip -p "$out" 'res/drawable/reseller_scout_icon.webp' > "$RUNNER_TEMP/apk-reseller-icon.webp"
          echo 'b6a949f4925296fec3ac5b11ce7592a4e47e610bc9f4ac8dcfa4b03821b17792  '"$RUNNER_TEMP/apk-reseller-icon.webp" | sha256sum -c -
          unzip -p "$out" 'assets/reseller/v028-saas.js' | grep -Fq 'Store Scan'
          unzip -p "$out" 'assets/reseller/v028-saas.js' | grep -Fq 'Item Tracker'
          unzip -p "$out" 'assets/reseller/v027-patch.js' | grep -Fq 'Only verified, profit-supported resale opportunities'

      - name: Upload private owner-test APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-test-v0.1.28
          path: artifacts/private-reseller-scout-apk/*
          if-no-files-found: error
          retention-days: 30
