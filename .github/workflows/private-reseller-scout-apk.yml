name: Build H38 Private Reseller Scout APK

on:
  push:
    branches: [agent/private-reseller-scout]
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'native/h38-site-scanner/android-app/settings.gradle'
      - '.github/workflows/private-reseller-scout-apk.yml'
  pull_request:
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'native/h38-site-scanner/android-app/settings.gradle'
      - '.github/workflows/private-reseller-scout-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-reseller-scout-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-reseller-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Verify v0.1.24 private Scout contract
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then test "$GITHUB_REF_NAME" = 'agent/private-reseller-scout'; fi
          test -f reseller/src/main/assets/reseller/index.html
          test -f reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          test -f reseller/src/main/java/com/highway38/resellerscout/ResellerScoutApplication.java
          test -f reseller/src/main/java/com/highway38/resellerscout/ResellerScoutPatchProvider.java
          test -s reseller/src/main/res/drawable/reseller_scout_icon.png
          test ! -e reseller/src/main/res/drawable/reseller_scout_launcher.xml
          grep -Fq "versionName '0.1.24'" reseller/build.gradle
          grep -Fq 'versionCode 25' reseller/build.gradle
          grep -Fq "applicationId 'com.highway38.resellerscout'" reseller/build.gradle
          grep -Fq 'android:icon="@drawable/reseller_scout_icon"' reseller/src/main/AndroidManifest.xml
          grep -Fq 'android:roundIcon="@drawable/reseller_scout_icon"' reseller/src/main/AndroidManifest.xml
          grep -Fq 'android:name=".ResellerScoutPatchProvider"' reseller/src/main/AndroidManifest.xml
          grep -Fq 'H38_STRICT_IN_APP_SOURCE_SCAN_V2' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutPatchProvider.java
          grep -Fq 'https://jqukmwtsgcsaruucnqja.supabase.co/functions/v1/reseller-opportunity-scan' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutPatchProvider.java
          grep -Fq 'no manual-search fallback links' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutPatchProvider.java
          grep -Fq 'Manual source fallback suppressed' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutPatchProvider.java
          grep -Fq 'Ad / flyer source' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutApplication.java

      - name: Configure H38 signing key when available
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.H38_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/h38-owner-keystore.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'variant=release' >> "$GITHUB_OUTPUT"
          else
            echo 'variant=debug' >> "$GITHUB_OUTPUT"
          fi

      - name: Compile private Reseller Scout APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then
            gradle --no-daemon --stacktrace :reseller:assembleRelease
            apk='reseller/build/outputs/apk/release/reseller-release.apk'
          else
            gradle --no-daemon --stacktrace :reseller:assembleDebug
            apk='reseller/build/outputs/apk/debug/reseller-debug.apk'
          fi
          test -s "$apk"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"
          out="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.24.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.24.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/signing.txt"

      - name: Smoke inspect built APK
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.24.apk"
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$out" AndroidManifest.xml > "$report/manifest.txt"
          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then
            grep -Fq "package: name='com.highway38.resellerscout' versionCode='25' versionName='0.1.24'" "$report/badging.txt"
          else
            grep -Fq "package: name='com.highway38.resellerscout.debug' versionCode='25' versionName='0.1.24-debug'" "$report/badging.txt"
          fi
          grep -Fq "application-label:'H38 Reseller Scout'" "$report/badging.txt"
          grep -Fq "application-icon-160:'res/drawable/reseller_scout_icon.png'" "$report/badging.txt"
          zipinfo -1 "$out" | grep -Fq 'res/drawable/reseller_scout_icon.png'
          if zipinfo -1 "$out" | grep -Fq 'res/drawable/reseller_scout_launcher.xml'; then exit 1; fi
          : > "$report/classes-strings.txt"
          while IFS= read -r dex; do unzip -p "$out" "$dex" | strings >> "$report/classes-strings.txt"; done < <(zipinfo -1 "$out" | grep -E '^classes[0-9]*\.dex$')
          for token in H38_STRICT_IN_APP_SOURCE_SCAN_V2 'no manual-search fallback links' 'blocked/unavailable' 'Manual source fallback suppressed' 'Ad / flyer source'; do grep -Fq "$token" "$report/classes-strings.txt"; done

      - name: Upload private owner-test APK
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-test-v0.1.24
          path: artifacts/private-reseller-scout-apk/*
          if-no-files-found: error
          retention-days: 30
