name: Build H38 Private Reseller Scout APK

on:
  pull_request:
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'supabase/functions/reseller-*/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
  push:
    branches:
      - 'agent/private-reseller-scout-ci-*'
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'supabase/functions/reseller-*/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
      - '.scout-ci-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reseller-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Verify Scout v2.1.1 wide sellable contract
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"; mkdir -p "$report"
          check(){ grep -Fq "$1" "$2" || { echo "::error::Missing [$1] in $2" | tee -a "$report/contract-failures.txt"; exit 1; }; }
          assets='reseller/src/main/assets/reseller'
          core="$assets/v200-core.js"; hunt="$assets/v200-hunt.js"; auctions="$assets/v200-auctions.js"; discover="$assets/v200-discover.js"; scan="$assets/v200-scan.js"; more="$assets/v200-more.js"; polish="$assets/v210-polish.js"; wide="$assets/v211-wide.js"; index="$assets/index.html"
          fb='reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java'
          dealsFn="$GITHUB_WORKSPACE/supabase/functions/reseller-opportunity-scan-v060/index.ts"
          auctionFn="$GITHUB_WORKSPACE/supabase/functions/reseller-auction-search-v200/index.ts"
          imageFn="$GITHUB_WORKSPACE/supabase/functions/reseller-image-delivery-v201/index.ts"
          check "versionName '2.1.1'" reseller/build.gradle
          check 'versionCode 68' reseller/build.gradle
          check "applicationIdSuffix '.owner'" reseller/build.gradle
          for f in "$core" "$hunt" "$auctions" "$discover" "$scan" "$more" "$polish" "$wide"; do node --check "$f"; done
          check 'v210-polish.js' "$index"; check 'v211-wide.js' "$index"
          check "const H38_DEFAULT_ZIP='55744'" "$core"; check "zip:H38_DEFAULT_ZIP" "$core"; check 'ensureDefaultLocation' "$core"
          check 'retailer-group' "$hunt"; check 'Penny date unknown' "$hunt"; check 'Posted ${posted}' "$hunt"; check 'Last seen ${last}' "$hunt"; check 'physical register scan remains final penny truth' "$hunt"
          check 'H38_SCOUT_V210_SELLABLE' "$polish"; check 'H38_SCOUT_V211_WIDE_ACCEPTANCE' "$wide"
          check "expected_resale:resale" "$wide"; check "status:'bought'" "$wide"; check ".in('status',['bought','sold'])" "$wide"; check 'h38InventoryKey' "$wide"; check 'h38SharedInventoryProbe' "$wide"
          check 'sold_price' "$wide"; check 'actual_fees' "$wide"; check 'actual_profit' "$wide"
          check 'h38WatchEvaluation' "$wide"; check 'Watch ranking logic' "$wide"; check 'Scan to Inventory' "$wide"
          check 'strictImageRetailer(r.retailer)&&!!itemCode(r)' "$wide"; check 'PHOTO<br>RECOVERY' "$wide"; check 'reseller-image-delivery-v201' "$wide"
          check 'Run Facebook pass' "$discover"; check 'captureVisible(true)' "$fb"; check 'Returning to Scout to rank results' "$fb"
          check 'source_search_bound:true' "$dealsFn"; check 'if(d>ctx.radiusMiles)return null' "$dealsFn"; check 'H38_AUCTION_ADAPTERS_V201_TRUTH' "$auctionFn"
          check 'resolveExact' "$imageFn"; check 'exact UPC' "$imageFn"; check 'Image failure never changes penny/store/resale truth' "$imageFn"
          if grep -Fq "status:'inventory'" "$wide"; then echo '::error::v2.1.1 must use database status bought, not inventory' | tee -a "$report/contract-failures.txt"; exit 1; fi
          node <<'NODE'
          const norm=v=>String(v||'').toLowerCase().trim().replace(/\s+/g,' ');
          const digits=v=>String(v||'').replace(/\D/g,'').replace(/^0+/,'');
          const key=x=>{const u=String(x.source_url||x.url||'').split('?')[0].replace(/\/$/,'');if(u)return 'url|'+norm(u);const c=digits(x.upc||x.sku);if(c)return `code|${c}|${Number(x.buy_price||0).toFixed(2)}`;return `title|${norm(x.title)}|${Number(x.buy_price||0).toFixed(2)}`};
          if(key({source_url:'https://x/item/1?a=1',title:'A',buy_price:40})!==key({source_url:'https://x/item/1',title:'A',buy_price:40})) throw Error('inventory canonical URL dedupe fixture failed');
          const actual=(sold,buy,fees)=>Number((sold-buy-fees).toFixed(2));if(actual(125,45,18)!==62)throw Error('actual profit fixture failed');
          const zip='55744';if(zip.length!==5)throw Error('default zip fixture failed');
          const lanes=['furniture','electronics','collectibles','auto parts','sporting goods','appliances'];if(lanes.length<6)throw Error('broad lanes missing');
          NODE
          echo PASS > "$report/contract.txt"

      - name: Configure signing fallback
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.H38_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"; mkdir -p "$report"
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/h38-owner-keystore.jks"; printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"; chmod 600 "$KEYSTORE_PATH"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"; echo "H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"; echo "H38_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"; echo "H38_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo stable-upload-key > "$report/signing-continuity.txt"
          else echo debug-fallback-owner-test > "$report/signing-continuity.txt"; fi

      - name: Compile Owner Scout v2.1.1 APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"; mkdir -p "$report"
          gradle --no-daemon :reseller:assembleOwner | tee "$report/compile.log"
          apk='reseller/build/outputs/apk/owner/reseller-owner.apk'; test -f "$apk"
          out="$report/H38-Reseller-Scout-Owner-v2.1.1.apk"; cp "$apk" "$out"; sha256sum "$out" > "$report/H38-Reseller-Scout-Owner-v2.1.1.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$out" > "$report/zipalign.txt"

      - name: Smoke inspect wide APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"; out="$report/H38-Reseller-Scout-Owner-v2.1.1.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='68' versionName='2.1.1'" "$report/badging.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          grep -Fq 'Verification succesful' "$report/zipalign.txt"
          unzip -t "$out" > "$report/zip-test.txt"; grep -Fq 'No errors detected in compressed data' "$report/zip-test.txt"
          unzip -p "$out" 'assets/reseller/v211-wide.js' > "$report/packaged-v211-wide.js"; node --check "$report/packaged-v211-wide.js"
          grep -Fq 'H38_SCOUT_V211_WIDE_ACCEPTANCE' "$report/packaged-v211-wide.js"; grep -Fq 'h38SharedInventoryProbe' "$report/packaged-v211-wide.js"; grep -Fq 'PHOTO<br>RECOVERY' "$report/packaged-v211-wide.js"
          unzip -p "$out" 'assets/reseller/v200-core.js' > "$report/packaged-core.js"; grep -Fq "H38_DEFAULT_ZIP='55744'" "$report/packaged-core.js"
          unzip -p "$out" 'assets/reseller/v200-hunt.js' > "$report/packaged-hunt.js"; grep -Fq 'retailer-group' "$report/packaged-hunt.js"; grep -Fq 'Penny date unknown' "$report/packaged-hunt.js"; grep -Fq 'physical register scan remains final penny truth' "$report/packaged-hunt.js"
          unzip -p "$out" 'assets/reseller/index.html' > "$report/packaged-index.html"; grep -Fq 'v210-polish.js' "$report/packaged-index.html"; grep -Fq 'v211-wide.js' "$report/packaged-index.html"
          echo PASS > "$report/smoke.txt"

      - name: Upload owner-test APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v2.1.1
          path: artifacts/private-reseller-scout-apk/*
          if-no-files-found: warn
          retention-days: 30
