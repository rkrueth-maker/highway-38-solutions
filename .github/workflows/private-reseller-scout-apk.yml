name: Build H38 Private Reseller Scout APK

on:
  pull_request:
    branches:
      - agent/private-reseller-scout
    paths:
      - '.github/workflows/private-reseller-scout-apk.yml'

permissions:
  contents: write

jobs:
  apply-v017-private-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/private-reseller-scout
          fetch-depth: 0

      - name: Apply v0.1.17 retention and all-store repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main_path=Path('native/h38-site-scanner/android-app/reseller/src/main/java/com/highway38/resellerscout/MainActivity.java')
          nearby_path=Path('supabase/functions/reseller-nearby-stores/index.ts')
          build_path=Path('native/h38-site-scanner/android-app/reseller/build.gradle')
          ci_path=Path('.github/workflows/private-reseller-scout-apk.yml')

          main=main_path.read_text()
          nearby=nearby_path.read_text()
          build=build_path.read_text()
          ci=ci_path.read_text()

          def one(src, old, new, label):
              if old not in src:
                  raise SystemExit(f'missing expected text for {label}')
              return src.replace(old,new,1)

          main=one(main,
              '    private static final String AUTO_CHECK_LIMIT_MARKER = "AUTO_CHECK_HOME_DEPOT_TOP5_V1";\n',
              '    private static final String AUTO_CHECK_LIMIT_MARKER = "AUTO_CHECK_HOME_DEPOT_TOP5_V1";\n'
              '    private static final String REOPEN_RETENTION_MARKER = "REOPEN_RETENTION_STORE_MERGE_V1";\n'
              '    private static final String ALL_STORES_MARKER = "ALL_STORES_PARTS_LM_V1";\n',
              'v017 markers')

          anchor="              function count(kind,s){try{var p=JSON.parse(s.body),a=kind==='store'?p.stores:p.leads;return Array.isArray(a)?a.length:0;}catch(e){return 0;}}\n"
          helper=anchor+"""              function bodyJson(raw){try{return JSON.parse(String(raw||'{}'));}catch(e){return {};}}
              function sameArea(previousBody,init){
                try{
                  var a=bodyJson(previousBody),b=bodyJson((init&&init.body)||'{}');
                  if(String(Number(a.radiusMiles||50))!==String(Number(b.radiusMiles||50)))return false;
                  var alat=Number(a.lat),alon=Number(a.lon),blat=Number(b.lat),blon=Number(b.lon);
                  if(![alat,alon,blat,blon].every(Number.isFinite))return false;
                  return Math.abs(alat-blat)<=0.08&&Math.abs(alon-blon)<=0.12;
                }catch(e){return false;}
              }
              function storeIdentity(x){return String(x.store_key||[x.retailer||x.store_name||'',x.store_address||'',Number(x.lat||0).toFixed(4),Number(x.lon||0).toFixed(4)].join('|'));}
              function mergeStoreSnap(s,init){
                try{
                  var raw=localStorage.getItem(STORE_KEY);if(!raw)return s;
                  var old=JSON.parse(raw);if(!old||Date.now()-Number(old.at||0)>86400000||!sameArea(old.requestBody,init))return s;
                  var current=JSON.parse(s.body),previous=JSON.parse(old.body);
                  if(!Array.isArray(current.stores)||!Array.isArray(previous.stores))return s;
                  var merged=new Map();
                  previous.stores.forEach(function(x){merged.set(storeIdentity(x),x);});
                  current.stores.forEach(function(x){merged.set(storeIdentity(x),x);});
                  current.stores=Array.from(merged.values()).sort(function(a,b){return Number(a.distance_miles||9999)-Number(b.distance_miles||9999);});
                  current.merged_previous=true;s.body=JSON.stringify(current);
                }catch(e){}
                return s;
              }
"""
          main=one(main,anchor,helper,'store cache helpers')
          main=one(main,
              "                  if(count(kind,s)<=0)return;\n                  var copy={body:s.body,status:s.status,statusText:s.statusText,headers:s.headers,at:Date.now(),requestBody:String((init&&init.body)||'')};",
              "                  if(kind==='store')s=mergeStoreSnap(s,init);\n                  if(count(kind,s)<=0)return;\n                  var copy={body:s.body,status:s.status,statusText:s.statusText,headers:s.headers,at:Date.now(),requestBody:String((init&&init.body)||'')};",
              'merge before save')
          main=one(main,
              "                  if(kind==='store'&&String(s.requestBody||'')!==String((init&&init.body)||''))return null;",
              "                  if(kind==='store'&&!sameArea(s.requestBody,init))return null;",
              'same-area persistence')
          main=one(main,
              "                if(kind==='leads'&&!servedPersisted.has(kind)&&persisted){",
              "                if(!servedPersisted.has(kind)&&persisted){",
              'serve persisted stores immediately')
          main=one(main,
              "                    var r=await rawFetch(input,init),s=await snap(r),c=count(kind,s),prior=lastGood.get(key)||loadPersistent(kind,init);",
              "                    var r=await rawFetch(input,init),s=await snap(r);if(kind==='store'&&r.ok&&count(kind,s)>0)s=mergeStoreSnap(s,init);var c=count(kind,s),prior=lastGood.get(key)||loadPersistent(kind,init);",
              'merge live store response')

          main=main.replace(
              'expandedStores=new Set(),openStores=new Set();',
              "expandedStores=new Set((()=>{try{return JSON.parse(localStorage.getItem('h38_reseller_expanded_stores_v1')||'[]')}catch(e){return[]}})()),openStores=new Set((()=>{try{return JSON.parse(localStorage.getItem('h38_reseller_open_stores_v1')||'[]')}catch(e){return[]}})());",
              1)
          main=main.replace(
              "if(d.open)openStores.add(d.dataset.storeKey);else openStores.delete(d.dataset.storeKey)",
              "if(d.open)openStores.add(d.dataset.storeKey);else openStores.delete(d.dataset.storeKey);localStorage.setItem('h38_reseller_open_stores_v1',JSON.stringify(Array.from(openStores)))",
              1)
          main=main.replace(
              "expandedStores.add(b.dataset.more);openStores.add(b.dataset.more);renderStores()",
              "expandedStores.add(b.dataset.more);openStores.add(b.dataset.more);localStorage.setItem('h38_reseller_expanded_stores_v1',JSON.stringify(Array.from(expandedStores)));localStorage.setItem('h38_reseller_open_stores_v1',JSON.stringify(Array.from(openStores)));renderStores()",
              1)
          main=one(main,
              "                    \"$('itemSearch').oninput=renderStores;$('retailerFilter').onchange=renderStores;$('storeFilter').onchange=renderStores;\",",
              "                    \"try{$('itemSearch').value=localStorage.getItem('h38_reseller_item_search_v1')||'';var sf=localStorage.getItem('h38_reseller_store_filter_v1')||'all';if(Array.from($('storeFilter').options).some(o=>o.value===sf))$('storeFilter').value=sf;}catch(e){}$('itemSearch').oninput=()=>{localStorage.setItem('h38_reseller_item_search_v1',$('itemSearch').value||'');renderStores()};$('retailerFilter').onchange=()=>{localStorage.setItem('h38_reseller_retailer_filter_v1',$('retailerFilter').value||'');renderStores()};$('storeFilter').onchange=()=>{localStorage.setItem('h38_reseller_store_filter_v1',$('storeFilter').value||'all');renderStores()};\",",
              'persist search state')

          insert='            html = html.replace("</head>", STORE_FETCH_GUARD + "\\n</head>");\n'
          patch='''            html = replaceRequired(
                    html,
                    "function renderFilters(){const current=$('retailerFilter').value,names=[...new Set([...stores.map(s=>s.retailer),...leads.map(l=>l.retailer),...saved.map(d=>d.retailer)].filter(Boolean))].sort();$('retailerFilter').innerHTML='<option value=\\\"\\\">All retailers</option>'+names.map(x=>`<option>${esc(x)}</option>`).join('');$('retailerFilter').value=names.includes(current)?current:''}",
                    "function renderFilters(){const current=$('retailerFilter').value||localStorage.getItem('h38_reseller_retailer_filter_v1')||'',names=[...new Set([...stores.map(s=>s.retailer),...leads.map(l=>l.retailer),...saved.map(d=>d.retailer)].filter(Boolean))].sort();$('retailerFilter').innerHTML='<option value=\\\"\\\">All stores</option>'+names.map(x=>`<option>${esc(x)}</option>`).join('');$('retailerFilter').value=names.includes(current)?current:''}",
                    "retailer filter persistence"
            );
'''
          if insert not in main: raise SystemExit('missing retailer filter insertion anchor')
          main=main.replace(insert,patch+insert,1)

          main=one(main,
              '              var baseFetch=window.fetch.bind(window);\n              var results=new Map(),pending=new Set(),sigToId=new Map(),queued=new Set();',
              "              var baseFetch=window.fetch.bind(window);\n              function loadStockResults(){try{return new Map(Object.entries(JSON.parse(localStorage.getItem('h38_reseller_stock_results_v1')||'{}')))}catch(e){return new Map()}}\n              function persistStockResults(){try{localStorage.setItem('h38_reseller_stock_results_v1',JSON.stringify(Object.fromEntries(results)))}catch(e){}}\n              var results=loadStockResults(),pending=new Set(),sigToId=new Map(),queued=new Set();",
              'persist stock results')
          main=main.replace('results.set(id,p||{});pending.delete(id);queued.delete(id);decorate(document);','results.set(id,p||{});persistStockResults();pending.delete(id);queued.delete(id);decorate(document);',1)
          main=main.replace("results.set(id,{status:'check_failed',stock_checked:true,stock_status:'unknown'});\n                  pending.delete(id);queued.delete(id);decorate(document);throw e;","results.set(id,{status:'check_failed',stock_checked:true,stock_status:'unknown'});persistStockResults();\n                  pending.delete(id);queued.delete(id);decorate(document);throw e;",1)
          main=main.replace('H38ResellerScoutAndroid/0.1.16-flow-polish','H38ResellerScoutAndroid/0.1.17-retention-stores',1)
          main=main.replace('20260819-multi-retailer-flow-polish-v016','20260819-retention-allstores-parts-lm-v017',1)

          build=one(build,'versionCode 17','versionCode 18','version code')
          build=one(build,"versionName '0.1.16'","versionName '0.1.17'",'version name')

          nearby=one(nearby,
              'const RETAILER_PATTERN = "Home Depot|Lowe|Walmart|Target|Menards|Fleet Farm|Harbor Freight|Tractor Supply|Dollar General|Dollar Tree|Family Dollar|Northern Tool|Ace Hardware";',
              'const RETAILER_PATTERN = "Home Depot|Lowe|Walmart|Target|Menards|Fleet Farm|L&M|L & M|Harbor Freight|Tractor Supply|Dollar General|Dollar Tree|Family Dollar|Northern Tool|Ace Hardware|AutoZone|O.Reilly|NAPA|Advance Auto Parts|Carquest|Auto Value|Parts City|Bumper to Bumper";',
              'retailer discovery')
          nearby=one(nearby,
              "const RETAILER_RE = /Home Depot|Lowe'?s|Walmart|Target|Menards|Fleet Farm|Harbor Freight|Tractor Supply|Dollar General|Dollar Tree|Family Dollar|Northern Tool|Ace Hardware/i;",
              "const RETAILER_RE = /Home Depot|Lowe'?s|Walmart|Target|Menards|Fleet Farm|L\\s*(?:&|and)\\s*M|Harbor Freight|Tractor Supply|Dollar General|Dollar Tree|Family Dollar|Northern Tool|Ace Hardware|AutoZone|O'Reilly|NAPA|Advance Auto Parts|Carquest|Auto Value|Parts City|Bumper to Bumper/i;",
              'retailer regex')
          nearby=one(nearby,
              'function canonical(name:string){const s=name.toLowerCase();if(s.includes("home depot"))return "Home Depot";',
              'function canonical(name:string){const s=name.toLowerCase();if(s.includes("l&m")||s.includes("l & m")||s.includes("l and m"))return "L&M Fleet Supply";if(s.includes("autozone"))return "AutoZone";if(s.includes("o\'reilly"))return "O\'Reilly Auto Parts";if(s.includes("napa"))return "NAPA Auto Parts";if(s.includes("advance auto"))return "Advance Auto Parts";if(s.includes("carquest"))return "Carquest";if(s.includes("auto value"))return "Auto Value";if(s.includes("parts city"))return "Parts City";if(s.includes("bumper to bumper"))return "Bumper to Bumper";if(s.includes("home depot"))return "Home Depot";',
              'canonical discovery')
          nearby=one(nearby,
              '  return `[out:json][timeout:7];(nwr["shop"]["name"~"${RETAILER_PATTERN}",i](${area});nwr["shop"]["brand"~"${RETAILER_PATTERN}",i](${area}););out center tags qt;`;',
              '  return `[out:json][timeout:7];(nwr["shop"]["name"~"${RETAILER_PATTERN}",i](${area});nwr["shop"]["brand"~"${RETAILER_PATTERN}",i](${area});nwr["shop"="car_parts"](${area}););out center tags qt;`;',
              'all parts query')
          nearby=one(nearby,
              '    if(!name || !RETAILER_RE.test(name) || !Number.isFinite(slat) || !Number.isFinite(slon)) return null;',
              '    const isParts=String(t.shop||"").toLowerCase()==="car_parts";\n    if(!name || (!RETAILER_RE.test(name)&&!isParts) || !Number.isFinite(slat) || !Number.isFinite(slon)) return null;',
              'independent parts')
          nearby=one(nearby,
              '    const work=buildPayload(lat,lon,radiusMiles).then(payload=>{\n      cache.set(key,{at:Date.now(),payload,ttl:payload.partial?PARTIAL_CACHE_TTL_MS:CACHE_TTL_MS});\n      return payload;\n    }).finally(()=>inflight.delete(key));',
              '    const work=buildPayload(lat,lon,radiusMiles).then(payload=>{\n      const previous=cache.get(key)?.payload;\n      if(previous&&Array.isArray(previous.stores)&&Array.isArray(payload.stores)){\n        const merged=new Map(previous.stores.map((s:any)=>[String(s.store_key||`${s.retailer}|${s.store_address}`),s]));\n        payload.stores.forEach((s:any)=>merged.set(String(s.store_key||`${s.retailer}|${s.store_address}`),s));\n        payload.stores=[...merged.values()].sort((a:any,b:any)=>Number(a.distance_miles||9999)-Number(b.distance_miles||9999));\n        payload.merged_previous=true;\n      }\n      cache.set(key,{at:Date.now(),payload,ttl:payload.partial?PARTIAL_CACHE_TTL_MS:CACHE_TTL_MS});\n      return payload;\n    }).finally(()=>inflight.delete(key));',
              'server store merge')

          ci=ci.replace("      - 'supabase/functions/reseller-stock-check/**'\n", "      - 'supabase/functions/reseller-stock-check/**'\n      - 'supabase/functions/reseller-nearby-stores/**'\n")
          ci=ci.replace("versionName '0.1.16'","versionName '0.1.17'")
          ci=ci.replace('versionCode 17','versionCode 18')
          ci=ci.replace('h38-reseller-scout-owner-test-v0.1.16','h38-reseller-scout-owner-test-v0.1.17')
          ci=ci.replace('H38-Reseller-Scout-Owner-Test-v0.1.16','H38-Reseller-Scout-Owner-Test-v0.1.17')
          ci=ci.replace("          grep -Fq \"kind==='leads'\" reseller/src/main/java/com/highway38/resellerscout/MainActivity.java\n", "          grep -Fq '!servedPersisted.has(kind)' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java\n          grep -Fq 'REOPEN_RETENTION_STORE_MERGE_V1' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java\n          grep -Fq 'ALL_STORES_PARTS_LM_V1' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java\n          grep -Fq 'h38_reseller_stock_results_v1' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java\n")
          ci=ci.replace("          stock = Path('../../../supabase/functions/reseller-stock-check/index.ts').read_text()\n", "          stock = Path('../../../supabase/functions/reseller-stock-check/index.ts').read_text()\n          nearby = Path('../../../supabase/functions/reseller-nearby-stores/index.ts').read_text()\n")
          ci=ci.replace("          assert \"await Promise.all([loadLeads(true),loadSaved()])\" in main, 'deal refresh reruns store discovery'\n", "          assert \"await Promise.all([loadLeads(true),loadSaved()])\" in main, 'deal refresh reruns store discovery'\n          for token in ['L&M Fleet Supply','AutoZone','NAPA Auto Parts','car_parts','merged_previous']:\n              assert token in nearby, f'missing expanded nearby store behavior: {token}'\n          assert \"if(!servedPersisted.has(kind)&&persisted)\" in main\n          assert 'sameArea(s.requestBody,init)' in main\n")

          main_path.write_text(main)
          nearby_path.write_text(nearby)
          build_path.write_text(build)
          ci_path.write_text(ci)
          PY

      - name: Commit repair to private branch
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "versionName '0.1.17'" native/h38-site-scanner/android-app/reseller/build.gradle
          grep -Fq 'L&M Fleet Supply' supabase/functions/reseller-nearby-stores/index.ts
          grep -Fq 'car_parts' supabase/functions/reseller-nearby-stores/index.ts
          git config user.name 'H38 Reseller Repair'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/reseller-retention-stores-v017.yml .github/reseller-v017.trigger || true
          git add native/h38-site-scanner/android-app/reseller/src/main/java/com/highway38/resellerscout/MainActivity.java \
                  native/h38-site-scanner/android-app/reseller/build.gradle \
                  supabase/functions/reseller-nearby-stores/index.ts \
                  .github/workflows/private-reseller-scout-apk.yml
          git commit -m 'Retain Reseller Scout state and expand nearby stores'
          git push origin HEAD:agent/private-reseller-scout
