name: Build H38 Private Reseller Scout APK

on:
  pull_request:
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'supabase/functions/reseller-auto-leads-v044/**'
      - 'supabase/functions/reseller-item-research-v044/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-reseller-scout-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-reseller-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Verify v0.1.44 private Scout contract
        shell: bash
        run: |
          set -euo pipefail
          check() { grep -Fq "$1" "$2" || { echo "::error::Missing contract token [$1] in $2"; exit 1; }; }
          assets='reseller/src/main/assets/reseller'
          research="$assets/v035-research.js"
          leads="$GITHUB_WORKSPACE/supabase/functions/reseller-auto-leads-v044/index.ts"
          market="$GITHUB_WORKSPACE/supabase/functions/reseller-item-research-v044/index.ts"
          check "versionName '0.1.44'" reseller/build.gradle
          check 'versionCode 45' reseller/build.gradle
          check "applicationIdSuffix '.owner44'" reseller/build.gradle
          check 'H38_RESEARCH_RESET_V044' "$research"
          check 'New item / photo search' "$research"
          check "reseller-auto-leads-v044" "$research"
          check "reseller-item-research-v044" "$research"
          check "Release date" "$research"
          check 'full-pennycentral-document-v044' "$leads"
          check 'pennycentral_document_complete' "$leads"
          check 'last_seen_label' "$leads"
          check 'release_date' "$leads"
          check 'Same retailer + SKU/UPC is one item' "$leads"
          check 'web_search_preview' "$market"
          check 'Web completed-sale evidence' "$market"
          check 'active and retail prices are context only' "$market"
          check 'H38_SCOUT_CAMERAX_PHOTO_V039' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          if grep -Fq 'ACTION_IMAGE_CAPTURE' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java; then echo '::error::External OEM image capture is forbidden'; exit 1; fi
          node --check "$assets/v035-research.js"
          node --check "$assets/v035-app.js"
          node --check "$assets/v037-physical.js"
          node --check "$assets/v041-market.js"
          node -e "const fs=require('fs'),h=fs.readFileSync('$assets/index.html','utf8'),s=[...h.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)].map(x=>x[1]);for(const [i,x] of s.entries()){new Function(x);console.log('inline-script-'+i+' ok')}"
      - name: Configure H38 signing key when available
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.H38_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/h38-owner-keystore.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'variant=release' >> "$GITHUB_OUTPUT"
          else
            echo 'variant=debug' >> "$GITHUB_OUTPUT"
          fi
      - name: Compile private Reseller Scout APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"; mkdir -p "$report"
          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then
            gradle --no-daemon :reseller:assembleRelease | tee "$report/compile.log"
            apk='reseller/build/outputs/apk/release/reseller-release.apk'
          else
            gradle --no-daemon :reseller:assembleDebug | tee "$report/compile.log"
            apk='reseller/build/outputs/apk/debug/reseller-debug.apk'
          fi
          out="$report/H38-Reseller-Scout-Owner-Test-v0.1.44.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$report/H38-Reseller-Scout-Owner-Test-v0.1.44.sha256"
          printf '%s\n' "${{ steps.signing.outputs.variant }}" > "$report/build-variant.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"
      - name: Smoke inspect built APK
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.44.apk"
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then
            grep -Fq "package: name='com.highway38.resellerscout' versionCode='45' versionName='0.1.44'" "$report/badging.txt"
          else
            grep -Fq "package: name='com.highway38.resellerscout.owner44' versionCode='45' versionName='0.1.44-debug'" "$report/badging.txt"
          fi
          unzip -p "$out" 'assets/reseller/v035-research.js' | grep -Fq 'H38_RESEARCH_RESET_V044'
          unzip -p "$out" 'assets/reseller/v035-research.js' | grep -Fq 'reseller-auto-leads-v044'
          unzip -p "$out" 'assets/reseller/v035-research.js' | grep -Fq 'reseller-item-research-v044'
          unzip -p "$out" 'assets/reseller/v035-research.js' | grep -Fq 'Release date'
          unzip -p "$out" 'assets/reseller/v037-physical.js' | grep -Fq 'H38_DEEP_ACCEPTANCE_V038'
      - name: Upload private owner-test APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-test-v0.1.44
          path: artifacts/private-reseller-scout-apk/*
          if-no-files-found: error
          retention-days: 30
