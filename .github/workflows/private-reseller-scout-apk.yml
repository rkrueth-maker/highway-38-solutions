name: Build H38 Private Reseller Scout APK

on:
  pull_request:
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'supabase/functions/reseller-auto-leads-v049/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-reseller-scout-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-reseller-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Verify v0.1.50 runtime handoff contract
        shell: bash
        run: |
          set -euo pipefail
          check() { grep -Fq "$1" "$2" || { echo "::error::Missing [$1] in $2"; exit 1; }; }
          assets='reseller/src/main/assets/reseller'
          main='reseller/src/main/java/com/highway38/resellerscout/MainActivity.java'
          foundation="$assets/v045-runtime.js"
          runtime="$assets/v049-runtime.js"
          check "versionName '0.1.50'" reseller/build.gradle
          check 'versionCode 51' reseller/build.gradle
          check "applicationIdSuffix '.owner50'" reseller/build.gradle
          check 'bundled-inline-after-v048' reseller/build.gradle
          check 'window.addEventListener("load"' reseller/build.gradle
          check 'runtimeFile.getText' reseller/build.gradle
          check 'H38_V045_RUNTIME_INLINED' "$main"
          check 'v045-runtime.js' "$main"
          check 'H38_V048_RUNTIME_ACTIVE' "$foundation"
          check 'H38_V049_RUNTIME_ACTIVE' "$runtime"
          check 'near-penny-all-store-leads-dg-photo-v049' "$runtime"
          check 'Near Penny' "$runtime"
          check 'All ranked leads' "$runtime"
          check 'data-v049-check' "$runtime"
          check 'Check next 5' "$runtime"
          check 'Check next 10' "$runtime"
          check 'storeBatchV049' "$runtime"
          check 'reseller-auto-leads-v049' "$runtime"
          if grep -Fq 'All crawler' "$runtime"; then echo '::error::v049 actionable hunt UI must not contain All crawler'; exit 1; fi
          node --check "$foundation"
          node --check "$runtime"

      - name: Configure H38 signing key when available
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.H38_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/h38-owner-keystore.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "H38_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'variant=release' >> "$GITHUB_OUTPUT"
          else
            echo 'variant=debug' >> "$GITHUB_OUTPUT"
          fi

      - name: Compile private Reseller Scout APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"; mkdir -p "$report"
          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then
            gradle --no-daemon :reseller:assembleRelease | tee "$report/compile.log"
            apk='reseller/build/outputs/apk/release/reseller-release.apk'
          else
            gradle --no-daemon :reseller:assembleDebug | tee "$report/compile.log"
            apk='reseller/build/outputs/apk/debug/reseller-debug.apk'
          fi
          out="$report/H38-Reseller-Scout-Owner-Test-v0.1.50.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$report/H38-Reseller-Scout-Owner-Test-v0.1.50.sha256"
          printf '%s\n' "${{ steps.signing.outputs.variant }}" > "$report/build-variant.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"

      - name: Smoke inspect packaged runtime authority
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.50.apk"
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          if [[ "${{ steps.signing.outputs.variant }}" == release ]]; then
            grep -Fq "package: name='com.highway38.resellerscout' versionCode='51' versionName='0.1.50'" "$report/badging.txt"
          else
            grep -Fq "package: name='com.highway38.resellerscout.owner50' versionCode='51' versionName='0.1.50-debug'" "$report/badging.txt"
          fi
          index="$RUNNER_TEMP/v050-index.html"
          unzip -p "$out" 'assets/reseller/index.html' > "$index"
          grep -Fq 'data-h38-v050-runtime="bundled-inline-after-v048"' "$index"
          grep -Fq 'window.addEventListener("load"' "$index"
          grep -Fq 'H38_V049_RUNTIME_ACTIVE' "$index"
          grep -Fq 'Near Penny' "$index"
          grep -Fq 'All ranked leads' "$index"
          grep -Fq 'reseller-auto-leads-v049' "$index"
          if grep -Fq '<script src="v049-runtime.js"></script>' "$index"; then echo '::error::External v049 runtime tag survived packaging'; exit 1; fi
          zipinfo -1 "$out" | grep -Fq 'assets/reseller/v045-runtime.js'
          zipinfo -1 "$out" | grep -Fq 'assets/reseller/v049-runtime.js'
          echo 'v0.1.50 packaged runtime handoff: PASS' > "$report/runtime-handoff.txt"

      - name: Upload private owner-test APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-test-v0.1.50
          path: artifacts/private-reseller-scout-apk/*
          if-no-files-found: error
          retention-days: 30
