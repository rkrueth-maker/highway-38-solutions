name: Build H38 Private Reseller Scout APK

on:
  pull_request:
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'supabase/functions/reseller-*/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reseller-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Verify Scout v2.1.0 sellable contract
        shell: bash
        run: |
          set -euo pipefail
          check(){ grep -Fq "$1" "$2" || { echo "::error::Missing [$1] in $2"; exit 1; }; }
          assets='reseller/src/main/assets/reseller'
          core="$assets/v200-core.js"; hunt="$assets/v200-hunt.js"; discover="$assets/v200-discover.js"; more="$assets/v200-more.js"; polish="$assets/v210-polish.js"; index="$assets/index.html"
          fb='reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java'
          dealsFn="$GITHUB_WORKSPACE/supabase/functions/reseller-opportunity-scan-v060/index.ts"
          auctionFn="$GITHUB_WORKSPACE/supabase/functions/reseller-auction-search-v200/index.ts"
          check "versionName '2.1.0'" reseller/build.gradle
          check 'versionCode 67' reseller/build.gradle
          check "applicationIdSuffix '.owner'" reseller/build.gradle
          for f in "$core" "$hunt" "$discover" "$more" "$polish"; do node --check "$f"; done
          check 'v210-polish.js' "$index"
          check "const H38_DEFAULT_ZIP='55744'" "$core"
          check "zip:H38_DEFAULT_ZIP" "$core"
          check 'ensureDefaultLocation' "$core"
          check 'recordPurchase' "$core"
          check 'imageCache' "$core"
          check 'cacheImage' "$core"
          check 'retailer-group' "$hunt"
          check 'Penny date unknown' "$hunt"
          check 'Posted ${posted}' "$hunt"
          check 'physical register scan remains final penny truth' "$hunt"
          check 'H38_SCOUT_V210_SELLABLE' "$polish"
          check 'Last-known-good verified image' "$polish"
          check 'I bought it' "$polish"
          check 'min_profit' "$polish"
          check 'Inventory lifecycle' "$polish"
          check 'Broad-profit 55744' "$polish"
          check 'Image recovery cache' "$polish"
          check 'Facebook capture store' "$polish"
          check 'Run Facebook pass' "$discover"
          check 'captureVisible(true)' "$fb"
          check 'Returning to Scout to rank results' "$fb"
          check 'source_search_bound:true' "$dealsFn"
          check 'if(d>ctx.radiusMiles)return null' "$dealsFn"
          check 'H38_AUCTION_ADAPTERS_V201_TRUTH' "$auctionFn"
          node <<'NODE'
          const lanes=['furniture','electronics','collectibles','auto parts','sporting goods','appliances'];
          if(lanes.length<6)throw Error('broad lanes missing');
          const zip='55744';if(zip.length!==5)throw Error('default zip invalid');
          const price=(resale,buy)=>resale-buy;if(price(100,40)!==60)throw Error('inventory spread fixture');
          NODE

      - name: Configure signing fallback
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.H38_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"; mkdir -p "$report"
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/h38-owner-keystore.jks"; printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"; chmod 600 "$KEYSTORE_PATH"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"; echo "H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"; echo "H38_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"; echo "H38_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo stable-upload-key > "$report/signing-continuity.txt"
          else echo debug-fallback-owner-test > "$report/signing-continuity.txt"; fi

      - name: Compile Owner Scout v2.1.0 APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"; mkdir -p "$report"
          gradle --no-daemon :reseller:assembleOwner | tee "$report/compile.log"
          apk='reseller/build/outputs/apk/owner/reseller-owner.apk'; test -f "$apk"
          out="$report/H38-Reseller-Scout-Owner-v2.1.0.apk"; cp "$apk" "$out"; sha256sum "$out" > "$report/H38-Reseller-Scout-Owner-v2.1.0.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$out" > "$report/zipalign.txt"

      - name: Smoke inspect sellable APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"; out="$report/H38-Reseller-Scout-Owner-v2.1.0.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='67' versionName='2.1.0'" "$report/badging.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          grep -Fq 'Verification succesful' "$report/zipalign.txt"
          unzip -t "$out" > "$report/zip-test.txt"; grep -Fq 'No errors detected in compressed data' "$report/zip-test.txt"
          unzip -p "$out" 'assets/reseller/v210-polish.js' > "$report/packaged-v210-polish.js"; node --check "$report/packaged-v210-polish.js"
          unzip -p "$out" 'assets/reseller/v200-core.js' > "$report/packaged-core.js"; grep -Fq "H38_DEFAULT_ZIP='55744'" "$report/packaged-core.js"
          unzip -p "$out" 'assets/reseller/v200-hunt.js' > "$report/packaged-hunt.js"; grep -Fq 'retailer-group' "$report/packaged-hunt.js"; grep -Fq 'Penny date unknown' "$report/packaged-hunt.js"
          unzip -p "$out" 'assets/reseller/index.html' > "$report/packaged-index.html"; grep -Fq 'v210-polish.js' "$report/packaged-index.html"

      - name: Upload owner-test APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v2.1.0
          path: artifacts/private-reseller-scout-apk/*
          if-no-files-found: error
          retention-days: 30
