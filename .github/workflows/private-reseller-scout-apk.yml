name: Build H38 Private Reseller Scout APK

on:
  push:
    branches:
      - agent/private-reseller-scout
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'native/h38-site-scanner/android-app/settings.gradle'
      - 'supabase/functions/reseller-auto-leads/**'
      - 'supabase/functions/reseller-stock-check/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
  pull_request:
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'native/h38-site-scanner/android-app/settings.gradle'
      - 'supabase/functions/reseller-auto-leads/**'
      - 'supabase/functions/reseller-stock-check/**'
      - '.github/workflows/private-reseller-scout-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-reseller-scout-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-reseller-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify Home Depot penny-store workflow
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            test "$HEAD_REF" = 'agent/private-reseller-scout'
          else
            test "$GITHUB_REF_NAME" = 'agent/private-reseller-scout'
          fi

          test -f reseller/src/main/assets/reseller/index.html
          test -f reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          test -f ../../../supabase/functions/reseller-auto-leads/index.ts
          test -f ../../../supabase/functions/reseller-stock-check/index.ts

          grep -Fq "versionName '0.1.13'" reseller/build.gradle
          grep -Fq "versionCode 14" reseller/build.gradle
          grep -Fq "applicationId 'com.highway38.resellerscout'" reseller/build.gradle
          grep -Fq 'HOME_DEPOT_PENNY_AUTO_PRICE_QTY_ON_STORE_OPEN_V1' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          grep -Fq 'H38 Home Depot Penny Scout' reseller/src/main/assets/reseller/index.html
          grep -Fq 'Closed stores make no quantity requests.' reseller/src/main/assets/reseller/index.html
          grep -Fq 'autoCheckStore' reseller/src/main/assets/reseller/index.html
          grep -Fq 'i*1700' reseller/src/main/assets/reseller/index.html
          grep -Fq 'STORE QTY' reseller/src/main/assets/reseller/index.html
          grep -Fq 'This store page' reseller/src/main/assets/reseller/index.html
          grep -Fq "URL+'/functions/v1/reseller-stock-check'" reseller/src/main/assets/reseller/index.html
          grep -Fq 'PennyCentral community penny board' ../../../supabase/functions/reseller-auto-leads/index.ts
          grep -Fq 'community_reports' ../../../supabase/functions/reseller-auto-leads/index.ts
          grep -Fq 'home-depot-penny-community-v1' ../../../supabase/functions/reseller-auto-leads/index.ts
          grep -Fq 'storeSelection' ../../../supabase/functions/reseller-stock-check/index.ts
          grep -Fq 'function pricePair' ../../../supabase/functions/reseller-stock-check/index.ts
          grep -Fq 'function exactCount' ../../../supabase/functions/reseller-stock-check/index.ts
          grep -Fq 'penny_price_detected' ../../../supabase/functions/reseller-stock-check/index.ts
          grep -Fq 'h38_stock_v: 3' ../../../supabase/functions/reseller-stock-check/index.ts

          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('reseller/src/main/assets/reseller/index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, re.I)
          Path('/tmp/reseller-inline.js').write_text('\n'.join(s for s in scripts if s.strip()))
          assert '<option value="50" selected>50 miles</option>' in html
          assert 'openStores.add(sk);autoCheckStore(sk)' in html
          assert "norm(s.retailer)==='home depot'" in html
          assert 'current_price' in html
          assert 'stock_count' in html
          PY
          node --check /tmp/reseller-inline.js

      - name: Configure H38 signing key when available
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.H38_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" && "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/h38-owner-keystore.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            {
              echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "H38_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "H38_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo 'variant=release' >> "$GITHUB_OUTPUT"
          else
            echo 'variant=debug' >> "$GITHUB_OUTPUT"
          fi

      - name: Compile private Reseller Scout APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.variant }}" == 'release' ]]; then
            gradle --no-daemon --stacktrace :reseller:assembleRelease
            apk='reseller/build/outputs/apk/release/reseller-release.apk'
          else
            gradle --no-daemon --stacktrace :reseller:assembleDebug
            apk='reseller/build/outputs/apk/debug/reseller-debug.apk'
          fi
          test -s "$apk"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk"
          cp "$apk" "$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.13.apk"
          sha256sum "$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.13.apk" > "$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.13.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/H38-Reseller-Scout-Owner-Test-v0.1.13.apk" > "$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/signing.txt"
          printf 'event=%s\nref=%s\nhead_ref=%s\ncommit=%s\nvariant=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_REF_NAME" "${HEAD_REF:-}" "$GITHUB_SHA" "${{ steps.signing.outputs.variant }}" > "$GITHUB_WORKSPACE/artifacts/private-reseller-scout-apk/BUILD.txt"

      - name: Upload private owner-test APK
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-test-v0.1.13
          path: artifacts/private-reseller-scout-apk/*
          if-no-files-found: error
          retention-days: 30
