name: Visual quality repair runner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/visual-quality-repair-runner.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/visual-quality-gate
          fetch-depth: 0
      - name: Repair visuals and permanent checks
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o assets/contractor-demo/flower-after-same-house.png 'https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:68981b12-0962-4cd4-8420-23cb92669336'
          file assets/contractor-demo/flower-after-same-house.png | grep -q PNG
          test "$(stat -c%s assets/contractor-demo/flower-after-same-house.png)" -gt 50000
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('sample-library-now.html'); s=p.read_text()
          s=s.replace('flower-after-same-house.svg?v=20260724-same-house-v1','flower-after-same-house.png?v=20260724-photo-v2')
          s=s.replace('irrigation-before-clean.svg?v=20260724-clean-labels-v1','irrigation-before.webp?v=20260722-direct-v2')
          s=s.replace('irrigation-after-clean.svg?v=20260724-clean-labels-v1','irrigation-after.webp?v=20260722-direct-v2')
          old='<article class="project-card"><div class="project-visual"><figure><span>Before</span><img src="assets/demo-workthroughs/irrigation-before.webp'
          s=s.replace(old,old.replace('<article class="project-card">','<article class="project-card" data-project="irrigation">'))
          crop='.project-card[data-project="irrigation"] .project-visual figure{overflow:hidden}.project-card[data-project="irrigation"] .project-visual img{height:calc(100% + 52px);transform:translateY(-38px);object-fit:cover}'
          if 'data-project="irrigation"]' not in s: s=s.replace('</style></head>',crop+'</style></head>')
          p.write_text(s)
          q=Path('flower-garden-quote-complete.html'); q.write_text(q.read_text().replace('flower-after-same-house.svg?v=20260724-same-house-v1','flower-after-same-house.png?v=20260724-photo-v2'))
          mp=Path('scripts/config/approved-public-image-placements.json'); m=json.loads(mp.read_text()); m['policyVersion']='2026-07-24-rendered-visual-quality-gate-v3'
          for item in m['pages']['sample-library-now.html']:
            role=item.get('role')
            if role=='example-01-after': item['src']='assets/contractor-demo/flower-after-same-house.png'
            elif role=='example-06-before': item['src']='assets/demo-workthroughs/irrigation-before.webp'
            elif role=='example-06-after': item['src']='assets/demo-workthroughs/irrigation-after.webp'
          mp.write_text(json.dumps(m,indent=2)+'\n')
          v=Path('scripts/verify-public-image-placements.js'); v.write_text(v.read_text().replace("'irrigation-before-clean.svg','irrigation-after-clean.svg'","'irrigation-before.webp','irrigation-after.webp'"))
          w=Path('.github/workflows/pages.yml'); y=w.read_text().replace('flower-after-same-house.svg','flower-after-same-house.png').replace('irrigation-before-clean.svg','irrigation-before.webp').replace('irrigation-after-clean.svg','irrigation-after.webp')
          y=y.replace('before_svg=', 'before_image=').replace('after_svg=', 'after_image=').replace('<<<"$before_svg"','<<<"$before_image"').replace('<<<"$after_svg"','<<<"$after_image"').replace("grep -Fq '<svg'",'test -n')
          w.write_text(y)
          a=Path('AGENTS.md'); text=a.read_text(); gate='''\n## Rendered Visual Acceptance Gate\n\n1. Customer-facing visual changes must use a branch and pull request; do not commit them directly to `main`.\n2. Photographic cards must use directly renderable PNG, JPEG, or WebP files. SVG wrappers that embed raster photographs are prohibited.\n3. File existence, HTTP 200, valid signatures, and non-empty screenshot files do not prove an image rendered.\n4. Browser verification must check every customer-facing image for `complete`, nonzero `naturalWidth` and `naturalHeight`, successful canvas decoding, visible pixel variance, and nonblank alpha coverage.\n5. Project Examples requires full-page desktop and mobile screenshots from the PR build and cache-busted live deployment.\n6. Technical deployment PASS is not visual acceptance. Visual acceptance requires review of rendered screenshots.\n7. Before/after pairs must be the same property or object, or clearly say the after image is representative.\n8. Cartoon, vector, blank, malformed, unrelated, or visibly unrealistic project imagery is a release blocker.\n'''
          if '## Rendered Visual Acceptance Gate' not in text: text=text.replace('## Image Verification Rules',gate+'\n## Image Verification Rules')
          a.write_text(text)
          r=Path('docs/architecture/PUBLIC_WEBSITE_CHANGE_RULES.md'); text=r.read_text(); section='''## 2A. Rendered visual acceptance\n\n- All customer-facing visual changes require a pull request and browser-regression evidence.\n- Photographic content must use direct PNG, JPEG, or WebP files; nested raster photographs inside SVG are prohibited.\n- Browser checks must verify decode dimensions and nonblank pixel content for every project image.\n- Desktop and mobile screenshots must be reviewed before merge and after live deployment.\n- Technical deployment success is not visual acceptance.\n\n'''
          if '## 2A. Rendered visual acceptance' not in text: text=text.replace('## 3. Adding a page',section+'## 3. Adding a page')
          r.write_text(text)
          smoke=Path('scripts/browser-commercial-smoke.sh'); b=smoke.read_text(); anchor='pass "rendered Project Examples uses the six controlled deck irrigation and kitchen images"\n'
          block=r'''pass "rendered Project Examples uses the six controlled deck irrigation and kitchen images"
node <<'NODE'
const { chromium } = require('playwright');
(async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1440,height:1200}});await page.goto('http://127.0.0.1:8000/sample-library-now.html',{waitUntil:'networkidle'});const rs=await page.$$eval('.project-visual img',imgs=>imgs.map(img=>{const c=document.createElement('canvas');c.width=Math.min(img.naturalWidth,160);c.height=Math.min(img.naturalHeight,90);const x=c.getContext('2d');let variance=-1,alpha=0;try{x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data;let s=0,s2=0,n=0;for(let i=0;i<d.length;i+=4){const v=(d[i]+d[i+1]+d[i+2])/3;s+=v;s2+=v*v;alpha+=d[i+3];n++;}variance=s2/n-(s/n)**2;}catch(e){}return{src:img.getAttribute('src'),complete:img.complete,w:img.naturalWidth,h:img.naturalHeight,variance,alpha};}));console.log(rs);for(const r of rs){if(!r.complete||r.w<100||r.h<100||r.variance<25||r.alpha<=0)throw new Error('Blank or undecoded image '+JSON.stringify(r));}if(rs.some(r=>/clean\.svg|same-house\.svg/.test(r.src)))throw new Error('Raster photograph wrapped in SVG');await page.screenshot({path:'browser-artifacts/examples-visual-gate.png',fullPage:true});await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
NODE
pass "every project image decodes with visible nonblank pixel content"
'''
          if 'every project image decodes with visible nonblank pixel content' not in b: b=b.replace(anchor,block)
          smoke.write_text(b)
          PY
          rm -f assets/contractor-demo/flower-after-same-house.svg assets/demo-workthroughs/irrigation-before-clean.svg assets/demo-workthroughs/irrigation-after-clean.svg
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Repair project visuals and add rendered visual acceptance gate'
          git push origin HEAD:repair/visual-quality-gate
