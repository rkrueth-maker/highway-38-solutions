name: Verify customer list bottom

on:
  pull_request:
    paths:
      - 'commercial-app/customer-list-bottom-runtime.js'
      - 'commercial-app/live-customer-navigation-guard-20260910.js'
      - 'commercial-app/supabase-quote-delivery.js'
      - 'commercial-app/index.html'
      - 'business-office-review-demo.css'
      - 'business-office-review-demo.html'
      - 'scripts/verify-customer-list-bottom-browser.js'
      - 'scripts/verify-quote-delivery-page-scope-browser.js'
      - 'scripts/verify-public-demo-mobile-nav-browser.js'
      - '.github/workflows/verify-customer-list-bottom.yml'
  push:
    branches:
      - main
    paths:
      - 'commercial-app/customer-list-bottom-runtime.js'
      - 'commercial-app/live-customer-navigation-guard-20260910.js'
      - 'commercial-app/supabase-quote-delivery.js'
      - 'commercial-app/index.html'
      - 'business-office-review-demo.css'
      - 'business-office-review-demo.html'
      - 'scripts/verify-customer-list-bottom-browser.js'
      - 'scripts/verify-quote-delivery-page-scope-browser.js'
      - 'scripts/verify-public-demo-mobile-nav-browser.js'
      - '.github/workflows/verify-customer-list-bottom.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-list-bottom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: JavaScript syntax
        run: |
          node -c commercial-app/customer-list-bottom-runtime.js
          node -c commercial-app/live-customer-navigation-guard-20260910.js
          node -c commercial-app/supabase-quote-delivery.js
          node -c scripts/verify-customer-list-bottom-browser.js
          node -c scripts/verify-quote-delivery-page-scope-browser.js
          node -c scripts/verify-public-demo-mobile-nav-browser.js
      - name: Verify customer list remains at bottom
        run: node scripts/verify-customer-list-bottom-browser.js
      - name: Verify quote action stays on Quotes
        run: node scripts/verify-quote-delivery-page-scope-browser.js
      - name: Verify public demo mobile navigation
        run: node scripts/verify-public-demo-mobile-nav-browser.js
