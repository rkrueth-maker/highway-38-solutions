name: Verify Supabase acceptance
on:
  pull_request:
    branches: [main]
    paths: ['commercial-app/**','native/**','supabase/**','scripts/verify-supabase-*','scripts/prepare-supabase-test-migrations.py','.github/workflows/verify-supabase-acceptance.yml']
  push:
    branches: [main]
    paths: ['commercial-app/**','native/**','supabase/**','scripts/verify-supabase-*','scripts/prepare-supabase-test-migrations.py','.github/workflows/verify-supabase-acceptance.yml']
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'
permissions:
  contents: read
jobs:
  source-security-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/verify-supabase-source-acceptance.py
  database-rls-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: supabase/setup-cli@v1
        with: {version: '2.117.0'}
      - name: Prepare disposable migration replay
        run: |
          mkdir -p "${RUNNER_TEMP}/h38-supabase-test"
          cp -R supabase "${RUNNER_TEMP}/h38-supabase-test/supabase"
          python scripts/prepare-supabase-test-migrations.py --directory "${RUNNER_TEMP}/h38-supabase-test/supabase/migrations"
      - name: Start isolated Supabase stack
        working-directory: ${{ runner.temp }}/h38-supabase-test
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/h38-supabase-start.log"
          for attempt in 1 2 3; do
            : > "$log"
            set +e
            supabase start 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              echo "Supabase isolated stack started on attempt ${attempt}."
              exit 0
            fi
            if ! grep -qiE 'toomanyrequests|too many requests|429|rate.?limit' "$log"; then
              echo "::error::Supabase start failed for a non-registry-throttle reason; not retrying."
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Supabase image registry remained rate-limited after 3 attempts."
              exit "$status"
            fi
            echo "::warning::Supabase image registry rate-limited attempt ${attempt}; cleaning partial stack and retrying."
            supabase stop --no-backup || true
            sleep $((attempt * 8))
          done
      - name: Attack RLS and tenant boundaries
        working-directory: ${{ runner.temp }}/h38-supabase-test
        run: |
          set -euo pipefail
          for test_file in supabase/tests/database/*.test.sql; do
            echo "Running ${test_file}"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
              -v ON_ERROR_STOP=1 \
              -f "${test_file}"
          done
      - name: Stop isolated Supabase stack
        if: always()
        working-directory: ${{ runner.temp }}/h38-supabase-test
        run: supabase stop --no-backup || true
  live-production-readonly:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCEPTANCE_READ_TOKEN }}
      H38_ACCEPTANCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require scoped read-only token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCEPTANCE_READ_TOKEN; use project-scoped Project Settings Read, Edge Functions Read, Advisors Read."
            exit 1
          fi
      - run: node scripts/verify-supabase-live-acceptance.mjs
