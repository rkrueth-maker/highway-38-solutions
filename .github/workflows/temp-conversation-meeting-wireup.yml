name: Temporary Conversation Meeting Wireup

on:
  push:
    branches:
      - agent/conversation-meeting-assistant-20260824

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[conversation-wireup-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/conversation-meeting-assistant-20260824
          fetch-depth: 0
      - name: Wire shared meeting runtime safely
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime=Path('commercial-app/conversation-meeting-assistant.js')
          s=runtime.read_text()
          old="const MEETING_TYPES=['Customer Visit','Site Visit','Follow-up Visit','Customer Meeting','Business Meeting','Vendor Meeting','Subcontractor Meeting','Employee/Internal Meeting','Phone Call','Informal Conversation','Other Conversation'];"
          new="const MEETING_TYPES=['Customer Visit','Site Visit','Follow-up Visit','Customer Meeting','Business Meeting','Vendor Meeting','Subcontractor Meeting','Employee/Internal Meeting','Phone Call','Past Conversation','Informal Conversation','Other Conversation'];"
          if old in s: s=s.replace(old,new)

          old="if(navigator.onLine)void syncPendingMeetingAttachments();if(reason==='meeting-finish'){setTimeout(()=>void organizeMeeting(active.meetingId),0);}return active;}"
          new="if(navigator.onLine){if(reason==='meeting-finish')await syncPendingMeetingAttachments();else void syncPendingMeetingAttachments();}return active;}"
          if old not in s: raise SystemExit('finishRecording marker missing')
          s=s.replace(old,new)

          old="async function finishMeeting(row){if(recording?.meetingId===meetingId(row))await finishRecording('meeting-finish');const current=findMeeting(meetingId(row))||row;if(isLegacy(current))return;current.status='Review';current['Status']='Review';current.ownerReviewStatus='REQUIRED';await persistMeeting(current,'MEETING_UPDATED');await organizeMeeting(meetingId(current));selectedMeetingId=meetingId(current);renderMeetings();}"
          new="async function finishMeeting(row){const hadRecording=recording?.meetingId===meetingId(row);if(hadRecording)await finishRecording('meeting-finish');const current=findMeeting(meetingId(row))||row;if(isLegacy(current))return;current.status='Review';current['Status']='Review';current.ownerReviewStatus='REQUIRED';if(!hadRecording){await persistMeeting(current,'MEETING_UPDATED');await organizeMeeting(meetingId(current));}else await refreshMeeting(meetingId(current));selectedMeetingId=meetingId(current);renderMeetings();}"
          if old not in s: raise SystemExit('finishMeeting marker missing')
          s=s.replace(old,new)

          marker="function installNavigation(){"
          quote_ui="""function enhanceQuotePage(){if(office().page!=='quotes')return;const context=office().quote?.meetingContext||window.H38_MEETING_QUOTE_CONTEXT,main=document.getElementById('mainContent');if(!context||!main||document.getElementById('h38MeetingQuoteContext'))return;const card=document.createElement('section');card.id='h38MeetingQuoteContext';card.className='card';const measurements=Array.isArray(context.measurements)?context.measurements:[],unknowns=Array.isArray(context.unknowns)?context.unknowns:[];card.innerHTML=`<h2>Meeting context</h2><p>${html(context.summary||'Reviewed meeting evidence is attached to this working quote context.')}</p><div>${(context.sourceTypes||[]).map(sourceBadge).join(' ')}</div>${measurements.length?`<h3>Measurements / dimensions</h3><ul>${measurements.map(item=>`<li>${html(text(item.label)||text(item.statement))}: ${html(text(item.valueText))}${provenance(item)}</li>`).join('')}</ul>`:''}${unknowns.length?`<h3>Unresolved</h3>${sourcedList(unknowns)}`:''}<div class=\"notice warn\"><strong>Provenance stays attached.</strong> Recalled or unverified dimensions are context, not verified field measurements. Quote Agent remains the quote-generation authority.</div>`;const head=main.querySelector('.page-head');head?.insertAdjacentElement('afterend',card)||main.prepend(card);}\n"""
          if 'function enhanceQuotePage()' not in s:
              if marker not in s: raise SystemExit('installNavigation marker missing')
              s=s.replace(marker,quote_ui+marker)
          s=s.replace("if(office().page==='customers')setTimeout(enhanceCustomers,0);return result;};wrapped.__h38Meetings=true;window.renderPage=wrapped;}","if(office().page==='customers')setTimeout(enhanceCustomers,0);if(office().page==='quotes')setTimeout(enhanceQuotePage,0);return result;};wrapped.__h38Meetings=true;window.renderPage=wrapped;}")
          s=s.replace("if(page==='customers')setTimeout(enhanceCustomers,0);return result;};wrapped.__h38Meetings=true;window.openPage=wrapped;}","if(page==='customers')setTimeout(enhanceCustomers,0);if(page==='quotes')setTimeout(enhanceQuotePage,0);return result;};wrapped.__h38Meetings=true;window.openPage=wrapped;}")
          runtime.write_text(s)

          index=Path('commercial-app/index.html')
          s=index.read_text()
          css='<link rel="stylesheet" href="./conversation-meeting-assistant.css?build=20260824-conversation-meeting-assistant-1">'
          if css not in s:
              marker='<link rel="stylesheet" href="./owner-flow-polish.css?build=20260815-2135">'
              if marker not in s: raise SystemExit('index css marker missing')
              s=s.replace(marker,marker+'\n  '+css)
          js='<script src="./conversation-meeting-assistant.js?build=20260824-conversation-meeting-assistant-1"></script>'
          if js not in s:
              marker='<script src="./mobile-runtime-stability.js?build=20260816-mobile-runtime-stability-1"></script>'
              if marker not in s: raise SystemExit('index js marker missing')
              s=s.replace(marker,marker+'\n  '+js)
          index.write_text(s)

          sw=Path('commercial-app/service-worker.js')
          s=sw.read_text()
          old="const CACHE_NAME='h38-business-office-20260824-0155';"
          new="const CACHE_NAME='h38-business-office-20260824-0410';\nconst PREVIOUS_CONVERSATION_CACHE_NAME='h38-business-office-20260824-0155';"
          if old in s: s=s.replace(old,new)
          if "'conversation-meeting-assistant.js'" not in s:
              marker="'quote-agent-contract.js','mobile-flow-polish-v2.js'"
              if marker not in s: raise SystemExit('service worker LIVE_FIRST marker missing')
              s=s.replace(marker,"'quote-agent-contract.js','conversation-meeting-assistant.js','conversation-meeting-assistant.css','mobile-flow-polish-v2.js'")
          shell_js="'./conversation-meeting-assistant.js'"
          if shell_js not in s:
              marker="'./quote-agent-contract.js','./mobile-flow-polish-v2.js'"
              if marker not in s: raise SystemExit('service worker shell js marker missing')
              s=s.replace(marker,"'./quote-agent-contract.js','./conversation-meeting-assistant.js','./mobile-flow-polish-v2.js'")
          shell_css="'./conversation-meeting-assistant.css'"
          if shell_css not in s:
              marker="'./owner-flow-polish.css',"
              if marker not in s: raise SystemExit('service worker shell css marker missing')
              s=s.replace(marker,"'./owner-flow-polish.css','./conversation-meeting-assistant.css',")
          sw.write_text(s)

          quote=Path('commercial-app/quote-agent-contract.js')
          s=quote.read_text()
          old="clientRuntimeBuild:BUILD,userInitiated:args.userInitiated!==false};"
          new="clientRuntimeBuild:BUILD,meetingContext:args.meetingContext||window.state?.quote?.meetingContext||window.H38_MEETING_QUOTE_CONTEXT||null,userInitiated:args.userInitiated!==false};"
          if old not in s: raise SystemExit('quote agent prepare marker missing')
          s=s.replace(old,new)
          quote.write_text(s)

          required={
            runtime:['Past Conversation','RECALLED_NOT_VERIFIED','walkthroughHandoffClosesAudioSegment','function enhanceQuotePage()'],
            index:['conversation-meeting-assistant.css','conversation-meeting-assistant.js'],
            sw:['h38-business-office-20260824-0410','h38-business-office-20260824-0155','conversation-meeting-assistant.js','conversation-meeting-assistant.css'],
            quote:['meetingContext:args.meetingContext']
          }
          for path,markers in required.items():
              content=path.read_text()
              for required_marker in markers:
                  if required_marker not in content: raise SystemExit(f'{path}: missing {required_marker}')
          Path('.github/workflows/temp-conversation-meeting-wireup.yml').unlink()
          PY
      - name: Commit wireup and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commercial-app/conversation-meeting-assistant.js commercial-app/index.html commercial-app/service-worker.js commercial-app/quote-agent-contract.js .github/workflows/temp-conversation-meeting-wireup.yml
          git commit -m "Wire Conversation Meeting Assistant [conversation-wireup-fixed]"
          git push origin HEAD:agent/conversation-meeting-assistant-20260824
