name: Northern Lakes Narrated Training Videos

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/record-northern-narrated-training.js'
      - 'scripts/run-northern-narrated-training-v2.js'
      - 'scripts/run-northern-narrated-training-v3.js'
      - 'scripts/run-northern-narrated-training-batched.js'
      - 'scripts/verify-northern-training-privacy-contract.js'
      - 'scripts/build-northern-master-training.js'
      - 'scripts/northern-training-scenarios.json'
      - 'scripts/northern-training-scenarios-extra.json'
      - 'commercial-app/tenant-attribution.js'
      - '.github/workflows/northern-narrated-training.yml'
  workflow_dispatch:
    inputs:
      recording_authorized:
        description: Confirm a controlled TEST-record training run
        required: true
        type: boolean
        default: false
      lesson_ids:
        description: Comma separated lesson IDs; blank records the library
        type: string
        default: ''
      restore_run_id:
        description: Prior PASS Northern artifact run for unchanged lessons
        type: string
        default: ''
      master_only:
        description: Rebuild masters from restored PASS lessons without recording
        type: boolean
        default: false
      master_groups:
        description: operator-desktop, operator-phone, owner-desktop, reference-phone; blank builds all
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: northern-controlled-training-test-data
  cancel-in-progress: false
jobs:
  narrated-training:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate recorder sources and privacy contract
        run: |
          node --check scripts/record-northern-narrated-training.js
          node --check scripts/run-northern-narrated-training-v2.js
          node --check scripts/run-northern-narrated-training-v3.js
          node --check scripts/run-northern-narrated-training-batched.js
          NORTHERN_TRAINING_VALIDATE_RUNTIME_ONLY=1 node scripts/run-northern-narrated-training-v3.js
          node --check scripts/verify-northern-training-privacy-contract.js
          node scripts/verify-northern-training-privacy-contract.js
          node --check scripts/build-northern-master-training.js
          NORTHERN_MASTER_VALIDATE_ONLY=1 node scripts/build-northern-master-training.js
          python -m json.tool scripts/northern-training-scenarios.json >/dev/null
          python -m json.tool scripts/northern-training-scenarios-extra.json >/dev/null
          node - <<'NODE'
          const fs=require('fs');
          const base=JSON.parse(fs.readFileSync('scripts/northern-training-scenarios.json','utf8'));
          const extra=JSON.parse(fs.readFileSync('scripts/northern-training-scenarios-extra.json','utf8'));
          const all=[...base,...extra];
          if(all.length!==39)throw new Error(`Expected exactly 39 training scenarios, got ${all.length}.`);
          const ids=all.map(x=>x.id);
          if(new Set(ids).size!==ids.length)throw new Error('Training scenario IDs must be unique.');
          const advanced=['NL-TRAIN-MONEY-OVERVIEW-OWNER-DESKTOP','NL-TRAIN-VENDOR-BILL-APPROVAL-DESKTOP','NL-TRAIN-CHECK-PAYMENT-PREP-DESKTOP','NL-TRAIN-DEPOSIT-CREDIT-REFUND-DESKTOP','NL-TRAIN-BANK-RECONCILIATION-DESKTOP','NL-TRAIN-CARD-RECONCILIATION-RECEIPTS-DESKTOP','NL-TRAIN-PAYROLL-REIMBURSEMENTS-DESKTOP','NL-TRAIN-CASH-FLOW-OWNER-REVIEW-DESKTOP','NL-TRAIN-FINANCIAL-REPORT-PACK-DESKTOP','NL-TRAIN-LEAD-TO-CUSTOMER-DESKTOP','NL-TRAIN-CUSTOMER-COMMS-PORTAL-DESKTOP','NL-TRAIN-E-SIGN-APPROVAL-DESKTOP','NL-TRAIN-CHANGE-ORDER-DESKTOP','NL-TRAIN-OFFLINE-FORMS-CHECKLISTS-PHONE','NL-TRAIN-OWNER-INTELLIGENCE-AI-DESKTOP','NL-TRAIN-AUTOMATION-INTEGRATION-CENTER-DESKTOP'];
          for(const id of advanced)if(!ids.includes(id))throw new Error('Missing advanced training scenario '+id);
          console.log(JSON.stringify({status:'PASS',scenarioCount:all.length,advancedOwnerLessons:advanced.length},null,2));
          NODE
      - name: Restore proven unchanged lesson media
        if: github.event_name == 'workflow_dispatch' && inputs.restore_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: northern-lakes-narrated-training-${{ inputs.restore_run_id }}
          run-id: ${{ inputs.restore_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/northern-narrated-training
      - name: Validate targeted recording inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          RESTORE_RUN: ${{ inputs.restore_run_id }}
          LESSON_IDS: ${{ inputs.lesson_ids }}
          MASTER_ONLY: ${{ inputs.master_only }}
          RECORDING_AUTHORIZED: ${{ inputs.recording_authorized }}
        run: |
          if [ "$MASTER_ONLY" = true ] || [ -n "$LESSON_IDS" ]; then test -n "$RESTORE_RUN"; fi
          if [ "$MASTER_ONLY" != true ]; then test "$RECORDING_AUTHORIZED" = true; fi
      - name: Install browser, media tools, and local narrator
        if: github.event_name == 'workflow_dispatch' 
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip piper-tts
          mkdir -p "$RUNNER_TEMP/piper-voices"
          cd "$RUNNER_TEMP/piper-voices"
          python -m piper.download_voices en_US-hfc_male-medium || python -m piper.download_voices en_US-joe-medium || python -m piper.download_voices en_US-ryan-high
          MODEL="$(find "$RUNNER_TEMP/piper-voices" -maxdepth 1 -name 'en_US-hfc_male-medium.onnx' -o -name 'en_US-joe-medium.onnx' -o -name 'en_US-ryan-high.onnx' | head -n 1)"
          test -n "$MODEL"
          echo "NORTHERN_NARRATOR_MODEL=$MODEL" >> "$GITHUB_ENV"
      - name: Prepare optional authorized storage state
        if: github.event_name == 'workflow_dispatch' && !inputs.master_only
        env: {STORAGE_STATE: '${{ secrets.H38_WORKFLOW_STORAGE_STATE }}'}
        run: |
          if [ -n "$STORAGE_STATE" ]; then printf '%s' "$STORAGE_STATE" > "$RUNNER_TEMP/h38-workflow-storage-state.json"; chmod 600 "$RUNNER_TEMP/h38-workflow-storage-state.json"; fi
      - name: Record Northern narrated instruction library
        if: github.event_name == 'workflow_dispatch' && !inputs.master_only
        env:
          H38_WORKFLOW_RECORDING_AUTHORIZED: ${{ github.event_name == 'pull_request' && 'true' || inputs.recording_authorized }}
          H38_WORKFLOW_STORAGE_STATE: ${{ runner.temp }}/h38-workflow-storage-state.json
          H38_WORKFLOW_TEST_EMAIL: ${{ secrets.H38_WORKFLOW_TEST_EMAIL }}
          H38_WORKFLOW_TEST_PASSWORD: ${{ secrets.H38_WORKFLOW_TEST_PASSWORD }}
          H38_WORKFLOW_AUTH_STATE_OUT: ${{ runner.temp }}/northern-training-auth.json
          H38_OFFICE_URL: https://highway38solutions.com/commercial-app/
          NORTHERN_TRAINING_DIR: artifacts/northern-narrated-training
          NORTHERN_TRAINING_ONLY: ${{ inputs.lesson_ids }}
          NORTHERN_TRAINING_BATCH_SIZE: 6
          NORTHERN_TRAINING_MAX_ATTEMPTS: 3
        run: node scripts/run-northern-narrated-training-batched.js
      - name: Build native operator, owner desktop, and reference masters
        if: github.event_name == 'workflow_dispatch'
        env:
          NORTHERN_MASTER_ONLY: ${{ inputs.master_groups }}
        run: node scripts/build-northern-master-training.js
      - name: Enforce complete narrated proof
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          test -f artifacts/northern-narrated-training/results.json
          test -f artifacts/northern-narrated-training/videos/00-NORTHERN-LAKES-OPERATOR-MASTER-TRAINING-NARRATED.mp4
          test -f artifacts/northern-narrated-training/videos/00-NORTHERN-LAKES-OPERATOR-MASTER-TRAINING-PHONE-NARRATED.mp4
          test -f artifacts/northern-narrated-training/videos/01-NORTHERN-LAKES-OWNER-ACCOUNTING-AI-MASTER-NARRATED.mp4
          test -f artifacts/northern-narrated-training/videos/99-NORTHERN-LAKES-REFERENCE-APPENDIX-NARRATED.mp4
          test -f artifacts/northern-narrated-training/MASTER_TRAINING_ORDER.json
          node - <<'NODE'
          const fs=require('fs'),path=require('path');
          const result=JSON.parse(fs.readFileSync('artifacts/northern-narrated-training/results.json','utf8'));
          if(result.status!=='PASS')throw new Error('Northern narrated training result is not PASS.');
          if(result.externalActionsOccurred!==false)throw new Error('Training performed an external action.');
          if(!Array.isArray(result.passed)||result.passed.length<39)throw new Error(`Expected at least 39 narrated videos, got ${result.passed?.length||0}.`);
          const order=JSON.parse(fs.readFileSync('artifacts/northern-narrated-training/MASTER_TRAINING_ORDER.json','utf8'));
          if(order.operatorOrder.length!==20)throw new Error('Operator master must contain 20 hands-on lessons.');
          if(order.advancedOwnerOrder.length!==16)throw new Error('Advanced owner master must contain 16 lessons.');
          if(order.referenceOrder.length!==3)throw new Error('Reference appendix must contain 3 reference lessons.');
          for(const [key,master] of Object.entries(order.nativeMasters||{})){const phone=key.endsWith('phone');if(master.lessonIds.some(id=>!id.endsWith(phone?'-PHONE':'-DESKTOP')))throw new Error('Mixed native master '+key);}
          if(order.advancedOwnerPhoneMaster!==null)throw new Error('Phone field content must not be an owner/accounting master.');
          if(order.allParts.length!==39)throw new Error('Training library must account for all 39 lessons.');
          const dir='artifacts/northern-narrated-training/videos';
          const lessons=fs.readdirSync(dir).filter(name=>name.endsWith('-NARRATED.mp4')&&!name.startsWith('00-NORTHERN-LAKES-OPERATOR-MASTER')&&!name.startsWith('01-NORTHERN-LAKES-OWNER-ACCOUNTING-AI-MASTER')&&!name.startsWith('99-NORTHERN-LAKES-REFERENCE-APPENDIX'));
          if(lessons.length<39)throw new Error(`Expected 39 lesson videos, got ${lessons.length}.`);
          for(const id of ['NL-TRAIN-LAWN-FULL-SERVICE-PHONE','NL-TRAIN-SNOW-FULL-SERVICE-PHONE','NL-TRAIN-FULL-OFFICE-MAP-DESKTOP','NL-TRAIN-MEETING-FOLLOWUP-DESKTOP','NL-TRAIN-SITE-VISIT-TO-QUOTE-PHONE','NL-TRAIN-QUOTE-REVISION-APPROVAL-DESKTOP','NL-TRAIN-USERS-SETTINGS-CONTROLS-DESKTOP','NL-TRAIN-MONEY-OVERVIEW-OWNER-DESKTOP','NL-TRAIN-BANK-RECONCILIATION-DESKTOP','NL-TRAIN-CASH-FLOW-OWNER-REVIEW-DESKTOP','NL-TRAIN-OWNER-INTELLIGENCE-AI-DESKTOP','NL-TRAIN-AUTOMATION-INTEGRATION-CENTER-DESKTOP']){const proof=JSON.parse(fs.readFileSync(path.join('artifacts/northern-narrated-training',id+'.json'),'utf8'));if(proof.status!=='PASS')throw new Error(id+' proof is not PASS.');if(proof.externalActionsOccurred!==false)throw new Error(id+' performed an external action.');}
          console.log(JSON.stringify({status:'PASS',lessonVideos:lessons.length,operatorMaster:true,operatorParts:20,advancedOwnerMaster:true,advancedOwnerParts:16,referenceAppendix:true,referenceParts:3,externalActionsOccurred:false,recordingMode:result.recordingMode||'single-pass'},null,2));
          NODE
      - name: Upload Northern narrated video library
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: northern-lakes-narrated-training-${{ github.run_id }}
          path: artifacts/northern-narrated-training/
          if-no-files-found: warn
          retention-days: 30
