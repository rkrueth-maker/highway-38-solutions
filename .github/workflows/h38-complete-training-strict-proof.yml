name: H38 Complete Training Strict Proof

on:
  workflow_dispatch:
    inputs:
      recording_authorized:
        description: Confirm a controlled TEST-record run using an authorized account
        required: true
        type: boolean
        default: false
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/run-complete-training-library-strict.js'
      - 'scripts/record-complete-training-library.js'
      - '.github/workflows/h38-workflow-video-evidence.yml'
      - '.github/workflows/h38-complete-training-strict-proof.yml'
  push:
    branches:
      - main
    paths:
      - '.github/h38-workflow-video-evidence.trigger'

permissions:
  contents: read

jobs:
  strict-complete-training-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Prepare optional authorized storage state
        env:
          STORAGE_STATE: ${{ secrets.H38_WORKFLOW_STORAGE_STATE }}
        run: |
          if [ -n "$STORAGE_STATE" ]; then
            printf '%s' "$STORAGE_STATE" > "$RUNNER_TEMP/h38-workflow-storage-state.json"
            chmod 600 "$RUNNER_TEMP/h38-workflow-storage-state.json"
          fi
      - name: Run strict complete training proof
        env:
          H38_WORKFLOW_RECORDING_AUTHORIZED: ${{ github.event_name == 'pull_request' && 'true' || github.event_name == 'push' && 'true' || inputs.recording_authorized }}
          H38_WORKFLOW_STORAGE_STATE: ${{ runner.temp }}/h38-workflow-storage-state.json
          H38_WORKFLOW_TEST_EMAIL: ${{ secrets.H38_WORKFLOW_TEST_EMAIL }}
          H38_WORKFLOW_TEST_PASSWORD: ${{ secrets.H38_WORKFLOW_TEST_PASSWORD }}
          H38_WORKFLOW_STAFF_EMAIL: ${{ secrets.H38_WORKFLOW_STAFF_EMAIL }}
          H38_WORKFLOW_STAFF_PASSWORD: ${{ secrets.H38_WORKFLOW_STAFF_PASSWORD }}
          H38_WORKFLOW_AUTH_STATE_OUT: ${{ runner.temp }}/h38-workflow-generated-storage-state.json
          H38_COMPLETE_TRAINING_DIR: artifacts/complete-training-library
          H38_OFFICE_URL: https://highway38solutions.com/commercial-app/
        run: node scripts/run-complete-training-library-strict.js
      - name: Upload strict proof packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h38-complete-training-strict-${{ github.run_id }}
          path: artifacts/complete-training-library/
          if-no-files-found: warn
          retention-days: 30
