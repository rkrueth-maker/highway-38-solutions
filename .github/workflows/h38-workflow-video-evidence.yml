name: H38 Workflow Video Evidence

on:
  workflow_dispatch:
    inputs:
      recording_authorized:
        description: Confirm a controlled TEST-record run using an authorized account
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  record-real-runtime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Write authorized storage state to runner temp only
        env:
          STORAGE_STATE: ${{ secrets.H38_WORKFLOW_STORAGE_STATE }}
        run: |
          if [ -n "$STORAGE_STATE" ]; then
            printf '%s' "$STORAGE_STATE" > "$RUNNER_TEMP/h38-workflow-storage-state.json"
            chmod 600 "$RUNNER_TEMP/h38-workflow-storage-state.json"
          fi
      - name: Record deployed Business Office workflows
        env:
          H38_WORKFLOW_RECORDING_AUTHORIZED: ${{ inputs.recording_authorized }}
          H38_WORKFLOW_STORAGE_STATE: ${{ runner.temp }}/h38-workflow-storage-state.json
          H38_WORKFLOW_EVIDENCE_DIR: artifacts/workflow-video-evidence
          H38_OFFICE_URL: https://highway38solutions.com/commercial-app/
        run: node scripts/record-real-office-workflow-evidence.js
      - name: Upload raw evidence packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h38-workflow-video-evidence-${{ github.run_id }}
          path: artifacts/workflow-video-evidence/
          if-no-files-found: warn
          retention-days: 30
