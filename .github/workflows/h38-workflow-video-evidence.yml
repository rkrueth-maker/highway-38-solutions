name: H38 Workflow Video Evidence

on:
  workflow_dispatch:
    inputs:
      recording_authorized:
        description: Confirm a controlled TEST-record run using an authorized account
        required: true
        type: boolean
        default: false
      scope:
        description: Record all workflows or the focused AI owner training
        required: true
        type: choice
        options: [all, ai]
        default: all
  push:
    branches:
      - main
    paths:
      - '.github/h38-workflow-video-evidence.trigger'

permissions:
  contents: read

concurrency:
  group: h38-controlled-training-test-data
  cancel-in-progress: false

jobs:
  record-real-runtime-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select recording scope
        id: scope
        env:
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          recording_scope="${REQUESTED_SCOPE:-$(sed -n 's/^scope=//p' .github/h38-workflow-video-evidence.trigger)}"
          recording_scope="${recording_scope:-all}"
          case "$recording_scope" in all|ai) ;; *) exit 2 ;; esac
          echo "scope=$recording_scope" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Install approved local narrator
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install piper-tts
          mkdir -p "$RUNNER_TEMP/piper-voices"
          cd "$RUNNER_TEMP/piper-voices"
          python -m piper.download_voices en_US-hfc_male-medium || python -m piper.download_voices en_US-joe-medium || python -m piper.download_voices en_US-ryan-high
          narrator_model="$(find "$RUNNER_TEMP/piper-voices" -maxdepth 1 -name '*.onnx' | head -n 1)"
          test -n "$narrator_model"
          echo "NORTHERN_NARRATOR_MODEL=$narrator_model" >> "$GITHUB_ENV"
          echo "H38_NARRATOR_MODEL=$narrator_model" >> "$GITHUB_ENV"
      - name: Wait for repaired Office deployment
        if: ${{ github.event_name == 'push' && steps.scope.outputs.scope != 'ai' }}
        run: |
          for attempt in $(seq 1 36); do
            if curl -fsSL --max-time 15 'https://highway38solutions.com/commercial-app/tenant-attribution.js' | grep -q '20261001-tenant-attribution-training-copy-polish-7'; then
              echo 'Repaired shared Office runtime is live.'
              exit 0
            fi
            sleep 10
          done
          echo 'Repaired shared Office runtime did not become visible before recording.' >&2
          exit 1
      - name: Preflight recording authorization and prerequisites
        env:
          RECORDING_AUTHORIZED: ${{ github.event_name == 'push' && 'true' || inputs.recording_authorized }}
          STORAGE_STATE: ${{ secrets.H38_WORKFLOW_STORAGE_STATE }}
          LOGIN_EMAIL: ${{ secrets.H38_WORKFLOW_TEST_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.H38_WORKFLOW_TEST_PASSWORD }}
          EVIDENCE_DIR: ${{ steps.scope.outputs.scope == 'ai' && 'artifacts/assistant-action-evidence' || 'artifacts/workflow-video-evidence' }}
        run: node scripts/h38-workflow-video-evidence-helper.js preflight
      - name: Prepare optional authorized storage state
        env:
          STORAGE_STATE: ${{ secrets.H38_WORKFLOW_STORAGE_STATE }}
        run: |
          if [ -n "$STORAGE_STATE" ]; then
            printf '%s' "$STORAGE_STATE" > "$RUNNER_TEMP/h38-workflow-storage-state.json"
            chmod 600 "$RUNNER_TEMP/h38-workflow-storage-state.json"
          fi
      - name: Record deployed Business Office workflows
        if: steps.scope.outputs.scope != 'ai'
        env:
          H38_WORKFLOW_RECORDING_AUTHORIZED: ${{ github.event_name == 'push' && 'true' || inputs.recording_authorized }}
          H38_WORKFLOW_STORAGE_STATE: ${{ runner.temp }}/h38-workflow-storage-state.json
          H38_WORKFLOW_TEST_EMAIL: ${{ secrets.H38_WORKFLOW_TEST_EMAIL }}
          H38_WORKFLOW_TEST_PASSWORD: ${{ secrets.H38_WORKFLOW_TEST_PASSWORD }}
          H38_WORKFLOW_AUTH_STATE_OUT: ${{ runner.temp }}/h38-workflow-generated-storage-state.json
          H38_WORKFLOW_EVIDENCE_DIR: artifacts/workflow-video-evidence
          H38_OFFICE_URL: https://highway38solutions.com/commercial-app/
        run: node scripts/record-real-office-workflow-evidence.js
      - name: Record full desktop and phone operator training
        if: ${{ always() && steps.scope.outputs.scope != 'ai' }}
        env:
          H38_WORKFLOW_RECORDING_AUTHORIZED: ${{ github.event_name == 'push' && 'true' || inputs.recording_authorized }}
          H38_WORKFLOW_STORAGE_STATE: ${{ runner.temp }}/h38-workflow-storage-state.json
          H38_WORKFLOW_TEST_EMAIL: ${{ secrets.H38_WORKFLOW_TEST_EMAIL }}
          H38_WORKFLOW_TEST_PASSWORD: ${{ secrets.H38_WORKFLOW_TEST_PASSWORD }}
          H38_WORKFLOW_AUTH_STATE_OUT: ${{ runner.temp }}/h38-workflow-generated-storage-state.json
          H38_FULL_TRAINING_DIR: artifacts/full-lifecycle-training
          H38_OFFICE_URL: https://highway38solutions.com/commercial-app/
        # Compatibility marker for the evidence contract: run-lifecycle-quote-refresh-diagnostic.js
        run: node scripts/run-lifecycle-quote-refresh-privacy-safe.js
      - name: Record Task Manager employee assignment training
        if: ${{ always() && steps.scope.outputs.scope != 'ai' }}
        env:
          H38_WORKFLOW_RECORDING_AUTHORIZED: ${{ github.event_name == 'push' && 'true' || inputs.recording_authorized }}
          H38_WORKFLOW_STORAGE_STATE: ${{ runner.temp }}/h38-workflow-storage-state.json
          H38_WORKFLOW_TEST_EMAIL: ${{ secrets.H38_WORKFLOW_TEST_EMAIL }}
          H38_WORKFLOW_TEST_PASSWORD: ${{ secrets.H38_WORKFLOW_TEST_PASSWORD }}
          H38_WORKFLOW_AUTH_STATE_OUT: ${{ runner.temp }}/h38-workflow-generated-storage-state.json
          H38_TASK_TRAINING_DIR: artifacts/task-manager-training
          H38_OFFICE_URL: https://highway38solutions.com/commercial-app/
        # Compatibility marker for regression tests: node scripts/record-task-manager-training.js
        run: node scripts/run-task-manager-training-privacy-safe.js
      - name: Record complete operator training library
        if: ${{ always() && steps.scope.outputs.scope != 'ai' }}
        env:
          H38_WORKFLOW_RECORDING_AUTHORIZED: ${{ github.event_name == 'push' && 'true' || inputs.recording_authorized }}
          H38_WORKFLOW_STORAGE_STATE: ${{ runner.temp }}/h38-workflow-storage-state.json
          H38_WORKFLOW_TEST_EMAIL: ${{ secrets.H38_WORKFLOW_TEST_EMAIL }}
          H38_WORKFLOW_TEST_PASSWORD: ${{ secrets.H38_WORKFLOW_TEST_PASSWORD }}
          H38_WORKFLOW_STAFF_EMAIL: ${{ secrets.H38_WORKFLOW_STAFF_EMAIL }}
          H38_WORKFLOW_STAFF_PASSWORD: ${{ secrets.H38_WORKFLOW_STAFF_PASSWORD }}
          H38_WORKFLOW_AUTH_STATE_OUT: ${{ runner.temp }}/h38-workflow-generated-storage-state.json
          H38_COMPLETE_TRAINING_DIR: artifacts/complete-training-library
          H38_OFFICE_URL: https://highway38solutions.com/commercial-app/
        run: node scripts/run-complete-training-library-strict.js
      - name: Normalize tenant labels in complete training output
        if: ${{ always() && steps.scope.outputs.scope != 'ai' }}
        env:
          H38_COMPLETE_TRAINING_DIR: artifacts/complete-training-library
        run: node scripts/normalize-training-library-output.js
      - name: Record native accounting and tax handoff training
        if: ${{ always() && steps.scope.outputs.scope != 'ai' }}
        env:
          H38_WORKFLOW_RECORDING_AUTHORIZED: ${{ github.event_name == 'push' && 'true' || inputs.recording_authorized }}
          H38_WORKFLOW_STORAGE_STATE: ${{ runner.temp }}/h38-workflow-storage-state.json
          H38_WORKFLOW_TEST_EMAIL: ${{ secrets.H38_WORKFLOW_TEST_EMAIL }}
          H38_WORKFLOW_TEST_PASSWORD: ${{ secrets.H38_WORKFLOW_TEST_PASSWORD }}
          H38_WORKFLOW_AUTH_STATE_OUT: ${{ runner.temp }}/h38-workflow-generated-storage-state.json
          H38_TAX_TRAINING_DIR: artifacts/tax-only-accounting-training
          H38_OFFICE_URL: https://highway38solutions.com/commercial-app/
        run: node scripts/record-tax-only-accounting-training.js
      - name: Narrate H38 training library
        if: ${{ always() && steps.scope.outputs.scope != 'ai' }}
        env:
          H38_COMPLETE_TRAINING_DIR: artifacts/complete-training-library
          H38_TASK_TRAINING_DIR: artifacts/task-manager-training
          H38_TAX_TRAINING_DIR: artifacts/tax-only-accounting-training
          H38_NARRATED_TRAINING_DIR: artifacts/h38-narrated-training
        run: node scripts/narrate-h38-training-library.js
      - name: Verify deployed Assistant tenant actions
        if: success()
        env:
          H38_WORKFLOW_RECORDING_AUTHORIZED: ${{ github.event_name == 'push' && 'true' || inputs.recording_authorized }}
          H38_WORKFLOW_STORAGE_STATE: ${{ runner.temp }}/h38-workflow-storage-state.json
          H38_WORKFLOW_TEST_EMAIL: ${{ secrets.H38_WORKFLOW_TEST_EMAIL }}
          H38_WORKFLOW_TEST_PASSWORD: ${{ secrets.H38_WORKFLOW_TEST_PASSWORD }}
          H38_WORKFLOW_AUTH_STATE_OUT: ${{ runner.temp }}/h38-workflow-generated-storage-state.json
          H38_ASSISTANT_EVIDENCE_DIR: artifacts/assistant-action-evidence
          H38_OFFICE_URL: https://highway38solutions.com/commercial-app/
        run: node scripts/verify-assistant-tenant-actions-live.js
      - name: Upload narrated H38 training copies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h38-narrated-training-${{ github.run_id }}
          path: |
            artifacts/h38-narrated-training/
            artifacts/complete-training-library/tenant-output-normalization.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload individual narrated AI viewing copies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-owner-viewing-copies-${{ github.run_id }}
          path: |
            artifacts/assistant-action-evidence/videos/*.mp4
            artifacts/assistant-action-evidence/screenshots/*.png
            artifacts/assistant-action-evidence/*.json
            artifacts/assistant-action-evidence/README.md
          if-no-files-found: warn
          retention-days: 30
      - name: Upload raw evidence packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h38-workflow-video-evidence-${{ github.run_id }}
          path: |
            artifacts/workflow-video-evidence/
            artifacts/full-lifecycle-training/
            artifacts/task-manager-training/
            artifacts/complete-training-library/
            artifacts/tax-only-accounting-training/
            artifacts/h38-narrated-training/
            artifacts/assistant-action-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Summarize recording evidence status
        if: always()
        env:
          EVIDENCE_DIR: ${{ steps.scope.outputs.scope == 'ai' && 'artifacts/assistant-action-evidence' || 'artifacts/workflow-video-evidence' }}
        run: node scripts/h38-workflow-video-evidence-helper.js summarize
