name: Verify Northern Lakes site and customer portal

on:
  pull_request:
    paths:
      - 'businesses/northern-lakes/**'
      - 'business-packs/northern-lakes/supabase-business-pack.json'
      - 'supabase/migrations/202608050945_northern_lakes_customer_portal_release.sql'
      - 'scripts/verify-northern-lakes-site-portal-build.js'
      - 'scripts/audit-northern-lakes-rendered-photos.js'
      - '.github/workflows/verify-northern-lakes-site-portal.yml'
  push:
    branches: [main]
    paths:
      - 'businesses/northern-lakes/**'
      - 'business-packs/northern-lakes/supabase-business-pack.json'
      - 'supabase/migrations/202608050945_northern_lakes_customer_portal_release.sql'
      - 'scripts/verify-northern-lakes-site-portal-build.js'
      - 'scripts/audit-northern-lakes-rendered-photos.js'
      - '.github/workflows/verify-northern-lakes-site-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify service, branding, payment and security contracts
        run: node scripts/verify-northern-lakes-site-portal-build.js
      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Render every Northern Lakes page on desktop and mobile
        run: node scripts/audit-northern-lakes-rendered-photos.js
      - name: Upload rendered acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northern-lakes-site-portal-${{ github.run_id }}
          path: artifacts/northern-lakes-photo-audit
          if-no-files-found: warn
          retention-days: 90
