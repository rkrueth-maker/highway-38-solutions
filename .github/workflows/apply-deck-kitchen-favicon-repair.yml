name: Apply Deck Kitchen and Favicon Repair

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/repair-deck-kitchen-favicon.py'
      - '.github/workflows/apply-deck-kitchen-favicon-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/repair-deck-kitchen-favicon
          fetch-depth: 0

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply deterministic repair
        run: python scripts/repair-deck-kitchen-favicon.py

      - name: Commit repaired assets and references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short
          git add -A
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
            exit 0
          fi
          git commit -m 'Repair deck kitchen visuals and approved favicon'
          git pull --rebase origin agent/repair-deck-kitchen-favicon
          git push origin HEAD:agent/repair-deck-kitchen-favicon

      - name: Run public verification
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-change-governance.js
          python3 scripts/verify-public-images.py
          node scripts/verify-public-image-placements.js
          node scripts/verify-public-website-architecture.js
          node scripts/verify-public-expansion.js
          node scripts/verify-commercial-system.js
