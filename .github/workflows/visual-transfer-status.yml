name: Complete reviewed visual transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/visual-transfer-status.yml']
permissions:
  contents: write
  issues: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Record start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit 298 --repo "$GITHUB_REPOSITORY" --title 'Visual repair transfer — RUNNING' --body "Run ${GITHUB_RUN_ID} started for ${GITHUB_SHA}."
      - uses: actions/checkout@v4
        with:
          ref: repair/visual-quality-gate
          fetch-depth: 0
      - name: Download and commit reviewed raster image
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o assets/contractor-demo/flower-after-same-house.png 'https://platform-cs-va6c2.adobe.io/rendition/id/urn:aaid:sc:VA6C2:cdc086c7-4148-480a-9ab1-ce011bedb150?size=2048'
          file assets/contractor-demo/flower-after-same-house.png | grep -q PNG
          test "$(stat -c%s assets/contractor-demo/flower-after-same-house.png)" -gt 50000
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/contractor-demo/flower-after-same-house.png
          git commit -m 'Add reviewed realistic same-house flower result'
          git push origin HEAD:repair/visual-quality-gate
      - name: Record pass
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit 298 --repo "$GITHUB_REPOSITORY" --title 'Visual repair transfer — PASS' --body "Reviewed PNG committed to repair/visual-quality-gate. Run ${GITHUB_RUN_ID}."
      - name: Record hold
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue edit 298 --repo "$GITHUB_REPOSITORY" --title 'Visual repair transfer — HOLD' --body "Transfer failed. Run ${GITHUB_RUN_ID}."
