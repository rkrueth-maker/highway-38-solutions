name: Apply Coordinated CAD Repair
on:
  push:
    branches:
      - agent/repair-coordinated-cad-set
    paths:
      - 'scripts/cad-repair/*.b64'
      - '.github/workflows/apply-coordinated-cad-repair.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    if: github.event_name != 'pull_request' || github.head_ref == 'agent/repair-coordinated-cad-set'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-coordinated-cad-set
      - name: Assemble and generate coordinated CAD repair
        run: |
          cat scripts/cad-repair/part-*.b64 | base64 -d > /tmp/apply-coordinated-cad-repair.py
          python3 /tmp/apply-coordinated-cad-repair.py
      - name: Verify generated SVG XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=sorted(Path('assets/quote-builder/whole-house-cad').glob('*.svg'))
          assert len(files)==10, len(files)
          for file in files:
              ET.parse(file)
          print('XML PASS — 10 sheets')
          PY
      - name: Commit generated repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/quote-builder/whole-house-cad/*.svg scripts/verify-professional-house-cad.js .github/workflows/verify-complete-house-quote-package.yml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Repair coordinated whole-house CAD set"
          git push origin HEAD:agent/repair-coordinated-cad-set
