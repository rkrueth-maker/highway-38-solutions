name: Apply Ground-Up CAD Visual Polish
on:
  push:
    branches: [agent/fix-new-house-scope-and-cad-floating-objects]
    paths:
      - 'scripts/polish-ground-up-house-cad.py'
      - '.github/workflows/apply-ground-up-cad-visual-polish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-new-house-scope-and-cad-floating-objects
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply durable CAD polish
        run: python scripts/polish-ground-up-house-cad.py
      - name: Validate and render corrected trade sheets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils librsvg2-bin
          mkdir -p /tmp/polished-cad
          for sheet in M-101 P-101; do
            xmllint --noout "assets/quote-builder/whole-house-cad/${sheet}.svg"
            rsvg-convert --width 1700 --height 1100 "assets/quote-builder/whole-house-cad/${sheet}.svg" -o "/tmp/polished-cad/${sheet}.png"
          done
          test "$(find /tmp/polished-cad -name '*.png' | wc -l)" -eq 2
          grep -q 'x="1075" y="671.0" width="30" height="60"' assets/quote-builder/whole-house-cad/M-101.svg
          grep -q 'cy="740.0" r="7" class="fixture"' assets/quote-builder/whole-house-cad/P-101.svg
      - name: Commit corrected drawings
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/quote-builder/whole-house-cad/M-101.svg assets/quote-builder/whole-house-cad/P-101.svg
          if git diff --cached --quiet; then
            echo 'No CAD polish changes.'
          else
            git commit -m 'Fix floating trade-object clearances in Revision F CAD'
            git push origin HEAD:agent/fix-new-house-scope-and-cad-floating-objects
          fi