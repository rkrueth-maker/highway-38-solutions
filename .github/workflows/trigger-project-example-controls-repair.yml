name: Trigger Project Examples controls repair

on:
  push:
    branches:
      - fix/project-example-visual-gate-20260724
    paths:
      - .github/workflows/trigger-project-example-controls-repair.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/trigger-project-example-controls-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/project-example-visual-gate-20260724
          fetch-depth: 0
      - name: Apply project example source and rule repairs
        run: python3 scripts/apply-project-example-repairs.py
      - name: Commit repaired sources
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sample-library-now.html flower-garden-quote-complete.html contractor-quote-complete.html \
            scripts/config/approved-public-image-placements.json scripts/config/approved-public-image-placement-overrides.json \
            scripts/apply-public-image-placement-overrides.py scripts/verify-public-image-placements.js \
            scripts/browser-commercial-smoke.sh scripts/verify-commercial-browser.js AGENTS.md \
            docs/architecture/WEBSITE_AND_WEB_APP_CHANGE_GOVERNANCE.md docs/architecture/PUBLIC_WEBSITE_CHANGE_RULES.md
          git commit -m 'Apply direct-raster Project Examples repair and visual rules'
          git push origin HEAD:fix/project-example-visual-gate-20260724
