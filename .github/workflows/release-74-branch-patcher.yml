name: Release 74 Branch Patcher

on:
  push:
    branches:
      - fix/release-74-session-renewal
    paths:
      - .github/workflows/release-74-branch-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-74-session-renewal
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact release timeout and session contract checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/commercial-google-native-beta.yml')
          text = workflow.read_text()
          old = '    timeout-minutes: 120\n'
          new = '    timeout-minutes: 360\n'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one 120-minute Commercial Office job timeout.')
          workflow.write_text(text.replace(old, new))

          contract = Path('scripts/verify-commercial-full-demo-contract.js')
          text = contract.read_text()
          anchor = "check('demo remains non-external',combinedSeed.includes('approved:false')"
          checks = "check('live acceptance renews expiring secure gateway sessions',wrapper.includes('SESSION_RENEW_AFTER_MS=20*60*1000')&&wrapper.includes('openAuthorizedOfficeSession_')&&wrapper.includes('sessionError_')&&wrapper.includes('acceptedBusinessId')&&wrapper.includes('externalActionsEnabled:false'));\ncheck('release workflow allows complete long-running proof',workflow.includes('timeout-minutes: 360'));\n"
          if checks.strip() in text:
              raise SystemExit('Session-renewal checks were already present unexpectedly.')
          if text.count(anchor) != 1:
              raise SystemExit('Could not locate the full-demo safety contract anchor.')
          contract.write_text(text.replace(anchor, checks + anchor))
          PY
          node --check scripts/verify-commercial-full-demo-acceptance.js
          node scripts/verify-commercial-full-demo-contract.js

      - name: Commit exact branch-only changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-74-branch-patcher.yml
          git add .github/workflows/commercial-google-native-beta.yml scripts/verify-commercial-full-demo-contract.js scripts/verify-commercial-full-demo-acceptance.js
          git commit -m 'Renew long acceptance sessions and allow complete proof runtime'
          git push origin HEAD:fix/release-74-session-renewal
