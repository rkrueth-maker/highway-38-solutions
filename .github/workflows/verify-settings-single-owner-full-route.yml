name: Verify Settings single-owner full route

on:
  pull_request:
    branches: [main]
    paths:
      - 'commercial-app/index.html'
      - 'commercial-app/app-17.js'
      - 'commercial-app/supabase-runtime-globals.js'
      - 'commercial-app/supabase-client-installer.js'
      - 'commercial-app/supabase-storage-provider.js'
      - 'commercial-app/supabase-data.js'
      - 'commercial-app/play-compliance.js'
      - 'commercial-app/office-access-completion.js'
      - 'commercial-app/office-scale-workflow.js'
      - 'scripts/verify-settings-single-owner-full-route-browser.js'
      - '.github/workflows/verify-settings-single-owner-full-route.yml'
  push:
    branches: [main]
    paths:
      - 'commercial-app/index.html'
      - 'commercial-app/app-17.js'
      - 'commercial-app/supabase-runtime-globals.js'
      - 'commercial-app/supabase-client-installer.js'
      - 'commercial-app/supabase-storage-provider.js'
      - 'commercial-app/supabase-data.js'
      - 'commercial-app/play-compliance.js'
      - 'commercial-app/office-access-completion.js'
      - 'commercial-app/office-scale-workflow.js'
      - 'scripts/verify-settings-single-owner-full-route-browser.js'
      - '.github/workflows/verify-settings-single-owner-full-route.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify H38 and Northern Settings full route
        run: node scripts/verify-settings-single-owner-full-route-browser.js
