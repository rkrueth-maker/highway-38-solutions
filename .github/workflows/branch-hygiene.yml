name: Safe Agent Branch Hygiene

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-hygiene.yml
  schedule:
    - cron: '23 7 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report eligible branches without deleting them
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: safe-agent-branch-hygiene
  cancel-in-progress: false

jobs:
  cleanup:
    name: delete safely merged agent branches
    runs-on: ubuntu-latest
    steps:
      - name: Remove only proven-safe stale branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const repositoryName = `${owner}/${repo}`;
            const dryRun = context.eventName === 'workflow_dispatch'
              && String(context.payload.inputs?.dry_run || 'false') === 'true';

            const repository = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.data.default_branch;
            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );

            const openPulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 }
            );
            const openPullByBranch = new Map();
            for (const pull of openPulls) {
              if (pull.head.repo?.full_name === repositoryName) {
                openPullByBranch.set(pull.head.ref, pull.number);
              }
            }

            const closedPulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'closed', base: defaultBranch, per_page: 100 }
            );
            const exactMergedHeads = new Map();
            for (const pull of closedPulls) {
              if (pull.merged_at && pull.head.repo?.full_name === repositoryName) {
                exactMergedHeads.set(`${pull.head.ref}\u0000${pull.head.sha}`, pull.number);
              }
            }

            const deleted = [];
            const eligible = [];
            const preserved = [];
            const neverDelete = new Set([defaultBranch, 'gh-pages']);

            for (const branch of branches) {
              const name = branch.name;

              if (!name.startsWith('agent/')) {
                continue;
              }

              if (neverDelete.has(name) || branch.protected) {
                preserved.push([name, 'protected']);
                continue;
              }

              if (openPullByBranch.has(name)) {
                preserved.push([name, `open-pr-${openPullByBranch.get(name)}`]);
                continue;
              }

              let safeReason = null;

              try {
                const comparison = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${defaultBranch}...${name}`
                });

                if (comparison.data.ahead_by === 0) {
                  safeReason = 'fully-contained-in-main';
                }
              } catch (error) {
                preserved.push([name, `compare-failed-${error.status || 'unknown'}`]);
                continue;
              }

              if (!safeReason) {
                const mergedPullNumber = exactMergedHeads.get(`${name}\u0000${branch.commit.sha}`);
                if (mergedPullNumber) {
                  safeReason = `exact-head-of-merged-pr-${mergedPullNumber}`;
                }
              }

              if (!safeReason) {
                preserved.push([name, 'unique-or-unverified-work']);
                continue;
              }

              eligible.push([name, safeReason]);

              if (dryRun) {
                continue;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${name}`
                });
                deleted.push([name, safeReason]);
              } catch (error) {
                preserved.push([name, `delete-failed-${error.status || 'unknown'}`]);
              }
            }

            const deletedTable = deleted.length > 0
              ? [
                  [{ data: 'Deleted branch', header: true }, { data: 'Reason', header: true }],
                  ...deleted.map(([name, reason]) => [name, reason])
                ]
              : [
                  [{ data: 'Deleted branch', header: true }, { data: 'Reason', header: true }],
                  ['None', dryRun ? 'dry run' : 'no branch met the safety rules']
                ];

            await core.summary
              .addHeading('Safe agent branch hygiene')
              .addRaw(`Mode: ${dryRun ? 'dry run' : 'delete'}\n\n`)
              .addRaw(`Eligible: ${eligible.length}\n\n`)
              .addRaw(`Deleted: ${deleted.length}\n\n`)
              .addRaw(`Preserved: ${preserved.length}\n\n`)
              .addTable(deletedTable)
              .write();

            core.info(JSON.stringify({
              dryRun,
              eligible,
              deleted,
              preserved
            }, null, 2));
