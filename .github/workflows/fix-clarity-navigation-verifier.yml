name: Align clarity navigation verifier

on:
  push:
    branches:
      - agent/clarify-public-product-paths

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clarify-public-product-paths
          fetch-depth: 0
      - name: Update stale navigation assertion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/verify-commercial-system.js')
          text=path.read_text(encoding='utf-8')
          old="check('one canonical public shell owns neutral navigation',['What We Do','Pricing','About','Contact','Owner Access','Start a Project'].every(label=>shell.includes(label))&&!shell.includes(\"{href:'quote-builder.html',label:'Quote Builder'}\")&&!shell.includes(\"['Quote Builder','quote-builder.html']\")&&!shell.includes(\"{href:'business-systems.html',label:'Business Office'}\")&&!shell.includes(\"['Business Office','business-systems.html']\")&&!/label:'Project Examples'/.test(shell)&&shell.includes('class=\"pi-menu\"'));"
          new="check('one canonical public shell owns neutral navigation with examples path',['What We Do','Project Examples','Pricing','About','Contact','Owner Access','Start a Project'].every(label=>shell.includes(label))&&!shell.includes(\"{href:'quote-builder.html',label:'Quote Builder'}\")&&!shell.includes(\"['Quote Builder','quote-builder.html']\")&&!shell.includes(\"{href:'business-systems.html',label:'Business Office'}\")&&!shell.includes(\"['Business Office','business-systems.html']\")&&shell.includes(\"{href:'quote-builder.html#examples',label:'Project Examples'}\")&&shell.includes('class=\"pi-menu\"'));"
          if text.count(old)!=1:
              raise SystemExit(f'Expected one stale assertion, found {text.count(old)}')
          path.write_text(text.replace(old,new),encoding='utf-8')
          Path('.github/workflows/fix-clarity-navigation-verifier.yml').unlink()
          PY
          node scripts/verify-commercial-system.js
      - name: Commit verifier alignment
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/verify-commercial-system.js .github/workflows/fix-clarity-navigation-verifier.yml
          git commit -m 'Align navigation verifier with Project Examples'
          git push origin HEAD:agent/clarify-public-product-paths
