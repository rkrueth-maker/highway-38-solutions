name: Verify walkthrough video notes

on:
  pull_request:
    paths:
      - 'commercial-app/index.html'
      - 'commercial-app/service-worker.js'
      - 'commercial-app/field-visit-voice-capture.js'
      - 'commercial-app/field-visit-transcription.js'
      - 'commercial-app/field-visit-guided-controller.js'
      - 'scripts/verify-post-walkthrough-actions.js'
      - '.github/workflows/verify-post-walkthrough-actions.yml'
  push:
    branches: [main]
    paths:
      - 'commercial-app/index.html'
      - 'commercial-app/service-worker.js'
      - 'commercial-app/field-visit-voice-capture.js'
      - 'commercial-app/field-visit-transcription.js'
      - 'commercial-app/field-visit-guided-controller.js'
      - 'scripts/verify-post-walkthrough-actions.js'
      - '.github/workflows/verify-post-walkthrough-actions.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify walkthrough video to professional notes contract
        run: node scripts/verify-post-walkthrough-actions.js
      - name: Verify walkthrough JavaScript syntax
        run: |
          node --check commercial-app/field-visit-voice-capture.js
          node --check commercial-app/field-visit-transcription.js
          node --check commercial-app/field-visit-guided-controller.js
