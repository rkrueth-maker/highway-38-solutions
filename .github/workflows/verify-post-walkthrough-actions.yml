name: Verify post walkthrough actions

on:
  pull_request:
    paths:
      - 'commercial-app/field-visit-walkthrough-guidance.js'
      - 'supabase/functions/h38-field-note-transcription/**'
      - 'scripts/verify-post-walkthrough-actions.js'
      - '.github/workflows/verify-post-walkthrough-actions.yml'
  push:
    branches: [main]
    paths:
      - 'commercial-app/field-visit-walkthrough-guidance.js'
      - 'supabase/functions/h38-field-note-transcription/**'
      - 'scripts/verify-post-walkthrough-actions.js'
      - '.github/workflows/verify-post-walkthrough-actions.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify post-walkthrough actions and dictation contract
        run: node scripts/verify-post-walkthrough-actions.js
      - name: Verify guidance JavaScript syntax
        run: node --check commercial-app/field-visit-walkthrough-guidance.js
