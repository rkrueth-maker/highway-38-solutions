name: Verify Northern Lakes Commercial Office Package

on:
  pull_request:
    paths:
      - 'businesses/northern-lakes/**'
      - 'scripts/build-northern-lakes-commercial-office.js'
      - 'scripts/verify-northern-lakes-commercial-package.js'
      - 'scripts/verify-northern-lakes-business-office.js'
      - 'commercial-app/supabase-auth.js'
      - 'commercial-app/supabase-client-branding.js'
      - '.github/workflows/pages-branch-fallback.yml'
      - 'supabase/functions/nlpm-office-gateway/**'
      - 'supabase/config.toml'
      - 'portal.html'
      - 'sign-in.html'
      - '.github/workflows/verify-northern-lakes-commercial-package.yml'
      - '.github/workflows/deploy-northern-lakes-commercial-office.yml'
  push:
    branches: [main]
    paths:
      - 'businesses/northern-lakes/**'
      - 'scripts/build-northern-lakes-commercial-office.js'
      - 'scripts/verify-northern-lakes-commercial-package.js'
      - 'scripts/verify-northern-lakes-business-office.js'
      - 'commercial-app/supabase-auth.js'
      - 'commercial-app/supabase-client-branding.js'
      - '.github/workflows/pages-branch-fallback.yml'
      - 'supabase/functions/nlpm-office-gateway/**'
      - 'supabase/config.toml'
      - 'portal.html'
      - 'sign-in.html'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify prepared package boundaries
        run: node scripts/verify-northern-lakes-commercial-package.js
      - name: Verify current shared Office tenant boundary
        run: node scripts/verify-northern-lakes-business-office.js
      - name: Verify tenant installer and customer portal contracts
        run: |
          node scripts/verify-client-tenant-installer.js
          node scripts/verify-northern-lakes-site-portal-build.js
      - name: Verify active membership selection
        run: node scripts/verify-supabase-business-office-auth-runtime.js
