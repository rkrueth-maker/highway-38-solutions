name: Verify complete Office access

on:
  pull_request:
    paths:
      - 'commercial-app/desktop-navigation-authority.js'
      - 'commercial-app/supabase-client-branding.js'
      - 'commercial-app/supabase-startup.js'
      - 'commercial-app/customer-readiness-polish.js'
      - 'scripts/verify-customer-readiness-polish-browser.js'
      - 'commercial-app/office-access-completion.js'
      - 'commercial-app/office-account-identity.js'
      - 'commercial-app/service-worker.js'
      - 'commercial-app/app-13.js'
      - 'commercial-app/app-19.js'
      - 'scripts/verify-complete-office-access-browser.js'
      - 'scripts/verify-office-live-delivery-browser.js'
      - 'scripts/verify-office-late-auth-navigation-browser.js'
      - '.github/workflows/verify-complete-office-access.yml'
  push:
    branches: [main]
    paths:
      - 'commercial-app/desktop-navigation-authority.js'
      - 'commercial-app/supabase-client-branding.js'
      - 'commercial-app/supabase-startup.js'
      - 'commercial-app/customer-readiness-polish.js'
      - 'scripts/verify-customer-readiness-polish-browser.js'
      - 'commercial-app/office-access-completion.js'
      - 'commercial-app/office-account-identity.js'
      - 'commercial-app/service-worker.js'
      - 'commercial-app/app-13.js'
      - 'commercial-app/app-19.js'
      - 'scripts/verify-complete-office-access-browser.js'
      - 'scripts/verify-office-live-delivery-browser.js'
      - 'scripts/verify-office-late-auth-navigation-browser.js'
      - '.github/workflows/verify-complete-office-access.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify complete Owner and Staff Office access
        run: node scripts/verify-complete-office-access-browser.js
      - name: Verify warm-browser delivery and signed-in account identity
        run: node scripts/verify-office-live-delivery-browser.js
      - name: Verify late-auth desktop navigation repaint
        run: node scripts/verify-office-late-auth-navigation-browser.js
      - name: Verify signed-out and role-safe Office polish
        run: node scripts/verify-customer-readiness-polish-browser.js
