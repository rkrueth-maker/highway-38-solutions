name: Firebase Android Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'commercial-app/**'
      - 'native/h38-site-scanner/android-app/**'
      - '.github/workflows/firebase-android-acceptance.yml'
  push:
    branches: [main]
    paths:
      - 'commercial-app/**'
      - 'native/h38-site-scanner/android-app/**'
      - '.github/workflows/firebase-android-acceptance.yml'

permissions:
  contents: read

jobs:
  android-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug and instrumentation APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify APKs and instrumentation package
        shell: bash
        run: |
          set -euo pipefail
          APP_APK='app/build/outputs/apk/debug/app-debug.apk'
          TEST_APK='app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk'
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -s "$APP_APK"
          test -s "$TEST_APK"
          unzip -tq "$APP_APK" >/dev/null
          unzip -tq "$TEST_APK" >/dev/null
          "$AAPT" dump badging "$APP_APK" > "$RUNNER_TEMP/h38-app-badging.txt"
          "$AAPT" dump badging "$TEST_APK" > "$RUNNER_TEMP/h38-test-badging.txt"
          APP_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/h38-app-badging.txt" | head -1)"
          TEST_ID="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$RUNNER_TEMP/h38-test-badging.txt" | head -1)"
          test "$APP_ID" = 'com.highway38.sitescanner.test'
          test -n "$TEST_ID"
          test "$TEST_ID" != "$APP_ID"
          grep -Fq "testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'" app/build.gradle
          echo "Verified debug target package: $APP_ID"
          echo "Verified instrumentation package: $TEST_ID"
      - name: Upload locally built acceptance APKs
        uses: actions/upload-artifact@v4
        with:
          name: h38-android-acceptance-apks
          path: |
            native/h38-site-scanner/android-app/app/build/outputs/apk/debug/app-debug.apk
            native/h38-site-scanner/android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 14
      - name: Resolve Firebase Test Lab mode
        id: firebase
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.H38_FIREBASE_TESTLAB_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.H38_FIREBASE_TESTLAB_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" && -n "${FIREBASE_PROJECT_ID:-}" ]]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/h38-firebase-service-account.json"
            chmod 600 "$RUNNER_TEMP/h38-firebase-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/h38-firebase-service-account.json" >> "$GITHUB_ENV"
            echo "CLOUDSDK_CORE_PROJECT=$FIREBASE_PROJECT_ID" >> "$GITHUB_ENV"
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'mode=firebase-test-lab' >> "$GITHUB_OUTPUT"
            echo 'Firebase Test Lab credentials are configured; cloud instrumentation will run.'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'mode=credential-independent' >> "$GITHUB_OUTPUT"
            echo '::warning::Firebase Test Lab credentials are not configured. APK and instrumentation-package acceptance passed; cloud device execution is unavailable for this run.'
          fi
      - name: Enable KVM acceleration for emulator fallback
        if: steps.firebase.outputs.configured != 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm
      - name: Run Android instrumentation fallback
        if: steps.firebase.outputs.configured != 'true'
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          # Keep the runner from issuing fragile post-boot animation ADB writes.
          # The prior fallback reached sys.boot_completed=1, then failed on that
          # optional animation-setting call before instrumentation could start.
          disable-animations: false
          # KVM is enabled explicitly above; never silently fall back to the
          # unstable software-emulated Linux device that dropped framework services.
          disable-linux-hw-accel: false
          # The API-30 emulator can report sys.boot_completed before Android
          # framework services are actually responsive. Wait for package/settings
          # services and a readable SDK level so ddmlib does not classify the
          # connected emulator as "Unknown API Level".
          script: |
            # android-emulator-runner executes each script line independently
            # with /bin/sh. Keep each command self-contained instead of using a
            # multiline shell loop or Bash-only syntax.
            adb wait-for-device
            timeout 180 sh -c 'until SDK="$(adb shell getprop ro.build.version.sdk 2>/dev/null | tr -d "\\r")"; printf "%s" "$SDK" | grep -Eq "^[0-9]+$" && adb shell service check package 2>/dev/null | grep -q found && adb shell service check settings 2>/dev/null | grep -q found; do sleep 2; done'
            adb shell getprop ro.build.version.sdk
            adb shell input keyevent 82 || true
            cd native/h38-site-scanner/android-app && gradle --no-daemon --stacktrace connectedDebugAndroidTest
      - name: Capture fallback diagnostics
        if: always() && steps.firebase.outputs.configured != 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          mkdir -p firebase-test-lab
          printf '%s\n' 'Firebase Test Lab cloud credentials were unavailable for this run.' > firebase-test-lab/fallback.txt
          printf '%s\n' 'The workflow used a GitHub-hosted Android emulator to execute connectedDebugAndroidTest.' >> firebase-test-lab/fallback.txt
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.firebase.outputs.configured == 'true'
      - name: Authenticate Google Cloud
        if: steps.firebase.outputs.configured == 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Run Firebase Test Lab instrumentation
        if: steps.firebase.outputs.configured == 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p firebase-test-lab
          gcloud firebase test android run \
            --type instrumentation \
            --app native/h38-site-scanner/android-app/app/build/outputs/apk/debug/app-debug.apk \
            --test native/h38-site-scanner/android-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=MediumPhone.arm,version=35,locale=en,orientation=portrait \
            --device model=Pixel2.arm,version=30,locale=en,orientation=portrait \
            --timeout 15m \
            --format=json | tee firebase-test-lab/result.json
      - name: Capture Firebase diagnostics
        if: always() && steps.firebase.outputs.configured == 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          mkdir -p firebase-test-lab
          gcloud firebase test android models list --format=json > firebase-test-lab/models.json 2>&1 || true
          gcloud info > firebase-test-lab/gcloud-info.txt 2>&1 || true
      - name: Upload Firebase results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h38-firebase-android-acceptance-results
          path: firebase-test-lab/
          if-no-files-found: warn
          retention-days: 30
