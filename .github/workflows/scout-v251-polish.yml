name: Build H38 Scout v2.5.1 Polish

on:
  push:
    branches:
      - 'agent/private-reseller-scout-v251-polish'
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - '.github/workflows/scout-v251-polish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Configure stable owner signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.H38_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_B64:-}" || -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo 'Stable H38 Android signing secrets are required for Scout owner APKs.' >&2
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/h38-owner-keystore.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          {
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "H38_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "H38_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Verify polish and preserved truth contracts
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v251-polish"; mkdir -p "$report"
          check(){ grep -Fq "$1" "$2" || { echo "::error::Missing [$1] in $2"; exit 1; }; }
          reject(){ if grep -Fq "$1" "$2"; then echo "::error::Forbidden [$1] in $2"; exit 1; fi; }
          assets='reseller/src/main/assets/reseller'
          index="$assets/index.html"
          physical="$assets/v212-physical.js"
          product="$assets/v220-product.js"
          profit="$assets/v220-profit.js"
          track="$assets/v220-track.js"
          data="$assets/v240-data.js"
          fb='reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java'
          device='reseller/src/main/java/com/highway38/resellerscout/RetailerDeviceCheckManager.java'
          appJava='reseller/src/main/java/com/highway38/resellerscout/ResellerScoutApplication.java'

          check "versionName '2.5.1'" reseller/build.gradle
          check 'versionCode 81' reseller/build.gradle
          check 'H38_SCOUT_V251_POLISH=true' "$index"
          check 'h38v251PolishStyles' "$index"
          check "aria-current','page'" "$index"
          check 'prefers-reduced-motion:reduce' "$index"

          # Previously accepted/required product-truth boundaries remain present.
          check 'H38_SCOUT_V216_HUNT_RUNTIME=true' "$physical"
          check 'H38_SCOUT_V220_PROFIT_ENGINE=true' "$profit"
          check 'H38_SCOUT_V220_TRACK=true' "$track"
          check 'PENNY CANDIDATE' "$product"
          check 'Physical scan/register required.' "$product"
          check 'VALUE NOT PROVEN' "$index"
          check 'H38_SCOUT_V250_PROVIDER_HARDENING=true' "$data"
          check 'PERSIST_DEVICE_WEB_SESSIONS_V250' "$appJava"
          check 'DEVICE_STORE_BOUND_CHECK_V250' "$device"
          check 'LOCATION_PROOF_TTL_MS' "$fb"
          check 'location_verified' "$fb"
          check 'selected Scout area' "$fb"
          reject 'Exact Grand Rapids, Minnesota location selected' "$fb"

          # Syntax-check all bundled JS plus every inline script, including polish.
          for f in "$assets"/v200-*.js "$assets"/v210-polish.js "$assets"/v211-wide.js "$assets"/v212-physical.js "$assets"/v220-profit.js "$assets"/v220-track.js "$assets"/v220-product.js "$assets"/v240-data.js; do node --check "$f"; done
          rm -rf /tmp/h38-inline; mkdir -p /tmp/h38-inline
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('reseller/src/main/assets/reseller/index.html').read_text()
          for i,s in enumerate(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)):
              if s.strip(): Path(f'/tmp/h38-inline/inline-{i}.js').write_text(s)
          PY
          for f in /tmp/h38-inline/*.js; do node --check "$f"; done

          node reseller/hunt-native.test.mjs | tee "$report/hunt-native.txt"
          node reseller/profit-engine.test.mjs | tee "$report/profit-track.txt"
          node "$assets/v251-facebook-resale.test.mjs" | tee "$report/facebook-resale-return.txt"
          node "$GITHUB_WORKSPACE/supabase/functions/reseller-auto-leads-v063/core.test.mjs" | tee "$report/source.txt"
          node "$GITHUB_WORKSPACE/supabase/functions/reseller-auction-search-v230/core.test.mjs" | tee "$report/auction.txt"
          node "$GITHUB_WORKSPACE/supabase/functions/reseller-home-depot-local-v240/core.test.mjs" | tee "$report/home-depot.txt"
          node "$GITHUB_WORKSPACE/supabase/functions/reseller-dg-remodel-radar-v240/core.test.mjs" | tee "$report/dg.txt"
          node "$GITHUB_WORKSPACE/supabase/functions/reseller-facebook-public-v240/core.test.mjs" | tee "$report/facebook-public.txt"
          echo PASS > "$report/contract.txt"

      - name: Compile Owner Scout v2.5.1 APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v251-polish"; mkdir -p "$report"
          echo stable-owner-key > "$report/signing-continuity.txt"
          gradle --no-daemon :reseller:assembleOwner | tee "$report/compile.log"
          apk='reseller/build/outputs/apk/owner/reseller-owner.apk'; test -f "$apk"
          out="$report/H38-Reseller-Scout-Owner-v2.5.1-polish.apk"; cp "$apk" "$out"
          sha256sum "$out" > "$report/H38-Reseller-Scout-Owner-v2.5.1-polish.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$out" > "$report/zipalign.txt"

      - name: Smoke inspect exact polished APK bytes
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v251-polish"; out="$report/H38-Reseller-Scout-Owner-v2.5.1-polish.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='81' versionName='2.5.1'" "$report/badging.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          grep -Fq 'Verification succesful' "$report/zipalign.txt"
          unzip -t "$out" > "$report/zip-test.txt"; grep -Fq 'No errors detected in compressed data' "$report/zip-test.txt"
          unzip -p "$out" 'assets/reseller/index.html' > "$report/packaged-index.html"
          grep -Fq 'H38_SCOUT_V251_POLISH=true' "$report/packaged-index.html"
          grep -Fq 'H38_SCOUT_V230_BROAD_SOURCING=true' "$report/packaged-index.html"
          grep -Fq 'VALUE NOT PROVEN' "$report/packaged-index.html"
          unzip -p "$out" 'assets/reseller/v240-data.js' > "$report/packaged-v240-data.js"
          grep -Fq 'H38_SCOUT_V250_PROVIDER_HARDENING=true' "$report/packaged-v240-data.js"
          for dex in $(zipinfo -1 "$out" 'classes*.dex'); do unzip -p "$out" "$dex"; done | strings > "$report/dex-strings.txt"
          grep -Fq 'PERSIST_DEVICE_WEB_SESSIONS_V250' "$report/dex-strings.txt"
          grep -Fq 'DEVICE_STORE_BOUND_CHECK_V250' "$report/dex-strings.txt"
          grep -Fq 'selected Scout area' "$report/dex-strings.txt"
          echo PASS > "$report/smoke.txt"

      - name: Upload polished APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v2.5.1-polish
          path: artifacts/scout-v251-polish/*
          if-no-files-found: warn
          retention-days: 30
