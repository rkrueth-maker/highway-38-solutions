name: Verify Highway 38 live page

on:
  workflow_run:
    workflows:
      - Deploy Highway 38 site to GitHub Pages
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-live-page:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      VERIFY_BASE_URL: ${{ vars.PUBLIC_SITE_BASE_URL || 'https://rkrueth-maker.github.io/highway-38-solutions/' }}
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for GitHub Pages propagation
        run: sleep 60

      - name: Run current live product and Quote Builder verification
        run: node scripts/verify-live-page.js

      - name: Add verification summary
        if: always()
        run: |
          echo "## Highway 38 live page verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Base URL tested:** $VERIFY_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "**Source commit:** $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Checks the current three-product pricing, Quote Builder offer and examples, complete new-house package, all ten CAD SVG routes, owner-control language, and removal of discontinued or stale public claims." >> "$GITHUB_STEP_SUMMARY"
