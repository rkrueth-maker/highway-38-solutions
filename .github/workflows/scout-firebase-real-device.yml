name: H38 Deals v3.1.2 Firebase Authenticated Functional Crawl

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Firebase PHYSICAL Android model ID'
        required: true
        default: 'r0q'
      version:
        description: 'Android OS version ID supported by that model'
        required: true
        default: '34'
      timeout:
        description: 'Robo crawl timeout'
        required: true
        default: '30m'
  push:
    branches:
      - agent/private-reseller-scout
    paths:
      - .github/workflows/scout-firebase-real-device.yml

permissions:
  contents: read

concurrency:
  group: h38-deals-v312-functional-crawl
  cancel-in-progress: false

jobs:
  authenticated-functional-crawl:
    if: github.ref == 'refs/heads/agent/private-reseller-scout'
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SCOUT_EMAIL: ${{ secrets.H38_SCOUT_TEST_EMAIL }}
      SCOUT_PASSWORD: ${{ secrets.H38_SCOUT_TEST_PASSWORD }}
      DEVICE_MODEL: ${{ inputs.model || 'r0q' }}
      DEVICE_VERSION: ${{ inputs.version || '34' }}
      ROBO_TIMEOUT: ${{ inputs.timeout || '30m' }}
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce current Scout authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'agent/private-reseller-scout'
          git fetch origin agent/private-reseller-scout
          test "$(git rev-parse origin/agent/private-reseller-scout)" = "$GITHUB_SHA"
          missing=0
          for name in FIREBASE_PROJECT_ID FIREBASE_SERVICE_ACCOUNT_JSON SCOUT_EMAIL SCOUT_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then echo "Missing required GitHub secret backing $name" >&2; missing=1; fi
          done
          test "$missing" -eq 0
          grep -Fq "versionName '3.1.2'" reseller/build.gradle
          grep -Fq 'versionCode 342' reseller/build.gradle
          grep -Fq '/functions/v1/h38-deal-engine-web' reseller/src/main/java/com/highway38/resellerscout/HostedHtmlWebViewClient.java
          mkdir -p "$GITHUB_WORKSPACE/artifacts/firebase-functional"
          echo 'Current Scout authority PASS: H38 Deals 3.1.2 / code 342.'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android platform
        shell: bash
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;35.0.0'"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore persistent Scout signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: h38-reseller-scout-owner-debug-signing-v1

      - name: Build exact H38 Deals 3.1.2 APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/firebase-functional"
          export H38_ANDROID_UPLOAD_KEYSTORE_PATH="$HOME/.android/debug.keystore"
          export H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=android
          export H38_ANDROID_UPLOAD_KEY_ALIAS=androiddebugkey
          export H38_ANDROID_UPLOAD_KEY_PASSWORD=android
          gradle --no-daemon :reseller:assembleOwner
          APP_APK="$(find reseller/build/outputs/apk -type f -path '*/owner/*.apk' ! -path '*/androidTest/*' | head -n1)"
          test -n "$APP_APK" -a -f "$APP_APK"
          echo "APP_APK=$APP_APK" >> "$GITHUB_ENV"
          cp "$APP_APK" "$report/H38-Deals-3.1.2-firebase.apk"
          sha256sum "$report/H38-Deals-3.1.2-firebase.apk" | tee "$report/sha256.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APP_APK" | tee "$report/badging.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='342' versionName='3.1.2'" "$report/badging.txt"
          grep -Fq "application-label:'H38 Deals'" "$report/badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APP_APK" | tee "$report/signing.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Verify target is a physical Firebase device
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/firebase-functional"
          gcloud firebase test android models describe "$DEVICE_MODEL" --format=yaml | tee "$report/device-model.yml"
          grep -qi 'PHYSICAL' "$report/device-model.yml"

      - name: Create authenticated WebView Robo script
        shell: bash
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/scout-login-robo.json"
          echo "::add-mask::$SCOUT_EMAIL"
          echo "::add-mask::$SCOUT_PASSWORD"
          python3 - <<'PY'
          import json, os, shlex
          from pathlib import Path
          email=os.environ['SCOUT_EMAIL']; password=os.environ['SCOUT_PASSWORD']
          out=Path(os.environ['RUNNER_TEMP'])/'scout-login-robo.json'
          def input_cmd(value):
              value=value.replace('%','%25').replace(' ','%s')
              return 'input text '+shlex.quote(value)
          actions=[
              {'eventType':'WAIT','delayTime':2500},
              {'eventType':'VIEW_CLICKED','visionText':'Email'},
              {'eventType':'ADB_SHELL_COMMAND','command':input_cmd(email)},
              {'eventType':'WAIT','delayTime':800},
              {'eventType':'VIEW_CLICKED','visionText':'Password'},
              {'eventType':'ADB_SHELL_COMMAND','command':input_cmd(password)},
              {'eventType':'WAIT','delayTime':800},
              {'eventType':'VIEW_CLICKED','visionText':'Sign in'},
              {'eventType':'WAIT','delayTime':5000},
              {'eventType':'ASSERTION','contextDescriptor':{'condition':'element_present','negateCondition':True,'visionText':'Sign in'}},
              {'eventType':'TAKE_SCREENSHOT','screenshotName':'authenticated-h38-deals-entry'}
          ]
          out.write_text('roboscript:{"executionMode":{"strict":true,"dismiss_popups":true,"notify":false}}\n'+json.dumps(actions))
          PY
          test -s "$script"
          echo "ROBO_SCRIPT=$script" >> "$GITHUB_ENV"

      - name: Run authenticated full functional crawl on Firebase physical Android
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/firebase-functional"
          APP="$GITHUB_WORKSPACE/native/h38-site-scanner/android-app/$APP_APK"
          set +e
          gcloud firebase test android run \
            --project "$FIREBASE_PROJECT_ID" \
            --type robo \
            --app "$APP" \
            --robo-script "$ROBO_SCRIPT" \
            --device "model=$DEVICE_MODEL,version=$DEVICE_VERSION,locale=en,orientation=portrait" \
            --timeout "$ROBO_TIMEOUT" \
            --results-history-name 'H38 Deals Authenticated Functional Crawl' \
            --client-details matrixLabel='H38 Deals 3.1.2 authenticated functional crawl' \
            2>&1 | tee "$report/firebase-test-lab.log"
          status=${PIPESTATUS[0]}
          set -e
          grep -RniE 'FATAL EXCEPTION|AndroidRuntime|ANR|AssertionError|FAILURES!!!|WebView.*error|net::ERR_|TypeError|ReferenceError|Unhandled|uncaught' "$report/firebase-test-lab.log" > "$report/error-scan.txt" 2>/dev/null || true
          if [[ "$status" -eq 0 ]]; then
            echo 'FIREBASE AUTHENTICATED FUNCTIONAL CRAWL PASS' | tee "$report/status.txt"
          elif grep -Fq 'TEST_QUOTA_EXCEEDED' "$report/firebase-test-lab.log"; then
            echo 'FIREBASE NOT RUN — TEST_QUOTA_EXCEEDED' | tee "$report/status.txt"
            exit "$status"
          else
            echo "FIREBASE FUNCTIONAL CRAWL FAIL — gcloud exit $status" | tee "$report/status.txt"
            exit "$status"
          fi

      - name: Build concise acceptance report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/firebase-functional"
          mkdir -p "$report"
          {
            echo '# H38 Deals 3.1.2 Firebase Functional Crawl'
            echo
            echo "- Source: $GITHUB_SHA"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Device: $DEVICE_MODEL / Android $DEVICE_VERSION / PHYSICAL"
            echo '- Package: com.highway38.resellerscout.owner'
            echo '- Scope: authenticated broad UI crawl, button/path traversal, crash/ANR/runtime-error capture.'
            echo
            echo '## Status'
            cat "$report/status.txt" 2>/dev/null || echo 'No final status generated.'
            echo
            echo '## Automated error scan'
            if [[ -s "$report/error-scan.txt" ]]; then cat "$report/error-scan.txt"; else echo 'No matching fatal/runtime error signatures found.'; fi
          } > "$report/acceptance-report.md"

      - name: Upload Firebase evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h38-deals-v3.1.2-firebase-functional-crawl
          path: artifacts/firebase-functional/**
          if-no-files-found: error
          retention-days: 30
