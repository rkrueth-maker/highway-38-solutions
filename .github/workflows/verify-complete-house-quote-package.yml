name: Complete House Quote Package
on:
  pull_request:
    paths:
      - 'whole-house-quote-package.html'
      - 'quote-builder-sample-proposal.html'
      - 'assets/quote-builder/whole-house-cad/**'
      - 'scripts/config/public-website-routes.json'
      - 'scripts/generate-professional-house-cad.js'
      - 'scripts/verify-professional-house-cad.js'
      - 'scripts/verify-complete-house-quote-package.js'
      - '.github/workflows/verify-complete-house-quote-package.yml'
  push:
    branches: [main]
    paths:
      - 'whole-house-quote-package.html'
      - 'quote-builder-sample-proposal.html'
      - 'assets/quote-builder/whole-house-cad/**'
      - 'scripts/config/public-website-routes.json'
      - 'scripts/generate-professional-house-cad.js'
      - 'scripts/verify-professional-house-cad.js'
      - 'scripts/verify-complete-house-quote-package.js'
      - '.github/workflows/verify-complete-house-quote-package.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify professional drawings and full quotes
        id: cad_verify
        continue-on-error: true
        run: node scripts/verify-complete-house-quote-package.js > cad-verifier.log 2>&1
      - name: Upload CAD verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-cad-verifier
          path: cad-verifier.log
          if-no-files-found: error
      - name: Enforce CAD verification result
        if: steps.cad_verify.outcome != 'success'
        run: |
          cat cad-verifier.log
          exit 1
