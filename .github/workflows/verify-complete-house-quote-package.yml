name: Complete House Quote Package
on:
  pull_request:
    paths:
      - 'whole-house-quote-package.html'
      - 'quote-builder-sample-proposal.html'
      - 'assets/quote-builder/whole-house-cad/**'
      - 'scripts/config/public-website-routes.json'
      - 'scripts/generate-professional-house-cad.js'
      - 'scripts/enhance-professional-house-cad.js'
      - 'scripts/normalize-house-cad-revision-e.js'
      - 'scripts/repair-house-cad-coordination.js'
      - 'scripts/verify-professional-house-cad.js'
      - 'scripts/verify-complete-house-quote-package.js'
      - '.github/workflows/verify-complete-house-quote-package.yml'
  push:
    branches: [main]
    paths:
      - 'whole-house-quote-package.html'
      - 'quote-builder-sample-proposal.html'
      - 'assets/quote-builder/whole-house-cad/**'
      - 'scripts/config/public-website-routes.json'
      - 'scripts/generate-professional-house-cad.js'
      - 'scripts/enhance-professional-house-cad.js'
      - 'scripts/normalize-house-cad-revision-e.js'
      - 'scripts/repair-house-cad-coordination.js'
      - 'scripts/verify-professional-house-cad.js'
      - 'scripts/verify-complete-house-quote-package.js'
      - '.github/workflows/verify-complete-house-quote-package.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply coordinated CAD repairs
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: node scripts/repair-house-cad-coordination.js
      - name: Verify professional drawings and full quotes
        id: cad_verify
        continue-on-error: true
        run: node scripts/verify-complete-house-quote-package.js > cad-verifier.log 2>&1
      - name: Install SVG renderer
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
      - name: Render all CAD sheets for visual evidence
        if: always()
        run: |
          mkdir -p cad-rendered
          for file in assets/quote-builder/whole-house-cad/*.svg; do
            sheet="$(basename "$file" .svg)"
            rsvg-convert --width 1700 --height 1100 "$file" -o "cad-rendered/${sheet}.png"
          done
          test "$(find cad-rendered -name '*.png' | wc -l)" -eq 10
      - name: Commit repaired CAD assets
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- assets/quote-builder/whole-house-cad; then
            echo 'No CAD changes were produced.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/quote-builder/whole-house-cad
            git commit -m 'Repair coordinated house CAD sheets'
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Upload CAD verification and rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-cad-evidence
          path: |
            cad-verifier.log
            cad-rendered/*.png
          if-no-files-found: error
      - name: Enforce CAD verification result
        if: steps.cad_verify.outcome != 'success'
        run: |
          cat cad-verifier.log
          exit 1
