name: Office Public UQB Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/office-public-uqb-release.yml'
      - 'apps-script/business-office/BusinessOffice_UniversalQuoteBuilder_PublicDemo.gs'
      - 'apps-script/business-office/BusinessOffice_UniversalQuoteBuilder_PublicDemo_UI.html'
      - 'apps-script/business-office/BusinessOffice_UniversalQuoteBuilder.gs'
      - 'apps-script/business-office/BusinessOffice_QuoteBuilder_Index.html'
      - 'apps-script/business-office/BusinessOffice_Web.gs'
      - 'apps-script/unified-shell/Unified_AppShell.gs'
      - 'scripts/generate-office-public-uqb-demo.sh'
      - 'universal-quote-builder.html'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: office-public-uqb-release
  cancel-in-progress: false

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
      CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
      CLASP_CREDENTIALS_B64: ${{ secrets.CLASP_CREDENTIALS_B64 }}
      GOOGLE_CLASPRC_JSON: ${{ secrets.GOOGLE_CLASPRC_JSON }}
      GOOGLE_CLASPRC_JSON_B64: ${{ secrets.GOOGLE_CLASPRC_JSON_B64 }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record Office demo generation start
        shell: bash
        run: |
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "Office-generated Universal Quote Builder demo release started for ${GITHUB_SHA}. This run will create and verify the H38 Business Office project, fourteen phase quotes, fifty-six itemized lines, eighty-four scope sections, ten CAD files, fifteen documents, and the sanitized public result. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Confirm compatible H38 source is deployed
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_SHA=""
          DEPLOYED_RUN=""
          DEPLOYED_URL=""
          SOURCE_PATHS=(
            apps-script/business-office
            apps-script/unified-shell
            apps-script/business-office-sync
            business-packs/highway38
            scripts/assemble-business-office-app.sh
            scripts/build-unified-apps-script-shell.js
            scripts/deploy-unified-owner-portal-web.sh
          )
          for attempt in $(seq 1 60); do
            RUNS_JSON="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow 'Deploy Unified Owner Portal' --branch main --status success --limit 40 --json databaseId,headSha,url,createdAt 2>/dev/null || printf '[]')"
            while IFS=$'\t' read -r candidate_sha candidate_run candidate_url; do
              [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]] || continue
              git fetch --no-tags origin "$candidate_sha" >/dev/null 2>&1 || continue
              git merge-base --is-ancestor "$candidate_sha" "$GITHUB_SHA" || continue
              if git diff --quiet "$candidate_sha..$GITHUB_SHA" -- "${SOURCE_PATHS[@]}"; then
                DEPLOYED_SHA="$candidate_sha"
                DEPLOYED_RUN="$candidate_run"
                DEPLOYED_URL="$candidate_url"
                break
              fi
            done < <(node -e '
              const runs=JSON.parse(process.argv[1]||"[]");
              for(const run of runs) console.log([run.headSha||"",run.databaseId||"",run.url||""].join("\t"));
            ' "$RUNS_JSON")
            if [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              printf 'PASS — successful deployment run %s contains compatible H38 source %s for release %s.\n' "$DEPLOYED_RUN" "$DEPLOYED_SHA" "$GITHUB_SHA"
              printf '%s' "$DEPLOYED_SHA" > /tmp/deployed-source-sha.txt
              printf '%s' "$DEPLOYED_RUN" > /tmp/deployed-run-id.txt
              printf '%s' "$DEPLOYED_URL" > /tmp/deployed-run-url.txt
              exit 0
            fi
            sleep 10
          done
          echo 'HOLD — no successful compatible Deploy Unified Owner Portal run could be verified.' >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Office demo source contract
        run: |
          node scripts/verify-public-quote-builder-result.js
          node scripts/verify-universal-quote-builder.js

      - name: Install isolated clasp
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/h38-clasp" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @google/clasp@3.3.0
          echo "$RUNNER_TEMP/h38-clasp/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Load encrypted Google credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          if [[ -n "${CLASPRC_JSON}" ]]; then printf '%s' "${CLASPRC_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASPRC_JSON_B64}" ]]; then printf '%s' "${CLASPRC_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_CREDENTIALS}" ]]; then printf '%s' "${CLASP_CREDENTIALS}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_CREDENTIALS_B64}" ]]; then printf '%s' "${CLASP_CREDENTIALS_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${GOOGLE_CLASPRC_JSON}" ]]; then printf '%s' "${GOOGLE_CLASPRC_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${GOOGLE_CLASPRC_JSON_B64}" ]]; then printf '%s' "${GOOGLE_CLASPRC_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          else echo 'HOLD — no encrypted Google credential is configured.'; exit 78; fi
          chmod 600 "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8'))"

      - name: Generate Office records files and public result
        run: bash scripts/generate-office-public-uqb-demo.sh

      - name: Record complete Office-generated public demo
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          RESULT='artifacts/office-public-uqb-demo/deployment-verification.json'
          test -f "$RESULT"
          PROJECT_ID="$(node -p "require('./$RESULT').projectId")"
          PUBLIC_URL="$(node -p "require('./$RESULT').publicUrl")"
          COUNTS="$(node -p "JSON.stringify(require('./$RESULT').counts)")"
          REPORT="$RUNNER_TEMP/office-public-uqb-pass.md"
          cat > "$REPORT" <<EOF
          ## PASS — H38 deployment and Office-generated public demo

          - Release commit: ${GITHUB_SHA}
          - Deployed source: $(cat /tmp/deployed-source-sha.txt)
          - Deployment run: $(cat /tmp/deployed-run-url.txt)
          - Business Office source of truth: PASS
          - Demo project: ${PROJECT_ID}
          - Persistent project records: 1
          - Complete phase quotes: 14
          - Itemized quote lines: 56
          - Scope sections: 84
          - CAD drawing records and attached files: 10
          - Generated quote and combined documents: 15
          - Published pointer: 1
          - Verified counts: ${COUNTS}
          - Public Office result: ${PUBLIC_URL}
          - External actions performed: none
          - Existing Apps Script project and deployment IDs: preserved
          - Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file "$REPORT"
          gh issue edit 168 --repo "$GITHUB_REPOSITORY" --title "H38 deployment and Office demo PASS" --body-file "$REPORT"

      - name: Record Office demo generation HOLD
        if: failure()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/office-public-uqb-hold.md"
          cat > "$REPORT" <<EOF
          ## HOLD — Office-generated public quote and CAD demo

          - Release commit: ${GITHUB_SHA}
          - Compatible deployed source: $(cat /tmp/deployed-source-sha.txt 2>/dev/null || echo unknown)
          - Compatible deployment run: $(cat /tmp/deployed-run-url.txt 2>/dev/null || echo unknown)
          - Deployed H38 application remains preserved
          - Office demo generation or verification did not complete
          - No automatic customer send, purchase, payment, scheduling, approval, or work authorization occurred
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file "$REPORT"
          gh issue edit 168 --repo "$GITHUB_REPOSITORY" --title "Office public quote and CAD demo HOLD" --body-file "$REPORT"

      - name: Upload exact generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: office-public-uqb-release-${{ github.run_id }}
          path: |
            artifacts/office-public-uqb-demo/
            /tmp/deployed-source-sha.txt
            /tmp/deployed-run-id.txt
            /tmp/deployed-run-url.txt
          if-no-files-found: warn
          retention-days: 90
