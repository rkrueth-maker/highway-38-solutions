name: Office Public UQB Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/office-public-uqb-release.yml'
      - 'sample-library-now.html'
      - 'universal-quote-builder.html'
      - 'universal-quote-builder-example.html'
      - 'assets/js/uqb-public-examples.js'
      - 'assets/quote-builder/whole-house-cad/**'
      - 'scripts/verify-static-public-uqb.js'
      - 'scripts/verify-public-quote-builder-result.js'
      - 'scripts/verify-universal-quote-builder.js'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/office-public-uqb-release.yml'
      - 'sample-library-now.html'
      - 'universal-quote-builder.html'
      - 'universal-quote-builder-example.html'
      - 'assets/js/uqb-public-examples.js'
      - 'assets/quote-builder/whole-house-cad/**'
      - 'scripts/verify-static-public-uqb.js'
      - 'scripts/verify-public-quote-builder-result.js'
      - 'scripts/verify-universal-quote-builder.js'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: public-uqb-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-static-public-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out public source
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify static public quote and CAD contract
        run: |
          node scripts/verify-static-public-uqb.js
          node scripts/verify-public-quote-builder-result.js
          node scripts/verify-universal-quote-builder.js

      - name: Record live verification start
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "Universal Quote Builder static public example verification started for ${GITHUB_SHA}. This run verifies that seven anonymous quote-and-CAD packages and ten public CAD sheets are displayed directly beneath the whole-building house example, with full quote views, full-size CAD views, and printable complete packages. No private H38 records or authenticated service are used. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Verify deployed GitHub Pages examples
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE='artifacts/static-public-uqb/live'
          mkdir -p "$EVIDENCE"
          BASE='https://rkrueth-maker.github.io/highway-38-solutions'
          PAGE="$BASE/sample-library-now.html?v=$GITHUB_SHA"
          REDIRECT="$BASE/universal-quote-builder.html?v=$GITHUB_SHA"
          VIEWER="$BASE/universal-quote-builder-example.html?v=$GITHUB_SHA"
          DATA="$BASE/assets/js/uqb-public-examples.js?v=$GITHUB_SHA"
          verified=false
          for attempt in $(seq 1 60); do
            page_status="$(curl -L -sS --max-time 60 -o "$EVIDENCE/sample-library-now.html" -w '%{http_code}' "$PAGE" || true)"
            redirect_status="$(curl -L -sS --max-time 60 -o "$EVIDENCE/universal-quote-builder.html" -w '%{http_code}' "$REDIRECT" || true)"
            viewer_status="$(curl -L -sS --max-time 60 -o "$EVIDENCE/universal-quote-builder-example.html" -w '%{http_code}' "$VIEWER" || true)"
            data_status="$(curl -L -sS --max-time 60 -o "$EVIDENCE/uqb-public-examples.js" -w '%{http_code}' "$DATA" || true)"
            printf '%s' "$page_status" > "$EVIDENCE/page-http-status.txt"
            printf '%s' "$redirect_status" > "$EVIDENCE/redirect-http-status.txt"
            printf '%s' "$viewer_status" > "$EVIDENCE/viewer-http-status.txt"
            printf '%s' "$data_status" > "$EVIDENCE/data-http-status.txt"
            house_line="$(grep -n 'data-project="cabin"' "$EVIDENCE/sample-library-now.html" | head -1 | cut -d: -f1 || true)"
            examples_line="$(grep -n 'id="universal-quote-builder-examples"' "$EVIDENCE/sample-library-now.html" | head -1 | cut -d: -f1 || true)"
            if [[ "$page_status" =~ ^2[0-9][0-9]$ ]] \
              && [[ "$redirect_status" =~ ^2[0-9][0-9]$ ]] \
              && [[ "$viewer_status" =~ ^2[0-9][0-9]$ ]] \
              && [[ "$data_status" =~ ^2[0-9][0-9]$ ]] \
              && [[ "$house_line" =~ ^[0-9]+$ ]] \
              && [[ "$examples_line" =~ ^[0-9]+$ ]] \
              && (( examples_line >= house_line )) \
              && grep -Fq 'Complete quote examples matched to their CAD drawings' "$EVIDENCE/sample-library-now.html" \
              && grep -Fq 'universal-quote-builder-example.html?example=' "$EVIDENCE/sample-library-now.html" \
              && grep -Fq 'sample-library-now.html#universal-quote-builder-examples' "$EVIDENCE/universal-quote-builder.html" \
              && grep -Fq 'Print / Save PDF' "$EVIDENCE/universal-quote-builder-example.html" \
              && grep -Fq "version: '2026-07-26-static-public-v1'" "$EVIDENCE/uqb-public-examples.js" \
              && ! grep -Fq 'class="universal-card"' "$EVIDENCE/sample-library-now.html" \
              && ! grep -Fq 'See What It Produced' "$EVIDENCE/sample-library-now.html" \
              && ! grep -Fq 'script.google.com' "$EVIDENCE/sample-library-now.html"; then
              verified=true
              break
            fi
            sleep 10
          done
          [[ "$verified" == true ]] || { echo 'HOLD — GitHub Pages did not publish the UQB examples directly beneath the house example.' >&2; exit 1; }
          for sheet in G-001 A-101 A-102 A-201 A-301 A-401 M-101 P-101 E-101 C-S-L-101; do
            status="$(curl -L -sS --max-time 60 -o "$EVIDENCE/${sheet}.svg" -w '%{http_code}' "$BASE/assets/quote-builder/whole-house-cad/${sheet}.svg?v=$GITHUB_SHA" || true)"
            [[ "$status" =~ ^2[0-9][0-9]$ ]] || { echo "HOLD — public CAD sheet ${sheet} returned ${status}." >&2; exit 1; }
            grep -Eiq '<svg[[:space:]>]' "$EVIDENCE/${sheet}.svg" || { echo "HOLD — public CAD sheet ${sheet} is not SVG." >&2; exit 1; }
          done
          node - "$EVIDENCE/deployment-verification.json" "$GITHUB_SHA" "$BASE/sample-library-now.html#universal-quote-builder-examples" <<'NODE'
          const fs=require('fs');
          const [out,commit,url]=process.argv.slice(2);
          fs.writeFileSync(out,JSON.stringify({status:'PASS',sourceCommit:commit,architecture:'static public GitHub Pages',placement:'directly beneath whole-building house example',publicPackages:7,publicCadSheets:10,fullQuoteViews:true,fullSizeCadViews:true,printableCompletePackages:true,anonymousAccess:true,privateRecordsRead:false,authenticatedServiceRequired:false,externalActionsPerformed:false,publicUrl:url},null,2)+'\n');
          NODE
          cat "$EVIDENCE/deployment-verification.json"

      - name: Record public UQB PASS
        if: success() && github.event_name != 'pull_request'
        shell: bash
        run: |
          RESULT='artifacts/static-public-uqb/live/deployment-verification.json'
          PUBLIC_URL="$(node -p "require('./$RESULT').publicUrl")"
          REPORT="$RUNNER_TEMP/public-uqb-pass.md"
          cat > "$REPORT" <<EOF
          ## PASS — public Universal Quote Builder quote and CAD examples

          - Release commit: ${GITHUB_SHA}
          - Placement: directly beneath the whole-building house example
          - Separate top result-board showcase: removed
          - Hosting: static GitHub Pages
          - Anonymous access: verified
          - Matched public quote-and-CAD packages: 7
          - Public CAD sheets: 10
          - View full quote: verified
          - View full-size CAD sheets: verified
          - Print / save complete package: verified
          - Private H38 records read: none
          - Authenticated Apps Script dependency: none
          - External actions performed: none
          - Public result: ${PUBLIC_URL}
          - Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file "$REPORT"
          gh issue edit 168 --repo "$GITHUB_REPOSITORY" --title "Public UQB examples beneath house PASS" --body-file "$REPORT"

      - name: Record public UQB HOLD
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/public-uqb-hold.md"
          cat > "$REPORT" <<EOF
          ## HOLD — public Universal Quote Builder quote and CAD examples

          - Release commit: ${GITHUB_SHA}
          - Required placement: directly beneath the whole-building house example
          - Static source verification or GitHub Pages publication did not complete
          - No private H38 records were read
          - No customer send, purchase, payment, scheduling, approval, or work authorization occurred
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body-file "$REPORT"
          gh issue edit 168 --repo "$GITHUB_REPOSITORY" --title "Public UQB examples beneath house HOLD" --body-file "$REPORT"

      - name: Upload public UQB evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-public-uqb-${{ github.run_id }}
          path: artifacts/static-public-uqb/
          if-no-files-found: error
          retention-days: 90
