name: Import Northern Lakes photo refresh

on:
  push:
    branches:
      - agent/fix-northern-lakes-photo-library-owner-links
    paths:
      - .github/workflows/import-northern-lakes-photo-refresh.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-northern-lakes-photo-library-owner-links
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow requests
      - name: Import cleanouts and Minnesota holiday-light photos
        run: |
          cat > /tmp/import_nl_final.py <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import io, time, requests
          from PIL import Image, ImageOps, ImageDraw
          root=Path('businesses/northern-lakes/assets')
          sources={
            'service-source/cleanouts-hauling.jpg':'Dump trailer getting loaded.jpg',
            'service-source/holiday-lights.jpg':'New Hope Minnesota Home Holiday Lights (31814199660).jpg',
          }
          headers={'User-Agent':'Highway38Solutions/1.0 (website asset import; contact highway38solutions@gmail.com)'}
          prepared=[]
          for rel,name in sources.items():
            url='https://commons.wikimedia.org/wiki/Special:Redirect/file/'+quote(name, safe='')+'?width=1800'
            for attempt in range(4):
              r=requests.get(url,headers=headers,timeout=60)
              if r.status_code!=429: break
              time.sleep(12*(attempt+1))
            r.raise_for_status()
            im=Image.open(io.BytesIO(r.content)).convert('RGB')
            im=ImageOps.exif_transpose(im)
            im=ImageOps.fit(im,(1600,1000),method=Image.Resampling.LANCZOS,centering=(0.5,0.5))
            out=root/rel; out.parent.mkdir(parents=True,exist_ok=True)
            im.save(out,'JPEG',quality=88,optimize=True,progressive=True)
            prepared.append((rel,im.copy()))
            time.sleep(4)
          sheet=Image.new('RGB',(960,342),'white'); draw=ImageDraw.Draw(sheet)
          for i,(rel,im) in enumerate(prepared):
            x=i*480; sheet.paste(im.resize((480,300),Image.Resampling.LANCZOS),(x,0)); draw.text((x+10,312),rel,fill='black')
          Path('artifacts').mkdir(exist_ok=True)
          sheet.save('artifacts/northern-lakes-final-two-photos.jpg','JPEG',quality=90)
          PY
          python /tmp/import_nl_final.py
      - uses: actions/upload-artifact@v4
        with:
          name: northern-lakes-final-two-photos
          path: artifacts/northern-lakes-final-two-photos.jpg
          retention-days: 14
      - name: Commit final two photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add businesses/northern-lakes/assets/service-source/cleanouts-hauling.jpg businesses/northern-lakes/assets/service-source/holiday-lights.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Add distinct cleanouts and Minnesota holiday-light photos'
          git push origin HEAD:agent/fix-northern-lakes-photo-library-owner-links
