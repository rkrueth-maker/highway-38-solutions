name: Verify live Highway 38 site

on:
  workflow_run:
    workflows:
      - Deploy Highway 38 site to GitHub Pages
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  verify-live-site:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      VERIFY_BASE_URL: ${{ vars.PUBLIC_SITE_BASE_URL || 'https://rkrueth-maker.github.io/highway-38-solutions/' }}
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wait for GitHub Pages propagation
        run: sleep 60

      - name: Verify current public site, helper, products, Quote Builder, package, and CAD routes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-live-page.js 2>&1 | tee live-site-verification-report.txt
          node scripts/verify-public-helper.js 2>&1 | tee -a live-site-verification-report.txt

      - name: Add pass/fail summary
        if: always()
        shell: bash
        run: |
          echo "## Highway 38 live-site verification" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Base URL:** $VERIFY_BASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "**Source commit:** $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f live-site-verification-report.txt ]; then
            cat live-site-verification-report.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Verification report was not created." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: highway-38-live-site-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            live-site-verification-report.txt
            artifacts/public-helper/verification.json

      - name: Record live verification
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          run_url="https://github.com/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          cat > /tmp/highway38-live-pass.md <<EOF_COMMENT
          <!-- h38-current-live-pass -->
          ## Current Highway 38 LIVE_PAGES verification PASS

          - Homepage, software, project services, Pricing, Quote Builder, Sample Library, complete new-house package, About, and the public helper returned HTTP 200.
          - Highway 38 Helper approved-information, no-storage, no-private-data, and no-external-action boundaries: PASS.
          - Current three-software-product pricing and Quote Builder \$59/month offer: PASS.
          - Quote Builder public examples, printable package, and all ten CAD SVG routes: PASS.
          - Revision E, ground-up new-house, field-verification, and not-for-construction controls: PASS.
          - Discontinued \$99 Problem Snapshot, old fixed 15-service catalog, Version 5 wording, prohibited autonomy claims, and public personal-name attribution: ABSENT.
          - Verification base: ${VERIFY_BASE_URL}
          - Verification run: ${run_url}
          - Verification source commit: \`${SOURCE_SHA}\`

          Final LIVE_PAGES disposition: **PASS**.
          EOF_COMMENT
          existing="$(gh api "repos/${REPO}/issues/83/comments" --paginate --jq '.[] | select(.body | contains("<!-- h38-current-live-pass -->")) | .id' | tail -n 1)"
          if [[ -n "$existing" ]]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" -f body="$(cat /tmp/highway38-live-pass.md)" >/dev/null
          else
            gh issue comment 83 --repo "$REPO" --body-file /tmp/highway38-live-pass.md >/dev/null
          fi
