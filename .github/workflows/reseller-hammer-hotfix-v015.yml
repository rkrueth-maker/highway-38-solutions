name: Apply Reseller Scout hammer hotfix v0.1.15

on:
  push:
    branches:
      - agent/private-reseller-scout
    paths:
      - '.github/workflows/reseller-hammer-hotfix-v015.yml'

permissions:
  contents: write

jobs:
  patch-private-reseller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/private-reseller-scout
          fetch-depth: 0

      - name: Patch mutation loop and bump v0.1.15
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('native/h38-site-scanner/android-app/reseller/src/main/java/com/highway38/resellerscout/MainActivity.java')
          main = main_path.read_text()
          old = '''            "var obs=new MutationObserver(function(){decorate(document);Array.from(document.querySelectorAll('details[data-store-key][open]')).forEach(queuePenny);});" +
            "obs.observe(document.documentElement,{childList:true,subtree:true});setTimeout(function(){decorate(document);Array.from(document.querySelectorAll('details[data-store-key][open]')).forEach(queuePenny);},0);" +'''
          new = '''            "var h38HammerLoopFixed='HAMMER_MUTATION_LOOP_FIXED_V1',list=document.getElementById('storeList'),obs=list?new MutationObserver(function(){decorate(list);Array.from(list.querySelectorAll('details[data-store-key][open]')).forEach(queuePenny);}):null;" +
            "if(obs)obs.observe(list,{childList:true});setTimeout(function(){decorate(document);Array.from(document.querySelectorAll('details[data-store-key][open]')).forEach(queuePenny);},0);" +'''
          if old not in main:
              raise SystemExit('Expected self-triggering MutationObserver block not found')
          main = main.replace(old, new, 1)
          main = main.replace('H38ResellerScoutAndroid/0.1.14-recovery', 'H38ResellerScoutAndroid/0.1.15-hammer-fix', 1)
          main = main.replace('20260819-multi-retailer-hd-penny-recovery-v014', '20260819-multi-retailer-hd-penny-hammer-v015', 1)
          main_path.write_text(main)

          gradle_path = Path('native/h38-site-scanner/android-app/reseller/build.gradle')
          gradle = gradle_path.read_text()
          gradle = gradle.replace('versionCode 15', 'versionCode 16', 1)
          gradle = gradle.replace("versionName '0.1.14'", "versionName '0.1.15'", 1)
          gradle_path.write_text(gradle)

          workflow_path = Path('.github/workflows/private-reseller-scout-apk.yml')
          workflow = workflow_path.read_text()
          workflow = workflow.replace("versionName '0.1.14'", "versionName '0.1.15'")
          workflow = workflow.replace('versionCode 15', 'versionCode 16')
          workflow = workflow.replace('v0.1.14', 'v0.1.15')
          anchor = "          grep -Fq 'HOME_DEPOT_STORE_PRICE_LOCAL_PENNY_V1' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java\n"
          if 'HAMMER_MUTATION_LOOP_FIXED_V1' not in workflow:
              if anchor not in workflow:
                  raise SystemExit('CI marker anchor not found')
              workflow = workflow.replace(anchor, anchor + "          grep -Fq 'HAMMER_MUTATION_LOOP_FIXED_V1' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java\n", 1)
          workflow_path.write_text(workflow)

          assert 'HAMMER_MUTATION_LOOP_FIXED_V1' in main
          assert 'obs.observe(list,{childList:true})' in main
          assert 'obs.observe(document.documentElement,{childList:true,subtree:true})' not in main
          assert "versionName '0.1.15'" in gradle
          assert 'versionCode 16' in gradle
          assert 'v0.1.15' in workflow
          PY

      - name: Commit hotfix to private branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'H38 Recovery Bot'
          git config user.email 'highway38solutions@gmail.com'
          git add native/h38-site-scanner/android-app/reseller/src/main/java/com/highway38/resellerscout/MainActivity.java \
                  native/h38-site-scanner/android-app/reseller/build.gradle \
                  .github/workflows/private-reseller-scout-apk.yml
          git diff --cached --check
          git commit -m 'Fix Reseller Scout hammer mutation loop and bump v0.1.15'
          git push origin HEAD:agent/private-reseller-scout
