name: Apply native photo patch

on:
  push:
    branches: [agent/native-photo-live-tested]
    paths:
      - '.github/workflows/apply-native-photo-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-photo-live-tested
      - name: Apply exact reviewed files
        shell: bash
        run: |
          set -euo pipefail
          cat .patch/nativepatch.part* > "$RUNNER_TEMP/nativepatch.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/nativepatch.tar.gz.b64" > "$RUNNER_TEMP/nativepatch.tar.gz"
          printf '%s  %s\n' 'ceb37fae198f51b8b0e6525a461836e86bcbbea02ae7b1bbc5be85917e0b6e51' "$RUNNER_TEMP/nativepatch.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nativepatch.tar.gz" -C "$GITHUB_WORKSPACE"
          rm -rf .patch .github/workflows/apply-native-photo-patch.yml
          node --check scripts/verify-quote-native-photo-workflow.js
          node --check scripts/test-quote-native-photo-browser.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use native Android photo controls and add live acceptance'
          git push origin HEAD:agent/native-photo-live-tested
