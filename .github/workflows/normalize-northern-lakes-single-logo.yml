name: Normalize Northern Lakes single logo

on:
  push:
    branches:
      - agent/build-northern-lakes-site-portal
    paths:
      - '.github/workflows/normalize-northern-lakes-single-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-northern-lakes-site-portal
          fetch-depth: 0
      - name: Replace active collection-sheet references with approved single mark
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          roots=[Path('businesses/northern-lakes'),Path('business-packs/northern-lakes'),Path('supabase/migrations')]
          suffixes={'.html','.js','.json','.webmanifest','.css','.gs','.sql','.md'}
          changed=[]
          for root in roots:
              if not root.exists(): continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in suffixes: continue
                  text=path.read_text(encoding='utf-8')
                  updated=text.replace('diamond-logo.png','diamond-logo.svg')
                  updated=updated.replace('"sizes":"512x512","type":"image/png"','"sizes":"any","type":"image/svg+xml"')
                  updated=updated.replace('type="image/png" href="assets/diamond-logo.svg','type="image/svg+xml" href="assets/diamond-logo.svg')
                  if updated!=text:
                      path.write_text(updated,encoding='utf-8')
                      changed.append(str(path))
          print('\n'.join(changed))
          PY
      - name: Commit normalized single-logo references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add businesses/northern-lakes business-packs/northern-lakes supabase/migrations
          if git diff --cached --quiet; then
            echo 'Single-logo references already normalized.'
            exit 0
          fi
          git commit -m 'Use one approved Northern Lakes logo everywhere'
          git push origin HEAD:agent/build-northern-lakes-site-portal
