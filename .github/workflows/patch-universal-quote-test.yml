name: Patch Universal Quote Test Contract

on:
  push:
    branches:
      - agent/universal-quote-builder-house-demo
    paths:
      - '.github/workflows/patch-universal-quote-test.yml'

permissions:
  contents: write

concurrency:
  group: patch-universal-quote-test-contract
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/universal-quote-builder-house-demo
          fetch-depth: 0

      - name: Replace only the stale fixed-count assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/test_scheduler_web_dashboard.py')
          text = path.read_text(encoding='utf-8')
          old = '''    assert "Eight complete project demonstrations" in html_response.get_data(as_text=True)\n    assert "Representative demonstrations." in html_response.get_data(as_text=True)'''
          new = '''    page = html_response.get_data(as_text=True)\n    assert "Complete project demonstrations" in page\n    assert "Open-ended example library" in page\n    assert "universal-quote-builder.html" in page\n    assert "Representative demonstrations." in page'''
          if old not in text:
              raise SystemExit('HOLD — exact stale assertion was not found; no broad rewrite attempted.')
          updated = text.replace(old, new, 1)
          if updated.count('Complete project demonstrations') != 1:
              raise SystemExit('HOLD — unexpected replacement count.')
          path.write_text(updated, encoding='utf-8')

      - name: Remove temporary workflow and publish exact patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-universal-quote-test.yml
          git add tests/test_scheduler_web_dashboard.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update dashboard test for open-ended project examples'
          git push origin HEAD:agent/universal-quote-builder-house-demo
