name: Temporary Quote Render Source Path Fix

on:
  push:
    branches:
      - agent/quote-agent-walkthrough-acceptance-polish-20260823

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[render-source-path-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quote-agent-walkthrough-acceptance-polish-20260823
          fetch-depth: 0
      - name: Apply exact source handoff repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/h38-quote-ai/index.ts')
          s=p.read_text()
          replacements=[
            ('const QUOTE_AI_BUILD = "20260822-owner-bounded-draft-21";', 'const QUOTE_AI_BUILD = "20260824-render-source-path-22";'),
            ('async function quoteRenderSource(service: ReturnType<typeof serviceClient>, businessId: string, quoteId: string): Promise<RenderSource | null> {', 'async function quoteRenderSource(service: ReturnType<typeof serviceClient>, businessId: string, quoteId: string, preferredPath = ""): Promise<RenderSource | null> {\n  const preferred = clean(preferredPath, 1200);\n  if (preferred && preferred.startsWith(`${businessId}/`)) {\n    const ext = (preferred.split(".").pop() || "").toLowerCase();\n    const mimeType = ext === "png" ? "image/png" : ext === "webp" ? "image/webp" : "image/jpeg";\n    return { bucket: STORAGE_BUCKET, path: preferred, mimeType };\n  }'),
            ('async function createRenderConcept(service: ReturnType<typeof serviceClient>, businessId: string, quoteId: string, context: JsonObject, draft: JsonObject, userId: string) {', 'async function createRenderConcept(service: ReturnType<typeof serviceClient>, businessId: string, quoteId: string, context: JsonObject, draft: JsonObject, userId: string, preferredSourcePath = "") {'),
            ('const source = await quoteRenderSource(service, businessId, quoteId);', 'const source = await quoteRenderSource(service, businessId, quoteId, preferredSourcePath);'),
            ('const rendered = await createRenderConcept(service, businessId, quoteId, context, draft, user.id);', 'const rendered = await createRenderConcept(service, businessId, quoteId, context, draft, user.id, clean(body.renderSourcePath, 1200));'),
          ]
          for old,new in replacements:
              if s.count(old)!=1:
                  raise SystemExit(f'expected exactly one marker: {old!r}; found {s.count(old)}')
              s=s.replace(old,new)
          required=[
            '20260824-render-source-path-22',
            'preferred.startsWith(`${businessId}/`)',
            'quoteRenderSource(service, businessId, quoteId, preferredSourcePath)',
            'clean(body.renderSourcePath, 1200)',
          ]
          for marker in required:
              if marker not in s: raise SystemExit(f'missing repaired marker: {marker}')
          p.write_text(s)
          Path('.github/workflows/temp-quote-render-source-path-fix.yml').unlink()
          PY
      - name: Commit repaired source and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/h38-quote-ai/index.ts .github/workflows/temp-quote-render-source-path-fix.yml
          git commit -m "Honor canonical render source path [render-source-path-fixed]"
          git push origin HEAD:agent/quote-agent-walkthrough-acceptance-polish-20260823
