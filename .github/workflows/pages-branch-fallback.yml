name: Publish H38 Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '.restore-points/**'
      - 'apps-script/**'
      - 'artifacts/**'
      - 'businesses/**'
      - 'docs/**'
      - 'native/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: h38-pages-production
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare filtered publication branch
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      public_commit: ${{ steps.publish.outputs.public_commit }}
    steps:
      - name: Create clean gh-pages commit
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          base_tree="$(gh api "repos/${repo}/git/commits/${GITHUB_SHA}" --jq '.tree.sha')"
          marker_b64="$(printf '%s\n' "$GITHUB_SHA" | base64 -w0)"
          cname_b64="$(printf '%s\n' 'highway38solutions.com' | base64 -w0)"

          marker_blob="$(jq -n --arg content "$marker_b64" '{content:$content,encoding:"base64"}' \
            | gh api --method POST "repos/${repo}/git/blobs" --input - --jq '.sha')"
          cname_blob="$(jq -n --arg content "$cname_b64" '{content:$content,encoding:"base64"}' \
            | gh api --method POST "repos/${repo}/git/blobs" --input - --jq '.sha')"

          tree_payload="$(jq -n \
            --arg base "$base_tree" \
            --arg marker "$marker_blob" \
            --arg cname "$cname_blob" \
            '{
              base_tree:$base,
              tree:[
                {path:".github",mode:"040000",type:"tree",sha:null},
                {path:".restore-points",mode:"040000",type:"tree",sha:null},
                {path:"apps-script",mode:"040000",type:"tree",sha:null},
                {path:"artifacts",mode:"040000",type:"tree",sha:null},
                {path:"businesses",mode:"040000",type:"tree",sha:null},
                {path:"docs",mode:"040000",type:"tree",sha:null},
                {path:"native",mode:"040000",type:"tree",sha:null},
                {path:"scripts",mode:"040000",type:"tree",sha:null},
                {path:"supabase",mode:"040000",type:"tree",sha:null},
                {path:"tests",mode:"040000",type:"tree",sha:null},
                {path:"CNAME",mode:"100644",type:"blob",sha:$cname},
                {path:"deployed-main-sha.txt",mode:"100644",type:"blob",sha:$marker}
              ]
            }')"
          public_tree="$(printf '%s' "$tree_payload" \
            | gh api --method POST "repos/${repo}/git/trees" --input - --jq '.sha')"

          old_ref="$(gh api "repos/${repo}/git/ref/heads/gh-pages" --jq '.object.sha' 2>/dev/null || printf '%s' "$GITHUB_SHA")"
          commit_payload="$(jq -n \
            --arg message "Publish H38 production ${GITHUB_SHA}" \
            --arg tree "$public_tree" \
            --arg parent "$old_ref" \
            '{message:$message,tree:$tree,parents:[$parent]}')"
          public_commit="$(printf '%s' "$commit_payload" \
            | gh api --method POST "repos/${repo}/git/commits" --input - --jq '.sha')"

          if gh api "repos/${repo}/git/ref/heads/gh-pages" >/dev/null 2>&1; then
            jq -n --arg sha "$public_commit" '{sha:$sha,force:true}' \
              | gh api --method PATCH "repos/${repo}/git/refs/heads/gh-pages" --input - >/dev/null
          else
            jq -n --arg ref 'refs/heads/gh-pages' --arg sha "$public_commit" '{ref:$ref,sha:$sha}' \
              | gh api --method POST "repos/${repo}/git/refs" --input - >/dev/null
          fi

          echo "public_commit=$public_commit" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy exact filtered commit
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact publication commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.public_commit }}
          fetch-depth: 1

      - name: Verify guided field build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.public_commit }}"
          node --check commercial-app/runtime-rowid-fix.js
          node --check commercial-app/field-visit.js
          node --check commercial-app/field-visit-guidance.js
          node --check commercial-app/field-visit-photo-review.js
          node --check commercial-app/field-visit-recovery.js
          node --check commercial-app/field-visit-measurement-fix.js
          node --check commercial-app/quote-ai-live-fix.js
          node --check commercial-app/service-worker.js
          grep -Fq "20260806-2145" commercial-app/field-visit.js
          grep -Fq "field-visit-photo-review.js" commercial-app/field-visit.js
          grep -Fq "photoReviewBeforeMeasurements:true" commercial-app/field-visit-guidance.js
          grep -Fq "Review Photos & Plan Measurements" commercial-app/field-visit-guidance.js
          grep -Fq "h38-site-scanner" commercial-app/field-visit-photo-review.js
          grep -Fq "missingMeasurements" commercial-app/field-visit-photo-review.js
          grep -Fq "window.rowId=function" commercial-app/runtime-rowid-fix.js
          grep -Fq "runtime-rowid-fix.js?build=20260806-2145" commercial-app/index.html
          grep -Fq "rowIdSelfHealing:true" commercial-app/quote-ai-live-fix.js
          grep -Fq "quote-ai-v5-runtime-self-heal" commercial-app/quote-ai-live-fix.js
          grep -Fq "field-visit-measurement-fix.js" commercial-app/field-visit-recovery.js
          grep -Fq "unknownsAreNeverGuessed:true" commercial-app/field-visit-guidance.js
          grep -Fq "Cannot Measure — Mark Unknown" commercial-app/field-visit-guidance.js
          grep -Fq "h38-business-office-20260806-2210" commercial-app/service-worker.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy production Pages site
        id: deployment
        uses: actions/deploy-pages@v4
