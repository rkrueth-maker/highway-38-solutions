name: Whole Office Deep Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'commercial-app/**'
      - 'scripts/verify-whole-office-action-sweep-browser.js'
      - '.github/workflows/verify-whole-office-deep-acceptance.yml'
      - 'native/h38-site-scanner/android-app/**'
  push:
    branches: [main]
    paths:
      - 'commercial-app/**'
      - 'scripts/verify-whole-office-action-sweep-browser.js'
      - '.github/workflows/verify-whole-office-deep-acceptance.yml'
      - 'native/h38-site-scanner/android-app/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  office-contract-and-domain-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Canonical navigation and Office contracts
        run: |
          node scripts/audit-complete-navigation-and-settings.js
          node scripts/verify-business-office.js
          node scripts/verify-supabase-operational-app.js
          node scripts/verify-supabase-business-office-auth.js
      - name: Invoice, document, quote and operations contracts
        run: |
          node scripts/verify-invoice-delete.js
          node scripts/verify-office-document-export.js
          node scripts/verify-front-to-back-quote-document-contract.js
          node scripts/verify-operations-intelligence.js
      - name: Owner/staff access and external-action safety
        run: |
          node scripts/verify-h38-office-access.js
          node scripts/verify-employee-workspace.js
          node scripts/verify-field-role-client-runtime.js
          node scripts/verify-live-external-actions.js
          node scripts/verify-user-access-role-setup.js
          node scripts/verify-owner-role-preview.js

  browser-action-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Deep click-probe every authorized owner Office page on desktop and mobile
        run: node scripts/verify-whole-office-action-sweep-browser.js
      - name: Customer 360 browser contracts
        run: |
          node scripts/verify-customer-360-photo-stream.js
          node scripts/verify-customer-360-site-visit-delete-bridge.js
          node scripts/verify-customer-360-timeline.js
      - name: Re-run authoritative navigation, Settings, staff and document browser flows
        run: |
          node scripts/verify-desktop-navigation-core-browser.js
          node scripts/verify-settings-single-owner-full-route-browser.js
          node scripts/verify-employee-workspace-browser.js
          node scripts/verify-document-photo-analysis-repair-browser.js
          node scripts/verify-document-release-portal-repair-browser.js
          node scripts/verify-front-to-back-quote-document-visibility-browser.js
          node scripts/verify-operations-intelligence-browser.js
          node scripts/verify-web-media-intake-browser.js
      - name: Upload deep Office action evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-office-deep-acceptance-${{ github.run_id }}
          path: |
            artifacts/whole-office-deep-acceptance/action-sweep.json
            artifacts/whole-office-deep-acceptance/whole-office-desktop.png
            artifacts/whole-office-deep-acceptance/whole-office-mobile.png
          if-no-files-found: warn
          retention-days: 90

  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  android-build-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build physical-test APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify physical-test APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: h38-android-physical-test-${{ github.run_id }}
          path: |
            native/h38-site-scanner/android-app/app/build/outputs/apk/debug/app-debug.apk
            native/h38-site-scanner/android-app/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

  firebase-test-lab-android:
    if: ${{ vars.FIREBASE_TEST_LAB_PROJECT != '' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Firebase Test Lab APK
        working-directory: native/h38-site-scanner/android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Select supported physical Android device
        id: device
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project "${{ vars.FIREBASE_TEST_LAB_PROJECT }}"
          model="$(gcloud firebase test android models list --filter='form=PHYSICAL' --format='value(id)' | head -1)"
          test -n "$model"
          version="$(gcloud firebase test android models describe "$model" --format='value(supportedVersionIds[-1])')"
          test -n "$version"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run Firebase Test Lab Robo acceptance
        run: |
          gcloud firebase test android run \
            --project "${{ vars.FIREBASE_TEST_LAB_PROJECT }}" \
            --type robo \
            --app native/h38-site-scanner/android-app/app/build/outputs/apk/debug/app-debug.apk \
            --device model=${{ steps.device.outputs.model }},version=${{ steps.device.outputs.version }},locale=en,orientation=portrait \
            --timeout 15m \
            --results-history-name h38-whole-office
