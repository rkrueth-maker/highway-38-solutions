name: Deploy H38 Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-windows-recovery.yml

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PAGES_SOURCE_REF: gh-pages
  EXPECTED_PAGES_COMMIT: 216f57f5f9427038c233e9fdaf41991e982ab84e

concurrency:
  group: h38-pages-production
  cancel-in-progress: true

jobs:
  publish:
    name: Publish clean gh-pages tree
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout clean publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PAGES_SOURCE_REF }}
          fetch-depth: 1

      - name: Confirm clean publication commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_PAGES_COMMIT" ]; then
            echo "Unexpected gh-pages commit: $actual"
            exit 1
          fi
          grep -Fq "20260806-1835" commercial-app/field-visit.js
          grep -Fq "field-visit-guidance.js" commercial-app/field-visit.js
          grep -Fq "unknownsAreNeverGuessed:true" commercial-app/field-visit-guidance.js
          grep -Fq "Cannot Measure — Mark Unknown" commercial-app/field-visit-guidance.js
          grep -Fq "h38-business-office-20260806-1835" commercial-app/service-worker.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy production Pages site
        id: deployment
        uses: actions/deploy-pages@v4
