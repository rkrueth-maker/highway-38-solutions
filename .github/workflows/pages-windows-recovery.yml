name: Recover H38 Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PAGES_SOURCE_REF: gh-pages

concurrency:
  group: h38-pages-windows-recovery
  cancel-in-progress: true

jobs:
  publish:
    name: Publish clean gh-pages tree
    runs-on: macos-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout clean publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PAGES_SOURCE_REF }}
          fetch-depth: 1

      - name: Confirm clean publication commit
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          expected="02038a0491b9a65998112659f607040eaf3520a3"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected gh-pages commit: $actual"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy production Pages site
        id: deployment
        uses: actions/deploy-pages@v4
