name: Deploy H38 Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-windows-recovery.yml

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PAGES_SOURCE_REF: gh-pages
  EXPECTED_PAGES_COMMIT: e5fd3568f7901fb11924500f816b68e281c7a458

concurrency:
  group: h38-pages-production
  cancel-in-progress: true

jobs:
  publish:
    name: Publish clean gh-pages tree
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout clean publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PAGES_SOURCE_REF }}
          fetch-depth: 1

      - name: Confirm clean publication commit
        shell: bash
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_PAGES_COMMIT" ]; then
            echo "Unexpected gh-pages commit: $actual"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy production Pages site
        id: deployment
        uses: actions/deploy-pages@v4
