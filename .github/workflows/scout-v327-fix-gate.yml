name: Fix H38 Scout v3.0.27 Gate Path
on:
  push:
    branches: ['agent/private-reseller-scout']
    paths: ['.github/workflows/scout-v327-fix-gate.yml']
permissions:
  contents: write
jobs:
  fix-gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fix repository-relative baseline paths and retrigger build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'agent/private-reseller-scout'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/scout-v327-clean-sourcing.yml')
          s=p.read_text()
          s=s.replace('"$base:$app"','"$base:native/h38-site-scanner/android-app/$app"')
          s=s.replace('"$base:$main"','"$base:native/h38-site-scanner/android-app/$main"')
          s=s.replace('64ef9a193958c0fbfc75a8b0e47777857d8bafe5:reseller/src/main/assets/reseller/v200-app.js','64ef9a193958c0fbfc75a8b0e47777857d8bafe5:native/h38-site-scanner/android-app/reseller/src/main/assets/reseller/v200-app.js')
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'h38-scout-builder'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/scout-v327-clean-sourcing.yml
          git commit -m 'Fix v3.0.27 frozen-shell gate path'
          git push origin HEAD:agent/private-reseller-scout
