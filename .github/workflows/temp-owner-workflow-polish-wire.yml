name: Temporary Owner Workflow Polish Wire
on:
  push:
    branches: [agent/conversation-meeting-assistant-20260824]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[owner-polish-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/conversation-meeting-assistant-20260824
          fetch-depth: 0
      - name: Wire runtime and required lifecycle checklists
        run: |
          python - <<'PY'
          from pathlib import Path
          def once(path,old,new):
              p=Path(path);s=p.read_text()
              if s.count(old)!=1: raise SystemExit(f'{path}: marker count {s.count(old)} for {old[:100]}')
              p.write_text(s.replace(old,new,1))

          p=Path('commercial-app/owner-customer-workflow-polish.js');s=p.read_text()
          s=s.replace("const BUILD='20260824-owner-customer-workflow-polish-1';","const BUILD='20260824-owner-customer-workflow-polish-2';",1)
          old="await window.queueOperation?.('SAVE_JOB','Job',id,{jobId:id,customerId:cid,quoteId:qid,projectTitle:record['Project Title'],status:'Approved'},{collection:'jobs',record,idKeys:['Job ID']});setContext(cid,{jobId:id,source:'accepted-quote'});"
          new="""await window.queueOperation?.('SAVE_JOB','Job',id,{jobId:id,customerId:cid,quoteId:qid,projectTitle:record['Project Title'],status:'Approved'},{collection:'jobs',record,idKeys:['Job ID']});
  const templates=[
    ['PREJOB','Pre-job readiness','Work',['Approved scope and current revision confirmed','Schedule and site access confirmed','Materials and equipment are available or committed','Crew / owner responsibilities are clear','Permits, locates and safety requirements were reviewed when applicable']],
    ['QUALITY','Completion quality','Complete',['Approved scope is complete','Open change orders are resolved before extra work is treated as approved','Final condition and cleanup were checked','Final photos / proof are captured when appropriate','Remaining punch-list items are recorded']],
    ['CLOSEOUT','Closeout','Closed',['Invoice or final billing record is prepared','Payment status is recorded','Customer-facing final documents are staged intentionally','Warranty / maintenance notes are recorded when applicable','Job record has a final next action or is ready to close']]
  ];
  for(const [type,name,requiredBefore,labels] of templates){const checklistId=newid('CHECKLIST'),items=labels.map((label,index)=>({id:`${type}-${index+1}`,label,required:true})),check={'Checklist ID':checklistId,'Business ID':window.state?.businessId||'','Customer ID':cid,'Job ID':id,'Quote ID':qid,'Checklist Name':name,'Checklist Type':type,'Status':'Open','Required Before':requiredBefore,'Items JSON':JSON.stringify(items),'Completed Items JSON':'[]','Created Time':now(),'Updated Time':now(),'Record Version':1};await window.queueOperation?.('SAVE_ENTITY','Checklist',checklistId,{entity:'checklists',record:check},{collection:'checklists',record:check,idKeys:['Checklist ID']});}
  setContext(cid,{jobId:id,source:'accepted-quote'});"""
          if old not in s: raise SystemExit('job conversion marker missing')
          p.write_text(s.replace(old,new,1))

          once('commercial-app/index.html',
               '  <link rel="stylesheet" href="./conversation-meeting-assistant.css?build=20260824-conversation-meeting-assistant-1">',
               '  <link rel="stylesheet" href="./conversation-meeting-assistant.css?build=20260824-conversation-meeting-assistant-1">\n  <link rel="stylesheet" href="./owner-customer-workflow-polish.css?build=20260824-owner-customer-workflow-polish-1">')
          once('commercial-app/index.html',
               '  <script src="./customer-360-browser-integration-v3.js?build=20260824-customer-360-browser-integration-v4"></script>',
               '  <script src="./customer-360-browser-integration-v3.js?build=20260824-customer-360-browser-integration-v4"></script>\n  <script src="./owner-customer-workflow-polish.js?build=20260824-owner-customer-workflow-polish-2"></script>')

          sw=Path('commercial-app/service-worker.js');s=sw.read_text()
          s=s.replace("const CACHE_NAME='h38-business-office-20260824-0410';","const CACHE_NAME='h38-business-office-20260824-0635';\nconst PREVIOUS_CUSTOMER_WORKFLOW_CACHE_NAME='h38-business-office-20260824-0410';",1)
          s=s.replace("'conversation-meeting-assistant.js','conversation-meeting-assistant.css','mobile-flow-polish-v2.js'","'conversation-meeting-assistant.js','conversation-meeting-assistant.css','owner-customer-workflow-polish.js','owner-customer-workflow-polish.css','mobile-flow-polish-v2.js'",1)
          s=s.replace("'./owner-flow-polish.css','./conversation-meeting-assistant.css',","'./owner-flow-polish.css','./conversation-meeting-assistant.css','./owner-customer-workflow-polish.css',",1)
          s=s.replace("'./quote-agent-contract.js','./conversation-meeting-assistant.js','./mobile-flow-polish-v2.js'","'./quote-agent-contract.js','./conversation-meeting-assistant.js','./owner-customer-workflow-polish.js','./mobile-flow-polish-v2.js'",1)
          sw.write_text(s)
          Path('.github/workflows/temp-owner-workflow-polish-wire.yml').unlink()
          PY
      - name: Verify syntax and wiring
        run: |
          node -c commercial-app/owner-customer-workflow-polish.js
          grep -q 'owner-customer-workflow-polish.js?build=20260824-owner-customer-workflow-polish-2' commercial-app/index.html
          grep -q 'owner-customer-workflow-polish.js' commercial-app/service-worker.js
          grep -q "'Checklist Type':type" commercial-app/owner-customer-workflow-polish.js
      - name: Commit wired runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commercial-app/owner-customer-workflow-polish.js commercial-app/index.html commercial-app/service-worker.js .github/workflows/temp-owner-workflow-polish-wire.yml
          git commit -m "Wire owner workflow polish and job checklists [owner-polish-wired]"
          git push origin HEAD:agent/conversation-meeting-assistant-20260824
