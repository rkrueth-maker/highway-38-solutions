name: Install Repaired Deck Kitchen and Favicon

on:
  push:
    branches:
      - agent/repair-deck-kitchen-favicon
    paths:
      - '.github/workflows/install-repaired-deck-kitchen-favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/repair-deck-kitchen-favicon

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow

      - name: Repair example images and approved favicon
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageEnhance
          import base64, json, re

          root = Path('.')
          assets = root / 'assets' / 'demo-workthroughs'

          def repaired(src_name, dst_name, top_ratio, centering):
              src = assets / src_name
              dst = assets / dst_name
              image = Image.open(src).convert('RGB')
              width, height = image.size
              top = max(0, min(height - 2, round(height * top_ratio)))
              image = image.crop((0, top, width, height))
              image = ImageOps.fit(
                  image,
                  (1200, 675),
                  method=Image.Resampling.LANCZOS,
                  centering=centering,
              )
              image = ImageEnhance.Contrast(image).enhance(1.03)
              image = ImageEnhance.Sharpness(image).enhance(1.08)
              image.save(dst, 'WEBP', quality=91, method=6)
              print(f'{src} -> {dst} ({dst.stat().st_size} bytes)')

          # The source images contained their own small BEFORE/AFTER graphics.
          # Crop only the labeled top edge, normalize the aspect ratio, and keep
          # the underlying approved scene for an honest existing/concept pair.
          repaired('deck-before.webp', 'deck-existing-condition.webp', 0.14, (0.50, 0.54))
          repaired('deck-after.webp', 'deck-finished-concept.webp', 0.14, (0.50, 0.52))
          repaired('kitchen-before.webp', 'kitchen-existing-condition.webp', 0.14, (0.50, 0.54))
          repaired('kitchen-after.webp', 'kitchen-remodel-concept.webp', 0.14, (0.50, 0.52))

          # Every existing public page already references favicon.svg. Replace
          # that generic mark with an SVG wrapper containing the exact approved
          # mountain-and-road logo bytes.
          logo_bytes = (root / 'assets' / 'highway38-logo.png').read_bytes()
          logo_b64 = base64.b64encode(logo_bytes).decode('ascii')
          favicon = (
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" '
              'role="img" aria-labelledby="title desc">'
              '<title id="title">Highway 38 Solutions</title>'
              '<desc id="desc">Approved Highway 38 Solutions mountain and road badge</desc>'
              '<image href="data:image/png;base64,' + logo_b64 + '" '
              'x="0" y="0" width="128" height="128" preserveAspectRatio="xMidYMid meet"/>'
              '</svg>\n'
          )
          (root / 'favicon.svg').write_text(favicon, encoding='utf-8')

          replacements = {
              'deck-before.webp': 'deck-existing-condition.webp',
              'deck-after.webp': 'deck-finished-concept.webp',
              'kitchen-before.webp': 'kitchen-existing-condition.webp',
              'kitchen-after.webp': 'kitchen-remodel-concept.webp',
              '20260722-direct-v2': '20260724-repaired-v1',
          }

          text_suffixes = {'.html', '.js', '.json', '.md', '.txt', '.sh', '.yml', '.yaml', '.py'}
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in text_suffixes:
                  continue
              if path.name == 'install-repaired-deck-kitchen-favicon.yml':
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              updated = updated.replace(
                  '<link rel="icon" href="favicon.svg">',
                  '<link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260724-approved-logo">'
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          sample_path = root / 'sample-library-now.html'
          sample = sample_path.read_text(encoding='utf-8')
          sample = sample.replace(
              '<article class="project-card"><div class="project-visual"><figure><span>Before</span><img src="assets/demo-workthroughs/deck-existing-condition.webp?v=20260724-repaired-v1" alt="Deck before"></figure><figure><span>After</span><img src="assets/demo-workthroughs/deck-finished-concept.webp?v=20260724-repaired-v1" alt="Deck after"></figure>',
              '<article class="project-card" data-project="deck"><div class="project-visual"><figure><span>Existing Site</span><img src="assets/demo-workthroughs/deck-existing-condition.webp?v=20260724-repaired-v1" width="1200" height="675" loading="lazy" alt="Existing rear entry before deck construction"></figure><figure><span>Finished Concept</span><img src="assets/demo-workthroughs/deck-finished-concept.webp?v=20260724-repaired-v1" width="1200" height="675" loading="lazy" alt="Finished 8 by 12 pressure-treated deck concept"></figure>'
          )
          sample = sample.replace(
              '<article class="project-card"><div class="project-visual"><figure><span>Before</span><img src="assets/demo-workthroughs/kitchen-existing-condition.webp?v=20260724-repaired-v1" alt="Kitchen before"></figure><figure><span>After</span><img src="assets/demo-workthroughs/kitchen-remodel-concept.webp?v=20260724-repaired-v1" alt="Kitchen after"></figure>',
              '<article class="project-card" data-project="kitchen"><div class="project-visual"><figure><span>Existing Kitchen</span><img src="assets/demo-workthroughs/kitchen-existing-condition.webp?v=20260724-repaired-v1" width="1200" height="675" loading="lazy" alt="Existing dated kitchen before renovation"></figure><figure><span>Remodel Concept</span><img src="assets/demo-workthroughs/kitchen-remodel-concept.webp?v=20260724-repaired-v1" width="1200" height="675" loading="lazy" alt="Mid-range kitchen remodel concept"></figure>'
          )
          sample_path.write_text(sample, encoding='utf-8')

          quote_path = root / 'contractor-quote-complete.html'
          quote = quote_path.read_text(encoding='utf-8')
          quote = quote.replace('.photos figure{margin:0;', '.photos figure{position:relative;margin:0;')
          quote = quote.replace('.badge{position:absolute;margin:10px;', '.badge{position:absolute;top:0;left:0;z-index:2;margin:10px;')
          quote = quote.replace(
              '<span class="badge">Before</span><img id="before" alt="Before example">',
              '<span class="badge" id="beforeBadge">Before</span><img id="before" alt="Before example">'
          )
          quote = quote.replace(
              '<span class="badge">After</span><img id="after" alt="After example">',
              '<span class="badge" id="afterBadge">After</span><img id="after" alt="After example">'
          )
          quote = quote.replace(
              "deck:{n:'Q-DEMO-005'",
              "deck:{bl:'Existing site',al:'Finished concept',n:'Q-DEMO-005'"
          )
          quote = quote.replace(
              "kitchen:{n:'Q-DEMO-007'",
              "kitchen:{bl:'Existing kitchen',al:'Remodel concept',n:'Q-DEMO-007'"
          )
          quote = quote.replace(
              "before.src=x.before;after.src=x.after;beforeCap.textContent=x.bc;afterCap.textContent=x.ac;",
              "before.src=x.before;after.src=x.after;before.alt=x.bc;after.alt=x.ac;beforeBadge.textContent=x.bl||'Before';afterBadge.textContent=x.al||'After';beforeCap.textContent=x.bc;afterCap.textContent=x.ac;"
          )
          quote_path.write_text(quote, encoding='utf-8')

          manifest_path = root / 'scripts' / 'config' / 'approved-public-image-placements.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['policyVersion'] = '2026-07-24-deck-kitchen-favicon-repair-v1'
          changes = manifest.setdefault('placementChanges', [])
          changes.append({
              'date': '2026-07-24',
              'page': 'sample-library-now.html and contractor-quote-complete.html',
              'section': 'Deck and kitchen existing-condition / finished-concept visuals and browser favicon',
              'oldPlacement': 'Source WebP files with embedded BEFORE/AFTER graphics and generic H38 path favicon',
              'newPlacement': 'Label-free normalized WebP derivatives with page-owned honest labels; favicon.svg embeds the exact approved mountain-and-road logo',
              'reason': 'Owner-directed repair after live review identified duplicate image labels, inconsistent concept presentation, and the wrong browser-tab icon',
              'binaryPolicy': 'Original source images remain for rollback. New derivatives preserve the underlying scenes and remove only the labeled top edge. The favicon embeds the exact approved assets/highway38-logo.png bytes.'
          })
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          # Fail before commit if expected substitutions did not happen.
          checks = {
              'sample deck label': 'Existing Site' in sample_path.read_text(encoding='utf-8'),
              'sample kitchen label': 'Remodel Concept' in sample_path.read_text(encoding='utf-8'),
              'quote deck label': "bl:'Existing site'" in quote_path.read_text(encoding='utf-8'),
              'quote kitchen label': "bl:'Existing kitchen'" in quote_path.read_text(encoding='utf-8'),
              'approved favicon': 'data:image/png;base64,' in (root / 'favicon.svg').read_text(encoding='utf-8'),
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Repair checks failed: ' + ', '.join(failed))
          print('Repair checks:', checks)
          PY

      - name: Verify repaired public site
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-change-governance.js
          python3 scripts/verify-public-images.py
          node scripts/verify-public-image-placements.js
          node scripts/verify-public-website-architecture.js
          node scripts/verify-public-expansion.js
          node scripts/verify-commercial-system.js

      - name: Commit repaired assets and references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add favicon.svg assets/demo-workthroughs sample-library-now.html contractor-quote-complete.html scripts docs .github/workflows
          git commit -m 'Repair deck kitchen visuals and approved favicon'
          git push origin HEAD:agent/repair-deck-kitchen-favicon
