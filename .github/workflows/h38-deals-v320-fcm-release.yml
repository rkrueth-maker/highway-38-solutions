name: H38 Deals v3.2.0 native FCM release

# v3.2.0 adds native Firebase Cloud Messaging push to the H38 Deals app so
# Scout penny/resale deal alerts buzz the phone from the Deals app itself
# (the app WebView has no Web Push — see h38-scout-push register_device).
#
# Two jobs, honest gates:
#   compile-gate - always runs. Builds the owner APK against a clearly
#                  marked STUB google-services.json (fake project, fake key)
#                  with an ephemeral runner debug key, and verifies badging
#                  and the compiled native-push markers. Its artifact is
#                  COMPILE PROOF ONLY — wrong Firebase project AND wrong
#                  signing key; it can never receive a push and must never
#                  be installed.
#   release      - publishes a real APK only when ALL of these hold:
#                  (a) repo secret H38_DEALS_GOOGLE_SERVICES_JSON_B64 holds
#                      the real google-services.json for
#                      com.highway38.resellerscout.owner;
#                  (b) a signing key is available (see below).
#                  Otherwise it publishes a RELEASE_BLOCKED marker naming the
#                  missing piece and no APK.
#
# Signing reality (verified 2026-10-13): the 3.1.2 owner key lived only in
# the Actions cache `h38-reseller-scout-owner-debug-signing-v1`; GitHub
# evicts caches unused for 7 days and that cache is GONE (exact-key cache
# query returns 0). A build signed with any other key cannot update the
# installed 3.1.2 in place. So the release job:
#   - uses the persisted key when it is present AND its certificate is the
#     known 3.1.2 cert (update-in-place preserved);
#   - otherwise BLOCKS, unless repo variable
#     H38_DEALS_ALLOW_NEW_SIGNING_KEY=YES explicitly authorizes a fresh
#     key — then it signs with the authorized fresh key and flags the APK
#     FRESH-KEY-REINSTALL-REQUIRED (uninstall the old app, install fresh,
#     sign in once).
#
# Key persistence (fixed 2026-10-13, release run): the authorized fresh
# key was generated ONCE and persisted as repo secrets —
# H38_DEALS_KEYSTORE_B64 (+ H38_DEALS_KEYSTORE_PASSWORD /
# H38_DEALS_KEY_ALIAS / H38_DEALS_KEY_PASSWORD) — because an Actions
# cache is NOT durable storage (that is exactly how the 3.1.2 key was
# lost). The release job restores the keystore from the secret first;
# the legacy cache is only a fallback, and on-runner generation is a
# last resort that must be re-persisted as the secret before shipping.
#
# The backend half (scout_device_tokens, register_device, FCM send branch)
# is deployed independently via the Supabase Management API and does not
# depend on this workflow.

on:
  # Pushing this file on the frozen branch is the dispatch mechanism (the
  # API token available to the build crew cannot create workflow_dispatch
  # events — same pattern as the v3.1.2 release workflow). Manual dispatch
  # stays available for anyone with Actions write.
  push:
    branches:
      - agent/scout-fcm-push
    paths:
      - .github/workflows/h38-deals-v320-fcm-release.yml
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD_V320_NATIVE_PUSH to run this frozen build
        required: true
        type: choice
        options:
          - BUILD_V320_NATIVE_PUSH

permissions:
  contents: read

concurrency:
  group: h38-deals-v320-fcm-release
  cancel-in-progress: false

jobs:
  compile-gate:
    name: Compile gate with stub Firebase config (never installable)
    if: github.event_name == 'push' || inputs.confirmation == 'BUILD_V320_NATIVE_PUSH'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      GRADLE_HOME_DIR: /home/runner/gradle-8.13
    steps:
      - name: Freeze on the reviewed branch
        run: |
          test "$GITHUB_REF" = "refs/heads/agent/scout-fcm-push" || { echo "Run only from refs/heads/agent/scout-fcm-push; got $GITHUB_REF"; exit 1; }
          case "$GITHUB_EVENT_NAME" in push|workflow_dispatch) ;; *) echo "Push or manual dispatch required"; exit 1;; esac

      - name: Check out the frozen source
        uses: actions/checkout@v4
        with:
          ref: agent/scout-fcm-push
          path: source
          fetch-depth: 1

      - name: Write the clearly-marked STUB Firebase config
        working-directory: source/native/h38-site-scanner/android-app
        run: |
          test ! -e reseller/google-services.json || { echo "google-services.json must not be committed"; exit 1; }
          cat > reseller/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "h38-deals-stub-compile-only",
              "storage_bucket": "h38-deals-stub-compile-only.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.highway38.resellerscout.owner" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "STUB_NOT_A_REAL_FIREBASE_KEY_COMPILE_ONLY" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          echo "Stub google-services.json written (fake project h38-deals-stub-compile-only)."

      - name: Validate the frozen v3.2.0 source
        working-directory: source/native/h38-site-scanner/android-app
        run: |
          set -euo pipefail
          grep -F "versionCode 343" reseller/build.gradle
          grep -F "versionName '3.2.0'" reseller/build.gradle
          grep -F "id 'com.google.gms.google-services'" reseller/build.gradle
          grep -F "com.google.firebase:firebase-messaging" reseller/build.gradle
          grep -F "H38_DEALS_NATIVE_PUSH_V320" reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          grep -F "H38DealsMessagingService" reseller/src/main/AndroidManifest.xml
          grep -F "android.permission.POST_NOTIFICATIONS" reseller/src/main/AndroidManifest.xml
          grep -F "register_device" reseller/src/main/java/com/highway38/resellerscout/PushRegistrar.java
          echo "Frozen v3.2.0 native-push source: OK"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle and the Android SDK
        run: |
          # No pipefail here on purpose: `yes | sdkmanager --licenses` ends
          # with a benign SIGPIPE for yes once sdkmanager stops reading.
          set -eu
          mkdir -p "$GRADLE_HOME_DIR" "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /home/runner
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Build and verify the compile-gate APK
        working-directory: source/native/h38-site-scanner/android-app
        run: |
          set -euo pipefail
          # No upload-key env: the module signs the owner build with its
          # debug signing config (ephemeral runner key). Compile proof only.
          "$GRADLE_HOME_DIR/bin/gradle" :reseller:assembleOwner --no-daemon --stacktrace
          apk=$(find reseller/build/outputs/apk/owner -type f -name '*.apk' -print -quit)
          test -n "$apk" || { echo "Owner APK was not produced"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/verified"
          cp "$apk" "$GITHUB_WORKSPACE/verified/H38-Deals-3.2.0-COMPILE-ONLY-STUB-FIREBASE.apk"
          final="$GITHUB_WORKSPACE/verified/H38-Deals-3.2.0-COMPILE-ONLY-STUB-FIREBASE.apk"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$final" | tee /tmp/badging.txt
          grep -F "package: name='com.highway38.resellerscout.owner'" /tmp/badging.txt
          grep -F "versionCode='343'" /tmp/badging.txt
          grep -F "versionName='3.2.0'" /tmp/badging.txt
          grep -F "application-label:'H38 Deals'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$final" | tee /tmp/certs.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/certs.txt
          unzip -p "$final" 'classes*.dex' > /tmp/all.dex
          grep -a -F "H38_DEALS_NATIVE_PUSH_V320" /tmp/all.dex >/dev/null || { echo "Native push marker missing from dex"; exit 1; }
          grep -a -F "H38DealsMessagingService" /tmp/all.dex >/dev/null || { echo "Messaging service missing from dex"; exit 1; }
          grep -a -F "com/google/firebase/messaging" /tmp/all.dex >/dev/null || { echo "Firebase Messaging missing from dex"; exit 1; }
          echo "COMPILE GATE PASSED: v3.2.0 native-push source compiles and packages. Stub Firebase + ephemeral key: NEVER install this APK."

      - name: Publish the compile-gate APK (proof only)
        uses: actions/upload-artifact@v4
        with:
          name: H38-Deals-3.2.0-COMPILE-ONLY-do-not-install
          path: verified/H38-Deals-3.2.0-COMPILE-ONLY-STUB-FIREBASE.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release build (real Firebase config + signing key required)
    needs: compile-gate
    if: github.event_name == 'push' || inputs.confirmation == 'BUILD_V320_NATIVE_PUSH'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      GRADLE_HOME_DIR: /home/runner/gradle-8.13
      EXPECTED_CERT_SHA256: cdabe362ad80788c4ac216a26a8dcc44174eceb3c380c3b4a126507af4043c46
      GOOGLE_SERVICES_B64: ${{ secrets.H38_DEALS_GOOGLE_SERVICES_JSON_B64 }}
      ALLOW_NEW_KEY: ${{ vars.H38_DEALS_ALLOW_NEW_SIGNING_KEY }}
      KEYSTORE_B64: ${{ secrets.H38_DEALS_KEYSTORE_B64 }}
    steps:
      - name: Check out the frozen source
        uses: actions/checkout@v4
        with:
          ref: agent/scout-fcm-push
          path: source
          fetch-depth: 1

      - name: Decode the real Firebase config if the secret exists
        id: cfg
        working-directory: source/native/h38-site-scanner/android-app
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_B64:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Repository secret H38_DEALS_GOOGLE_SERVICES_JSON_B64 is not set."
            exit 0
          fi
          echo "$GOOGLE_SERVICES_B64" | base64 -d > reseller/google-services.json
          pkg=$(python3 -c "import json;d=json.load(open('reseller/google-services.json'));print(d['client'][0]['client_info']['android_client_info']['package_name'])")
          test "$pkg" = "com.highway38.resellerscout.owner" || { echo "google-services.json package mismatch: $pkg"; exit 1; }
          project=$(python3 -c "import json;d=json.load(open('reseller/google-services.json'));print(d['project_info']['project_id'])")
          echo "project=$project" >> "$GITHUB_OUTPUT"
          echo "present=true" >> "$GITHUB_OUTPUT"
          echo "Real Firebase config decoded for project: $project"

      - name: Restore the signing keystore from the repo secret (durable)
        id: keystore
        if: steps.cfg.outputs.present == 'true'
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            mkdir -p "$HOME/.android"
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
            test -s "$HOME/.android/debug.keystore" || { echo "Keystore secret decoded to an empty file"; exit 1; }
            echo "from_secret=true" >> "$GITHUB_OUTPUT"
            echo "Signing keystore restored from repo secret H38_DEALS_KEYSTORE_B64 (durable; survives cache eviction)."
          else
            echo "from_secret=false" >> "$GITHUB_OUTPUT"
            echo "No H38_DEALS_KEYSTORE_B64 secret set; falling back to the legacy Actions cache."
          fi

      - name: Restore the owner signing key cache (legacy fallback)
        if: steps.cfg.outputs.present == 'true' && steps.keystore.outputs.from_secret != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: h38-reseller-scout-owner-debug-signing-v1

      - name: Assess signing (same key, authorized fresh key, or blocked)
        id: sign
        if: steps.cfg.outputs.present == 'true'
        run: |
          set -euo pipefail
          ks="$HOME/.android/debug.keystore"
          if [ -s "$ks" ]; then
            actual=$(keytool -list -v -keystore "$ks" -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
            if [ "$actual" = "$EXPECTED_CERT_SHA256" ]; then
              echo "mode=same" >> "$GITHUB_OUTPUT"
              echo "Original 3.1.2 signing key restored — update-in-place preserved."
            elif [ "${ALLOW_NEW_KEY:-}" = "YES" ]; then
              echo "mode=fresh" >> "$GITHUB_OUTPUT"
              echo "Signing key present (cert $actual) is the authorized fresh key — reinstall-required line continues."
            else
              echo "mode=blocked" >> "$GITHUB_OUTPUT"
              echo "Keystore cert $actual does not match the installed app's cert and no fresh-key authorization is set."
            fi
          elif [ "${ALLOW_NEW_KEY:-}" = "YES" ]; then
            echo "mode=fresh" >> "$GITHUB_OUTPUT"
            echo "WARNING: no persisted key found (no secret, no cache) — generating an on-runner key as a LAST RESORT. It persists only to the Actions cache; it MUST be saved as repo secret H38_DEALS_KEYSTORE_B64 before this APK ships, or the next build will be signed differently again."
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$ks" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
            test -s "$ks" || { echo "Key generation failed"; exit 1; }
          else
            echo "mode=blocked" >> "$GITHUB_OUTPUT"
            echo "No signing key available: the 3.1.2 owner key cache was evicted and fresh-key signing is not authorized."
          fi

      - name: Publish the blocked marker
        if: steps.cfg.outputs.present != 'true' || steps.sign.outputs.mode == 'blocked'
        run: |
          set -euo pipefail
          mkdir -p blocked
          {
            echo "H38 Deals 3.2.0 release is BLOCKED — no APK was published."
            echo
            if [ "${{ steps.cfg.outputs.present }}" != "true" ]; then
              echo "Missing: a Firebase project for the Deals app."
              echo "One-time setup (about 5 minutes, in a browser signed in as highway38solutions@gmail.com):"
              echo "  1. console.firebase.google.com -> Add project (e.g. \"Highway 38 Scout\"). No billing needed for FCM."
              echo "  2. Add app -> Android -> package com.highway38.resellerscout.owner -> download google-services.json."
              echo "  3. Save it as GitHub repo secret H38_DEALS_GOOGLE_SERVICES_JSON_B64 (base64 of the file)."
              echo "  4. Project settings -> Service accounts -> Generate new private key -> save that JSON as the"
              echo "     Supabase edge-function secret SCOUT_FCM_SERVICE_ACCOUNT_JSON for h38-scout-push."
              echo "  5. Re-run this workflow."
              echo
            fi
            if [ "${{ steps.cfg.outputs.present }}" = "true" ] && [ "${{ steps.sign.outputs.mode }}" = "blocked" ]; then
              echo "Missing: the original app signing key."
              echo "The 3.1.2 signing key lived only in a GitHub Actions cache that has been evicted"
              echo "(caches unused for 7 days are deleted; the last Deals build was 2026-09-28)."
              echo "Without it, no new APK can update the installed app in place."
              echo "Options: (a) find ~/.android/debug.keystore on any machine that ever built the app"
              echo "with certificate SHA-256 cdabe362ad80788c4ac216a26a8dcc44174eceb3c380c3b4a126507af4043c46"
              echo "and persist it as repo secret H38_DEALS_KEYSTORE_B64; or (b) accept a one-time uninstall + reinstall + sign-in on"
              echo "both phones by setting repo variable H38_DEALS_ALLOW_NEW_SIGNING_KEY=YES and re-running."
            fi
          } > blocked/RELEASE_BLOCKED.txt
          cat blocked/RELEASE_BLOCKED.txt

      - name: Upload the blocked marker
        if: steps.cfg.outputs.present != 'true' || steps.sign.outputs.mode == 'blocked'
        uses: actions/upload-artifact@v4
        with:
          name: H38-Deals-3.2.0-RELEASE-BLOCKED
          path: blocked/RELEASE_BLOCKED.txt
          if-no-files-found: error
          retention-days: 30

      - name: Set up Java 17
        if: steps.cfg.outputs.present == 'true' && steps.sign.outputs.mode != 'blocked'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle and the Android SDK
        if: steps.cfg.outputs.present == 'true' && steps.sign.outputs.mode != 'blocked'
        run: |
          # No pipefail here on purpose: `yes | sdkmanager --licenses` ends
          # with a benign SIGPIPE for yes once sdkmanager stops reading.
          set -eu
          mkdir -p "$GRADLE_HOME_DIR" "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /home/runner
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Build and verify the release APK
        if: steps.cfg.outputs.present == 'true' && steps.sign.outputs.mode != 'blocked'
        working-directory: source/native/h38-site-scanner/android-app
        env:
          H38_ANDROID_UPLOAD_KEYSTORE_PATH: /home/runner/.android/debug.keystore
          H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.H38_DEALS_KEYSTORE_PASSWORD }}
          H38_ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.H38_DEALS_KEY_ALIAS }}
          H38_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.H38_DEALS_KEY_PASSWORD }}
          FIREBASE_PROJECT: ${{ steps.cfg.outputs.project }}
          SIGN_MODE: ${{ steps.sign.outputs.mode }}
        run: |
          set -euo pipefail
          "$GRADLE_HOME_DIR/bin/gradle" :reseller:assembleOwner --no-daemon --stacktrace
          apk=$(find reseller/build/outputs/apk/owner -type f -name '*.apk' -print -quit)
          test -n "$apk" || { echo "Owner APK was not produced"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/verified"
          if [ "$SIGN_MODE" = "fresh" ]; then name="H38-Deals-3.2.0-FRESH-KEY-REINSTALL-REQUIRED.apk"; else name="H38-Deals-3.2.0.apk"; fi
          cp "$apk" "$GITHUB_WORKSPACE/verified/$name"
          final="$GITHUB_WORKSPACE/verified/$name"
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$final" | tee /tmp/badging.txt
          grep -F "package: name='com.highway38.resellerscout.owner'" /tmp/badging.txt
          grep -F "versionCode='343'" /tmp/badging.txt
          grep -F "versionName='3.2.0'" /tmp/badging.txt
          grep -F "application-label:'H38 Deals'" /tmp/badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$final" | tee /tmp/certs.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/certs.txt
          grep -F "Number of signers: 1" /tmp/certs.txt
          if [ "$SIGN_MODE" = "same" ]; then
            grep -F "certificate SHA-256 digest: $EXPECTED_CERT_SHA256" /tmp/certs.txt
          else
            echo "FRESH KEY BUILD: phones must uninstall the old H38 Deals before installing; sign-in will be required once."
            grep -F "certificate SHA-256 digest:" /tmp/certs.txt
          fi
          unzip -p "$final" 'classes*.dex' > /tmp/all.dex
          grep -a -F "H38_DEALS_NATIVE_PUSH_V320" /tmp/all.dex >/dev/null || { echo "Native push marker missing from dex"; exit 1; }
          grep -a -F "H38DealsMessagingService" /tmp/all.dex >/dev/null || { echo "Messaging service missing from dex"; exit 1; }
          grep -a -F "com/google/firebase/messaging" /tmp/all.dex >/dev/null || { echo "Firebase Messaging missing from dex"; exit 1; }
          unzip -p "$final" 'resources.arsc' > /tmp/resources.arsc || true
          grep -a -F "$FIREBASE_PROJECT" /tmp/resources.arsc >/dev/null || { echo "Firebase project id not embedded in APK resources"; exit 1; }
          sha256sum "$final" | tee "$GITHUB_WORKSPACE/verified/$name.sha256"
          echo "RELEASE ACCEPTED: H38 Deals 3.2.0 (versionCode 343), Firebase project $FIREBASE_PROJECT, signing mode $SIGN_MODE"

      - name: Publish the release APK
        if: steps.cfg.outputs.present == 'true' && steps.sign.outputs.mode != 'blocked'
        uses: actions/upload-artifact@v4
        with:
          name: H38-Deals-3.2.0-release
          path: verified/*
          if-no-files-found: error
          retention-days: 90
