name: Verify cross-platform H38 assistant polish

on:
  pull_request:
    paths:
      - 'commercial-app/office-polish.js'
      - 'commercial-app/office-polish.css'
      - 'commercial-app/personal-assistant.js'
      - 'commercial-app/assistant-command-bus.js'
      - 'commercial-app/assistant-command-bus-input.js'
      - 'commercial-app/supabase-ai-fallback.js'
      - 'commercial-app/employee-workspace.js'
      - 'supabase/migrations/20260808034500_personal_assistant_private_records.sql'
      - 'docs/architecture/H38_ASSISTANT_AUTHORITY.md'
      - 'scripts/verify-cross-platform-assistant-polish.js'
      - 'scripts/verify-assistant-management-commands.js'
      - 'scripts/verify-personal-assistant-command-bus.js'
      - 'scripts/verify-employee-desktop-shell.js'
      - '.github/workflows/verify-cross-platform-assistant-polish.yml'

jobs:
  verify-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check cross-platform polish
        run: |
          node --check commercial-app/office-polish.js
          node --check scripts/verify-cross-platform-assistant-polish.js
          node --check scripts/verify-assistant-management-commands.js
          node --check scripts/verify-employee-desktop-shell.js
      - name: Verify Personal Assistant business command bus
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/verify-personal-assistant-command-bus.js
          node scripts/verify-assistant-management-commands.js

  verify-chromium-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Verify Android-safe and iPhone-WebKit polish
        run: node scripts/verify-cross-platform-assistant-polish.js
      - name: Verify staff desktop shell geometry
        run: node scripts/verify-employee-desktop-shell.js
      - name: Upload cross-platform visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: h38-cross-platform-assistant-${{ github.run_id }}
          path: |
            artifacts/cross-platform-assistant/android-assistant-390x844.png
            artifacts/cross-platform-assistant/iphone-webkit-assistant-390x844.png
            artifacts/employee-desktop-shell/staff-desktop-1600x900.png
          if-no-files-found: error
