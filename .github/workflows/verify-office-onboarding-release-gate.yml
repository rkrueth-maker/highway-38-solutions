name: Verify office onboarding release gate
on:
  pull_request:
    paths:
      - 'commercial-app/office-onboarding-release-gate.js'
      - 'commercial-app/site-visit-quote-wide-pass-loader.js'
      - 'supabase/functions/h38-quote-release-gate/**'
      - 'supabase/migrations/20260905233000_supabase_traffic_efficiency.sql'
      - 'scripts/verify-office-onboarding-release-gate.js'
      - '.github/workflows/verify-office-onboarding-release-gate.yml'
  push:
    branches: [main]
    paths:
      - 'commercial-app/office-onboarding-release-gate.js'
      - 'commercial-app/site-visit-quote-wide-pass-loader.js'
      - 'supabase/functions/h38-quote-release-gate/**'
      - 'supabase/migrations/20260905233000_supabase_traffic_efficiency.sql'
      - 'scripts/verify-office-onboarding-release-gate.js'
      - '.github/workflows/verify-office-onboarding-release-gate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check commercial-app/office-onboarding-release-gate.js
          node --check commercial-app/site-visit-quote-wide-pass-loader.js
          node --check scripts/verify-office-onboarding-release-gate.js
      - name: Release contract
        run: node scripts/verify-office-onboarding-release-gate.js
      - name: Existing quote and staff regressions
        run: |
          python -m pytest -q tests/test_quote_agent_walkthrough_acceptance_20260824.py tests/test_site_visit_quote_wide_pass_final.py
          node scripts/verify-employee-workspace.js
          node scripts/verify-supabase-business-office-auth.js
