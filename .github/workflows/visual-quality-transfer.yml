name: Transfer reviewed visual
on:
  push:
    branches: [main]
    paths: ['.github/workflows/visual-quality-transfer.yml']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/visual-quality-gate
          fetch-depth: 0
      - name: Download reviewed raster visual
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o assets/contractor-demo/flower-after-same-house.png 'https://platform-cs-va6c2.adobe.io/composite/primary/id/urn:aaid:sc:VA6C2:cdc086c7-4148-480a-9ab1-ce011bedb150'
          file assets/contractor-demo/flower-after-same-house.png | grep -q PNG
          test "$(stat -c%s assets/contractor-demo/flower-after-same-house.png)" -gt 50000
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/contractor-demo/flower-after-same-house.png
          git commit -m 'Add reviewed realistic same-house flower result'
          git push origin HEAD:repair/visual-quality-gate
