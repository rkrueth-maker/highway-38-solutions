name: Build Private Reseller Scout

on:
  push:
    branches:
      - agent/private-reseller-scout
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: private-reseller-scout-build
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Verify and package owner test build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm isolated Scout branch authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/private-reseller-scout"
          test "$(git branch --show-current)" = "agent/private-reseller-scout"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'branch=%s\nsha=%s\nisolation=%s\n' "$GITHUB_REF_NAME" "$(git rev-parse HEAD)" "main-not-merged-or-modified-by-this-workflow"

      - name: Verify Reseller Scout security and architecture
        run: node scripts/verify-private-reseller-scout.js

      - name: Syntax and source-path checks
        shell: bash
        run: |
          set -euo pipefail
          node --check commercial-app/app-01.js
          node --check commercial-app/app-02.js
          node --check commercial-app/reseller-scout.js
          node --check scripts/verify-private-reseller-scout.js
          node --check supabase/functions/reseller-auto-leads-v064/source-adapters.mjs
          node --check supabase/functions/reseller-auto-leads-v064/dg-source-orchestrator.mjs
          node supabase/functions/reseller-auto-leads-v064/source-adapters.test.mjs
          node supabase/functions/reseller-auto-leads-v064/dg-source-orchestrator.test.mjs
          node deals-app/verify-resale-coupon-ux.js

      - name: Create build manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/private-reseller-scout
          cat > artifacts/private-reseller-scout/BUILD.txt <<EOF
          Highway 38 Private Reseller Scout — Owner Test Build
          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Runtime access: two approved Supabase user IDs only
          Production Pages changed: no
          Main branch changed: no
          External purchase/listing actions: none
          EOF
          cp commercial-app/reseller-scout.js artifacts/private-reseller-scout/
          cp commercial-app/reseller-scout.css artifacts/private-reseller-scout/
          cp commercial-app/app-01.js artifacts/private-reseller-scout/
          cp commercial-app/app-02.js artifacts/private-reseller-scout/
          cp supabase/functions/reseller-deal-feed/index.ts artifacts/private-reseller-scout/reseller-deal-feed-index.ts
          cp supabase/migrations/20260818203000_private_reseller_scout.sql artifacts/private-reseller-scout/
          cp supabase/migrations/20260818204000_tighten_private_reseller_grants.sql artifacts/private-reseller-scout/
          (cd artifacts && zip -qr h38-private-reseller-scout-owner-test.zip private-reseller-scout)

      - name: Upload owner test build
        uses: actions/upload-artifact@v4
        with:
          name: h38-private-reseller-scout-owner-test
          path: artifacts/h38-private-reseller-scout-owner-test.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish package status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="success"
          description="Scout package verification passed"
          if [ "${{ job.status }}" != "success" ]; then
            state="failure"
            description="Scout package verification failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \\
            -f state="$state" \\
            -f context="H38 Scout / verify package" \\
            -f description="$description" \\
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  live-web-buttons:
    name: Live web button acceptance
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SUPABASE_URL: https://jqukmwtsgcsaruucnqja.supabase.co
      H38_WEB_BASE: https://h38-deals-jxabx5x09-h39.vercel.app
      SUPABASE_KEY: sb_publishable_XrF41kGmTC2SmSTgPvo5OQ_vqcBd0N1
      SCOUT_EMAIL: ${{ secrets.H38_SCOUT_TEST_EMAIL }}
      SCOUT_PASSWORD: ${{ secrets.H38_SCOUT_TEST_PASSWORD }}
      H38_ACCEPTANCE_OUT: artifacts/scout-web-button-acceptance/report.json
    steps:
      - name: Checkout private branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm isolated Scout branch authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "agent/private-reseller-scout"
          test "$(git branch --show-current)" = "agent/private-reseller-scout"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned Playwright browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise all live web controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/scout-web-button-acceptance
          node scripts/build-scout-static-web.cjs artifacts/scout-web-static
          python3 -m http.server 4173 --bind 127.0.0.1 --directory artifacts/scout-web-static > /tmp/h38-scout-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ | grep -Fq 'id="signin"'
          curl -fsS "$H38_WEB_BASE/" | grep -Fq 'id="signin"'
          node scripts/scout-web-button-acceptance.cjs

      - name: Upload live web acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h38-scout-web-button-acceptance
          path: artifacts/scout-web-button-acceptance/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish live web acceptance status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state="success"
          description="Live web button acceptance passed"
          if [ "${{ job.status }}" != "success" ]; then
            state="failure"
            description="Live web button acceptance failed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \\
            -f state="$state" \\
            -f context="H38 Scout / live web buttons" \\
            -f description="$description" \\
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
