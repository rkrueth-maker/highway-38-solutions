name: Build Reseller Scout v0.1.18 source

on:
  push:
    branches:
      - agent/private-reseller-scout
    paths:
      - 'scripts/private_reseller_v018_patch.py'
      - '.github/workflows/private-reseller-v018-builder.yml'
  pull_request:
    branches:
      - agent/private-reseller-scout
    paths:
      - '.private-reseller-v018-trigger'
      - 'scripts/private_reseller_v018_patch.py'
      - '.github/workflows/private-reseller-v018-builder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: private-reseller-v018-builder
  cancel-in-progress: false

jobs:
  patch-private-reseller:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'agent/private-reseller-scout')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/private-reseller-scout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply private v0.1.18 patch
        run: python scripts/private_reseller_v018_patch.py
      - name: Verify scope and patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only
          test "$(git branch --show-current)" = 'agent/private-reseller-scout'
          grep -Fq "versionName '0.1.18'" native/h38-site-scanner/android-app/reseller/build.gradle
          grep -Fq 'versionCode 19' native/h38-site-scanner/android-app/reseller/build.gradle
          grep -Fq 'OPPORTUNITY_ENGINE_V1' native/h38-site-scanner/android-app/reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          grep -Fq 'MARKETPLACE_SHARE_IN_V1' native/h38-site-scanner/android-app/reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          grep -Fq 'android.intent.action.SEND' native/h38-site-scanner/android-app/reseller/src/main/AndroidManifest.xml
          grep -Fq 'all-stores-parts-lm-fast-v2' .github/workflows/private-reseller-scout-apk.yml
      - name: Commit private source
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/private_reseller_v018_patch.py .github/workflows/private-reseller-v018-builder.yml
          git config user.name 'H38 Reseller Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add native/h38-site-scanner/android-app/reseller/build.gradle \
                  native/h38-site-scanner/android-app/reseller/BUILD-MARKER.txt \
                  native/h38-site-scanner/android-app/reseller/src/main/AndroidManifest.xml \
                  native/h38-site-scanner/android-app/reseller/src/main/java/com/highway38/resellerscout/MainActivity.java \
                  .github/workflows/private-reseller-scout-apk.yml \
                  scripts/private_reseller_v018_patch.py \
                  .github/workflows/private-reseller-v018-builder.yml
          git commit -m 'Build private reseller opportunity engine v0.1.18'
          git push origin HEAD:agent/private-reseller-scout
