name: Build H38 Scout v2.8.1 Facebook + DG Repair
on:
  push:
    branches: ['agent/private-reseller-scout']
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - '.github/workflows/scout-v266-actionable-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Contract gates
        run: |
          set -euo pipefail
          grep -Fq "versionName '2.8.1'" reseller/build.gradle
          grep -Fq 'versionCode 97' reseller/build.gradle
          grep -Fq 'H38_SCOUT_V281_FACEBOOK_DG_REPAIR=true' reseller/src/main/assets/reseller/v266-actionable-intake.js
          grep -Fq "proof=[label,zip].filter(Boolean).join('|')" reseller/src/main/assets/reseller/v266-actionable-intake.js
          grep -Fq 'verifiedImageIdentity(r)&&/^https:\/\//i.test' reseller/src/main/assets/reseller/v266-actionable-intake.js
          grep -Fq 'FacebookMarketplaceEmbeddedCollector' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          grep -Fq 'facebookCollector.start' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          grep -Fq 'FacebookMarketplaceEmbeddedCollector.rowsJson' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          grep -Fq 'stateAbbrev' reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceEmbeddedCollector.java
          grep -Fq 'pageNorm.contains(city)' reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceEmbeddedCollector.java
          grep -Fq 'setTranslationX(-5000f)' reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceEmbeddedCollector.java
          ! grep -Fq '<activity android:name=".FacebookMarketplaceActivity"' reseller/src/main/AndroidManifest.xml
          node --check reseller/src/main/assets/reseller/v266-actionable-intake.js
          node reseller/hunt-native.test.mjs
          node reseller/profit-engine.test.mjs
      - name: Build owner APK
        run: |
          gradle --no-daemon :reseller:assembleOwner
          mkdir -p "$GITHUB_WORKSPACE/artifacts/scout-v281"
          cp reseller/build/outputs/apk/owner/reseller-owner.apk "$GITHUB_WORKSPACE/artifacts/scout-v281/H38-Reseller-Scout-Owner-v2.8.1.apk"
          sha256sum "$GITHUB_WORKSPACE/artifacts/scout-v281/H38-Reseller-Scout-Owner-v2.8.1.apk" > "$GITHUB_WORKSPACE/artifacts/scout-v281/H38-Reseller-Scout-Owner-v2.8.1.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v2.8.1-facebook-dg-repair
          path: artifacts/scout-v281/*
