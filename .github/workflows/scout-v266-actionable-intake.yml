name: Build H38 Scout v2.8.2 Facebook Truth + Images
on:
  push:
    branches: ['agent/private-reseller-scout']
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - '.github/workflows/scout-v266-actionable-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Contract gates
        run: |
          set -euo pipefail
          grep -Fq "versionName '2.8.2'" reseller/build.gradle
          grep -Fq 'versionCode 98' reseller/build.gradle
          grep -Fq 'H38_SCOUT_V282_EVIDENCE_REPAIR' reseller/src/main/assets/reseller/v265-facebook-acquisition-repair.js
          grep -Fq 'Connect Facebook once' reseller/src/main/assets/reseller/v265-facebook-acquisition-repair.js
          grep -Fq 'Craigslist results below do not count as Facebook success' reseller/src/main/assets/reseller/v265-facebook-acquisition-repair.js
          grep -Fq "rk==='dollar general'||rk==='dollar tree'||rk==='family dollar'" reseller/src/main/assets/reseller/v265-facebook-acquisition-repair.js
          grep -Fq '__H38_CONNECT__' reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceEmbeddedCollector.java
          grep -Fq 'c_user=' reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceEmbeddedCollector.java
          grep -Fq 'AUTH_REQUIRED' reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceEmbeddedCollector.java
          grep -Fq 'COMPLETE_WITH_ROWS' reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceEmbeddedCollector.java
          grep -Fq 'FacebookMarketplaceEmbeddedCollector' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          ! grep -Fq '<activity android:name=".FacebookMarketplaceActivity"' reseller/src/main/AndroidManifest.xml
          node --check reseller/src/main/assets/reseller/v265-facebook-acquisition-repair.js
          node --check reseller/src/main/assets/reseller/v266-actionable-intake.js
          node reseller/hunt-native.test.mjs
          node reseller/profit-engine.test.mjs
      - name: Build owner APK
        run: |
          gradle --no-daemon :reseller:assembleOwner
          mkdir -p "$GITHUB_WORKSPACE/artifacts/scout-v282"
          cp reseller/build/outputs/apk/owner/reseller-owner.apk "$GITHUB_WORKSPACE/artifacts/scout-v282/H38-Reseller-Scout-Owner-v2.8.2.apk"
          sha256sum "$GITHUB_WORKSPACE/artifacts/scout-v282/H38-Reseller-Scout-Owner-v2.8.2.apk" > "$GITHUB_WORKSPACE/artifacts/scout-v282/H38-Reseller-Scout-Owner-v2.8.2.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v2.8.2-facebook-truth-images
          path: artifacts/scout-v282/*
