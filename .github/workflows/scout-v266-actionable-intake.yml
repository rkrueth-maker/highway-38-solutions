name: Build H38 Scout v2.7.0 Wide Repair
on:
  push:
    branches: ['agent/private-reseller-scout']
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - '.github/workflows/scout-v266-actionable-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Contract gates
        run: |
          set -euo pipefail
          grep -Fq "versionName '2.7.0'" reseller/build.gradle
          grep -Fq 'versionCode 94' reseller/build.gradle
          grep -Fq 'H38_SCOUT_V270_WIDE_REPAIR=true' reseller/src/main/assets/reseller/v266-actionable-intake.js
          grep -Fq 'Pictures, price evidence and the next action stay here in Scout' reseller/src/main/assets/reseller/v266-actionable-intake.js
          grep -Fq "fbSec.remove()" reseller/src/main/assets/reseller/v266-actionable-intake.js
          grep -Fq 'fetchImageData' reseller/src/main/assets/reseller/v266-actionable-intake.js
          grep -Fq 'Theme_Translucent_NoTitleBar' reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java
          grep -Fq 'FLAG_NOT_TOUCHABLE' reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java
          grep -Fq 'setAlpha(0.01f)' reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java
          grep -Fq 'fetchImageData(String key,String url)' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          grep -Fq 'facebookBrowserCandidates' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          grep -Fq 'android:mimeType="text/*"' reseller/src/main/AndroidManifest.xml
          node --check reseller/src/main/assets/reseller/v266-actionable-intake.js
          node reseller/hunt-native.test.mjs
          node reseller/profit-engine.test.mjs
      - name: Build owner APK
        run: |
          gradle --no-daemon :reseller:assembleOwner
          mkdir -p "$GITHUB_WORKSPACE/artifacts/scout-v270"
          cp reseller/build/outputs/apk/owner/reseller-owner.apk "$GITHUB_WORKSPACE/artifacts/scout-v270/H38-Reseller-Scout-Owner-v2.7.0.apk"
          sha256sum "$GITHUB_WORKSPACE/artifacts/scout-v270/H38-Reseller-Scout-Owner-v2.7.0.apk" > "$GITHUB_WORKSPACE/artifacts/scout-v270/H38-Reseller-Scout-Owner-v2.7.0.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v2.7.0-wide-repair
          path: artifacts/scout-v270/*
