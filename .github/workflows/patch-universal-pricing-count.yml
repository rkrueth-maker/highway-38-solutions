name: Patch Universal Pricing Count

on:
  push:
    branches:
      - agent/universal-quote-builder-house-demo
    paths:
      - '.github/workflows/patch-universal-pricing-count.yml'

permissions:
  contents: write

concurrency:
  group: patch-universal-pricing-count
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/universal-quote-builder-house-demo
          fetch-depth: 0

      - name: Correct exact public pricing-method metric
        shell: python
        run: |
          from pathlib import Path
          path = Path('sample-library-now.html')
          text = path.read_text(encoding='utf-8')
          old = '<strong>32</strong><span>auditable pricing methods</span>'
          new = '<strong>34</strong><span>auditable pricing methods</span>'
          if text.count(old) != 1:
              raise SystemExit('HOLD — exact pricing-method metric was not found once.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove temporary workflow and publish correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-universal-pricing-count.yml
          git add sample-library-now.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correct Universal Quote Builder pricing method count'
          git push origin HEAD:agent/universal-quote-builder-house-demo
