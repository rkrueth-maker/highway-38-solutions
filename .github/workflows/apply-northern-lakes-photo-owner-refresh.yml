name: Apply Northern Lakes photo and owner-link refresh

on:
  push:
    branches:
      - agent/fix-northern-lakes-photo-library-owner-links
    paths:
      - .github/workflows/apply-northern-lakes-photo-owner-refresh.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-northern-lakes-photo-library-owner-links
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests
      - name: Wire distinct photos and current Supabase owner access
        run: |
          cat > /tmp/apply_refresh.py <<'PY'
          from pathlib import Path
          import json, re, html, requests

          root=Path('.')
          site=root/'businesses/northern-lakes'
          VERSION='nl-photo-owner-refresh-20260805-v2'
          OWNER_URL='owner-access.html?v=owner-access-20260805-v2'

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path,text): Path(path).write_text(text,encoding='utf-8')
          def replace(path,old,new):
            text=read(path)
            if old not in text:
              print('replacement marker absent:',path,old)
            write(path,text.replace(old,new))

          catalog_path=site/'service-catalog.js'
          catalog=read(catalog_path)
          images={
            'cabin-care':'service-source/cabin-care.jpg',
            'driveway-drainage':'excavation.svg',
            'commercial-property-care':'about.svg',
            'rental-resort-support':'service-source/rental-resort-support.jpg',
            'senior-property-maintenance':'service-source/senior-property-maintenance.jpg',
            'brush-trail-lot-clearing':'service-source/brush-clearing.jpg',
            'storm-tree-cleanup':'service-source/storm-cleanup.jpg',
            'lawn-landscaping':'lawn.svg',
            'snow-ice':'snow.svg',
            'cleanouts-hauling':'service-source/cleanouts-hauling.jpg',
            'small-property-improvements':'landscaping.svg',
            'gutter-cleaning':'service-source/gutter-cleaning.jpg',
            'pressure-washing':'service-source/pressure-washing.jpg',
            'firewood-delivery':'service-source/firewood-delivery.jpg',
            'seasonal-yard-cleanup':'service-source/seasonal-yard-cleanup.jpg',
            'holiday-lights':'service-source/holiday-lights.jpg',
            'outdoor-furniture':'service-source/outdoor-furniture.jpg',
            'equipment-rental':'equipment.svg',
            'materials-delivery':'materials-source/material-delivery.jpg',
          }
          lines=[]
          for line in catalog.splitlines():
            match=re.search(r"id:'([^']+)'",line)
            if match and match.group(1) in images:
              line=re.sub(r"image:A\+'[^']+'",f"image:A+'{images[match.group(1)]}'",line,count=1)
            lines.append(line)
          write(catalog_path,'\n'.join(lines)+'\n')

          page_images={
            'cabin-care.html':('assets/lake.svg','assets/service-source/cabin-care.jpg'),
            'rental-resort-support.html':('assets/lake.svg','assets/service-source/rental-resort-support.jpg'),
            'commercial-property-care.html':('assets/about.svg','assets/about.svg'),
            'cleanouts-hauling.html':('assets/equipment.svg','assets/service-source/cleanouts-hauling.jpg'),
          }
          for name,(old,new) in page_images.items():
            path=site/name
            if path.exists(): write(path,read(path).replace(old,new))

          for path in site.glob('*.html'):
            text=read(path)
            text=text.replace('nl-catalog-20260805','nl-catalog-20260805-v2')
            text=text.replace('nl-materials-20260805','nl-materials-20260805-v2')
            text=text.replace('nl-site-portal-20260805','nl-site-portal-20260805-v2')
            if path.name not in {'owner-login.html','owner-portal.html','owner-access.html'}:
              text=text.replace('href="owner-login.html"',f'href="{OWNER_URL}"')
              text=text.replace("href='owner-login.html'",f"href='{OWNER_URL}'")
            write(path,text)

          shell=read(site/'site-shell.js')
          shell=shell.replace("const V='nl-site-portal-20260805';",f"const V='{VERSION}';")
          shell=shell.replace('href="owner-login.html"',f'href="{OWNER_URL}"')
          write(site/'site-shell.js',shell)

          owner_access='''<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="robots" content="noindex,nofollow,noarchive"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
          <meta name="theme-color" content="#113b2e"><title>Northern Lakes Secure Owner Access</title>
          <link rel="icon" type="image/svg+xml" href="assets/diamond-logo.svg?v=owner-access-20260805-v2"><link rel="stylesheet" href="app-ui.css?v=owner-access-20260805-v2"></head>
          <body><main class="login-page"><section class="login-card"><div class="login-brand"><img src="assets/diamond-logo.svg?v=owner-access-20260805-v2" alt="Northern Lakes Property Maintenance LLC approved logo"><h2>Reliable. Honest. Hardworking.</h2><p>Secure Northern Lakes access through the shared Supabase Business Office.</p></div>
          <div class="login-form"><div class="eyebrow">Secure owner access</div><h1>Activate and open Northern Lakes.</h1><div class="notice" data-deployment-status>Checking the current Northern Lakes Supabase tenant…</div>
          <p>Use the exact email address that was invited. Old Google Apps Script Office versions and old portal links are retired.</p>
          <form id="nlInviteActivationForm"><label for="nlInviteEmail">Invited email address</label><input id="nlInviteEmail" type="email" autocomplete="email" required placeholder="you@example.com"><button class="btn" type="submit">Send secure activation email</button></form><div id="nlInviteStatus" class="notice">No email is sent until you press the button.</div>
          <p><a class="btn" data-nl-app="office" aria-disabled="true">Open Owner Workspace</a></p><p><a class="btn secondary" data-nl-app="quote" aria-disabled="true">Open Quote Builder</a></p>
          <ul class="muted"><li>One tenant-isolated Supabase Business Office</li><li>Private Northern Lakes records and storage</li><li>Owner-reviewed customer and financial actions</li><li>No live charging or automatic customer sending</li></ul><p><a href="index.html">← Return to public website</a></p></div></section></main>
          <script src="../commercial-app/supabase-config.js?build=owner-access-20260805-v2"></script><script src="app-launch.js?v=owner-access-20260805-v2"></script><script src="invite-activation.js?v=owner-access-20260805-v2"></script></body></html>'''
          owner_access='\n'.join(line.strip() for line in owner_access.splitlines())+'\n'
          write(site/'owner-access.html',owner_access)

          redirect="<script>window.location.replace('"+OWNER_URL+"');</script>"
          for name in ['owner-login.html','owner-portal.html']:
            compat=owner_access.replace('<title>Northern Lakes Secure Owner Access</title>','<title>Northern Lakes Owner Access Moved</title>')
            compat=compat.replace('</head>',f'<link rel="canonical" href="owner-access.html">{redirect}</head>')
            write(site/name,compat)

          office=read(site/'business-office.html').replace('href="owner-login.html"',f'href="{OWNER_URL}"')
          write(site/'business-office.html',office)
          customer=read(site/'customer-portal.html').replace('href="owner-login.html"',f'href="{OWNER_URL}"')
          write(site/'customer-portal.html',customer)

          deployment=json.loads(read(site/'app-deployment.json'))
          deployment['ownerActivationUrl']='https://highway38solutions.com/businesses/northern-lakes/owner-access.html?v=owner-access-20260805-v2'
          deployment['updatedAt']='2026-08-05T13:50:00Z'
          write(site/'app-deployment.json',json.dumps(deployment,indent=2)+'\n')
          pack_path=root/'business-packs/northern-lakes/supabase-business-pack.json'
          pack=json.loads(read(pack_path)); pack['urls']['ownerActivation']=deployment['ownerActivationUrl']; write(pack_path,json.dumps(pack,indent=2)+'\n')

          robots=read(site/'robots.txt')
          if 'Disallow: /businesses/northern-lakes/owner-access.html' not in robots:
            robots += '\nDisallow: /businesses/northern-lakes/owner-access.html\n'
          write(site/'robots.txt',robots)

          materials=read(site/'materials.html').replace('nl-materials-20260805-v2-v2','nl-materials-20260805-v2')
          write(site/'materials.html',materials)

          sources={
            'service-source/cabin-care.jpg':'Quileute Oceanside Resort Cabin.JPG',
            'service-source/rental-resort-support.jpg':'Lake house.jpg',
            'service-source/senior-property-maintenance.jpg':'Gfp-house-on-a-nice-lawn.jpg',
            'service-source/brush-clearing.jpg':'Clearing, Grubbing, and Grading (8938246).jpg',
            'service-source/storm-cleanup.jpg':'Fallen tree across trail, Neuhof.jpg',
            'service-source/cleanouts-hauling.jpg':'Dump trailer getting loaded.jpg',
            'service-source/gutter-cleaning.jpg':'Cleaned gutter.jpg',
            'service-source/pressure-washing.jpg':'Driveway-Cleaning-1-1.jpg',
            'service-source/firewood-delivery.jpg':'Stack of firewood.jpg',
            'service-source/seasonal-yard-cleanup.jpg':'Leaves on lawn (Unsplash).jpg',
            'service-source/holiday-lights.jpg':'New Hope Minnesota Home Holiday Lights (31814199660).jpg',
            'service-source/outdoor-furniture.jpg':'Outdoor furniture.jpg',
            'materials-source/sand.jpg':'Washed sand stockpile (5081172874).jpg',
            'materials-source/topsoil.jpg':'628 REG TOPSOIL (7).JPG',
          }
          def strip_tags(value): return re.sub(r'<[^>]+>','',html.unescape(value or '')).strip()
          credit=['# Northern Lakes illustrative photo credits','', 'These local catalog photos are used to identify service or material types. They are not represented as completed Northern Lakes jobs. Images were cropped and optimized for website use.','']
          headers={'User-Agent':'Highway38Solutions/1.0 (photo attribution; contact highway38solutions@gmail.com)'}
          for rel,name in sources.items():
            try:
              data=requests.get('https://commons.wikimedia.org/w/api.php',params={'action':'query','format':'json','prop':'imageinfo','iiprop':'extmetadata','titles':'File:'+name},headers=headers,timeout=30).json()
              page=next(iter(data['query']['pages'].values())); meta=page['imageinfo'][0]['extmetadata']
              artist=strip_tags(meta.get('Artist',{}).get('value')) or 'Wikimedia Commons contributor'
              license_name=strip_tags(meta.get('LicenseShortName',{}).get('value')) or 'See source page'
              source=meta.get('DescriptionUrl',{}).get('value') or 'https://commons.wikimedia.org/wiki/File:'+name.replace(' ','_')
              credit.append(f'- `{rel}` — “{name},” {artist}, {license_name}. Source: {source}')
            except Exception as exc:
              credit.append(f'- `{rel}` — “{name}.” Source and license: https://commons.wikimedia.org/wiki/File:{name.replace(" ","_")}')
          write(site/'assets/SITE_PHOTO_CREDITS.md','\n'.join(credit)+'\n')

          verify=read(root/'scripts/verify-northern-lakes-site-portal-build.js')
          verify=verify.replace("requireTrue(/Customer Sign In/.test(portal)&&/owner-login\\.html/.test(portal),'Customer Sign In is separate from Owner Login');","requireTrue(/Customer Sign In/.test(portal)&&/owner-access\\.html/.test(portal),'Customer Sign In is separate from current Owner Access');")
          insert="""
          const ownerAccess=read('businesses/northern-lakes/owner-access.html');
          const ownerLoginCompat=read('businesses/northern-lakes/owner-login.html');
          const ownerPortalCompat=read('businesses/northern-lakes/owner-portal.html');
          requireTrue(/Send secure activation email/.test(ownerAccess)&&/Open Owner Workspace/.test(ownerAccess)&&/Open Quote Builder/.test(ownerAccess),'Current owner-access page exposes Supabase activation, workspace and Quote Builder');
          requireTrue(/owner-access\\.html\\?v=owner-access-20260805-v2/.test(ownerLoginCompat)&&/owner-access\\.html\\?v=owner-access-20260805-v2/.test(ownerPortalCompat),'Legacy owner routes redirect to the uncached current owner-access page');
          requireTrue(!/script\\.google\\.com\\/macros|Open Owner Portal|Open legacy/i.test(publicText),'Active Northern Lakes pages contain no old Apps Script owner links or old owner-portal controls');
          const catalogImages=[...catalogText.matchAll(/id:'([^']+)'[^\\n]*image:A\\+'([^']+)'/g)].map(match=>match[2]);
          requireTrue(catalogImages.length===requiredServices.length&&new Set(catalogImages).size===catalogImages.length,'Every Northern Lakes catalog service uses a distinct active image path');
          for(const image of catalogImages.filter(value=>value.startsWith('service-source/'))){const file=path.join(site,'assets',image);requireTrue(fs.existsSync(file)&&fs.statSync(file).size>50000,`Distinct service photo is durable and full-size: ${image}`);}
          requireTrue(runtime.ownerActivationUrl.includes('owner-access.html?v=owner-access-20260805-v2'),'Deployment manifest points to the current uncached owner-access URL');
          """
          verify=verify.replace("const homepage=read('businesses/northern-lakes/index.html');",insert+"\nconst homepage=read('businesses/northern-lakes/index.html');")
          write(root/'scripts/verify-northern-lakes-site-portal-build.js',verify)

          commercial=read(root/'scripts/verify-northern-lakes-commercial-package.js')
          commercial=commercial.replace("const ownerLogin=read('businesses/northern-lakes/owner-login.html');","const ownerLogin=read('businesses/northern-lakes/owner-login.html');\nconst ownerAccess=read('businesses/northern-lakes/owner-access.html');")
          commercial=commercial.replace("ownerLogin.includes('Send secure activation email')&&ownerLogin.includes('invite-activation.js')","ownerAccess.includes('Send secure activation email')&&ownerAccess.includes('invite-activation.js')")
          commercial=commercial.replace("ownerLogin.includes('old Office versions are retired')&&!/script\\.google\\.com|Emergency rollback|Open legacy/i.test(ownerLogin)","ownerAccess.includes('old Google Apps Script Office versions')&&!/script\\.google\\.com|Emergency rollback|Open legacy/i.test(ownerAccess)")
          write(root/'scripts/verify-northern-lakes-commercial-package.js',commercial)

          workflow=root/'.github/workflows/verify-northern-lakes-site-portal.yml'
          wf=read(workflow).replace("      - 'scripts/audit-northern-lakes-rendered-photos.js'","      - 'scripts/audit-northern-lakes-rendered-photos.js'\n      - 'scripts/verify-northern-lakes-photo-owner-links.js'")
          write(workflow,wf)

          dedicated=r'''#!/usr/bin/env node
          'use strict';
          const fs=require('fs'),path=require('path'),crypto=require('crypto');
          const root=path.resolve(__dirname,'..'),site=path.join(root,'businesses','northern-lakes');
          const read=f=>fs.readFileSync(path.join(root,f),'utf8');
          const fail=[];const ok=(c,m)=>{if(!c)fail.push(m)};
          const shell=read('businesses/northern-lakes/site-shell.js');
          const catalog=read('businesses/northern-lakes/service-catalog.js');
          const active=fs.readdirSync(site).filter(f=>/\.(html|js)$/i.test(f)).map(f=>read('businesses/northern-lakes/'+f)).join('\n');
          ok(shell.includes('owner-access.html?v=owner-access-20260805-v2'),'site shell must use current owner access');
          ok(!/script\.google\.com\/macros|Open Owner Portal/i.test(active),'old Apps Script owner links must be absent');
          const images=[...catalog.matchAll(/id:'([^']+)'[^\n]*image:A\+'([^']+)'/g)].map(m=>m[2]);
          ok(images.length===19&&new Set(images).size===19,'all 19 catalog services must have distinct image paths');
          for(const rel of images.filter(v=>v.startsWith('service-source/'))){const f=path.join(site,'assets',rel);ok(fs.existsSync(f)&&fs.statSync(f).size>50000,'missing or small '+rel)}
          for(const rel of ['materials-source/sand.jpg','materials-source/topsoil.jpg']){const f=path.join(site,'assets',rel);ok(fs.existsSync(f)&&fs.statSync(f).size>100000,'missing or small '+rel)}
          const hash=rel=>crypto.createHash('sha256').update(fs.readFileSync(path.join(site,'assets',rel))).digest('hex');
          ok(hash('materials-source/sand.jpg')!==hash('materials-source/topsoil.jpg'),'sand and topsoil must be different files');
          ok(fs.existsSync(path.join(site,'owner-access.html')),'owner-access page must exist');
          if(fail.length){console.error(fail.join('\n'));process.exit(1)}console.log('Northern Lakes photo and owner-link verification PASS');
          '''
          write(root/'scripts/verify-northern-lakes-photo-owner-links.js','\n'.join(line.strip() for line in dedicated.splitlines())+'\n')
          PY
          python /tmp/apply_refresh.py
      - name: Verify focused contracts
        run: |
          node scripts/verify-northern-lakes-photo-owner-links.js
          node scripts/verify-northern-lakes-site-portal-build.js
          node scripts/verify-northern-lakes-commercial-package.js
      - name: Remove temporary import/apply workflows and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/import-northern-lakes-photo-refresh.yml .github/workflows/apply-northern-lakes-photo-owner-refresh.yml
          git add businesses/northern-lakes business-packs/northern-lakes/supabase-business-pack.json scripts/verify-northern-lakes-site-portal-build.js scripts/verify-northern-lakes-commercial-package.js scripts/verify-northern-lakes-photo-owner-links.js .github/workflows/verify-northern-lakes-site-portal.yml
          git commit -m 'Refresh Northern Lakes photos and owner access links'
          git push origin HEAD:agent/fix-northern-lakes-photo-library-owner-links
