name: Apply mobile acceptance catalog semantics

on:
  push:
    branches: [agent/authorized-mobile-live-acceptance]
    paths: ['.github/workflows/apply-mobile-acceptance-catalog-semantics.yml']
  pull_request:
    branches: [main]
    paths: ['.github/workflows/apply-mobile-acceptance-catalog-semantics.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authorized-mobile-live-acceptance
      - name: Align acceptance with combined gutter catalog item
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          a=Path('apps-script/business-office/BusinessOffice_QuoteBuilder_Mobile_LiveAcceptance.gs')
          s=a.read_text()
          s=s.replace("boAssert_(suggested.length >= 2, 'Photo analysis did not return the expected gutter and downspout quote lines.');","boAssert_(suggested.length >= 1, 'Photo analysis did not return a usable gutter quote line.');")
          s=s.replace("source: result && result.source || ''\n        };","source: result && result.source || '',\n          catalogName: item.Name || '',\n          catalogDescription: item['Customer Description'] || item.Description || '',\n          catalogSource: item['Catalog Source'] || ''\n        };",1)
          old="""      const gutter = priced.find(function (line) { return /gutter/i.test(line.description) && !/downspout/i.test(line.description); });
      const downspout = priced.find(function (line) { return /downspout/i.test(line.description); });
      boAssert_(gutter && gutter.rate > 0, 'The live gutter line did not receive a nonzero rate.');
      boAssert_(downspout && downspout.rate > 0, 'The live downspout line did not receive a nonzero rate.');"""
          new="""      const gutter = priced.find(function (line) {
        return /gutter/i.test([line.description, line.catalogName, line.catalogDescription, line.catalogSource].join(' '));
      });
      boAssert_(gutter && gutter.rate > 0, 'The live gutter scope did not receive a nonzero Price Book rate.');
      const gutterCoverage = [gutter.description, gutter.catalogName, gutter.catalogDescription, gutter.catalogSource, draft.scope || '', (draft.photoObservations || []).join(' ')].join(' ');
      boAssert_(/downspout/i.test(gutterCoverage), 'The priced gutter scope did not preserve the known downspout component.');"""
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('acceptance assertion block not found')
          a.write_text(s)

          w=Path('.github/workflows/quote-mobile-native-live.yml')
          s=w.read_text()
          s=s.replace("const gutter=(result.pricing||[]).find(line=>/gutter/i.test(line.description||'')&&!/downspout/i.test(line.description||''));\n          const downspout=(result.pricing||[]).find(line=>/downspout/i.test(line.description||''));","const gutter=(result.pricing||[]).find(line=>/gutter/i.test([line.description,line.catalogName,line.catalogDescription,line.catalogSource].join(' ')));\n          const downspoutIncluded=!!gutter&&/downspout/i.test([gutter.description,gutter.catalogName,gutter.catalogDescription,gutter.catalogSource].join(' '));")
          s=s.replace("Number(result.photoAnalysis.lineCount||0)<2","Number(result.photoAnalysis.lineCount||0)<1")
          s=s.replace("failures.push('gutter price');\n          if(!downspout||Number(downspout.rate||0)<=0)failures.push('downspout price');","failures.push('gutter scope price');\n          if(!downspoutIncluded)failures.push('downspout coverage');")
          s=s.replace("gutterRate:gutter.rate,downspoutRate:downspout.rate","scopeRate:gutter.rate,downspoutIncluded:downspoutIncluded")
          w.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/business-office/BusinessOffice_QuoteBuilder_Mobile_LiveAcceptance.gs .github/workflows/quote-mobile-native-live.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Align mobile acceptance with combined gutter catalog pricing'
          git push origin HEAD:agent/authorized-mobile-live-acceptance
