name: H38 Scout v3.0.29 Restore Working Sources

on:
  push:
    branches: ['agent/private-reseller-scout']
    paths: ['.github/workflows/scout-v329-restore-working-sources.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h38-scout-v329-restore-working-sources
  cancel-in-progress: false

jobs:
  restore-build-firebase:
    if: github.ref == 'refs/heads/agent/private-reseller-scout'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SCOUT_EMAIL: ${{ secrets.H38_SCOUT_TEST_EMAIL }}
      SCOUT_PASSWORD: ${{ secrets.H38_SCOUT_TEST_PASSWORD }}
      DEVICE_MODEL: r0q
      DEVICE_VERSION: '34'
      ROBO_TIMEOUT: 30m
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate private branch and frozen phone-PASS shell
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'agent/private-reseller-scout'
          git fetch origin agent/private-reseller-scout
          test "$(git rev-parse origin/agent/private-reseller-scout)" = "$GITHUB_SHA"
          base=64ef9a193958c0fbfc75a8b0e47777857d8bafe5
          test "$(sha256sum reseller/src/main/assets/reseller/v200-app.js | awk '{print $1}')" = "$(git show "$base:native/h38-site-scanner/android-app/reseller/src/main/assets/reseller/v200-app.js" | sha256sum | awk '{print $1}')"
          test "$(sha256sum reseller/src/main/java/com/highway38/resellerscout/MainActivity.java | awk '{print $1}')" = "$(git show "$base:native/h38-site-scanner/android-app/reseller/src/main/java/com/highway38/resellerscout/MainActivity.java" | sha256sum | awk '{print $1}')"
          test ! -e reseller/src/main/java/com/highway38/resellerscout/NativeLoginOverlay.java
          test ! -e reseller/src/main/assets/reseller/v316-garage-safe-action.js
          test ! -e reseller/src/main/assets/reseller/v317-flipr-resale-flow.js
          test ! -e reseller/src/main/assets/reseller/v323-native-auth-bridge.js
          grep -Fq "versionName '3.0.28'" reseller/build.gradle
          grep -Fq 'versionCode 328' reseller/build.gradle
          grep -Fq 'H38_SCOUT_V328_SOURCE_QUALITY=true' reseller/src/main/assets/reseller/v240-data.js
          echo FROZEN_PHONE_PASS_SHELL_GATE_PASS

      - name: Apply v3.0.29 post-login source restoration
        shell: bash
        run: |
          set -euo pipefail
          python3 reseller/v329-restore-working-sources.py | tee /tmp/v329-repair.txt
          grep -Fq V329_RESTORE_WORKING_SOURCES_APPLIED /tmp/v329-repair.txt
          node --check reseller/src/main/assets/reseller/v240-data.js
          grep -Fq 'H38_SCOUT_V329_POST_LOGIN_SOURCE_AUTHORITY=true' reseller/src/main/assets/reseller/v240-data.js
          grep -Fq "'reseller-auto-leads-v065','reseller-auto-leads-v064','reseller-auto-leads-v063'" reseller/src/main/assets/reseller/v240-data.js
          grep -Fq "b.textContent='Run Facebook Marketplace scan'" reseller/src/main/assets/reseller/v240-data.js
          grep -Fq 'openFacebookScan()' reseller/src/main/assets/reseller/v240-data.js
          grep -Fq 'nativeFacebookRows()' reseller/src/main/assets/reseller/v240-data.js
          grep -Fq "image_source_proof:'exact_barcode_v201'" reseller/src/main/assets/reseller/v240-data.js
          grep -Fq "versionName '3.0.29'" reseller/build.gradle
          grep -Fq 'versionCode 329' reseller/build.gradle
          python3 - <<'PY'
          from pathlib import Path
          s=Path('reseller/src/main/assets/reseller/v240-data.js').read_text()
          checks={
            'post-login authority delayed after frozen v200-app': 'setTimeout(install,1450)' in s,
            'signed-in Facebook scan restored': "b.onclick=()=>{try{openFacebookScan()}" in s,
            'native Facebook rows merged': 'nativeFacebookRows()' in s and 'syncFacebookRows()' in s,
            'v065 is first Hunt provider': "['reseller-auto-leads-v065','reseller-auto-leads-v064','reseller-auto-leads-v063']" in s,
            'unproven DG image removed': "r.h38_unproven_image_removed=true" in s,
            'exact DG barcode image proof installed': "image_source_proof:'exact_barcode_v201'" in s,
          }
          for k,v in checks.items(): print(('PASS' if v else 'FAIL'),k)
          assert all(checks.values())
          print('V329_SOURCE_RESTORATION_TESTS_PASS')
          PY
          base=64ef9a193958c0fbfc75a8b0e47777857d8bafe5
          test "$(sha256sum reseller/src/main/assets/reseller/v200-app.js | awk '{print $1}')" = "$(git show "$base:native/h38-site-scanner/android-app/reseller/src/main/assets/reseller/v200-app.js" | sha256sum | awk '{print $1}')"
          test "$(sha256sum reseller/src/main/java/com/highway38/resellerscout/MainActivity.java | awk '{print $1}')" = "$(git show "$base:native/h38-site-scanner/android-app/reseller/src/main/java/com/highway38/resellerscout/MainActivity.java" | sha256sum | awk '{print $1}')"
          echo V329_LOGIN_NATIVE_UNCHANGED_PASS

      - name: Commit restored app source only to private Scout
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/private-reseller-scout
          test "$(git rev-parse origin/agent/private-reseller-scout)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reseller/build.gradle reseller/src/main/assets/reseller/v240-data.js
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --name-only | grep -Fx 'reseller/build.gradle'
          git diff --cached --name-only | grep -Fx 'reseller/src/main/assets/reseller/v240-data.js'
          git commit -m 'Restore v3.0.29 DG and Facebook sourcing authority'
          git push origin HEAD:agent/private-reseller-scout
          echo "APP_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore persistent Scout signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: h38-reseller-scout-owner-debug-signing-v1

      - name: Build and verify v3.0.29 owner APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v329"
          mkdir -p "$report"
          test -f "$HOME/.android/debug.keystore"
          export H38_ANDROID_UPLOAD_KEYSTORE_PATH="$HOME/.android/debug.keystore"
          export H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=android
          export H38_ANDROID_UPLOAD_KEY_ALIAS=androiddebugkey
          export H38_ANDROID_UPLOAD_KEY_PASSWORD=android
          gradle --no-daemon :reseller:assembleOwner | tee "$report/compile.log"
          APP_APK="$(find reseller/build/outputs/apk -type f -path '*/owner/*.apk' ! -path '*/androidTest/*' | head -n1)"
          test -n "$APP_APK" -a -f "$APP_APK"
          echo "APP_APK=$APP_APK" >> "$GITHUB_ENV"
          out="$report/H38-Scout-v3.0.29-DG-FB-RESTORED.apk"
          cp "$APP_APK" "$out"
          sha256sum "$out" | tee "$report/sha256.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" | tee "$report/badging.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='329' versionName='3.0.29'" "$report/badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" | tee "$report/signing.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          actual="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$report/signing.txt" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = cdabe362ad80788c4ac216a26a8dcc44174eceb3c380c3b4a126507af4043c46
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$out" | tee "$report/zipalign.txt"
          grep -Fq 'Verification succesful' "$report/zipalign.txt"
          unzip -t "$out" | tee "$report/zip-test.txt"
          grep -Fq 'No errors detected in compressed data' "$report/zip-test.txt"
          base=64ef9a193958c0fbfc75a8b0e47777857d8bafe5
          test "$(unzip -p "$out" assets/reseller/v200-app.js | sha256sum | awk '{print $1}')" = "$(git show "$base:native/h38-site-scanner/android-app/reseller/src/main/assets/reseller/v200-app.js" | sha256sum | awk '{print $1}')"
          unzip -p "$out" assets/reseller/v240-data.js > "$report/packaged-v240-data.js"
          grep -Fq 'H38_SCOUT_V329_POST_LOGIN_SOURCE_AUTHORITY=true' "$report/packaged-v240-data.js"
          grep -Fq 'Run Facebook Marketplace scan' "$report/packaged-v240-data.js"
          grep -Fq 'reseller-auto-leads-v065' "$report/packaged-v240-data.js"
          echo V329_APK_PACKAGE_SIGNING_LOGIN_SOURCE_PASS | tee "$report/apk-gate.txt"

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Verify physical Firebase target
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v329"
          gcloud firebase test android models describe "$DEVICE_MODEL" --format=yaml | tee "$report/device-model.yml"
          grep -qi PHYSICAL "$report/device-model.yml"

      - name: Create authenticated v3.0.29 Robo script
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$SCOUT_EMAIL"
          echo "::add-mask::$SCOUT_PASSWORD"
          python3 - <<'PY'
          import json, os, shlex
          from pathlib import Path
          def cmd(v): return 'input text '+shlex.quote(v.replace('%','%25').replace(' ','%s'))
          a=[
            {'eventType':'WAIT','delayTime':2500},
            {'eventType':'VIEW_CLICKED','visionText':'Email'},
            {'eventType':'ADB_SHELL_COMMAND','command':cmd(os.environ['SCOUT_EMAIL'])},
            {'eventType':'WAIT','delayTime':700},
            {'eventType':'VIEW_CLICKED','visionText':'Password'},
            {'eventType':'ADB_SHELL_COMMAND','command':cmd(os.environ['SCOUT_PASSWORD'])},
            {'eventType':'WAIT','delayTime':700},
            {'eventType':'VIEW_CLICKED','visionText':'Sign in'},
            {'eventType':'WAIT','delayTime':6000},
            {'eventType':'ASSERTION','contextDescriptor':{'condition':'element_present','negateCondition':True,'visionText':'Sign in'}},
            {'eventType':'ASSERTION','contextDescriptor':{'condition':'element_present','visionText':'Run Facebook Marketplace scan'}},
            {'eventType':'TAKE_SCREENSHOT','screenshotName':'v329-facebook-control-restored'},
            {'eventType':'VIEW_CLICKED','visionText':'Hunt'},
            {'eventType':'WAIT','delayTime':12000},
            {'eventType':'TAKE_SCREENSHOT','screenshotName':'v329-hunt-v065'},
            {'eventType':'VIEW_CLICKED','visionText':'Discover'},
            {'eventType':'WAIT','delayTime':4000}
          ]
          p=Path(os.environ['RUNNER_TEMP'])/'scout-v329-robo.json'
          p.write_text('roboscript:{"executionMode":{"strict":true,"dismiss_popups":true,"notify":false}}\n'+json.dumps(a))
          PY
          test -s "$RUNNER_TEMP/scout-v329-robo.json"
          echo "ROBO_SCRIPT=$RUNNER_TEMP/scout-v329-robo.json" >> "$GITHUB_ENV"

      - name: Run authenticated Firebase physical-device crawl
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v329"
          APP="$GITHUB_WORKSPACE/native/h38-site-scanner/android-app/$APP_APK"
          test -f "$APP"
          gcloud firebase test android run \
            --project "$FIREBASE_PROJECT_ID" \
            --type robo \
            --app "$APP" \
            --robo-script "$ROBO_SCRIPT" \
            --device "model=$DEVICE_MODEL,version=$DEVICE_VERSION,locale=en,orientation=portrait" \
            --timeout "$ROBO_TIMEOUT" \
            --results-history-name 'H38 Scout v3.0.29 Source Restoration' \
            --client-details matrixLabel='H38 Scout v3.0.29 DG and Facebook restoration' \
            2>&1 | tee "$report/firebase-test-lab.log"
          echo FIREBASE_PHYSICAL_EXECUTION_PASS | tee "$report/firebase-status.txt"
          raw_url="$(grep -oE 'https://console\.developers\.google\.com/storage/browser/[^ ]+' "$report/firebase-test-lab.log" | tail -n1 || true)"
          if [[ -n "$raw_url" ]]; then
            raw_path="${raw_url#https://console.developers.google.com/storage/browser/}"
            bucket="${raw_path%%/*}"; prefix="${raw_path#*/}"; prefix="${prefix%/}"
            mkdir -p "$report/firebase-raw-results"
            gcloud storage cp --recursive "gs://$bucket/$prefix/**" "$report/firebase-raw-results/" || true
          fi
          grep -RniE 'FATAL EXCEPTION|AndroidRuntime|ANR|AssertionError|FAILURES!!!|WebView.*error|net::ERR_|TypeError|ReferenceError|Unhandled|uncaught' "$report/firebase-raw-results" "$report/firebase-test-lab.log" > "$report/runtime-error-scan.txt" 2>/dev/null || true
          if [[ -s "$report/runtime-error-scan.txt" ]]; then cat "$report/runtime-error-scan.txt"; exit 3; fi
          echo FIREBASE_RUNTIME_ERROR_SCAN_PASS | tee -a "$report/firebase-status.txt"

      - name: Build v3.0.29 acceptance report
        if: always()
        shell: bash
        run: |
          report="$GITHUB_WORKSPACE/artifacts/scout-v329"; mkdir -p "$report"
          {
            echo '# H38 Scout v3.0.29 automated acceptance'
            echo
            echo "- Workflow source: $GITHUB_SHA"
            echo "- App commit: ${APP_COMMIT:-not-created}"
            echo '- Branch: agent/private-reseller-scout only'
            echo '- Frozen login/native shell: v2.6.3 physical-PASS baseline'
            echo '- DG authority: reseller-auto-leads-v065 first; unproved image pairings removed; exact-barcode image delivery only'
            echo '- Facebook authority: signed-in phone Marketplace browser restored after frozen public-only wrapper; public backend supplemental'
            echo '- Firebase: Samsung Galaxy S22 r0q / Android 34 / PHYSICAL'
            echo '- Owner phone remains final acceptance authority.'
            echo
            cat "$report/apk-gate.txt" 2>/dev/null || true
            cat "$report/firebase-status.txt" 2>/dev/null || true
          } > "$report/acceptance-report.md"

      - name: Upload v3.0.29 APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v3.0.29-dg-facebook-restored
          path: artifacts/scout-v329/**
          if-no-files-found: error
          retention-days: 30
