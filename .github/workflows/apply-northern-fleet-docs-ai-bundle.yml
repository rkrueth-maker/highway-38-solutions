name: Apply Northern Fleet Docs AI Bundle

on:
  push:
    branches:
      - agent/northern-lakes-bouncie-fleet-20260912
    paths:
      - .handoff/bootstrap.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/northern-lakes-bouncie-fleet-20260912
          fetch-depth: 0
      - name: Reconstruct source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .handoff/part*.b64 | base64 -d > /tmp/h38-northern-bundle.tar.gz
          tar -xzf /tmp/h38-northern-bundle.tar.gz -C .
          rm -rf .handoff
          rm -f .github/workflows/apply-northern-fleet-docs-ai-bundle.yml
      - name: Verify Northern fleet source
        run: node scripts/verify-northern-bouncie-fleet.js
      - name: Verify branded document workflows
        run: node scripts/verify-office-document-workflows.js
      - name: Verify owner AI document factory
        run: node scripts/verify-ai-document-factory.js
      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Northern fleet documents and owner AI workflows"
          git push origin HEAD:agent/northern-lakes-bouncie-fleet-20260912
