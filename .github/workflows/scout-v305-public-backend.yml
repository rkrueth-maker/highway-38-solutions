name: Build H38 Scout v3.0.5 Public Backend Facebook

on:
  push:
    branches: ['agent/private-reseller-scout']
    paths:
      - 'native/h38-site-scanner/android-app/reseller/build.gradle'
      - 'native/h38-site-scanner/android-app/reseller/src/main/assets/reseller/v266-actionable-intake.js'
      - 'native/h38-site-scanner/android-app/reseller/v300-single-owner-runtime.test.mjs'
      - 'supabase/functions/reseller-facebook-public-v240/index.ts'
      - 'supabase/functions/reseller-facebook-public-v240/core.mjs'
      - 'supabase/functions/reseller-facebook-public-v240/public-index.mjs'
      - 'supabase/functions/reseller-facebook-public-v240/core.test.mjs'
      - 'supabase/functions/reseller-facebook-public-v240/public-index.test.mjs'
      - '.github/workflows/scout-v305-public-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Verify v3.0.5 backend-only contracts
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v305"; mkdir -p "$report"
          test "$(git branch --show-current)" = 'agent/private-reseller-scout'
          node --check reseller/src/main/assets/reseller/v266-actionable-intake.js
          node reseller/v300-single-owner-runtime.test.mjs | tee "$report/runtime.txt"
          node "$GITHUB_WORKSPACE/supabase/functions/reseller-facebook-public-v240/core.test.mjs" | tee "$report/facebook-core.txt"
          node "$GITHUB_WORKSPACE/supabase/functions/reseller-facebook-public-v240/public-index.test.mjs" | tee "$report/facebook-index.txt"
          node "$GITHUB_WORKSPACE/supabase/functions/reseller-auto-leads-v064/core.test.mjs" | tee "$report/dg-images.txt"
          grep -Fq "versionName '3.0.5'" reseller/build.gradle
          grep -Fq 'versionCode 305' reseller/build.gradle
          grep -Fq 'H38_SCOUT_V305_PUBLIC_BACKEND_RECOVERY=true' reseller/src/main/assets/reseller/v266-actionable-intake.js
          grep -Fq "fn('reseller-facebook-public-v240'" reseller/src/main/assets/reseller/v266-actionable-intake.js
          ! grep -Fq 'n.openFacebookMarketplace(' reseller/src/main/assets/reseller/v266-actionable-intake.js
          grep -Fq 'facebookPublicCandidates' reseller/src/main/assets/reseller/v266-actionable-intake.js
          grep -Fq 'FRESHNESS UNPROVEN' reseller/src/main/assets/reseller/v266-actionable-intake.js
          grep -Fq "engine:'H38_FACEBOOK_PUBLIC_V305'" "$GITHUB_WORKSPACE/supabase/functions/reseller-facebook-public-v240/index.ts"
          grep -Fq 'candidates' "$GITHUB_WORKSPACE/supabase/functions/reseller-facebook-public-v240/index.ts"
          grep -Fq 'captured_count' "$GITHUB_WORKSPACE/supabase/functions/reseller-facebook-public-v240/index.ts"
          grep -Fq 'NO_FACEBOOK_LOGIN' "$GITHUB_WORKSPACE/supabase/functions/reseller-facebook-public-v240/index.ts"
          echo PASS > "$report/contracts.txt"

      - name: Live verify public Facebook index source
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v305"; mkdir -p "$report"
          url="https://html.duckduckgo.com/html/?q=$(python - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('site:facebook.com/marketplace/item/ Minnesota tools'))
          PY
          )"
          curl -fsSL --max-time 25 -A 'Mozilla/5.0 H38ResellerScout/3.0.5' "$url" -o "$report/facebook-public-index.html"
          python - "$report/facebook-public-index.html" <<'PY' | tee "$report/facebook-live-index.txt"
          import html,re,sys,urllib.parse
          raw=open(sys.argv[1],encoding='utf-8',errors='ignore').read(); text=html.unescape(raw)
          for _ in range(3): text=urllib.parse.unquote(text)
          ids=sorted(set(re.findall(r'facebook\.com/marketplace/item/(\d+)',text,re.I)))
          if not ids: raise SystemExit('No public Facebook Marketplace item URLs found')
          print('PASS live public Facebook index',len(ids),'item IDs',','.join(ids[:5]))
          PY

      - name: Compile owner APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v305"; mkdir -p "$report"
          gradle --no-daemon :reseller:assembleOwner | tee "$report/compile.log"
          apk='reseller/build/outputs/apk/owner/reseller-owner.apk'; test -f "$apk"
          out="$report/H38-Reseller-Scout-Owner-v3.0.5.apk"; cp "$apk" "$out"
          sha256sum "$out" > "$report/H38-Reseller-Scout-Owner-v3.0.5.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$out" > "$report/zipalign.txt"

      - name: Inspect exact packaged APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v305"; out="$report/H38-Reseller-Scout-Owner-v3.0.5.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='305' versionName='3.0.5'" "$report/badging.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          grep -Fq 'Verification succesful' "$report/zipalign.txt"
          unzip -t "$out" > "$report/zip-test.txt"
          grep -Fq 'No errors detected in compressed data' "$report/zip-test.txt"
          unzip -p "$out" assets/reseller/v266-actionable-intake.js > "$report/packaged-v266.js"
          grep -Fq 'H38_SCOUT_V305_PUBLIC_BACKEND_RECOVERY=true' "$report/packaged-v266.js"
          grep -Fq "fn('reseller-facebook-public-v240'" "$report/packaged-v266.js"
          ! grep -Fq 'n.openFacebookMarketplace(' "$report/packaged-v266.js"
          grep -Fq 'weirdHuntRow' "$report/packaged-v266.js"
          echo PASS > "$report/smoke.txt"

      - name: Upload v3.0.5 APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v3.0.5-public-backend
          path: artifacts/scout-v305/*
          if-no-files-found: warn
          retention-days: 30
