name: Verify Quote Photo Restore and AI Auth

on:
  pull_request:
    paths:
      - 'commercial-app/index.html'
      - 'commercial-app/service-worker.js'
      - 'commercial-app/supabase-quote-ai*.js'
      - 'commercial-app/quote-mobile-stabilization.js'
      - 'commercial-app/quote-photo-restore.js'
      - 'supabase/functions/h38-quote-ai/**'
      - 'scripts/verify-quote-photo-restore-and-ai-auth.js'
      - '.github/workflows/verify-quote-photo-restore-and-ai-auth.yml'
  push:
    branches:
      - main
    paths:
      - 'commercial-app/index.html'
      - 'commercial-app/service-worker.js'
      - 'commercial-app/supabase-quote-ai*.js'
      - 'commercial-app/quote-mobile-stabilization.js'
      - 'commercial-app/quote-photo-restore.js'
      - 'supabase/functions/h38-quote-ai/**'
      - 'scripts/verify-quote-photo-restore-and-ai-auth.js'
      - '.github/workflows/verify-quote-photo-restore-and-ai-auth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check browser repairs
        run: |
          node --check commercial-app/supabase-quote-ai-auth-fix.js
          node --check commercial-app/quote-photo-restore.js
          node --check scripts/verify-quote-photo-restore-and-ai-auth.js
      - name: Verify persistence and authentication contracts
        run: node scripts/verify-quote-photo-restore-and-ai-auth.js
      - name: Verify deployed function health and protected rejection
        run: |
          ENDPOINT='https://jqukmwtsgcsaruucnqja.supabase.co/functions/v1/h38-quote-ai'
          curl --fail --silent --show-error --max-time 30 "$ENDPOINT" --output /tmp/quote-health.json
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/quote-health.json')); if(h.status!=='PASS'||h.providerConfigured!==true) throw new Error('Quote AI health is not ready.');"
          CODE=$(curl --silent --show-error --max-time 30 --output /tmp/quote-reject.json --write-out '%{http_code}' -X POST "$ENDPOINT" -H 'Origin: https://highway38solutions.com' -H 'Authorization: Bearer invalid-protected-test' -H 'Content-Type: application/json' --data '{"action":"buildQuote","businessId":"00000000-0000-0000-0000-000000000000","quoteId":"TEST"}')
          test "$CODE" = '401'
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/quote-reject.json')); if(p.status!=='FAIL'||!/Auth session/i.test(p.message||'')) throw new Error('Quote AI did not reject the invalid session safely.');"
