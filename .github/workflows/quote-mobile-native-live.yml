name: Quote Mobile Native Live Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps-script/business-office/BusinessOffice_QuoteBuilder_Details_Recovery.html'
      - 'apps-script/business-office/BusinessOffice_QuoteBuilder_Mobile_LiveAcceptance.gs'
      - 'apps-script/business-office/BusinessOffice_QuoteBuilder_EditExisting_Client.html'
      - 'scripts/verify-quote-native-photo-workflow.js'
      - 'scripts/test-quote-native-photo-browser.js'
      - 'scripts/verify-quote-mobile-ai-photo-pricing.js'
      - 'scripts/verify-quote-mobile-stabilization.js'
      - '.github/workflows/quote-mobile-native-live.yml'
  push:
    branches: [main]
    paths:
      - 'apps-script/business-office/BusinessOffice_QuoteBuilder_Details_Recovery.html'
      - 'apps-script/business-office/BusinessOffice_QuoteBuilder_Mobile_LiveAcceptance.gs'
      - 'apps-script/business-office/BusinessOffice_QuoteBuilder_EditExisting_Client.html'
      - 'scripts/verify-quote-native-photo-workflow.js'
      - 'scripts/test-quote-native-photo-browser.js'
      - 'scripts/verify-quote-mobile-ai-photo-pricing.js'
      - 'scripts/verify-quote-mobile-stabilization.js'
      - '.github/workflows/quote-mobile-native-live.yml'
  workflow_run:
    workflows: ['Deploy Unified Owner Portal']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: quote-mobile-native-live-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  browser-contract:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser test dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify native mobile source contract
        run: node scripts/verify-quote-native-photo-workflow.js

      - name: Run Android-sized native picker workflow
        run: node scripts/test-quote-native-photo-browser.js | tee quote-mobile-browser.json

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-mobile-browser-${{ github.run_id }}
          path: quote-mobile-browser.json
          if-no-files-found: warn
          retention-days: 90

  live-production:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    needs: browser-contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
      CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
      CLASP_CREDENTIALS_B64: ${{ secrets.CLASP_CREDENTIALS_B64 }}
      GOOGLE_CLASPRC_JSON: ${{ secrets.GOOGLE_CLASPRC_JSON }}
      GOOGLE_CLASPRC_JSON_B64: ${{ secrets.GOOGLE_CLASPRC_JSON_B64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out deployed source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install isolated Apps Script tool
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @google/clasp@3.3.0

      - name: Load encrypted Google credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          if [[ -n "${CLASPRC_JSON}" ]]; then printf '%s' "${CLASPRC_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASPRC_JSON_B64}" ]]; then printf '%s' "${CLASPRC_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_CREDENTIALS}" ]]; then printf '%s' "${CLASP_CREDENTIALS}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_CREDENTIALS_B64}" ]]; then printf '%s' "${CLASP_CREDENTIALS_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${GOOGLE_CLASPRC_JSON}" ]]; then printf '%s' "${GOOGLE_CLASPRC_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${GOOGLE_CLASPRC_JSON_B64}" ]]; then printf '%s' "${GOOGLE_CLASPRC_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          else echo 'No encrypted Google credential is configured.'; exit 78; fi
          chmod 600 "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8'))"

      - name: Run live gutter upload, analysis, pricing, and edit acceptance
        id: live
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/quote-mobile-live"
          mkdir -p "$WORK"
          SCRIPT_ID="$(node - <<'NODE'
          const data=require('./business-packs/highway38/deployment.json');
          process.stdout.write(data.appsScript.productionProjectId);
          NODE
          )"
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > "$WORK/.clasp.json"
          (cd "$WORK" && "$GITHUB_WORKSPACE/node_modules/.bin/clasp" run-function boQuoteBuilderRunMobileProductionAcceptance) 2>&1 | tee quote-mobile-live-raw.txt
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('quote-mobile-live-raw.txt','utf8');
          const start=raw.indexOf('{'),end=raw.lastIndexOf('}');
          if(start<0||end<start)throw new Error('Live acceptance returned no JSON object.');
          const result=JSON.parse(raw.slice(start,end+1));
          const gutter=(result.pricing||[]).find(line=>/gutter/i.test(line.description||'')&&!/downspout/i.test(line.description||''));
          const downspout=(result.pricing||[]).find(line=>/downspout/i.test(line.description||''));
          const failures=[];
          if(result.status!=='PASS')failures.push('status');
          if(!result.photoUpload||Number(result.photoUpload.syntheticUploadBytes||0)<4800000)failures.push('phone-sized upload');
          if(!result.photoAnalysis||Number(result.photoAnalysis.lineCount||0)<2)failures.push('photo analysis');
          if(!gutter||Number(gutter.rate||0)<=0)failures.push('gutter price');
          if(!downspout||Number(downspout.rate||0)<=0)failures.push('downspout price');
          if(!result.editDraft||Number(result.editDraft.lineCount||0)<1||result.editDraft.projectTitle!=='Gutters')failures.push('draft edit load');
          if(result.approved!==false||result.sent!==false||result.ownerReviewRequired!==true)failures.push('owner-review boundary');
          fs.writeFileSync('quote-mobile-live.json',JSON.stringify(result,null,2)+'\n');
          if(failures.length)throw new Error('Live mobile acceptance failed: '+failures.join(', '));
          console.log(JSON.stringify({status:'PASS',uploadBytes:result.photoUpload.syntheticUploadBytes,photoDocuments:result.photoAnalysis.documentIds,gutterRate:gutter.rate,downspoutRate:downspout.rate,editDraft:result.editDraft,approved:result.approved,sent:result.sent,durationMs:result.durationMs},null,2));
          NODE

      - name: Record live mobile acceptance PASS
        if: success()
        shell: bash
        run: |
          BODY="## PASS — Quote Builder Android live acceptance\n\n- Source commit: ${{ github.event.workflow_run.head_sha || github.sha }}\n- Browser: Android-sized native file-control workflow with a 4.8 MB photo passed\n- Production: actual gutter photos analyzed and priced\n- Draft edit: saved Gutters draft reopened with lines and customers\n- Approval/send: false; owner review still required\n- Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "$BODY"

      - name: Record live mobile acceptance HOLD
        if: failure()
        shell: bash
        run: |
          BODY="## HOLD — Quote Builder Android live acceptance\n\n- Source commit: ${{ github.event.workflow_run.head_sha || github.sha }}\n- The live upload, photo analysis, pricing, or draft-edit acceptance did not pass.\n- Production must not be reported fixed.\n- Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "$BODY"

      - name: Upload live production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-mobile-live-${{ github.run_id }}
          path: |
            quote-mobile-live-raw.txt
            quote-mobile-live.json
          if-no-files-found: warn
          retention-days: 90
