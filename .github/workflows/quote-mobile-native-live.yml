name: Quote Mobile Native Live Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps-script/business-office/BusinessOffice_QuoteBuilder_Details_Recovery.html'
      - 'apps-script/business-office/BusinessOffice_QuoteBuilder_Mobile_LiveAcceptance.gs'
      - 'apps-script/business-office/BusinessOffice_QuoteBuilder_EditExisting_Client.html'
      - 'scripts/run-quote-mobile-live-acceptance-authorized.sh'
      - 'scripts/verify-quote-native-photo-workflow.js'
      - 'scripts/test-quote-native-photo-browser.js'
      - 'scripts/verify-quote-mobile-ai-photo-pricing.js'
      - 'scripts/verify-quote-mobile-stabilization.js'
      - '.github/workflows/quote-mobile-native-live.yml'
  push:
    branches: [main]
    paths:
      - 'apps-script/business-office/BusinessOffice_QuoteBuilder_Details_Recovery.html'
      - 'apps-script/business-office/BusinessOffice_QuoteBuilder_Mobile_LiveAcceptance.gs'
      - 'apps-script/business-office/BusinessOffice_QuoteBuilder_EditExisting_Client.html'
      - 'scripts/run-quote-mobile-live-acceptance-authorized.sh'
      - 'scripts/verify-quote-native-photo-workflow.js'
      - 'scripts/test-quote-native-photo-browser.js'
      - 'scripts/verify-quote-mobile-ai-photo-pricing.js'
      - 'scripts/verify-quote-mobile-stabilization.js'
      - '.github/workflows/quote-mobile-native-live.yml'
  workflow_run:
    workflows: ['Deploy Unified Owner Portal']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: quote-mobile-native-live-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  browser-contract:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser test dependency
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify native mobile source contract
        run: node scripts/verify-quote-native-photo-workflow.js

      - name: Run Android-sized native picker workflow
        run: node scripts/test-quote-native-photo-browser.js | tee quote-mobile-browser.json

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-mobile-browser-${{ github.run_id }}
          path: quote-mobile-browser.json
          if-no-files-found: warn
          retention-days: 90

  live-production:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch'
    needs: browser-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
      CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
      CLASP_CREDENTIALS_B64: ${{ secrets.CLASP_CREDENTIALS_B64 }}
      GOOGLE_CLASPRC_JSON: ${{ secrets.GOOGLE_CLASPRC_JSON }}
      GOOGLE_CLASPRC_JSON_B64: ${{ secrets.GOOGLE_CLASPRC_JSON_B64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out acceptance source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install isolated Apps Script tool
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @google/clasp@3.3.0

      - name: Load encrypted Google credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          if [[ -n "${CLASPRC_JSON}" ]]; then printf '%s' "${CLASPRC_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASPRC_JSON_B64}" ]]; then printf '%s' "${CLASPRC_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_CREDENTIALS}" ]]; then printf '%s' "${CLASP_CREDENTIALS}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_CREDENTIALS_B64}" ]]; then printf '%s' "${CLASP_CREDENTIALS_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${GOOGLE_CLASPRC_JSON}" ]]; then printf '%s' "${GOOGLE_CLASPRC_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${GOOGLE_CLASPRC_JSON_B64}" ]]; then printf '%s' "${GOOGLE_CLASPRC_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          else echo 'No encrypted Google credential is configured.'; exit 78; fi
          chmod 600 "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8'))"

      - name: Run authorized live gutter upload, analysis, pricing, and edit acceptance
        shell: bash
        run: bash scripts/run-quote-mobile-live-acceptance-authorized.sh artifacts/quote-mobile-live

      - name: Verify live acceptance result
        shell: bash
        run: |
          node - <<'NODE'
          const result=require('./artifacts/quote-mobile-live/result.json');
          const gutter=(result.pricing||[]).find(line=>/gutter/i.test([line.description,line.catalogName,line.catalogDescription,line.catalogSource].join(' ')));
          const downspoutIncluded=(result.pricing||[]).some(line=>/downspout/i.test([line.description,line.catalogName,line.catalogDescription,line.catalogSource].join(' ')));
          const failures=[];
          if(result.status!=='PASS')failures.push('status');
          if(!result.photoUpload||Number(result.photoUpload.syntheticUploadBytes||0)<4800000)failures.push('phone-sized upload');
          if(!result.photoAnalysis||Number(result.photoAnalysis.lineCount||0)<1)failures.push('photo analysis');
          if(!gutter||Number(gutter.rate||0)<=0)failures.push('gutter scope price');
          if(!downspoutIncluded)failures.push('downspout coverage');
          if(!result.editDraft||Number(result.editDraft.lineCount||0)<1||result.editDraft.projectTitle!=='Gutters')failures.push('draft edit load');
          if(result.approved!==false||result.sent!==false||result.ownerReviewRequired!==true)failures.push('owner-review boundary');
          if(failures.length)throw new Error('Live mobile acceptance failed: '+failures.join(', '));
          console.log(JSON.stringify({status:'PASS',uploadBytes:result.photoUpload.syntheticUploadBytes,photoDocuments:result.photoAnalysis.documentIds,scopeRate:gutter.rate,downspoutIncluded:downspoutIncluded,editDraft:result.editDraft,approved:result.approved,sent:result.sent,durationMs:result.durationMs},null,2));
          NODE

      - name: Record live mobile acceptance PASS
        if: success()
        shell: bash
        run: |
          BODY="## PASS — Quote Builder Android live acceptance\n\n- Source commit: ${{ github.event.workflow_run.head_sha || github.sha }}\n- Browser: Android-sized native file-control workflow with a 4.8 MB photo passed\n- Production data: actual gutter photos analyzed and the combined gutter scope, including one downspout, priced through the authorized runtime\n- Draft edit: saved Gutters draft reopened with lines and customers\n- Accepted production deployment ID remained unchanged\n- Approval/send: false; owner review still required\n- Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "$BODY"

      - name: Record live mobile acceptance HOLD
        if: failure()
        shell: bash
        run: |
          BODY="## HOLD — Quote Builder Android live acceptance\n\n- Source commit: ${{ github.event.workflow_run.head_sha || github.sha }}\n- The authorized live upload, photo analysis, pricing, or draft-edit acceptance did not pass.\n- Production must not be reported fixed.\n- Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 31 --repo "$GITHUB_REPOSITORY" --body "$BODY"

      - name: Upload live production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-mobile-live-${{ github.run_id }}
          path: artifacts/quote-mobile-live
          if-no-files-found: warn
          retention-days: 90
