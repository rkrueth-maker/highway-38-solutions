name: Apply CAD XML Sanitizer
on:
  push:
    branches: [agent/professional-cad-rebuild]
    paths:
      - 'scripts/sanitize-house-cad-svg-xml.js'
      - '.github/workflows/apply-cad-xml-sanitizer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/professional-cad-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sanitize all SVG XML entities
        run: node scripts/sanitize-house-cad-svg-xml.js
      - name: Validate and render every CAD sheet
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils librsvg2-bin
          mkdir -p /tmp/all-cad-rendered
          for sheet in assets/quote-builder/whole-house-cad/*.svg; do
            xmllint --noout "$sheet"
            name="$(basename "$sheet" .svg)"
            rsvg-convert --width 1700 --height 1100 "$sheet" -o "/tmp/all-cad-rendered/${name}.png"
          done
          test "$(find /tmp/all-cad-rendered -name '*.png' | wc -l)" -eq 10
      - name: Commit sanitized SVG set
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/quote-builder/whole-house-cad/*.svg
          if git diff --cached --quiet; then
            echo 'No SVG entity changes.'
          else
            git commit -m 'Sanitize CAD SVG XML entities'
            git push origin HEAD:agent/professional-cad-rebuild
          fi
