name: Verify Customer 360 Owner Flow

on:
  pull_request:
    paths:
      - 'commercial-app/customer-360-authority.js'
      - 'commercial-app/customer-360-authority.css'
      - 'commercial-app/customer-360-browser-integration-v3.js'
      - 'commercial-app/owner-customer-workflow-polish.js'
      - 'commercial-app/owner-customer-workflow-polish.css'
      - 'commercial-app/job-lifecycle.js'
      - 'commercial-app/index.html'
      - 'commercial-app/service-worker.js'
      - 'scripts/verify-customer-360-owner-flow.js'
      - 'scripts/verify-customer-360-policy.js'
      - 'scripts/verify-customer-360-browser.js'
      - 'scripts/verify-photo-only-web-quote.js'
      - 'scripts/verify-owner-quote-to-complete-job.js'
      - 'tests/test_customer_360_owner_flow_20260824.py'
      - '.github/workflows/verify-customer-360-owner-flow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: JavaScript syntax
        run: |
          node -c commercial-app/customer-360-authority.js
          node -c commercial-app/customer-360-browser-integration-v3.js
          node -c commercial-app/owner-customer-workflow-polish.js
          node -c scripts/verify-customer-360-policy.js
          node -c scripts/verify-customer-360-browser.js
          node -c scripts/verify-photo-only-web-quote.js
          node -c scripts/verify-owner-quote-to-complete-job.js
      - name: Owner-language relationship resolver
        run: node scripts/verify-customer-360-owner-flow.js
      - name: Owner ambiguity finance and activity policy
        run: node scripts/verify-customer-360-policy.js
      - name: Customer 360 contracts
        run: python -m pytest -q tests/test_customer_360_owner_flow_20260824.py

  browser-owner-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install JavaScript dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Customer 360 Chromium owner flow
        run: node scripts/verify-customer-360-browser.js
      - name: Run photo-only web quote flow
        run: node scripts/verify-photo-only-web-quote.js
      - name: Run accepted quote through completed job lifecycle
        run: node scripts/verify-owner-quote-to-complete-job.js
