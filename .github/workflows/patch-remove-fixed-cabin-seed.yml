name: Patch Fixed Cabin Seed From Production Deploy

on:
  push:
    branches:
      - fix/remove-fixed-cabin-deploy-seed
    paths:
      - '.github/workflows/patch-remove-fixed-cabin-seed.yml'

permissions:
  contents: write

concurrency:
  group: patch-remove-fixed-cabin-seed
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/remove-fixed-cabin-deploy-seed
          fetch-depth: 0

      - name: Remove fixed numbered demo generation from production deployment
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('.github/workflows/deploy-owner-portal-hard-rule-production.yml')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace(
              "      - 'scripts/verify-final-pricing-and-cabin.js'\n",
              "      - 'scripts/verify-final-pricing-and-cabin.js'\n      - 'scripts/verify-universal-quote-builder.js'\n",
              1,
          )
          text = text.replace(
              "      - 'cabin-project-complete.html'\n",
              "      - 'cabin-project-complete.html'\n      - 'universal-quote-builder.html'\n",
              1,
          )
          text = text.replace(
              'Existing Apps Script project and deployment IDs will be updated in place only after source, authentication, routing, approval, pricing, Cabin Demo 08, and remote-source checks pass.',
              'Existing Apps Script project and deployment IDs will be updated in place only after source, authentication, routing, approval, pricing, Universal Quote Builder, and remote-source checks pass.',
              1,
          )
          text = text.replace(
              '          - Cabin Demo 08 target: one master quote plus 21 linked sub-quotes across all relevant tables\n',
              '          - Universal Quote Builder target: five progressive levels, 34 pricing methods, controlled agents, and reusable owner-labeled demonstrations\n          - Demonstration generation: not performed by production deployment\n',
              1,
          )
          text = text.replace(
              '      - name: Verify focused Business Office, Quote Builder, pricing, Cabin Demo 08, and runtime controls\n',
              '      - name: Verify focused Business Office, Universal Quote Builder, pricing, historical cabin proof, and runtime controls\n',
              1,
          )
          text = text.replace(
              '          node scripts/verify-final-pricing-and-cabin.js\n',
              '          node scripts/verify-final-pricing-and-cabin.js\n          node scripts/verify-universal-quote-builder.js\n',
              1,
          )

          pattern = re.compile(
              r"\n      - name: Generate and verify all Cabin Demo 08 system records\n"
              r"        id: cabin_seed\n"
              r"        shell: bash\n"
              r"        run: \|\n"
              r".*?"
              r"\n      - name: Upload deployment and rollback evidence",
              re.S,
          )
          text, removed = pattern.subn(
              '\n      - name: Upload deployment and rollback evidence', text, count=1
          )
          if removed != 1:
              raise SystemExit('HOLD — fixed Cabin Demo seed block was not removed exactly once.')

          text = text.replace('            artifacts/cabin-demo08/\n', '', 1)
          text = text.replace(
              '          - Cabin Demo 08: master project plus all 21 sub-quotes generated and linked across quotes, approvals, work orders, purchase planning, documents, proof, activity, and backup records\n          - Cabin PDFs: master package plus 21 package PDFs\n',
              '          - Universal Quote Builder: five progressive quote levels, 34 auditable pricing methods, controlled agents, and coordinated house demonstration: PASS\n          - Demonstration runs: reusable owner-labeled runs; no fixed numbered demo is generated during deployment\n          - Historical Cabin Demo 08 proof: preserved without regeneration\n',
              1,
          )
          text = text.replace(
              '          [[ "$BLOCKER" != "unknown" || "${{ steps.cabin_seed.outcome }}" == "success" ]] || BLOCKER="cabin_seed"\n',
              '',
              1,
          )
          text = text.replace(
              '            echo "- Existing live deployment left unchanged unless deployment completed before Cabin Demo verification"\n',
              '            echo "- Existing live deployment preserved if the deployment stage did not complete"\n',
              1,
          )
          text = text.replace(
              '            echo "cabin_seed=${{ steps.cabin_seed.outcome }}"\n',
              '',
              1,
          )
          text = text.replace(
              '              artifacts/unified-owner-portal/quote-builder-http-status.txt \\\n              artifacts/cabin-demo08/production-generation.txt \\\n              artifacts/cabin-demo08/verification.json; do',
              '              artifacts/unified-owner-portal/quote-builder-http-status.txt; do',
              1,
          )

          forbidden = [
              'id: cabin_seed',
              'boGenerateAllCabinSubquotes',
              'Generate and verify all Cabin Demo 08 system records',
              'steps.cabin_seed.outcome',
              'artifacts/cabin-demo08/',
          ]
          remaining = [value for value in forbidden if value in text]
          if remaining:
              raise SystemExit('HOLD — obsolete fixed demo deployment markers remain: ' + ', '.join(remaining))
          if 'node scripts/verify-universal-quote-builder.js' not in text:
              raise SystemExit('HOLD — Universal Quote Builder verifier was not added.')
          if 'Demonstration generation: not performed by production deployment' not in text:
              raise SystemExit('HOLD — production demonstration boundary was not recorded.')
          if text == original:
              raise SystemExit('HOLD — no deployment workflow change was produced.')

          path.write_text(text, encoding='utf-8')

      - name: Remove temporary patch workflow and publish correction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/patch-remove-fixed-cabin-seed.yml
          git add .github/workflows/deploy-owner-portal-hard-rule-production.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove fixed Cabin Demo seed from production deployment'
          git push origin HEAD:fix/remove-fixed-cabin-deploy-seed
