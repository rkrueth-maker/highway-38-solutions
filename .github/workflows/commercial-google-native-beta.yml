name: Deploy Commercial Google-Native Office Beta

on:
  push:
    branches:
      - main
      - agent/commercial-google-native-beta
    paths:
      - commercial-beta/deploy-request.json
  issues:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commercial-google-native-office-beta
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: github.event_name != 'issues' || github.event.issue.title == 'Launch Commercial Google-Native Office Beta'
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
      CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
      CLASP_CREDENTIALS_B64: ${{ secrets.CLASP_CREDENTIALS_B64 }}
      GOOGLE_CLASPRC_JSON: ${{ secrets.GOOGLE_CLASPRC_JSON }}
      GOOGLE_CLASPRC_JSON_B64: ${{ secrets.GOOGLE_CLASPRC_JSON_B64 }}
      H38_GATEWAY_URL: https://jqukmwtsgcsaruucnqja.supabase.co/functions/v1/h38-office-gateway
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/commercial-google-native-beta
          fetch-depth: 0

      - name: Record workflow start
        shell: bash
        run: |
          set -euo pipefail
          STATUS_TMP="$(mktemp)"
          cat > "${STATUS_TMP}" <<JSON
          {
            "status": "RUNNING",
            "runId": "${GITHUB_RUN_ID}",
            "event": "${GITHUB_EVENT_NAME}",
            "sourceSha": "${GITHUB_SHA}",
            "betaBranch": "agent/commercial-google-native-beta",
            "transport": "supabase-gateway",
            "startedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin agent/commercial-google-native-beta
            git reset --hard origin/agent/commercial-google-native-beta
            mkdir -p commercial-beta
            cp "${STATUS_TMP}" commercial-beta/workflow-status.json
            git add commercial-beta/workflow-status.json
            if git diff --cached --quiet; then
              echo "Workflow start state is already current."
              break
            fi
            git commit -m "Record commercial beta workflow start"
            if git push origin HEAD:agent/commercial-google-native-beta; then
              break
            fi
            if [[ "${attempt}" == "3" ]]; then
              echo "Unable to record workflow start after ${attempt} attempts."
              exit 1
            fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - id: verify
        name: Verify isolated commercial beta gateway source and startup
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-h38-office-gateway-source.js
          node scripts/verify-commercial-google-native-beta.js
          node scripts/verify-commercial-startup.js

      - id: gateway_health
        name: Verify secure Supabase gateway health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/commercial-google-native-beta
          HTTP_STATUS="$(curl -sS --max-time 30 -o artifacts/commercial-google-native-beta/gateway-health.json -w '%{http_code}' "${H38_GATEWAY_URL}")"
          printf '%s' "${HTTP_STATUS}" > artifacts/commercial-google-native-beta/gateway-health-status.txt
          node - "${HTTP_STATUS}" artifacts/commercial-google-native-beta/gateway-health.json <<'NODE'
          const fs=require('fs');
          const status=Number(process.argv[2]);
          const file=process.argv[3];
          const payload=JSON.parse(fs.readFileSync(file,'utf8'));
          if(status<200||status>=300)throw new Error(`Gateway health returned HTTP ${status}.`);
          if(payload.status!=='PASS'||payload.service!=='h38-office-gateway'||payload.transport!=='supabase-gateway'||payload.browserReceivesGoogleToken!==false||payload.existingAppsScriptDeployment!==true){throw new Error(`Gateway health contract failed: ${JSON.stringify(payload)}`);}
          console.log(JSON.stringify({status:'PASS',httpStatus:status,service:payload.service,transport:payload.transport,browserReceivesGoogleToken:false,existingAppsScriptDeployment:true},null,2));
          NODE

      - id: install_clasp
        name: Install Apps Script deployment tool
        run: npm install --global @google/clasp@3.1.0

      - id: credentials
        name: Load encrypted Google credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          if [[ -n "${CLASPRC_JSON}" ]]; then printf '%s' "${CLASPRC_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASPRC_JSON_B64}" ]]; then printf '%s' "${CLASPRC_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_CREDENTIALS}" ]]; then printf '%s' "${CLASP_CREDENTIALS}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_CREDENTIALS_B64}" ]]; then printf '%s' "${CLASP_CREDENTIALS_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${GOOGLE_CLASPRC_JSON}" ]]; then printf '%s' "${GOOGLE_CLASPRC_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${GOOGLE_CLASPRC_JSON_B64}" ]]; then printf '%s' "${GOOGLE_CLASPRC_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          else echo 'HOLD — no encrypted Google credential is configured.'; exit 78; fi
          chmod 600 "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8')); console.log('Encrypted clasp credential loaded.')"

      - id: deploy
        name: Update existing beta project and deployment
        shell: bash
        run: bash scripts/deploy-commercial-google-native-beta.sh

      - id: startup_acceptance
        name: Run gateway browser and authorized deployed startup acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          bash scripts/run-commercial-webapp-startup-acceptance.sh "$HOME/.clasprc.json"

      - name: Persist workflow and deployment outcome
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          GATEWAY_HEALTH_OUTCOME: ${{ steps.gateway_health.outcome }}
          INSTALL_CLASP_OUTCOME: ${{ steps.install_clasp.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          STARTUP_ACCEPTANCE_OUTCOME: ${{ steps.startup_acceptance.outcome }}
        run: |
          set -euo pipefail
          FINAL_STATUS=FAIL
          if [[ "${VERIFY_OUTCOME}" == "success" && "${GATEWAY_HEALTH_OUTCOME}" == "success" && "${DEPLOY_OUTCOME}" == "success" && "${STARTUP_ACCEPTANCE_OUTCOME}" == "success" ]]; then FINAL_STATUS=PASS; fi
          STATE_TMP="$(mktemp -d)"
          cat > "${STATE_TMP}/workflow-status.json" <<JSON
          {
            "status": "${FINAL_STATUS}",
            "runId": "${GITHUB_RUN_ID}",
            "event": "${GITHUB_EVENT_NAME}",
            "sourceSha": "${GITHUB_SHA}",
            "betaBranch": "agent/commercial-google-native-beta",
            "transport": "supabase-gateway",
            "verify": "${VERIFY_OUTCOME}",
            "gatewayHealth": "${GATEWAY_HEALTH_OUTCOME}",
            "installClasp": "${INSTALL_CLASP_OUTCOME}",
            "credentials": "${CREDENTIALS_OUTCOME}",
            "deploy": "${DEPLOY_OUTCOME}",
            "startupAcceptance": "${STARTUP_ACCEPTANCE_OUTCOME}",
            "finishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          if [[ -f commercial-beta/deployment-state.json ]]; then
            cp commercial-beta/deployment-state.json "${STATE_TMP}/deployment-state.json"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin agent/commercial-google-native-beta
            git reset --hard origin/agent/commercial-google-native-beta
            mkdir -p commercial-beta
            cp "${STATE_TMP}/workflow-status.json" commercial-beta/workflow-status.json
            git add commercial-beta/workflow-status.json
            if [[ -f "${STATE_TMP}/deployment-state.json" ]]; then
              cp "${STATE_TMP}/deployment-state.json" commercial-beta/deployment-state.json
              git add commercial-beta/deployment-state.json
            fi
            if git diff --cached --quiet; then
              echo "Workflow outcome state is already current."
              break
            fi
            git commit -m "Record commercial beta workflow outcome"
            if git push origin HEAD:agent/commercial-google-native-beta; then
              break
            fi
            if [[ "${attempt}" == "3" ]]; then
              echo "Unable to persist workflow outcome after ${attempt} attempts."
              exit 1
            fi
          done

      - name: Upload deployment and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-google-native-beta-${{ github.run_id }}
          path: artifacts/commercial-google-native-beta/
          if-no-files-found: warn
          retention-days: 90
