name: Patch v0.5.7 field verifier

on:
  push:
    branches:
      - fix/in-app-walkthrough-camera-mic-v057

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v057 verifier patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/in-app-walkthrough-camera-mic-v057
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch verifier
        run: python scripts/patch-v057-field-verifier.py
      - name: Remove one-time patch files
        run: rm scripts/patch-v057-field-verifier.py .github/workflows/patch-v057-field-verifier.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify in-app walkthrough flow [v057 verifier patched]"
          git push origin HEAD:fix/in-app-walkthrough-camera-mic-v057
