name: Apply Kitchen Island Label
on:
  push:
    branches: [agent/professional-cad-rebuild]
    paths:
      - 'scripts/annotate-kitchen-cad-island.js'
      - '.github/workflows/apply-kitchen-island-label.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  annotate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/professional-cad-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/annotate-kitchen-cad-island.js
      - run: |
          grep -q 'ISLAND 9′-0″ × 3′-9″' assets/quote-builder/whole-house-cad/A-401.svg
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/quote-builder/whole-house-cad/A-401.svg
          if git diff --cached --quiet; then
            echo 'No annotation changes.'
          else
            git commit -m 'Label kitchen island dimensions'
            git push origin HEAD:agent/professional-cad-rebuild
          fi
