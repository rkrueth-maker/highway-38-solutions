name: H38 Deals v3.1.1 Three Product Split

on:
  push:
    branches:
      - agent/private-reseller-scout
    paths:
      - native/h38-site-scanner/android-app/reseller/**
      - deals-app/**
      - supabase/migrations/20260908073300_h38_deals_three_product_split.sql
      - supabase/migrations/20260908073717_coupon_barcode_support.sql
      - .github/workflows/h38-deals-v310-split.yml
      - scout-static/**
      - scripts/scout-web-button-acceptance.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h38-deals-v310-split
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    env:
      SB_URL: https://jqukmwtsgcsaruucnqja.supabase.co
      SB_KEY: sb_publishable_XrF41kGmTC2SmSTgPvo5OQ_vqcBd0N1
      SCOUT_EMAIL: ${{ secrets.H38_SCOUT_TEST_EMAIL }}
      SCOUT_PASSWORD: ${{ secrets.H38_SCOUT_TEST_PASSWORD }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      DEVICE_MODEL: r0q
      DEVICE_VERSION: '34'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate acceptance script syntax
        shell: bash
        run: bash -n deals-app/acceptance-v310.sh

      - name: Run live three-product acceptance
        shell: bash
        run: bash deals-app/acceptance-v310.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android platform
        shell: bash
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;35.0.0'"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore persistent Scout signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: h38-reseller-scout-owner-debug-signing-v1

      - name: Build and verify H38 Deals APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/v310"
          mkdir -p "$report"
          export H38_ANDROID_UPLOAD_KEYSTORE_PATH="$HOME/.android/debug.keystore"
          export H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=android
          export H38_ANDROID_UPLOAD_KEY_ALIAS=androiddebugkey
          export H38_ANDROID_UPLOAD_KEY_PASSWORD=android
          cd "$GITHUB_WORKSPACE/native/h38-site-scanner/android-app"
          gradle --no-daemon clean :reseller:assembleOwner | tee "$report/compile.log"
          src=$(find reseller/build/outputs/apk -type f -path '*/owner/*.apk' ! -path '*/androidTest/*' | head -n1)
          test -f "$src"
          apk="$report/H38-Deals-3.1.1.apk"
          cp "$src" "$apk"
          echo "APP_APK=$apk" >> "$GITHUB_ENV"
          sha256sum "$apk" | tee "$report/sha256.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee "$report/badging.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='341' versionName='3.1.1'" "$report/badging.txt"
          grep -Fq "application-label:'H38 Deals'" "$report/badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$report/signing.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          cert=$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$report/signing.txt" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          test "$cert" = cdabe362ad80788c4ac216a26a8dcc44174eceb3c380c3b4a126507af4043c46
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk" >/dev/null
          unzip -t "$apk" >/dev/null
          for dex in $(unzip -Z1 "$apk" | grep -E '^classes([0-9]*)?\.dex$'); do unzip -p "$apk" "$dex"; done | strings > "$report/dex.txt"
          grep -Fq 'H38_DEALS_THIN_SHELL_V311' "$report/dex.txt"
          grep -Fq 'h38-deals-shell' "$report/dex.txt"
          if grep -Fq 'H38_SCOUT_V263_PHYSICAL_BUNDLE_AUTHORITY' "$report/dex.txt"; then exit 1; fi
          echo APK_THIN_SHELL_PASS | tee "$report/apk-status.txt"

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy dedicated Scout static hosting
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/v310/hosting"
          mkdir -p "$report"
          npm install --no-save firebase-tools@13.35.1 playwright@1.55.0

          node scripts/build-scout-static-web.cjs scout-static
          for file in index.html penny.html resale.html coupon.html maintenance.html; do
            test -s "scout-static/$file"
            grep -Eiq '<!doctype html|<html' "scout-static/$file"
          done

          suffix="$(printf '%s' "$FIREBASE_PROJECT_ID" | sha256sum | cut -c1-10)"
          site_id="h38-deals-$suffix"
          host_url="https://$site_id.web.app"

          if ! npx firebase hosting:sites:create "$site_id" --project "$FIREBASE_PROJECT_ID" --non-interactive > "$report/site-create.log" 2>&1; then
            cat "$report/site-create.log"
            npx firebase hosting:sites:list --project "$FIREBASE_PROJECT_ID" --non-interactive | tee "$report/sites.txt"
            grep -Fq "$site_id" "$report/sites.txt"
          fi

          cat > "$RUNNER_TEMP/firebase.scout.json" <<EOF
          {
            "hosting": {
              "site": "$site_id",
              "public": "$GITHUB_WORKSPACE/scout-static",
              "ignore": ["**/.*", "**/node_modules/**"],
              "cleanUrls": false,
              "trailingSlash": false,
              "headers": [
                {
                  "source": "**",
                  "headers": [
                    {"key": "Cache-Control", "value": "no-store"},
                    {"key": "X-Content-Type-Options", "value": "nosniff"},
                    {"key": "Referrer-Policy", "value": "no-referrer"}
                  ]
                }
              ]
            }
          }
          EOF

          npx firebase deploy --only hosting --config "$RUNNER_TEMP/firebase.scout.json" --project "$FIREBASE_PROJECT_ID" --non-interactive | tee "$report/deploy.log"
          printf '%s\n' "$host_url" | tee "$report/URL.txt"
          echo "H38_REMOTE_WEB_BASE=$host_url" >> "$GITHUB_ENV"

          for file in index.html penny.html resale.html coupon.html maintenance.html; do
            code="$(curl -L -sS -o "/tmp/$file" -D /tmp/h38-host-headers.txt -w '%{http_code}' "$host_url/$file")"
            ctype="$(grep -i '^content-type:' /tmp/h38-host-headers.txt | tail -1 | cut -d: -f2- | tr -d ' \\015')"
            test "$code" = "200"
            echo "$ctype" | grep -Eiq '^text/html'
            grep -Eiq '<!doctype html|<html' "/tmp/$file"
          done

      - name: Run remote static browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/v310/hosting"
          npx playwright install --with-deps chromium
          SUPABASE_URL="$SB_URL" \
          SUPABASE_KEY="$SB_KEY" \
          H38_WEB_BASE="$H38_REMOTE_WEB_BASE" \
          H38_ACCEPTANCE_OUT="$report/remote-report.json" \
          node scripts/scout-web-button-acceptance.cjs

      - name: Firebase physical install and launch
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/v310"
          gcloud firebase test android models describe "$DEVICE_MODEL" --format=yaml | tee "$report/device.yml"
          grep -qi PHYSICAL "$report/device.yml"
          gcloud firebase test android run --project "$FIREBASE_PROJECT_ID" --type robo --app "$APP_APK" --device "model=$DEVICE_MODEL,version=$DEVICE_VERSION,locale=en,orientation=portrait" --timeout 5m --results-history-name 'H38 Deals v3.1.1 Three Product Split' --client-details matrixLabel='H38 Deals v3.1.1 install launch' 2>&1 | tee "$report/firebase.log"
          if grep -E 'FATAL EXCEPTION|AndroidRuntime|ANR|FAILURES!!!' "$report/firebase.log"; then exit 1; fi
          echo FIREBASE_PHYSICAL_INSTALL_LAUNCH_PASS | tee "$report/firebase-status.txt"

      - name: Upload H38 Deals APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h38-deals-3.1.1
          path: artifacts/v310/**
          if-no-files-found: error
          retention-days: 30
