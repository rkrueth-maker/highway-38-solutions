name: Build H38 Google Play AAB

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/h38-site-scanner/android-app/**'
      - '.github/workflows/android-play-bundle.yml'
  push:
    branches: [main]
    paths:
      - 'native/h38-site-scanner/android-app/**'
      - '.github/workflows/android-play-bundle.yml'

permissions:
  contents: read

jobs:
  build-play-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Resolve Android version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode \([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
      - name: Configure release upload key when available
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.H38_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/h38-upload-keystore.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            {
              echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "H38_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "H38_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              echo 'Play release signing secrets are not configured.' >&2
              echo 'Required: H38_ANDROID_UPLOAD_KEYSTORE_B64, H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD, H38_ANDROID_UPLOAD_KEY_ALIAS, H38_ANDROID_UPLOAD_KEY_PASSWORD.' >&2
              exit 1
            fi
          fi
      - name: Build release App Bundle
        run: gradle --no-daemon --stacktrace :app:bundleRelease
      - name: Verify release bundle
        shell: bash
        run: |
          set -euo pipefail
          AAB='app/build/outputs/bundle/release/app-release.aab'
          VERSION='${{ steps.version.outputs.version_name }}'
          test -s "$AAB"
          unzip -t "$AAB" >/dev/null
          if [[ "${{ steps.signing.outputs.signed }}" == 'true' ]]; then
            # Android upload/app-signing certificates are normally self-signed.
            # `-strict` treats that expected certificate chain as an error even when
            # the AAB signature is valid, so verify the JAR signature itself here.
            jarsigner -verify -verbose -certs "$AAB" | tee "$RUNNER_TEMP/aab-signature-verification.txt"
            grep -q 'jar verified.' "$RUNNER_TEMP/aab-signature-verification.txt"
          fi
          cp "$AAB" "$GITHUB_WORKSPACE/H38-Business-Office-v${VERSION}.aab"
          sha256sum "$GITHUB_WORKSPACE/H38-Business-Office-v${VERSION}.aab" > "$GITHUB_WORKSPACE/H38-Business-Office-v${VERSION}.aab.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: h38-google-play-v${{ steps.version.outputs.version_name }}
          path: |
            H38-Business-Office-v${{ steps.version.outputs.version_name }}.aab
            H38-Business-Office-v${{ steps.version.outputs.version_name }}.aab.sha256
          if-no-files-found: error
          retention-days: 30
