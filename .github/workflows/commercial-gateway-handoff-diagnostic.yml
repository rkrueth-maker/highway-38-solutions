name: Diagnose Commercial Gateway Handoff

on:
  push:
    branches:
      - agent/capture-gateway-handoff-error
    paths:
      - scripts/diagnose-commercial-gateway-handoff.js
      - .github/workflows/commercial-gateway-handoff-diagnostic.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/diagnose-commercial-gateway-handoff.js
      - .github/workflows/commercial-gateway-handoff-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: commercial-gateway-handoff-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
      CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
      CLASP_CREDENTIALS_B64: ${{ secrets.CLASP_CREDENTIALS_B64 }}
      GOOGLE_CLASPRC_JSON: ${{ secrets.GOOGLE_CLASPRC_JSON }}
      GOOGLE_CLASPRC_JSON_B64: ${{ secrets.GOOGLE_CLASPRC_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Load encrypted Google credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          if [[ -n "${CLASPRC_JSON}" ]]; then printf '%s' "${CLASPRC_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASPRC_JSON_B64}" ]]; then printf '%s' "${CLASPRC_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_CREDENTIALS}" ]]; then printf '%s' "${CLASP_CREDENTIALS}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_CREDENTIALS_B64}" ]]; then printf '%s' "${CLASP_CREDENTIALS_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${GOOGLE_CLASPRC_JSON}" ]]; then printf '%s' "${GOOGLE_CLASPRC_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${GOOGLE_CLASPRC_JSON_B64}" ]]; then printf '%s' "${GOOGLE_CLASPRC_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          else echo 'No encrypted Google credential is configured.'; exit 78; fi
          chmod 600 "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8')); console.log('Encrypted credential loaded.')"

      - name: Install protected browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture authorized Google handoff state
        shell: bash
        run: node scripts/diagnose-commercial-gateway-handoff.js "$HOME/.clasprc.json"

      - name: Post sanitized diagnostic summary
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPORT="artifacts/commercial-google-native-beta/gateway-handoff-diagnostic.json"
          COMMENT="${RUNNER_TEMP}/gateway-diagnostic-comment.md"
          if [[ ! -f "${REPORT}" ]]; then
            printf 'Protected gateway diagnostic run `%s` produced no JSON report.\n' "${GITHUB_RUN_ID}" > "${COMMENT}"
          else
            node - "${REPORT}" "${COMMENT}" "${GITHUB_RUN_ID}" <<'NODE'
          const fs=require('fs');
          const [input,output,runId]=process.argv.slice(2);
          const report=JSON.parse(fs.readFileSync(input,'utf8'));
          const compact={
            runId,
            startedAt:report.startedAt||'',
            finishedAt:report.finishedAt||'',
            error:report.error||'',
            gatewayResponses:report.gatewayResponses||[],
            frames:(report.frames||[]).map(frame=>({
              url:frame.url||'',
              status:frame.status||'',
              continueButton:frame.continueButton||null,
              body:String(frame.body||'').slice(0,1800)
            })),
            pageErrors:report.pageErrors||[],
            consoleMessages:(report.consoleMessages||[]).slice(-12)
          };
          const body=['### Protected gateway diagnostic', '', '```json', JSON.stringify(compact,null,2), '```', '', 'OAuth tokens and long opaque values were redacted before this comment was created.'].join('\n');
          fs.writeFileSync(output,body+'\n');
          NODE
          fi
          gh pr comment 486 --repo "${GITHUB_REPOSITORY}" --body-file "${COMMENT}"

      - name: Upload sanitized handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-gateway-handoff-diagnostic-${{ github.run_id }}
          path: artifacts/commercial-google-native-beta/
          if-no-files-found: error
          retention-days: 30
