name: Verify retired Office deployments disabled

on:
  pull_request:
    paths:
      - '.github/workflows/*office*.yml'
      - '.github/workflows/*owner-portal*.yml'
      - '.github/workflows/quote-mobile-native-live.yml'
      - 'scripts/verify-retired-office-deployments-disabled.js'
      - 'commercial-app/supabase-config.js'
      - 'open-business-office.html'
      - 'businesses/northern-lakes/app-deployment.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/*office*.yml'
      - '.github/workflows/*owner-portal*.yml'
      - '.github/workflows/quote-mobile-native-live.yml'
      - 'scripts/verify-retired-office-deployments-disabled.js'
      - 'commercial-app/supabase-config.js'
      - 'open-business-office.html'
      - 'businesses/northern-lakes/app-deployment.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/verify-retired-office-deployments-disabled.js
