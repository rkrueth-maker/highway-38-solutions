name: Verify field visit offline and autofill

on:
  pull_request:
    paths:
      - 'commercial-app/field-visit*.js'
      - 'commercial-app/field-visit.css'
      - 'commercial-app/auth-autofill.*'
      - 'commercial-app/index.html'
      - 'commercial-app/service-worker.js'
      - 'native/h38-site-scanner/android-app/**'
      - '.well-known/assetlinks.json'
      - 'robots.txt'
      - 'scripts/verify-field-visit-offline-autofill.js'
      - '.github/workflows/verify-field-visit-offline-autofill.yml'
  push:
    branches: [main]
    paths:
      - 'commercial-app/field-visit*.js'
      - 'commercial-app/field-visit.css'
      - 'commercial-app/auth-autofill.*'
      - 'commercial-app/index.html'
      - 'commercial-app/service-worker.js'
      - 'native/h38-site-scanner/android-app/**'
      - '.well-known/assetlinks.json'
      - 'robots.txt'
      - 'scripts/verify-field-visit-offline-autofill.js'
      - '.github/workflows/verify-field-visit-offline-autofill.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify field workflow, offline queue, and autofill contract
        run: node scripts/verify-field-visit-offline-autofill.js
      - name: Verify JavaScript syntax
        run: |
          node --check commercial-app/field-visit-core.js
          node --check commercial-app/field-visit-ui.js
          node --check commercial-app/field-visit.js
          node --check commercial-app/auth-autofill.js
          node --check commercial-app/service-worker.js
      - name: Verify Digital Asset Links JSON
        run: |
          if [ -f .well-known/assetlinks.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('.well-known/assetlinks.json','utf8'));"
          fi
