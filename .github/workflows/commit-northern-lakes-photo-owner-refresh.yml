name: Commit verified Northern Lakes refresh

on:
  push:
    branches:
      - agent/fix-northern-lakes-photo-library-owner-links
    paths:
      - .github/workflows/commit-northern-lakes-photo-owner-refresh.yml

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-northern-lakes-photo-library-owner-links
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests
      - name: Extract and run the already-verified refresh script
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path('.github/workflows/apply-northern-lakes-photo-owner-refresh.yml').read_text()
          start="          cat > /tmp/apply_refresh.py <<'PY'\n"
          end="\n          PY\n          python /tmp/apply_refresh.py"
          body=source.split(start,1)[1].split(end,1)[0]
          Path('/tmp/apply_refresh.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())+'\n')
          PY
          python /tmp/apply_refresh.py
      - name: Verify the generated site, portal, photos and owner links
        run: |
          node scripts/verify-northern-lakes-photo-owner-links.js
          node scripts/verify-northern-lakes-site-portal-build.js
          node scripts/verify-northern-lakes-commercial-package.js
      - name: Commit only product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore --source=HEAD -- .github/workflows/verify-northern-lakes-site-portal.yml
          git add businesses/northern-lakes business-packs/northern-lakes/supabase-business-pack.json scripts/verify-northern-lakes-site-portal-build.js scripts/verify-northern-lakes-commercial-package.js scripts/verify-northern-lakes-photo-owner-links.js
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Northern Lakes photos and owner access links'
          git push origin HEAD:agent/fix-northern-lakes-photo-library-owner-links
