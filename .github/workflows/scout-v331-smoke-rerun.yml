name: H38 Scout v3.0.31 Smoke Rerun

on:
  push:
    branches: ['agent/private-reseller-scout']
    paths: ['.github/workflows/scout-v331-smoke-rerun.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate unchanged v3.0.31 app source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = agent/private-reseller-scout
          grep -Fq "versionCode 331" reseller/build.gradle
          grep -Fq "versionName '3.0.31'" reseller/build.gradle
          grep -Fq 'H38_SCOUT_V331_PROVEN_ACQUISITION_RESTORE=true' reseller/src/main/assets/reseller/v240-data.js
          grep -Fq 'reseller-auto-leads-v066' reseller/src/main/assets/reseller/v240-data.js
          grep -Fq 'Automatic Marketplace collector used by Scout' reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java
          login_base=64ef9a193958c0fbfc75a8b0e47777857d8bafe5
          test "$(sha256sum reseller/src/main/assets/reseller/v200-app.js | awk '{print $1}')" = "$(git show "$login_base:native/h38-site-scanner/android-app/reseller/src/main/assets/reseller/v200-app.js" | sha256sum | awk '{print $1}')"
          test "$(sha256sum reseller/src/main/java/com/highway38/resellerscout/MainActivity.java | awk '{print $1}')" = "$(git show "$login_base:native/h38-site-scanner/android-app/reseller/src/main/java/com/highway38/resellerscout/MainActivity.java" | sha256sum | awk '{print $1}')"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: h38-reseller-scout-owner-debug-signing-v1
      - name: Build exact APK
        shell: bash
        run: |
          set -euo pipefail
          export H38_ANDROID_UPLOAD_KEYSTORE_PATH="$HOME/.android/debug.keystore"
          export H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=android
          export H38_ANDROID_UPLOAD_KEY_ALIAS=androiddebugkey
          export H38_ANDROID_UPLOAD_KEY_PASSWORD=android
          mkdir -p "$GITHUB_WORKSPACE/artifacts/v331-smoke"
          gradle --no-daemon :reseller:assembleOwner
          src="$(find reseller/build/outputs/apk -type f -path '*/owner/*.apk' ! -path '*/androidTest/*' | head -n1)"
          cp "$src" "$GITHUB_WORKSPACE/artifacts/v331-smoke/H38-Scout-v3.0.31.apk"
          sha256sum "$GITHUB_WORKSPACE/artifacts/v331-smoke/H38-Scout-v3.0.31.apk" | tee "$GITHUB_WORKSPACE/artifacts/v331-smoke/sha256.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/artifacts/v331-smoke/H38-Scout-v3.0.31.apk" | tee "$GITHUB_WORKSPACE/artifacts/v331-smoke/signing.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$GITHUB_WORKSPACE/artifacts/v331-smoke/signing.txt"
          cert="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$GITHUB_WORKSPACE/artifacts/v331-smoke/signing.txt" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = cdabe362ad80788c4ac216a26a8dcc44174eceb3c380c3b4a126507af4043c46
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
      - name: Firebase physical install smoke corrected path
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/v331-smoke"
          app="$report/H38-Scout-v3.0.31.apk"
          test -f "$app"
          gcloud firebase test android models describe r0q --format=yaml | tee "$report/device.yml"
          grep -qi PHYSICAL "$report/device.yml"
          gcloud firebase test android run --project "$FIREBASE_PROJECT_ID" --type robo --app "$app" --device "model=r0q,version=34,locale=en,orientation=portrait" --timeout 8m --results-history-name 'H38 Scout v3.0.31 Smoke Rerun' --client-details matrixLabel='H38 Scout v3.0.31 corrected path smoke' 2>&1 | tee "$report/firebase.log"
          grep -niE 'FATAL EXCEPTION|AndroidRuntime|ANR|FAILURES!!!|TypeError|ReferenceError|Unhandled|uncaught' "$report/firebase.log" > "$report/runtime-errors.txt" || true
          test ! -s "$report/runtime-errors.txt"
          echo FIREBASE_PHYSICAL_SMOKE_PASS | tee "$report/firebase-status.txt"
      - name: Upload verified APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h38-scout-v3.0.31-smoke-rerun
          path: artifacts/v331-smoke/**
          if-no-files-found: error
          retention-days: 30
