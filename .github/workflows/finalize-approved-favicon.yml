name: Finalize Approved Favicon

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/finalize-approved-favicon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/repair-deck-kitchen-favicon
          fetch-depth: 0

      - name: Build favicon from exact approved logo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          logo=Path('assets/highway38-logo.png').read_bytes()
          encoded=base64.b64encode(logo).decode('ascii')
          svg=(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">'
            '<title id="title">Highway 38 Solutions</title>'
            '<desc id="desc">Approved Highway 38 Solutions mountain and road badge</desc>'
            '<image href="data:image/png;base64,'+encoded+'" x="0" y="0" width="128" height="128" preserveAspectRatio="xMidYMid meet"/>'
            '</svg>\n'
          )
          Path('favicon.svg').write_text(svg,encoding='utf-8')
          PY

      - name: Commit exact approved favicon
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add favicon.svg
          git commit -m 'Use exact approved logo in browser favicon' || exit 0
          git pull --rebase origin agent/repair-deck-kitchen-favicon
          git push origin HEAD:agent/repair-deck-kitchen-favicon

      - name: Capture ecosystem verifier output
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          node scripts/verify-complete-ecosystem.js > diagnostics/complete-ecosystem.log 2>&1
          echo "exit_code=$?" >> diagnostics/complete-ecosystem.log
          node scripts/verify-public-customer-path.js > diagnostics/public-customer-path.log 2>&1
          echo "exit_code=$?" >> diagnostics/public-customer-path.log
          exit 0

      - name: Upload verifier diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: favicon-finalizer-diagnostics-${{ github.run_id }}
          path: diagnostics/
          retention-days: 3
