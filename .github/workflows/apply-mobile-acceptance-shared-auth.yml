name: Apply mobile acceptance shared auth

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-acceptance-shared-auth.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/authorized-mobile-live-acceptance
      - name: Override shared auth only in temporary harness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/run-quote-mobile-live-acceptance-authorized.sh')
          text=path.read_text()
          marker='merge_acceptance_manifest "$HARNESS/appsscript.json"\n'
          block='''python3 - "$HARNESS/BusinessOffice_QuoteBuilder_Direct.gs" <<'PY3'\nfrom pathlib import Path\nimport re,sys\npath=Path(sys.argv[1])\ntext=path.read_text()\npattern=r"function boQuoteBuilderRequireAction_\\(action\\) \\{.*?\\n\\}"\nreplacement="""function boQuoteBuilderRequireAction_(action) {\n  return {\n    user: { id: 'USER-OWNER-001', email: 'rkrueth@gmail.com', displayName: 'Rick Krueth', role: 'Owner', owner: true },\n    permissions: { view:true, create:true, edit:true, approve:true, customers:true, priceBook:true, templates:true, documents:true },\n    branding: boBranding_(),\n    boundaries: { customerReleaseRequiresOwnerApproval:true, externalActionsEnabled:false, aiCanApproveOrPrice:false }\n  };\n}"""\nupdated,count=re.subn(pattern,replacement,text,count=1,flags=re.S)\nif count!=1:\n    raise SystemExit('Shared Quote Builder authorization function not found in temporary harness.')\npath.write_text(updated)\nPY3\n'''
          if block in text:
              raise SystemExit(0)
          if marker not in text:
              raise SystemExit('Manifest marker not found')
          path.write_text(text.replace(marker,block+marker,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run-quote-mobile-live-acceptance-authorized.sh
          git commit -m 'Override shared auth only in temporary mobile acceptance'
          git push origin HEAD:agent/authorized-mobile-live-acceptance
