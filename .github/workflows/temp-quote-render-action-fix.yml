name: Temporary Quote Render Action Fix

on:
  push:
    branches:
      - agent/quote-agent-walkthrough-acceptance-polish-20260823

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[quote-render-action-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quote-agent-walkthrough-acceptance-polish-20260823
          fetch-depth: 0
      - name: Apply exact forwarding repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/h38-quote-agent/index.ts')
          s=p.read_text()
          replacements=[
            ('const BUILD="20260824-quote-agent-canonical-2-evidence-source";','const BUILD="20260824-quote-agent-canonical-3-render-action";'),
            ('const PREVIOUS_BUILD="20260824-quote-agent-canonical-1";','const PREVIOUS_BUILD="20260824-quote-agent-canonical-2-evidence-source";'),
            ('{action:"buildQuote",...body,businessId:', '{...body,action:"buildQuote",businessId:'),
            ('{action:"renderConcept",...body,businessId:', '{...body,action:"renderConcept",businessId:'),
          ]
          for old,new in replacements:
              if s.count(old)!=1:
                  raise SystemExit(f'expected exactly one marker: {old!r}; found {s.count(old)}')
              s=s.replace(old,new)
          if '{action:"renderConcept",...body' in s or '{action:"buildQuote",...body' in s:
              raise SystemExit('stale forwarding order remains')
          if s.count('{...body,action:"renderConcept",businessId:')!=1:
              raise SystemExit('renderConcept forwarding repair missing')
          if s.count('{...body,action:"buildQuote",businessId:')!=1:
              raise SystemExit('buildQuote forwarding repair missing')
          p.write_text(s)
          Path('.github/workflows/temp-quote-render-action-fix.yml').unlink()
          PY
      - name: Commit repaired source and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/h38-quote-agent/index.ts .github/workflows/temp-quote-render-action-fix.yml
          git commit -m "Fix quote render action forwarding [quote-render-action-fixed]"
          git push origin HEAD:agent/quote-agent-walkthrough-acceptance-polish-20260823
