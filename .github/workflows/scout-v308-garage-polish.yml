name: Build H38 Scout v3.0.14 Source Quality Repair

on:
  push:
    branches: ['agent/private-reseller-scout']
    paths:
      - 'native/h38-site-scanner/android-app/reseller/**'
      - 'supabase/functions/reseller-auto-leads-v065/**'
      - 'supabase/functions/reseller-dg-remodel-radar-v240/**'
      - 'supabase/functions/reseller-image-delivery-v201/**'
      - 'supabase/functions/reseller-garage-sales-v308/**'
      - '.github/workflows/scout-v308-garage-polish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scout-v314-source-quality
  cancel-in-progress: true

jobs:
  validate-build-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Verify v3.0.14 source and regression contracts
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v314"; mkdir -p "$report"
          test "$(git branch --show-current)" = 'agent/private-reseller-scout'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --check reseller/src/main/assets/reseller/v240-data.js
          node --check reseller/src/main/assets/reseller/v264-wide-repair.js
          node --check reseller/src/main/assets/reseller/v265-facebook-acquisition-repair.js
          node --check reseller/src/main/assets/reseller/v266-actionable-intake.js
          node --check reseller/src/main/assets/reseller/v308-garage-polish.js
          node --check reseller/src/main/assets/reseller/v314-source-quality-repair.js
          node --check "$GITHUB_WORKSPACE/supabase/functions/reseller-dg-remodel-radar-v240/core.mjs"
          node reseller/v300-single-owner-runtime.test.mjs | tee "$report/runtime-contract.txt"
          node reseller/hunt-native.test.mjs | tee "$report/hunt-native.txt"
          node reseller/profit-engine.test.mjs | tee "$report/profit-engine.txt"
          node "$GITHUB_WORKSPACE/supabase/functions/reseller-dg-remodel-radar-v240/core.test.mjs" | tee "$report/dg-remodel-sanitize.txt"
          grep -Fq "versionName '3.0.14'" reseller/build.gradle
          grep -Fq 'versionCode 314' reseller/build.gradle
          grep -Fq 'v308-garage-polish.js' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          grep -Fq 'v314-source-quality-repair.js' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          grep -Fq 'H38_SCOUT_V314_SOURCE_QUALITY=true' reseller/src/main/assets/reseller/v314-source-quality-repair.js
          grep -Fq 'Dollar General Inventory Checker' reseller/src/androidTest/java/com/highway38/resellerscout/RemoteOwnerUxTest.java
          grep -Fq 'Hunt profitable Facebook deals' reseller/src/main/assets/reseller/v314-source-quality-repair.js
          grep -Fq 'Garage & estate sales' reseller/src/main/assets/reseller/v308-garage-polish.js
          echo BUILD_GATE_OK > "$report/contracts.txt"

      - name: Configure stable owner signing when available
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.H38_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v314"
          if [[ -n "${KEYSTORE_B64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/h38-upload-keystore.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            {
              echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "H38_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "H38_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo 'stable-upload-key' > "$report/signing-mode.txt"
          else
            echo 'ephemeral-debug-key' > "$report/signing-mode.txt"
          fi

      - name: Compile owner installable APK and instrumentation APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v314"
          if [[ -n "${H38_ANDROID_UPLOAD_KEYSTORE_PATH:-}" ]]; then
            gradle --no-daemon :reseller:assembleOwnerRelease :reseller:assembleOwnerDebugAndroidTest | tee "$report/compile.log"
            apk="$(find reseller/build/outputs/apk -type f -path '*/owner/release/*.apk' ! -path '*/androidTest/*' | head -n1)"
          else
            gradle --no-daemon :reseller:assembleOwnerDebug :reseller:assembleOwnerDebugAndroidTest | tee "$report/compile.log"
            apk="$(find reseller/build/outputs/apk -type f -path '*/owner/debug/*.apk' ! -path '*/androidTest/*' | head -n1)"
          fi
          testapk="$(find reseller/build/outputs/apk/androidTest -type f -name '*.apk' | head -n1)"
          test -n "$apk" -a -f "$apk"
          test -n "$testapk" -a -f "$testapk"
          out="$report/H38-Reseller-Scout-Owner-v3.0.14-source-quality.apk"; cp "$apk" "$out"
          cp "$testapk" "$report/H38-Reseller-Scout-Owner-v3.0.14-androidTest.apk"
          sha256sum "$report"/*.apk > "$report/sha256.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$out" > "$report/zipalign.txt"

      - name: Inspect exact packaged APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v314"; out="$report/H38-Reseller-Scout-Owner-v3.0.14-source-quality.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='314' versionName='3.0.14'" "$report/badging.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          grep -Fq 'Verification succesful' "$report/zipalign.txt"
          unzip -t "$out" > "$report/zip-test.txt"
          grep -Fq 'No errors detected in compressed data' "$report/zip-test.txt"
          unzip -p "$out" assets/reseller/v308-garage-polish.js > "$report/packaged-v308.js"
          unzip -p "$out" assets/reseller/v314-source-quality-repair.js > "$report/packaged-v314.js"
          node --check "$report/packaged-v308.js"
          node --check "$report/packaged-v314.js"
          grep -Fq 'Garage & estate sales' "$report/packaged-v308.js"
          grep -Fq 'H38_SCOUT_V314_SOURCE_QUALITY=true' "$report/packaged-v314.js"
          grep -Fq 'Dollar General Inventory Checker' "$GITHUB_WORKSPACE/native/h38-site-scanner/android-app/reseller/src/androidTest/java/com/highway38/resellerscout/RemoteOwnerUxTest.java"
          grep -Fq 'Hunt profitable Facebook deals' "$report/packaged-v314.js"
          echo BUILD_GATE_OK > "$report/smoke.txt"

      - name: Upload v3.0.14 APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v3.0.14-source-quality
          path: artifacts/scout-v314/*
          if-no-files-found: warn
          retention-days: 30
