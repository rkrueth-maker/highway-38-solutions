name: Apply Public Quote Builder Result Patch

on:
  push:
    branches: [agent/public-quote-builder-results-print]
    paths:
      - 'scripts/apply-public-quote-builder-result-patch.js'
      - '.github/workflows/apply-public-quote-builder-result-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/public-quote-builder-results-print
          fetch-depth: 0
      - name: Apply idempotent website patch
        run: node scripts/apply-public-quote-builder-result-patch.js
      - name: Commit generated website changes
        run: |
          if git diff --quiet; then
            echo "No generated changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universal-quote-builder.html sample-library-now.html quote-builder.html scripts/config/public-website-routes.json
          git commit -m "Show completed Quote Builder result and printable sample"
          git push origin HEAD:agent/public-quote-builder-results-print
