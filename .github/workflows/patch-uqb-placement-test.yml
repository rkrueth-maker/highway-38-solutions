name: Patch UQB Placement Test

on:
  push:
    branches:
      - agent/place-uqb-under-house
    paths:
      - '.github/workflows/patch-uqb-placement-test.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/place-uqb-under-house
          fetch-depth: 0
      - name: Replace stale standalone-page assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_scheduler_web_dashboard.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert "universal-quote-builder.html" in page\n'
          new = (
              '    assert \'data-project="cabin"\' in page\n'
              '    assert \'id="universal-quote-builder-examples"\' in page\n'
              '    assert page.index(\'id="universal-quote-builder-examples"\') > page.index(\'data-project="cabin"\')\n'
              '    assert "View full quote" in page\n'
              '    assert "View full-size CAD sheets" in page\n'
              '    assert "Print / save complete package" in page\n'
              '    assert \'class="universal-card"\' not in page\n'
              '    assert "See What It Produced" not in page\n'
          )
          if old not in text:
              raise SystemExit('Stale assertion already absent; no patch needed.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_scheduler_web_dashboard.py
          git commit -m 'Update web dashboard test for embedded UQB placement'
          git push origin HEAD:agent/place-uqb-under-house
