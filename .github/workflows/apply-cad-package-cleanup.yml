name: Apply CAD Package Cleanup
on:
  push:
    branches: [agent/professional-cad-rebuild]
    paths:
      - 'scripts/clean-enhanced-cad-package.js'
      - '.github/workflows/apply-cad-package-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/professional-cad-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/clean-enhanced-cad-package.js
      - run: |
          ! grep -q 'Detailed — Detailed' whole-house-quote-package.html
          grep -q 'A-101 — Proposed Main-Floor Plan — Detailed' whole-house-quote-package.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add whole-house-quote-package.html
          if git diff --cached --quiet; then
            echo 'No cleanup changes.'
          else
            git commit -m 'Clean enhanced CAD package headings'
            git push origin HEAD:agent/professional-cad-rebuild
          fi
