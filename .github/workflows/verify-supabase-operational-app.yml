name: Verify Supabase operational app

on:
  pull_request:
    paths:
      - 'commercial-app/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/verify-supabase-operational-app.js'
      - 'scripts/verify-supabase-quote-mobile-stabilization.js'
      - 'scripts/verify-supabase-quote-ai.js'
      - 'scripts/verify-supabase-business-office-auth*.js'
      - 'docs/architecture/SUPABASE_WEEK_ONE_APP_PARITY.md'
      - '.github/workflows/verify-supabase-operational-app.yml'
  push:
    branches:
      - main
    paths:
      - 'commercial-app/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/verify-supabase-operational-app.js'
      - 'scripts/verify-supabase-quote-mobile-stabilization.js'
      - 'scripts/verify-supabase-quote-ai.js'
      - 'scripts/verify-supabase-business-office-auth*.js'
      - 'docs/architecture/SUPABASE_WEEK_ONE_APP_PARITY.md'
      - '.github/workflows/verify-supabase-operational-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Supabase operational app
        run: node scripts/verify-supabase-operational-app.js
      - name: Verify Android Quote Builder stabilization
        run: |
          node --check commercial-app/quote-mobile-stabilization.js
          node scripts/verify-supabase-quote-mobile-stabilization.js
      - name: Verify authenticated Quote AI
        run: |
          node --check commercial-app/supabase-quote-ai.js
          node --check commercial-app/quote-ai-live-fix.js
          node scripts/verify-supabase-quote-ai.js
          ENDPOINT='https://jqukmwtsgcsaruucnqja.supabase.co/functions/v1/h38-quote-ai'
          curl --fail --silent --show-error --max-time 30 "$ENDPOINT" --output /tmp/h38-quote-ai-health.json
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/h38-quote-ai-health.json','utf8')); console.log(h); if(h.status!=='PASS'||h.providerConfigured!==true) throw new Error('The deployed Quote AI function is active, but OPENAI_API_KEY is not configured in Supabase Edge Function secrets.');"
          PREFLIGHT_CODE=$(curl --silent --show-error --max-time 30 --output /tmp/h38-preflight-body.json --dump-header /tmp/h38-preflight-headers.txt --write-out '%{http_code}' -X OPTIONS "$ENDPOINT" -H 'Origin: https://highway38solutions.com' -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,apikey,content-type,x-client-info')
          test "$PREFLIGHT_CODE" = '200'
          grep -qi '^access-control-allow-origin: https://highway38solutions.com' /tmp/h38-preflight-headers.txt
          grep -qi '^access-control-allow-headers: .*authorization' /tmp/h38-preflight-headers.txt
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/h38-preflight-body.json','utf8')); if(p.status!=='PASS'||p.preflight!==true) throw new Error('Quote AI preflight did not complete.');"
          POST_CODE=$(curl --silent --show-error --max-time 30 --output /tmp/h38-invalid-post.json --write-out '%{http_code}' -X POST "$ENDPOINT" -H 'Origin: https://highway38solutions.com' -H 'Authorization: Bearer invalid-live-routing-test' -H 'Content-Type: application/json' --data '{"action":"buildQuote","businessId":"00000000-0000-0000-0000-000000000000","quoteId":"TEST"}')
          test "$POST_CODE" = '401'
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/h38-invalid-post.json','utf8')); if(p.status!=='FAIL'||!/Auth session/i.test(p.message||'')) throw new Error('Authenticated Quote AI POST did not reach the function.');"
      - name: Preserve Supabase Auth and active-business controls
        run: |
          node scripts/verify-supabase-business-office-auth.js
          node scripts/verify-supabase-business-office-auth-runtime.js