name: Verify Supabase operational app

on:
  pull_request:
    paths:
      - 'commercial-app/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/verify-supabase-operational-app.js'
      - 'scripts/verify-supabase-quote-mobile-stabilization.js'
      - 'scripts/verify-supabase-quote-ai.js'
      - 'scripts/verify-supabase-business-office-auth*.js'
      - 'docs/architecture/SUPABASE_WEEK_ONE_APP_PARITY.md'
      - '.github/workflows/verify-supabase-operational-app.yml'
  push:
    branches:
      - main
    paths:
      - 'commercial-app/**'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'scripts/verify-supabase-operational-app.js'
      - 'scripts/verify-supabase-quote-mobile-stabilization.js'
      - 'scripts/verify-supabase-quote-ai.js'
      - 'scripts/verify-supabase-business-office-auth*.js'
      - 'docs/architecture/SUPABASE_WEEK_ONE_APP_PARITY.md'
      - '.github/workflows/verify-supabase-operational-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Supabase operational app
        run: node scripts/verify-supabase-operational-app.js
      - name: Verify Android Quote Builder stabilization
        run: |
          node --check commercial-app/quote-mobile-stabilization.js
          node scripts/verify-supabase-quote-mobile-stabilization.js
      - name: Verify authenticated Quote AI
        run: |
          node --check commercial-app/supabase-quote-ai.js
          node --check commercial-app/quote-ai-live-fix.js
          node scripts/verify-supabase-quote-ai.js
          curl --fail --silent --show-error --max-time 30 \
            https://jqukmwtsgcsaruucnqja.supabase.co/functions/v1/h38-quote-ai \
            --output /tmp/h38-quote-ai-health.json
          node -e "const h=JSON.parse(require('fs').readFileSync('/tmp/h38-quote-ai-health.json','utf8')); console.log(h); if(h.status!=='PASS'||h.providerConfigured!==true) throw new Error('The deployed Quote AI function is active, but OPENAI_API_KEY is not configured in Supabase Edge Function secrets.');"
      - name: Preserve Supabase Auth and active-business controls
        run: |
          node scripts/verify-supabase-business-office-auth.js
          node scripts/verify-supabase-business-office-auth-runtime.js