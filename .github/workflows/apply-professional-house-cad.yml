name: Apply Professional House CAD Rebuild

on:
  push:
    branches: [agent/professional-cad-rebuild]
    paths:
      - 'scripts/generate-professional-house-cad.js'
      - '.github/workflows/apply-professional-house-cad.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/professional-cad-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate professional CAD sheets and patch package
        run: node scripts/generate-professional-house-cad.js
      - name: Validate generated SVG files
        run: |
          test "$(find assets/quote-builder/whole-house-cad -maxdepth 1 -name '*.svg' | wc -l)" -eq 10
          grep -q 'A-201 — Exterior Elevations' whole-house-quote-package.html
          grep -q 'Open full-size SVG' whole-house-quote-package.html
      - name: Commit generated drawing package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add whole-house-quote-package.html assets/quote-builder/whole-house-cad
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Generate professional whole-house CAD drawing set'
            git push origin HEAD:agent/professional-cad-rebuild
          fi
