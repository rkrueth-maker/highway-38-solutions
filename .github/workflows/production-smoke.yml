name: Production Site Smoke Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'scripts/verify-issue83-source.sh'
      - 'scripts/verify-one-shot-ux.js'
      - 'scripts/verify-universal-quote-builder.js'
      - 'scripts/config/public-website-routes.json'
      - 'index.html'
      - 'sample-library-now.html'
      - 'universal-quote-builder.html'
      - 'quote-builder.html'
      - 'solutions.html'
      - 'pricing.html'
      - 'pricing-data.js'
      - 'start-request.html'
      - 'portal.html'
      - 'contact.html'
      - 'about.html'
      - 'assets/js/h38-site-v2.js'
      - 'assets/css/project-intelligence.css'
      - 'request-flow.js'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'scripts/verify-issue83-source.sh'
      - 'scripts/verify-one-shot-ux.js'
      - 'scripts/verify-universal-quote-builder.js'
      - 'scripts/config/public-website-routes.json'
      - 'index.html'
      - 'sample-library-now.html'
      - 'universal-quote-builder.html'
      - 'quote-builder.html'
      - 'solutions.html'
      - 'pricing.html'
      - 'pricing-data.js'
      - 'start-request.html'
      - 'portal.html'
      - 'contact.html'
      - 'about.html'
      - 'assets/js/h38-site-v2.js'
      - 'assets/css/project-intelligence.css'
      - 'request-flow.js'

permissions:
  contents: read

concurrency:
  group: production-site-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-source-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify proposed public source markers
        shell: bash
        run: |
          set +e
          bash scripts/verify-issue83-source.sh > /tmp/public-source-report.txt 2>&1
          status=$?
          cat /tmp/public-source-report.txt
          exit "$status"
      - name: Verify Universal Quote Builder source contract
        run: node scripts/verify-universal-quote-builder.js
      - name: Upload public source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-source-report-${{ github.run_id }}
          path: |
            /tmp/public-source-report.txt
            artifacts/universal-quote-builder/verification.json
          if-no-files-found: warn

  production-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify deployed GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          base='https://rkrueth-maker.github.io/highway-38-solutions'
          fetch_until_ready() {
            local path="$1"
            local pattern="$2"
            local out="$3"
            for attempt in $(seq 1 36); do
              if curl --fail --location --silent --show-error --max-time 30 "$base/$path?deployment=${GITHUB_SHA}" -o "$out" && grep -Fq "$pattern" "$out"; then
                return 0
              fi
              sleep 10
            done
            echo "Production check failed for $path; expected: $pattern" >&2
            return 1
          }

          fetch_until_ready '' 'Bring us the problem.' /tmp/home.html
          grep -Fq 'complete project plan.' /tmp/home.html
          grep -Fq 'See it. Scope it. Run it.' /tmp/home.html
          grep -Fq 'href="sample-library-now.html"' /tmp/home.html

          fetch_until_ready 'pricing.html' 'Three software products' /tmp/pricing.html
          grep -Fq '$59' /tmp/pricing.html
          grep -Fq '$249' /tmp/pricing.html
          grep -Fq 'Starting at $499' /tmp/pricing.html
          grep -Fq '$299 one-time' /tmp/pricing.html

          fetch_until_ready 'quote-builder.html' 'Simple when the quote is simple.' /tmp/quote-builder.html
          grep -Fq 'universal-quote-builder.html' /tmp/quote-builder.html

          fetch_until_ready 'universal-quote-builder.html' 'One project inside Office.' /tmp/universal.html
          grep -Fq 'Office-generated public demonstration' /tmp/universal.html
          grep -Fq '14</strong>complete phase quotes' /tmp/universal.html
          grep -Fq '10</strong>attached CAD sheets' /tmp/universal.html
          grep -Fq '?publicUqbDemo=1' /tmp/universal.html
          ! grep -Fq 'Whole-House Renovation and Property Improvement' /tmp/universal.html
          ! grep -Fq '$342,815' /tmp/universal.html

          fetch_until_ready 'sample-library-now.html' 'Complete project demonstrations' /tmp/samples.html
          grep -Fq 'Open-ended example library' /tmp/samples.html
          grep -Fq 'universal-quote-builder.html' /tmp/samples.html
          grep -Fq 'data-owner-link="true"' /tmp/samples.html

          fetch_until_ready 'solutions.html' 'Five connected capabilities' /tmp/solutions.html
          fetch_until_ready 'start-request.html' 'What result do you need?' /tmp/request.html
          grep -Fq 'data-request-step="1"' /tmp/request.html
          grep -Fq 'data-request-step="3"' /tmp/request.html
          fetch_until_ready 'portal.html' 'Opening Highway 38 Business Office' /tmp/portal.html

          if grep -Eqi 'Eight complete|Explore the Eight|current eight-project' /tmp/samples.html; then
            echo 'Fixed eight-example language found on deployed examples page.' >&2
            exit 1
          fi
          if grep -Fq '25,000+ CNC programs' /tmp/home.html /tmp/samples.html /tmp/solutions.html; then
            echo 'Prohibited 25,000+ CNC programs claim found on deployed public pages.' >&2
            exit 1
          fi

          echo 'Production GitHub Pages smoke check passed for current Office-generated project-first architecture.'
