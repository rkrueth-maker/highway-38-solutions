name: Verify client tenant installer

on:
  pull_request:
    paths:
      - 'commercial-app/**'
      - 'businesses/northern-lakes/**'
      - 'business-packs/northern-lakes/**'
      - 'supabase/migrations/20260805063*.sql'
      - 'supabase/functions/business-office-invite-activation/**'
      - 'scripts/verify-client-tenant-installer.js'
      - 'scripts/verify-northern-lakes-commercial-package.js'
      - '.github/workflows/verify-client-tenant-installer.yml'
  push:
    branches: [main]
    paths:
      - 'commercial-app/**'
      - 'businesses/northern-lakes/**'
      - 'business-packs/northern-lakes/**'
      - 'supabase/migrations/20260805063*.sql'
      - 'supabase/functions/business-office-invite-activation/**'
      - 'scripts/verify-client-tenant-installer.js'
      - 'scripts/verify-northern-lakes-commercial-package.js'
      - '.github/workflows/verify-client-tenant-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tenant installer and Northern Lakes closed beta
        run: node scripts/verify-client-tenant-installer.js
      - name: Verify Northern Lakes Supabase launch and Google rollback boundary
        run: node scripts/verify-northern-lakes-commercial-package.js
      - name: Preserve Supabase operational and Auth controls
        run: |
          node scripts/verify-supabase-operational-app.js
          node scripts/verify-supabase-business-office-auth.js
          node scripts/verify-supabase-business-office-auth-runtime.js
