name: Trigger Northern Lakes Commercial Office Deployment

on:
  push:
    branches: [main]
    paths:
      - 'businesses/northern-lakes/deploy-request.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: trigger-northern-lakes-commercial-office
  cancel-in-progress: false

jobs:
  authorize-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate request and decide whether to dispatch
        id: request
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const request=JSON.parse(fs.readFileSync('businesses/northern-lakes/deploy-request.json','utf8'));
          const exact={
            phrase:'UPDATE EXISTING NLPM OFFICE',
            scriptId:'1_RbfPyqgg-VWNHVLWQLKh7PFBNs1XnBSYRZ969raabhen7LuWgQjAnlX',
            deploymentId:'AKfycbzQVvg-1E0ofK5QuBseKjTdJ5NhEjtArvbHxVCO_W329BbZxfSO0F6ENJd5zgvMLGaL',
            projectId:'jqukmwtsgcsaruucnqja',
            functionName:'nlpm-office-gateway',
            packageVersion:'nlpm-commercial-office-trial-v1'
          };
          if(!request.active){fs.appendFileSync(process.env.GITHUB_OUTPUT,'dispatch=false\n');console.log('PASS — deployment request is inactive.');process.exit(0);}
          const valid=request.requestVersion>0&&
            request.authorizationPhrase===exact.phrase&&
            request.confirmNoDataMigration===true&&
            request.scriptId===exact.scriptId&&
            request.deploymentId===exact.deploymentId&&
            request.supabaseProjectId===exact.projectId&&
            request.gatewayFunction===exact.functionName&&
            request.packageVersion===exact.packageVersion&&
            request.createAppsScriptProjectAllowed===false&&
            request.createAppsScriptDeploymentAllowed===false&&
            request.productionDataMigrationAllowed===false&&
            request.externalActionsEnabled===false;
          if(!valid)throw new Error('Northern Lakes deployment request failed the exact protected-target contract.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'dispatch=true\n');
          console.log(`PASS — authorized request ${request.requestVersion} may dispatch the protected deployment.`);
          NODE
      - name: Dispatch protected in-place deployment
        if: steps.request.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-northern-lakes-commercial-office.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f authorization_phrase='UPDATE EXISTING NLPM OFFICE' \
            -f confirm_no_data_migration=true
