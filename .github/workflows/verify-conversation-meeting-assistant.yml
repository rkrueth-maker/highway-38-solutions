name: Verify Conversation Meeting Assistant

on:
  pull_request:
    paths:
      - 'commercial-app/conversation-meeting-assistant.js'
      - 'commercial-app/conversation-meeting-assistant.css'
      - 'commercial-app/index.html'
      - 'commercial-app/service-worker.js'
      - 'commercial-app/quote-agent-contract.js'
      - 'supabase/functions/h38-conversation-transcription/**'
      - 'supabase/functions/h38-conversation-organize/**'
      - 'tests/test_conversation_meeting_assistant_20260824.py'
      - 'scripts/verify-conversation-meeting-assistant.js'
      - '.github/workflows/verify-conversation-meeting-assistant.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Static conversation contract
        run: node scripts/verify-conversation-meeting-assistant.js
      - name: Python acceptance contracts
        run: python -m pytest -q tests/test_conversation_meeting_assistant_20260824.py
      - name: Existing Android microphone authority
        run: node scripts/verify-android-native-walkthrough-audio.js
