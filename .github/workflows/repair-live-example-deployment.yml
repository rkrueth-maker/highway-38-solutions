name: One-time repair live example deployment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-live-example-deployment.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align image policy and Pages checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')

          manifest_path = root / 'scripts/config/approved-public-image-placements.json'
          manifest = json.loads(manifest_path.read_text())
          manifest['policyVersion'] = '2026-07-24-flower-irrigation-repair-v2'

          changes = manifest.setdefault('placementChanges', [])
          if not any(item.get('reason') == 'Owner-directed live review repair for same-property continuity and duplicate irrigation labels' for item in changes):
              changes.append({
                  'date': '2026-07-24',
                  'page': 'sample-library-now.html and flower-garden-quote-complete.html',
                  'section': 'Flower garden finished concept, irrigation before/after cards, and matched quote scope',
                  'oldPlacement': 'Different-house flower after image, irrigation images with embedded labels, and a flower quote that excluded visible stone edging',
                  'newPlacement': 'Same-house flower concept, cropped label-free irrigation card wrappers, and a $3,950 quote including the visible natural-stone edging and closeout work',
                  'reason': 'Owner-directed live review repair for same-property continuity and duplicate irrigation labels',
                  'binaryPolicy': 'The flower concept reuses the approved existing-house image as its base. Irrigation wrappers crop the existing local WebP files without replacing the underlying scenes. Original files remain for rollback.'
              })

          placements = manifest['pages']['sample-library-now.html']
          updates = {
              'example-01-after': ('assets/contractor-demo/flower-after-same-house.svg', 'Flower garden after at the same house'),
              'example-06-before': ('assets/demo-workthroughs/irrigation-before-clean.svg', 'Irrigation before'),
              'example-06-after': ('assets/demo-workthroughs/irrigation-after-clean.svg', 'Irrigation after'),
          }
          found = set()
          for item in placements:
              role = item.get('role')
              if role in updates:
                  item['src'], item['alt'] = updates[role]
                  found.add(role)
          if found != set(updates):
              raise SystemExit(f'Missing placement roles: {set(updates) - found}')
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          verifier_path = root / 'scripts/verify-public-image-placements.js'
          verifier = verifier_path.read_text()
          old_decl = "const directFiles=['deck-existing-condition.webp','deck-finished-concept.webp','irrigation-before.webp','irrigation-after.webp','kitchen-existing-condition.webp','kitchen-remodel-concept.webp'];"
          new_decl = "const cardDirectFiles=['deck-existing-condition.webp','deck-finished-concept.webp','irrigation-before-clean.svg','irrigation-after-clean.svg','kitchen-existing-condition.webp','kitchen-remodel-concept.webp'];\nconst contractorDirectFiles=['deck-existing-condition.webp','deck-finished-concept.webp','irrigation-before.webp','irrigation-after.webp','kitchen-existing-condition.webp','kitchen-remodel-concept.webp'];\nconst allDirectFiles=[...new Set([...cardDirectFiles,...contractorDirectFiles])];"
          if old_decl not in verifier:
              raise SystemExit('Verifier direct-files declaration not found')
          verifier = verifier.replace(old_decl, new_decl)
          old_checks = "check('six direct approved project images exist',directFiles.every(file=>fs.existsSync(path.join(root,'assets/demo-workthroughs',file))),directFiles.join(', '));\ncheck('sample cards reference all six direct files',directFiles.every(file=>samplePage.includes(`assets/demo-workthroughs/${file}`)),directFiles.join(', '));\ncheck('contractor example data references all six direct files',directFiles.every(file=>contractorPage.includes(file)),directFiles.join(', '));"
          new_checks = "check('approved project card and quote images exist',allDirectFiles.every(file=>fs.existsSync(path.join(root,'assets/demo-workthroughs',file))),allDirectFiles.join(', '));\ncheck('sample cards reference all six approved card files',cardDirectFiles.every(file=>samplePage.includes(`assets/demo-workthroughs/${file}`)),cardDirectFiles.join(', '));\ncheck('contractor example data references all six approved quote files',contractorDirectFiles.every(file=>contractorPage.includes(file)),contractorDirectFiles.join(', '));"
          if old_checks not in verifier:
              raise SystemExit('Verifier direct-files checks not found')
          verifier_path.write_text(verifier.replace(old_checks, new_checks))

          pages_path = root / '.github/workflows/pages.yml'
          pages = pages_path.read_text()
          replacements = {
              'deck-existing-condition.webp deck-finished-concept.webp irrigation-before.webp irrigation-after.webp kitchen-existing-condition.webp kitchen-remodel-concept.webp': 'deck-existing-condition.webp deck-finished-concept.webp irrigation-before-clean.svg irrigation-after-clean.svg kitchen-existing-condition.webp kitchen-remodel-concept.webp',
              "&& grep -Fq 'assets/demo-workthroughs/irrigation-after.webp' <<<\"$examples\" \": "&& grep -Fq 'assets/demo-workthroughs/irrigation-before-clean.svg' <<<\"$examples\" \\\n              && grep -Fq 'assets/demo-workthroughs/irrigation-after-clean.svg' <<<\"$examples\" \",
          }
          for old, new in replacements.items():
              if old not in pages:
                  raise SystemExit(f'Pages check text not found: {old}')
              pages = pages.replace(old, new)

          stage_anchor = "          grep -Fq 'assets/highway38-logo.png?v=20260720-exact-0cbc4514' _site/sample-library-now.html\n"
          stage_add = stage_anchor + "          grep -Fq 'assets/contractor-demo/flower-after-same-house.svg' _site/sample-library-now.html\n          grep -Fq '$3,950' _site/sample-library-now.html\n          test -f _site/assets/contractor-demo/flower-after-same-house.svg\n          test -f _site/flower-garden-quote-complete.html\n          grep -Fq '$3,950.00' _site/flower-garden-quote-complete.html\n"
          if stage_anchor not in pages:
              raise SystemExit('Pages stage anchor not found')
          pages = pages.replace(stage_anchor, stage_add, 1)

          curl_anchor = "            tools=\"$(curl -fsSL --connect-timeout 15 \"${LIVE_ROOT}/free-tools.html?flush=${marker}-${attempt}\" || true)\"\n"
          curl_add = curl_anchor + "            flower_quote=\"$(curl -fsSL --connect-timeout 15 \"${LIVE_ROOT}/flower-garden-quote-complete.html?flush=${marker}-${attempt}\" || true)\"\n"
          if curl_anchor not in pages:
              raise SystemExit('Pages live curl anchor not found')
          pages = pages.replace(curl_anchor, curl_add, 1)

          live_anchor = "              && grep -Fq 'assets/highway38-logo.png?v=20260720-exact-0cbc4514' <<<\"$examples\" \\\n"
          live_add = live_anchor + "              && grep -Fq 'assets/contractor-demo/flower-after-same-house.svg' <<<\"$examples\" \\\n              && grep -Fq '$3,950' <<<\"$examples\" \\\n              && grep -Fq '$3,950.00' <<<\"$flower_quote\" \\\n"
          if live_anchor not in pages:
              raise SystemExit('Pages live verification anchor not found')
          pages_path.write_text(pages.replace(live_anchor, live_add, 1))
          PY

          rm -f .github/workflows/repair-live-example-deployment.yml

      - name: Commit repaired deployment controls
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/config/approved-public-image-placements.json scripts/verify-public-image-placements.js .github/workflows/pages.yml .github/workflows/repair-live-example-deployment.yml
          git commit -m 'Repair Pages guards for matched flower and clean irrigation visuals'
          git push origin HEAD:main

      - name: Dispatch verified Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

# trigger existing workflow on default branch
