name: Build H38 ARCore Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/h38-site-scanner/android-app/**'
      - '.github/workflows/android-arcore-apk.yml'
  push:
    branches: [main]
    paths:
      - 'native/h38-site-scanner/android-app/**'
      - '.github/workflows/android-arcore-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify and name APK
        run: |
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/H38-Site-Scanner-ARCore-Test.apk"
          sha256sum "$GITHUB_WORKSPACE/H38-Site-Scanner-ARCore-Test.apk" | tee "$GITHUB_WORKSPACE/H38-Site-Scanner-ARCore-Test.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: h38-site-scanner-arcore-test-apk
          path: |
            H38-Site-Scanner-ARCore-Test.apk
            H38-Site-Scanner-ARCore-Test.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish owner test release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          TAG='h38-site-scanner-android-v0.2.0'
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" H38-Site-Scanner-ARCore-Test.apk H38-Site-Scanner-ARCore-Test.sha256 --title 'H38 Site Scanner Android ARCore Test v0.2.0' --notes 'Owner test build with feet-and-inches display, guided measuring, and corrected Android screen insets. Native values remain DEVICE_CAPTURED and require field verification.'
