name: Build H38 ARCore Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/h38-site-scanner/android-app/**'
      - '.github/workflows/android-arcore-apk.yml'
  push:
    branches: [main]
    paths:
      - 'native/h38-site-scanner/android-app/**'
      - '.github/workflows/android-arcore-apk.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: h38-android-owner-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Resolve Android release version
        run: |
          set -euo pipefail
          version_name="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" app/build.gradle | head -1)"
          version_code="$(sed -n "s/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p" app/build.gradle | head -1)"
          test -n "$version_name"
          test -n "$version_code"
          echo "H38_ANDROID_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "H38_ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "H38_ANDROID_APK_NAME=H38-Site-Scanner-Field-Offline-v${version_name}.apk" >> "$GITHUB_ENV"
          echo "H38_ANDROID_SHA_NAME=H38-Site-Scanner-Field-Offline-v${version_name}.sha256" >> "$GITHUB_ENV"
          echo "H38_ANDROID_ARTIFACT_NAME=h38-site-scanner-field-offline-v${version_name}" >> "$GITHUB_ENV"
          echo "H38_ANDROID_RELEASE_TAG=h38-site-scanner-android-v${version_name}" >> "$GITHUB_ENV"
      - name: Configure stable owner signing key when available
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.H38_ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.H38_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" ]]; then
            KEYSTORE_PATH="$RUNNER_TEMP/h38-owner-keystore.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            {
              echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "H38_ANDROID_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "H38_ANDROID_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            if [[ "${{ github.event_name }}" != "pull_request" ]]; then
              echo 'Stable Android signing secrets are not configured; refusing to publish an owner APK with an ephemeral debug certificate.' >&2
              echo 'Required: H38_ANDROID_UPLOAD_KEYSTORE_B64, H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD, H38_ANDROID_UPLOAD_KEY_ALIAS, H38_ANDROID_UPLOAD_KEY_PASSWORD.' >&2
              exit 1
            fi
            echo 'Pull-request validation will build a debug APK only; it is not an owner release artifact.'
          fi
      - name: Compile APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.signed }}" == 'true' ]]; then
            gradle --no-daemon --stacktrace :app:assembleOwner
          else
            gradle --no-daemon --stacktrace :app:assembleDebug
          fi
      - name: Verify APK and create credential association
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.signing.outputs.signed }}" == 'true' ]]; then
            APK='app/build/outputs/apk/owner/app-owner.apk'
          else
            APK='app/build/outputs/apk/debug/app-debug.apk'
          fi
          CERTS="$GITHUB_WORKSPACE/H38-Site-Scanner-ARCore-Test.certs.txt"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$CERTS"
          digest="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$CERTS" | head -1)"
          test -n "$digest"
          fingerprint="$(printf '%s' "$digest" | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')"
          mkdir -p "$GITHUB_WORKSPACE/.well-known"
          cat > "$GITHUB_WORKSPACE/.well-known/assetlinks.json" <<JSON
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls","delegate_permission/common.get_login_creds"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.highway38.sitescanner.test",
                "sha256_cert_fingerprints": ["$fingerprint"]
              }
            }
          ]
          JSON
          cp "$APK" "$GITHUB_WORKSPACE/$H38_ANDROID_APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/$H38_ANDROID_APK_NAME" | tee "$GITHUB_WORKSPACE/$H38_ANDROID_SHA_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.H38_ANDROID_ARTIFACT_NAME }}
          path: |
            ${{ env.H38_ANDROID_APK_NAME }}
            ${{ env.H38_ANDROID_SHA_NAME }}
            H38-Site-Scanner-ARCore-Test.certs.txt
            .well-known/assetlinks.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish owner test release and credential association
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.signing.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$remote_sha" != "$GITHUB_SHA" ]; then
            printf 'Refusing stale Android release: main moved from %s to %s.\n' "$GITHUB_SHA" "$remote_sha" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .well-known/assetlinks.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Android credential association for v${H38_ANDROID_VERSION_NAME} [skip android]"
            git push origin HEAD:main
          fi
          gh release view "$H38_ANDROID_RELEASE_TAG" >/dev/null 2>&1 && gh release delete "$H38_ANDROID_RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$H38_ANDROID_RELEASE_TAG" "$H38_ANDROID_APK_NAME" "$H38_ANDROID_SHA_NAME" H38-Site-Scanner-ARCore-Test.certs.txt .well-known/assetlinks.json --title "H38 Field Office and Site Scanner v${H38_ANDROID_VERSION_NAME}" --notes "Owner-test build with Android-keystore-protected saved H38 login after first manual sign-in. The app still requires the owner to tap Sign in and preserves all existing approval and financial controls."
          gh workflow run pages-branch-fallback.yml --ref main
