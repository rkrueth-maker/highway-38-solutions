name: Build H38 ARCore Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native/h38-site-scanner/android-app/**'
      - '.github/workflows/android-arcore-apk.yml'
  push:
    branches: [main]
    paths:
      - 'native/h38-site-scanner/android-app/**'
      - '.github/workflows/android-arcore-apk.yml'

permissions:
  contents: write
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK and create credential association
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/debug/app-debug.apk'
          CERTS="$GITHUB_WORKSPACE/H38-Site-Scanner-ARCore-Test.certs.txt"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$CERTS"
          digest="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$CERTS" | head -1)"
          test -n "$digest"
          fingerprint="$(printf '%s' "$digest" | sed 's/../&:/g;s/:$//' | tr '[:lower:]' '[:upper:]')"
          mkdir -p "$GITHUB_WORKSPACE/.well-known"
          cat > "$GITHUB_WORKSPACE/.well-known/assetlinks.json" <<JSON
          [
            {
              "relation": [
                "delegate_permission/common.handle_all_urls",
                "delegate_permission/common.get_login_creds"
              ],
              "target": {
                "namespace": "android_app",
                "package_name": "com.highway38.sitescanner.test",
                "sha256_cert_fingerprints": ["$fingerprint"]
              }
            }
          ]
          JSON
          cp "$APK" "$GITHUB_WORKSPACE/H38-Site-Scanner-Field-Offline-v0.4.0.apk"
          sha256sum "$GITHUB_WORKSPACE/H38-Site-Scanner-Field-Offline-v0.4.0.apk" | tee "$GITHUB_WORKSPACE/H38-Site-Scanner-Field-Offline-v0.4.0.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: h38-site-scanner-field-offline-v0.4.0
          path: |
            H38-Site-Scanner-Field-Offline-v0.4.0.apk
            H38-Site-Scanner-Field-Offline-v0.4.0.sha256
            H38-Site-Scanner-ARCore-Test.certs.txt
            .well-known/assetlinks.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish owner test release and credential association
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$remote_sha" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .well-known/assetlinks.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Android credential association for v0.4.0 [skip android]'
            git push origin HEAD:main
          fi
          TAG='h38-site-scanner-android-v0.4.0'
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" H38-Site-Scanner-Field-Offline-v0.4.0.apk H38-Site-Scanner-Field-Offline-v0.4.0.sha256 H38-Site-Scanner-ARCore-Test.certs.txt .well-known/assetlinks.json --title 'H38 Field Office and Site Scanner v0.4.0' --notes 'Owner test build with the approved Highway 38 launcher logo compiled into the Android APK, focused five-step field visits, offline-first entry and sync, Android credential autofill support, and ARCore feet-and-inches measuring. Nothing is automatically approved or sent.'
          gh workflow run pages.yml --ref main
