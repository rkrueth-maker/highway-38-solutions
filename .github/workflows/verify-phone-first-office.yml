name: Verify Phone First Office
on:
  pull_request:
    paths:
      - 'commercial-app/phone-first-office.js'
      - 'commercial-app/runtime-rowid-fix.js'
      - 'commercial-app/install-office.js'
      - 'commercial-app/manifest.webmanifest'
      - 'scripts/verify-phone-first-office-browser.js'
      - 'scripts/verify-install-office-browser.js'
      - '.github/workflows/verify-phone-first-office.yml'
  push:
    branches: [main]
    paths:
      - 'commercial-app/phone-first-office.js'
      - 'commercial-app/runtime-rowid-fix.js'
      - 'commercial-app/install-office.js'
      - 'commercial-app/manifest.webmanifest'
      - 'scripts/verify-phone-first-office-browser.js'
      - 'scripts/verify-install-office-browser.js'
      - '.github/workflows/verify-phone-first-office.yml'
permissions:
  contents: read
jobs:
  phone-first-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Syntax
        run: node --check commercial-app/phone-first-office.js && node --check commercial-app/runtime-rowid-fix.js && node --check commercial-app/install-office.js && node --check scripts/verify-phone-first-office-browser.js && node --check scripts/verify-install-office-browser.js
      - name: Phone-first Business Office acceptance
        run: node scripts/verify-phone-first-office-browser.js
      - name: Installable H38 Office acceptance
        run: node scripts/verify-install-office-browser.js
      - name: Existing owner mobile smoke
        run: node scripts/verify-owner-mobile-smoke.js
