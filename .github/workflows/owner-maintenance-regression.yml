# Production-writing acceptance. This workflow seeds/repairs historical quote evidence.
# It is intentionally manual-only so ordinary merges can never mutate production quote data.
name: Owner Maintenance Quote Regression

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: h38-owner-maintenance-regression-manual
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      H38_RUN_VISUALS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Announce owner regression run
        run: |
          gh issue comment 168 --repo "$GITHUB_REPOSITORY" --body "RUNNING — MANUAL CANONICAL QUOTE + OPTIONAL VISUAL ACCEPTANCE (GitHub OIDC). Ref: ${GITHUB_REF_NAME}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Request signed GitHub maintenance identity
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_FILE="$RUNNER_TEMP/h38-maintenance-oidc-token"
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=h38-owner-maintenance")
          TOKEN=$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);if(!p.value)process.exit(2);process.stdout.write(p.value)})")
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"
          printf 'H38_GITHUB_OIDC_TOKEN_FILE=%s\n' "$TOKEN_FILE" >> "$GITHUB_ENV"
      - name: Seed evidence and run canonical + optional visual acceptance
        run: node scripts/run-owner-maintenance-regression.js /dev/null "$GITHUB_WORKSPACE/artifacts/owner-maintenance-regression.json"
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-maintenance-regression-${{ github.run_id }}
          path: artifacts/owner-maintenance-regression.json
          if-no-files-found: warn
          retention-days: 90
      - name: Report regression result
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/owner-maintenance-regression.json ]]; then
            SUMMARY=$(node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/owner-maintenance-regression.json','utf8'));
          const failed=(r.results||[]).filter(x=>x.quoteReady!==true).map(x=>`${x.title} [${x.quoteId}] — build=${x.quoteAgent?.classification||'FAIL'}, lines=${x.quoteAgent?.baselineComparison?.pass?'match':'drift'}, options=${x.options?.baseComparison?.pass?'match':'drift'}, fixture=${x.safety?.quoteFixtureUnchanged?'unchanged':'changed'}`).join('\n');
          const visualFailed=(r.visualResults||[]).filter(x=>x.status!=='CLEAN').map(x=>`${x.title} [${x.quoteId}] — ${x.mode||'unknown'} / ${x.renderStatus||'FAIL'}${x.message?` — ${x.message}`:''} — quote remains runnable`).join('\n');
          const seed=r.seed||{};
          process.stdout.write(`MANUAL CANONICAL QUOTE + OPTIONAL VISUAL ACCEPTANCE\nRun: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}\nAuth: ${r.authMode||'unknown'}\nSeeded documents: ${seed.documentsSeeded||0}\nSeeded Action Pictures: ${seed.actionPicturesSeeded||0}\nUnique assets: ${seed.uniqueAssets||0}\nQuotes tested: ${(r.results||[]).length}\nQuote-ready: ${r.clean||0}\nQuote failures: ${r.fail||0}\nVisuals tested: ${(r.visualResults||[]).length}\nVisual clean: ${r.visualClean||0}\nVisual warnings: ${r.visualFail||0}\n${failed?`Quote failures:\n${failed}\n`:''}${visualFailed?`Optional visual warnings:\n${visualFailed}`:''}${!failed&&!visualFailed?'All quote and optional visual checks clean.':''}`);
          NODE
            )
            gh issue comment 168 --repo "$GITHUB_REPOSITORY" --body "$SUMMARY"
          else
            gh issue comment 168 --repo "$GITHUB_REPOSITORY" --body "Manual quote acceptance failed before producing its report. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
