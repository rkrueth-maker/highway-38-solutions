# Production republish after 31/31 canonical + 31/31 visual acceptance.
name: Owner Maintenance Quote Regression

on:
  push:
    branches:
      - main
      - agent/quote-agent-walkthrough-acceptance-polish-20260823
    paths:
      - 'scripts/run-owner-maintenance-regression.js'
      - 'scripts/verify-customer-readiness-polish-browser.js'
      - '.github/workflows/owner-maintenance-regression.yml'
      - 'supabase/functions/h38-quote-agent/**'
      - 'supabase/functions/h38-owner-maintenance/**'
      - 'supabase/functions/h38-owner-maintenance-oidc/**'
      - 'commercial-app/index.html'
      - 'commercial-app/quote-agent-contract.js'
      - 'commercial-app/site-visit-quote-wide-pass-loader.js'
      - 'commercial-app/customer-readiness-polish.js'
      - 'commercial-app/customer-readiness-polish.css'
      - 'commercial-app/service-worker.js'
      - 'tests/test_quote_agent_walkthrough_acceptance_20260824.py'
  pull_request:
    paths:
      - 'scripts/run-owner-maintenance-regression.js'
      - 'scripts/verify-customer-readiness-polish-browser.js'
      - '.github/workflows/owner-maintenance-regression.yml'
      - 'supabase/functions/h38-quote-agent/**'
      - 'supabase/functions/h38-owner-maintenance/**'
      - 'supabase/functions/h38-owner-maintenance-oidc/**'
      - 'commercial-app/index.html'
      - 'commercial-app/quote-agent-contract.js'
      - 'commercial-app/site-visit-quote-wide-pass-loader.js'
      - 'commercial-app/customer-readiness-polish.js'
      - 'commercial-app/customer-readiness-polish.css'
      - 'commercial-app/service-worker.js'
      - 'tests/test_quote_agent_walkthrough_acceptance_20260824.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: h38-owner-maintenance-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.head_ref == 'agent/quote-agent-walkthrough-acceptance-polish-20260823' || github.head_ref == 'agent/conversation-meeting-assistant-20260824'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      H38_RUN_VISUALS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Announce owner regression run
        run: |
          gh issue comment 168 --repo "$GITHUB_REPOSITORY" --body "RUNNING — CANONICAL QUOTE AGENT + VISUAL ACCEPTANCE (GitHub OIDC). Ref: ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Request signed GitHub maintenance identity
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_FILE="$RUNNER_TEMP/h38-maintenance-oidc-token"
          RESPONSE=$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=h38-owner-maintenance")
          TOKEN=$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const p=JSON.parse(s);if(!p.value)process.exit(2);process.stdout.write(p.value)})")
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"
          printf 'H38_GITHUB_OIDC_TOKEN_FILE=%s\n' "$TOKEN_FILE" >> "$GITHUB_ENV"
      - name: Seed evidence and run canonical + visual acceptance
        run: node scripts/run-owner-maintenance-regression.js /dev/null "$GITHUB_WORKSPACE/artifacts/owner-maintenance-regression.json"
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-maintenance-regression-${{ github.run_id }}
          path: artifacts/owner-maintenance-regression.json
          if-no-files-found: warn
          retention-days: 90
      - name: Report regression result
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/owner-maintenance-regression.json ]]; then
            SUMMARY=$(node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('artifacts/owner-maintenance-regression.json','utf8'));
          const failed=(r.results||[]).filter(x=>x.status!=='CLEAN').map(x=>`${x.title} [${x.quoteId}] — build=${x.quoteAgent?.classification||'FAIL'}, lines=${x.quoteAgent?.baselineComparison?.pass?'match':'drift'}, options=${x.options?.baseComparison?.pass?'match':'drift'}, visual=${x.visual?.structurePass?'ready':'fail'}, fixture=${x.safety?.quoteFixtureUnchanged?'unchanged':'changed'}`).join('\n');
          const visualFailed=(r.visualResults||[]).filter(x=>x.status!=='CLEAN').map(x=>`${x.title} [${x.quoteId}] — ${x.mode||'unknown'} / ${x.renderStatus||'FAIL'}${x.message?` — ${x.message}`:''}`).join('\n');
          const seed=r.seed||{};
          process.stdout.write(`CANONICAL QUOTE AGENT + VISUAL ACCEPTANCE\nRun: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}\nAuth: ${r.authMode||'unknown'}\nSeeded documents: ${seed.documentsSeeded||0}\nSeeded Action Pictures: ${seed.actionPicturesSeeded||0}\nUnique assets: ${seed.uniqueAssets||0}\nCanonical quotes tested: ${(r.results||[]).length}\nCanonical clean: ${r.clean||0}\nCanonical fail: ${r.fail||0}\nVisuals tested: ${(r.visualResults||[]).length}\nVisual clean: ${r.visualClean||0}\nVisual fail: ${r.visualFail||0}\n${failed?`Canonical failures:\n${failed}\n`:''}${visualFailed?`Visual failures:\n${visualFailed}`:''}${!failed&&!visualFailed?'All canonical quote and visual checks clean.':''}`);
          NODE
            )
            gh issue comment 168 --repo "$GITHUB_REPOSITORY" --body "$SUMMARY"
          else
            gh issue comment 168 --repo "$GITHUB_REPOSITORY" --body "CANONICAL QUOTE AGENT acceptance failed before producing its report. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi