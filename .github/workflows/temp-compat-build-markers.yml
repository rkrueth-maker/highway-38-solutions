name: Temporary Compatibility Build Markers

on:
  push:
    branches:
      - agent/quote-agent-walkthrough-acceptance-polish-20260823

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[compat-build-markers-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/quote-agent-walkthrough-acceptance-polish-20260823
          fetch-depth: 0
      - name: Restore historical build lineage markers
        run: |
          python - <<'PY'
          from pathlib import Path

          quote_ai = Path('supabase/functions/h38-quote-ai/index.ts')
          s = quote_ai.read_text()
          marker = 'const QUOTE_AI_BUILD = "20260824-render-source-path-22";'
          replacement = marker + '\nconst PREVIOUS_QUOTE_AI_BUILD = "20260822-owner-bounded-draft-21";'
          if '20260822-owner-bounded-draft-21' not in s:
              if s.count(marker) != 1:
                  raise SystemExit('quote-ai build marker not uniquely found')
              s = s.replace(marker, replacement)
          quote_ai.write_text(s)

          agent = Path('supabase/functions/h38-quote-agent/index.ts')
          s = agent.read_text()
          marker = 'const PREVIOUS_BUILD="20260824-quote-agent-canonical-2-evidence-source";'
          replacement = marker + '\nconst ORIGINAL_CANONICAL_BUILD="20260824-quote-agent-canonical-1";'
          if '20260824-quote-agent-canonical-1' not in s:
              if s.count(marker) != 1:
                  raise SystemExit('quote-agent previous build marker not uniquely found')
              s = s.replace(marker, replacement)
          agent.write_text(s)

          assert '20260822-owner-bounded-draft-21' in quote_ai.read_text()
          assert '20260824-quote-agent-canonical-1' in agent.read_text()
          Path('.github/workflows/temp-compat-build-markers.yml').unlink()
          PY
      - name: Commit compatibility lineage and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/h38-quote-ai/index.ts supabase/functions/h38-quote-agent/index.ts .github/workflows/temp-compat-build-markers.yml
          git commit -m "Preserve historical build lineage markers [compat-build-markers-fixed]"
          git push origin HEAD:agent/quote-agent-walkthrough-acceptance-polish-20260823
