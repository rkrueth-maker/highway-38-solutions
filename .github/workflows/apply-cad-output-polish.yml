name: Apply CAD Output Polish
on:
  push:
    branches: [agent/professional-cad-rebuild]
    paths:
      - 'scripts/polish-enhanced-cad-output.js'
      - '.github/workflows/apply-cad-output-polish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/professional-cad-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/polish-enhanced-cad-output.js
      - run: |
          grep -q 'COVERED FRONT PORCH' assets/quote-builder/whole-house-cad/A-201.svg
          grep -q 'SECOND-FLOOR ASSEMBLY' assets/quote-builder/whole-house-cad/A-301.svg
          grep -q 'Kitchen Plan &amp; Elevations' assets/quote-builder/whole-house-cad/A-401.svg
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/quote-builder/whole-house-cad/A-101.svg assets/quote-builder/whole-house-cad/A-201.svg assets/quote-builder/whole-house-cad/A-301.svg assets/quote-builder/whole-house-cad/A-401.svg
          if git diff --cached --quiet; then
            echo 'No polish changes.'
          else
            git commit -m 'Polish enhanced CAD sheet layout'
            git push origin HEAD:agent/professional-cad-rebuild
          fi
