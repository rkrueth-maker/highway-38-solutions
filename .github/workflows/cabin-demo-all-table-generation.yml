name: Cabin Demo 08 All-Table Generation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cabin-demo-all-table-generation.yml'
      - 'scripts/generate-cabin-demo-authorized.sh'
      - 'scripts/verify-final-pricing-and-cabin.js'
      - 'apps-script/business-office/BusinessOffice_CabinDemoSeeder.gs'
      - 'apps-script/business-office/BusinessOffice_CabinAutoSeed.gs'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: highway-38-cabin-demo08-all-table-generation
  cancel-in-progress: false

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      H38_BO_SPREADSHEET_ID: 1kDDKWx9jfObWm8EmaXm5weDCTJbQ8RTf7-sq4RDEYlA
      H38_BO_ROOT_FOLDER_ID: 1kDgnuxRLaJTZoO01O1U1bbeDNNAgdaI6
      H38_BO_DOCUMENT_FOLDER_ID: 1Vq8UjAzxW4hIKYoodkf1hfqkATWiXjVC
      H38_BO_PDF_FOLDER_ID: 11ak4QZ7ag8daYO1_uO6NTCVXIO7Kh6j3
      H38_BO_EXPORT_FOLDER_ID: 1Jn2vW5gwJcaNX0BH1em-v0M9Q3-SwiJQ
      H38_BO_BACKUP_FOLDER_ID: 1rjl_m8u1YlaXSo29m46apa9dQD1zeucs
      H38_BO_OWNER_EMAIL: rkrueth@gmail.com
      H38_BO_BUSINESS_ID: H38
      H38_BACKEND_SPREADSHEET_ID: 1P5_7iUVf-yY9ffUEM7Iy5v10VsjE2LZdX7vNMcoQ1Uo
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
      CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
      CLASP_CREDENTIALS_B64: ${{ secrets.CLASP_CREDENTIALS_B64 }}
      GOOGLE_CLASPRC_JSON: ${{ secrets.GOOGLE_CLASPRC_JSON }}
      GOOGLE_CLASPRC_JSON_B64: ${{ secrets.GOOGLE_CLASPRC_JSON_B64 }}
      CLASP_AUTH_JSON: ${{ secrets.CLASP_AUTH_JSON }}
      CLASP_AUTH_JSON_B64: ${{ secrets.CLASP_AUTH_JSON_B64 }}
      CLASPRC: ${{ secrets.CLASPRC }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify static Cabin Demo contract
        run: node scripts/verify-final-pricing-and-cabin.js

      - name: Install isolated Apps Script tool
        shell: bash
        run: |
          set -euo pipefail
          H38_CLASP_DIR="$RUNNER_TEMP/h38-clasp"
          echo "H38_CLASP_DIR=$H38_CLASP_DIR" >> "$GITHUB_ENV"
          npm install --prefix "$H38_CLASP_DIR" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @google/clasp@3.3.0
          test -x "$H38_CLASP_DIR/node_modules/.bin/clasp"

      - name: Load encrypted Google credential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          if [[ -n "${CLASPRC_JSON}" ]]; then printf '%s' "${CLASPRC_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASPRC_JSON_B64}" ]]; then printf '%s' "${CLASPRC_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_CREDENTIALS}" ]]; then printf '%s' "${CLASP_CREDENTIALS}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_CREDENTIALS_B64}" ]]; then printf '%s' "${CLASP_CREDENTIALS_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${GOOGLE_CLASPRC_JSON}" ]]; then printf '%s' "${GOOGLE_CLASPRC_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${GOOGLE_CLASPRC_JSON_B64}" ]]; then printf '%s' "${GOOGLE_CLASPRC_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_AUTH_JSON}" ]]; then printf '%s' "${CLASP_AUTH_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_AUTH_JSON_B64}" ]]; then printf '%s' "${CLASP_AUTH_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${CLASPRC}" ]]; then printf '%s' "${CLASPRC}" > "$HOME/.clasprc.json"
          else echo 'HOLD — no encrypted Google credential is configured.'; exit 78; fi
          chmod 600 "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8'))"

      - name: Generate and verify Cabin Demo 08 in every relevant table
        shell: bash
        run: bash scripts/generate-cabin-demo-authorized.sh

      - name: Upload generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cabin-demo08-all-table-${{ github.run_id }}
          path: artifacts/cabin-demo08/
          if-no-files-found: error
          retention-days: 90

      - name: Record Cabin Demo 08 PASS
        if: success()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/cabin-demo08-pass.md"
          cat > "$REPORT" <<EOF
          ## PASS — Cabin Demo 08 generated through the Business Office

          - Source commit: ${GITHUB_SHA}
          - Customer, contact, address, and request records: PASS
          - Quotes: 22 records (one master plus 21 packages)
          - Quote lines: 42 records
          - Approvals: 22 records
          - Jobs: 1 linked parent job
          - Work orders: 21 records
          - Vendors: 21 records
          - Purchase orders and PO lines: 21 each
          - Documents: 25 records
          - PDFs: one master plus 21 package PDFs
          - Proof and activity: 21 linked records each
          - Backup manifest and Backup Log: PASS
          - Customer sends, purchasing, payments, scheduling, and other external actions: NONE
          - Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue edit 168 --repo "$GITHUB_REPOSITORY" --title "Unified Owner Portal and Cabin Demo 08 PASS" --body-file "$REPORT" --remove-label in-progress || gh issue edit 168 --repo "$GITHUB_REPOSITORY" --title "Unified Owner Portal and Cabin Demo 08 PASS" --body-file "$REPORT"
          gh issue close 168 --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Record Cabin Demo 08 HOLD
        if: failure()
        shell: bash
        run: |
          REPORT="$RUNNER_TEMP/cabin-demo08-hold.md"
          cat > "$REPORT" <<EOF
          ## HOLD — Cabin Demo 08 all-table generation

          - Source commit: ${GITHUB_SHA}
          - No external actions occurred.
          - Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue edit 168 --repo "$GITHUB_REPOSITORY" --title "Cabin Demo 08 generation HOLD" --body-file "$REPORT"
