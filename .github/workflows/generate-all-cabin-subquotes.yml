name: Generate All Cabin Sub-Quotes (Manual Recovery)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: highway-38-cabin-subquotes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
      CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
      CLASP_CREDENTIALS_B64: ${{ secrets.CLASP_CREDENTIALS_B64 }}
      GOOGLE_CLASPRC_JSON: ${{ secrets.GOOGLE_CLASPRC_JSON }}
      GOOGLE_CLASPRC_JSON_B64: ${{ secrets.GOOGLE_CLASPRC_JSON_B64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify complete Cabin Demo 08 contract
        run: node scripts/verify-final-pricing-and-cabin.js

      - name: Install isolated clasp
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @google/clasp@3.3.0

      - name: Load existing production credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          if [[ -n "${CLASPRC_JSON}" ]]; then printf '%s' "${CLASPRC_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASPRC_JSON_B64}" ]]; then printf '%s' "${CLASPRC_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_CREDENTIALS}" ]]; then printf '%s' "${CLASP_CREDENTIALS}" > "$HOME/.clasprc.json"
          elif [[ -n "${CLASP_CREDENTIALS_B64}" ]]; then printf '%s' "${CLASP_CREDENTIALS_B64}" | base64 --decode > "$HOME/.clasprc.json"
          elif [[ -n "${GOOGLE_CLASPRC_JSON}" ]]; then printf '%s' "${GOOGLE_CLASPRC_JSON}" > "$HOME/.clasprc.json"
          elif [[ -n "${GOOGLE_CLASPRC_JSON_B64}" ]]; then printf '%s' "${GOOGLE_CLASPRC_JSON_B64}" | base64 --decode > "$HOME/.clasprc.json"
          else echo 'Missing existing production clasp credential.'; exit 78; fi
          chmod 600 "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.HOME+'/.clasprc.json','utf8'))"

      - name: Generate and verify all 21 cabin sub-quotes in deployed Business Office
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT_ID="$(node -e "const d=require('./business-packs/highway38/deployment.json'); process.stdout.write(d.appsScript.productionProjectId)")"
          WORK="$RUNNER_TEMP/cabin-generator"
          mkdir -p "$WORK" artifacts/cabin-demo08
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > "$WORK/.clasp.json"
          cd "$WORK"
          "$GITHUB_WORKSPACE/node_modules/.bin/clasp" run boGenerateAllCabinSubquotes --params '[]' 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/cabin-demo08/manual-generation.txt"
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          text=Path('artifacts/cabin-demo08/manual-generation.txt').read_text()
          compact=' '.join(text.split())
          expected={'subquoteCount':21,'pdfCount':21,'quoteRecordCount':22,'approvalCount':22,'workOrderCount':21,'purchaseOrderCount':21,'proofCount':21}
          missing=[]
          for key,value in expected.items():
              if not re.search(rf'"?{re.escape(key)}"?\s*[:=]\s*{value}|{re.escape(key)}[^0-9]+{value}',compact,re.I): missing.append(f'{key}={value}')
          if not re.search(r'"?status"?\s*[:=]\s*"?PASS"?',compact,re.I): missing.append('status=PASS')
          if not re.search(r'"?externalActionsPerformed"?\s*[:=]\s*false',compact,re.I): missing.append('externalActionsPerformed=false')
          report={'status':'HOLD' if missing else 'PASS','expected':expected,'missing':missing}
          Path('artifacts/cabin-demo08/manual-verification.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if missing: raise SystemExit('Cabin Demo 08 recovery incomplete: '+', '.join(missing))
          PY

      - name: Upload generation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cabin-subquote-generation-${{ github.run_id }}
          path: artifacts/cabin-demo08/
          if-no-files-found: warn
          retention-days: 90

      - name: Report successful cabin generation
        if: success()
        shell: bash
        run: |
          BODY="PASS — Manual recovery generated the master Cabin Demo 08 project and all 21 linked sub-quotes across quotes, quote lines, approvals, work orders, purchase planning, documents, proof, activity, and backup tables. No external action occurred. Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 168 --repo "$GITHUB_REPOSITORY" --body "$BODY"

      - name: Report cabin generation hold
        if: failure()
        shell: bash
        run: |
          BODY="HOLD — Manual Cabin Demo 08 recovery failed. Existing Business Office records remain protected and no external action occurred. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment 168 --repo "$GITHUB_REPOSITORY" --body "$BODY"
