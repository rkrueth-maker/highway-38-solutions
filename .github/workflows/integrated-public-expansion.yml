name: Integrated Public Expansion Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'sample-library-now.html'
      - 'universal-quote-builder.html'
      - 'universal-quote-builder-example.html'
      - 'assets/js/uqb-public-examples.js'
      - 'solutions.html'
      - 'pricing.html'
      - 'pricing-data.js'
      - 'quote-builder.html'
      - 'business-systems.html'
      - 'cabin-project-complete.html'
      - 'about.html'
      - 'contact.html'
      - 'start-request.html'
      - 'portal.html'
      - 'assets/js/h38-site-v2.js'
      - 'assets/js/h38-request-options.js'
      - 'assets/css/h38-site-v2.css'
      - 'assets/contractor-demo/**'
      - 'assets/demo-workthroughs/**'
      - 'request-flow.js'
      - 'customer-portal.html'
      - 'customer-portal-*.js'
      - 'supabase/migrations/**'
      - 'scripts/verify-public-expansion.js'
      - 'scripts/verify-commercial-system.js'
      - 'scripts/verify-final-pricing-and-cabin.js'
      - 'scripts/verify-commercial-browser.js'
      - 'scripts/browser-commercial-smoke.sh'
      - 'scripts/capture-project-example-images.js'
      - 'scripts/verify-rendered-project-images.py'
      - 'scripts/verify-contact-options.js'
      - 'scripts/verify-one-shot-ux.js'
      - 'scripts/verify-customer-portal-supabase.js'
      - 'scripts/verify-public-website-architecture.js'
      - 'scripts/config/public-website-routes.json'
      - 'scripts/config/approved-public-assets.json'
      - 'scripts/config/approved-public-image-placements.json'
      - 'docs/architecture/**'
      - 'docs/public-website/VISUAL_RELEASE_STANDARD.md'
      - '.github/workflows/integrated-public-expansion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify change governance
        run: node scripts/verify-change-governance.js 2>&1 | tee /tmp/verify-change-governance.log
      - name: Verify contact options
        run: node scripts/verify-contact-options.js 2>&1 | tee /tmp/verify-contact-options.log
      - name: Verify one-shot UX
        run: node scripts/verify-one-shot-ux.js 2>&1 | tee /tmp/verify-one-shot-ux.log
      - name: Verify public expansion
        run: node scripts/verify-public-expansion.js 2>&1 | tee /tmp/verify-public-expansion.log
      - name: Verify commercial system
        run: node scripts/verify-commercial-system.js 2>&1 | tee /tmp/verify-commercial-system.log
      - name: Verify final pricing and cabin
        run: node scripts/verify-final-pricing-and-cabin.js 2>&1 | tee /tmp/verify-final-pricing-and-cabin.log
      - name: Verify public website architecture
        run: node scripts/verify-public-website-architecture.js 2>&1 | tee /tmp/verify-public-website-architecture.log
      - name: Verify customer portal Supabase
        run: node scripts/verify-customer-portal-supabase.js 2>&1 | tee /tmp/verify-customer-portal-supabase.log
      - name: Upload structural diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-structural-diagnostics-${{ github.run_id }}
          path: /tmp/verify-*.log
          if-no-files-found: warn
          retention-days: 30

  browser-regression:
    needs: structural-regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install rendered-image verifier
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Verify public browser behavior
        run: node scripts/verify-commercial-browser.js
      - name: Verify focused shell, pricing, cabin, and examples
        run: bash scripts/browser-commercial-smoke.sh
      - name: Capture every Project Examples image
        run: node scripts/capture-project-example-images.js
      - name: Reject blank, broken, SVG-wrapped, or mismatched project visuals
        run: python3 scripts/verify-rendered-project-images.py browser-artifacts/project-images
      - name: Upload public regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-regression-${{ github.run_id }}
          path: |
            artifacts/commercial-system/verification.json
            artifacts/final-pricing-cabin/verification.json
            artifacts/change-governance/verification.json
            launch-control/evidence/customer-portal-supabase-verification.json
            browser-artifacts/
          if-no-files-found: warn
          retention-days: 30
