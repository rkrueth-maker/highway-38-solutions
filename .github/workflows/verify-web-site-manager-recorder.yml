name: Verify web Site Manager recorder

on:
  pull_request:
    paths:
      - 'commercial-app/field-visit-video.js'
      - 'commercial-app/site-visit-meeting-seed.js'
      - 'commercial-app/runtime-rowid-fix.js'
      - 'supabase/functions/h38-site-visit-context/**'
      - 'scripts/verify-web-site-manager-recorder.js'
      - '.github/workflows/verify-web-site-manager-recorder.yml'
  push:
    branches: [main]
    paths:
      - 'commercial-app/field-visit-video.js'
      - 'commercial-app/site-visit-meeting-seed.js'
      - 'commercial-app/runtime-rowid-fix.js'
      - 'supabase/functions/h38-site-visit-context/**'
      - 'scripts/verify-web-site-manager-recorder.js'
      - '.github/workflows/verify-web-site-manager-recorder.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check recorder and clean Site Visit syntax
        run: |
          node --check commercial-app/field-visit-video.js
          node --check commercial-app/site-visit-meeting-seed.js
          node --check commercial-app/runtime-rowid-fix.js
      - name: Verify clean web Site Visit contract
        run: node scripts/verify-web-site-manager-recorder.js
