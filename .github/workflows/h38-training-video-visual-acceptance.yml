name: H38 Training Video Visual Acceptance

on:
  workflow_dispatch:
    inputs:
      recording_authorized:
        description: Confirm a controlled TEST-record run using an authorized account
        required: true
        type: boolean
        default: false
      scope:
        description: Task Manager only or the explicitly affected full visual library
        type: choice
        options: [task, all]
        default: task
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/run-complete-training-visual-strict.js'
      - 'scripts/run-complete-training-visual-strict-v2.js'
      - 'scripts/record-task-manager-training-visual.js'
      - '.github/workflows/h38-training-video-visual-acceptance.yml'
      - 'scripts/record-complete-training-library.js'
      - 'scripts/record-staff-completion-proof.js'
      - 'scripts/record-task-manager-training.js'
      - 'scripts/run-complete-training-library-strict.js'

permissions:
  contents: read

concurrency:
  group: h38-controlled-training-test-data
  cancel-in-progress: false

jobs:
  visual-training-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preflight generated Task Manager privacy runtime
        run: H38_TASK_TRAINING_VALIDATE_RUNTIME_ONLY=1 node scripts/record-task-manager-training-visual.js
      - run: npm ci && npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prepare local Task Manager narrator
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install piper-tts
          mkdir -p "$RUNNER_TEMP/task-narrator"
          cd "$RUNNER_TEMP/task-narrator"
          python -m piper.download_voices en_US-hfc_male-medium
          echo "H38_NARRATOR_MODEL=$RUNNER_TEMP/task-narrator/en_US-hfc_male-medium.onnx" >> "$GITHUB_ENV"

      - name: Prepare optional authorized storage state
        env:
          STORAGE_STATE: ${{ secrets.H38_WORKFLOW_STORAGE_STATE }}
        run: |
          if [ -n "$STORAGE_STATE" ]; then
            printf '%s' "$STORAGE_STATE" > "$RUNNER_TEMP/h38-workflow-storage-state.json"
            chmod 600 "$RUNNER_TEMP/h38-workflow-storage-state.json"
          fi
      - name: Create fresh controlled TEST Staff assignment
        env:
          H38_WORKFLOW_RECORDING_AUTHORIZED: ${{ github.event_name == 'pull_request' && 'true' || inputs.recording_authorized }}
          H38_WORKFLOW_STORAGE_STATE: ${{ runner.temp }}/h38-workflow-storage-state.json
          H38_WORKFLOW_TEST_EMAIL: ${{ secrets.H38_WORKFLOW_TEST_EMAIL }}
          H38_WORKFLOW_TEST_PASSWORD: ${{ secrets.H38_WORKFLOW_TEST_PASSWORD }}
          H38_WORKFLOW_AUTH_STATE_OUT: ${{ runner.temp }}/h38-workflow-generated-storage-state.json
          H38_TASK_TRAINING_DIR: artifacts/task-manager-training
          H38_OFFICE_URL: https://highway38solutions.com/commercial-app/
        run: node scripts/record-task-manager-training-visual.js
      - name: Narrate the two repaired Task Manager lessons
        env:
          H38_TASK_TRAINING_DIR: artifacts/task-manager-training
          H38_NARRATED_TRAINING_DIR: artifacts/task-manager-narrated
          H38_NARRATION_ONLY: H38-TRAIN-TASK-MANAGER-DESKTOP,H38-TRAIN-TASK-MANAGER-PHONE
        run: node scripts/narrate-h38-training-library.js
      - name: Run repaired strict visual training proof
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'all'

        env:
          H38_WORKFLOW_RECORDING_AUTHORIZED: ${{ github.event_name == 'pull_request' && 'true' || inputs.recording_authorized }}
          H38_WORKFLOW_STORAGE_STATE: ${{ runner.temp }}/h38-workflow-storage-state.json
          H38_WORKFLOW_TEST_EMAIL: ${{ secrets.H38_WORKFLOW_TEST_EMAIL }}
          H38_WORKFLOW_TEST_PASSWORD: ${{ secrets.H38_WORKFLOW_TEST_PASSWORD }}
          H38_WORKFLOW_STAFF_EMAIL: ${{ secrets.H38_WORKFLOW_STAFF_EMAIL }}
          H38_WORKFLOW_STAFF_PASSWORD: ${{ secrets.H38_WORKFLOW_STAFF_PASSWORD }}
          H38_WORKFLOW_AUTH_STATE_OUT: ${{ runner.temp }}/h38-workflow-generated-storage-state.json
          H38_TASK_TRAINING_DIR: artifacts/task-manager-training
          H38_COMPLETE_TRAINING_DIR: artifacts/complete-training-library
          H38_OFFICE_URL: https://highway38solutions.com/commercial-app/
        run: node scripts/run-complete-training-visual-strict-v2.js
      - name: Upload repaired visual proof packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h38-training-video-visual-${{ github.run_id }}
          path: |
            artifacts/task-manager-training/
            artifacts/task-manager-narrated/
            artifacts/complete-training-library/
          if-no-files-found: warn
          retention-days: 30
