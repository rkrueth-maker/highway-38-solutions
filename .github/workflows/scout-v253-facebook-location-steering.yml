name: Build H38 Scout v2.5.3 Facebook Location Steering

on:
  push:
    branches:
      - 'agent/private-reseller-scout'
    paths:
      - 'native/h38-site-scanner/android-app/reseller/v253-facebook-location-steering.test.mjs'
      - 'native/h38-site-scanner/android-app/reseller/v253-apply-facebook-location-repair.py'
      - '.github/workflows/scout-v253-facebook-location-steering.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Apply deterministic v2.5.3 Facebook steering repair
        run: python reseller/v253-apply-facebook-location-repair.py

      - name: Verify v2.5.3 Facebook preflight contract
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v253"; mkdir -p "$report"
          assets='reseller/src/main/assets/reseller'
          fb='reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java'
          grep -Fq "versionName '2.5.3'" reseller/build.gradle
          grep -Fq 'versionCode 83' reseller/build.gradle
          grep -Fq 'H38_SCOUT_V253_FACEBOOK_CITY_STATE_STEERING=true' "$assets/v200-app.js"
          grep -Fq "document.querySelectorAll('body *')" "$fb"
          grep -Fq 'location-apply' "$fb"
          grep -Fq 'wrong-area cards remain withheld until the page itself proves the location' "$fb"
          node reseller/v253-facebook-location-steering.test.mjs | tee "$report/facebook-city-state-fixture.txt"
          node reseller/hunt-native.test.mjs | tee "$report/hunt-native.txt"
          node reseller/profit-engine.test.mjs | tee "$report/profit-track.txt"
          node "$assets/v251-facebook-resale.test.mjs" | tee "$report/facebook-resale-return.txt"
          node "$GITHUB_WORKSPACE/supabase/functions/reseller-facebook-public-v240/core.test.mjs" | tee "$report/facebook-public.txt"
          for f in "$assets"/v200-*.js "$assets"/v210-polish.js "$assets"/v211-wide.js "$assets"/v212-physical.js "$assets"/v220-profit.js "$assets"/v220-track.js "$assets"/v220-product.js "$assets"/v240-data.js; do node --check "$f"; done
          python -c 'from pathlib import Path; s=Path("reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java").read_text(); b=s[s.index("if(p.optBoolean(\"location_selected_exact\""):s.index("if(p.optBoolean(\"location_fixing\"")]; assert "commitLocationProof()" not in b; assert "got===want" in s; print("PASS rendered Facebook base location remains proof authority")' | tee "$report/location-proof-authority.txt"
          echo PASS > "$report/contract.txt"

      - name: Compile Owner Scout v2.5.3 APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v253"; mkdir -p "$report"
          gradle --no-daemon :reseller:assembleOwner | tee "$report/compile.log"
          apk='reseller/build/outputs/apk/owner/reseller-owner.apk'; test -f "$apk"
          out="$report/H38-Reseller-Scout-Owner-v2.5.3.apk"; cp "$apk" "$out"
          sha256sum "$out" > "$report/H38-Reseller-Scout-Owner-v2.5.3.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$out" > "$report/zipalign.txt"

      - name: Smoke inspect exact v2.5.3 APK bytes
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v253"; out="$report/H38-Reseller-Scout-Owner-v2.5.3.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='83' versionName='2.5.3'" "$report/badging.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          grep -Fq 'Verification succesful' "$report/zipalign.txt"
          unzip -t "$out" > "$report/zip-test.txt"; grep -Fq 'No errors detected in compressed data' "$report/zip-test.txt"
          unzip -p "$out" 'assets/reseller/v200-app.js' > "$report/packaged-v200-app.js"
          grep -Fq 'H38_SCOUT_V253_FACEBOOK_CITY_STATE_STEERING=true' "$report/packaged-v200-app.js"
          unzip -p "$out" classes.dex | strings > "$report/dex-strings.txt"
          grep -Fq 'location-apply' "$report/dex-strings.txt"
          grep -Fq 'wrong-area cards remain withheld until the page itself proves the location' "$report/dex-strings.txt"
          echo PASS > "$report/smoke.txt"

      - name: Upload v2.5.3 APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v2.5.3
          path: artifacts/scout-v253/*
          if-no-files-found: warn
          retention-days: 30
