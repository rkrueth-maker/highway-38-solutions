name: Build H38 Scout v2.5.3 Facebook Location Steering

on:
  push:
    branches:
      - 'agent/private-reseller-scout'
    paths:
      - 'native/h38-site-scanner/android-app/reseller/v253-facebook-location-steering.test.mjs'
      - '.github/workflows/scout-v253-facebook-location-steering.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Apply deterministic v2.5.3 Facebook steering repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          gradle=Path('reseller/build.gradle')
          s=gradle.read_text()
          assert "versionCode 82" in s and "versionName '2.5.2'" in s
          s=s.replace('versionCode 82','versionCode 83',1).replace("versionName '2.5.2'","versionName '2.5.3'",1)
          gradle.write_text(s)

          app=Path('reseller/src/main/assets/reseller/v200-app.js')
          s=app.read_text()
          assert 'H38_SCOUT_V252_FACEBOOK_LOCATION_REPAIR=true' in s
          assert 'return priorOpenFacebookScan();' in s
          s=s.replace("window.H38_SCOUT_V252_FACEBOOK_LOCATION_REPAIR=true;","window.H38_SCOUT_V252_FACEBOOK_LOCATION_REPAIR=true;\nwindow.H38_SCOUT_V253_FACEBOOK_CITY_STATE_STEERING=true;",1)
          s=s.replace('        return priorOpenFacebookScan();', '''        const priorLabel=state.location.label;
        const disambiguated=txt(r.label).replace(/,\\s*\\d{5}(?:-\\d{4})?\\s*$/,'').replace(/,\\s*/g,' ').replace(/\\s+/g,' ').trim();
        if(disambiguated)state.location={...state.location,label:disambiguated};
        try{return priorOpenFacebookScan();}
        finally{state.location={...state.location,label:priorLabel};renderLocationStrip();}''',1)
          app.write_text(s)

          fb=Path('reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java')
          s=fb.read_text()
          old_where='String where=postal.isBlank()?"your selected Scout area":"ZIP "+postal;'
          assert old_where in s
          s=s.replace(old_where,'String where=postal.isBlank()?"your selected Scout area":postal;',1)
          s=s.replace('H38ResellerScoutMarketplace/2.4.0','H38ResellerScoutMarketplace/2.5.3',1)

          old_candidate='''  function exactLocationCandidate(){if(!desired)return null;var want=norm(desired),nodes=[].slice.call(document.querySelectorAll('[role=\\"option\\"],[role=\\"listbox\\"] [role=\\"button\\"],li,a,button,[role=\\"button\\"],[tabindex]'));return nodes.find(function(e){if(!visible(e))return false;var x=T(e).replace(/\\s+/g,' ').trim();if(x.length<3||x.length>120)return false;return norm(x).indexOf(want)>=0})||null}'''
          assert old_candidate in s
          new_candidate='''  function exactLocationCandidate(){if(!desired)return null;var want=norm(desired),nodes=[].slice.call(document.querySelectorAll('body *')),hits=[];nodes.forEach(function(e){if(!visible(e))return;var x=T(e).replace(/\\s+/g,' ').trim();if(x.length<3||x.length>120)return;var got=norm(x);if(got===want||(got.indexOf(want)===0&&got.length-want.length<=4)){var r=e.getBoundingClientRect();hits.push({e:e,area:Math.max(1,r.width*r.height)})}});if(!hits.length)return null;hits.sort(function(a,b){return a.area-b.area});var e=hits[0].e;return(e.closest&&e.closest('button,a,[role=\\"button\\"],[role=\\"option\\"],[tabindex]'))||e}'''
          s=s.replace(old_candidate,new_candidate,1)

          old_click="  function clickExact(loc){var pick=exactLocationCandidate();if(!pick)return false;window.__h38LocActionAt=Date.now();reportFix(loc,'exact-suggestion',{location_selected_exact:true,selected_location_text:T(pick)});pick.click();setTimeout(scan,2600);return true}"
          assert old_click in s
          new_click="""  function clickApplyIfPresent(loc){var dialogs=[].slice.call(document.querySelectorAll('[role=\\\"dialog\\\"]')).filter(visible),root=dialogs.length?dialogs[dialogs.length-1]:document,buttons=[].slice.call(root.querySelectorAll('button,[role=\\\"button\\\"],[tabindex]')).filter(visible),b=buttons.find(function(e){var x=norm(T(e));return x==='apply'||x==='done'||x==='update'||x==='save'});if(!b)return false;window.__h38LocActionAt=Date.now();reportFix(loc,'location-apply',{location_apply_text:T(b)});b.click();return true}
  function clickExact(loc){var pick=exactLocationCandidate();if(!pick)return false;window.__h38LocActionAt=Date.now();reportFix(loc,'exact-suggestion',{location_selected_exact:true,selected_location_text:T(pick)});pick.click();setTimeout(function(){clickApplyIfPresent(loc)},650);setTimeout(scan,3000);return true}"""
          s=s.replace(old_click,new_click,1)

          old_bridge='''                if(p.optBoolean("location_selected_exact",false)){
                    String selected=p.optString("selected_location_text","");
                    if(!strictLocationRequired()||locationMatchesSelected(selected)){commitLocationProof();locationFixing=true;status.setText("Selected Marketplace location matched Scout. Waiting for Facebook to render that search area; wrong-area cards remain withheld.");return;}
                }'''
          assert old_bridge in s
          new_bridge='''                if(p.optBoolean("location_selected_exact",false)){
                    String selected=p.optString("selected_location_text","");
                    if(!strictLocationRequired()||locationMatchesSelected(selected)){locationFixing=true;status.setText("Selected the exact Scout city/state in Marketplace. Waiting for Facebook to apply and render it; wrong-area cards remain withheld until the page itself proves the location.");return;}
                }'''
          s=s.replace(old_bridge,new_bridge,1)
          fb.write_text(s)
          PY

      - name: Verify v2.5.3 Facebook preflight contract
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v253"; mkdir -p "$report"
          assets='reseller/src/main/assets/reseller'; fb='reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java'
          grep -Fq "versionName '2.5.3'" reseller/build.gradle
          grep -Fq 'versionCode 83' reseller/build.gradle
          grep -Fq 'H38_SCOUT_V253_FACEBOOK_CITY_STATE_STEERING=true' "$assets/v200-app.js"
          grep -Fq "replace(/,\\s*/g,' ')" "$assets/v200-app.js"
          grep -Fq "document.querySelectorAll('body *')" "$fb"
          grep -Fq "location-apply" "$fb"
          grep -Fq 'wrong-area cards remain withheld until the page itself proves the location' "$fb"
          node reseller/v253-facebook-location-steering.test.mjs | tee "$report/facebook-city-state-fixture.txt"
          node reseller/hunt-native.test.mjs | tee "$report/hunt-native.txt"
          node reseller/profit-engine.test.mjs | tee "$report/profit-track.txt"
          node "$assets/v251-facebook-resale.test.mjs" | tee "$report/facebook-resale-return.txt"
          node "$GITHUB_WORKSPACE/supabase/functions/reseller-facebook-public-v240/core.test.mjs" | tee "$report/facebook-public.txt"
          for f in "$assets"/v200-*.js "$assets"/v210-polish.js "$assets"/v211-wide.js "$assets"/v212-physical.js "$assets"/v220-profit.js "$assets"/v220-track.js "$assets"/v220-product.js "$assets"/v240-data.js; do node --check "$f"; done
          python - <<'PY'
          from pathlib import Path
          s=Path('reseller/src/main/java/com/highway38/resellerscout/FacebookMarketplaceActivity.java').read_text()
          block=s[s.index('if(p.optBoolean("location_selected_exact"'):s.index('if(p.optBoolean("location_fixing"')]
          assert 'commitLocationProof()' not in block, 'suggestion click must never become location proof'
          assert 'location-apply' in s
          assert "got===want" in s
          print('PASS location proof waits for rendered Facebook base location')
          PY
          echo PASS > "$report/contract.txt"

      - name: Compile Owner Scout v2.5.3 APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v253"; mkdir -p "$report"
          gradle --no-daemon :reseller:assembleOwner | tee "$report/compile.log"
          apk='reseller/build/outputs/apk/owner/reseller-owner.apk'; test -f "$apk"
          out="$report/H38-Reseller-Scout-Owner-v2.5.3.apk"; cp "$apk" "$out"
          sha256sum "$out" > "$report/H38-Reseller-Scout-Owner-v2.5.3.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$out" > "$report/zipalign.txt"

      - name: Smoke inspect exact v2.5.3 APK bytes
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v253"; out="$report/H38-Reseller-Scout-Owner-v2.5.3.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='83' versionName='2.5.3'" "$report/badging.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          grep -Fq 'Verification succesful' "$report/zipalign.txt"
          unzip -t "$out" > "$report/zip-test.txt"; grep -Fq 'No errors detected in compressed data' "$report/zip-test.txt"
          unzip -p "$out" 'assets/reseller/v200-app.js' > "$report/packaged-v200-app.js"
          grep -Fq 'H38_SCOUT_V253_FACEBOOK_CITY_STATE_STEERING=true' "$report/packaged-v200-app.js"
          unzip -p "$out" classes.dex | strings > "$report/dex-strings.txt"
          grep -Fq 'location-apply' "$report/dex-strings.txt"
          grep -Fq 'wrong-area cards remain withheld until the page itself proves the location' "$report/dex-strings.txt"
          echo PASS > "$report/smoke.txt"

      - name: Upload v2.5.3 APK and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v2.5.3
          path: artifacts/scout-v253/*
          if-no-files-found: warn
          retention-days: 30
