name: Package H38 Scout v3.0.25 v2.6.3 Physical-PASS Recovery APK

on:
  push:
    branches: ['agent/private-reseller-scout']
    paths:
      - '.github/workflows/scout-v316-interim-apk.yml'
      - 'native/h38-site-scanner/android-app/reseller/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scout-v325-v263-physical-pass-recovery
  cancel-in-progress: true

jobs:
  build-verify-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Verify exact v2.6.3 physical-PASS runtime recovery
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v325-v263-recovery"; mkdir -p "$report"
          test "$(git branch --show-current)" = 'agent/private-reseller-scout'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq "versionName '3.0.25'" reseller/build.gradle
          grep -Fq 'versionCode 325' reseller/build.gradle
          changed="$(git diff --name-only 64ef9a193958c0fbfc75a8b0e47777857d8bafe5 -- reseller | grep -Ev '^(reseller/build.gradle|native/h38-site-scanner/android-app/reseller/build.gradle)$' || true)"
          if [[ -n "$changed" ]]; then printf '%s\n' "$changed"; exit 1; fi
          git diff 64ef9a193958c0fbfc75a8b0e47777857d8bafe5 -- reseller/build.gradle > "$report/build-version-diff.txt" || true
          test -f reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          test -f reseller/src/main/assets/reseller/v200-app.js
          test -f reseller/src/main/assets/reseller/v262-phone-video-repair.js
          test ! -e reseller/src/main/java/com/highway38/resellerscout/NativeLoginOverlay.java
          test ! -e reseller/src/main/assets/reseller/v316-garage-safe-action.js
          test ! -e reseller/src/main/assets/reseller/v317-flipr-resale-flow.js
          test ! -e reseller/src/main/assets/reseller/v323-native-auth-bridge.js
          printf '%s\n' "$GITHUB_SHA" > "$report/source-sha.txt"
          printf '%s\n' '64ef9a193958c0fbfc75a8b0e47777857d8bafe5' > "$report/restored-runtime-source.txt"
          echo V263_PHYSICAL_PASS_RUNTIME_RECOVERY_OK > "$report/source-gate.txt"

      - name: Restore persistent Scout signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: h38-reseller-scout-owner-debug-signing-v1

      - name: Require current signer continuity
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v325-v263-recovery"
          test -f "$HOME/.android/debug.keystore"
          {
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$HOME/.android/debug.keystore"
            echo 'H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=android'
            echo 'H38_ANDROID_UPLOAD_KEY_ALIAS=androiddebugkey'
            echo 'H38_ANDROID_UPLOAD_KEY_PASSWORD=android'
          } >> "$GITHUB_ENV"
          echo 'persistent-debug-key-v1' > "$report/signing-mode.txt"

      - name: Compile owner APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v325-v263-recovery"
          gradle --no-daemon :reseller:assembleOwner | tee "$report/compile.log"
          apk="$(find reseller/build/outputs/apk -type f -path '*/owner/*.apk' ! -path '*/androidTest/*' | head -n1)"
          test -n "$apk" -a -f "$apk"
          out="$report/H38-Reseller-Scout-Owner-v3.0.25-RECOVERY-v2.6.3-PHYSICAL-PASS.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$report/sha256.txt"

      - name: Inspect exact recovery APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v325-v263-recovery"
          out="$report/H38-Reseller-Scout-Owner-v3.0.25-RECOVERY-v2.6.3-PHYSICAL-PASS.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='325' versionName='3.0.25'" "$report/badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$out" > "$report/zipalign.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          grep -Fq 'Verification succesful' "$report/zipalign.txt"
          unzip -t "$out" > "$report/zip-test.txt"
          grep -Fq 'No errors detected in compressed data' "$report/zip-test.txt"
          actual="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$report/signing.txt" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = 'cdabe362ad80788c4ac216a26a8dcc44174eceb3c380c3b4a126507af4043c46'
          unzip -l "$out" > "$report/apk-files.txt"
          grep -Fq 'assets/reseller/v262-phone-video-repair.js' "$report/apk-files.txt"
          ! grep -Fq 'v316-garage-safe-action.js' "$report/apk-files.txt"
          ! grep -Fq 'v317-flipr-resale-flow.js' "$report/apk-files.txt"
          ! grep -Fq 'v323-native-auth-bridge.js' "$report/apk-files.txt"
          echo APK_V263_RECOVERY_GATE_OK > "$report/apk-gate.txt"

      - name: Upload recovery APK and verification
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v3.0.25-v263-physical-pass-recovery
          path: artifacts/scout-v325-v263-recovery/*
          if-no-files-found: error
          retention-days: 30
