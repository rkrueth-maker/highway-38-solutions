name: Package H38 Scout v3.0.24 v3.0.16 Phone Rollback APK

on:
  push:
    branches: ['agent/private-reseller-scout']
    paths:
      - '.github/workflows/scout-v316-interim-apk.yml'
      - 'native/h38-site-scanner/android-app/reseller/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scout-v324-v316-phone-rollback
  cancel-in-progress: true

jobs:
  build-verify-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/h38-site-scanner/android-app
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: Verify exact v3.0.16 phone-runtime rollback
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v324-v316-rollback"; mkdir -p "$report"
          test "$(git branch --show-current)" = 'agent/private-reseller-scout'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -Fq "versionName '3.0.24'" reseller/build.gradle
          grep -Fq 'versionCode 324' reseller/build.gradle
          test "$(git hash-object reseller/src/main/java/com/highway38/resellerscout/MainActivity.java)" = '0e07458dc7051f2b6bfdbe613519f9b11c84b250'
          test "$(git hash-object reseller/src/main/java/com/highway38/resellerscout/ResellerScoutApplication.java)" = '30832ce2bf3bb1b6442ad73b57bc9e94c323b26b'
          test "$(git hash-object reseller/src/main/AndroidManifest.xml)" = 'c5a2560ca8c8247c77de6868dba76b5eff265c1a'
          test "$(git hash-object reseller/src/main/assets/reseller/v200-scan.js)" = '2bd7d6a7af43908f8842c19227533e4c0576dcc7'
          test "$(git hash-object reseller/src/main/assets/reseller/v316-garage-safe-action.js)" = '74e42fd9631454066254355f0a1fe62b4f683840'
          test "$(git hash-object reseller/src/androidTest/java/com/highway38/resellerscout/RemoteOwnerUxTest.java)" = 'ff7d19168ff24439265404aef26238d008af9aba'
          test ! -e reseller/src/main/java/com/highway38/resellerscout/NativeLoginOverlay.java
          test ! -e reseller/src/main/assets/reseller/v317-flipr-resale-flow.js
          test ! -e reseller/src/main/assets/reseller/v323-native-auth-bridge.js
          test ! -e reseller/src/main/assets/reseller/v316-final-acceptance.js
          test ! -e reseller/src/main/assets/reseller/v316-final-gate.txt
          test ! -e reseller/src/androidTest/java/com/highway38/resellerscout/SignInPhysicalInputTest.java
          ! grep -Fq 'configChanges="keyboard|keyboardHidden' reseller/src/main/AndroidManifest.xml
          ! grep -Fq 'NativeLoginOverlay' reseller/src/main/java/com/highway38/resellerscout/ResellerScoutApplication.java
          ! grep -Fq 'SOFT_INPUT_ADJUST_RESIZE' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          ! grep -Fq 'supabase-js@2.112.4' reseller/src/main/java/com/highway38/resellerscout/MainActivity.java
          node --check reseller/src/main/assets/reseller/v200-scan.js
          node --check reseller/src/main/assets/reseller/v316-garage-safe-action.js
          printf '%s\n' "$GITHUB_SHA" > "$report/source-sha.txt"
          printf '%s\n' 'e781d0f01e897ff27be92b2172d13736db4b8003' > "$report/restored-runtime-source.txt"
          echo V316_PHONE_RUNTIME_ROLLBACK_OK > "$report/source-gate.txt"

      - name: Restore exact persistent Scout signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: h38-reseller-scout-owner-debug-signing-v1

      - name: Require persistent signer continuity
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v324-v316-rollback"
          test -f "$HOME/.android/debug.keystore"
          {
            echo "H38_ANDROID_UPLOAD_KEYSTORE_PATH=$HOME/.android/debug.keystore"
            echo 'H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=android'
            echo 'H38_ANDROID_UPLOAD_KEY_ALIAS=androiddebugkey'
            echo 'H38_ANDROID_UPLOAD_KEY_PASSWORD=android'
          } >> "$GITHUB_ENV"
          echo 'persistent-debug-key-v1' > "$report/signing-mode.txt"

      - name: Compile owner APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v324-v316-rollback"
          gradle --no-daemon :reseller:assembleOwnerRelease | tee "$report/compile.log"
          apk="$(find reseller/build/outputs/apk -type f -path '*/owner/release/*.apk' ! -path '*/androidTest/*' | head -n1)"
          test -n "$apk" -a -f "$apk"
          out="$report/H38-Reseller-Scout-Owner-v3.0.24-ROLLBACK-v3.0.16-PHONE.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$report/sha256.txt"

      - name: Inspect exact rollback APK
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/scout-v324-v316-rollback"
          out="$report/H38-Reseller-Scout-Owner-v3.0.24-ROLLBACK-v3.0.16-PHONE.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$out" > "$report/badging.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='324' versionName='3.0.24'" "$report/badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$out" > "$report/signing.txt"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$out" > "$report/zipalign.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          grep -Fq 'Verification succesful' "$report/zipalign.txt"
          unzip -t "$out" > "$report/zip-test.txt"
          grep -Fq 'No errors detected in compressed data' "$report/zip-test.txt"
          actual="$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$report/signing.txt" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = 'cdabe362ad80788c4ac216a26a8dcc44174eceb3c380c3b4a126507af4043c46'
          unzip -p "$out" assets/reseller/v200-scan.js > "$report/packaged-v200-scan.js"
          unzip -p "$out" assets/reseller/v316-garage-safe-action.js > "$report/packaged-v316.js"
          test "$(git hash-object "$report/packaged-v200-scan.js")" = '2bd7d6a7af43908f8842c19227533e4c0576dcc7'
          test "$(git hash-object "$report/packaged-v316.js")" = '74e42fd9631454066254355f0a1fe62b4f683840'
          unzip -l "$out" > "$report/apk-files.txt"
          ! grep -Fq 'v323-native-auth-bridge.js' "$report/apk-files.txt"
          ! grep -Fq 'v317-flipr-resale-flow.js' "$report/apk-files.txt"
          echo APK_ROLLBACK_GATE_OK > "$report/apk-gate.txt"

      - name: Upload rollback APK and verification
        uses: actions/upload-artifact@v4
        with:
          name: h38-reseller-scout-owner-v3.0.24-v316-phone-rollback
          path: artifacts/scout-v324-v316-rollback/*
          if-no-files-found: error
          retention-days: 30
