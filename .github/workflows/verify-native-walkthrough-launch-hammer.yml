name: Verify native walkthrough launch and hammer
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'skills/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'README.md'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'skills/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - 'README.md'
      - 'AGENTS.md'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-native-walkthrough-launch-hammer.js
