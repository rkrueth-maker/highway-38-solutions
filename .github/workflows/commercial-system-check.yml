name: Commercial System Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'sample-library-now.html'
      - 'solutions.html'
      - 'pricing.html'
      - 'pricing-data.js'
      - 'quote-builder.html'
      - 'business-systems.html'
      - 'about.html'
      - 'contact.html'
      - 'start-request.html'
      - 'portal.html'
      - 'customer-portal.html'
      - 'customer-portal-*.js'
      - 'catalog-data.js'
      - 'commercial.js'
      - 'sample-print.js'
      - 'request-flow.js'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'assets/contractor-demo/**'
      - 'assets/demo-workthroughs/**'
      - 'apps-script/commercial-intake/**'
      - 'scripts/verify-commercial-system.js'
      - 'scripts/verify-commercial-browser.js'
      - 'scripts/browser-commercial-smoke.sh'
      - '.github/workflows/commercial-system-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commercial-system-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_STORE: example.myshopify.com
      SHOPIFY_ADMIN_TOKEN: test-token
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript syntax checks
        run: |
          node --check catalog-data.js
          node --check commercial.js
          node --check sample-print.js
          node --check scripts/verify-commercial-system.js
          cp apps-script/commercial-intake/FormBuilder.gs /tmp/FormBuilder.js
          node --check /tmp/FormBuilder.js

      - name: Run commercial verification and capture report
        id: commercial
        shell: bash
        run: |
          set +e
          node scripts/verify-commercial-system.js > commercial-verification-report.txt 2>&1
          code=$?
          cat commercial-verification-report.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload commercial verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-verification-report
          path: commercial-verification-report.txt

      - name: Run rendered browser verification
        id: browser
        shell: bash
        run: |
          set +e
          bash scripts/browser-commercial-smoke.sh
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload rendered browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-browser-artifacts
          path: browser-artifacts

      - name: Enforce green verification
        shell: bash
        run: |
          test "${{ steps.commercial.outputs.exit_code }}" = "0"
          test "${{ steps.browser.outputs.exit_code }}" = "0"
