name: Commercial System Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SHOPIFY_STORE: example.myshopify.com
      SHOPIFY_ADMIN_TOKEN: test-token
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: JavaScript and Apps Script syntax checks
        run: |
          node --check catalog-data.js
          node --check commercial.js
          node --check sample-print.js
          node --check commercial-app/app-01.js
          node --check commercial-app/app-06.js
          node --check commercial-app/app-07.js
          node --check commercial-app/app-16.js
          node --check commercial-app/app-19.js
          node --check commercial-app/app-20.js
          node --check commercial-app/profitability-operating-layer.js
          node --check commercial-app/desktop-navigation-authority.js
          node --check scripts/verify-profitability-operating-layer.js
          node --check scripts/verify-commercial-system.js
          node --check scripts/verify-commercial-release-pipeline.js
          node --check scripts/verify-commercial-google-native-beta.js
          node --check scripts/verify-commercial-browser-signin.js
          node --check scripts/verify-commercial-public-shell.js
          node --check scripts/verify-commercial-shell-focus.js
          node --check scripts/verify-commercial-office-parity.js
          node --check scripts/verify-commercial-delivery-contract.js
          node --check scripts/verify-commercial-delivery-acceptance.js
          node --check scripts/verify-commercial-full-demo-contract.js
          node --check scripts/verify-commercial-full-demo-bounds.js
          node --check scripts/verify-commercial-full-demo-acceptance.js
          cp apps-script/commercial-intake/FormBuilder.gs /tmp/FormBuilder.js
          node --check /tmp/FormBuilder.js
          for source in \
            apps-script/commercial-office-beta/CommercialBeta_Web.gs \
            apps-script/commercial-office-beta/CommercialBeta_DeliveryAcceptance_01.gs \
            apps-script/commercial-office-beta/CommercialBeta_CompletionCore_02.gs \
            apps-script/commercial-office-beta/CommercialBeta_CompletionOperations_02.gs \
            apps-script/commercial-office-beta/CommercialBeta_CompletionOperations_04.gs \
            apps-script/commercial-office-beta/CommercialBeta_AIQuoteMeasure_01.gs \
            apps-script/commercial-office-beta/CommercialBeta_FullDemo_01.gs \
            apps-script/commercial-office-beta/CommercialBeta_FullDemo_02.gs \
            apps-script/commercial-office-beta/CommercialBeta_FullDemo_03.gs; do
            target="/tmp/$(basename "${source}" .gs).js"
            cp "${source}" "${target}"
            node --check "${target}"
          done

      - name: Verify commercial release pipeline boundaries
        run: node scripts/verify-commercial-release-pipeline.js

      - name: Verify deployable Google-native beta source
        run: node scripts/verify-commercial-google-native-beta.js

      - name: Verify focused Quote Builder and global AI shell
        run: node scripts/verify-commercial-shell-focus.js

      - name: Verify replacement Office parity
        run: node scripts/verify-commercial-office-parity.js

      - name: Verify profitability operating layer
        run: node scripts/verify-profitability-operating-layer.js

      - name: Verify website-to-Office quote delivery contract
        run: node scripts/verify-commercial-delivery-contract.js

      - name: Verify all eight examples CAD AI and module coverage
        run: node scripts/verify-commercial-full-demo-contract.js

      - name: Verify bounded full-demo gateway batches
        run: node scripts/verify-commercial-full-demo-bounds.js

      - name: Run commercial verification and capture report
        id: commercial
        shell: bash
        run: |
          set +e
          node scripts/verify-commercial-system.js > commercial-verification-report.txt 2>&1
          code=$?
          cat commercial-verification-report.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload commercial verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-verification-report
          path: commercial-verification-report.txt

      - name: Run rendered browser verification
        id: browser
        shell: bash
        run: |
          set +e
          bash scripts/browser-commercial-smoke.sh
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload rendered browser report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commercial-browser-artifacts
          path: browser-artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run existing repository tests and capture report
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest-report.txt 2>&1
          code=$?
          cat pytest-report.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload existing test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.txt

      - name: Enforce green verification
        shell: bash
        run: |
          test "${{ steps.commercial.outputs.exit_code }}" = "0"
          test "${{ steps.browser.outputs.exit_code }}" = "0"
          test "${{ steps.pytest.outputs.exit_code }}" = "0"
