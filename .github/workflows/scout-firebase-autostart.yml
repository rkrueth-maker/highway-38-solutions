name: H38 Scout Firebase Functional Crawl Autostart

on:
  push:
    branches:
      - agent/private-reseller-scout
    paths:
      - '.github/workflows/scout-firebase-autostart.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch authenticated Firebase crawl on private Scout branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'agent/private-reseller-scout'
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/scout-firebase-real-device.yml/dispatches" \
            -d '{"ref":"agent/private-reseller-scout","inputs":{"model":"r0q","version":"34","timeout":"30m"}}'
