name: H38 Deals v3.1.1 Full Hosted Render Repair

on:
  push:
    branches:
      - agent/private-reseller-scout
    paths:
      - native/h38-site-scanner/android-app/reseller/**
      - deals-app/acceptance-v311.sh
      - .github/workflows/h38-deals-v311-full-render.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h38-deals-v311-full-render
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      SB_URL: https://jqukmwtsgcsaruucnqja.supabase.co
      SB_KEY: sb_publishable_XrF41kGmTC2SmSTgPvo5OQ_vqcBd0N1
      SCOUT_EMAIL: ${{ secrets.H38_SCOUT_TEST_EMAIL }}
      SCOUT_PASSWORD: ${{ secrets.H38_SCOUT_TEST_PASSWORD }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      DEVICE_MODEL: r0q
      DEVICE_VERSION: '34'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze private branch and auth gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = agent/private-reseller-scout
          git fetch origin agent/private-reseller-scout
          test "$(git rev-parse origin/agent/private-reseller-scout)" = "$GITHUB_SHA"
          test -f native/h38-site-scanner/android-app/reseller/src/androidTest/java/com/highway38/resellerscout/HostedRenderInstrumentedTest.java
          test -f native/h38-site-scanner/android-app/reseller/src/androidTest/java/com/highway38/resellerscout/HostedAuthInstrumentedTest.java
          grep -Fq 'realCredentialsCreateSessionAndShowProductChooser' native/h38-site-scanner/android-app/reseller/src/androidTest/java/com/highway38/resellerscout/HostedAuthInstrumentedTest.java
          grep -Fq "data.h38LoginRepair==='v312'" native/h38-site-scanner/android-app/reseller/src/androidTest/java/com/highway38/resellerscout/HostedAuthInstrumentedTest.java
          test ! -e native/h38-site-scanner/android-app/reseller/src/main/java/com/highway38/resellerscout/NativeLoginOverlay.java

      - name: Validate v3.1.1 acceptance syntax
        shell: bash
        run: bash -n deals-app/acceptance-v311.sh

      - name: Run full live three-product acceptance
        shell: bash
        run: bash deals-app/acceptance-v311.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore persistent Scout signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: h38-reseller-scout-owner-debug-signing-v1

      - name: Build app, render test, auth test, and verify H38 Deals 3.1.1
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/v311"
          mkdir -p "$report"
          export H38_ANDROID_UPLOAD_KEYSTORE_PATH="$HOME/.android/debug.keystore"
          export H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD=android
          export H38_ANDROID_UPLOAD_KEY_ALIAS=androiddebugkey
          export H38_ANDROID_UPLOAD_KEY_PASSWORD=android
          cd "$GITHUB_WORKSPACE/native/h38-site-scanner/android-app"
          gradle --no-daemon clean :reseller:assembleOwner :reseller:assembleOwnerAndroidTest | tee "$report/compile.log"
          src=$(find reseller/build/outputs/apk -type f -path '*/owner/*.apk' ! -path '*/androidTest/*' | head -n1)
          test -f "$src"
          apk="$report/H38-Deals-3.1.1.apk"
          cp "$src" "$apk"
          test_src=$(find reseller/build/outputs/apk/androidTest -type f -name '*.apk' | head -n1)
          test -f "$test_src"
          test_apk="$report/H38-Deals-3.1.1-render-auth-test.apk"
          cp "$test_src" "$test_apk"
          echo "APP_APK=$apk" >> "$GITHUB_ENV"
          echo "TEST_APK=$test_apk" >> "$GITHUB_ENV"
          sha256sum "$apk" | tee "$report/sha256.txt"
          sha256sum "$test_apk" | tee "$report/test-sha256.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | tee "$report/badging.txt"
          grep -Fq "package: name='com.highway38.resellerscout.owner' versionCode='341' versionName='3.1.1'" "$report/badging.txt"
          grep -Fq "application-label:'H38 Deals'" "$report/badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" | tee "$report/signing.txt"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$report/signing.txt"
          cert=$(grep -m1 'Signer #1 certificate SHA-256 digest:' "$report/signing.txt" | awk '{print $NF}' | tr '[:upper:]' '[:lower:]')
          test "$cert" = cdabe362ad80788c4ac216a26a8dcc44174eceb3c380c3b4a126507af4043c46
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk" >/dev/null
          unzip -t "$apk" >/dev/null
          unzip -t "$test_apk" >/dev/null
          for dex in $(unzip -Z1 "$apk" | grep -E '^classes([0-9]*)?\.dex$'); do unzip -p "$apk" "$dex"; done | strings > "$report/dex.txt"
          grep -Fq 'H38_DEALS_THIN_SHELL_V311' "$report/dex.txt"
          grep -Fq 'H38_HOSTED_HTML_TRANSPORT_V311' "$report/dex.txt"
          grep -Fq 'H38_RAW_SOURCE_GUARD_V311' "$report/dex.txt"
          grep -Fq 'H38_HOSTED_CSP_REPAIR_V311' "$report/dex.txt"
          grep -Fq '/functions/v1/h38-deals-shell' "$report/dex.txt"
          grep -Fq '/functions/v1/h38-penny-web' "$report/dex.txt"
          grep -Fq '/functions/v1/h38-resale-web' "$report/dex.txt"
          grep -Fq '/functions/v1/h38-coupon-web' "$report/dex.txt"
          if grep -Fq 'H38_SCOUT_V263_PHYSICAL_BUNDLE_AUTHORITY' "$report/dex.txt"; then exit 1; fi
          echo APK_HOSTED_RENDER_TRANSPORT_PASS | tee "$report/apk-status.txt"

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Firebase physical rendered-DOM and real sign-in assertions
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/v311"
          test -n "$SCOUT_EMAIL"
          test -n "$SCOUT_PASSWORD"
          echo "::add-mask::$SCOUT_EMAIL"
          echo "::add-mask::$SCOUT_PASSWORD"
          gcloud firebase test android models describe "$DEVICE_MODEL" --format=yaml | tee "$report/device.yml"
          grep -qi PHYSICAL "$report/device.yml"
          gcloud firebase test android run \
            --project "$FIREBASE_PROJECT_ID" \
            --type instrumentation \
            --app "$APP_APK" \
            --test "$TEST_APK" \
            --environment-variables "^:^SCOUT_EMAIL=$SCOUT_EMAIL:SCOUT_PASSWORD=$SCOUT_PASSWORD" \
            --device "model=$DEVICE_MODEL,version=$DEVICE_VERSION,locale=en,orientation=portrait" \
            --timeout 6m \
            --results-history-name 'H38 Deals v3.1.1 Render And Sign-In Assertion' \
            --client-details matrixLabel='H38 Deals v3.1.1 rendered DOM and real sign-in assertion' \
            2>&1 | tee "$report/firebase-render-auth.log"
          grep -Eq 'Passed|PASSED' "$report/firebase-render-auth.log"
          if grep -E 'FATAL EXCEPTION|AndroidRuntime|ANR|FAILURES!!!|Failed[[:space:]]*\|' "$report/firebase-render-auth.log"; then exit 1; fi
          echo FIREBASE_PHYSICAL_RENDERED_DOM_AND_REAL_SIGNIN_PASS | tee "$report/firebase-render-auth-status.txt"

      - name: Firebase physical install and launch
        shell: bash
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/artifacts/v311"
          gcloud firebase test android run --project "$FIREBASE_PROJECT_ID" --type robo --app "$APP_APK" --device "model=$DEVICE_MODEL,version=$DEVICE_VERSION,locale=en,orientation=portrait" --timeout 5m --results-history-name 'H38 Deals v3.1.1 Full Hosted Render Repair' --client-details matrixLabel='H38 Deals v3.1.1 hosted render repair' 2>&1 | tee "$report/firebase.log"
          grep -Eq 'Passed|PASSED' "$report/firebase.log"
          if grep -E 'FATAL EXCEPTION|AndroidRuntime|ANR|FAILURES!!!|Failed[[:space:]]*\|' "$report/firebase.log"; then exit 1; fi
          echo FIREBASE_PHYSICAL_INSTALL_LAUNCH_PASS | tee "$report/firebase-status.txt"

      - name: Upload exact H38 Deals 3.1.1 APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h38-deals-3.1.1-full-render-auth
          path: artifacts/v311/**
          if-no-files-found: error
          retention-days: 30
