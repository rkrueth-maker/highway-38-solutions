name: Verify Website and Web App Change Governance

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/architecture/**'
      - 'scripts/verify-change-governance.js'
      - 'scripts/plan-change-verification.js'
      - 'scripts/config/approved-public-assets.json'
      - 'scripts/config/approved-public-image-placements.json'
      - 'scripts/config/public-website-routes.json'
      - 'assets/js/h38-site-v2.js'
      - 'assets/css/h38-site-v2.css'
      - 'apps-script/business-office/BusinessOffice_ModuleContract.gs'
      - 'apps-script/business-office/BusinessOffice_ActionContract.gs'
      - 'apps-script/core-engine/owner-portal-next/Portal_Module_Registry.js'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/deploy-owner-portal-hard-rule-production.yml'
      - '.github/workflows/change-governance.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: highway-38-change-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source with comparison history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build scope-aware verification plan
        env:
          H38_PLAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          H38_PLAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/plan-change-verification.js --base "$H38_PLAN_BASE" --head "$H38_PLAN_HEAD"

      - name: Verify repository-wide website and web app governance
        run: node scripts/verify-change-governance.js

      - name: Upload planning and governance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: change-governance-${{ github.run_id }}
          path: |
            artifacts/change-plan/
            artifacts/change-governance/
          if-no-files-found: warn
          retention-days: 90
