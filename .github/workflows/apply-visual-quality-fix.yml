name: Apply visual quality fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-visual-quality-fix.yml']
permissions:
  contents: write
  issues: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/visual-quality-gate
          fetch-depth: 0
      - name: Apply source, rule, and browser-gate repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          page=Path('sample-library-now.html')
          s=page.read_text()
          s=s.replace('assets/contractor-demo/flower-after-same-house.svg?v=20260724-same-house-v1','assets/contractor-demo/flower-after.png?v=20260722-exact')
          s=s.replace('alt="Flower garden after at the same house"','alt="Representative finished flower garden style"')
          s=s.replace('<figure><span>After</span><img src="assets/contractor-demo/flower-after.png?v=20260722-exact" alt="Representative finished flower garden style"></figure>','<figure><span>Representative Finished Style</span><img src="assets/contractor-demo/flower-after.png?v=20260722-exact" alt="Representative finished flower garden style"></figure>')
          s=s.replace('assets/demo-workthroughs/irrigation-before-clean.svg?v=20260724-clean-labels-v1','assets/demo-workthroughs/irrigation-before.webp?v=20260722-direct-v2')
          s=s.replace('assets/demo-workthroughs/irrigation-after-clean.svg?v=20260724-clean-labels-v1','assets/demo-workthroughs/irrigation-after.webp?v=20260722-direct-v2')
          old='<article class="project-card"><div class="project-visual"><figure><span>Before</span><img src="assets/demo-workthroughs/irrigation-before.webp'
          s=s.replace(old,old.replace('<article class="project-card">','<article class="project-card" data-project="irrigation">'))
          crop='.project-card[data-project="irrigation"] .project-visual figure{overflow:hidden}.project-card[data-project="irrigation"] .project-visual img{height:calc(100% + 54px);transform:translateY(-40px);object-fit:cover}'
          if 'data-project="irrigation"] .project-visual img' not in s:
            s=s.replace('</style></head>',crop+'</style></head>')
          s=s.replace('240 sq ft bed, sod removal, soil amendment, natural-stone edging, 25–30 plants, mulch, cleanup and closeout.','240 sq ft bed, sod removal, soil amendment, natural-stone edging, 25–30 plants, mulch, cleanup and closeout. Finished image is a representative style reference; the quote remains tied to the stated scope.')
          page.write_text(s)

          quote=Path('flower-garden-quote-complete.html')
          q=quote.read_text().replace('assets/contractor-demo/flower-after-same-house.svg?v=20260724-same-house-v1','assets/contractor-demo/flower-after.png?v=20260722-exact')
          q=q.replace('Finished concept</span><img src="assets/contractor-demo/flower-after.png?v=20260722-exact" alt="Finished flower garden concept at the same gray-sided house"','Representative finished style</span><img src="assets/contractor-demo/flower-after.png?v=20260722-exact" alt="Representative finished flower garden style"')
          q=q.replace('The same house and view with the quoted bed, plants, mulch, stone edging, and restoration shown.','Representative finished style showing the type of bed, plants, mulch, stone edging, and restoration included in the quoted scope; it is not presented as the same property.')
          quote.write_text(q)

          mp=Path('scripts/config/approved-public-image-placements.json')
          m=json.loads(mp.read_text())
          m['policyVersion']='2026-07-24-rendered-visual-acceptance-v4'
          for item in m['pages']['sample-library-now.html']:
            role=item.get('role')
            if role=='example-01-after':
              item['src']='assets/contractor-demo/flower-after.png'; item['alt']='Representative finished flower garden style'
            elif role=='example-06-before': item['src']='assets/demo-workthroughs/irrigation-before.webp'
            elif role=='example-06-after': item['src']='assets/demo-workthroughs/irrigation-after.webp'
          m.setdefault('placementChanges',[]).append({'date':'2026-07-24','page':'sample-library-now.html and flower-garden-quote-complete.html','section':'Flower and irrigation project visuals','oldPlacement':'Cartoon same-house SVG and nested irrigation SVG wrappers that rendered blank','newPlacement':'Direct raster project images; flower result explicitly labeled representative and irrigation labels cropped by the owning page','reason':'Live browser review found misleading continuity and blank rendered panels','binaryPolicy':'Uses existing repository raster images only; no remote fallback or nested raster SVG.'})
          mp.write_text(json.dumps(m,indent=2)+'\n')

          verifier=Path('scripts/verify-public-image-placements.js')
          v=verifier.read_text().replace("'irrigation-before-clean.svg','irrigation-after-clean.svg'","'irrigation-before.webp','irrigation-after.webp'")
          v=v.replace("check('public pages do not reference retired strip or sprite',!/(project-pairs-strip\\.svg|project-pairs-sprite\\.webp)/.test(samplePage+contractorPage));","check('public pages do not reference retired strip or sprite',!/(project-pairs-strip\\.svg|project-pairs-sprite\\.webp)/.test(samplePage+contractorPage));\ncheck('photographic cards do not use nested raster SVG wrappers',!/(irrigation-(?:before|after)-clean\\.svg|flower-after-same-house\\.svg)/.test(samplePage+contractorPage));\ncheck('representative flower result is honestly labeled',samplePage.includes('Representative Finished Style')&&contractorPage.includes('Representative finished style'));")
          verifier.write_text(v)

          pages=Path('.github/workflows/pages.yml')
          y=pages.read_text().replace('flower-after-same-house.svg','flower-after.png').replace('irrigation-before-clean.svg','irrigation-before.webp').replace('irrigation-after-clean.svg','irrigation-after.webp')
          y=y.replace("grep -Fq '$3,950' _site/sample-library-now.html","grep -Fq '$3,950' _site/sample-library-now.html\n          grep -Fq 'Representative Finished Style' _site/sample-library-now.html\n          ! grep -Eq 'irrigation-(before|after)-clean\\.svg|flower-after-same-house\\.svg' _site/sample-library-now.html")
          y=y.replace("&& grep -Fq '$3,950' <<<\"$examples\" \\","&& grep -Fq '$3,950' <<<\"$examples\" \\\n              && grep -Fq 'Representative Finished Style' <<<\"$examples\" \\\n              && ! grep -Eq 'irrigation-(before|after)-clean\\.svg|flower-after-same-house\\.svg' <<<\"$examples\" \\")
          pages.write_text(y)

          agents=Path('AGENTS.md')
          a=agents.read_text()
          gate='''\n## Rendered Visual Acceptance Gate\n\n1. Customer-facing visual changes must use a branch and pull request; do not commit them directly to `main`.\n2. Photographic cards must use directly renderable PNG, JPEG, or WebP files. SVG wrappers that embed raster photographs are prohibited.\n3. File existence, HTTP 200, valid signatures, and non-empty screenshot files do not prove an image rendered.\n4. Browser verification must check every customer-facing image for `complete`, nonzero `naturalWidth` and `naturalHeight`, successful canvas decoding, visible pixel variance, and nonblank alpha coverage.\n5. Project Examples requires full-page desktop and mobile screenshots from the PR build and cache-busted live deployment.\n6. Technical deployment PASS is not visual acceptance. Visual acceptance requires review of rendered screenshots.\n7. Before/after pairs must be the same property or object. When they are not, the page must visibly label the result as representative and must not imply same-site continuity.\n8. Cartoon, vector, blank, malformed, unrelated, or visibly unrealistic project imagery is a release blocker unless the page explicitly calls for an illustration.\n9. The browser regression workflow must run for visual changes and must be required before merge.\n'''
          if '## Rendered Visual Acceptance Gate' not in a: a=a.replace('## Image Verification Rules',gate+'\n## Image Verification Rules')
          agents.write_text(a)

          rules=Path('docs/architecture/PUBLIC_WEBSITE_CHANGE_RULES.md')
          r=rules.read_text()
          section='''## 2A. Rendered visual acceptance\n\n- All customer-facing visual changes require a pull request and browser-regression evidence.\n- Photographic content must use direct PNG, JPEG, or WebP files; nested raster photographs inside SVG are prohibited.\n- Browser checks must verify decode dimensions and nonblank pixel content for every project image.\n- Desktop and mobile screenshots must be reviewed before merge and after live deployment.\n- Technical deployment success is not visual acceptance.\n- Before/after continuity must be real; otherwise the visible label must say the result is representative.\n\n'''
          if '## 2A. Rendered visual acceptance' not in r: r=r.replace('## 3. Adding a page',section+'## 3. Adding a page')
          rules.write_text(r)

          smoke=Path('scripts/browser-commercial-smoke.sh')
          b=smoke.read_text().replace('irrigation-before.webp irrigation-after.webp','irrigation-before.webp irrigation-after.webp')
          anchor='pass "rendered Project Examples uses the six controlled deck irrigation and kitchen images"\n'
          block=r'''pass "rendered Project Examples uses the six controlled deck irrigation and kitchen images"
node <<'NODE'
const { chromium } = require('playwright');
(async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage({viewport:{width:1440,height:1200}});await page.goto('http://127.0.0.1:8000/sample-library-now.html',{waitUntil:'networkidle'});const rs=await page.$$eval('.project-visual img',imgs=>imgs.map(img=>{const c=document.createElement('canvas');c.width=Math.min(img.naturalWidth,160);c.height=Math.min(img.naturalHeight,90);const x=c.getContext('2d');let variance=-1,alpha=0;try{x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height).data;let s=0,s2=0,n=0;for(let i=0;i<d.length;i+=4){const v=(d[i]+d[i+1]+d[i+2])/3;s+=v;s2+=v*v;alpha+=d[i+3];n++;}variance=s2/n-(s/n)**2;}catch(e){}return{src:img.getAttribute('src'),complete:img.complete,w:img.naturalWidth,h:img.naturalHeight,variance,alpha};}));console.log(rs);for(const r of rs){if(!r.complete||r.w<100||r.h<100||r.variance<25||r.alpha<=0)throw new Error('Blank or undecoded project image '+JSON.stringify(r));}if(rs.some(r=>/clean\.svg|same-house\.svg/.test(r.src)))throw new Error('Nested raster SVG wrapper is prohibited');const text=await page.textContent('body');if(!text.includes('Representative Finished Style'))throw new Error('Representative visual is not visibly disclosed');await page.screenshot({path:'browser-artifacts/examples-visual-gate.png',fullPage:true});await browser.close();})().catch(e=>{console.error(e);process.exit(1)});
NODE
pass "every project image decodes with visible nonblank pixel content"
'''
          if 'every project image decodes with visible nonblank pixel content' not in b: b=b.replace(anchor,block)
          smoke.write_text(b)
          PY
          rm -f assets/contractor-demo/flower-after-same-house.svg assets/demo-workthroughs/irrigation-before-clean.svg assets/demo-workthroughs/irrigation-after-clean.svg
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix project visuals and require rendered visual acceptance'
          git push origin HEAD:repair/visual-quality-gate
      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ job.status }}" == success ]]; then
            gh issue edit 298 --repo "$GITHUB_REPOSITORY" --title 'Visual repair source update — PASS' --body "Repair branch updated with direct raster visuals and permanent rendered-image gates. Run ${GITHUB_RUN_ID}."
          else
            gh issue edit 298 --repo "$GITHUB_REPOSITORY" --title 'Visual repair source update — HOLD' --body "Source update failed. Run ${GITHUB_RUN_ID}."
          fi
