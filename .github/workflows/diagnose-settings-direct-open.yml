name: Diagnose Settings direct open

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/diagnose-settings-direct-open.js'
      - '.github/workflows/diagnose-settings-direct-open.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node scripts/diagnose-settings-direct-open.js
      - name: Upload Settings diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-mutation-diagnostic
          path: settings-diagnostic.json
          if-no-files-found: warn
