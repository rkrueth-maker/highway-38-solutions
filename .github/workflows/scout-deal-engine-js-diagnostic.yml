name: Scout Deal Engine JS Repair

on:
  push:
    branches:
      - agent/private-reseller-scout

permissions:
  contents: write

jobs:
  repair-and-parse:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Repair queue renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('supabase/functions/h38-deal-engine-web/index.ts')
          s=p.read_text()
          replacement=r'''function renderQueue(){
            const rows=(data&&data.queue)||[],box=$('queueList');
            let h='<h3 style="margin-top:0">Sourcing queue & inventory ('+rows.length+')</h3><p class="small muted">Profit is calculated by the database only when every required cost is entered. Blank means UNKNOWN, never $0.</p>';
            if(!rows.length){box.innerHTML=h+'<div class="empty">Nothing queued to buy.</div>';return}
            for(const q of rows){
              const i=intel.get(q.canonical_key),title=(i&&i.title)||q.item_title||String(q.canonical_key||'').replace(/^[^:]+:/,''),retailer=(i&&i.retailer)||q.retailer||'';
              h+='<details class="queuerow"><summary>'+esc(title)+'</summary>';
              h+='<div class="small muted">'+esc(retailer)+' · Qty '+esc(q.quantity)+' · '+esc(q.status)+' · updated '+esc(ago(q.updated_at))+'</div>';
              h+='<div class="queueMetrics"><div class="queueMetric"><b>'+money(q.projected_profit)+'</b><span class="tiny">PROJECTED PROFIT</span></div><div class="queueMetric"><b>'+pct(q.projected_roi_percent)+'</b><span class="tiny">PROJECTED ROI</span></div><div class="queueMetric"><b>'+money(q.max_buy_price)+'</b><span class="tiny">MAX BUY</span></div><div class="queueMetric"><b>'+money(q.realized_profit)+'</b><span class="tiny">REALIZED PROFIT</span></div></div>';
              h+='<div class="formgrid"><div><div class="fieldlabel">Status</div><select class="queueStatus" data-id="'+esc(q.id)+'"><option value="planned"'+(q.status==='planned'?' selected':'')+'>Planned</option><option value="purchased"'+(q.status==='purchased'?' selected':'')+'>Purchased</option><option value="listed"'+(q.status==='listed'?' selected':'')+'>Listed</option><option value="sold"'+(q.status==='sold'?' selected':'')+'>Sold</option><option value="cancelled"'+(q.status==='cancelled'?' selected':'')+'>Cancelled</option></select></div>';
              h+=qInput(q.id,'quantity','Quantity',q.quantity)+qInput(q.id,'unit_buy_price','Planned buy / item',q.unit_buy_price==null?q.estimated_cost:q.unit_buy_price)+qInput(q.id,'coupon_amount','Coupons total',q.coupon_amount)+qInput(q.id,'rebate_amount','Rebates total',q.rebate_amount)+qInput(q.id,'sales_tax','Sales tax',q.sales_tax)+qInput(q.id,'travel_cost','Travel allocated',q.travel_cost)+qInput(q.id,'expected_sale_price','Expected sale price',q.expected_sale_price)+qInput(q.id,'marketplace_fee','Marketplace fee',q.marketplace_fee)+qInput(q.id,'payment_fee','Payment fee',q.payment_fee)+qInput(q.id,'outbound_shipping','Outbound shipping',q.outbound_shipping)+qInput(q.id,'packing_cost','Packing cost',q.packing_cost)+qInput(q.id,'target_roi_percent','Target ROI %',q.target_roi_percent);
              h+=qText(q.id,'listing_marketplace','Listing marketplace',q.listing_marketplace,'eBay / Facebook / Mercari')+qText(q.id,'listing_url','Listing URL',q.listing_url,'https://')+qInput(q.id,'listing_price','Listing price',q.listing_price)+qText(q.id,'storage_location','Storage location',q.storage_location,'Shelf / bin');
              h+=qInput(q.id,'actual_cost','Actual total acquisition cost',q.actual_cost)+qInput(q.id,'actual_sale_price','Actual sale price',q.actual_sale_price)+qInput(q.id,'actual_marketplace_fee','Actual marketplace fee',q.actual_marketplace_fee)+qInput(q.id,'actual_payment_fee','Actual payment fee',q.actual_payment_fee)+qInput(q.id,'actual_shipping','Actual shipping',q.actual_shipping)+qInput(q.id,'actual_packing_cost','Actual packing',q.actual_packing_cost);
              h+='<button class="primary wide saveQueue" data-id="'+esc(q.id)+'" type="button">Save economics / lifecycle</button></div>';
              h+='<div class="small muted" style="margin-top:8px">Break-even '+money(q.break_even_price)+' · margin '+pct(q.projected_margin_percent)+' · purchased '+esc(q.purchased_at?ago(q.purchased_at):'not recorded')+' · listed '+esc(q.listed_at?ago(q.listed_at):'not recorded')+' · sold '+esc(q.sold_at?ago(q.sold_at):'not recorded')+'</div></details>';
            }
            box.innerHTML=h;
            document.querySelectorAll('.queueStatus').forEach(el=>el.addEventListener('change',()=>saveQueue(el.dataset.id)));
            document.querySelectorAll('.saveQueue').forEach(el=>el.addEventListener('click',()=>saveQueue(el.dataset.id)));
          }'''
          n=re.subn(r'function renderQueue\(\)\{[\s\S]*?\}\nasync function saveQueue',replacement+'\nasync function saveQueue',s,count=1)
          if n[1]!=1: raise SystemExit('renderQueue replacement count='+str(n[1]))
          p.write_text(n[0])
          PY
      - name: Build and parse repaired page
        run: |
          node scripts/build-scout-static-web.cjs /tmp/h38-scout-web
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('/tmp/h38-scout-web/best.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)
          js=max(scripts,key=len)
          Path('/tmp/h38-deal-engine-inline.js').write_text(js)
          PY
          node --check /tmp/h38-deal-engine-inline.js
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo 'No repair needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/h38-deal-engine-web/index.ts
          git commit -m 'Fix Deal Engine queue renderer syntax'
          git push origin HEAD:agent/private-reseller-scout
