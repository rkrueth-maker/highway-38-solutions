name: Apply New-House Scope Fix
on:
  pull_request:
    paths:
      - 'scripts/fix-new-house-demo-scope.js'
      - 'scripts/repair-new-house-cad-output.js'
      - 'docs/quote-builder/NEW_HOUSE_DEMO_SCOPE_LOCK.md'
      - '.github/workflows/apply-new-house-scope-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: new-house-scope-fix
  cancel-in-progress: true
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-new-house-scope-cad
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply locked ground-up scope
        run: |
          node scripts/fix-new-house-demo-scope.js
          node scripts/repair-new-house-cad-output.js
      - name: Commit corrected package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add whole-house-quote-package.html assets/quote-builder/whole-house-cad
          if git diff --cached --quiet; then
            echo 'No generated corrections.'
          else
            git commit -m 'Correct demo to ground-up new-house construction'
            git pull --rebase origin agent/fix-new-house-scope-cad
            git push origin HEAD:agent/fix-new-house-scope-cad
          fi
      - name: Validate scope and drawings
        run: |
          grep -q 'New-House Construction<br>From Lot Clearing to Closeout' whole-house-quote-package.html
          grep -q '$602,050' whole-house-quote-package.html
          grep -q "title:'Lot Clearing, Grubbing & Erosion Control'" whole-house-quote-package.html
          ! grep -q 'Whole-House Renovation' whole-house-quote-package.html
          ! grep -q "title:'Selective Demolition'" whole-house-quote-package.html
          ! grep -R -q 'Whole-House Renovation' assets/quote-builder/whole-house-cad
          for sheet in M-101 P-101 E-101; do
            test "$(grep -o 'id=\"architectural-underlay\"' "assets/quote-builder/whole-house-cad/${sheet}.svg" | wc -l)" -eq 1
          done
          grep -q 'APPROVED CLEARING / DISTURBANCE LIMIT' assets/quote-builder/whole-house-cad/C-S-L-101.svg
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils librsvg2-bin
          mkdir -p /tmp/new-house-cad
          for sheet in assets/quote-builder/whole-house-cad/*.svg; do
            xmllint --noout "$sheet"
            name="$(basename "$sheet" .svg)"
            rsvg-convert --width 1700 --height 1100 "$sheet" -o "/tmp/new-house-cad/${name}.png"
          done
          test "$(find /tmp/new-house-cad -name '*.png' | wc -l)" -eq 10