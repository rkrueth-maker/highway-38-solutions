name: Repair Reseller Scout PennyCentral parser

on:
  push:
    branches:
      - agent/private-reseller-scout
    paths:
      - '.github/workflows/reseller-penny-parser-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-private-reseller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/private-reseller-scout
          fetch-depth: 0

      - name: Repair PennyCentral extraction only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('supabase/functions/reseller-auto-leads/index.ts')
          src = p.read_text()
          old = '''function pennyCentral(h:string,s:any){const x=lines(h),out:any[]=[];for(let i=0;i<x.length;i++){const m=x[i].match(/^SKU\\s+([0-9][0-9-]{4,20})$/i);if(!m)continue;const sku=m[1],id=sku.replace(/\\D/g,"");if(id.length<5)continue;let title="",was=0,reports=0,states=0,last="Recent",summary="";for(let j=i-1;j>=Math.max(0,i-8);j--){const p=[...x[j].matchAll(/\\$\\s*([0-9,.]+)/g)].map(z=>Number(z[1].replace(/,/g,"")));if(p.length){was=Math.max(was,...p);continue}if(!title&&useful(x[j])&&!/^SKU\\s+/i.test(x[j]))title=x[j]}for(let j=i+1;j<=Math.min(x.length-1,i+18);j++){if(/^Last seen:?$/i.test(x[j])&&x[j+1])last=x[j+1];const r=x[j].match(/^(\\d{1,5})\\s+reports?$/i),st=x[j].match(/^(\\d{1,3})\\s+states?$/i);if(r)reports=Number(r[1]);if(st)states=Number(st[1]);if(!summary&&/^(?:[A-Z]{2}\\s+\\d+\\s*)+(?:\\+\\d+ more)?$/i.test(x[j]))summary=x[j]}if(!title)continue;out.push({id:`home-depot:${id}`,retailer:"Home Depot",title,sku,upc:"",buy_price: 0,reported_penny_price: 0.01,original_price:was,discount_pct:was>.01?Math.round((1-.01/was)*100):99,deep_discount:true,deal_type:"penny",penny_date:last,community_penny: true,community_reports: reports,community_states: states,state_summary:summary,source_name:s.name,source_url:s.url,home_depot_search_url:`https://www.homedepot.com/s/${encodeURIComponent(id)}`,availability_label:`Community penny candidate · ${reports||1} report${reports===1?"":"s"}${states?` · ${states} states`:""} · last seen ${last}. Not a confirmed local $0.01 price until the opened store check verifies it.`,resale_potential:score(title,99,"penny"),source_priority:s.priority,stock_status:"not_checked",stock_count:null,stock_checked:false})}return out}'''
          new = '''function pennyCentral(h:string,s:any){const x=lines(h),out:any[]=[],seen=new Set<string>();function add(sku0:string,block0:string,title0=""){const sku=clean(sku0).replace(/\\s+/g,""),id=sku.replace(/\\D/g,"");if(id.length<5||seen.has(id))return;const block=clean(block0);if(!/\\$\\s*0\\.01\\b/i.test(block))return;let title=clean(title0).replace(/\\$\\s*[0-9,.]+/g," ").replace(/\\b(?:SKU|Last seen|Report Find|Home Depot|Check Amazon|Fresh signal)\\b[\\s\\S]*$/i,"").replace(/^(?:Hot Right Now|Image:)\\s*/i,"");if(title.length>220)title=title.slice(-220).replace(/^\\S+\\s+/,"");if(!useful(title))title=`Home Depot penny candidate SKU ${sku}`;const prices=[...block.matchAll(/\\$\\s*([0-9,.]+)/g)].map(z=>Number(z[1].replace(/,/g,""))).filter(n=>Number.isFinite(n)&&n>.01&&n<100000),was=prices.length?Math.max(...prices):0;const lm=block.match(/Last seen\\s*:?\\s*([^·|]{1,48})/i),rm=block.match(/(\\d{1,5})\\s+reports?\\b/i),sm=block.match(/(\\d{1,3})\\s+states?\\b/i);const last=clean(lm?.[1]||"Recent"),reports=Number(rm?.[1]||0),states=Number(sm?.[1]||0);const ss=block.match(/((?:[A-Z]{2}\\s+\\d+\\s*){1,12}(?:\\+\\d+ more)?)/),summary=clean(ss?.[1]||"");seen.add(id);out.push({id:`home-depot:${id}`,retailer:"Home Depot",title,sku,upc:"",buy_price:0,reported_penny_price:0.01,original_price:was,discount_pct:was>.01?Math.round((1-.01/was)*100):99,deep_discount:true,deal_type:"penny",penny_date:last,community_penny:true,community_reports:reports,community_states:states,state_summary:summary,source_name:s.name,source_url:s.url,home_depot_search_url:`https://www.homedepot.com/s/${encodeURIComponent(id)}`,availability_label:`Community penny candidate · ${reports||1} report${reports===1?"":"s"}${states?` · ${states} states`:""} · last seen ${last}. Not a confirmed local $0.01 price until the opened store check verifies it.`,resale_potential:score(title,99,"penny"),source_priority:s.priority,stock_status:"not_checked",stock_count:null,stock_checked:false})}for(let i=0;i<x.length;i++){for(const m of x[i].matchAll(/\\bSKU\\s*[:#]?\\s*([0-9][0-9-]{4,20})\\b/gi)){const before=x.slice(Math.max(0,i-5),i+1).join(" "),after=x.slice(i,Math.min(x.length,i+9)).join(" "),prefix=clean(x[i].slice(0,m.index??0));add(m[1],before+" "+after,prefix)}}if(out.length<3){const flat=text(h);for(const m of flat.matchAll(/\\bSKU\\s*[:#]?\\s*([0-9][0-9-]{4,20})\\b/gi)){const at=m.index??0,pre=flat.slice(Math.max(0,at-420),at),post=flat.slice(at,Math.min(flat.length,at+520));add(m[1],pre+" "+post,"")}}console.log("pennycentral-parser-v2",JSON.stringify({html_bytes:h.length,line_count:x.length,parsed:out.length}));return out}'''
          if old not in src:
              raise SystemExit('Expected old PennyCentral parser was not found; refusing broad rewrite')
          src = src.replace(old, new, 1)
          src = src.replace('multi-retailer-plus-home-depot-penny-v1', 'multi-retailer-plus-home-depot-penny-v2', 2)
          src = src.replace('H38ResellerScout/0.1.14', 'H38ResellerScout/0.1.15', 1)
          p.write_text(src)

          # Narrow regression: the new parser must recognize SKU when the card fields share a line.
          assert 'pennycentral-parser-v2' in src
          assert 'matchAll(/\\\\bSKU' not in src  # source contains a normal TS regex, not a double-escaped runtime regex
          assert 'matchAll(/\\bSKU\\s*[:#]?' in src
          assert 'Home Depot penny candidate SKU' in src
          assert 'reported_penny_price:0.01' in src
          assert 'community_penny:true' in src
          assert 'multi-retailer-plus-home-depot-penny-v2' in src
          PY

          git diff --check
          git diff -- supabase/functions/reseller-auto-leads/index.ts

      - name: Commit parser repair to private branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'H38 Recovery Bot'
          git config user.email 'highway38solutions@gmail.com'
          git add supabase/functions/reseller-auto-leads/index.ts
          git commit -m 'Repair PennyCentral live penny extraction'
          git push origin HEAD:agent/private-reseller-scout
