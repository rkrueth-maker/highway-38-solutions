name: Deploy Highway 38 site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: highway-38-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_ROOT: https://rkrueth-maker.github.io/highway-38-solutions
    steps:
      - name: Record deployment start
        shell: bash
        run: |
          gh issue edit 284 --repo "$GITHUB_REPOSITORY" \
            --title 'GitHub Pages flush and live verification — RUNNING' \
            --body "Deploying commit ${GITHUB_SHA}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify public website and images
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-public-website-architecture.js
          node scripts/verify-public-image-placements.js
          python3 scripts/verify-public-images.py

      - name: Stage verified public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -avm --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='deployment-status/' \
            --exclude='logs/' \
            --exclude='reports/' \
            --exclude='shopify/' \
            --exclude='modules/' \
            --exclude='tests/' \
            --exclude='scripts/' \
            --include='*/' \
            --include='*.html' \
            --include='*.css' \
            --include='*.js' \
            --include='*.json' \
            --include='*.xml' \
            --include='*.txt' \
            --include='*.ico' \
            --include='*.png' \
            --include='*.jpg' \
            --include='*.jpeg' \
            --include='*.gif' \
            --include='*.webp' \
            --include='*.svg' \
            --include='*.woff' \
            --include='*.woff2' \
            --include='*.ttf' \
            --include='*.eot' \
            --include='*.pdf' \
            --include='*.csv' \
            --exclude='*' \
            ./ _site/

          sha="$(git rev-parse HEAD)"
          short_sha="${sha:0:12}"
          SHA="$short_sha" python3 scripts/build-public-site.py _site
          printf '%s\n' "$sha" > _site/deployed-main-sha.txt

          test -f _site/sample-library-now.html
          test -f _site/flower-garden-quote-complete.html
          test -f _site/assets/contractor-demo/flower-after-same-house.webp
          test -f _site/assets/demo-workthroughs/irrigation-before-clean.webp
          test -f _site/assets/demo-workthroughs/irrigation-after-clean.webp
          grep -Fq 'assets/contractor-demo/flower-after-same-house.webp' _site/sample-library-now.html
          grep -Fq 'assets/demo-workthroughs/irrigation-before-clean.webp' _site/sample-library-now.html
          grep -Fq 'assets/demo-workthroughs/irrigation-after-clean.webp' _site/sample-library-now.html
          ! grep -Eq 'flower-after-same-house\.svg|irrigation-(before|after)-clean\.svg' _site/sample-library-now.html
          grep -Fq 'Flower garden after at the same house' _site/sample-library-now.html
          grep -Fq '$3,950' _site/sample-library-now.html
          grep -Fq '$3,950.00' _site/flower-garden-quote-complete.html
          grep -Fq 'Natural-stone curved bed edge shown in concept' _site/flower-garden-quote-complete.html
          grep -Fq "assets/js/h38-site-v2.js?v=${short_sha}" _site/sample-library-now.html
          grep -Fq "contractor-demo.css?v=${short_sha}" _site/sample-library-now.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages artifact
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Verify live deployment source and direct assets
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          short_sha="${expected:0:12}"
          marker="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          for attempt in $(seq 1 30); do
            echo "Verification attempt ${attempt}/30"
            live_sha="$(curl -fsSL --connect-timeout 15 "${LIVE_ROOT}/deployed-main-sha.txt?flush=${marker}-${attempt}" || true)"
            examples="$(curl -fsSL --connect-timeout 15 "${LIVE_ROOT}/sample-library-now.html?flush=${marker}-${attempt}" || true)"
            flower_quote="$(curl -fsSL --connect-timeout 15 "${LIVE_ROOT}/flower-garden-quote-complete.html?flush=${marker}-${attempt}" || true)"
            flower_ok=0
            irrigation_before_ok=0
            irrigation_after_ok=0
            curl -fsSL --connect-timeout 15 "${LIVE_ROOT}/assets/contractor-demo/flower-after-same-house.webp?flush=${marker}-${attempt}" -o /tmp/flower-after-same-house.webp && [[ "$(wc -c </tmp/flower-after-same-house.webp)" -gt 10000 ]] && flower_ok=1
            curl -fsSL --connect-timeout 15 "${LIVE_ROOT}/assets/demo-workthroughs/irrigation-before-clean.webp?flush=${marker}-${attempt}" -o /tmp/irrigation-before-clean.webp && [[ "$(wc -c </tmp/irrigation-before-clean.webp)" -gt 10000 ]] && irrigation_before_ok=1
            curl -fsSL --connect-timeout 15 "${LIVE_ROOT}/assets/demo-workthroughs/irrigation-after-clean.webp?flush=${marker}-${attempt}" -o /tmp/irrigation-after-clean.webp && [[ "$(wc -c </tmp/irrigation-after-clean.webp)" -gt 10000 ]] && irrigation_after_ok=1

            if [[ "$live_sha" == "$expected" ]] \
              && grep -Fq "assets/js/h38-site-v2.js?v=${short_sha}" <<<"$examples" \
              && grep -Fq "contractor-demo.css?v=${short_sha}" <<<"$examples" \
              && grep -Fq 'assets/contractor-demo/flower-after-same-house.webp' <<<"$examples" \
              && grep -Fq 'assets/demo-workthroughs/irrigation-before-clean.webp' <<<"$examples" \
              && grep -Fq 'assets/demo-workthroughs/irrigation-after-clean.webp' <<<"$examples" \
              && ! grep -Eq 'flower-after-same-house\.svg|irrigation-(before|after)-clean\.svg' <<<"$examples" \
              && grep -Fq 'Flower garden after at the same house' <<<"$examples" \
              && grep -Fq '$3,950' <<<"$examples" \
              && grep -Fq '$3,950.00' <<<"$flower_quote" \
              && grep -Fq 'Natural-stone curved bed edge shown in concept' <<<"$flower_quote" \
              && [[ "$flower_ok" -eq 1 ]] \
              && [[ "$irrigation_before_ok" -eq 1 ]] \
              && [[ "$irrigation_after_ok" -eq 1 ]]; then
              exit 0
            fi
            sleep 10
          done

          echo 'The GitHub Pages CDN did not serve the repaired verified artifact before timeout.'
          exit 1

      - name: Install live visual verification dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m pip install --disable-pip-version-check pillow

      - name: Capture and verify live Project Examples pixels
        run: |
          node scripts/capture-project-example-images.js "${LIVE_ROOT}"
          python3 scripts/verify-rendered-project-images.py browser-artifacts/project-images

      - name: Upload website verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-website-${{ github.run_id }}
          path: |
            artifacts/public-website-architecture/
            artifacts/public-image-placements/
            browser-artifacts/project-images/
          if-no-files-found: warn
          retention-days: 90

      - name: Record technical PASS
        if: success()
        shell: bash
        run: |
          body="TECHNICAL PASS — GitHub Pages is serving commit ${GITHUB_SHA}; direct-raster and rendered-pixel checks passed. The flower example uses the same house, its $3,950 quote includes the visible stone edging and closeout work, and the irrigation cards use label-free raster crops. Owner visual acceptance remains separate. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue edit 284 --repo "$GITHUB_REPOSITORY" --title 'GitHub Pages technical verification — PASS; visual acceptance pending owner review' --body "$body"
          gh issue close 284 --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Record HOLD
        if: failure()
        shell: bash
        run: |
          body="HOLD — Public website verification, rendered-pixel verification, or deployment failed for commit ${GITHUB_SHA}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue edit 284 --repo "$GITHUB_REPOSITORY" --title 'GitHub Pages architecture and live verification — HOLD' --body "$body"
