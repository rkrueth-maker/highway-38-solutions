name: Deploy Highway 38 site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: highway-38-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Record deployment start
        run: |
          gh issue edit 284 --repo "$GITHUB_REPOSITORY" \
            --title 'GitHub Pages deployment — BUILDING' \
            --body "Building commit ${GITHUB_SHA}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify public source
        run: |
          set -euo pipefail
          node scripts/verify-public-website-architecture.js
          node scripts/verify-public-image-placements.js
          python3 scripts/verify-public-images.py
          node scripts/verify-field-visit-offline-autofill.js
          node scripts/verify-h38-site-scanner.js

      - name: Stage public website and Business Office
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -avm --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='_site/' \
            --exclude='__pycache__/' \
            --exclude='apps-script/' \
            --exclude='artifacts/' \
            --exclude='browser-artifacts/' \
            --exclude='businesses/' \
            --exclude='coverage/' \
            --exclude='deployment-status/' \
            --exclude='docs/' \
            --exclude='logs/' \
            --exclude='modules/' \
            --exclude='native/' \
            --exclude='node_modules/' \
            --exclude='packages/' \
            --exclude='reports/' \
            --exclude='scripts/' \
            --exclude='shopify/' \
            --exclude='supabase/' \
            --exclude='tests/' \
            --exclude='tmp/' \
            --include='*/' \
            --include='*.html' \
            --include='*.css' \
            --include='*.js' \
            --include='*.json' \
            --include='*.xml' \
            --include='*.txt' \
            --include='*.ico' \
            --include='*.png' \
            --include='*.jpg' \
            --include='*.jpeg' \
            --include='*.gif' \
            --include='*.webp' \
            --include='*.svg' \
            --include='*.woff' \
            --include='*.woff2' \
            --include='*.ttf' \
            --include='*.eot' \
            --include='*.pdf' \
            --include='*.csv' \
            --exclude='*' \
            ./ _site/

          sha="$(git rev-parse HEAD)"
          short_sha="${sha:0:12}"
          SHA="$short_sha" python3 scripts/build-public-site.py _site
          printf '%s\n' "$sha" > _site/deployed-main-sha.txt

          test -f _site/index.html
          test -f _site/sample-library-now.html
          test -f _site/commercial-app/index.html
          test -f _site/commercial-app/field-visit.js
          test -f _site/commercial-app/field-visit-ui.js
          test -f _site/commercial-app/field-visit-core.js
          test -f _site/commercial-app/field-visit.css
          test -f _site/.well-known/assetlinks.json
          grep -Fq 'companyCamStyle:true' _site/commercial-app/field-visit.js
          grep -Fq 'More quote tools' _site/commercial-app/field-visit.js
          grep -Fq 'Apple LiDAR/RoomPlan' _site/commercial-app/field-visit-ui.js
          grep -Fq 'Take Site Photos' _site/commercial-app/field-visit-ui.js

          staged_bytes="$(du -sb _site | cut -f1)"
          staged_files="$(find _site -type f | wc -l)"
          printf 'files=%s\nbytes=%s\n' "$staged_files" "$staged_bytes" | tee pages-build-report.txt
          test "$staged_bytes" -lt 50000000
          test ! -e _site/_site
          test ! -e _site/apps-script
          test ! -e _site/native
          test ! -e _site/supabase
          test ! -e _site/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: pages-build-${{ github.run_id }}
          path: |
            pages-build-report.txt
            artifacts/public-website-architecture/
            artifacts/public-image-placements/
          if-no-files-found: warn
          retention-days: 90

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
          error_count: 30

  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out accepted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify live custom-domain deployment
        env:
          LIVE_ROOT: https://highway38solutions.com
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          marker="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in $(seq 1 40); do
            live_sha="$(curl -fsSL --connect-timeout 15 "${LIVE_ROOT}/deployed-main-sha.txt?flush=${marker}-${attempt}" || true)"
            field_flow="$(curl -fsSL --connect-timeout 15 "${LIVE_ROOT}/commercial-app/field-visit.js?flush=${marker}-${attempt}" || true)"
            field_ui="$(curl -fsSL --connect-timeout 15 "${LIVE_ROOT}/commercial-app/field-visit-ui.js?flush=${marker}-${attempt}" || true)"
            office="$(curl -fsSL --connect-timeout 15 "${LIVE_ROOT}/commercial-app/?flush=${marker}-${attempt}" || true)"
            examples="$(curl -fsSL --connect-timeout 15 "${LIVE_ROOT}/sample-library-now.html?flush=${marker}-${attempt}" || true)"
            if [[ "$live_sha" == "$expected" ]] \
              && grep -Fq 'companyCamStyle:true' <<<"$field_flow" \
              && grep -Fq 'More quote tools' <<<"$field_flow" \
              && grep -Fq 'Apple LiDAR/RoomPlan' <<<"$field_ui" \
              && grep -Fq 'Take Site Photos' <<<"$field_ui" \
              && grep -Fq 'Highway 38 Business Office' <<<"$office" \
              && grep -Fq 'Project Examples' <<<"$examples"; then
              exit 0
            fi
            sleep 10
          done
          echo 'The custom domain did not serve the accepted field-flow commit before timeout.'
          exit 1

      - name: Record technical PASS
        run: |
          body="TECHNICAL PASS — The custom domain is serving commit ${GITHUB_SHA}; the field-first quote flow and Android/Apple capture routing passed. Nothing is automatically approved or sent. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue edit 284 --repo "$GITHUB_REPOSITORY" --title 'GitHub Pages technical verification — PASS' --body "$body"
          gh issue close 284 --repo "$GITHUB_REPOSITORY" --reason completed
        env:
          GH_TOKEN: ${{ github.token }}

  record-hold:
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure' || needs.verify-live.result == 'failure') }}
    needs: [build, deploy, verify-live]
    runs-on: ubuntu-latest
    steps:
      - name: Record HOLD
        run: |
          body="HOLD — Pages build=${{ needs.build.result }}, deploy=${{ needs.deploy.result }}, verify=${{ needs.verify-live.result }} for commit ${GITHUB_SHA}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue edit 284 --repo "$GITHUB_REPOSITORY" --title 'GitHub Pages deployment — HOLD' --body "$body"
        env:
          GH_TOKEN: ${{ github.token }}
