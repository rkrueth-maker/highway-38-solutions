name: H38SiteScannerIOS

options:
  bundleIdPrefix: com.highway38
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: 5.0

targets:
  H38SiteScannerIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: H38SiteScannerIOS
      - path: ../ios/H38SiteScannerBridge.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.highway38.sitescanner
        PRODUCT_NAME: H38 Site Scanner
        MARKETING_VERSION: 0.5.35
        CURRENT_PROJECT_VERSION: 40
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: H38 Site Scanner
        INFOPLIST_KEY_NSCameraUsageDescription: H38 Site Scanner uses the camera for Site Visit photos, video, and LiDAR room scanning.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: H38 Site Scanner uses the microphone for narrated Site Visits and meeting notes.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
