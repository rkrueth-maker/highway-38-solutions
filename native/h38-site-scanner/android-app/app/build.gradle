plugins {
    id 'com.android.application'
}

// v0.5.14 physical-phone rollback to the proven single-return Android system video intent.
def releaseKeystorePath = System.getenv('H38_ANDROID_UPLOAD_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('H38_ANDROID_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = System.getenv('H38_ANDROID_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [
        releaseKeystorePath,
        releaseKeystorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.highway38.sitescanner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.highway38.sitescanner'
        minSdk 24
        targetSdk 35
        versionCode 19
        versionName '0.5.14'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
        owner {
            initWith release
            applicationIdSuffix '.test'
            versionNameSuffix '-owner'
            matchingFallbacks = ['release']
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.credentials:credentials:1.6.0-beta02'
    implementation 'androidx.credentials:credentials-play-services-auth:1.6.0-beta02'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-video:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'
    implementation 'com.google.ar:core:1.54.0'
}
