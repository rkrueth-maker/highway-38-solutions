plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('H38_ANDROID_UPLOAD_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('H38_ANDROID_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = System.getenv('H38_ANDROID_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.highway38.resellerscout'
    compileSdk 36
    defaultConfig {
        applicationId 'com.highway38.resellerscout'
        minSdk 24
        targetSdk 36
        versionCode 53
        versionName '0.1.52'
    }
    signingConfigs {
        // Owner-test APKs must remain broadly installable even when CI falls back
        // to Android's ephemeral debug key. Explicitly include both legacy JAR/v1
        // and APK Signature Scheme v2 so Package Installer does not depend on AGP's
        // automatic scheme selection for minSdk 24+ builds.
        debug {
            enableV1Signing true
            enableV2Signing true
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug {
            // Use a completely fresh install namespace for this recovery build so
            // Android cannot interpret it as an update to any prior owner-test APK
            // signed by a different ephemeral CI debug certificate.
            applicationIdSuffix '.owner52fix'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// v0.1.52 is an install-compatibility recovery build. Product behavior remains
// the accepted v0.1.51 candidate: v049 UI/runtime followed by the narrow v051
// artifact/photo repair. Both runtimes remain embedded into the merged APK page
// so neither can resolve against the remote base URL.
def injectH38V052 = {
    def v049File = file('src/main/assets/reseller/v049-runtime.js')
    def v051File = file('src/main/assets/reseller/v051-runtime.js')
    if (!v049File.isFile()) throw new GradleException('Missing reseller/v049-runtime.js for v0.1.52 foundation')
    if (!v051File.isFile()) throw new GradleException('Missing reseller/v051-runtime.js for v0.1.52 repair')
    def v049 = v049File.getText('UTF-8')
    def v051 = v051File.getText('UTF-8')
    def marker = 'data-h38-v052-runtime="bundled-v049-plus-v051-installfix"'
    def tag = '<script ' + marker + '>window.addEventListener("load",function(){\n' + v049 + '\n' + v051 + '\nwindow.H38_V052_RUNTIME_HANDOFF="bundled-v049-plus-v051-installfix";\n},{once:true});</script>'
    def matches = fileTree(layout.buildDirectory.get().asFile).matching { include '**/reseller/index.html' }.files
    if (matches.empty) throw new GradleException('Could not locate merged reseller/index.html for v0.1.52 runtime injection')
    matches.each { File indexFile ->
        def html = indexFile.getText('UTF-8')
        html = html.replace('<script src="v049-runtime.js"></script>', '')
        html = html.replace('<script src="v051-runtime.js"></script>', '')
        if (!html.contains(marker)) {
            def next = html.replace('</body>', tag + '\n</body>')
            if (next == html) throw new GradleException('Merged reseller/index.html has no </body> for v0.1.52 injection')
            indexFile.write(next, 'UTF-8')
        } else {
            indexFile.write(html, 'UTF-8')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'mergeDebugAssets' || task.name == 'mergeReleaseAssets') {
        task.doLast { injectH38V052() }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
