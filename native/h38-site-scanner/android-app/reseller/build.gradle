import java.util.Base64

plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('H38_ANDROID_UPLOAD_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('H38_ANDROID_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = System.getenv('H38_ANDROID_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

def resellerIconB64 = file('src/main/res/drawable/reseller_scout_icon.b64')
def resellerIconPng = file('src/main/res/drawable/reseller_scout_icon.png')
tasks.register('prepareResellerScoutIcon') {
    inputs.file(resellerIconB64)
    outputs.file(resellerIconPng)
    doLast {
        if (!resellerIconB64.exists()) throw new GradleException('Reseller Scout icon source is missing.')
        resellerIconPng.parentFile.mkdirs()
        def encoded = resellerIconB64.getText('UTF-8').replaceAll('\\s+', '')
        resellerIconPng.bytes = Base64.getDecoder().decode(encoded)
    }
}

tasks.configureEach { task ->
    if (task.name == 'preBuild') task.dependsOn('prepareResellerScoutIcon')
}

android {
    namespace 'com.highway38.resellerscout'
    compileSdk 36
    defaultConfig {
        applicationId 'com.highway38.resellerscout'
        minSdk 24
        targetSdk 36
        versionCode 22
        versionName '0.1.21'
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
