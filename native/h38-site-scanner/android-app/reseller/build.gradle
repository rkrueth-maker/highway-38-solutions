plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('H38_ANDROID_UPLOAD_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('H38_ANDROID_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = System.getenv('H38_ANDROID_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.highway38.resellerscout'
    compileSdk 36
    defaultConfig {
        applicationId 'com.highway38.resellerscout'
        minSdk 24
        targetSdk 36
        versionCode 51
        versionName '0.1.50'
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.owner50'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// v0.1.50 fixes the physical-phone runtime boundary discovered in v0.1.49.
// MainActivity loads index.html with a remote base URL, so an external v049 script tag
// resolves to the website instead of the APK asset. Embed v049 directly into the merged
// index and delay execution until window.load; MainActivity's inlined v045/v048 foundation
// has executed by then, so v049 becomes the final runtime authority on the phone.
def injectH38V050 = {
    def runtimeFile = file('src/main/assets/reseller/v049-runtime.js')
    if (!runtimeFile.isFile()) throw new GradleException('Missing reseller/v049-runtime.js for v0.1.50 runtime handoff')
    def runtime = runtimeFile.getText('UTF-8')
    def marker = 'data-h38-v050-runtime="bundled-inline-after-v048"'
    def tag = '<script ' + marker + '>window.addEventListener("load",function(){\n' + runtime + '\nwindow.H38_V050_RUNTIME_HANDOFF="bundled-inline-after-v048";\n},{once:true});</script>'
    def matches = fileTree(layout.buildDirectory.get().asFile).matching { include '**/reseller/index.html' }.files
    if (matches.empty) throw new GradleException('Could not locate merged reseller/index.html for v0.1.50 runtime injection')
    matches.each { File indexFile ->
        def html = indexFile.getText('UTF-8')
        // Remove the failed v0.1.49 external-script form if a stale merged asset contains it.
        html = html.replace('<script src="v049-runtime.js"></script>', '')
        if (!html.contains(marker)) {
            def next = html.replace('</body>', tag + '\n</body>')
            if (next == html) throw new GradleException('Merged reseller/index.html has no </body> for v0.1.50 injection')
            indexFile.write(next, 'UTF-8')
        } else {
            indexFile.write(html, 'UTF-8')
        }
    }
}
tasks.configureEach { task ->
    if (task.name == 'mergeDebugAssets' || task.name == 'mergeReleaseAssets') {
        task.doLast { injectH38V050() }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
