plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('H38_ANDROID_UPLOAD_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('H38_ANDROID_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = System.getenv('H38_ANDROID_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'com.highway38.resellerscout'
    compileSdk 36
    defaultConfig {
        applicationId 'com.highway38.resellerscout'
        minSdk 24
        targetSdk 36
        versionCode 62
        versionName '0.1.61'
    }
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.owner61'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// v0.1.61 keeps the complete v060 search-first stabilization and adds one final
// performance authority: normal Retail Hunt uses the v061 fast text/evidence feed,
// bypassing photo-enrichment providers so missing pictures never delay discovery.
def injectH38V061 = {
    def v049File = file('src/main/assets/reseller/v049-runtime.js')
    def v051File = file('src/main/assets/reseller/v051-runtime.js')
    def v053File = file('src/main/assets/reseller/v053-runtime.js')
    def v056File = file('src/main/assets/reseller/v056-runtime.js')
    def v058File = file('src/main/assets/reseller/v058-runtime.js')
    def v059File = file('src/main/assets/reseller/v059-runtime.js')
    def v060File = file('src/main/assets/reseller/v060-runtime.js')
    def v061File = file('src/main/assets/reseller/v061-runtime.js')
    [v049File,v051File,v053File,v056File,v058File,v059File,v060File,v061File].each { if (!it.isFile()) throw new GradleException("Missing reseller/${it.name} for v0.1.61") }
    def v049 = v049File.getText('UTF-8')
    def v051 = v051File.getText('UTF-8')
    def v053 = v053File.getText('UTF-8')
    def v056 = v056File.getText('UTF-8')
    def v058 = v058File.getText('UTF-8')
    def v059 = v059File.getText('UTF-8')
    def v060 = v060File.getText('UTF-8')
    def v061 = v061File.getText('UTF-8')
    def marker = 'data-h38-v061-runtime="bundled-v049-plus-v051-plus-v053-plus-v056-plus-v058-plus-v059-plus-v060-plus-v061"'
    def tag = '<script ' + marker + '>window.addEventListener("load",function(){\n' + v049 + '\n' + v051 + '\n' + v053 + '\n' + v056 + '\n' + v058 + '\n' + v059 + '\n' + v060 + '\n' + v061 + '\nwindow.H38_V061_RUNTIME_HANDOFF="bundled-v049-plus-v051-plus-v053-plus-v056-plus-v058-plus-v059-plus-v060-plus-v061";\n},{once:true});</script>'
    def matches = fileTree(layout.buildDirectory.get().asFile).matching { include '**/reseller/index.html' }.files
    if (matches.empty) throw new GradleException('Could not locate merged reseller/index.html for v0.1.61 injection')
    matches.each { File indexFile ->
        def html = indexFile.getText('UTF-8')
        for (String name : ['v049-runtime.js','v051-runtime.js','v053-runtime.js','v056-runtime.js','v058-runtime.js','v059-runtime.js','v060-runtime.js','v061-runtime.js']) html = html.replace('<script src="' + name + '"></script>', '')
        if (!html.contains(marker)) {
            def next = html.replace('</body>', tag + '\n</body>')
            if (next == html) throw new GradleException('Merged reseller/index.html has no </body> for v0.1.61 injection')
            indexFile.write(next, 'UTF-8')
        } else indexFile.write(html, 'UTF-8')
    }
}
tasks.configureEach { task ->
    if (task.name == 'mergeDebugAssets' || task.name == 'mergeReleaseAssets') task.doLast { injectH38V061() }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
