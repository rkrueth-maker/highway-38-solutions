plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('H38_ANDROID_UPLOAD_KEYSTORE_PATH')
def releaseKeystorePassword = System.getenv('H38_ANDROID_UPLOAD_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('H38_ANDROID_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = System.getenv('H38_ANDROID_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

def approvedIconB64 = file('icon/reseller_scout_icon_256.webp.b64')
def generatedIconResDir = file("$buildDir/generated/h38ResellerIcon/res")
def generatedIconFile = file("$generatedIconResDir/drawable/reseller_scout_icon.webp")

tasks.register('prepareApprovedResellerIcon') {
    inputs.file approvedIconB64
    outputs.file generatedIconFile
    doLast {
        if (!approvedIconB64.exists()) throw new GradleException('Approved Reseller Scout icon payload is missing.')
        byte[] bytes = approvedIconB64.getText('UTF-8').replaceAll('\\s+', '').decodeBase64()
        generatedIconFile.parentFile.mkdirs()
        generatedIconFile.bytes = bytes
    }
}

android {
    namespace 'com.highway38.resellerscout'
    compileSdk 36
    defaultConfig {
        applicationId 'com.highway38.resellerscout'
        minSdk 24
        targetSdk 36
        versionCode 26
        versionName '0.1.25'
    }
    sourceSets {
        main {
            res.srcDir generatedIconResDir
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareApprovedResellerIcon')
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
