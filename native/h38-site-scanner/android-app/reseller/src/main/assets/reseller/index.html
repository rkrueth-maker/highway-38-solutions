<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2a3e">
<title>H38 Reseller Scout</title>
<link rel="stylesheet" href="v200-ui.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <button id="homeButton" class="brand" aria-label="Home"><span class="brand-mark">H38</span><span><strong>Reseller Scout</strong><small id="topSubtitle">Find something worth buying</small></span></button>
  <button id="accountButton" class="icon-btn hidden" aria-label="Account">●</button>
</header>
<main>
  <section id="loginView" class="auth-shell">
    <div class="auth-card">
      <div class="eyebrow">PRIVATE OWNER APP</div>
      <h1>Scout the deal.<br>Verify the money.</h1>
      <p>Retail markdowns, local listings, auctions and in-store research in one sourcing workspace.</p>
      <form id="loginForm">
        <label>Email<input name="email" type="email" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary wide" type="submit">Sign in</button>
      </form>
      <div id="loginMessage"></div>
    </div>
  </section>
  <section id="appView" class="hidden">
    <div id="notice" class="toast hidden"></div>
    <section id="locationStrip" class="location-strip hidden">
      <button id="locationButton" class="location-pill"><span>⌖</span><span id="locationText">ZIP 55744</span></button>
      <select id="radiusSelect" aria-label="Search radius"><option value="25">25 mi</option><option value="50" selected>50 mi</option><option value="100">100 mi</option><option value="150">150 mi</option></select>
    </section>
    <section id="discoverPage" class="page"></section>
    <section id="huntPage" class="page hidden"></section>
    <section id="scanPage" class="page hidden"></section>
    <section id="auctionPage" class="page hidden"></section>
    <section id="trackPage" class="page hidden"></section>
    <section id="morePage" class="page hidden"></section>
  </section>
</main>
<nav id="bottomNav" class="bottom-nav hidden">
  <button data-page="discover"><span>◆</span><b>Discover</b></button>
  <button data-page="hunt"><span>¢</span><b>Hunt</b></button>
  <button data-page="scan" class="scan-nav"><span>◎</span><b>Scan</b></button>
  <button data-page="auctions"><span>⚑</span><b>Auctions</b></button>
  <button data-page="track"><span>★</span><b>Track</b></button>
</nav>
<div id="locationSheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-card"><div class="sheet-handle"></div><div class="sheet-head"><div><div class="eyebrow">SEARCH AREA</div><h2>Location & radius</h2></div><button id="closeLocation" class="icon-btn">×</button></div><button id="usePhoneLocation" class="primary wide">Use phone location</button><div class="or"><span></span>or<span></span></div><label>ZIP code<input id="zipInput" inputmode="numeric" maxlength="5" value="55744" placeholder="55744"></label><button id="useZipLocation" class="secondary wide">Use ZIP</button><label>Radius<select id="sheetRadius"><option value="25">25 miles</option><option value="50">50 miles</option><option value="100">100 miles</option><option value="150">150 miles</option></select></label><div id="locationMessage"></div></div>
</div>
<div id="accountSheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-card compact"><div class="sheet-handle"></div><div class="sheet-head"><div><div class="eyebrow">OWNER APP</div><h2>Account</h2></div><button id="closeAccount" class="icon-btn">×</button></div><div id="accountIdentity" class="muted"></div><div id="accountBuild" class="small muted" style="margin:8px 0 14px"></div><button id="openMore" class="secondary wide">More / Settings</button><button id="openMaintenance" class="secondary wide">Maintenance / Self-Test</button><button id="signOutButton" class="danger-text wide">Sign out</button></div>
</div>
<div id="detailSheet" class="sheet hidden" role="dialog" aria-modal="true"><div id="detailCard" class="sheet-card detail-card"></div></div>
<script src="v200-core.js"></script>
<script src="v200-hunt.js"></script>
<script src="v200-auctions.js"></script>

<script src="v200-scan.js"></script>

<script src="v210-polish.js"></script>

<script>
window.H38_SCOUT_V213_MULTI_SOURCE=true;
window.H38_SCOUT_V213_DEDUPE_RULE='one card per product; multiple evidence sources merge underneath it.';
loadHunt=async function(force=false){
  if(state.hunt.loading)return;
  state.hunt.loading=true;renderHunt();
  try{
    const p=await fn('reseller-auto-leads-v063',{...locationPayload(),force:!!force},70000),rows=cleanRows(p.leads||[]).filter(r=>!huntArtifact(r));
    state.hunt.raw=Number(p.raw_count)||(Array.isArray(p.leads)?p.leads.length:0);
    state.hunt.rows=rows;state.hunt.loaded=true;
    state.hunt.sourceHealth={status:p.status||'PASS',warnings:p.warnings||[],raw:state.hunt.raw,actionable:rows.length,duplicatesMerged:Number(p.duplicate_count||0),sourceStatus:p.source_status||[],canonicalIdentity:p.canonical_identity_version||''};
    renderHunt();if(hasPoint()||state.location.zip)void ensureNearbyStores().then(()=>renderHuntListOnly());void hydrateHuntImages();
  }catch(e){notice(`Retail Hunt unavailable: ${error('hunt',e)}`,'bad');renderHunt()}
  finally{state.hunt.loading=false;renderHunt()}
};
</script>
<script src="v220-product.js"></script>
<script>
window.H38_SCOUT_V221_PHONE_ACCEPTANCE=true;
(function(){
  const h38v221RenderScan=renderScan;
  renderScan=function(){
    h38v221RenderScan();
    const card=document.getElementById('profitDecisionCard');if(!card)return;
    const badge=card.querySelector('.decision-score');if(!badge)return;
    const text=String(card.textContent||'').toUpperCase();
    if(text.includes('RESALE ESTIMATE: NOT YET PROVEN')||text.includes('NEEDS COMP')||text.includes('NEEDS VERIFICATION'))badge.textContent='VALUE NOT PROVEN';
  };
})();
</script>
<script>
window.H38_SCOUT_V230_BROAD_SOURCING=true;
window.H38_SCOUT_V230_IMAGE_CACHE=true;
window.H38_SCOUT_V230_FACEBOOK_LEDGER=true;
(function(){
  const IMAGE_KEY='h38.scout.v230.source-image-cache',FB_RUNS='h38.scout.v230.facebook-runs',FB_PENDING='h38.scout.v230.facebook-pending';
  const safeJson=(s,f)=>{try{const x=JSON.parse(s||'null');return x==null?f:x}catch{return f}};
  function imageMap(){const x=safeJson(localStorage.getItem(IMAGE_KEY),{});return x&&typeof x==='object'&&!Array.isArray(x)?x:{}}
  function cached(url){return txt(imageMap()[txt(url)]?.data_url)}
  function saveImages(rows){const map=imageMap();for(const x of rows||[]){if(x?.key&&/^data:image\//i.test(txt(x.data_url)))map[x.key]={data_url:x.data_url,at:Date.now()}}const entries=Object.entries(map).sort((a,b)=>num(b[1]?.at)-num(a[1]?.at)),keep={};let chars=0;for(const [k,v] of entries){const n=txt(v?.data_url).length;if(!n||chars+n>4_300_000)continue;keep[k]=v;chars+=n}try{localStorage.setItem(IMAGE_KEY,JSON.stringify(keep))}catch{}}
  const baseImageHtml=imageHtml;
  imageHtml=function(url,alt=''){const hit=cached(url);return hit?`<img class="thumb" loading="lazy" src="${esc(hit)}" alt="${esc(alt)}" onerror="this.remove();this.closest('.item-card')?.classList.add('no-image')">`:baseImageHtml(url,alt)};
  async function cacheRows(rows){const items=[],seen=new Set();for(const r of Array.isArray(rows)?rows:[]){const u=txt(r?.image_url);if(!/^https:\/\//i.test(u)||cached(u)||seen.has(u))continue;seen.add(u);items.push({key:u,image_url:u,source_url:txt(r?.source_url||r?.url),source:txt(r?.source||r?.retailer)});if(items.length>=8)break}if(!items.length)return false;try{const p=await fn('reseller-image-cache-v230',{items},30000);saveImages(p.images||[]);return Array.isArray(p.images)&&p.images.length>0}catch(e){error('v230ImageCache',e);return false}}
  window.H38V230CacheRows=cacheRows;

  sourceStatusBadge=function(x){const s=txt(x?.status);if(s==='live')return'<span class="badge good">LIVE</span>';if(s==='partial_live')return'<span class="badge info">PARTIAL LIVE</span>';if(s==='search_route')return'<span class="badge">ROUTE ONLY</span>';if(s==='no_match'||s==='empty')return'<span class="badge">NO MATCH</span>';if(s==='unavailable')return'<span class="badge warn">UNAVAILABLE</span>';return'<span class="badge warn">LIMITED</span>'};
  renderAuctions=function(){
    const p=$('auctionPage');if(!p)return;state.auctions.category=state.auctions.category||'resale';state.auctions.lane=state.auctions.lane||'mixed';
    const liveSources=Object.entries(state.auctions.health||{}).filter(([,x])=>x?.status==='live'||x?.status==='partial_live').length,sourceNames=['all','K-BID','HiBid','GovDeals','Public Surplus','Proxibid','AuctionTime'],rows=state.auctions.rows,near=rows.filter(r=>r.location_verified===true),unknown=rows.filter(r=>r.location_verified!==true);
    p.innerHTML=`<div class="page-head"><div><h1>Auctions</h1><p>Real multi-source auction ingestion. Live sources feed cards into Scout; route-only sources are labeled instead of pretending they were searched.</p></div><button id="auctionRefresh" class="mini-btn">Refresh</button></div><section class="card"><div class="search-row"><input id="auctionSearch" value="${esc(state.auctions.query)}" placeholder="Milwaukee M18, toolbox, welder, skid steer…"><button id="auctionGo" class="primary">Search</button></div><div class="filter-row"><select id="auctionSort"><option value="best">Best match</option><option value="nearest">Nearest</option><option value="bid">Lowest bid</option></select><select id="auctionSource">${sourceNames.map(x=>`<option value="${x}">${x==='all'?'All live sources':x}</option>`).join('')}</select><select id="auctionKind"><option value="all">Lots + auctions</option><option value="lot">Lots only</option><option value="event">Auction events</option></select><select id="auctionCategory"><option value="resale">Resale items</option><option value="all">All auction items</option></select></div><label>Search lane<select id="auctionLane"><option value="mixed">Local + shippable</option><option value="local">Strict local radius</option><option value="regional">High-value regional · up to 300 mi</option><option value="shippable">Shippable / distance-flexible</option></select></label><label class="small" style="margin-top:8px"><input id="auctionPickup" type="checkbox" style="width:auto;min-height:0;margin:0 6px 0 0" ${state.auctions.pickup?'checked':''}>Verified pickup required</label><div class="status-line"><span class="dot ${state.auctions.loading?'loading':state.auctions.loaded?'live':''}"></span>${state.auctions.loading?'Refreshing live sources; current results stay usable.':`${rows.length} results · ${liveSources} live/partial-live source${liveSources===1?'':'s'}`}</div></section>${!state.auctions.loaded&&state.auctions.loading?skeletons(5):near.length||unknown.length?`${auctionSection(state.auctions.query?'Verified-distance matching lots & auctions':'Verified-distance auctions',near,'No verified-distance matches in this lane')}${unknown.length?auctionSection('Distance / shipping needs verification',unknown,''):''}`:`<div class="empty"><strong>${state.auctions.loaded?'No matching live results':'Search auctions and lots'}</strong>${state.auctions.loaded?'Try a broader lane, All auction items, or review source health below.':'Type an item or load current auction events.'}</div>`}<details class="advanced" open><summary>Source coverage</summary><div class="advanced-body source-health">${renderAuctionHealth()}</div></details>`;
    const a=$('auctionSort'),s=$('auctionSource'),k=$('auctionKind'),c=$('auctionCategory'),l=$('auctionLane');if(a)a.value=state.auctions.sort;if(s)s.value=state.auctions.source;if(k)k.value=state.auctions.kind;if(c)c.value=state.auctions.category;if(l)l.value=state.auctions.lane;bindAuction(p);if(l)l.onchange=e=>{state.auctions.lane=e.target.value;runAuctionSearch()};
  };
  runAuctionSearch=async function(){if(state.auctions.loading)return;if(!requireLocation())return;state.auctions.query=txt($('auctionSearch')?.value??state.auctions.query);write(H38_KEYS.auction,state.auctions.query);state.auctions.category=state.auctions.category||'resale';state.auctions.lane=state.auctions.lane||'mixed';state.auctions.loading=true;renderAuctions();try{const p=await fn('reseller-auction-search-v230',{...locationPayload(),query:state.auctions.query,sort:state.auctions.sort,source:state.auctions.source,kind:state.auctions.kind,pickup_only:state.auctions.pickup,category:state.auctions.category,search_lane:state.auctions.lane},90000);state.auctions.rows=Array.isArray(p.results)?p.results:[];state.auctions.health=p.source_health||{};state.auctions.routes=Array.isArray(p.source_routes)?p.source_routes:[];state.auctions.loaded=true;if(p.warning)notice(p.warning,'warn');renderAuctions();if(await cacheRows(state.auctions.rows))renderAuctions()}catch(e){notice(`Auction search unavailable: ${error('auctionsV230',e)}`,'bad')}finally{state.auctions.loading=false;renderAuctions()}};

  function fbRuns(){const x=safeJson(localStorage.getItem(FB_RUNS),[]);return Array.isArray(x)?x:[]}
  function saveFbRun(run){const rows=[run,...fbRuns().filter(x=>x.run_id!==run.run_id)].sort((a,b)=>num(b.started_at)-num(a.started_at)).slice(0,20);try{localStorage.setItem(FB_RUNS,JSON.stringify(rows))}catch{}}
  function ledgerLog(event,run){void fn('reseller-facebook-ledger-v230',{event,run_id:run.run_id,postal:run.postal,radius_miles:run.radius,terms:run.terms,before_count:run.before_count,after_count:run.after_count||0,accepted_delta:run.accepted_delta||0,status:run.status||''},12000).catch(e=>error('facebookLedger',e))}
  const baseOpenFacebookScan=openFacebookScan;
  openFacebookScan=function(){if(!requireLocation())return;const snap=facebookSnapshot(),loc=locationPayload(),run={run_id:`fb-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,started_at:Date.now(),terms:facebookTerms(),postal:txt(loc.postal),radius:state.radius,before_count:snap.browser.length,after_count:null,accepted_delta:null,status:'OPENED FACEBOOK'};saveFbRun(run);try{localStorage.setItem(FB_PENDING,JSON.stringify(run))}catch{}ledgerLog('start',run);renderDiscover();baseOpenFacebookScan()};
  function finalizeFb(){const run=safeJson(localStorage.getItem(FB_PENDING),null);if(!run||Date.now()-num(run.started_at)<2500)return;const snap=facebookSnapshot(),after=snap.browser.length,done={...run,completed_at:Date.now(),after_count:after,accepted_delta:Math.max(0,after-num(run.before_count)),status:after>num(run.before_count)?'CAPTURED VERIFIED ROWS':'NO NEW VERIFIED ROWS'};saveFbRun(done);localStorage.removeItem(FB_PENDING);ledgerLog('finish',done);if(state.page==='discover')renderDiscover()}
  window.addEventListener('focus',()=>setTimeout(finalizeFb,650));document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(finalizeFb,650)});
  function fbLedgerHtml(){const pending=safeJson(localStorage.getItem(FB_PENDING),null),last=fbRuns()[0];if(pending)return`<div class="status-line" style="margin-top:10px"><span class="dot loading"></span>Facebook pass opened · ${pending.terms.length} searches · starting with ${pending.before_count} verified captured rows.</div>`;if(!last)return'<div class="small muted" style="margin-top:10px">No Facebook pass ledger yet.</div>';const when=new Date(last.completed_at||last.started_at).toLocaleString(),delta=last.accepted_delta==null?'?':last.accepted_delta;return`<div class="status-line" style="margin-top:10px"><span class="dot ${delta>0?'live':'warn'}"></span>Last pass: ${esc(last.status)} · +${esc(delta)} verified · ${esc(last.after_count??last.before_count)} total · ${esc(when)}</div><div class="small muted">${esc((last.terms||[]).join(', '))} · ${esc(last.postal||'selected location')} · ${esc(last.radius)} mi</div>`}
  const baseRenderDiscover=renderDiscover;
  renderDiscover=function(){baseRenderDiscover();const b=$('facebookScan');if(!b)return;const section=b.closest('section.card');if(section&&!section.querySelector('[data-v230-facebook-ledger]')){const x=document.createElement('div');x.dataset.v230FacebookLedger='true';x.innerHTML=fbLedgerHtml();section.appendChild(x)}};
  const baseRunDiscover=runDiscover;
  runDiscover=async function(){if(state.discover.running)return;if(!requireLocation())return;state.discover.query=txt($('discoverSearch')?.value??state.discover.query);write(H38_KEYS.discover,state.discover.query);const terms=profitTerms(),fb=facebookSnapshot();state.discover.running=true;state.discover.deals=null;state.discover.auctions=null;renderDiscover();const batches=[];for(let i=0;i<terms.length;i+=4)batches.push(terms.slice(i,i+4));const deals=Promise.allSettled(batches.map(batch=>fn('reseller-opportunity-scan-v060',{sources:['Craigslist','Facebook Marketplace'],terms:batch,facebookCandidates:fb.rows,...locationPayload()},70000))).then(async settled=>{const parts=settled.filter(x=>x.status==='fulfilled').map(x=>x.value);if(!parts.length)throw Error(settled.find(x=>x.status==='rejected')?.reason?.message||'Local listing scan failed');state.discover.deals=mergeDealPayload(parts,terms);renderDiscover();const dealRows=[...(state.discover.deals?.opportunities||[]),...(state.discover.deals?.candidates||[])];if(await cacheRows(dealRows))renderDiscover()}).catch(e=>{error('discoverDealsV230',e);state.discover.deals={opportunities:[],candidates:[],warning:e.message||String(e)};renderDiscover()});const auctions=fn('reseller-auction-search-v230',{...locationPayload(),query:state.discover.query,sort:'best',source:'all',kind:'all',search_lane:'mixed'},90000).then(async p=>{state.discover.auctions=p;renderDiscover();if(await cacheRows(p.results||[]))renderDiscover()}).catch(e=>{error('discoverAuctionsV230',e);state.discover.auctions={results:[],warning:e.message||String(e)};renderDiscover()});const retail=(state.hunt.loaded?Promise.resolve():loadHunt(false)).then(()=>{state.discover.retail={rows:state.hunt.rows};renderDiscover()}).catch(e=>error('discoverRetailV230',e));await Promise.allSettled([deals,auctions,retail]);state.discover.running=false;renderDiscover()};
})();
</script>
<script>
window.H38_SCOUT_V251_POLISH=true;
(function(){
  const css=`
  :root{--tap:44px}
  body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{touch-action:manipulation;-webkit-tap-highlight-color:rgba(14,116,144,.12)}
  button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid rgba(14,116,144,.24);outline-offset:2px}
  .page{padding-bottom:34px}
  .location-strip{box-shadow:0 5px 16px rgba(20,42,58,.045)}
  .location-pill{min-height:44px}
  .hero{border-radius:20px;box-shadow:0 10px 26px rgba(13,42,62,.14);margin-bottom:13px}
  .hero .search-row{align-items:stretch}
  .quick-chips{scroll-snap-type:x proximity;padding-bottom:4px}
  .quick-chips .chip{scroll-snap-align:start;min-height:38px}
  .section-head{align-items:center;margin-top:20px}
  .card{box-shadow:0 5px 18px rgba(20,42,58,.055)}
  .item-card{border-color:#d7e2e8;box-shadow:0 3px 12px rgba(20,42,58,.045);transition:transform .12s ease,box-shadow .12s ease}
  .item-card .thumb{width:92px;height:92px}
  .item-card h3{margin-top:7px}
  .item-card .card-actions{margin-top:10px}
  .mini-btn{min-height:40px;padding:8px 11px}
  .card-actions>.mini-btn{min-width:84px}
  .status-line{line-height:1.4}
  .filter-row{padding-bottom:4px;scroll-snap-type:x proximity}
  .filter-row select{width:auto;min-width:138px;margin-top:0;scroll-snap-align:start}
  .retailer-group-head{min-height:58px}
  .more-tile{min-height:104px;box-shadow:0 3px 12px rgba(20,42,58,.04)}
  .empty{padding:19px 14px;background:#fbfcfd}
  .sheet-card{overscroll-behavior:contain}
  .bottom-nav button{min-height:52px;border-radius:14px}
  .bottom-nav button.active:not(.scan-nav){background:#eaf4f6;color:var(--accent)}
  .bottom-nav .scan-nav.active{color:var(--accent)}
  .decision-actions button{min-height:44px}
  @media(max-width:520px){
    .page{padding:12px 10px 30px}
    .card{padding:13px}
    .item-card{grid-template-columns:80px minmax(0,1fr);gap:10px;padding:10px}
    .item-card.no-image{grid-template-columns:minmax(0,1fr)}
    .item-card .thumb{width:80px;height:80px}
    .card-actions>.mini-btn{flex:1 1 calc(50% - 4px)}
    .item-card .card-actions>.mini-btn.primary{flex-basis:100%}
    .page-head h1,.page-head h2{font-size:24px}
    .hero h1{font-size:26px}
  }
  @media(max-width:365px){
    .search-row{grid-template-columns:1fr}
    .search-row .primary{width:100%}
    .profit-box{grid-template-columns:1fr 1fr}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  `;
  const style=document.createElement('style');style.id='h38v251PolishStyles';style.textContent=css;document.head.appendChild(style);
  let queued=false;
  function polish(){
    queued=false;
    try{
      document.body.dataset.scoutPage=state?.page||'';
      const noticeEl=document.getElementById('notice');if(noticeEl){noticeEl.setAttribute('role','status');noticeEl.setAttribute('aria-live','polite')}
      document.querySelectorAll('.status-line').forEach(x=>{x.setAttribute('role','status');x.setAttribute('aria-live','polite')});
      document.querySelectorAll('button:not([type])').forEach(x=>x.type='button');
      document.querySelectorAll('#bottomNav [data-page]').forEach(x=>{if(x.classList.contains('active'))x.setAttribute('aria-current','page');else x.removeAttribute('aria-current')});
      const labels={closeLocation:'Close location',closeAccount:'Close account'};for(const [id,label] of Object.entries(labels)){const el=document.getElementById(id);if(el&&!el.getAttribute('aria-label'))el.setAttribute('aria-label',label)}
      document.querySelectorAll('.item-card').forEach(x=>x.classList.add('polished-card'));
    }catch(e){try{error('v251Polish',e)}catch{}}
  }
  function queuePolish(){if(queued)return;queued=true;requestAnimationFrame(polish)}
  const baseSetPage=setPage;setPage=function(page){const r=baseSetPage(page);queuePolish();return r};
  const root=document.getElementById('appView')||document.body;new MutationObserver(queuePolish).observe(root,{childList:true,subtree:true});
  window.addEventListener('focus',queuePolish);document.addEventListener('visibilitychange',()=>{if(!document.hidden)queuePolish()});
  queuePolish();
})();
</script>
<script src="v200-app.js"></script>
