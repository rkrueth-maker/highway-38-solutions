<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2a3e">
<title>H38 Reseller Scout</title>
<link rel="stylesheet" href="v200-ui.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <button id="homeButton" class="brand" aria-label="Home"><span class="brand-mark">H38</span><span><strong>Reseller Scout</strong><small id="topSubtitle">Find something worth buying</small></span></button>
  <button id="accountButton" class="icon-btn hidden" aria-label="Account">●</button>
</header>
<main>
  <section id="loginView" class="auth-shell">
    <div class="auth-card">
      <div class="eyebrow">PRIVATE OWNER APP</div>
      <h1>Scout the deal.<br>Verify the money.</h1>
      <p>Retail markdowns, local listings, auctions and in-store research in one sourcing workspace.</p>
      <form id="loginForm">
        <label>Email<input name="email" type="email" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary wide" type="submit">Sign in</button>
      </form>
      <div id="loginMessage"></div>
    </div>
  </section>
  <section id="appView" class="hidden">
    <div id="notice" class="toast hidden"></div>
    <section id="locationStrip" class="location-strip hidden">
      <button id="locationButton" class="location-pill"><span>⌖</span><span id="locationText">ZIP 55744</span></button>
      <select id="radiusSelect" aria-label="Search radius"><option value="25">25 mi</option><option value="50" selected>50 mi</option><option value="100">100 mi</option><option value="150">150 mi</option></select>
    </section>
    <section id="discoverPage" class="page"></section>
    <section id="huntPage" class="page hidden"></section>
    <section id="scanPage" class="page hidden"></section>
    <section id="auctionPage" class="page hidden"></section>
    <section id="morePage" class="page hidden"></section>
  </section>
</main>
<nav id="bottomNav" class="bottom-nav hidden">
  <button data-page="discover"><span>◆</span><b>Discover</b></button>
  <button data-page="hunt"><span>¢</span><b>Hunt</b></button>
  <button data-page="scan" class="scan-nav"><span>◎</span><b>Scan</b></button>
  <button data-page="auctions"><span>⚑</span><b>Auctions</b></button>
  <button data-page="more"><span>•••</span><b>More</b></button>
</nav>
<div id="locationSheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-card"><div class="sheet-handle"></div><div class="sheet-head"><div><div class="eyebrow">SEARCH AREA</div><h2>Location & radius</h2></div><button id="closeLocation" class="icon-btn">×</button></div><button id="usePhoneLocation" class="primary wide">Use phone location</button><div class="or"><span></span>or<span></span></div><label>ZIP code<input id="zipInput" inputmode="numeric" maxlength="5" value="55744" placeholder="55744"></label><button id="useZipLocation" class="secondary wide">Use ZIP</button><label>Radius<select id="sheetRadius"><option value="25">25 miles</option><option value="50">50 miles</option><option value="100">100 miles</option><option value="150">150 miles</option></select></label><div id="locationMessage"></div></div>
</div>
<div id="accountSheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-card compact"><div class="sheet-handle"></div><div class="sheet-head"><div><div class="eyebrow">OWNER APP</div><h2>Account</h2></div><button id="closeAccount" class="icon-btn">×</button></div><div id="accountIdentity" class="muted"></div><div id="accountBuild" class="small muted" style="margin:8px 0 14px"></div><button id="openMaintenance" class="secondary wide">Maintenance / Self-Test</button><button id="signOutButton" class="danger-text wide">Sign out</button></div>
</div>
<div id="detailSheet" class="sheet hidden" role="dialog" aria-modal="true"><div id="detailCard" class="sheet-card detail-card"></div></div>
<script src="v200-core.js"></script>
<script src="v200-hunt.js"></script>
<script src="v200-auctions.js"></script>
<script src="v200-discover.js"></script>
<script src="v200-scan.js"></script>
<script src="v200-more.js"></script>
<script src="v210-polish.js"></script>
<script src="v211-wide.js"></script>
<script src="v212-physical.js"></script>
<script>
window.H38_SCOUT_V213_MULTI_SOURCE=true;
window.H38_SCOUT_V213_DEDUPE_RULE='one card per product; multiple evidence sources merge underneath it.';
loadHunt=async function(force=false){
  if(state.hunt.loading)return;
  state.hunt.loading=true;renderHunt();
  try{
    const p=await fn('reseller-auto-leads-v063',{...locationPayload(),force:!!force},70000),rows=cleanRows(p.leads||[]).filter(r=>!huntArtifact(r));
    state.hunt.raw=Number(p.raw_count)||(Array.isArray(p.leads)?p.leads.length:0);
    state.hunt.rows=rows;state.hunt.loaded=true;
    state.hunt.sourceHealth={status:p.status||'PASS',warnings:p.warnings||[],raw:state.hunt.raw,actionable:rows.length,duplicatesMerged:Number(p.duplicate_count||0),sourceStatus:p.source_status||[],canonicalIdentity:p.canonical_identity_version||''};
    renderHunt();if(hasPoint()||state.location.zip)void ensureNearbyStores().then(()=>renderHuntListOnly());void hydrateHuntImages();
  }catch(e){notice(`Retail Hunt unavailable: ${error('hunt',e)}`,'bad');renderHunt()}
  finally{state.hunt.loading=false;renderHunt()}
};
</script>
<script src="v200-app.js"></script>
</body>
</html>
