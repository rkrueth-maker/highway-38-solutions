<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Repair Guide</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a472a">
<link rel="icon" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header>
    <h1>🔧 Repair Guide</h1>
    <p class="subtitle">What are we fixing today?</p>
    <button id="logoutBtn" class="link-btn" hidden>Sign out</button>
  </header>

  <main id="main">
    <!-- Login (H38 Office account) -->
    <section id="loginScreen" class="screen">
      <h2>Sign in</h2>
      <p class="muted">Use your H38 Office login.</p>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
      </div>
      <p id="loginError" class="error" hidden></p>
      <button id="loginBtn" class="primary-btn">Sign In →</button>
    </section>

    <!-- Category picker -->
    <section id="categoryScreen" class="screen">
      <div class="category-grid">
        <button class="category-card" data-category="car">
          <span class="cat-icon">🚗</span>
          <span class="cat-label">Car / Truck</span>
        </button>
        <button class="category-card" data-category="atv">
          <span class="cat-icon">🏍️</span>
          <span class="cat-label">ATV / UTV</span>
        </button>
        <button class="category-card" data-category="small-engine">
          <span class="cat-icon">⚙️</span>
          <span class="cat-label">Small Engine</span>
          <small>Mower, snowblower, etc.</small>
        </button>
        <button class="category-card" data-category="appliance">
          <span class="cat-icon">🧺</span>
          <span class="cat-label">Appliance</span>
          <small>Washer, dryer, fridge</small>
        </button>
      </div>
    </section>

    <!-- Symptom input -->
    <section id="symptomScreen" class="screen">
      <button class="back-btn" id="backToCategory">← Back</button>
      <h2 id="symptomTitle">Describe the problem</h2>
      <div class="input-group">
        <label>What's it doing (or not doing)?</label>
        <textarea id="symptomInput" rows="4" placeholder="e.g. Won't start, just clicks when I turn the key"></textarea>
      </div>
      <div class="input-group">
        <label>Make / Model <small>(optional)</small></label>
        <input type="text" id="unitInfo" placeholder="e.g. 2018 Honda Rancher 420">
      </div>
      <div class="photo-section">
        <label>Photo <small>(optional)</small></label>
        <button id="photoBtn" class="secondary-btn">📷 Take / Upload Photo</button>
        <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
        <div id="photoPreview"></div>
      </div>
      <button id="diagnoseBtn" class="primary-btn">Get Diagnosis →</button>
    </section>

    <!-- Results -->
    <section id="resultScreen" class="screen">
      <button class="back-btn" id="backToSymptom">← New diagnosis</button>
      <div id="diagnosisLoading" class="loading">
        <div class="spinner"></div>
        <p>Analyzing...</p>
      </div>
      <div id="diagnosisResult" hidden>
        <h2>Likely Issues</h2>
        <div id="issuesList"></div>
        <h2>What to Check</h2>
        <div id="checksList"></div>
        <h2>Fix Plan</h2>
        <div id="fixPlan"></div>
        <h2>Estimate</h2>
        <div id="estimateBox"></div>
        <h2>Parts</h2>
        <div id="partsList"></div>
        <button id="newDiagnosisBtn" class="primary-btn">Start Over</button>
      </div>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
