<style>
.qb-safe-photo-choice{background:#e8eef4;color:var(--navy)}
.qb-generic-customer-note{display:block;margin-top:6px;color:var(--muted);font-size:12px;font-weight:600;line-height:1.35}
.qb-photo-analysis-summary{margin-top:12px;display:grid;gap:10px}.qb-photo-analysis-summary h3{margin:0;color:var(--navy)}.qb-photo-analysis-list{margin:6px 0 0;padding-left:20px}.qb-photo-analysis-list li{margin:4px 0}.qb-photo-analysis-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
</style>
<script>
(function(){
'use strict';
const ctx=window.H38_QB_CONTEXT||{};
const userKey=String(ctx.user&&ctx.user.id||ctx.user&&ctx.user.email||'user');
const DRAFT_KEY='H38_QB_DRAFT_V2:'+userKey;
const DRAFT_FIELDS=['customer','project','quoteDate','expiration','terms','deposit','scope','assumptions','exclusions','customerNotes','internalNotes','qbFieldNarration'];
const GENERIC_ID='CUST-H38-GENERIC-QUOTE';
const GENERIC_NAME='Generic Quote Customer';
const safePending=[];
let safeCameraInput=null,safeFileInput=null,safeTarget='draft',safeQuoteId='',installed=false,saving=false,discardNext=false,observer=null;
const $=id=>document.getElementById(id);
const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=value=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(value||0));
function toast(message,bad){const node=$('qbToast');if(!node)return;node.textContent=message;node.style.background=bad?'#8f1d1d':'#162331';node.classList.add('show');setTimeout(()=>node.classList.remove('show'),5600)}
function busy(on){const node=$('qbOverlay');if(node)node.classList.toggle('show',!!on)}
function api(action,args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).boApi({action:action,args:args||{}}))}
function buildAi(payload){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).boBuildAiQuoteDraft(payload))}
function dataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
function mime(file){if(file.type)return file.type;const ext=String(file.name||'').split('.').pop().toLowerCase();return {pdf:'application/pdf',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif'}[ext]||'application/octet-stream'}
function isImage(file){return /^image\//i.test(mime(file))}

function captureDraft(){
  if(!$('customer'))return;
  const draft={};DRAFT_FIELDS.forEach(id=>{const node=$(id);if(node)draft[id]=node.value});
  try{sessionStorage.setItem(DRAFT_KEY,JSON.stringify(draft))}catch(error){}
}
function restoreDraft(){
  let draft={};try{draft=JSON.parse(sessionStorage.getItem(DRAFT_KEY)||'{}')}catch(error){draft={}}
  DRAFT_FIELDS.forEach(id=>{const node=$(id);if(!node||draft[id]===undefined)return;if(id==='customer'&&draft[id]&&!Array.from(node.options||[]).some(option=>option.value===draft[id]))return;node.value=draft[id]});
  if(typeof window.qbCalc==='function')window.qbCalc();
}
function clearDraft(){try{sessionStorage.removeItem(DRAFT_KEY)}catch(error){}}
function wireDraftAutosave(){const form=$('customer')&&$('customer').form;if(!form||form.dataset.h38DraftMemory==='1')return;form.dataset.h38DraftMemory='1';form.addEventListener('input',captureDraft);form.addEventListener('change',captureDraft);restoreDraft()}

function genericOption(select){
  if(!select)return null;
  let option=Array.from(select.options||[]).find(item=>item.value===GENERIC_ID||String(item.textContent||'').trim()===GENERIC_NAME);
  if(!option){option=document.createElement('option');option.value=GENERIC_ID;option.textContent=GENERIC_NAME;select.insertBefore(option,select.firstChild)}
  return option;
}
function addGenericNote(select){
  if(!select||select.dataset.genericNote==='1')return;
  select.dataset.genericNote='1';
  const note=document.createElement('span');note.className='qb-generic-customer-note';note.textContent='Generic Quote Customer is selected automatically for photo-first estimates. Replace it with the real customer before approval or sending.';
  select.insertAdjacentElement('afterend',note);
}
function selectGeneric(id){
  const select=$(id);if(!select)return false;
  const option=genericOption(select);if(!option)return false;
  if(!select.value){select.value=option.value;select.dispatchEvent(new Event('change',{bubbles:true}))}
  addGenericNote(select);return true;
}
function ensureHiddenCustomer(){
  const content=$('qbContent');if(!content)return;
  let hidden=$('qbCustomerId');
  if(!hidden){hidden=document.createElement('input');hidden.type='hidden';hidden.id='qbCustomerId';hidden.value=GENERIC_ID;content.appendChild(hidden)}
  if(!hidden.value)hidden.value=GENERIC_ID;
}
function preparePhotoFields(){
  selectGeneric('aiCustomer');selectGeneric('customer');ensureHiddenCustomer();
  const notes=$('aiNotes');if(notes){notes.required=false;notes.placeholder='Optional: enter known dimensions, such as door width and height. Photos can be analyzed without additional notes.'}
  const files=$('aiFiles');if(files)files.removeAttribute('capture');
}

function ensureSafeInputs(){
  if(!safeCameraInput){
    safeCameraInput=document.createElement('input');safeCameraInput.type='file';safeCameraInput.accept='image/*';safeCameraInput.setAttribute('capture','environment');safeCameraInput.hidden=true;
    safeCameraInput.addEventListener('change',()=>{const files=Array.from(safeCameraInput.files||[]);safeCameraInput.value='';handleSafeFiles(files)});document.body.appendChild(safeCameraInput);
  }
  if(!safeFileInput){
    safeFileInput=document.createElement('input');safeFileInput.type='file';safeFileInput.accept='image/*';safeFileInput.multiple=true;safeFileInput.removeAttribute('capture');safeFileInput.hidden=true;
    safeFileInput.addEventListener('change',()=>{const files=Array.from(safeFileInput.files||[]);safeFileInput.value='';handleSafeFiles(files)});document.body.appendChild(safeFileInput);
  }
}
function openSafePicker(mode,target,quoteId){ensureSafeInputs();safeTarget=target||'draft';safeQuoteId=quoteId||'';(mode==='camera'?safeCameraInput:safeFileInput).click()}
async function handleSafeFiles(files){
  const images=files.filter(file=>file&&isImage(file));
  if(!images.length)return;
  for(const file of images)if(file.size>20*1024*1024){toast(file.name+' exceeds 20 MB.',true);return}
  if(safeTarget==='quote'&&safeQuoteId){await saveSafeFiles(safeQuoteId,images);if(typeof window.qbDetails==='function')await window.qbDetails(safeQuoteId);return}
  images.forEach(file=>safePending.push({file:file,url:URL.createObjectURL(file)}));renderSafePending()
}
function renderSafePending(){
  const host=$('qbPendingPhotos');if(!host)return;
  host.innerHTML=safePending.length?safePending.map((item,index)=>'<article class="qb-photo-card"><img src="'+esc(item.url)+'" alt="Quote picture '+(index+1)+'"><button class="qb-photo-remove" type="button" aria-label="Remove picture" onclick="qbSafeRemovePendingPhoto('+index+')">×</button><div class="qb-photo-meta"><strong>'+esc(item.file.name)+'</strong><span>'+Math.max(1,Math.round(item.file.size/1024))+' KB · saves with quote</span></div></article>').join(''):'<div class="qb-status-line">No pictures selected yet.</div>';
  const count=$('qbPendingCount');if(count)count.textContent=safePending.length?safePending.length+' picture'+(safePending.length===1?'':'s')+' ready to save':'Pictures save automatically with the draft quote.';
}
window.qbSafeRemovePendingPhoto=index=>{const item=safePending[index];if(item)URL.revokeObjectURL(item.url);safePending.splice(index,1);renderSafePending()};
async function saveSafeFiles(quoteId,files){
  busy(true);try{const saved=[];for(let i=0;i<files.length;i+=3){const group=files.slice(i,i+3);const results=await Promise.all(group.map(async file=>api('saveQuotePhoto',{payload:{quoteId:quoteId,fileName:file.name,mimeType:mime(file),base64Data:await dataUrl(file)}})));saved.push(...results)}toast(saved.length+' picture'+(saved.length===1?'':'s')+' saved with the quote.');return saved}finally{busy(false)}
}
function installSafeCameraGlobals(){
  ensureSafeInputs();
  window.qbCameraTakeForDraft=()=>openSafePicker('camera','draft','');
  window.qbCameraChooseForDraft=()=>openSafePicker('files','draft','');
  window.qbCameraTakeForQuote=quoteId=>openSafePicker('camera','quote',quoteId);
  window.qbCameraChooseForQuote=quoteId=>openSafePicker('files','quote',quoteId);
}
function enhanceCameraControls(){
  const aiFiles=$('aiFiles');if(aiFiles)aiFiles.removeAttribute('capture');
  const draftActions=document.querySelector('#qbQuotePhotoPanel .qb-camera-actions');
  if(draftActions&&!draftActions.querySelector('[data-safe-choose]'))draftActions.insertAdjacentHTML('beforeend','<button type="button" class="qb-safe-photo-choice" data-safe-choose="1" onclick="qbCameraChooseForDraft()">Choose Photos</button>');
  const quotePanel=$('qbQuotePhotosPanel');
  if(quotePanel&&!quotePanel.querySelector('[data-safe-choose]')){const head=quotePanel.querySelector('.qb-quote-photo-head');const take=head&&head.querySelector('button');const match=take&&String(take.getAttribute('onclick')||'').match(/qbCameraTakeForQuote\('([^']+)'\)/);if(head&&match)head.insertAdjacentHTML('beforeend','<button type="button" class="qb-safe-photo-choice" data-safe-choose="1" onclick="qbCameraChooseForQuote(\''+esc(match[1])+'\')">Choose Photos</button>')}
  const mobile=$('qbMobileCapture');
  if(mobile&&mobile.dataset.safeNative!=='1'){const replacement=mobile.cloneNode(true);replacement.dataset.safeNative='1';replacement.textContent='📷 Take Picture for Quote';replacement.addEventListener('click',()=>window.qbCameraTakeForDraft());mobile.replaceWith(replacement)}
  renderSafePending();
}

function parseDraft(result){
  if(result&&result.draft)return result.draft;
  const staged=result&&result.staged;let details={};
  try{details=JSON.parse(staged&&staged.Details||'{}')}catch(error){details={}}
  return details;
}
function renderDraft(result){
  const host=$('aiResult');if(!host)return;
  const draft=parseDraft(result)||{};window.H38_QB_LAST_AI_DRAFT=draft;window.H38_QB_GENERIC_AI_DRAFT=draft;
  const observations=Array.isArray(draft.photoObservations)?draft.photoObservations:[];
  const missing=Array.isArray(draft.missingInformation)?draft.missingInformation:[];
  const lines=Array.isArray(draft.suggestedLines)?draft.suggestedLines:[];
  host.innerHTML='<div class="notice good"><strong>Photo analysis prepared.</strong> The photos were used to identify the likely work and quote items. Nothing was approved or sent.</div><section class="qb-photo-analysis-summary"><div><h3>'+esc(draft.projectTitle||'Photo-based quote draft')+'</h3><p>'+esc(draft.scope||'Review the observations and suggested items below.')+'</p></div>'+(observations.length?'<div><strong>What the photos show</strong><ul class="qb-photo-analysis-list">'+observations.map(item=>'<li>'+esc(item)+'</li>').join('')+'</ul></div>':'')+(missing.length?'<div><strong>Measurements or details to confirm</strong><ul class="qb-photo-analysis-list">'+missing.map(item=>'<li>'+esc(item)+'</li>').join('')+'</ul></div>':'')+'<div class="catalog">'+(lines.length?lines.map((line,index)=>'<article class="catalog-card"><h3>'+esc(line.description||line.catalogId||'Suggested item')+'</h3><p>'+esc(line.evidence||'Photo-based suggestion; owner review required.')+'</p><div class="price">'+(line.rate!==''&&line.rate!=null?money(line.rate)+' / '+esc(line.unit||'each'):'Price lookup or review required')+'</div><div class="qb-photo-analysis-actions"><button type="button" class="primary" onclick="qbGenericPhotoAiLine('+index+')">Add to Quote</button></div></article>').join(''):'<div class="empty">No definite quote items were identified. Review the missing information above.</div>')+'</div></section>';
  if(draft.projectTitle&&$('aiTitle')&&!$('aiTitle').value)$('aiTitle').value=draft.projectTitle;
}
window.qbGenericPhotoAiLine=function(index){const draft=window.H38_QB_GENERIC_AI_DRAFT||{},line=Array.isArray(draft.suggestedLines)?draft.suggestedLines[index]:null;if(line&&typeof window.qbAddLine==='function')window.qbAddLine(line)};
async function uploadFiles(files,customerId){
  const saved=[];
  for(let i=0;i<files.length;i+=3){const group=files.slice(i,i+3);const result=await Promise.all(group.map(async file=>api('uploadDocument',{payload:{fileName:file.name,mimeType:mime(file),base64Data:await dataUrl(file),documentType:'Quote Field Photo',sourceType:'Quote Builder',sourceId:customerId,accessClassification:'Private Customer'}})));saved.push(...result)}
  return saved;
}
window.qbPrepareAi=async function(event){
  if(event)event.preventDefault();preparePhotoFields();
  const customer=$('aiCustomer'),title=$('aiTitle'),notes=$('aiNotes'),fileInput=$('aiFiles');
  const customerId=customer&&customer.value?customer.value:GENERIC_ID;
  if(customer&&!customer.value)customer.value=GENERIC_ID;
  const files=Array.from(fileInput&&fileInput.files||[]),noteText=notes?notes.value.trim():'';
  if(!files.length&&!noteText)return toast('Add at least one photo or enter a short note.',true);
  for(const file of files)if(file.size>20*1024*1024)return toast(file.name+' exceeds 20 MB.',true);
  busy(true);
  try{
    await uploadFiles(files,customerId);
    const imageFiles=files.filter(isImage).slice(0,6),photos=await Promise.all(imageFiles.map(dataUrl));
    const effectiveNotes=noteText||'Analyze the uploaded jobsite photos to identify the work required, visible materials and conditions, likely quote items, and any dimensions that must be confirmed. Do not invent measurements.';
    const result=await buildAi({customerId:customerId,projectTitle:title?title.value.trim():'',notes:effectiveNotes,photos:photos});
    renderDraft(result);toast((result&&result.message)||'Photo-based quote draft prepared for owner review.');
  }catch(error){const host=$('aiResult');if(host)host.innerHTML='<div class="notice bad"><strong>Photo analysis stopped safely.</strong><br>'+esc(error&&error.message||String(error))+'</div>';toast(error&&error.message||String(error),true)}finally{busy(false)}
};

function enhance(){wireDraftAutosave();installSafeCameraGlobals();enhanceCameraControls();preparePhotoFields()}
function install(){
  if(installed||typeof window.qbOpen!=='function'||typeof window.qbSave!=='function'||typeof window.qbAddLine!=='function')return false;installed=true;
  const baseAddLine=window.qbAddLine;window.qbAddLine=function(item){let value=item;if(item&&item.Name&&!item.Unit){const match=String(item.Name).match(/\s*\[per\s+([^\]]+)\]\s*$/i);if(match){value=Object.assign({},item,{Name:String(item.Name).replace(match[0],''),Unit:match[1]});if(!value['Customer Description'])value['Customer Description']=value.Name}}return baseAddLine.call(this,value)};
  const baseOpen=window.qbOpen;window.qbOpen=async function(view){if($('customer')&&view!=='new'&&!saving&&!discardNext)captureDraft();if(discardNext){discardNext=false;clearDraft()}const result=await baseOpen.apply(this,arguments);setTimeout(enhance,0);return result};
  const baseSave=window.qbSave;window.qbSave=async function(event){preparePhotoFields();const saveStarted=Date.now(),files=safePending.map(item=>item.file);saving=true;try{const result=await baseSave.apply(this,arguments);if(!$('customer')){clearDraft();if(files.length){const created=await api('quoteBuilderLastCreatedQuote');if(created&&Number(created.createdMs||0)>=saveStarted){await saveSafeFiles(created.quoteId,files);safePending.forEach(item=>URL.revokeObjectURL(item.url));safePending.splice(0,safePending.length);if(typeof window.qbDetails==='function')await window.qbDetails(created.quoteId)}}}else captureDraft();return result}finally{saving=false}};
  document.addEventListener('click',event=>{const button=event.target&&event.target.closest&&event.target.closest('button');if(button&&$('customer')&&String(button.textContent||'').trim()==='Cancel'){discardNext=true;clearDraft()}},true);
  const content=$('qbContent')||document.body;if(!observer){observer=new MutationObserver(()=>requestAnimationFrame(enhance));observer.observe(content,{childList:true,subtree:true})}
  document.addEventListener('submit',preparePhotoFields,true);
  enhance();return true;
}
let attempts=0;const timer=setInterval(()=>{attempts+=1;if(install()||attempts>120)clearInterval(timer)},50);
})();
</script>
