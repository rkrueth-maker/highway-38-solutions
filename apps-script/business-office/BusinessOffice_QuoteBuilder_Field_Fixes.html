<style>
.qb-safe-photo-choice{background:#e8eef4;color:var(--navy)}
</style>
<script>
(function(){
'use strict';
const ctx=window.H38_QB_CONTEXT||{};
const userKey=String(ctx.user&&ctx.user.id||ctx.user&&ctx.user.email||'user');
const DRAFT_KEY='H38_QB_DRAFT_V2:'+userKey;
const DRAFT_FIELDS=['customer','project','quoteDate','expiration','terms','deposit','scope','assumptions','exclusions','customerNotes','internalNotes','qbFieldNarration'];
const safePending=[];
let safeCameraInput=null,safeFileInput=null,safeTarget='draft',safeQuoteId='',installed=false,saving=false,discardNext=false;
const $=id=>document.getElementById(id);
const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
function toast(message,bad){const node=$('qbToast');if(!node)return;node.textContent=message;node.style.background=bad?'#8f1d1d':'#162331';node.classList.add('show');setTimeout(()=>node.classList.remove('show'),5400)}
function busy(on){const node=$('qbOverlay');if(node)node.classList.toggle('show',!!on)}
function api(action,args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).boApi({action:action,args:args||{}}))}
function dataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)})}
function mime(file){return file.type||({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',heic:'image/heic',heif:'image/heif'}[String(file.name||'').split('.').pop().toLowerCase()]||'image/jpeg')}

function captureDraft(){
  if(!$('customer'))return;
  const draft={};DRAFT_FIELDS.forEach(id=>{const node=$(id);if(node)draft[id]=node.value});
  try{sessionStorage.setItem(DRAFT_KEY,JSON.stringify(draft))}catch(error){}
}
function restoreDraft(){
  let draft={};try{draft=JSON.parse(sessionStorage.getItem(DRAFT_KEY)||'{}')}catch(error){draft={}}
  DRAFT_FIELDS.forEach(id=>{const node=$(id);if(!node||draft[id]===undefined)return;if(id==='customer'&&draft[id]&&!Array.from(node.options||[]).some(option=>option.value===draft[id]))return;node.value=draft[id]});
  if(typeof window.qbCalc==='function')window.qbCalc();
}
function clearDraft(){try{sessionStorage.removeItem(DRAFT_KEY)}catch(error){}}
function wireDraftAutosave(){const form=$('customer')&&$('customer').form;if(!form||form.dataset.h38DraftMemory==='1')return;form.dataset.h38DraftMemory='1';form.addEventListener('input',captureDraft);form.addEventListener('change',captureDraft);restoreDraft()}

function ensureSafeInputs(){
  if(!safeCameraInput){
    safeCameraInput=document.createElement('input');safeCameraInput.type='file';safeCameraInput.accept='image/*';safeCameraInput.setAttribute('capture','environment');safeCameraInput.hidden=true;
    safeCameraInput.addEventListener('change',()=>{const files=Array.from(safeCameraInput.files||[]);safeCameraInput.value='';handleSafeFiles(files)});document.body.appendChild(safeCameraInput);
  }
  if(!safeFileInput){
    safeFileInput=document.createElement('input');safeFileInput.type='file';safeFileInput.accept='image/*';safeFileInput.multiple=true;safeFileInput.removeAttribute('capture');safeFileInput.hidden=true;
    safeFileInput.addEventListener('change',()=>{const files=Array.from(safeFileInput.files||[]);safeFileInput.value='';handleSafeFiles(files)});document.body.appendChild(safeFileInput);
  }
}
function openSafePicker(mode,target,quoteId){ensureSafeInputs();safeTarget=target||'draft';safeQuoteId=quoteId||'';(mode==='camera'?safeCameraInput:safeFileInput).click()}
async function handleSafeFiles(files){
  const images=files.filter(file=>file&&String(file.type||'').indexOf('image/')===0);
  if(!images.length)return;
  for(const file of images)if(file.size>20*1024*1024){toast(file.name+' exceeds 20 MB.',true);return}
  if(safeTarget==='quote'&&safeQuoteId){await saveSafeFiles(safeQuoteId,images);if(typeof window.qbDetails==='function')await window.qbDetails(safeQuoteId);return}
  images.forEach(file=>safePending.push({file:file,url:URL.createObjectURL(file)}));renderSafePending()
}
function renderSafePending(){
  const host=$('qbPendingPhotos');if(!host)return;
  host.innerHTML=safePending.length?safePending.map((item,index)=>'<article class="qb-photo-card"><img src="'+esc(item.url)+'" alt="Quote picture '+(index+1)+'"><button class="qb-photo-remove" type="button" aria-label="Remove picture" onclick="qbSafeRemovePendingPhoto('+index+')">×</button><div class="qb-photo-meta"><strong>'+esc(item.file.name)+'</strong><span>'+Math.max(1,Math.round(item.file.size/1024))+' KB · saves with quote</span></div></article>').join(''):'<div class="qb-status-line">No pictures selected yet.</div>';
  const count=$('qbPendingCount');if(count)count.textContent=safePending.length?safePending.length+' picture'+(safePending.length===1?'':'s')+' ready to save':'Pictures save automatically with the draft quote.';
}
window.qbSafeRemovePendingPhoto=index=>{const item=safePending[index];if(item)URL.revokeObjectURL(item.url);safePending.splice(index,1);renderSafePending()};
async function saveSafeFiles(quoteId,files){
  busy(true);try{const saved=[];for(let i=0;i<files.length;i+=3){const group=files.slice(i,i+3);const results=await Promise.all(group.map(async file=>api('saveQuotePhoto',{payload:{quoteId:quoteId,fileName:file.name,mimeType:mime(file),base64Data:await dataUrl(file)}})));saved.push(...results)}toast(saved.length+' picture'+(saved.length===1?'':'s')+' saved with the quote.');return saved}finally{busy(false)}
}
function installSafeCameraGlobals(){
  ensureSafeInputs();
  window.qbCameraTakeForDraft=()=>openSafePicker('camera','draft','');
  window.qbCameraChooseForDraft=()=>openSafePicker('files','draft','');
  window.qbCameraTakeForQuote=quoteId=>openSafePicker('camera','quote',quoteId);
  window.qbCameraChooseForQuote=quoteId=>openSafePicker('files','quote',quoteId);
}
function enhanceCameraControls(){
  const aiFiles=$('aiFiles');if(aiFiles)aiFiles.removeAttribute('capture');
  const draftActions=document.querySelector('#qbQuotePhotoPanel .qb-camera-actions');
  if(draftActions&&!draftActions.querySelector('[data-safe-choose]'))draftActions.insertAdjacentHTML('beforeend','<button type="button" class="qb-safe-photo-choice" data-safe-choose="1" onclick="qbCameraChooseForDraft()">Choose Photos</button>');
  const quotePanel=$('qbQuotePhotosPanel');
  if(quotePanel&&!quotePanel.querySelector('[data-safe-choose]')){const head=quotePanel.querySelector('.qb-quote-photo-head');const take=head&&head.querySelector('button');const match=take&&String(take.getAttribute('onclick')||'').match(/qbCameraTakeForQuote\('([^']+)'\)/);if(head&&match)head.insertAdjacentHTML('beforeend','<button type="button" class="qb-safe-photo-choice" data-safe-choose="1" onclick="qbCameraChooseForQuote(\''+esc(match[1])+'\')">Choose Photos</button>')}
  const mobile=$('qbMobileCapture');
  if(mobile&&mobile.dataset.safeNative!=='1'){const replacement=mobile.cloneNode(true);replacement.dataset.safeNative='1';replacement.textContent='📷 Take Picture for Quote';replacement.addEventListener('click',()=>window.qbCameraTakeForDraft());mobile.replaceWith(replacement)}
  renderSafePending();
}

function enhance(){wireDraftAutosave();installSafeCameraGlobals();enhanceCameraControls()}
function install(){
  if(installed||typeof window.qbOpen!=='function'||typeof window.qbSave!=='function'||typeof window.qbAddLine!=='function')return false;installed=true;
  const baseAddLine=window.qbAddLine;window.qbAddLine=function(item){let value=item;if(item&&item.Name&&!item.Unit){const match=String(item.Name).match(/\s*\[per\s+([^\]]+)\]\s*$/i);if(match){value=Object.assign({},item,{Name:String(item.Name).replace(match[0],''),Unit:match[1]});if(!value['Customer Description'])value['Customer Description']=value.Name}}return baseAddLine.call(this,value)};
  const baseOpen=window.qbOpen;window.qbOpen=async function(view){if($('customer')&&view!=='new'&&!saving&&!discardNext)captureDraft();if(discardNext){discardNext=false;clearDraft()}const result=await baseOpen.apply(this,arguments);setTimeout(enhance,0);return result};
  const baseSave=window.qbSave;window.qbSave=async function(event){const saveStarted=Date.now(),files=safePending.map(item=>item.file);saving=true;try{const result=await baseSave.apply(this,arguments);if(!$('customer')){clearDraft();if(files.length){const created=await api('quoteBuilderLastCreatedQuote');if(created&&Number(created.createdMs||0)>=saveStarted){await saveSafeFiles(created.quoteId,files);safePending.forEach(item=>URL.revokeObjectURL(item.url));safePending.splice(0,safePending.length);if(typeof window.qbDetails==='function')await window.qbDetails(created.quoteId)}}}else captureDraft();return result}finally{saving=false}};
  document.addEventListener('click',event=>{const button=event.target&&event.target.closest&&event.target.closest('button');if(button&&$('customer')&&String(button.textContent||'').trim()==='Cancel'){discardNext=true;clearDraft()}},true);
  new MutationObserver(()=>setTimeout(enhance,0)).observe($('qbContent'),{childList:true,subtree:true});
  enhance();return true;
}
let attempts=0;const timer=setInterval(()=>{attempts+=1;if(install()||attempts>120)clearInterval(timer)},50);
})();
</script>
