<script>
(function(){'use strict';var M=window.H38_SMW;if(!M)return;
function ids(){return[M.state.project.project['Project ID'],M.state.area&&M.state.area.area['Subquote ID']];}function lines(v,fn){return String(v||'').split(/\n+/).map(function(x){return x.trim();}).filter(Boolean).map(fn);}
function add(env){M.form('Add '+(env==='Indoor'?'Indoor Room':'Outdoor Zone'),[{n:'name',l:'Name',req:true},{n:'areaCode',l:'Area code',v:env==='Indoor'?'Room 101':'Zone A'},{n:'floorOrLevel',l:'Floor / level'},{n:'areaType',l:'Area type',t:'select',o:env==='Indoor'?['INDOOR_ROOM','INDOOR_HALL','INDOOR_STAIR','INDOOR_GARAGE_OR_SHOP']:['OUTDOOR_ZONE','EXTERIOR_STRUCTURE_FACE']},{n:'workTypes',l:'Work types, comma separated',full:true},{n:'criticality',l:'Criticality',t:'select',o:['Normal','Quote-critical','Fabrication-critical']}],'Create',function(v){v.environment=env;v.workTypes=String(v.workTypes||'').split(',').map(function(x){return x.trim();}).filter(Boolean);var p=M.state.project.project['Project ID'];M.run('Creating area',M.rpc('boSiteMeasurementCreateArea',[p,v]),function(r){M.state.project=r;M.renderProject();});});}
M.actions.addOutdoor=function(){add('Outdoor');};M.actions.addIndoor=function(){add('Indoor');};
M.actions.baseline=function(){M.form('Baseline and widths',[{n:'baselineDescription',l:'Baseline description',full:true},{n:'baselineLength',l:'Baseline length (ft)',t:'number',req:true},{n:'tool',l:'Tool',t:'select',o:['25-foot tape','100-foot tape','Measuring wheel','Outdoor laser']},{n:'stations',l:'Stations: distance,width[,recheck]',t:'textarea',ph:'0,3\n4,4.2\n8,5.1',full:true,req:true}],'Calculate',function(v){v.units='ft';v.sourceType='Verified field measurement';v.stations=lines(v.stations,function(x){var p=x.split(',');return{distance:M.num(p[0]),width:M.num(p[1]),checked:p[2]!==undefined,recheckValue:p[2]};});var z=ids();M.run('Saving baseline',M.rpc('boSiteMeasurementSaveBaseline',[z[0],z[1],v]),function(r){M.state.area=r;M.renderArea();});});};
M.actions.shape=function(){M.form('Simple shape',[{n:'shape',l:'Shape',t:'select',o:['rectangle','triangle','trapezoid','circle','half_circle','polygon']},{n:'length',l:'Length',t:'number'},{n:'width',l:'Width',t:'number'},{n:'base',l:'Triangle base',t:'number'},{n:'height',l:'Height',t:'number'},{n:'sideA',l:'Trapezoid side A',t:'number'},{n:'sideB',l:'Trapezoid side B',t:'number'},{n:'radius',l:'Radius',t:'number'},{n:'points',l:'Polygon points x,y',t:'textarea',full:true},{n:'critical',l:'Quote-critical',t:'check',full:true}],'Calculate',function(v){v.sourceType='Verified field measurement';v.verificationStatus='Unverified';v.dimensions={length:M.num(v.length),width:M.num(v.width),base:M.num(v.base),height:M.num(v.height),sideA:M.num(v.sideA),sideB:M.num(v.sideB),radius:M.num(v.radius)};if(v.shape==='polygon')v.dimensions.points=lines(v.points,function(x){var p=x.split(',');return{x:M.num(p[0]),y:M.num(p[1])};});var z=ids();M.run('Saving shape',M.rpc('boSiteMeasurementSaveShape',[z[0],z[1],v]),function(r){M.state.area=r;M.renderArea();});});};
M.actions.room=function(){M.form('Indoor room',[{n:'method',l:'Method',t:'select',o:['Tape measure','Laser distance meter','AR point-to-point','AR room scan','LiDAR-assisted room capture']},{n:'length',l:'Length (ft)',t:'number',req:true},{n:'width',l:'Width (ft)',t:'number',req:true},{n:'height',l:'Ceiling height (ft)',t:'number',req:true},{n:'openings',l:'Opening: type,width,height,count,verified,critical',t:'textarea',full:true},{n:'checked',l:'Required field checks completed',t:'check',full:true}],'Calculate',function(v){v.sourceType=v.method;v.deviceCapability=M.state.ar;v.openings=lines(v.openings,function(x){var p=x.split(',');return{type:p[0],width:M.num(p[1]),height:M.num(p[2]),count:M.num(p[3]||1),verified:p[4]==='true',critical:p[5]==='true'};});var z=ids();M.run('Saving room',M.rpc('boSiteMeasurementSaveRoom',[z[0],z[1],v]),function(r){M.state.area=r;M.renderArea();});});};
M.actions.material=function(){M.form('Material calculator',[{n:'calculatorType',l:'Calculator',t:'select',o:['mulch','paint','flooring','drywall','trim']},{n:'areaSqFt',l:'Area sq ft',t:'number'},{n:'linearFeet',l:'Linear feet',t:'number'},{n:'depthIn',l:'Depth inches',t:'number',v:'3'},{n:'coats',l:'Coats',t:'number',v:'2'},{n:'coverageSqFtPerGallon',l:'Paint coverage',t:'number',v:'350'},{n:'packageCoverageSqFt',l:'Package coverage',t:'number',v:'20'},{n:'layers',l:'Drywall layers',t:'number',v:'1'},{n:'sheetAreaSqFt',l:'Sheet area',t:'number',v:'32'},{n:'stockLengthFeet',l:'Trim stock length',t:'number',v:'16'},{n:'wasteFactor',l:'Waste decimal',t:'number',v:'0.1'}],'Calculate',function(v){v.inputs={};Object.keys(v).forEach(function(k){if(k!=='calculatorType')v.inputs[k]=M.num(v[k]);});var z=ids();M.run('Calculating material',M.rpc('boSiteMeasurementSaveMaterial',[z[0],z[1],v]),function(r){M.state.area=r.area;M.renderArea();});});};
M.actions.verify=function(){var r=M.state.area.measurements||[];if(!r.length)return M.toast('Record a measurement first.',true);M.form('Verify measurement',[{n:'measurementId',l:'Measurement',t:'select',o:r.map(function(x){return{v:x['Measurement ID'],l:x['Measurement Type']+' — '+x.Value+' '+x.Units};})},{n:'checkedValue',l:'Checked value',t:'number',req:true},{n:'tolerance',l:'Tolerance',t:'number',v:'0.25'},{n:'tool',l:'Check tool',t:'select',o:['Tape measure','Laser distance meter','Measuring wheel']}],'Compare',function(v){var z=ids();M.run('Verifying measurement',M.rpc('boSiteMeasurementVerify',[z[0],z[1],v]),function(){M.actions.area(z[1]);});});};
})();
</script>
