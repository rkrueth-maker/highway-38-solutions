<style>
.qb-reopen-banner{background:#fff2c7;border:1px solid #e4ca73;border-radius:9px;padding:10px;margin-bottom:12px;line-height:1.4}.qb-reopen-photo{margin-top:12px;padding:12px;border:2px solid #8fb4cf;border-radius:12px;background:linear-gradient(135deg,#f5fbff,#e9f4fb)}.qb-reopen-photo h3{margin:0;color:var(--navy)}.qb-reopen-photo p{margin:5px 0 10px;color:var(--muted);line-height:1.4}.qb-reopen-photo .qb-simple-photo-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.qb-reopen-photo .qb-simple-photo-actions button{width:100%}.qb-reopen-photo .qb-simple-build{grid-column:1/-1;background:linear-gradient(135deg,var(--navy),#0f2d49);color:#fff}.qb-reopen-photo .qb-simple-more{display:block;width:100%;margin-top:7px;background:transparent;color:var(--navy);border:1px solid #b8cad7}.qb-reopen-photo .qb-simple-photo-status{min-height:18px;margin-top:8px;font-size:11px;font-weight:800;color:var(--navy)}
</style>
<script>
(function(){
'use strict';
const ctx=window.H38_QB_CONTEXT||{};
const $=id=>document.getElementById(id);
const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=value=>String(value==null?'':value).trim();
const num=value=>{const n=Number(String(value==null?'':value).replace(/[$,%]/g,''));return Number.isFinite(n)?n:0};
const money=value=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(num(value));
const direct=(name,payload)=>new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name](payload)});
const original={add:window.qbAddLine,remove:window.qbRemoveLine,line:window.qbLine,calc:window.qbCalc,open:window.qbOpen};
let editState=null;
let openWrapped=false;
function toast(message,bad){const node=$('qbToast');if(!node)return;node.textContent=message;node.style.background=bad?'#8f1d1d':'#162331';node.classList.add('show');setTimeout(()=>node.classList.remove('show'),6500)}
function loading(message){const host=$('qbContent');if(host)host.innerHTML='<div class="panel loading-card">'+esc(message||'Loading…')+'</div>'}
function blankLine(item){item=item||{};return {lineId:item.lineId||'',catalogId:item.catalogId||item['Product / Service ID']||'',description:item.description||item['Customer Description']||item.Description||item.Name||'',quantity:item.quantity==null?1:item.quantity,unit:item.unit||item.Unit||'each',rate:item.rate||item['Standard Selling Price']||item.Price||0,discount:item.discount||0,taxable:item.taxable===true||item.taxable==='Yes',taxRate:item.taxRate||0,accountCode:item.accountCode||'4000',jobCostCategory:item.jobCostCategory||'Service Revenue',notes:item.notes||''}}
function customerOptions(customers,selected){return (customers||[]).map(customer=>'<option value="'+esc(customer.customerId)+'" '+(customer.customerId===selected?'selected':'')+'>'+esc(customer.displayName||customer.customerId)+'</option>').join('')}
function restoreLineFunctions(){window.qbAddLine=original.add;window.qbRemoveLine=original.remove;window.qbLine=original.line;window.qbCalc=original.calc}
function leaveEdit(){editState=null;restoreLineFunctions();document.body.classList.remove('qb-mobile-show-advanced');if(typeof window.qbResetStagedPhotoState==='function')window.qbResetStagedPhotoState()}
function calculate(){if(!editState)return;let subtotal=0,tax=0;editState.lines.forEach(line=>{const base=Math.max(0,num(line.quantity)*num(line.rate)-num(line.discount));subtotal+=base;if(line.taxable){let rate=num(line.taxRate);if(rate>1)rate/=100;tax+=base*rate}});const deposit=$('deposit')?num($('deposit').value):0;const host=$('totals');if(host)host.innerHTML='<div class="total-row"><span>Subtotal</span><strong>'+money(subtotal)+'</strong></div><div class="total-row"><span>Tax</span><strong>'+money(tax)+'</strong></div><div class="total-row"><span>Deposit</span><strong>'+money(deposit)+'</strong></div><div class="total-row final"><span>Total</span><strong>'+money(subtotal+tax)+'</strong></div>'}
function renderLines(){const host=$('lines');if(!host||!editState)return;host.innerHTML=editState.lines.map((line,index)=>'<div class="line"><label class="description">Description *<input required value="'+esc(line.description||'')+'" oninput="qbLine('+index+',\'description\',this.value)"></label><label>Qty<input type="number" min="0" step="0.01" value="'+esc(line.quantity)+'" oninput="qbLine('+index+',\'quantity\',this.value)"></label><label>Unit<input value="'+esc(line.unit||'each')+'" oninput="qbLine('+index+',\'unit\',this.value)"></label><label>Rate<input type="number" min="0" step="0.01" value="'+esc(line.rate||0)+'" oninput="qbLine('+index+',\'rate\',this.value)"></label><label>Discount<input type="number" min="0" step="0.01" value="'+esc(line.discount||0)+'" oninput="qbLine('+index+',\'discount\',this.value)"></label><label>Taxable<input type="checkbox" '+(line.taxable?'checked':'')+' onchange="qbLine('+index+',\'taxable\',this.checked)"></label><button type="button" class="danger" onclick="qbRemoveLine('+index+')">Remove</button></div>').join('');calculate()}
function activateLineFunctions(){window.qbAddLine=function(item){if(!editState)return original.add&&original.add(item);editState.lines.push(blankLine(item));renderLines()};window.qbRemoveLine=function(index){if(!editState)return original.remove&&original.remove(index);editState.lines.length===1?editState.lines=[blankLine()]:editState.lines.splice(index,1);renderLines()};window.qbLine=function(index,key,value){if(!editState||!editState.lines[index])return;editState.lines[index][key]=key==='taxable'?!!value:value;calculate()};window.qbCalc=calculate}
function installMoreButton(){const button=$('qbSimpleMore');if(!button)return;button.addEventListener('click',event=>{event.preventDefault();const showing=document.body.classList.toggle('qb-mobile-show-advanced');button.textContent=showing?'Hide extra quote fields':'Show more quote fields'})}
function renderBuilder(bundle){if(typeof window.qbResetStagedPhotoState==='function')window.qbResetStagedPhotoState();const quote=bundle.quote||{};editState={bundle:bundle,quote:quote,lines:(bundle.lines||[]).map(blankLine)};if(!editState.lines.length)editState.lines=[blankLine()];activateLineFunctions();const host=$('qbContent');if(!host)return;host.innerHTML='<div class="shell"><div class="hero"><div><small>HIGHWAY 38 QUOTE BUILDER</small><h2>Edit and reprocess '+esc(quote.quoteNumber||'saved draft')+'</h2><p>The saved draft is loaded back into the Quote Builder. Change the scope or lines, add new photos, and press Build Quote to run the estimate again.</p></div><div class="actions"><button type="button" class="secondary" onclick="qbOpen(\'dashboard\')">Dashboard</button></div></div><form class="panel" onsubmit="qbSaveExistingQuote(event)"><div class="qb-reopen-banner"><strong>Owner-controlled draft:</strong> Reprocessing can add new suggested lines. Review and remove old or duplicate lines before saving. Nothing is approved or sent automatically.</div><div class="form-grid"><label>Customer *<select id="customer" required>'+customerOptions(bundle.customers,quote.customerId)+'</select></label><label>Project title *<input id="project" required value="'+esc(quote.projectTitle||'')+'"></label><label>Quote date<input id="quoteDate" type="date" value="'+esc(quote.quoteDate||'')+'"></label><label>Expiration date<input id="expiration" type="date" value="'+esc(quote.expirationDate||'')+'"></label><label>Payment terms<input id="terms" value="'+esc(quote.paymentTerms||'Net 15')+'"></label><label>Deposit<input id="deposit" type="number" min="0" step="0.01" value="'+esc(quote.deposit||0)+'" oninput="qbCalc()"></label><label class="full">Scope<textarea id="scope">'+esc(quote.scope||'')+'</textarea></label><label class="full">Assumptions<textarea id="assumptions">'+esc(quote.assumptions||'')+'</textarea></label><label class="full">Exclusions<textarea id="exclusions">'+esc(quote.exclusions||'')+'</textarea></label><label class="full">Customer notes<textarea id="customerNotes">'+esc(quote.customerNotes||'')+'</textarea></label><label class="full">Internal notes<textarea id="internalNotes">'+esc(quote.internalNotes||'')+'</textarea></label></div><section id="qbSimplePhotoQuote" class="qb-simple-photo-quote qb-reopen-photo"><h3>Build quote from photos</h3><p>Add new pictures and press Build Quote. Selected pictures upload immediately while Android still grants access, then AI reprocesses this saved draft.</p><div class="qb-simple-photo-actions"><button type="button" id="qbSimpleTake" class="camera-action">📷 Take Picture</button><button type="button" id="qbSimpleChoose" class="secondary">Choose Photos</button><button type="button" id="qbSimpleBuild" class="qb-simple-build">Build Quote</button></div><button type="button" id="qbSimpleMore" class="qb-simple-more">Show more quote fields</button><div id="qbSimplePhotoStatus" class="qb-simple-photo-status">Ready for photos.</div></section><section id="qbQuotePhotoPanel" hidden></section><div class="toolbar" style="justify-content:space-between;margin-top:16px"><h3>Quote lines</h3><button type="button" class="secondary" onclick="qbAddLine()">Add Line</button></div><div id="lines" class="lines"></div><div id="totals" class="totals"></div><div class="notice" style="background:var(--warn)"><strong>Internal draft only.</strong> Saving resets approval and does not send the quote.</div><div class="toolbar"><button class="primary" type="submit">Save Quote Changes</button><button type="button" class="secondary" onclick="qbOpen(\'dashboard\')">Cancel</button></div></form></div>';renderLines();installMoreButton();window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>window.dispatchEvent(new Event('resize')),0)}
window.qbEditExisting=async function(quoteId){if(!(ctx.permissions&&ctx.permissions.edit))return toast('Your role does not allow quote editing.',true);loading('Loading saved draft into Quote Builder…');try{renderBuilder(await direct('boQuoteBuilderEditableQuote',{quoteId:quoteId}))}catch(error){const message=clean(error&&error.message||error)||'The quote could not be opened for editing.';const host=$('qbContent');if(host)host.innerHTML='<div class="panel notice bad"><strong>Quote edit stopped safely.</strong><br>'+esc(message)+'<div class="toolbar" style="margin-top:12px"><button type="button" class="secondary" onclick="qbOpen(\'dashboard\')">Dashboard</button></div></div>';toast(message,true)}};
window.qbSaveExistingQuote=async function(event){if(event)event.preventDefault();if(!editState)return;const lines=editState.lines.map(line=>({lineId:line.lineId||'',catalogId:line.catalogId||'',description:clean(line.description),quantity:num(line.quantity),unit:clean(line.unit)||'each',rate:num(line.rate),discount:num(line.discount),taxable:!!line.taxable,taxRate:num(line.taxRate),accountCode:line.accountCode||'4000',jobCostCategory:line.jobCostCategory||'Service Revenue',notes:line.notes||''})).filter(line=>line.description&&line.quantity>0);if(!$('customer').value||!clean($('project').value)||!lines.length)return toast('Choose a customer, enter a project title, and keep at least one quote line.',true);const button=event&&event.submitter;if(button){button.disabled=true;button.textContent='Saving changes…'}try{const result=await direct('boQuoteBuilderUpdateEditableQuote',{quoteId:editState.quote.quoteId,editToken:editState.bundle.editToken,customerId:$('customer').value,projectTitle:clean($('project').value),quoteDate:$('quoteDate').value,expirationDate:$('expiration').value,paymentTerms:$('terms').value,deposit:num($('deposit').value),scope:$('scope').value,assumptions:$('assumptions').value,exclusions:$('exclusions').value,customerNotes:$('customerNotes').value,internalNotes:$('internalNotes').value,lines:lines});if(typeof window.qbAttachStagedPhotosToQuote==='function'){try{await window.qbAttachStagedPhotosToQuote(result.quoteId)}catch(photoError){toast('Quote saved, but the new photo link needs review: '+clean(photoError&&photoError.message||photoError),true)}}toast('Quote '+(result.quoteNumber||'')+' updated and returned to Draft. Nothing was sent.');await window.qbEditExisting(result.quoteId)}catch(error){toast(clean(error&&error.message||error)||'The quote could not be saved.',true)}finally{if(button&&document.body.contains(button)){button.disabled=false;button.textContent='Save Quote Changes'}}};
function wrapOpen(){if(openWrapped||typeof window.qbOpen!=='function')return;openWrapped=true;const prior=window.qbOpen;window.qbOpen=function(){if(editState)leaveEdit();return prior.apply(this,arguments)}}

function addDashboardEditButtons(){if(!(ctx.permissions&&ctx.permissions.edit))return;document.querySelectorAll('#qbContent button[onclick*="qbDetails("]').forEach(openButton=>{const raw=openButton.getAttribute('onclick')||'',match=raw.match(/qbDetails\('([^']+)'\)/);if(!match)return;const quoteId=match[1],parent=openButton.parentElement;if(!parent||parent.querySelector('[data-qb-edit-id="'+quoteId.replace(/"/g,'')+'"]'))return;const edit=document.createElement('button');edit.type='button';edit.className='secondary';edit.dataset.qbEditId=quoteId;edit.textContent='Edit';edit.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();window.qbEditExisting(quoteId)});openButton.insertAdjacentElement('afterend',edit)})}
function injectDetailEdit(quoteId){if(!(ctx.permissions&&ctx.permissions.edit)||!quoteId)return;const actions=document.querySelector('#qbContent .hero .actions');if(!actions||actions.querySelector('[data-qb-detail-edit]'))return;const edit=document.createElement('button');edit.type='button';edit.className='primary';edit.dataset.qbDetailEdit='1';edit.textContent='Edit Quote';edit.addEventListener('click',()=>window.qbEditExisting(quoteId));actions.insertBefore(edit,actions.firstChild)}
function wrapDetails(){const current=window.qbDetails;if(typeof current==='function'&&!current.__h38ReopenDraft){const prior=current;const wrapped=function(quoteId){const result=prior.apply(this,arguments);return Promise.resolve(result).then(value=>{setTimeout(()=>injectDetailEdit(quoteId),0);return value})};wrapped.__h38ReopenDraft=true;window.qbDetails=wrapped}const currentSaved=window.qbOpenSavedQuote;if(typeof currentSaved==='function'&&!currentSaved.__h38ReopenDraft){const priorSaved=currentSaved;const wrappedSaved=function(quoteId){const result=priorSaved.apply(this,arguments);return Promise.resolve(result).then(value=>{setTimeout(()=>injectDetailEdit(quoteId),0);return value})};wrappedSaved.__h38ReopenDraft=true;window.qbOpenSavedQuote=wrappedSaved}}
function install(){wrapOpen();wrapDetails();addDashboardEditButtons()}
const observer=new MutationObserver(()=>requestAnimationFrame(install));observer.observe($('qbContent')||document.body,{childList:true,subtree:true});
install();setInterval(install,600);

})();
</script>
