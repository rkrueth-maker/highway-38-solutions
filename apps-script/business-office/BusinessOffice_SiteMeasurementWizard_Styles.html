<style>
.smw{display:grid;gap:14px}.smw-hero{background:linear-gradient(135deg,#173a5e,#1f6b47);color:#fff;border-radius:16px;padding:18px}.smw-hero h2{margin:4px 0}.smw-hero p{margin:6px 0;color:#e8f1ed;max-width:850px}.smw-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}.smw-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:13px;display:grid;gap:7px}.smw-card h3{margin:0;color:var(--navy)}.smw-actions{display:flex;gap:7px;flex-wrap:wrap}.smw-badge{display:inline-flex;width:max-content;padding:4px 8px;border-radius:999px;background:var(--warn);font-size:11px;font-weight:900}.smw-badge.good{background:var(--good);color:#15552e}.smw-badge.bad{background:var(--bad);color:#7a1515}.smw-note{padding:11px;border:1px solid #bfd3c7;border-radius:10px;background:#eef4f0}.smw-dialog{border:0;border-radius:14px;padding:0;width:min(720px,calc(100vw - 22px));max-height:92vh}.smw-dialog::backdrop{background:rgba(11,31,52,.58)}.smw-head{background:var(--navy);color:#fff;padding:14px 17px;display:flex;justify-content:space-between}.smw-head h3{margin:0}.smw-body{padding:16px;overflow:auto;max-height:72vh}.smw-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.smw-form .full{grid-column:1/-1}.smw-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}.smw-list button{width:100%;text-align:left;margin:6px 0}.smw-table{overflow:auto}.smw-table table{min-width:760px}@media(max-width:620px){.smw-form{grid-template-columns:1fr}.smw-form .full{grid-column:auto}}
</style>
<dialog class="smw-dialog" id="smwDialog"><form id="smwForm"><div class="smw-head"><h3 id="smwTitle">Measurements</h3><button type="button" class="secondary" id="smwClose">Close</button></div><div class="smw-body" id="smwBody"></div><div class="smw-foot"><button type="button" class="secondary" id="smwCancel">Cancel</button><button class="primary" id="smwSave">Save</button></div></form></dialog>
