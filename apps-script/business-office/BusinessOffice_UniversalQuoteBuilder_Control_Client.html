<style>
.uqbr-shell{display:grid;gap:14px}.uqbr-head{background:linear-gradient(135deg,#3b1d0d,#8a431c);color:#fff;border-radius:16px;padding:22px;display:flex;justify-content:space-between;gap:16px}.uqbr-head h2{margin:5px 0;font-size:clamp(1.7rem,4vw,2.5rem)}.uqbr-head p{color:#ffe5d2;max-width:760px;line-height:1.5}.uqbr-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.uqbr-project{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--border);border-radius:11px;padding:12px;margin:8px 0;background:#fff}.uqbr-project h3{margin:0;color:var(--navy)}.uqbr-actions{display:flex;gap:7px;flex-wrap:wrap}.uqbr-finding{display:grid;grid-template-columns:90px 140px 1fr;gap:10px;padding:9px;border-bottom:1px solid var(--border)}.uqbr-pack{border:1px solid var(--border);border-radius:11px;padding:12px;margin:8px 0}.uqbr-pack h4{margin:0 0 6px}@media(max-width:850px){.uqbr-grid{grid-template-columns:1fr}.uqbr-head{display:block}.uqbr-finding{grid-template-columns:1fr}}
</style>
<script>
(function(){
'use strict';
var priorOpen=window.qbOpen,ctx=window.H38_QB_CONTEXT||{},state={projects:[],current:null,review:null,packs:[]};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(v){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v)||0);}
function rpc(name,args){return new Promise(function(resolve,reject){var r=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);r[name].apply(r,args||[]);});}
function busy(on,label){var e=document.getElementById('qbOverlay');if(e){e.textContent=label||'Working…';e.classList.toggle('show',!!on);}}
function toast(text,bad){var e=document.getElementById('qbToast');if(!e)return;e.textContent=text;e.style.background=bad?'#7a1515':'#162331';e.classList.add('show');setTimeout(function(){e.classList.remove('show');},4500);}
function badge(v){var t=String(v||'Not set'),k=/pass|approved|current|active|complete/i.test(t)?'good':/hold|rejected|error/i.test(t)?'bad':'warn';return '<span class="uqb-badge '+k+'">'+esc(t)+'</span>';}
function nav(){var n=document.getElementById('qbNav');if(!n)return;var b=document.getElementById('qbUniversalReviewNav');if(!b){b=document.createElement('button');b.id='qbUniversalReviewNav';b.type='button';b.textContent='UQB Review';b.onclick=function(){window.qbOpen('universalReview');};n.insertBefore(b,n.querySelector('.full-system')||null);}b.classList.toggle('active',window.H38_UQB_REVIEW===true);}
async function open(){window.H38_UQB_REVIEW=true;nav();document.querySelectorAll('#qbNav button').forEach(function(b){if(b.id!=='qbUniversalReviewNav')b.classList.remove('active');});document.getElementById('qbContent').innerHTML='<div class="panel loading-card">Opening Universal Quote review…</div>';busy(true,'Loading review controls…');try{var values=await Promise.all([rpc('boUniversalListProjects',[{}]),rpc('boUniversalListKnowledgePacks',[])]);state.projects=values[0].projects||[];state.packs=values[1]||[];renderList();}catch(e){error(e);}finally{busy(false);}}
function shell(content){return '<div class="uqbr-shell"><section class="uqbr-head"><div><span class="uqb-kicker">Owner approval center</span><h2>Universal Quote review and release controls</h2><p>Review completeness, clear consistency conflicts, approve or reject structured records, activate business rules, and prepare controlled completion documents. No customer, vendor, payment, purchase, or scheduling action is executed here.</p></div><div class="uqbr-actions"><button class="secondary" data-uqbr="builder">Open Builder</button></div></section>'+content+'</div>';}
function renderList(){var projects=state.projects.map(function(p){return '<article class="uqbr-project"><div><h3>'+esc(p.title)+'</h3><p style="margin:5px 0;color:var(--muted)">'+esc(p.customerName||'No customer')+' · Level '+esc(p.level)+' · '+money(p.total)+'</p>'+badge(p.approvalStatus)+' '+badge(p.consistencyStatus)+'</div><button class="secondary" data-uqbr="open" data-id="'+esc(p.projectId)+'">Review</button></article>';}).join('')||'<div class="uqb-empty">No structured Universal Quote projects exist yet.</div>';var packs=state.packs.map(function(k){return '<article class="uqbr-pack"><h4>'+esc(k['Pack Name'])+'</h4><div>Version '+esc(k.Version)+' · '+badge(k.Active==='Yes'?'Active':k['Approval Status'])+'</div>'+(k.Active==='Yes'?'':'<button class="secondary" style="margin-top:8px" data-uqbr="activate" data-id="'+esc(k['Knowledge Pack ID'])+'">Approve and Activate</button>')+'</article>';}).join('')||'<div class="uqb-empty">No Business Knowledge Packs prepared.</div>';document.getElementById('qbContent').innerHTML=shell('<div class="uqbr-grid"><section class="panel"><h3>Projects requiring review</h3>'+projects+'</section><section class="panel"><h3>Business Knowledge Packs</h3>'+packs+'</section></div>');bind();}
async function openProject(id){busy(true,'Reviewing project…');try{var values=await Promise.all([rpc('boUniversalGetProject',[id]),rpc('boUniversalReviewProject',[id])]);state.current=values[0];state.review=values[1];renderProject();}catch(e){error(e);}finally{busy(false);}}
function records(title,type,rows,idKey,labelKey,statusKey){return '<section class="panel"><h3>'+esc(title)+'</h3>'+(rows.length?rows.map(function(row){return '<article class="uqbr-project"><div><strong>'+esc(row[labelKey]||row[idKey])+'</strong><br>'+badge(row[statusKey]||'Owner Approval Required')+'</div><button class="secondary" data-uqbr="decision" data-id="'+esc(type+'|'+row[idKey])+'">Approve / Reject</button></article>';}).join(''):'<div class="uqb-empty">No records in this section.</div>')+'</section>';}
function renderProject(){var d=state.current,p=d.project,r=state.review,findings=r.findings.map(function(f){return '<div class="uqbr-finding"><span>'+badge(f.severity)+'</span><strong>'+esc(f.area)+'</strong><span>'+esc(f.message)+'</span></div>';}).join('')||'<div class="uqb-success"><strong>PASS:</strong> No completeness or professional-review findings.</div>';document.getElementById('qbContent').innerHTML=shell('<section class="panel"><div class="uqb-toolbar"><div><button class="secondary" data-uqbr="back">← All Projects</button><h3 style="margin:10px 0 3px">'+esc(p['Project Title'])+'</h3>'+badge(r.status)+' '+badge(p['Consistency Status'])+' '+badge(p['Approval Status'])+'</div><strong style="font-size:24px;color:var(--navy)">'+money(p['Customer Total'])+'</strong></div><div class="uqbr-actions" style="margin-top:12px"><button class="secondary" data-uqbr="refresh">Run Review Again</button><button class="secondary" data-uqbr="consistency">Complete Consistency Review</button><button class="primary" data-uqbr="decision" data-id="Project|'+esc(p['Project ID'])+'">Approve / Reject Project</button><button class="secondary" data-uqbr="completion">Generate Completion Package</button><button class="secondary" data-uqbr="change">Prepare Change Order</button></div></section><section class="panel"><h3>Quote Review findings</h3>'+findings+'</section><div class="uqbr-grid">'+records('Sub-quotes','Subquote',d.subquotes,'Subquote ID','Title','Approval Status')+records('Drawings','Drawing',d.drawings,'Drawing ID','Drawing Title','Approval Status')+'</div>'+records('Bid packages','Bid Package',d.bidPackages,'Bid Package ID','Title','Approval Status'));bind();}
function bind(){document.querySelectorAll('[data-uqbr]').forEach(function(b){b.onclick=function(){action(b.dataset.uqbr,b.dataset.id||'');};});}
function promptText(title,label,defaultValue){var value=window.prompt(title+'\n\n'+label,defaultValue||'');return value==null?null:value.trim();}
async function work(label,fn){busy(true,label);try{var result=await fn();toast(label+' complete.');return result;}catch(e){toast(e.message||String(e),true);throw e;}finally{busy(false);}}
function action(name,id){if(name==='builder'){window.qbOpen('universal');return;}if(name==='back'){state.current=null;renderList();return;}if(name==='open'){openProject(id);return;}if(name==='refresh'){openProject(state.current.project['Project ID']);return;}if(name==='activate'){if(!ctx.user||!ctx.user.owner){toast('Owner approval is required.',true);return;}var note=promptText('Activate Business Knowledge Pack','Enter activation notes:','Reviewed and approved for controlled use.');if(note===null)return;work('Activating Knowledge Pack',function(){return rpc('boUniversalActivateKnowledgePack',[id,note]);}).then(open).catch(function(){});return;}if(!state.current)return;var projectId=state.current.project['Project ID'];if(name==='decision'){if(!ctx.user||!ctx.user.owner){toast('Owner approval is required.',true);return;}var parts=id.split('|'),type=parts.shift(),recordId=parts.join('|'),decision=window.prompt('Decision for '+type+'\n\nEnter Approved or Rejected:','Approved');if(decision===null)return;decision=decision.trim();if(['Approved','Rejected'].indexOf(decision)<0){toast('Decision must be Approved or Rejected.',true);return;}var notes=promptText(type+' '+decision,'Enter decision notes:','Reviewed against current project records.');if(notes===null)return;work('Recording Owner decision',function(){return rpc('boUniversalApproveRecord',[type,recordId,decision,notes]);}).then(function(){return openProject(projectId);}).catch(function(){});return;}if(name==='consistency'){if(!ctx.user||!ctx.user.owner){toast('Owner review is required.',true);return;}var note=promptText('Complete quote consistency review','Review notes:','Measurements, pricing sources, drawing impacts, scope, and quantities reviewed.');if(note===null)return;work('Completing consistency review',function(){return rpc('boUniversalCompleteConsistencyReview',[projectId,note]);}).then(function(){return openProject(projectId);}).catch(function(){});return;}if(name==='completion'){work('Generating completion package',function(){return rpc('boUniversalGenerateCompletionPackage',[projectId]);}).then(function(r){toast(r.documents.length+' private PDFs generated.');if(r.documents[0])window.open(r.documents[0].fileUrl,'_blank');}).catch(function(){});return;}if(name==='change'){var description=promptText('Prepare change order','Describe the requested change:','');if(!description)return;var reason=promptText('Prepare change order','Reason for change:','Scope change under review');if(reason===null)return;var amount=promptText('Prepare change order','Amount change in dollars:','0');if(amount===null)return;var schedule=promptText('Prepare change order','Schedule change:','To be determined after approval');if(schedule===null)return;work('Preparing change order',function(){return rpc('boUniversalPrepareChangeOrderRecord',[projectId,'',{description:description,reason:reason,amountChange:Number(amount)||0,scheduleChange:schedule}]);}).then(function(){return openProject(projectId);}).catch(function(){});}}
function error(e){document.getElementById('qbContent').innerHTML='<div class="panel notice bad"><strong>Review workspace stopped safely.</strong><br>'+esc(e&&e.message||String(e))+'<div style="margin-top:12px"><button class="secondary" data-uqbr="back">Return</button></div></div>';bind();}
window.qbOpen=async function(view){if(view==='universalReview')return open();window.H38_UQB_REVIEW=false;var result=await priorOpen(view);nav();return result;};nav();
})();
</script>
