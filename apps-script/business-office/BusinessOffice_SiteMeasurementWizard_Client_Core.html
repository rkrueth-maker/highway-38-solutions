<script>
(function(){'use strict';
var M=window.H38_SMW={state:{catalog:null,projects:[],project:null,area:null,ar:'Checking…'},actions:{}};
M.esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
M.num=function(v){var n=Number(v);return isFinite(n)?n:0;};
M.rpc=function(name,args){return new Promise(function(ok,bad){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(bad);r[name].apply(r,args||[]);});};
M.toast=function(msg,bad){var e=document.getElementById('qbToast');if(!e)return;e.textContent=msg;e.style.background=bad?'#7a1515':'#162331';e.classList.add('show');setTimeout(function(){e.classList.remove('show');},5500);};
M.busy=function(on,msg){var e=document.getElementById('qbOverlay');if(e){e.textContent=msg||'Working…';e.classList.toggle('show',!!on);}};
M.badge=function(v){var s=String(v||'Not set'),c=/CHECKED|VERIFIED|PASS|FIELD_MEASURED/i.test(s)?'good':/NEEDS|HOLD|CONFLICT/i.test(s)?'bad':'';return'<span class="smw-badge '+c+'">'+M.esc(s)+'</span>';};
M.run=function(label,promise,done){M.busy(true,label);promise.then(function(r){M.busy(false);M.toast(label+' complete.');if(done)done(r);}).catch(function(e){M.busy(false);M.toast(e.message||String(e),true);});};
M.form=function(title,fields,save,handler){var d=document.getElementById('smwDialog'),f=document.getElementById('smwForm');document.getElementById('smwTitle').textContent=title;document.getElementById('smwSave').textContent=save||'Save';document.getElementById('smwBody').innerHTML='<div class="smw-form">'+fields.map(function(x){var id='smw_'+x.n,l='<label class="'+(x.full?'full':'')+'" for="'+id+'">'+M.esc(x.l);if(x.t==='textarea')return l+'<textarea id="'+id+'" name="'+x.n+'" '+(x.req?'required':'')+' placeholder="'+M.esc(x.ph||'')+'">'+M.esc(x.v||'')+'</textarea></label>';if(x.t==='select')return l+'<select id="'+id+'" name="'+x.n+'">'+x.o.map(function(o){var v=typeof o==='string'?o:o.v,z=typeof o==='string'?o:o.l;return'<option value="'+M.esc(v)+'">'+M.esc(z)+'</option>';}).join('')+'</select></label>';if(x.t==='check')return'<label class="'+(x.full?'full':'')+'"><input type="checkbox" name="'+x.n+'" '+(x.v?'checked':'')+'> '+M.esc(x.l)+'</label>';return l+'<input id="'+id+'" name="'+x.n+'" type="'+(x.t||'text')+'" step="'+(x.step||'any')+'" value="'+M.esc(x.v||'')+'" '+(x.req?'required':'')+'></label>';}).join('')+'</div>';f.onsubmit=function(e){e.preventDefault();var fd=new FormData(f),out={};fields.forEach(function(x){out[x.n]=x.t==='check'?f.elements[x.n].checked:fd.get(x.n);});d.close();handler(out);};d.showModal();};
document.getElementById('smwClose').onclick=document.getElementById('smwCancel').onclick=function(){document.getElementById('smwDialog').close();};
M.bind=function(){document.querySelectorAll('[data-smw]').forEach(function(e){e.onclick=function(){var fn=M.actions[e.dataset.smw];if(fn)fn(e.dataset.id||'');};});};
M.shell=function(body){return'<div class="smw"><section class="smw-hero"><strong>Highway 38 Site Measurement Wizard</strong><h2>Indoor and outdoor measurements</h2><p>Outdoor work uses tape, wheel, laser, baseline, and shapes. Indoor AR/LiDAR is assisted capture only; quote-critical dimensions remain subject to field verification. Native live room capture is reserved for the approved Phase 2 integration.</p><div class="smw-actions"><button class="secondary" data-smw="projects">Projects</button></div></section>'+body+'</div>';};
M.renderProjects=function(){var rows=M.state.projects.map(function(p){return'<button class="secondary" data-smw="project" data-id="'+M.esc(p.projectId)+'"><strong>'+M.esc(p.title)+'</strong><br>'+M.esc(p.customerName||'')+' · '+M.esc(p.property||'')+'</button>';}).join('');document.getElementById('qbContent').innerHTML=M.shell('<section class="panel"><h3>Measurement projects</h3><div class="smw-list">'+(rows||'No projects yet.')+'</div></section>');M.bind();};
M.actions.projects=function(){M.run('Loading projects',M.rpc('boUniversalListProjects',[{}]),function(r){M.state.projects=r.projects||[];M.renderProjects();});};
M.actions.project=function(id){M.run('Opening project',M.rpc('boSiteMeasurementGetProject',[id]),function(r){M.state.project=r;M.renderProject();});};
M.renderProject=function(){var p=M.state.project,a=(p.siteMeasurement&&p.siteMeasurement.areas)||[],cards=a.map(function(x){return'<article class="smw-card"><h3>'+M.esc(x.name)+'</h3><div>'+M.badge(x.measurementConfidence)+'</div><p>'+M.esc(x.environment)+' · '+M.esc(x.areaType)+'</p><button class="primary" data-smw="area" data-id="'+x.subquoteId+'">Open</button></article>';}).join('');document.getElementById('qbContent').innerHTML=M.shell('<section class="panel"><div class="smw-actions"><button class="primary" data-smw="addOutdoor">Add Outdoor Zone</button><button class="primary" data-smw="addIndoor">Add Indoor Room</button></div><h3>'+M.esc(p.project['Project Title'])+'</h3><div class="smw-grid">'+(cards||'<div class="smw-note">No measurement areas yet.</div>')+'</div></section>');M.bind();};
M.actions.area=function(id){var pid=M.state.project.project['Project ID'];M.run('Opening area',M.rpc('boSiteMeasurementGetArea',[pid,id]),function(r){M.state.area=r;M.renderArea();});};
M.renderArea=function(){var a=M.state.area,v=a.validation||{},rows=(a.calculations||[]).slice(-10).map(function(c){return'<tr><td>'+M.esc(c['Calculation Type'])+'</td><td>'+M.esc(c.Result)+'</td><td>'+M.esc(c.Units)+'</td></tr>';}).join('');document.getElementById('qbContent').innerHTML=M.shell('<section class="panel"><button class="secondary" data-smw="back">← Project</button><h3>'+M.esc(a.area.Title)+'</h3><div>'+M.badge(v.measurementConfidence)+' '+(v.finalQuoteBlocked?M.badge('Final quote blocked'):'')+'</div><div class="smw-actions"><button data-smw="baseline">Baseline</button><button data-smw="shape">Shape</button><button data-smw="room">Room</button><button data-smw="material">Material</button><button data-smw="verify">Verify</button><button data-smw="validate">Validate</button></div><div class="smw-table"><table><thead><tr><th>Calculation</th><th>Result</th><th>Units</th></tr></thead><tbody>'+rows+'</tbody></table></div></section>');M.bind();};
M.actions.back=function(){M.actions.project(M.state.project.project['Project ID']);};M.actions.validate=function(){var p=M.state.project.project['Project ID'],a=M.state.area.area['Subquote ID'];M.run('Validating area',M.rpc('boSiteMeasurementValidateArea',[p,a]),function(){M.actions.area(a);});};
var prior=window.qbOpen;window.qbOpen=function(view){if(view==='site-measurements'){window.H38_SITE_MEASUREMENT_ACTIVE=true;M.actions.projects();return Promise.resolve();}window.H38_SITE_MEASUREMENT_ACTIVE=false;return prior?prior(view):Promise.resolve();};
M.install=function(){var n=document.getElementById('qbNav');if(!n||document.getElementById('qbMeasurementsNav'))return;var b=document.createElement('button');b.id='qbMeasurementsNav';b.textContent='Measurements';b.onclick=function(){window.qbOpen('site-measurements');};n.insertBefore(b,n.querySelector('.full-system')||null);};new MutationObserver(M.install).observe(document.documentElement,{childList:true,subtree:true});M.install();
if(navigator.xr&&navigator.xr.isSessionSupported)navigator.xr.isSessionSupported('immersive-ar').then(function(x){M.state.ar=x?'Web AR supported; field checks required':'Web AR unavailable; use tape or laser';});
})();
</script>
