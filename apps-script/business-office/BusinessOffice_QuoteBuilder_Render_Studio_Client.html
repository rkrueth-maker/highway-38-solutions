<style>
.qb-render-studio{width:min(1180px,96vw);max-height:94vh;border:0;border-radius:18px;padding:0;box-shadow:0 24px 80px rgba(8,29,48,.34)}
.qb-render-studio::backdrop{background:rgba(8,24,38,.68)}
.qb-render-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:18px 20px;background:linear-gradient(135deg,var(--navy),#0d2944);color:#fff}.qb-render-head h2{margin:0 0 4px;font-size:25px}.qb-render-head p{margin:0;color:#dbe8f3;max-width:760px}.qb-render-close{min-width:44px;padding:8px;background:#fff;color:var(--navy)}
.qb-render-body{padding:18px;max-height:calc(94vh - 86px);overflow:auto;background:#f4f7fa}.qb-render-warning{padding:11px 13px;border:1px solid #e4ca73;border-radius:10px;background:#fff2c7;line-height:1.42;margin-bottom:14px}.qb-render-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.75fr);gap:14px}.qb-render-panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:15px;box-shadow:0 5px 18px rgba(15,39,65,.06)}.qb-render-panel h3{margin:0 0 10px;color:var(--navy)}
.qb-render-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.qb-render-form .full{grid-column:1/-1}.qb-render-form label{font-size:13px}.qb-render-form textarea{min-height:76px}.qb-render-help{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.4}.qb-render-source{display:grid;gap:9px}.qb-render-source-preview{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:12px;background:#e8eef4;min-height:220px;display:grid;place-items:center}.qb-render-source-preview img{display:block;width:100%;max-height:420px;object-fit:contain}.qb-render-source-preview span{padding:24px;color:var(--muted);font-weight:800;text-align:center}
.qb-render-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.qb-render-actions .primary{flex:1;min-width:210px}.qb-render-progress{min-height:24px;margin-top:10px;font-weight:800;color:var(--navy)}.qb-render-context{margin-top:12px;padding:10px;border-radius:10px;background:#eef5fb;color:#28445d;font-size:12px;line-height:1.45}.qb-render-results{display:grid;gap:14px;margin-top:15px}.qb-render-results[hidden]{display:none}.qb-render-results-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.qb-render-results-head h3{margin:0}.qb-render-result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:13px}.qb-render-card{background:#fff;border:2px solid transparent;border-radius:14px;padding:12px;box-shadow:0 6px 20px rgba(15,39,65,.08)}.qb-render-card.selected{border-color:var(--blue);box-shadow:0 8px 24px rgba(50,106,158,.2)}.qb-render-card.approved{border-color:#2a8a50;background:#f3fbf6}.qb-render-card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:9px}.qb-render-card-head strong{font-size:18px;color:var(--navy)}.qb-render-status{display:inline-block;border-radius:999px;padding:4px 8px;background:#e8eef4;color:var(--navy);font-size:11px;font-weight:900}.qb-render-card.approved .qb-render-status{background:#dff4e7;color:#15552e}.qb-render-compare{display:grid;grid-template-columns:1fr 1fr;gap:7px}.qb-render-figure{margin:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#eef2f5}.qb-render-figure img{display:block;width:100%;height:210px;object-fit:cover}.qb-render-figure figcaption{padding:6px 8px;background:#fff;font-size:11px;font-weight:900;color:var(--navy)}.qb-render-label{margin-top:8px;padding:8px;border-left:4px solid #d9a400;background:#fff7d8;font-size:11px;line-height:1.4}.qb-render-card-actions{display:flex;gap:7px;margin-top:9px}.qb-render-card-actions button{flex:1}.qb-render-footer{position:sticky;bottom:-18px;margin:15px -18px -18px;padding:12px 18px;background:rgba(255,255,255,.97);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -8px 22px rgba(15,39,65,.07)}.qb-render-footer-message{font-size:12px;color:var(--muted);line-height:1.4}.qb-render-footer-actions{display:flex;gap:8px}.qb-render-open-label{white-space:nowrap}
@media(max-width:900px),(hover:none) and (pointer:coarse){.qb-render-studio{width:100vw;max-width:100vw;max-height:100vh;height:100vh;border-radius:0}.qb-render-head{padding:13px 14px}.qb-render-head h2{font-size:21px}.qb-render-head p{font-size:12px}.qb-render-body{padding:10px;max-height:calc(100vh - 76px)}.qb-render-grid{grid-template-columns:1fr}.qb-render-form{grid-template-columns:1fr}.qb-render-form .full{grid-column:auto}.qb-render-source-preview{min-height:170px}.qb-render-compare{grid-template-columns:1fr}.qb-render-figure img{height:auto;max-height:390px;object-fit:contain}.qb-render-result-grid{grid-template-columns:1fr}.qb-render-card-actions{display:grid;grid-template-columns:1fr}.qb-render-footer{bottom:-10px;margin:12px -10px -10px;padding:10px;display:block}.qb-render-footer-actions{margin-top:8px}.qb-render-footer-actions button{width:100%}}
</style>
<script>
(function(){
'use strict';
const BUTTON_SELECTOR='#qbCreateAiVisual,#qbMobileCreateAiVisual';
const $=id=>document.getElementById(id);
const clean=value=>String(value==null?'':value).trim();
const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const direct=(name,payload)=>new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name](payload)});
let concepts=[],selectedIndex=-1,generating=false,wrapped=false;
function toast(message,bad){const node=$('qbToast');if(!node)return;node.textContent=message;node.style.background=bad?'#8f1d1d':'#162331';node.classList.add('show');setTimeout(()=>node.classList.remove('show'),6500)}
function value(id){const node=$(id);return clean(node&&node.value)}
function currentCustomerId(){for(const id of ['qbCustomerId','customer','aiCustomer','customerId']){const node=$(id);if(node&&node.value)return clean(node.value)}const selected=document.querySelector('[data-customer-id].selected,[data-customer-id][aria-selected="true"]');return clean(selected&&selected.getAttribute('data-customer-id'))}
function currentTitle(){return value('project')||value('aiTitle')||value('qbProjectTitle')||value('projectTitle')||'Proposed completion concept'}
function currentScope(){return value('scope')||value('qbScope')||value('qbFieldNarration')||value('qbFieldNotes')||value('aiNotes')}
function currentAssumptions(){return value('assumptions')}
function currentQuoteId(){return clean(window.H38_QB_ACTIVE_QUOTE_ID)||clean(document.querySelector('[data-quote-id]')&&document.querySelector('[data-quote-id]').getAttribute('data-quote-id'))}
function currentQuoteLines(){return Array.from(document.querySelectorAll('#lines .description input,#lines .description textarea')).map(node=>clean(node.value)).filter(Boolean).slice(0,12)}
function photoElements(){const output=[];document.querySelectorAll('#qbPendingPhotos img,.qb-photo-queue img,.qb-saved-photos img,.qb-saved-photo img').forEach(img=>{if(output.indexOf(img)<0)output.push(img)});return output}
function waitForImage(img){if(img.complete&&img.naturalWidth>0)return Promise.resolve();if(typeof img.decode==='function')return img.decode();return new Promise((resolve,reject)=>{const done=()=>{cleanup();img.naturalWidth>0?resolve():reject(new Error('The selected photo did not load.'))};const fail=()=>{cleanup();reject(new Error('The selected photo did not load.'))};const cleanup=()=>{img.removeEventListener('load',done);img.removeEventListener('error',fail)};img.addEventListener('load',done);img.addEventListener('error',fail);setTimeout(fail,8000)})}
async function prepareImage(img){if(!img)throw new Error('Take or choose a jobsite photo first.');const source=String(img.src||'');if(/^data:image\//i.test(source))return source;await waitForImage(img);const max=1536,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));try{canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.8)}catch(error){throw new Error('This saved photo cannot be read by the phone renderer. Choose the original photo again, then retry.')}finally{canvas.width=1;canvas.height=1}}
function option(value,label){return '<option value="'+esc(value)+'">'+esc(label||value)+'</option>'}
function ensureDialog(){let dialog=$('qbRenderStudio');if(dialog)return dialog;dialog=document.createElement('dialog');dialog.id='qbRenderStudio';dialog.className='qb-render-studio';dialog.innerHTML='<div class="qb-render-head"><div><h2>H38 Render Studio</h2><p>Turn the real jobsite photo and quote scope into owner-reviewed proposed completion concepts.</p></div><button type="button" class="qb-render-close" id="qbRenderClose" aria-label="Close Render Studio">✕</button></div><div class="qb-render-body"><div class="qb-render-warning"><strong>Visualization only.</strong> Concepts are not measurements, engineering, permit approval, customer approval, or proof of completed work. Nothing is sent or attached until you explicitly approve a concept.</div><div class="qb-render-grid"><section class="qb-render-panel"><h3>Design the proposed result</h3><div class="qb-render-form"><label>Project type<select id="qbRenderType">'+['Remodel or repair','Exterior','Landscaping','Garage or shop','Kitchen or bath','Cleanup or restoration','General property improvement'].map(v=>option(v)).join('')+'</select></label><label>Style<select id="qbRenderStyle">'+['Match existing','Clean and practical','Modern','Traditional','Rustic northwoods','Industrial shop','Customer specified'].map(v=>option(v)).join('')+'</select></label><label>Concepts<select id="qbRenderCount">'+option('1','1 concept')+option('2','2 concepts')+option('3','3 concepts')+'</select></label><label>Source photo<select id="qbRenderPhoto"></select></label><label class="full">Materials and products<textarea id="qbRenderMaterials" placeholder="Example: white 6-inch gutters, matching downspouts, white leaf guard"></textarea></label><label class="full">Colors and finishes<textarea id="qbRenderColors" placeholder="Example: satin white, charcoal accents, natural cedar"></textarea></label><label class="full">Must remain unchanged<textarea id="qbRenderPreserve" placeholder="Example: house, roofline, doors, windows, driveway, mature trees, camera angle"></textarea></label><label class="full">Additional instructions<textarea id="qbRenderInstructions" placeholder="Describe placement, access, cleanup, layout details, or customer preferences"></textarea></label></div><p class="qb-render-help">The quote scope, known assumptions, and current quote lines are included automatically.</p><div class="qb-render-actions"><button type="button" class="primary" id="qbRenderGenerate">Generate Concepts</button><button type="button" class="secondary" id="qbRenderRefreshPhotos">Refresh Photos</button></div><div id="qbRenderProgress" class="qb-render-progress"></div><div id="qbRenderContext" class="qb-render-context"></div></section><section class="qb-render-panel"><h3>Original jobsite photo</h3><div class="qb-render-source"><div id="qbRenderSourcePreview" class="qb-render-source-preview"><span>Select a jobsite photo.</span></div><p class="qb-render-help">Render Studio uses one controlling source photo per concept set so perspective and unchanged areas remain consistent.</p></div></section></div><section id="qbRenderResults" class="qb-render-results" hidden><div class="qb-render-results-head"><h3>Before and proposed concepts</h3><span id="qbRenderResultSummary" class="qb-render-status"></span></div><div id="qbRenderResultGrid" class="qb-render-result-grid"></div></section><div class="qb-render-footer"><div id="qbRenderFooterMessage" class="qb-render-footer-message">Select a concept after generation. A saved quote is required before proposal attachment.</div><div class="qb-render-footer-actions"><button type="button" class="secondary" id="qbRenderCloseFooter">Close</button><button type="button" class="primary" id="qbRenderApprove" disabled>Approve Selected & Attach to Quote</button></div></div></div>';document.body.appendChild(dialog);$('qbRenderClose').addEventListener('click',closeStudio);$('qbRenderCloseFooter').addEventListener('click',closeStudio);$('qbRenderGenerate').addEventListener('click',generateConcepts);$('qbRenderRefreshPhotos').addEventListener('click',refreshPhotos);$('qbRenderPhoto').addEventListener('change',showSourcePreview);$('qbRenderApprove').addEventListener('click',approveSelected);dialog.addEventListener('cancel',event=>{event.preventDefault();closeStudio()});return dialog}
function closeStudio(){const dialog=$('qbRenderStudio');if(!dialog)return;if(dialog.open&&dialog.close)dialog.close();else dialog.removeAttribute('open')}
function refreshPhotos(){const select=$('qbRenderPhoto'),photos=photoElements(),prior=select&&select.value;if(!select)return;select.innerHTML=photos.map((img,index)=>option(String(index),'Photo '+(index+1))).join('');if(prior&&Number(prior)<photos.length)select.value=prior;showSourcePreview();if(!photos.length)toast('Take or choose a jobsite photo first.',true)}
function selectedPhoto(){const photos=photoElements(),index=Math.max(0,Number(value('qbRenderPhoto'))||0);return photos[index]||photos[0]||null}
function showSourcePreview(){const host=$('qbRenderSourcePreview'),img=selectedPhoto();if(!host)return;host.innerHTML='';if(!img){host.innerHTML='<span>Take or choose a jobsite photo first.</span>';return}const preview=document.createElement('img');preview.src=img.src;preview.alt='Selected original jobsite photo';host.appendChild(preview)}
function setDefaults(){if(!value('qbRenderMaterials'))$('qbRenderMaterials').value=currentQuoteLines().join('\n');if(!value('qbRenderPreserve'))$('qbRenderPreserve').value='Camera angle, property geometry, unaffected structures, roofline, doors, windows, driveway, existing landscaping, and surroundings.';$('qbRenderCount').value='2';renderContext()}
function renderContext(){const quoteId=currentQuoteId(),lines=currentQuoteLines();$('qbRenderContext').innerHTML='<strong>Quote context used automatically</strong><br>Project: '+esc(currentTitle())+'<br>Scope: '+esc(currentScope()||'No scope entered yet.')+'<br>Known dimensions/assumptions: '+esc(currentAssumptions()||'None entered.')+'<br>Quote items: '+esc(lines.join(' • ')||'No quote lines entered.')+'<br>Saved quote connection: '+esc(quoteId||'Not saved or not opened in Edit mode.')}
function openStudio(){const photos=photoElements();if(!photos.length){toast('Take or choose a jobsite photo before opening Render Studio.',true);return}const dialog=ensureDialog();refreshPhotos();setDefaults();renderConcepts();if(dialog.showModal)dialog.showModal();else dialog.setAttribute('open','')}
function requestPayload(conceptNumber,conceptCount,imageDataUrl){return {customerId:currentCustomerId(),quoteId:currentQuoteId(),projectTitle:currentTitle(),imageDataUrl:imageDataUrl,projectType:value('qbRenderType'),style:value('qbRenderStyle'),materials:value('qbRenderMaterials'),colors:value('qbRenderColors'),preserve:value('qbRenderPreserve'),additionalInstructions:value('qbRenderInstructions'),scope:currentScope(),assumptions:currentAssumptions(),quoteLines:currentQuoteLines(),conceptNumber:conceptNumber,conceptCount:conceptCount}}
function progress(message,bad){const node=$('qbRenderProgress');if(node){node.textContent=message;node.style.color=bad?'#8f1d1d':'var(--navy)'}}
async function generateConcepts(){if(generating)return;const customerId=currentCustomerId();if(!customerId)return toast('Select a customer before generating concepts.',true);const img=selectedPhoto();if(!img)return toast('Take or choose a jobsite photo first.',true);const count=Math.max(1,Math.min(3,Number(value('qbRenderCount'))||1)),button=$('qbRenderGenerate');generating=true;concepts=[];selectedIndex=-1;renderConcepts();button.disabled=true;button.textContent='Preparing photo…';try{const imageDataUrl=await prepareImage(img);for(let index=1;index<=count;index+=1){progress('Generating concept '+index+' of '+count+'…',false);button.textContent='Generating '+index+' of '+count+'…';const payload=requestPayload(index,count,imageDataUrl);const result=await direct('boCreateAiRenderStudioConcept',payload);if(!result||!result.visualUrl)throw new Error('Concept '+index+' did not return an image.');concepts.push({result:result,request:payload,originalUrl:img.src,approved:false});renderConcepts()}progress(count+' concept'+(count===1?'':'s')+' ready. Select the best result for owner approval.',false);toast('Render Studio concepts are ready for owner review.')}catch(error){progress(clean(error&&error.message||error)||'Render Studio stopped safely.',true);toast(clean(error&&error.message||error)||'Render Studio stopped safely.',true)}finally{generating=false;button.disabled=false;button.textContent='Generate Concepts'}}
function renderConcepts(){const section=$('qbRenderResults'),grid=$('qbRenderResultGrid'),summary=$('qbRenderResultSummary'),approve=$('qbRenderApprove');if(!section||!grid)return;if(!concepts.length){section.hidden=true;grid.innerHTML='';if(approve)approve.disabled=true;return}section.hidden=false;summary.textContent=concepts.length+' generated';grid.innerHTML=concepts.map((concept,index)=>'<article class="qb-render-card '+(selectedIndex===index?'selected ':'')+(concept.approved?'approved':'')+'" data-render-index="'+index+'"><div class="qb-render-card-head"><strong>Concept '+(index+1)+'</strong><span class="qb-render-status">'+(concept.approved?'Attached to quote':selectedIndex===index?'Selected':'Owner review')+'</span></div><div class="qb-render-compare"><figure class="qb-render-figure"><img src="'+esc(concept.originalUrl)+'" alt="Original jobsite photo"><figcaption>Before — original jobsite photo</figcaption></figure><figure class="qb-render-figure"><img src="'+esc(concept.result.visualUrl)+'" alt="AI proposed completion concept"><figcaption>Proposed concept '+(index+1)+'</figcaption></figure></div><div class="qb-render-label">'+esc(concept.result.label||'AI Concept Rendering — Proposed Appearance Only. Not proof of completion.')+'</div><div class="qb-render-card-actions"><button type="button" class="'+(selectedIndex===index?'primary':'secondary')+'" data-select-render="'+index+'">'+(selectedIndex===index?'Selected':'Select This Concept')+'</button></div></article>').join('');grid.querySelectorAll('[data-select-render]').forEach(button=>button.addEventListener('click',()=>selectConcept(Number(button.dataset.selectRender))));if(approve){approve.disabled=selectedIndex<0||!currentQuoteId()||concepts.some(c=>c.approved);approve.textContent=concepts.some(c=>c.approved)?'Concept Attached to Quote':'Approve Selected & Attach to Quote'}const footer=$('qbRenderFooterMessage');if(footer)footer.textContent=currentQuoteId()?'Selected concepts can be attached to saved quote '+currentQuoteId()+'. Nothing is sent automatically.':'Save the quote, reopen it with Open and Edit Draft, then approve and attach the selected concept.'}
function selectConcept(index){if(generating||!concepts[index]||concepts.some(c=>c.approved))return;selectedIndex=index;renderConcepts()}
async function approveSelected(){if(selectedIndex<0||!concepts[selectedIndex])return toast('Select a concept first.',true);const quoteId=currentQuoteId();if(!quoteId)return toast('Save the quote and reopen it with Open and Edit Draft before attaching a concept.',true);const concept=concepts[selectedIndex],button=$('qbRenderApprove');button.disabled=true;button.textContent='Attaching concept…';try{const result=await direct('boApproveAiCompletionVisualForQuote',{activityId:concept.result.activityId,quoteId:quoteId,visualFileId:concept.result.visualFileId,originalFileId:concept.result.originalFileId,label:concept.result.label,instructions:concept.result.renderRequest?concept.result.renderRequest.additionalInstructions:concept.request.additionalInstructions,renderRequest:concept.result.renderRequest||concept.request});concept.approved=true;renderConcepts();toast(result&&result.message||'Concept attached to the saved quote. Nothing was sent.')}catch(error){button.disabled=false;button.textContent='Approve Selected & Attach to Quote';toast(clean(error&&error.message||error)||'The concept could not be attached.',true)}}
function labelButtons(){document.querySelectorAll(BUTTON_SELECTOR).forEach(button=>{button.textContent='🖼️ Open Render Studio';button.classList.add('qb-render-open-label');button.setAttribute('aria-label','Open H38 Render Studio')})}
function wrapQuoteNavigation(){if(wrapped)return;if(typeof window.qbEditExisting!=='function'||typeof window.qbOpen!=='function')return;wrapped=true;const edit=window.qbEditExisting;window.qbEditExisting=function(quoteId){window.H38_QB_ACTIVE_QUOTE_ID=clean(quoteId);return edit.apply(this,arguments)};const open=window.qbOpen;window.qbOpen=function(){window.H38_QB_ACTIVE_QUOTE_ID='';return open.apply(this,arguments)};if(typeof window.qbDetails==='function'){const details=window.qbDetails;window.qbDetails=function(quoteId){window.H38_QB_ACTIVE_QUOTE_ID=clean(quoteId);return details.apply(this,arguments)}}}
document.addEventListener('click',event=>{const button=event.target&&event.target.closest&&event.target.closest(BUTTON_SELECTOR);if(!button)return;event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();openStudio()},true);
function install(){labelButtons();wrapQuoteNavigation()}
const observer=new MutationObserver(()=>requestAnimationFrame(install));observer.observe($('qbContent')||document.body,{childList:true,subtree:true});
document.addEventListener('DOMContentLoaded',install);install();setTimeout(install,400);setTimeout(install,1500);
})();
</script>
