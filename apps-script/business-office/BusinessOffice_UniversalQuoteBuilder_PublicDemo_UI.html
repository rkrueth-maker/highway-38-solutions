<style>
.uqb-public-demo-status{margin-top:10px;padding:10px 12px;border-radius:10px;background:#eef4f0;border:1px solid #b9d7c4;color:#173a2a;font-size:12px;line-height:1.45}.uqb-public-demo-status.bad{background:#fee2e2;border-color:#e6aaaa;color:#7a1515}.uqb-public-demo-progress{height:8px;border-radius:99px;background:#d8e2dc;overflow:hidden;margin-top:7px}.uqb-public-demo-progress span{display:block;height:100%;background:#1f6b47;width:0}
</style>
<script>
(function(){
'use strict';
var RUN='PUBLIC-NEW-HOUSE-DEMO-V1',building=false;
function rpc(name,args){return new Promise(function(resolve,reject){var runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name].apply(runner,args||[]);});}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function host(){return document.querySelector('.uqb-head .actions');}
function statusHost(){return document.getElementById('uqbPublicDemoStatus');}
function renderStatus(s,bad){var node=statusHost();if(!node)return;node.className='uqb-public-demo-status'+(bad?' bad':'');if(bad){node.innerHTML='<strong>Public demo stopped safely.</strong><br>'+esc(s);return;}var counts=s&&s.counts||{},expected=s&&s.expected||{};node.innerHTML='<strong>'+(s.complete?'Published from Office records':'Building public demo from Office records')+'</strong><br>'+esc(s.phase||s.nextAction||'Ready')+' · '+Number(s.progressPercent||0)+'%<br><small>Quotes '+Number(counts.subquotes||0)+'/'+Number(expected.subquotes||14)+' · Lines '+Number(counts.items||0)+'/'+Number(expected.items||56)+' · CAD '+Number(counts.drawings||0)+'/'+Number(expected.drawings||10)+' · Documents '+Number(counts.documents||0)+'/'+Number(expected.documents||15)+'</small><div class="uqb-public-demo-progress"><span style="width:'+Math.max(0,Math.min(100,Number(s.progressPercent||0)))+'%"></span></div>';}
async function refresh(){try{renderStatus(await rpc('boUniversalPublicDemoStatus',[RUN]),false);}catch(error){renderStatus(error&&error.message||String(error),true);}}
async function build(){if(building)return;building=true;var button=document.getElementById('uqbBuildPublicDemo');if(button){button.disabled=true;button.textContent='Building Office Demo…';}try{var result;do{result=await rpc('boUniversalPublicDemoStep',[RUN]);renderStatus(result,false);}while(!result.complete);if(window.qbToast){window.qbToast('Office-generated public demo published.');}}catch(error){renderStatus(error&&error.message||String(error),true);}finally{building=false;if(button){button.disabled=false;button.textContent='Build / Refresh Public Demo';}}}
function install(){var actions=host();if(!actions||document.getElementById('uqbBuildPublicDemo'))return;var button=document.createElement('button');button.id='uqbBuildPublicDemo';button.type='button';button.className='primary';button.textContent='Build / Refresh Public Demo';button.addEventListener('click',build);actions.insertBefore(button,actions.firstChild);var shell=actions.closest('.uqb-head');if(shell&&!statusHost()){var status=document.createElement('div');status.id='uqbPublicDemoStatus';status.className='uqb-public-demo-status';status.textContent='Checking Office-generated public demo…';shell.parentNode.insertBefore(status,shell.nextSibling);refresh();}}
var observer=new MutationObserver(install);observer.observe(document.documentElement,{childList:true,subtree:true});install();
})();
</script>
