<style>
.uqb-shell{display:grid;gap:14px}.uqb-head{background:linear-gradient(135deg,#0b2743,#173a5e);color:#fff;border-radius:16px;padding:22px;display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.uqb-head h2{font-size:clamp(1.8rem,4vw,2.7rem);margin:4px 0}.uqb-head p{max-width:780px;color:#dbe8f3;line-height:1.55;margin:6px 0}.uqb-kicker{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;font-weight:900;color:#ffb57d}.uqb-summary{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:9px}.uqb-stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:13px}.uqb-stat span{display:block;color:var(--muted);font-size:12px;font-weight:800}.uqb-stat strong{display:block;font-size:24px;color:var(--navy);margin-top:5px}.uqb-tabs{display:flex;gap:5px;overflow:auto;padding:7px;background:#e8eef4;border-radius:11px}.uqb-tabs button{min-width:max-content;background:transparent}.uqb-tabs button.active{background:var(--navy);color:#fff}.uqb-pane{display:none}.uqb-pane.active{display:grid;gap:14px}.uqb-card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px}.uqb-card{border:1px solid var(--border);border-radius:12px;background:#fff;padding:14px}.uqb-card h3,.uqb-card h4{margin:4px 0 8px}.uqb-card p{color:var(--muted);line-height:1.5;white-space:normal}.uqb-badge{display:inline-flex;align-items:center;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:900;background:#e8eef4;color:var(--navy)}.uqb-badge.good{background:var(--good);color:#15552e}.uqb-badge.warn{background:var(--warn);color:#684f00}.uqb-badge.bad{background:var(--bad);color:#7a1515}.uqb-row-actions{display:flex;gap:6px;flex-wrap:wrap}.uqb-row-actions button{min-height:34px;padding:6px 9px;font-size:12px}.uqb-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.uqb-toolbar input{width:min(360px,100%);margin:0}.uqb-list button.uqb-project{display:grid;grid-template-columns:minmax(220px,1.4fr) minmax(150px,.7fr) 110px 110px;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:11px;margin:7px 0;align-items:center}.uqb-list button.uqb-project:hover,.uqb-list button.uqb-project:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(50,106,158,.12)}.uqb-project strong,.uqb-project span{white-space:normal}.uqb-title{font-size:16px;color:var(--navy)}.uqb-detail-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.uqb-definition{display:grid;grid-template-columns:minmax(130px,.35fr) 1fr;border-bottom:1px solid var(--border);padding:8px 0;gap:10px}.uqb-definition strong{color:var(--navy)}.uqb-table td{white-space:normal;min-width:110px}.uqb-table td.description{min-width:260px}.uqb-empty{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px;background:#fafcfd}.uqb-dialog{border:0;border-radius:15px;padding:0;width:min(720px,calc(100vw - 28px));max-height:90vh;box-shadow:0 30px 90px rgba(0,0,0,.3)}.uqb-dialog::backdrop{background:rgba(11,31,52,.58)}.uqb-dialog-head{padding:16px 18px;background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center}.uqb-dialog-head h3{margin:0}.uqb-dialog-body{padding:18px;overflow:auto;max-height:calc(90vh - 130px)}.uqb-dialog-actions{padding:13px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}.uqb-help{font-size:12px;color:var(--muted);font-weight:500;margin-top:4px}.uqb-check{display:flex;align-items:center;gap:8px}.uqb-check input{width:auto;min-height:auto;margin:0}.uqb-json{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.uqb-split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.uqb-warning{padding:12px;border:1px solid #e3c25b;background:var(--warn);border-radius:10px;line-height:1.45}.uqb-success{padding:12px;border:1px solid #9ed1ae;background:var(--good);border-radius:10px;line-height:1.45}@media(max-width:960px){.uqb-summary{grid-template-columns:repeat(2,1fr)}.uqb-detail-grid,.uqb-split{grid-template-columns:1fr}.uqb-list button.uqb-project{grid-template-columns:1fr 1fr}}@media(max-width:620px){.uqb-head{display:block}.uqb-head .actions{margin-top:12px}.uqb-summary{grid-template-columns:1fr}.uqb-list button.uqb-project{grid-template-columns:1fr}.uqb-definition{grid-template-columns:1fr}.uqb-dialog-body .form-grid{grid-template-columns:1fr}}
</style>
<dialog class="uqb-dialog" id="uqbDialog" aria-labelledby="uqbDialogTitle"><form method="dialog" id="uqbDialogForm"><div class="uqb-dialog-head"><h3 id="uqbDialogTitle">Universal Quote Builder</h3><button type="button" class="secondary" id="uqbDialogClose" aria-label="Close dialog">Close</button></div><div class="uqb-dialog-body" id="uqbDialogBody"></div><div class="uqb-dialog-actions"><button type="button" class="secondary" id="uqbDialogCancel">Cancel</button><button type="submit" class="primary" id="uqbDialogSubmit">Save</button></div></form></dialog>
<script>
(function(){
'use strict';
var priorOpen=window.qbOpen,state={catalog:null,projects:[],current:null,tab:'overview',customers:[]},ctx=window.H38_QB_CONTEXT||{},dialog=document.getElementById('uqbDialog');
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(v){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v)||0);}
function num(v){var n=Number(v);return Number.isFinite(n)?n:0;}
function json(v,fallback){try{return typeof v==='string'?JSON.parse(v||JSON.stringify(fallback)):v;}catch(e){return fallback;}}
function rpc(name,args){return new Promise(function(resolve,reject){var runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name].apply(runner,args||[]);});}
function busy(on,label){var overlay=document.getElementById('qbOverlay');if(!overlay)return;overlay.textContent=label||'Working…';overlay.classList.toggle('show',!!on);}
function toast(message,bad){var el=document.getElementById('qbToast');if(!el)return;el.textContent=message;el.style.background=bad?'#7a1515':'#162331';el.classList.add('show');setTimeout(function(){el.classList.remove('show');},5000);}
function badge(value){var text=String(value||'Not set'),klass=/approved|pass|complete|current|active/i.test(text)?'good':/rejected|hold|void|error/i.test(text)?'bad':'warn';return '<span class="uqb-badge '+klass+'">'+esc(text)+'</span>';}
function field(def){var id='uqbf_'+def.name,label='<label class="'+(def.full?'full':'')+'" for="'+id+'">'+esc(def.label);if(def.type==='textarea')return label+'<textarea id="'+id+'" name="'+esc(def.name)+'" '+(def.required?'required':'')+'>'+esc(def.value||'')+'</textarea><span class="uqb-help">'+esc(def.help||'')+'</span></label>';if(def.type==='select')return label+'<select id="'+id+'" name="'+esc(def.name)+'" '+(def.required?'required':'')+'>'+def.options.map(function(o){var value=typeof o==='string'?o:o.value,text=typeof o==='string'?o:o.label;return '<option value="'+esc(value)+'" '+(String(value)===String(def.value)?'selected':'')+'>'+esc(text)+'</option>';}).join('')+'</select><span class="uqb-help">'+esc(def.help||'')+'</span></label>';if(def.type==='checkbox')return '<label class="uqb-check '+(def.full?'full':'')+'"><input type="checkbox" name="'+esc(def.name)+'" '+(def.value?'checked':'')+'> '+esc(def.label)+'</label>';return label+'<input id="'+id+'" name="'+esc(def.name)+'" type="'+esc(def.type||'text')+'" value="'+esc(def.value||'')+'" '+(def.step?'step="'+esc(def.step)+'"':'')+' '+(def.required?'required':'')+'><span class="uqb-help">'+esc(def.help||'')+'</span></label>';}
function openForm(title,fields,submitLabel,handler){document.getElementById('uqbDialogTitle').textContent=title;document.getElementById('uqbDialogBody').innerHTML='<div class="form-grid">'+fields.map(field).join('')+'</div>';document.getElementById('uqbDialogSubmit').textContent=submitLabel||'Save';var form=document.getElementById('uqbDialogForm');form.onsubmit=function(event){event.preventDefault();var fd=new FormData(form),data={};fields.forEach(function(f){if(f.type==='checkbox')data[f.name]=form.elements[f.name].checked;else data[f.name]=fd.get(f.name);});dialog.close();handler(data);};dialog.showModal();}
document.getElementById('uqbDialogClose').onclick=function(){dialog.close();};document.getElementById('uqbDialogCancel').onclick=function(){dialog.close();};
function installNav(){var nav=document.getElementById('qbNav');if(!nav)return;var b=document.getElementById('qbUniversalNav');if(!b){b=document.createElement('button');b.id='qbUniversalNav';b.type='button';b.textContent='Universal Builder';b.onclick=function(){window.qbOpen('universal');};nav.insertBefore(b,nav.querySelector('.full-system')||null);}b.classList.toggle('active',window.H38_QB_UNIVERSAL_WORKSPACE===true);}
function shell(content){return '<div class="uqb-shell"><section class="uqb-head"><div><span class="uqb-kicker">Operational Universal Quote Builder</span><h2>Simple when the quote is simple. Deep when the work is complex.</h2><p>Persistent projects, independently manageable sub-quotes, deterministic pricing, drawings, bid packages, controlled agents, professional documents, execution records, and actuals—all inside the current Business Office.</p></div><div class="actions">'+(ctx.user&&ctx.user.owner?'<button class="primary" data-uqb="examples">Prepare Example Run</button><button class="secondary" data-uqb="setup">Verify Storage</button>':'')+'<button class="secondary" data-uqb="new">New Project</button></div></section>'+content+'</div>';}
function bind(root){(root||document).querySelectorAll('[data-uqb]').forEach(function(el){el.onclick=function(){action(el.dataset.uqb,el.dataset.id||'');};});}
async function loadCatalog(){if(!state.catalog)state.catalog=await rpc('boUniversalQuoteBuilderCatalog',[]);return state.catalog;}
async function openWorkspace(){window.H38_QB_UNIVERSAL_WORKSPACE=true;installNav();document.querySelectorAll('#qbNav button').forEach(function(b){if(b.id!=='qbUniversalNav')b.classList.remove('active');});document.getElementById('qbContent').innerHTML='<div class="panel loading-card">Loading operational Universal Quote Builder…</div>';try{await loadCatalog();await refreshProjects();}catch(error){renderError(error);}}
async function refreshProjects(){var result=await rpc('boUniversalListProjects',[{}]);state.projects=result.projects||[];if(result.setupRequired){document.getElementById('qbContent').innerHTML=shell('<section class="panel"><div class="uqb-warning"><strong>Structured storage needs initialization.</strong> An Owner can create the controlled Universal Quote Builder sheets inside the existing Business Office spreadsheet. No new database or app is created.</div>'+(ctx.user&&ctx.user.owner?'<div class="actions" style="margin-top:12px"><button class="primary" data-uqb="setup">Initialize Storage</button></div>':'')+'</section>');bind(document.getElementById('qbContent'));return;}renderProjectList();}
function renderProjectList(){var total=state.projects.reduce(function(t,p){return t+num(p.total);},0),html='<section class="uqb-summary"><div class="uqb-stat"><span>Projects</span><strong>'+state.projects.length+'</strong></div><div class="uqb-stat"><span>Open planning value</span><strong>'+money(total)+'</strong></div><div class="uqb-stat"><span>Quote levels</span><strong>5</strong></div><div class="uqb-stat"><span>External actions</span><strong>0</strong></div></section><section class="panel"><div class="uqb-toolbar"><div><h3 style="margin:0">Structured projects</h3><p style="margin:4px 0;color:var(--muted)">One record drives proposals, sub-quotes, drawings, bids, work preparation, and actual review.</p></div><input id="uqbSearch" type="search" placeholder="Search projects, customers, sites…" aria-label="Search Universal Quote projects"></div><div class="uqb-list" id="uqbProjectList">'+projectRows(state.projects)+'</div></section>';document.getElementById('qbContent').innerHTML=shell(html);bind(document.getElementById('qbContent'));document.getElementById('uqbSearch').oninput=function(){var q=this.value.toLowerCase();var filtered=state.projects.filter(function(p){return[p.title,p.customerName,p.property,p.type].join(' ').toLowerCase().indexOf(q)>=0;});document.getElementById('uqbProjectList').innerHTML=projectRows(filtered);bind(document.getElementById('uqbProjectList'));};}
function projectRows(rows){if(!rows.length)return '<div class="uqb-empty"><strong>No Universal Quote projects yet.</strong><br>Create a customer project or prepare an owner-labeled demonstration run.</div>';return rows.map(function(p){return '<button class="uqb-project" data-uqb="open" data-id="'+esc(p.projectId)+'"><span><strong class="uqb-title">'+esc(p.title)+'</strong><br><small>'+esc(p.customerName||'No customer')+' · '+esc(p.property||'No site')+'</small></span><span>Level '+esc(p.level)+'<br><small>'+esc(p.type)+'</small></span><span>'+money(p.total)+'</span><span>'+badge(p.approvalStatus)+'</span></button>';}).join('');}
async function openProject(id){busy(true,'Opening structured project…');try{state.current=await rpc('boUniversalGetProject',[id]);state.tab='overview';renderProject();}catch(e){renderError(e);}finally{busy(false);}}
function renderProject(){var d=state.current,p=d.project,tabs=['overview','subquotes','pricing','measurements','scope','drawings','bids','setup','exports','actuals'],labels={overview:'Overview',subquotes:'Sub-quotes',pricing:'Pricing',measurements:'Measurements',scope:'Scope & Instructions',drawings:'Drawings',bids:'Bid Packages',setup:'Setup & Agents',exports:'Documents',actuals:'Actuals'},content='<section class="panel"><div class="uqb-toolbar"><div><button class="secondary" data-uqb="back">← Projects</button><h3 style="margin:10px 0 2px">'+esc(p['Project Title'])+'</h3><div>'+badge('Level '+p['Quote Level'])+' '+badge(p['Approval Status'])+' '+badge(p['Consistency Status'])+'</div></div><div style="text-align:right"><strong style="font-size:25px;color:var(--navy)">'+money(p['Customer Total'])+'</strong><br><small>Revision '+esc(p['Revision Number'])+'</small></div></div></section><nav class="uqb-tabs" aria-label="Project sections">'+tabs.map(function(t){return '<button class="'+(state.tab===t?'active':'')+'" data-uqb="tab" data-id="'+t+'">'+labels[t]+'</button>';}).join('')+'</nav>'+tabs.map(function(t){return '<section class="uqb-pane '+(state.tab===t?'active':'')+'" id="uqbPane_'+t+'">'+renderPane(t,d)+'</section>';}).join('');document.getElementById('qbContent').innerHTML=shell(content);bind(document.getElementById('qbContent'));}
function renderPane(tab,d){var p=d.project;if(tab==='overview')return '<div class="uqb-summary"><div class="uqb-stat"><span>Customer total</span><strong>'+money(p['Customer Total'])+'</strong></div><div class="uqb-stat"><span>Internal cost</span><strong>'+money(p['Internal Cost'])+'</strong></div><div class="uqb-stat"><span>Margin</span><strong>'+((num(p.Margin)*100).toFixed(1))+'%</strong></div><div class="uqb-stat"><span>Revision</span><strong>'+esc(p['Revision Number'])+'</strong></div></div><div class="uqb-detail-grid"><section class="panel"><div class="uqb-toolbar"><h3>Project model</h3><button class="secondary" data-uqb="editProject">Edit</button></div>'+defs([['Customer',p['Customer Name']],['Site',p['Property / Site']],['Complexity','Level '+p['Quote Level']+' — '+p['Project Type']],['Summary',p.Summary],['Schedule',p['Schedule Basis']],['Professional review',p['Professional Review Status']],['Assumptions',p.Assumptions],['Exclusions',p.Exclusions],['Risk',p['Risk Summary']]])+'</section><section class="panel"><h3>Connected outputs</h3>'+defs([['Sub-quotes',d.subquotes.length],['Items',d.items.length],['Measurements',d.measurements.length],['Drawings',d.drawings.length],['Bid packages',d.bidPackages.length],['Agent runs',d.agentRuns.length],['Actual records',d.actuals.length],['Master quote ID',p['Master Quote ID']||'Not created']])+'<div class="actions" style="margin-top:12px"><button class="primary" data-uqb="materialize">Create / Refresh Master Quote</button><button class="secondary" data-uqb="reviseProject">New Revision</button></div></section></div>';
if(tab==='subquotes')return tablePanel('Independently manageable sub-quotes','Add Sub-quote','addSubquote',['#','Title','Classification','Customer scope','Internal cost','Customer price','Approval','Actions'],d.subquotes.map(function(s){return[s.Sequence,s.Title,s['Area / System / Trade / Phase / Assembly'],s['Customer Scope'],money(s['Internal Cost']),money(s['Customer Price']),badge(s['Approval Status']),'<div class="uqb-row-actions"><button class="secondary" data-uqb="editSubquote" data-id="'+esc(s['Subquote ID'])+'">Edit</button><button class="secondary" data-uqb="materializeSub" data-id="'+esc(s['Subquote ID'])+'">Create Quote</button><button class="secondary" data-uqb="execution" data-id="'+esc(s['Subquote ID'])+'">Prepare Work</button></div>'];}));
if(tab==='pricing')return tablePanel('Auditable pricing and calculations','Add Pricing Item','addItem',['Description','Sub-quote','Method','Inputs','Formula','Cost','Final price','Source'],d.items.map(function(i){return[i.Description,subTitle(d,i['Subquote ID']),i['Pricing Method'],esc(i['Input Values JSON']),i.Formula,money(i.Cost),money(i['Final Price']),badge(i['Source Status'])];}));
if(tab==='measurements')return tablePanel('Measurements and quantity sources','Add Measurement','addMeasurement',['Area / zone','Type','Value','Units','Source','Verification','Confidence','Notes'],d.measurements.map(function(m){return[m['Area / Zone'],m['Measurement Type'],m.Value,m.Units,m['Source Type']+(m['Source ID']?' · '+m['Source ID']:''),badge(m['Verification Status']),m.Confidence,m.Notes];}));
if(tab==='scope')return '<section class="panel"><div class="uqb-toolbar"><div><h3>Customer scope, instructions, quality, evidence, completion, and change conditions</h3><p style="color:var(--muted)">Each section can reference drawings, photos, specifications, materials, equipment, safety, subcontractors, and inspections.</p></div><button class="primary" data-uqb="addScope">Add Section</button></div><div class="uqb-card-grid">'+(d.scopeSections.length?d.scopeSections.map(function(s){return '<article class="uqb-card"><span class="uqb-badge">'+esc(s['Section Type'])+'</span><h3>'+esc(s.Title)+'</h3><p>'+esc(s.Body)+'</p><small>'+esc(subTitle(d,s['Subquote ID']))+'</small></article>';}).join(''):'<div class="uqb-empty">No structured scope sections yet.</div>')+'</div></section>';
if(tab==='drawings')return tablePanel('Revision-controlled drawing register','Add Drawing','addDrawing',['Sheet','Title','Classification','Rev.','Review','Professional review','Impact','Actions'],d.drawings.map(function(x){return[x['Sheet Number'],x['Drawing Title'],badge(x.Classification),x['Current Revision'],x['Review Status'],badge(x['Professional Review Required']==='Yes'?'Required':'Not flagged'),(x['Quantity Impact']==='Yes'||x['Scope Impact']==='Yes')?badge('Consistency review'):'None','<button class="secondary" data-uqb="reviseDrawing" data-id="'+esc(x['Drawing ID'])+'">Revise</button>'];}));
if(tab==='bids')return '<section class="panel"><div class="uqb-toolbar"><div><h3>Approval-controlled subcontractor bid packages</h3><p style="color:var(--muted)">Prepare, compare, and select bids. No request is sent from this workspace.</p></div><button class="primary" data-uqb="addBidPackage">Add Bid Package</button></div><div class="uqb-card-grid">'+(d.bidPackages.length?d.bidPackages.map(function(b){var bids=d.bids.filter(function(x){return x['Bid Package ID']===b['Bid Package ID'];});return '<article class="uqb-card"><span class="uqb-badge">Rev '+esc(b['Revision Number'])+'</span><h3>'+esc(b.Title)+'</h3><p>'+esc(b.Scope)+'</p><div>'+badge(b['Approval Status'])+' '+badge('Send '+b['Send Allowed'])+'</div><p><strong>'+bids.length+'</strong> bid(s) recorded'+(b['Selected Bid ID']?' · selected '+esc(b['Selected Bid ID']):'')+'</p><div class="uqb-row-actions"><button class="secondary" data-uqb="recordBid" data-id="'+esc(b['Bid Package ID'])+'">Record Bid</button><button class="secondary" data-uqb="compareBids" data-id="'+esc(b['Bid Package ID'])+'">Compare</button></div></article>';}).join(''):'<div class="uqb-empty">No bid packages yet.</div>')+'</div></section>';
if(tab==='setup')return '<div class="uqb-split"><section class="panel"><div class="uqb-toolbar"><div><h3>Business Knowledge Packs</h3><p style="color:var(--muted)">Prepared rules stay inactive until Owner review.</p></div><button class="primary" data-uqb="addKnowledge">Prepare Pack</button></div><div class="uqb-card-grid">'+(d.knowledgePacks.length?d.knowledgePacks.map(function(k){return '<article class="uqb-card"><h3>'+esc(k['Pack Name'])+'</h3><p>Version '+esc(k.Version)+'</p>'+badge(k.Active==='Yes'?'Active':'Inactive')+'</article>';}).join(''):'<div class="uqb-empty">No active Knowledge Pack.</div>')+'</div></section><section class="panel"><div class="uqb-toolbar"><div><h3>Controlled agents</h3><p style="color:var(--muted)">Every run records sources, inputs, output, warnings, model, usage, approval, and proof.</p></div><button class="primary" data-uqb="runAgent">Prepare Agent Run</button></div><div class="uqb-card-grid">'+state.catalog.agents.map(function(a){return '<article class="uqb-card"><h4>'+esc(a.name)+'</h4><p>'+esc(a.approval)+'</p></article>';}).join('')+'</div><h4>Recent runs</h4>'+simpleTable(['Agent','Confidence','Approval','Created'],d.agentRuns.map(function(r){return[r['Agent Name'],r.Confidence,badge(r['Approval Status']),r['Created Time']];}))+'</section></div>';
if(tab==='exports'){var types=['Customer Proposal','Individual Subquote','Combined Proposal Package','Subcontractor Bid Package','Drawing Package','Internal Estimate','Material Takeoff','Labor Estimate','Work Instructions','Work Order','Change Order','Revision Comparison'];return '<section class="panel"><h3>Professional PDF and export outputs</h3><p>Generated files are stored privately, linked to the structured project, and remain unsent until approved.</p><div class="uqb-card-grid">'+types.map(function(t){return '<article class="uqb-card"><h4>'+esc(t)+'</h4><p>Generated from the current project revision and linked records.</p><button class="secondary" data-uqb="export" data-id="'+esc(t)+'">Generate PDF</button></article>';}).join('')+'</div></section>';}
if(tab==='actuals')return tablePanel('Estimated-versus-actual review','Record Actual','addActual',['Type','Sub-quote','Est. hours','Actual hours','Est. cost','Actual cost','Cost variance','Review'],d.actuals.map(function(a){return[a['Actual Type'],subTitle(d,a['Subquote ID']),a['Estimated Hours'],a['Actual Hours'],money(a['Estimated Cost']),money(a['Actual Cost']),money(a['Cost Variance']),badge(a['Review Status'])];}));return '';}
function defs(rows){return rows.map(function(r){return '<div class="uqb-definition"><strong>'+esc(r[0])+'</strong><span>'+esc(r[1])+'</span></div>';}).join('');}
function simpleTable(headers,rows){if(!rows.length)return '<div class="uqb-empty">No records yet.</div>';return '<div class="table-wrap"><table class="uqb-table"><thead><tr>'+headers.map(function(h){return'<th>'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return'<tr>'+r.map(function(c){return'<td>'+String(c==null?'':c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';}
function tablePanel(title,button,actionName,headers,rows){return '<section class="panel"><div class="uqb-toolbar"><h3>'+esc(title)+'</h3><button class="primary" data-uqb="'+esc(actionName)+'">'+esc(button)+'</button></div>'+simpleTable(headers,rows)+'</section>';}
function subTitle(d,id){var s=d.subquotes.find(function(x){return x['Subquote ID']===id;});return s?s.Title:(id?'Unknown sub-quote':'Project-wide');}
function subOptions(includeBlank){var list=state.current?state.current.subquotes:[];var out=includeBlank?[{value:'',label:'Project-wide'}]:[];return out.concat(list.map(function(s){return{value:s['Subquote ID'],label:s.Sequence+' — '+s.Title};}));}
async function reload(){if(state.current)state.current=await rpc('boUniversalGetProject',[state.current.project['Project ID']]);renderProject();}
function renderError(error){document.getElementById('qbContent').innerHTML='<div class="panel notice bad"><strong>Universal Quote Builder stopped safely.</strong><br>'+esc(error&&error.message||String(error))+'<div class="actions" style="margin-top:12px"><button class="secondary" data-uqb="back">Return to Projects</button></div></div>';bind(document.getElementById('qbContent'));}
async function run(label,fn){busy(true,label);try{var result=await fn();toast(label+' complete.');return result;}catch(e){toast(e.message||String(e),true);throw e;}finally{busy(false);}}
