<style>
.qb-outdoor-dialog{width:min(1180px,100vw);height:min(94vh,920px);max-width:100vw;max-height:100vh;border:0;border-radius:18px;padding:0;box-shadow:0 24px 80px rgba(8,29,48,.34)}
.qb-outdoor-dialog::backdrop{background:rgba(8,24,38,.72)}
.qb-outdoor-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px 18px;background:linear-gradient(135deg,var(--navy),#0d2944);color:#fff}.qb-outdoor-head h2{margin:0 0 4px;font-size:24px}.qb-outdoor-head p{margin:0;color:#dbe8f3;line-height:1.4}.qb-outdoor-close{min-width:44px;background:#fff;color:var(--navy)}
.qb-outdoor-body{height:calc(100% - 82px);overflow:auto;padding:14px;background:#f3f6f9}.qb-outdoor-warning{padding:11px 13px;border:1px solid #e4ca73;border-radius:10px;background:#fff2c7;line-height:1.42;margin-bottom:12px}
.qb-outdoor-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:12px}.qb-outdoor-panel{background:#fff;border:1px solid var(--border);border-radius:14px;padding:13px;box-shadow:0 5px 18px rgba(15,39,65,.06)}.qb-outdoor-panel h3{margin:0 0 9px;color:var(--navy)}
.qb-outdoor-view{position:relative;overflow:hidden;border-radius:12px;background:#102130;min-height:330px;display:grid;place-items:center}.qb-outdoor-view video{width:100%;height:100%;max-height:520px;object-fit:cover}.qb-outdoor-view canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.qb-outdoor-crosshair{position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.35)}.qb-outdoor-crosshair:before,.qb-outdoor-crosshair:after{content:"";position:absolute;background:#fff}.qb-outdoor-crosshair:before{width:18px;height:2px;left:11px;top:19px}.qb-outdoor-crosshair:after{width:2px;height:18px;left:19px;top:11px}.qb-outdoor-camera-message{padding:24px;color:#fff;text-align:center;line-height:1.5;font-weight:800}
.qb-outdoor-controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:9px}.qb-outdoor-controls button{width:100%}.qb-outdoor-mark{background:var(--orange)!important;color:#fff!important;font-size:17px}.qb-outdoor-talk.listening{background:#8f1d1d;color:#fff}
.qb-outdoor-settings{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}.qb-outdoor-settings .full{grid-column:1/-1}.qb-outdoor-settings label{font-size:12px}.qb-outdoor-settings input[type="checkbox"]{width:auto;min-height:0;margin:0 5px 0 0}.qb-outdoor-inline-check{display:flex;align-items:center;min-height:44px;margin-top:5px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:#fff}
.qb-outdoor-status{padding:9px 10px;margin-top:9px;border-radius:9px;background:#eef5fb;color:#173a5e;font-size:12px;line-height:1.45;font-weight:800}.qb-outdoor-status.bad{background:#fee2e2;color:#7a1515}.qb-outdoor-status.good{background:#dff5e7;color:#15552e}
.qb-outdoor-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.qb-outdoor-metric{padding:10px;border:1px solid var(--border);border-radius:10px;background:#f8fafc}.qb-outdoor-metric span,.qb-outdoor-metric strong{display:block}.qb-outdoor-metric span{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:900}.qb-outdoor-metric strong{margin-top:4px;font-size:20px;color:var(--navy)}
.qb-outdoor-plan{width:100%;height:285px;margin-top:10px;border:1px solid var(--border);border-radius:10px;background:#fff}.qb-outdoor-points{display:grid;gap:6px;max-height:220px;overflow:auto;margin-top:10px}.qb-outdoor-point{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:9px;background:#f8fafc}.qb-outdoor-point b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff}.qb-outdoor-point span{font-size:11px;color:var(--muted)}
.qb-outdoor-footer{position:sticky;bottom:-14px;margin:12px -14px -14px;padding:11px 14px;background:rgba(255,255,255,.98);border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:center}.qb-outdoor-footer p{margin:0;font-size:11px;color:var(--muted);line-height:1.4}.qb-outdoor-footer-actions{display:flex;gap:8px}.qb-outdoor-footer-actions button{white-space:nowrap}
@media(max-width:900px),(hover:none) and (pointer:coarse){.qb-outdoor-dialog{width:100vw;height:100vh;max-height:100vh;border-radius:0}.qb-outdoor-head{padding:12px}.qb-outdoor-head h2{font-size:20px}.qb-outdoor-head p{font-size:11px}.qb-outdoor-body{height:calc(100% - 70px);padding:8px}.qb-outdoor-grid{grid-template-columns:1fr}.qb-outdoor-view{min-height:300px}.qb-outdoor-controls{grid-template-columns:1fr 1fr}.qb-outdoor-settings{grid-template-columns:1fr}.qb-outdoor-settings .full{grid-column:auto}.qb-outdoor-footer{bottom:-8px;margin:10px -8px -8px;padding:9px;display:block}.qb-outdoor-footer-actions{margin-top:8px;display:grid;grid-template-columns:1fr}.qb-outdoor-footer-actions button{width:100%}}
</style>
<script>
(function(){
'use strict';
const FEET_PER_METER=3.280839895;
const EARTH_RADIUS_M=6378137;
const MAX_POINTS=24;
const $=id=>document.getElementById(id);
const clean=value=>String(value==null?'':value).trim();
const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=(action,args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).boApi({action:action,args:args||{}}));
let points=[];
let currentFix=null;
let gpsWatchId=null;
let cameraStream=null;
let recognition=null;
let activeMode='';
let scanStarted=false;
let arSession=null;
let arHitTestSource=null;
let arReferenceSpace=null;
let arLatestPose=null;
let arCanvas=null;
let arGl=null;
let quoteWrappersInstalled=false;
let captureId='';
function toast(message,bad){const node=$('qbToast');if(!node)return;node.textContent=message;node.style.background=bad?'#8f1d1d':'#162331';node.classList.add('show');setTimeout(()=>node.classList.remove('show'),6500)}
function speak(message){const enabled=$('qbOutdoorSpeak');if(!enabled||!enabled.checked||!window.speechSynthesis)return;window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(message);utterance.rate=.95;window.speechSynthesis.speak(utterance)}
function setStatus(message,kind){const node=$('qbOutdoorStatus');if(!node)return;node.textContent=message;node.className='qb-outdoor-status'+(kind?' '+kind:'')}
function currentQuoteId(){return clean(window.H38_QB_ACTIVE_QUOTE_ID)||clean(document.querySelector('[data-quote-id]')&&document.querySelector('[data-quote-id]').getAttribute('data-quote-id'))}
function projectTitle(){for(const id of ['project','aiTitle','qbProjectTitle','projectTitle']){const node=$(id);if(node&&clean(node.value))return clean(node.value)}return 'Outdoor measurement'}
function noteValue(id){const node=$(id);return node&&typeof node.value==='string'?node.value:''}
function setNoteValue(id,value){const node=$(id);if(node&&typeof node.value==='string'){node.value=value;node.dispatchEvent(new Event('input',{bubbles:true}));return true}return false}
function makeCaptureId(){return 'OM-'+new Date().toISOString().replace(/[-:.TZ]/g,'').slice(0,14)+'-'+Math.random().toString(36).slice(2,6).toUpperCase()}
function ensureDialog(){let dialog=$('qbOutdoorMeasure');if(dialog)return dialog;dialog=document.createElement('dialog');dialog.id='qbOutdoorMeasure';dialog.className='qb-outdoor-dialog';dialog.innerHTML='<div class="qb-outdoor-head"><div><h2>H38 Outdoor Measure</h2><p>Guided field capture for estimate-grade perimeter, area, photos, and quote notes.</p></div><button type="button" id="qbOutdoorClose" class="qb-outdoor-close" aria-label="Close Outdoor Measure">✕</button></div><div class="qb-outdoor-body"><div class="qb-outdoor-warning"><strong>Estimate-grade only.</strong> Phone GPS and browser AR can drift. Verify critical dimensions, grades, boundaries, excavation quantities, and ordered materials with an appropriate physical or professional measurement method.</div><div class="qb-outdoor-grid"><section class="qb-outdoor-panel"><div class="qb-outdoor-settings"><label>Capture method<select id="qbOutdoorMode"><option value="auto">Automatic — try AR, then GPS</option><option value="ar">AR point capture</option><option value="gps">GPS walk-around</option></select></label><label>Point type<select id="qbOutdoorPointType"><option>Corner</option><option>Fence point</option><option>Driveway edge</option><option>Patio edge</option><option>Tree or obstacle</option><option>Grade point</option><option>Other</option></select></label><label class="full">Point note<input id="qbOutdoorPointNote" placeholder="Example: gate opening, drain, tree to remain"></label><label><span class="qb-outdoor-inline-check"><input id="qbOutdoorSpeak" type="checkbox" checked> Spoken guidance</span></label><label>GPS quality target<select id="qbOutdoorGpsTarget"><option value="20">20 ft or better</option><option value="10">10 ft or better</option><option value="6">6 ft or better</option></select></label></div><div id="qbOutdoorView" class="qb-outdoor-view"><div id="qbOutdoorCameraMessage" class="qb-outdoor-camera-message">Press Start Scan. The phone will try AR first when available, otherwise it will use live camera guidance with GPS point capture.</div><video id="qbOutdoorVideo" playsinline muted hidden></video><canvas id="qbOutdoorOverlay"></canvas><div class="qb-outdoor-crosshair" aria-hidden="true"></div></div><div class="qb-outdoor-controls"><button type="button" class="primary" id="qbOutdoorStart">Start Scan</button><button type="button" class="qb-outdoor-mark" id="qbOutdoorMark" disabled>Mark Point</button><button type="button" class="secondary qb-outdoor-talk" id="qbOutdoorTalk" disabled>Push to Talk</button><button type="button" class="secondary" id="qbOutdoorUndo" disabled>Undo</button></div><div id="qbOutdoorStatus" class="qb-outdoor-status">Nothing is recorded or uploaded until you start and explicitly attach the finished report.</div></section><section class="qb-outdoor-panel"><h3>Measurement review</h3><div class="qb-outdoor-metrics"><div class="qb-outdoor-metric"><span>Points</span><strong id="qbOutdoorPointCount">0</strong></div><div class="qb-outdoor-metric"><span>Perimeter</span><strong id="qbOutdoorPerimeter">0 ft</strong></div><div class="qb-outdoor-metric"><span>Area</span><strong id="qbOutdoorArea">0 sq ft</strong></div></div><canvas id="qbOutdoorPlan" class="qb-outdoor-plan" width="700" height="430"></canvas><div id="qbOutdoorPoints" class="qb-outdoor-points"><div class="qb-outdoor-point"><span>No points marked yet.</span></div></div></section></div><div class="qb-outdoor-footer"><p id="qbOutdoorFooterMessage">A saved draft must be open in Edit mode before the report can be attached. Nothing is sent to a customer.</p><div class="qb-outdoor-footer-actions"><button type="button" class="secondary" id="qbOutdoorReset">Reset Capture</button><button type="button" class="primary" id="qbOutdoorAttach" disabled>Attach Report & Save Quote</button></div></div></div>';document.body.appendChild(dialog);$('qbOutdoorClose').addEventListener('click',closeOutdoor);$('qbOutdoorStart').addEventListener('click',startScan);$('qbOutdoorMark').addEventListener('click',markPoint);$('qbOutdoorTalk').addEventListener('click',listenCommand);$('qbOutdoorUndo').addEventListener('click',undoPoint);$('qbOutdoorReset').addEventListener('click',resetCapture);$('qbOutdoorAttach').addEventListener('click',attachReport);dialog.addEventListener('cancel',event=>{event.preventDefault();closeOutdoor()});drawPlan();return dialog}
function installNav(){const nav=$('qbNav');if(!nav)return;let button=$('qbOutdoorNav');if(!button){button=document.createElement('button');button.id='qbOutdoorNav';button.type='button';button.textContent='Outdoor Measure';button.addEventListener('click',openOutdoor);const full=nav.querySelector('.full-system');nav.insertBefore(button,full||null)}}
function installQuoteWrappers(){if(quoteWrappersInstalled)return;quoteWrappersInstalled=true;['qbEditExisting','qbDetails'].forEach(name=>{const prior=window[name];if(typeof prior!=='function'||prior.__h38OutdoorWrapped)return;const wrapped=function(quoteId){if(quoteId)window.H38_QB_ACTIVE_QUOTE_ID=clean(quoteId);return prior.apply(this,arguments)};wrapped.__h38OutdoorWrapped=true;window[name]=wrapped});if(typeof window.qbOpen==='function'&&!window.qbOpen.__h38OutdoorWrapped){const prior=window.qbOpen;const wrapped=function(view){if(view==='new'||view==='dashboard')window.H38_QB_ACTIVE_QUOTE_ID='';return prior.apply(this,arguments)};wrapped.__h38OutdoorWrapped=true;window.qbOpen=wrapped}}
function openOutdoor(){const dialog=ensureDialog();installQuoteWrappers();$('qbOutdoorFooterMessage').textContent=currentQuoteId()?'Report will attach to saved quote '+currentQuoteId()+'. Nothing is sent.':'Save the quote, reopen it with Open and Edit Draft, then attach the finished report.';if(dialog.showModal)dialog.showModal();else dialog.setAttribute('open','');renderAll()}
function closeOutdoor(){stopScan();const dialog=$('qbOutdoorMeasure');if(dialog&&dialog.open&&dialog.close)dialog.close();else if(dialog)dialog.removeAttribute('open')}
async function startCamera(){if(cameraStream)return;const video=$('qbOutdoorVideo'),message=$('qbOutdoorCameraMessage');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('This browser does not provide live camera access.');cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=cameraStream;video.hidden=false;message.hidden=true;await video.play()}
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null}const video=$('qbOutdoorVideo');if(video){video.pause();video.srcObject=null;video.hidden=true}const message=$('qbOutdoorCameraMessage');if(message)message.hidden=false}
function startGps(){if(!navigator.geolocation)throw new Error('GPS is not available in this browser.');if(gpsWatchId!=null)return;gpsWatchId=navigator.geolocation.watchPosition(position=>{currentFix={lat:position.coords.latitude,lon:position.coords.longitude,accuracyM:Number(position.coords.accuracy)||0,altitudeM:Number(position.coords.altitude),time:position.timestamp};const accuracyFt=currentFix.accuracyM*FEET_PER_METER,target=Number($('qbOutdoorGpsTarget').value)||20;setStatus('GPS ready — estimated accuracy '+Math.round(accuracyFt)+' ft. '+(accuracyFt<=target?'Hold still and mark the point.':'Wait for better accuracy or move into open sky.'),accuracyFt<=target?'good':'');drawOverlay()},error=>setStatus('GPS stopped: '+(error.message||'location could not be read')+'. Check location permission and open sky.', 'bad'),{enableHighAccuracy:true,maximumAge:1000,timeout:20000})}
function stopGps(){if(gpsWatchId!=null&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;currentFix=null}
async function arSupported(){try{return !!(navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar'))}catch(error){return false}}
async function startAr(){if(!(await arSupported()))throw new Error('Browser AR point capture is not available here.');stopCamera();arCanvas=document.createElement('canvas');arCanvas.style.display='none';document.body.appendChild(arCanvas);arGl=arCanvas.getContext('webgl',{xrCompatible:true,alpha:true})||arCanvas.getContext('webgl2',{xrCompatible:true,alpha:true});if(!arGl)throw new Error('The browser could not start its AR graphics context.');arSession=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});arSession.addEventListener('end',()=>{arSession=null;arHitTestSource=null;arReferenceSpace=null;arLatestPose=null;if(arCanvas){arCanvas.remove();arCanvas=null}});arReferenceSpace=await arSession.requestReferenceSpace('local');const viewerSpace=await arSession.requestReferenceSpace('viewer');arHitTestSource=await arSession.requestHitTestSource({space:viewerSpace});arSession.updateRenderState({baseLayer:new XRWebGLLayer(arSession,arGl)});const onFrame=(time,frame)=>{if(!arSession)return;const results=frame.getHitTestResults(arHitTestSource);arLatestPose=results.length?results[0].getPose(arReferenceSpace):null;if(arLatestPose)setStatus('AR surface locked. Aim the center marker at the ground or corner and press Mark Point.','good');else setStatus('Move the phone slowly until AR finds a stable surface.');arSession.requestAnimationFrame(onFrame)};arSession.requestAnimationFrame(onFrame)}
function stopAr(){if(arSession){try{arSession.end()}catch(error){}}arSession=null;arLatestPose=null;arHitTestSource=null;arReferenceSpace=null}
async function startScan(){if(scanStarted)return stopScan();captureId=captureId||makeCaptureId();const requested=$('qbOutdoorMode').value;$('qbOutdoorStart').disabled=true;setStatus('Starting camera and tracking…');try{if(requested==='ar'||requested==='auto'){try{await startAr();activeMode='ar'}catch(error){if(requested==='ar')throw error;await startCamera();startGps();activeMode='gps';setStatus('AR was not available in this browser, so Outdoor Measure switched to GPS walk-around.','')}}else{await startCamera();startGps();activeMode='gps'}scanStarted=true;$('qbOutdoorStart').textContent='Stop Scan';$('qbOutdoorMark').disabled=false;$('qbOutdoorTalk').disabled=false;speak(activeMode==='ar'?'AR scan started. Aim at the first point and say mark point.':'GPS scan started. Stand at the first corner, hold still, and say mark point.')}catch(error){stopScan();setStatus(error&&error.message||String(error),'bad');toast(error&&error.message||String(error),true)}finally{$('qbOutdoorStart').disabled=false}}
function stopScan(){stopGps();stopCamera();stopAr();scanStarted=false;activeMode='';const start=$('qbOutdoorStart');if(start)start.textContent='Start Scan';const mark=$('qbOutdoorMark');if(mark)mark.disabled=true;const talk=$('qbOutdoorTalk');if(talk)talk.disabled=true}
function snapshot(){const video=$('qbOutdoorVideo');if(!video||video.hidden||!video.videoWidth)return '';const max=640,scale=Math.min(1,max/Math.max(video.videoWidth,video.videoHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(video.videoWidth*scale));canvas.height=Math.max(1,Math.round(video.videoHeight*scale));canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.62)}
function gpsXY(point,origin){const lat0=origin.lat*Math.PI/180,lat=point.lat*Math.PI/180,lon0=origin.lon*Math.PI/180,lon=point.lon*Math.PI/180;return {x:(lon-lon0)*Math.cos((lat+lat0)/2)*EARTH_RADIUS_M*FEET_PER_METER,y:(lat-lat0)*EARTH_RADIUS_M*FEET_PER_METER}}
function xyPoints(){if(!points.length)return [];if(points[0].mode==='gps')return points.map(point=>gpsXY(point,points[0]));return points.map(point=>({x:Number(point.xFt)||0,y:Number(point.yFt)||0}))}
function distance(a,b){return Math.hypot((b.x||0)-(a.x||0),(b.y||0)-(a.y||0))}
function metrics(){const xy=xyPoints();let perimeter=0;for(let i=1;i<xy.length;i++)perimeter+=distance(xy[i-1],xy[i]);if(xy.length>=3)perimeter+=distance(xy[xy.length-1],xy[0]);let twiceArea=0;if(xy.length>=3){for(let i=0;i<xy.length;i++){const next=xy[(i+1)%xy.length];twiceArea+=xy[i].x*next.y-next.x*xy[i].y}}const accuracies=points.filter(point=>Number.isFinite(point.accuracyFt)).map(point=>point.accuracyFt);const averageAccuracy=accuracies.length?accuracies.reduce((sum,value)=>sum+value,0)/accuracies.length:0;return {xy:xy,perimeter:perimeter,area:Math.abs(twiceArea)/2,averageAccuracy:averageAccuracy}}
function addPoint(point){if(points.length>=MAX_POINTS)return toast('Outdoor Measure supports up to '+MAX_POINTS+' points per capture.',true);point.index=points.length+1;point.type=$('qbOutdoorPointType').value;point.note=clean($('qbOutdoorPointNote').value);point.time=new Date().toISOString();points.push(point);$('qbOutdoorPointNote').value='';renderAll();$('qbOutdoorUndo').disabled=false;$('qbOutdoorAttach').disabled=points.length<2;speak('Point '+point.index+' saved. Move to the next point.')}
function markPoint(){if(!scanStarted)return toast('Start the scan first.',true);if(activeMode==='ar'){if(!arLatestPose)return toast('AR has not locked onto a surface yet. Move slowly and retry.',true);const p=arLatestPose.transform.position;addPoint({mode:'ar',xFt:p.x*FEET_PER_METER,yFt:-p.z*FEET_PER_METER,zFt:p.y*FEET_PER_METER,photo:''});return}if(!currentFix)return toast('Waiting for a GPS fix. Keep location enabled and move into open sky.',true);const accuracyFt=currentFix.accuracyM*FEET_PER_METER;addPoint({mode:'gps',lat:currentFix.lat,lon:currentFix.lon,altitudeM:currentFix.altitudeM,accuracyFt:accuracyFt,photo:snapshot()});const target=Number($('qbOutdoorGpsTarget').value)||20;if(accuracyFt>target)toast('Point saved, but GPS accuracy was about '+Math.round(accuracyFt)+' ft. Verify this point.',true)}
function undoPoint(){if(!points.length)return;points.pop();renderAll();$('qbOutdoorUndo').disabled=!points.length;$('qbOutdoorAttach').disabled=points.length<2;speak('Last point removed.')}
function resetCapture(){stopScan();points=[];captureId=makeCaptureId();renderAll();$('qbOutdoorUndo').disabled=true;$('qbOutdoorAttach').disabled=true;setStatus('Capture reset. Press Start Scan when you are at the first point.');speak('Capture reset.')}
function drawOverlay(){const canvas=$('qbOutdoorOverlay'),view=$('qbOutdoorView');if(!canvas||!view)return;const rect=view.getBoundingClientRect();canvas.width=Math.max(1,Math.round(rect.width));canvas.height=Math.max(1,Math.round(rect.height));const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.font='bold 13px Arial';ctx.fillStyle='rgba(0,0,0,.58)';ctx.fillRect(8,8,Math.min(canvas.width-16,430),48);ctx.fillStyle='#fff';ctx.fillText(activeMode==='ar'?'AR point capture':activeMode==='gps'?'GPS walk-around':'Not tracking',18,28);if(activeMode==='gps'&&currentFix)ctx.fillText('GPS accuracy: '+Math.round(currentFix.accuracyM*FEET_PER_METER)+' ft',18,48);else if(activeMode==='ar')ctx.fillText(arLatestPose?'Surface locked':'Finding surface…',18,48)}
function drawPlan(){const canvas=$('qbOutdoorPlan');if(!canvas)return;const ctx=canvas.getContext('2d'),width=canvas.width,height=canvas.height;ctx.clearRect(0,0,width,height);ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.strokeStyle='#d8e1e9';ctx.lineWidth=1;for(let x=40;x<width;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,height);ctx.stroke()}for(let y=30;y<height;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(width,y);ctx.stroke()}const data=metrics(),xy=data.xy;if(!xy.length){ctx.fillStyle='#647384';ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.fillText('Marked points will form the measurement sketch.',width/2,height/2);ctx.textAlign='left';return}let minX=Math.min(...xy.map(p=>p.x)),maxX=Math.max(...xy.map(p=>p.x)),minY=Math.min(...xy.map(p=>p.y)),maxY=Math.max(...xy.map(p=>p.y));if(maxX-minX<1){minX-=.5;maxX+=.5}if(maxY-minY<1){minY-=.5;maxY+=.5}const pad=58,scale=Math.min((width-pad*2)/(maxX-minX),(height-pad*2)/(maxY-minY));const project=p=>({x:pad+(p.x-minX)*scale,y:height-pad-(p.y-minY)*scale});ctx.strokeStyle='#173a5e';ctx.lineWidth=4;ctx.lineJoin='round';ctx.beginPath();xy.forEach((point,index)=>{const q=project(point);if(index===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});if(xy.length>=3)ctx.closePath();ctx.stroke();if(xy.length>=3){ctx.fillStyle='rgba(50,106,158,.13)';ctx.fill()}xy.forEach((point,index)=>{const q=project(point);ctx.fillStyle='#e85d18';ctx.beginPath();ctx.arc(q.x,q.y,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.fillText(String(index+1),q.x,q.y+4);ctx.textAlign='left';if(index>0){const prior=project(xy[index-1]);ctx.fillStyle='#173a5e';ctx.font='bold 12px Arial';ctx.fillText(distance(xy[index-1],point).toFixed(1)+' ft',(prior.x+q.x)/2+5,(prior.y+q.y)/2-5)}});if(xy.length>=3){const first=project(xy[0]),last=project(xy[xy.length-1]);ctx.fillStyle='#173a5e';ctx.font='bold 12px Arial';ctx.fillText(distance(xy[xy.length-1],xy[0]).toFixed(1)+' ft',(first.x+last.x)/2+5,(first.y+last.y)/2-5)}}
function pointHtml(point,index,xy){const segment=index?distance(xy[index-1],xy[index]).toFixed(1)+' ft from prior':'Starting point';const accuracy=point.mode==='gps'?' · GPS ±'+Math.round(point.accuracyFt||0)+' ft':' · AR estimate';return '<div class="qb-outdoor-point"><b>'+esc(index+1)+'</b><div><strong>'+esc(point.type||'Point')+'</strong><span>'+esc(segment+accuracy+(point.note?' · '+point.note:''))+'</span></div><button type="button" class="secondary" data-outdoor-remove="'+index+'">Remove</button></div>'}
function renderAll(){const data=metrics();if($('qbOutdoorPointCount'))$('qbOutdoorPointCount').textContent=String(points.length);if($('qbOutdoorPerimeter'))$('qbOutdoorPerimeter').textContent=data.perimeter.toFixed(1)+' ft';if($('qbOutdoorArea'))$('qbOutdoorArea').textContent=Math.round(data.area).toLocaleString()+' sq ft';const host=$('qbOutdoorPoints');if(host)host.innerHTML=points.length?points.map((point,index)=>pointHtml(point,index,data.xy)).join(''):'<div class="qb-outdoor-point"><span>No points marked yet.</span></div>';drawPlan();drawOverlay();if($('qbOutdoorAttach'))$('qbOutdoorAttach').disabled=points.length<2;const footer=$('qbOutdoorFooterMessage');if(footer)footer.textContent=currentQuoteId()?'Capture '+(captureId||'not started')+' will attach to '+currentQuoteId()+'. Nothing is sent.':'Save the quote and reopen it in Edit mode before attaching.'}
document.addEventListener('click',event=>{const button=event.target&&event.target.closest&&event.target.closest('[data-outdoor-remove]');if(!button)return;points.splice(Number(button.dataset.outdoorRemove),1);points.forEach((point,index)=>point.index=index+1);renderAll();$('qbOutdoorUndo').disabled=!points.length},true)
function listenCommand(){const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition)return toast('Voice commands are not supported in this browser. Use the large buttons.',true);if(recognition){try{recognition.abort()}catch(error){}recognition=null}recognition=new Recognition();recognition.lang='en-US';recognition.interimResults=false;recognition.continuous=false;const button=$('qbOutdoorTalk');button.classList.add('listening');button.textContent='Listening…';recognition.onresult=event=>{const command=clean(event.results&&event.results[0]&&event.results[0][0]&&event.results[0][0].transcript).toLowerCase();if(/mark|corner|point/.test(command))markPoint();else if(/undo|remove|back/.test(command))undoPoint();else if(/finish|done|complete/.test(command)){stopScan();speak('Scan stopped. Review the drawing, then attach the report.')}else if(/reset|start over/.test(command))resetCapture();else toast('Command not recognized. Say mark point, undo, finish, or reset.',true)};recognition.onerror=event=>toast('Voice command stopped: '+clean(event.error||'not recognized')+'. Use the buttons if needed.',true);recognition.onend=()=>{button.classList.remove('listening');button.textContent='Push to Talk';recognition=null};recognition.start()}
function reportSummary(){const data=metrics(),mode=points[0]&&points[0].mode==='ar'?'Browser AR point capture':'GPS walk-around';const pointLines=points.map((point,index)=>{const xy=data.xy[index],segment=index?distance(data.xy[index-1],xy):0;return (index+1)+'. '+(point.type||'Point')+(index?' — '+segment.toFixed(1)+' ft from prior':' — start')+(point.note?' — '+point.note:'')+(point.mode==='gps'?' — GPS ±'+Math.round(point.accuracyFt||0)+' ft':'')});return ['H38 OUTDOOR MEASURE — ESTIMATE-GRADE FIELD CAPTURE','Capture ID: '+captureId,'Method: '+mode,'Points: '+points.length,'Approximate perimeter: '+data.perimeter.toFixed(1)+' ft','Approximate enclosed area: '+Math.round(data.area)+' sq ft',data.averageAccuracy?'Average reported GPS accuracy: ±'+Math.round(data.averageAccuracy)+' ft':'','Critical dimensions, grades, boundaries, excavation quantities, and ordered materials require independent verification.','Point record:',...pointLines].filter(Boolean).join('\n')}
function reportCanvas(){const source=$('qbOutdoorPlan'),data=metrics(),canvas=document.createElement('canvas');canvas.width=1200;canvas.height=900;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#173a5e';ctx.fillRect(0,0,canvas.width,112);ctx.fillStyle='#fff';ctx.font='bold 34px Arial';ctx.fillText('H38 Outdoor Measure',42,54);ctx.font='18px Arial';ctx.fillText('Estimate-grade field capture — verify critical dimensions',42,86);ctx.fillStyle='#162331';ctx.font='bold 23px Arial';ctx.fillText(projectTitle(),42,158);ctx.font='16px Arial';ctx.fillText('Capture '+captureId+' · '+new Date().toLocaleString(),42,187);ctx.drawImage(source,42,220,720,500);ctx.fillStyle='#f3f6f9';ctx.fillRect(795,220,363,500);ctx.fillStyle='#173a5e';ctx.font='bold 21px Arial';ctx.fillText('Measurement summary',822,260);ctx.font='bold 30px Arial';ctx.fillText(data.perimeter.toFixed(1)+' ft',822,315);ctx.font='15px Arial';ctx.fillText('Approximate perimeter',822,340);ctx.font='bold 30px Arial';ctx.fillText(Math.round(data.area).toLocaleString()+' sq ft',822,395);ctx.font='15px Arial';ctx.fillText('Approximate enclosed area',822,420);ctx.font='bold 30px Arial';ctx.fillText(String(points.length),822,475);ctx.font='15px Arial';ctx.fillText('Marked points',822,500);ctx.font='bold 17px Arial';ctx.fillText(points[0]&&points[0].mode==='ar'?'Browser AR capture':'GPS walk-around',822,550);if(data.averageAccuracy){ctx.font='16px Arial';ctx.fillText('Average GPS accuracy: ±'+Math.round(data.averageAccuracy)+' ft',822,582)}ctx.fillStyle='#fff2c7';ctx.fillRect(812,620,330,78);ctx.fillStyle='#7a5610';ctx.font='bold 14px Arial';wrapText(ctx,'NOT A SURVEY OR FINAL CONSTRUCTION MEASUREMENT. Verify boundaries, grade, excavation, and ordered materials.',828,646,300,20);ctx.fillStyle='#162331';ctx.font='14px Arial';wrapText(ctx,'Point notes: '+points.map((point,index)=>(index+1)+' '+(point.type||'Point')+(point.note?' — '+point.note:'')).join(' | '),42,760,1110,20);ctx.fillStyle='#647384';ctx.font='13px Arial';wrapText(ctx,'This report was explicitly attached to the saved Highway 38 quote for owner review. It does not approve price, scope, customer release, scheduling, purchasing, payment, or work.',42,842,1110,18);return canvas}
function wrapText(ctx,text,x,y,maxWidth,lineHeight){const words=String(text||'').split(/\s+/);let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=word;y+=lineHeight}else line=test}if(line)ctx.fillText(line,x,y)}
function addSummaryToQuote(summary){const marker='[H38 OUTDOOR MEASURE '+captureId+']';const assumptionsId=$('assumptions')?'assumptions':$('qbAssumptions')?'qbAssumptions':'';if(assumptionsId){const existing=noteValue(assumptionsId);if(existing.indexOf(marker)<0)setNoteValue(assumptionsId,[existing,marker,summary].filter(Boolean).join('\n\n'))}const internalId=$('internalNotes')?'internalNotes':$('aiNotes')?'aiNotes':'';if(internalId){const existing=noteValue(internalId);if(existing.indexOf(marker)<0)setNoteValue(internalId,[existing,marker,'Outdoor measurement report attached privately to this quote. Owner verification required.'].filter(Boolean).join('\n\n'))}}
async function attachReport(){const quoteId=currentQuoteId();if(!quoteId)return toast('Save this quote and reopen it with Open and Edit Draft before attaching the measurement report.',true);if(points.length<2)return toast('Mark at least two points first.',true);const button=$('qbOutdoorAttach');button.disabled=true;button.textContent='Attaching report…';try{stopScan();const summary=reportSummary(),canvas=reportCanvas(),dataUrl=canvas.toDataURL('image/png');if(dataUrl.length>2800000)throw new Error('The generated report is too large. Reset and use fewer points.');const saved=await api('saveQuotePhoto',{payload:{quoteId:quoteId,fileName:'H38-Outdoor-Measure-'+captureId+'.png',mimeType:'image/png',base64Data:dataUrl}});addSummaryToQuote(summary);setStatus('Report attached privately to quote '+quoteId+'. Saving the measurement summary into the quote fields…','good');if(typeof window.qbSaveExistingQuote==='function'&&$('customer')&&$('project')){await window.qbSaveExistingQuote({preventDefault:function(){},submitter:null})}toast('Outdoor measurement report attached to the saved quote. Nothing was sent.');setStatus('Attached '+(saved&&saved['File Name']||saved&&saved.fileName||'measurement report')+'. Review all dimensions before pricing or ordering.','good');$('qbOutdoorFooterMessage').textContent='Attached to '+quoteId+'. Nothing was sent. Critical dimensions still require verification.'}catch(error){const message=error&&error.message||String(error);setStatus(message,'bad');toast(message,true)}finally{button.disabled=points.length<2;button.textContent='Attach Report & Save Quote'}}

init();
