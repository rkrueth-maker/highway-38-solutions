<style>

  #qbNav.nav::-webkit-scrollbar{display:none!important}

  #qbNav.nav button::after{display:none!important}.nav .full-system{width:auto!important;margin:0 0 0 3px!important;padding:0 0 0 6px!important;border:0!important;border-left:1px solid var(--border)!important;display:block!important}
  main{display:block!important;width:100%!important;max-width:100%!important;min-width:0!important;margin:0!important;padding:8px!important}

  .boundary{margin-bottom:8px!important;padding:8px 9px!important;font-size:11px!important;line-height:1.35!important}
  .shell{gap:9px!important}.panel{padding:10px!important;border-radius:11px!important;box-shadow:0 4px 15px rgba(15,39,65,.07)!important}.panel:hover{box-shadow:0 4px 15px rgba(15,39,65,.07)!important}
  .hero{display:block!important;padding:14px!important;border-radius:13px!important}.hero small{font-size:10px!important}.hero h2{font-size:1.55rem!important;line-height:1.05!important;margin:4px 0 7px!important}.hero p{font-size:12px!important;line-height:1.4!important;margin:0!important}.hero .actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:6px!important;margin-top:11px!important}.hero .actions button{width:100%!important;min-width:0!important;padding:8px!important;font-size:12px!important}
  .metrics{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px!important}.metric{min-width:0!important;padding:8px!important}.metric span{font-size:10px!important;line-height:1.15!important}.metric strong{font-size:19px!important;margin-top:4px!important;overflow-wrap:anywhere!important}
  .grid{display:block!important}.stack{display:grid!important;gap:8px!important;margin-top:8px!important}.pipeline{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:5px!important}.stage{padding:7px!important}.stage span{font-size:10px!important}.stage strong{font-size:18px!important}
  .form-grid{grid-template-columns:1fr!important;gap:8px!important}.full{grid-column:auto!important}label{font-size:12px!important}input,select,textarea{min-height:42px!important;margin-top:4px!important;padding:8px!important}textarea{min-height:76px!important}
  .toolbar,.actions{gap:6px!important}.toolbar button{min-height:40px!important;padding:8px 10px!important;font-size:12px!important}
  .table-wrap{overflow:visible!important;border:0!important;background:transparent!important}.table-wrap table{display:block!important;width:100%!important;min-width:0!important}.table-wrap thead{display:none!important}.table-wrap tbody{display:grid!important;gap:7px!important}.table-wrap tr{display:block!important;width:100%!important;padding:9px!important;border:1px solid var(--border)!important;border-radius:9px!important;background:#fff!important}.table-wrap td{display:block!important;width:100%!important;padding:2px 0!important;border:0!important;white-space:normal!important;overflow-wrap:anywhere!important;font-size:12px!important}
  .line{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important;padding:8px!important}.line .description{grid-column:1/-1!important}.line button.danger{grid-column:1/-1!important;width:100%!important}.totals{width:100%!important;margin:8px 0 0!important}.total-row{padding:5px 0!important}
  .catalog{grid-template-columns:1fr!important}.catalog-card{padding:10px!important}.price{font-size:18px!important}
  .qb-mobile-hidden{display:none!important}
  .qb-mobile-advanced-field{display:none!important}.qb-mobile-show-advanced .qb-mobile-advanced-field{display:block!important}
  #qbQuotePhotoPanel .qb-camera-actions{display:none!important}
  .qb-simple-photo-quote{grid-column:1/-1;margin-top:9px;padding:12px;border:2px solid #8fb4cf;border-radius:12px;background:linear-gradient(135deg,#f5fbff,#e9f4fb)}
  .qb-simple-photo-quote h3{margin:0;color:var(--navy);font-size:18px}.qb-simple-photo-quote p{margin:5px 0 10px;color:var(--muted);font-size:12px;line-height:1.4}
  .qb-simple-photo-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.qb-simple-photo-actions button{width:100%!important;min-width:0!important;padding:9px 6px!important;font-size:12px!important}
  .qb-simple-photo-actions .qb-simple-build{grid-column:1/-1;background:linear-gradient(135deg,var(--navy),#0f2d49);color:#fff;min-height:48px!important;font-size:14px!important}
  .qb-simple-photo-status{min-height:18px;margin-top:8px;font-size:11px;font-weight:800;color:var(--navy)}
  .qb-simple-more{display:block;width:100%;margin-top:7px;background:transparent;color:var(--navy);border:1px solid #b8cad7;font-size:11px!important}
  .qb-photo-queue,.qb-saved-photos{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:7px!important}.qb-photo-card img{height:92px!important}.qb-photo-card .qb-photo-meta{padding:6px!important;font-size:10px!important}
  .qb-ai-result{font-size:12px!important;max-height:none!important;white-space:normal!important}
  .qb-quick-quote-trigger,.qb-mobile-capture{display:none!important}
  .toast{left:10px!important;right:10px!important;bottom:10px!important;max-width:none!important;max-height:34vh!important;overflow:auto!important;padding:10px!important;font-size:12px!important;line-height:1.35!important;overflow-wrap:anywhere!important}
}
</style>
<script>
(function(){
'use strict';
const GENERIC_CUSTOMER='CUST-H38-GENERIC-QUOTE';
const PHONE_QUERY='(max-width:900px), (hover:none) and (pointer:coarse)';
let running=false,observer=null;
const $=id=>document.getElementById(id);
const clean=value=>String(value==null?'':value).trim();
const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const direct=(name,payload)=>new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name](payload)});
function isPhone(){return window.matchMedia&&window.matchMedia(PHONE_QUERY).matches}
function toast(message,bad){const node=$('qbToast');if(!node)return;node.textContent=message;node.style.background=bad?'#8f1d1d':'#162331';node.classList.add('show');setTimeout(()=>node.classList.remove('show'),6000)}
function friendlyError(error){
  const raw=clean(error&&error.message||error);
  if(/memory|page.*crash|aw,? snap/i.test(raw))return 'The phone ran out of memory preparing the pictures. Reopen Quote Builder and retry with the server-upload version.';
  if(/image_url|invalid.*image|invalid.*url/i.test(raw))return 'One picture could not be prepared for analysis. Remove it, choose it again, and retry.';
  if(/payload|too large|request entity|too large to analyze/i.test(raw))return 'The pictures are too large to analyze together. Try fewer pictures.';
  return raw.replace(/^Error:\s*/i,'').replace(/\s*\{[\s\S]*$/,'').slice(0,220)||'The quote draft stopped safely. Please retry.';
}
function setStatus(message,bad){const node=$('qbSimplePhotoStatus')||$('qbFieldStatus');if(node){node.textContent=message;node.style.color=bad?'#8f1d1d':'var(--navy)'}}
function customerId(){return clean($('customer')&&$('customer').value)||clean($('aiCustomer')&&$('aiCustomer').value)||clean($('qbCustomerId')&&$('qbCustomerId').value)||GENERIC_CUSTOMER}
function projectTitle(){return clean($('project')&&$('project').value)||clean($('aiTitle')&&$('aiTitle').value)||'Photo-based field quote'}
function labeled(id,label){const node=$(id),value=clean(node&&node.value);return value?label+': '+value:''}
function combinedNotes(){return [labeled('qbFieldNarration','Field description'),labeled('scope','Scope'),labeled('assumptions','Known dimensions and assumptions'),labeled('internalNotes','Internal notes'),labeled('customerNotes','Customer notes'),labeled('aiNotes','Field notes')].filter(Boolean).join('\n')}
function photoElements(){
  const unique=[];
  document.querySelectorAll('#qbPendingPhotos img,.qb-photo-queue img,.qb-saved-photos img,.qb-saved-photo img').forEach(img=>{if(unique.indexOf(img)<0)unique.push(img)});
  return unique.slice(0,4);
}
function imageReady(img){
  if(img.complete&&img.naturalWidth>0)return Promise.resolve();
  if(typeof img.decode==='function')return img.decode();
  return new Promise((resolve,reject)=>{const done=()=>{cleanup();img.naturalWidth>0?resolve():reject(new Error('Picture did not load.'))};const fail=()=>{cleanup();reject(new Error('Picture did not load.'))};const cleanup=()=>{img.removeEventListener('load',done);img.removeEventListener('error',fail)};img.addEventListener('load',done);img.addEventListener('error',fail);setTimeout(fail,5000)});
}
function photoName(img,index){const card=img.closest&&img.closest('.qb-photo-card,.qb-saved-photo');const strong=card&&card.querySelector('.qb-photo-meta strong,strong');return clean(strong&&strong.textContent)||('quote-photo-'+(index+1)+'.jpg')}
async function imageToUploadData(img){
  await imageReady(img);
  const max=1280,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const width=Math.max(1,Math.round(img.naturalWidth*scale)),height=Math.max(1,Math.round(img.naturalHeight*scale));
  const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
  canvas.getContext('2d').drawImage(img,0,0,width,height);
  return canvas.toDataURL('image/jpeg',.68);
}
async function stagePhotoDocuments(){
  const elements=photoElements(),documentIds=[];
  for(let index=0;index<elements.length;index++){
    setStatus('Uploading photo '+(index+1)+' of '+elements.length+'…',false);
    try{
      let base64Data=await imageToUploadData(elements[index]);
      const staged=await direct('boQuoteBuilderStageAiPhoto',{customerId:customerId(),fileName:photoName(elements[index],index),mimeType:'image/jpeg',base64Data:base64Data});
      base64Data='';
      if(staged&&staged.documentId)documentIds.push(staged.documentId);
      await new Promise(resolve=>setTimeout(resolve,40));
    }catch(error){console.warn('H38_QB_PHOTO_STAGE_SKIPPED',error&&error.message||String(error))}
  }
  if(elements.length&&!documentIds.length)throw new Error('The selected photos could not be uploaded for analysis. Remove them, choose them again, and retry.');
  return documentIds;
}
function parseDraft(result){if(result&&result.draft)return result.draft;try{return JSON.parse(result&&result.staged&&result.staged.Details||'{}')}catch(error){return {}}}
function rateMissing(line){return line.rate===''||line.rate==null||!Number.isFinite(Number(line.rate))||Number(line.rate)<=0}
function priceQuery(line,draft,basis){const primary=clean(line.searchQuery||line.description||line.catalogId||draft.projectTitle||basis);const context=clean(draft.scope||basis);return clean([primary,context].filter(Boolean).join('. Work scope: ')).slice(0,500)}
function ensureSuggestedLines(draft,basis){
  if(Array.isArray(draft.suggestedLines)&&draft.suggestedLines.length)return;
  const description=clean(draft.scope||basis).replace(/^(Scope|Field description):\s*/i,'').slice(0,220);
  draft.suggestedLines=description?[{description:description,quantity:1,unit:'job',rate:'',priceStatus:'manual_entry_required',searchQuery:description,evidence:'Derived from the entered scope and notes; owner review required.'}]:[];
}
async function priceMissingLines(draft,basis){
  ensureSuggestedLines(draft,basis);
  const lines=Array.isArray(draft.suggestedLines)?draft.suggestedLines:[];let researched=0;const seen={};
  for(const line of lines){
    if(!rateMissing(line)||researched>=4)continue;
    const query=priceQuery(line,draft,basis),key=query.toLowerCase();if(!query||seen[key])continue;seen[key]=true;
    try{
      const result=await direct('boQuoteBuilderAutoLocalPrice',{query:query,taxable:false}),item=result&&result.item;
      if(item){line.catalogId=item['Product / Service ID']||result.catalogId||line.catalogId||'';line.description=line.description||item['Customer Description']||item.Name||query;line.unit=item.Unit||line.unit||'each';line.rate=Number(item['Standard Selling Price']||item.Price||0);line.priceStatus='automatic_local_typical_owner_review';line.evidence=clean([line.evidence,'Typical local rate researched automatically from the scope and notes; owner review required.'].filter(Boolean).join(' '));researched++}
    }catch(error){line.priceStatus='local_price_lookup_failed';line.pricingNote=friendlyError(error)}
  }
  return researched;
}
function setValueIfBlank(id,value){const node=$(id);if(node&&clean(value)&&!clean(node.value)){node.value=Array.isArray(value)?value.join('\n'):value;node.dispatchEvent(new Event('input',{bubbles:true}))}}
function existingDescriptions(){return Array.from(document.querySelectorAll('#lines .description input')).map(input=>clean(input.value).toLowerCase()).filter(Boolean)}
function applyLines(draft){
  const lines=Array.isArray(draft.suggestedLines)?draft.suggestedLines:[];if(!lines.length||typeof window.qbAddLine!=='function')return 0;
  const existing=existingDescriptions(),first=document.querySelector('#lines .description input'),removeBlank=!!(first&&!clean(first.value));let added=0;
  lines.forEach(line=>{const description=clean(line.description||line.catalogId);if(!description||existing.indexOf(description.toLowerCase())>=0)return;window.qbAddLine({catalogId:line.catalogId||'',description:description,quantity:Number(line.quantity)||1,unit:line.unit||'each',rate:Number(line.rate)||0,discount:0,taxable:false,taxRate:0,notes:clean([line.evidence,line.priceStatus==='automatic_local_typical_owner_review'?'Automatically researched typical local rate; owner review required.':''].filter(Boolean).join(' '))});existing.push(description.toLowerCase());added++});
  if(removeBlank&&added&&typeof window.qbRemoveLine==='function')window.qbRemoveLine(0);return added;
}
function renderResult(draft,added,researched){
  let host=$('qbAiResult');if(!host){host=document.createElement('div');host.id='qbAiResult';host.className='qb-ai-result';const panel=$('qbSimplePhotoQuote');if(panel)panel.appendChild(host)}
  if(!host)return;host.hidden=false;
  const observations=Array.isArray(draft.photoObservations)?draft.photoObservations:[],missing=Array.isArray(draft.missingInformation)?draft.missingInformation:[],lines=Array.isArray(draft.suggestedLines)?draft.suggestedLines:[];
  host.innerHTML='<strong>'+esc(draft.projectTitle||'Photo quote draft')+'</strong>'+(draft.scope?'<p>'+esc(draft.scope)+'</p>':'')+(observations.length?'<p><strong>Photos show:</strong> '+esc(observations.join(' • '))+'</p>':'')+(lines.length?'<p><strong>Added:</strong> '+lines.map(line=>esc(line.description||line.catalogId||'Review item')).join(' • ')+'</p>':'')+(missing.length?'<p><strong>Confirm:</strong> '+esc(missing.join(' • '))+'</p>':'')+'<p>'+added+' quote item'+(added===1?'':'s')+' added; '+researched+' missing price'+(researched===1?'':'s')+' researched.</p>';
}
async function buildUnified(button){
  if(running)return;running=true;const original=button.textContent;button.disabled=true;button.textContent='Uploading photos…';
  try{
    const notes=combinedNotes(),photoDocumentIds=await stagePhotoDocuments();if(!notes&&!photoDocumentIds.length)throw new Error('Add a photo or enter the scope first.');
    setStatus('Analyzing the saved photos and matching the Price Book…',false);button.textContent='Analyzing…';
    const result=await direct('boBuildAiQuoteDraft',{customerId:customerId(),projectTitle:projectTitle(),notes:notes||'Analyze the supplied jobsite photos and identify the visible work required. Do not invent measurements.',photoDocumentIds:photoDocumentIds});
    const draft=parseDraft(result)||{};button.textContent='Finding prices…';const researched=await priceMissingLines(draft,notes);setValueIfBlank('project',draft.projectTitle);setValueIfBlank('scope',draft.scope);setValueIfBlank('assumptions',draft.assumptions);setValueIfBlank('exclusions',draft.exclusions);const added=applyLines(draft);renderResult(draft,added,researched);setStatus('Quote draft prepared. Review measurements, quantities, and prices, then save it.',false);toast('Quote draft prepared. Nothing was approved or sent.');
  }catch(error){const message=friendlyError(error);setStatus(message,true);toast(message,true)}finally{running=false;button.disabled=false;button.textContent=original}
}
function labelName(label){const clone=label.cloneNode(true);clone.querySelectorAll('input,select,textarea,button,small,span').forEach(node=>node.remove());return clean(clone.textContent)}
function markAdvancedFields(){document.querySelectorAll('#qbContent label').forEach(label=>{if(/^(Payment terms|Deposit|Exclusions|Customer notes|Internal notes)$/i.test(labelName(label)))label.classList.add('qb-mobile-advanced-field')})}
function simplifyPhone(){
  if(!isPhone()||!$('project'))return;
  const field=$('qbFieldAssistant');if(field)field.classList.add('qb-mobile-hidden');
  document.querySelectorAll('.qb-ai-panel').forEach(panel=>panel.classList.add('qb-mobile-hidden'));
  markAdvancedFields();
  const photoPanel=$('qbQuotePhotoPanel');if(!photoPanel||$('qbSimplePhotoQuote'))return;
  const panel=document.createElement('section');panel.id='qbSimplePhotoQuote';panel.className='qb-simple-photo-quote';
  panel.innerHTML='<h3>Build quote from photos</h3><p>Enter the scope and any known measurement above. Add photos, then press Build Quote. H38 uploads each photo safely, identifies the work, matches the Price Book, and finds missing local prices.</p><div class="qb-simple-photo-actions"><button type="button" id="qbSimpleTake" class="camera-action">📷 Take Picture</button><button type="button" id="qbSimpleChoose" class="secondary">Choose Photos</button><button type="button" id="qbSimpleBuild" class="qb-simple-build">Build Quote</button></div><button type="button" id="qbSimpleMore" class="qb-simple-more">Show more quote fields</button><div id="qbSimplePhotoStatus" class="qb-simple-photo-status">Ready for photos.</div>';
  photoPanel.insertAdjacentElement('beforebegin',panel);
  $('qbSimpleTake').addEventListener('click',event=>{event.preventDefault();typeof window.qbCameraTakeForDraft==='function'&&window.qbCameraTakeForDraft()});
  $('qbSimpleChoose').addEventListener('click',event=>{event.preventDefault();typeof window.qbCameraChooseForDraft==='function'&&window.qbCameraChooseForDraft()});
  $('qbSimpleBuild').addEventListener('click',event=>{event.preventDefault();event.stopPropagation();buildUnified(event.currentTarget)});
  $('qbSimpleMore').addEventListener('click',event=>{event.preventDefault();const showing=document.body.classList.toggle('qb-mobile-show-advanced');event.currentTarget.textContent=showing?'Hide extra quote fields':'Show more quote fields'});
}
function polish(){simplifyPhone()}
document.addEventListener('click',event=>{
  const button=event.target&&event.target.closest&&event.target.closest('#qbBuildAiDraft,#qbBuildFieldDraft');if(!button)return;
  event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();buildUnified(button);
},true);
const host=$('qbContent')||document.body;observer=new MutationObserver(()=>requestAnimationFrame(polish));observer.observe(host,{childList:true,subtree:true});
document.addEventListener('DOMContentLoaded',polish);polish();setTimeout(polish,400);setTimeout(polish,1400);
})();
</script>
