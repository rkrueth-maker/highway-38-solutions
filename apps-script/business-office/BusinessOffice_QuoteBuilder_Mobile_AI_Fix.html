<script>
(function(){
'use strict';
const GENERIC_CUSTOMER='CUST-H38-GENERIC-QUOTE';
let running=false;
const $=id=>document.getElementById(id);
const clean=value=>String(value==null?'':value).trim();
const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const direct=(name,payload)=>new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[name](payload)});
function toast(message,bad){const node=$('qbToast');if(!node)return;node.textContent=message;node.style.background=bad?'#8f1d1d':'#162331';node.classList.add('show');setTimeout(()=>node.classList.remove('show'),6000)}
function busy(on){const node=$('qbOverlay');if(node)node.classList.toggle('show',!!on)}
function friendlyError(error){
  const raw=clean(error&&error.message||error);
  if(/image_url|invalid.*image|invalid.*url/i.test(raw))return 'The picture could not be prepared for analysis. Remove it, add it again, and retry.';
  if(/payload|too large|request entity/i.test(raw))return 'The pictures are too large to analyze together. Try fewer pictures or retake them at normal phone quality.';
  return raw.replace(/^Error:\s*/i,'').replace(/\s*\{[\s\S]*$/,'').slice(0,260)||'The AI draft stopped safely. Please retry.';
}
function fieldStatus(message,bad){const node=$('qbFieldStatus');if(node){node.textContent=message;node.style.color=bad?'#8f1d1d':'var(--navy)'}}
function customerId(){return clean($('customer')&&$('customer').value)||clean($('aiCustomer')&&$('aiCustomer').value)||clean($('qbCustomerId')&&$('qbCustomerId').value)||GENERIC_CUSTOMER}
function projectTitle(){return clean($('project')&&$('project').value)||clean($('aiTitle')&&$('aiTitle').value)||clean($('qbProjectTitle')&&$('qbProjectTitle').value)||'Photo-based field quote'}
function labeled(id,label){const node=$(id),value=clean(node&&node.value);return value?label+': '+value:''}
function combinedNotes(){
  return [
    labeled('qbFieldNarration','Field description'),
    labeled('scope','Scope'),
    labeled('assumptions','Known dimensions and assumptions'),
    labeled('internalNotes','Internal notes'),
    labeled('customerNotes','Customer notes'),
    labeled('aiNotes','Field notes')
  ].filter(Boolean).join('\n');
}
function photoSources(){
  const found=[];
  document.querySelectorAll('#qbPendingPhotos img,.qb-photo-queue img,.qb-saved-photos img,.qb-saved-photo img').forEach(img=>{const src=img.currentSrc||img.src||'';if(src&&found.indexOf(src)<0)found.push(src)});
  return found.slice(0,6);
}
function blobToDataUrl(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)})}
function canvasBlob(canvas,type,quality){return new Promise(resolve=>canvas.toBlob(resolve,type,quality))}
async function compressBlob(blob){
  if(!blob||!/^image\//i.test(blob.type||''))return blobToDataUrl(blob);
  let bitmap=null;
  try{if(typeof createImageBitmap==='function')bitmap=await createImageBitmap(blob)}catch(error){bitmap=null}
  if(!bitmap)return blobToDataUrl(blob);
  const max=1600,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));
  const width=Math.max(1,Math.round(bitmap.width*scale)),height=Math.max(1,Math.round(bitmap.height*scale));
  const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;canvas.getContext('2d').drawImage(bitmap,0,0,width,height);if(bitmap.close)bitmap.close();
  const output=await canvasBlob(canvas,'image/jpeg',.82);return blobToDataUrl(output||blob);
}
async function validImageInput(src){
  if(/^https?:\/\//i.test(src))return src;
  if(!/^(blob:|data:image\/)/i.test(src))return '';
  const response=await fetch(src);if(!response.ok)throw new Error('The selected picture could not be read.');
  return compressBlob(await response.blob());
}
async function preparedPhotos(){
  const sources=photoSources(),photos=[];
  for(const src of sources){const value=await validImageInput(src);if(value)photos.push(value)}
  return photos;
}
function parseDraft(result){
  if(result&&result.draft)return result.draft;
  const staged=result&&result.staged;try{return JSON.parse(staged&&staged.Details||'{}')}catch(error){return {}}
}
function rateMissing(line){return line.rate===''||line.rate==null||!Number.isFinite(Number(line.rate))||Number(line.rate)<=0}
function priceQuery(line,draft,basis){
  const primary=clean(line.searchQuery||line.description||line.catalogId||draft.projectTitle);
  const context=clean(draft.scope||basis);
  return clean([primary,context].filter(Boolean).join('. Work scope: ')).slice(0,500);
}
async function priceMissingLines(draft,basis){
  const lines=Array.isArray(draft.suggestedLines)?draft.suggestedLines:[];
  let researched=0;const seen={};
  for(const line of lines){
    if(!rateMissing(line)||researched>=4)continue;
    const query=priceQuery(line,draft,basis);const key=query.toLowerCase();if(!query||seen[key])continue;seen[key]=true;
    try{
      const result=await direct('boQuoteBuilderAutoLocalPrice',{query:query,taxable:false});const item=result&&result.item;
      if(item){line.catalogId=item['Product / Service ID']||result.catalogId||line.catalogId||'';line.description=line.description||item['Customer Description']||item.Name||query;line.unit=item.Unit||line.unit||'each';line.rate=Number(item['Standard Selling Price']||item.Price||0);line.priceStatus='automatic_local_typical_owner_review';line.evidence=clean([line.evidence,'Typical local rate researched automatically from the scope/notes; owner review required.'].filter(Boolean).join(' '));researched++}
    }catch(error){line.priceStatus='local_price_lookup_failed';line.pricingNote=friendlyError(error)}
  }
  return researched;
}
function setValueIfBlank(id,value){const node=$(id);if(node&&clean(value)&&!clean(node.value)){node.value=Array.isArray(value)?value.join('\n'):value;node.dispatchEvent(new Event('input',{bubbles:true}))}}
function existingDescriptions(){return Array.from(document.querySelectorAll('#lines .description input')).map(input=>clean(input.value).toLowerCase()).filter(Boolean)}
function applyLines(draft){
  const lines=Array.isArray(draft.suggestedLines)?draft.suggestedLines:[];if(!lines.length||typeof window.qbAddLine!=='function')return 0;
  const existing=existingDescriptions();const first=document.querySelector('#lines .description input');const removeBlank=!!(first&&!clean(first.value));let added=0;
  lines.forEach(line=>{const description=clean(line.description||line.catalogId);if(!description||existing.indexOf(description.toLowerCase())>=0)return;window.qbAddLine({catalogId:line.catalogId||'',description:description,quantity:Number(line.quantity)||1,unit:line.unit||'each',rate:Number(line.rate)||0,discount:0,taxable:false,taxRate:0,notes:clean([line.evidence,line.priceStatus==='automatic_local_typical_owner_review'?'Automatically researched typical local rate; owner review required.':''].filter(Boolean).join(' '))});existing.push(description.toLowerCase());added++});
  if(removeBlank&&added&&typeof window.qbRemoveLine==='function')window.qbRemoveLine(0);return added;
}
function renderResult(draft,added,researched){
  let host=$('qbAiResult');if(!host){host=document.createElement('div');host.id='qbAiResult';host.className='qb-ai-result';const panel=document.querySelector('.qb-ai-panel')||$('qbFieldAssistant');if(panel)panel.appendChild(host)}
  if(!host)return;host.hidden=false;
  const observations=Array.isArray(draft.photoObservations)?draft.photoObservations:[];const missing=Array.isArray(draft.missingInformation)?draft.missingInformation:[];const lines=Array.isArray(draft.suggestedLines)?draft.suggestedLines:[];
  host.innerHTML='<strong>'+esc(draft.projectTitle||'Photo-based quote draft')+'</strong>'+(draft.scope?'<p>'+esc(draft.scope)+'</p>':'')+(observations.length?'<p><strong>Photos show:</strong></p><ul>'+observations.map(item=>'<li>'+esc(item)+'</li>').join('')+'</ul>':'')+(lines.length?'<p><strong>Quote items:</strong></p><ul>'+lines.map(line=>'<li>'+esc(line.description||line.catalogId||'Review item')+' — '+esc(line.quantity||1)+' '+esc(line.unit||'each')+(rateMissing(line)?' — price needs review':' @ $'+Number(line.rate).toFixed(2))+'</li>').join('')+'</ul>':'')+(missing.length?'<p><strong>Confirm:</strong></p><ul>'+missing.map(item=>'<li>'+esc(item)+'</li>').join('')+'</ul>':'')+'<p><strong>'+added+'</strong> item'+(added===1?'':'s')+' added to this quote. '+researched+' missing price'+(researched===1?' was':'s were')+' researched automatically.</p>';
}
async function buildUnified(button){
  if(running)return;running=true;busy(true);const original=button.textContent;button.disabled=true;button.textContent='Analyzing photos…';
  try{
    const notes=combinedNotes(),photos=await preparedPhotos();if(!notes&&!photos.length)throw new Error('Add a picture or enter the scope/field description first.');
    fieldStatus('Analyzing the actual pictures, reading the scope and notes, and matching the Price Book…',false);button.textContent='Matching prices…';
    const result=await direct('boBuildAiQuoteDraft',{customerId:customerId(),projectTitle:projectTitle(),notes:notes||'Analyze the supplied jobsite photos and identify the visible work required. Do not invent measurements.',photos:photos});
    const draft=parseDraft(result)||{};button.textContent='Finding local prices…';const researched=await priceMissingLines(draft,notes);setValueIfBlank('project',draft.projectTitle);setValueIfBlank('scope',draft.scope);setValueIfBlank('assumptions',draft.assumptions);setValueIfBlank('exclusions',draft.exclusions);const added=applyLines(draft);renderResult(draft,added,researched);fieldStatus('Draft prepared from the pictures and scope. Review measurements, quantities, and prices, then save the internal quote.',false);toast('Photo-based quote draft prepared. Nothing was approved or sent.');
  }catch(error){const message=friendlyError(error);fieldStatus('Draft generation stopped: '+message,true);toast(message,true)}finally{running=false;busy(false);button.disabled=false;button.textContent=original}
}
document.addEventListener('click',event=>{
  const button=event.target&&event.target.closest&&event.target.closest('#qbBuildAiDraft,#qbBuildFieldDraft');if(!button)return;
  event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();buildUnified(button);
},true);
})();
</script>
