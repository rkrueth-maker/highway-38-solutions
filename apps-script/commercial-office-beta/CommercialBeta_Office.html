<!doctype html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b2438">
  <meta name="referrer" content="no-referrer">
  <title>Opening <?= businessName ?> — Highway 38 Business Office</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef3f7;color:#152536;font:16px system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:22px}.card{width:min(620px,100%);padding:30px;border:1px solid #d6e0e8;border-radius:20px;background:#fff;box-shadow:0 18px 55px rgba(20,53,78,.14);text-align:center}.mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 18px;border-radius:17px;background:#0b2438;color:#fff;font-weight:950}.primary{display:inline-flex;align-items:center;justify-content:center;min-height:54px;margin-top:18px;padding:13px 22px;border:0;border-radius:12px;background:#174a70;color:#fff;text-decoration:none;font-size:17px;font-weight:900;cursor:pointer}.primary[aria-disabled="true"]{opacity:.55;pointer-events:none}.muted{color:#607285}.error{color:#9a2c2c;white-space:pre-wrap}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">H38</div>
    <h1>Opening <?= businessName ?></h1>
    <p id="status">Checking your authorized business…</p>
    <a id="continueButton" class="primary" href="<?= pwaUrl ?>" target="_top" aria-disabled="true">Preparing Business Office…</a>
    <p class="muted">Press the button once when it is ready. The Office opens in this same tab; No second window is used.</p>
  </main>
  <script>
    (function(){
      var PWA_BASE=<?!= JSON.stringify(pwaUrl) ?>;
      var BUSINESS_ID=<?!= JSON.stringify(businessId) ?>;
      var BUILD='20260803-1530';
      var status=document.getElementById('status');
      var button=document.getElementById('continueButton');
      function errorText(error){return error&&error.message?error.message:String(error||'Secure Office authorization failed.');}
      function utf8Base64Url(value){
        var bytes=new TextEncoder().encode(JSON.stringify(value));
        var binary='';
        for(var index=0;index<bytes.length;index+=32768){binary+=String.fromCharCode.apply(null,bytes.subarray(index,index+32768));}
        return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      }
      function destinationFor(handoff){
        var target=new URL(PWA_BASE);
        target.searchParams.set('handoff','1');
        target.searchParams.set('build',BUILD);
        if(handoff.startup&&handoff.startup.selectedBusinessId)target.searchParams.set('businessId',handoff.startup.selectedBusinessId);
        target.hash='h38='+utf8Base64Url(handoff);
        return target.toString();
      }
      function readyToOpen(target){
        button.href=target;
        button.textContent='Open Business Office';
        button.setAttribute('aria-disabled','false');
        button.dataset.ready='true';
        status.textContent='Authorized. Press Open Business Office to continue in this tab.';
        try{button.focus({preventScroll:true});}catch(error){button.focus();}
      }
      google.script.run.withSuccessHandler(function(handoff){
        if(!handoff||handoff.status!=='PASS'||!handoff.accessToken||!handoff.startup)throw new Error('Google returned an incomplete Office handoff.');
        readyToOpen(destinationFor(handoff));
      }).withFailureHandler(function(error){
        status.textContent='Business Office authorization could not finish.';
        status.className='error';
        button.setAttribute('aria-disabled','false');
        button.textContent='Retry authorization';
        button.href=location.href;
        button.target='_top';
        var detail=document.createElement('p');detail.className='error';detail.textContent=errorText(error);button.insertAdjacentElement('afterend',detail);
      }).cbPwaExecutionHandoff(BUSINESS_ID);
    })();
  </script>
</body>
</html>
